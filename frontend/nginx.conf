server {
    listen 80;
    server_name localhost avecaesar.org www.avecaesar.org;

    # Redirect HTTP to HTTPS (except localhost for local dev)
    if ($host != localhost) {
        return 301 https://$host$request_uri;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    location /api {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name avecaesar.org www.avecaesar.org;

    ssl_certificate /etc/letsencrypt/live/avecaesar.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avecaesar.org/privkey.pem;

    # The test version of the game: one page, password-protected (the password file lives on the server only).
    location = /play { return 301 /play/; }
    location = /play/api/feedback {
        auth_basic "Ave Caesar - test";
        auth_basic_user_file /etc/nginx/play/htpasswd;
        client_max_body_size 16k;
        proxy_pass http://backend:8081/api/play-feedback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /play/ {
        auth_basic "Ave Caesar - test";
        auth_basic_user_file /etc/nginx/play/htpasswd;
        alias /usr/share/nginx/play/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        gzip on;   # the page is one big file: about 5 MB, about 1 MB compressed
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    location /api {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}