}
function shuffleInPlace(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }

// ---------- little soldiers, drawn in code ----------
// Upright figures (feet at x, y) in a slight 2.5D view. Romans: red tunic, big red shield, bronze helmet;
// the plume colour shows the unit (as Polybius says, Roman soldiers wore feathers to look taller).
const LOOKS = {
  hastatus: { tunic: '#a8392f', plume: '#e0a63a', shield: 'scutum', shieldColor: '#8e2b22', trim: '#e0a63a', helmet: '#c9a24a', weapon: 'pilum' },
  princeps: { tunic: '#a8392f', plume: '#4f8fb8', shield: 'scutum', shieldColor: '#8e2b22', trim: '#4f8fb8', helmet: '#c9a24a', weapon: 'sword' },
  triarius: { tunic: '#a8392f', plume: '#e9e1cf', shield: 'scutum', shieldColor: '#8e2b22', trim: '#e9e1cf', helmet: '#c9a24a', weapon: 'spear' },
  centurio: { tunic: '#a8392f', crest: true, shield: 'scutum', shieldColor: '#8e2b22', trim: '#e0a63a', helmet: '#d9d2c0', weapon: 'sword' },
  phalanx: { tunic: '#4d5a6a', shield: 'round', shieldColor: '#b08a3e', trim: '#6b5326', helmet: '#b08a3e', plume: '#1b1715', weapon: 'longspear' },
  warrior: { tunic: '#5b6b4a', shield: 'oval', shieldColor: '#6b4a2b', trim: '#3f2a16', hair: '#5a3a22', weapon: 'axe' },
  archer: { tunic: '#6a7a5a', hair: '#3f2a16', weapon: 'bow' },
  slinger: { tunic: '#7a6a5a', hair: '#3f2a16', weapon: 'sling' },
  cavalry: { tunic: '#4d5a6a', helmet: '#b08a3e', horse: '#7a5636', weapon: 'spear' },
  elephant: { elephant: true },
}
function drawFigure(ctx, x, y, kind, { dir = 1, walk = null, attack = null, scale = 1, fallen = false } = {}) {
  const L = LOOKS[kind] ?? LOOKS.warrior
  ctx.save()
  ctx.translate(x, y)
  if (fallen) { ctx.rotate(dir * Math.PI / 2); ctx.globalAlpha *= 0.55 }
  ctx.scale(scale * dir, scale)
  const ink = '#1b1715'
  if (!fallen) { ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0, 0, L.elephant ? 11 : L.horse ? 7 : 4, L.elephant ? 3.5 : 1.7, 0, 0, Math.PI * 2); ctx.fill() }
  if (L.elephant) {
    const bob = walk != null ? Math.sin(walk) * 0.6 : 0
    ctx.fillStyle = '#7b7f86'; ctx.strokeStyle = '#3b3f46'; ctx.lineWidth = 1
    for (const lx of [-6, -2, 3, 7]) ctx.fillRect(lx - 1.3, -5 + bob, 2.6, 5)
    ctx.beginPath(); ctx.ellipse(0, -9 + bob, 10, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke()
    ctx.beginPath(); ctx.arc(9, -11 + bob, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke()
    ctx.strokeStyle = '#7b7f86'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(12, -10 + bob); ctx.quadraticCurveTo(15, -4, 13 + (attack != null ? Math.sin(attack) * 2 : 0), 0); ctx.stroke()
    ctx.strokeStyle = '#f2ead8'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(11, -8 + bob); ctx.lineTo(14, -6 + bob); ctx.stroke()
    ctx.fillStyle = '#8a6a3a'; ctx.fillRect(-5, -19 + bob, 9, 5); ctx.strokeStyle = ink; ctx.lineWidth = 0.8; ctx.strokeRect(-5, -19 + bob, 9, 5)
    ctx.fillStyle = '#e3b98f'; ctx.beginPath(); ctx.arc(-1, -21 + bob, 1.6, 0, Math.PI * 2); ctx.fill()
    ctx.restore(); return
  }
  const bob = walk != null ? Math.abs(Math.sin(walk)) * -0.8 : 0
  let baseY = 0
  if (L.horse) {
    const s = walk != null ? Math.sin(walk) * 1.4 : 0
    ctx.strokeStyle = '#4a3420'; ctx.lineWidth = 1.2
    for (const [lx, k] of [[-4, 1], [-2, -1], [3, 1], [5, -1]]) { ctx.beginPath(); ctx.moveTo(lx, -4); ctx.lineTo(lx + s * k, 0); ctx.stroke() }
    ctx.fillStyle = L.horse; ctx.beginPath(); ctx.ellipse(0, -5.5 + bob, 6, 2.8, 0, 0, Math.PI * 2); ctx.fill()
    ctx.beginPath(); ctx.ellipse(6, -8 + bob, 2, 1.4, -0.6, 0, Math.PI * 2); ctx.fill()
    baseY = -5
  } else {
    const s = walk != null ? Math.sin(walk) * 1.6 : 0
    ctx.strokeStyle = '#3f2a16'; ctx.lineWidth = 1.2
    ctx.beginPath(); ctx.moveTo(-1.1, -4); ctx.lineTo(-1.1 + s, 0); ctx.moveTo(1.1, -4); ctx.lineTo(1.1 - s, 0); ctx.stroke()
  }
  const by = baseY + bob
  ctx.fillStyle = L.tunic; ctx.beginPath(); ctx.roundRect(-2.6, by - 8.5, 5.2, 5, 1.4); ctx.fill()
  // weapon in the front hand; it swings or thrusts when attacking
  const thrust = attack != null ? Math.max(0, Math.sin(attack)) : 0
  ctx.lineCap = 'round'
  if (L.weapon === 'pilum' || L.weapon === 'spear' || L.weapon === 'longspear') {
    const len = L.weapon === 'longspear' ? 18 : L.weapon === 'spear' ? 14 : 12
    const tilt = 0.25 + thrust * 0.9
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.1
    ctx.beginPath(); ctx.moveTo(2.8, by - 4); ctx.lineTo(2.8 + Math.sin(tilt) * len, by - 4 - Math.cos(tilt) * len); ctx.stroke()
    ctx.strokeStyle = '#cfd4d8'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(2.8 + Math.sin(tilt) * (len - 2.5), by - 4 - Math.cos(tilt) * (len - 2.5)); ctx.lineTo(2.8 + Math.sin(tilt) * len, by - 4 - Math.cos(tilt) * len); ctx.stroke()
  } else if (L.weapon === 'sword' || L.weapon === 'axe') {
    const a = -0.6 + thrust * 1.6
    ctx.strokeStyle = L.weapon === 'axe' ? '#6b4a2b' : '#cfd4d8'; ctx.lineWidth = 1.3
    ctx.beginPath(); ctx.moveTo(2.6, by - 5); ctx.lineTo(2.6 + Math.sin(a) * 5, by - 5 - Math.cos(a) * 5); ctx.stroke()
    if (L.weapon === 'axe') { ctx.fillStyle = '#9aa3aa'; ctx.beginPath(); ctx.arc(2.6 + Math.sin(a) * 5, by - 5 - Math.cos(a) * 5, 1.5, 0, Math.PI * 2); ctx.fill() }
  } else if (L.weapon === 'bow') {
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.arc(1.5, by - 6, 4, -Math.PI / 2.2, Math.PI / 2.2); ctx.stroke()
  } else if (L.weapon === 'sling') {
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 0.9; const a = (attack ?? 0) * 2; ctx.beginPath(); ctx.moveTo(2.4, by - 7); ctx.lineTo(2.4 + Math.cos(a) * 3.5, by - 9 + Math.sin(a) * 3.5); ctx.stroke()
  }
  // head, helmet, plume or crest, hair
  ctx.fillStyle = '#e3b98f'; ctx.beginPath(); ctx.arc(0, by - 10.6, 2, 0, Math.PI * 2); ctx.fill()
  if (L.helmet) { ctx.fillStyle = L.helmet; ctx.beginPath(); ctx.arc(0, by - 11, 2.3, Math.PI, 0); ctx.fill() }
  if (L.hair) { ctx.fillStyle = L.hair; ctx.beginPath(); ctx.arc(-0.4, by - 11.1, 2.2, Math.PI * 0.95, Math.PI * 2.05); ctx.fill() }
  if (L.crest) { ctx.strokeStyle = '#d4392d'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(-3.4, by - 12.5); ctx.lineTo(3.4, by - 12.5); ctx.stroke() }
  else if (L.plume) { ctx.strokeStyle = L.plume; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-0.6, by - 13); ctx.lineTo(-1.4, by - 16); ctx.moveTo(0.6, by - 13); ctx.lineTo(1.2, by - 16); ctx.stroke() }
  // shield on the front of the body
  if (L.shield === 'scutum') { ctx.fillStyle = L.shieldColor; ctx.strokeStyle = L.trim; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.roundRect(-3.6, by - 9.2, 3.8, 7, 1.2); ctx.fill(); ctx.stroke(); ctx.fillStyle = L.trim; ctx.beginPath(); ctx.arc(-1.7, by - 5.7, 0.8, 0, Math.PI * 2); ctx.fill() }
  else if (L.shield === 'round') { ctx.fillStyle = L.shieldColor; ctx.strokeStyle = L.trim; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.arc(-1.8, by - 6, 3.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke() }
  else if (L.shield === 'oval') { ctx.fillStyle = L.shieldColor; ctx.strokeStyle = L.trim; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.ellipse(-1.8, by - 6, 2.4, 3.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke() }
  ctx.restore()
}

// ---------- the chapter battle: Hold the Line, with the army the test earned ----------
function renderBattle() {
  const t = testOf(CH), i = chapterIndex, review = state.reviewScore != null && openAll
  const score = review ? state.reviewScore : pct(t.score)
  if (!levelOf(i) || (!review && !testComplete(t))) return go({ screen: 'home' })   // no battle built yet, or the test isn't done
  window.scrollTo(0, 0)
  app.innerHTML = '<div class="battle-host" id="battle-host"></div>'
  HoldTheLine.mount(app.querySelector('#battle-host'), {
    mode: 'chapter', level: HoldTheLine.LEVELS.indexOf(levelOf(i)), score,
    onExit: r => {
      if (!r.left && !review) {
        t.battles.push({ won: !!r.won, score, attempt: t.attempt, at: new Date().toISOString() })
        if (r.won) { t.won = true; t.stars = Math.max(t.stars ?? 0, r.stars ?? 1) }
        saveTests()
      }
      window.scrollTo(0, 0)
      go({ screen: 'home' })
      if (r.won && !review && CHAPTERS[i + 1]) toast(`<b>Victory at ${esc(battleName(i))}!</b> The next chapter is open: ${esc(CHAPTERS[i + 1].short)}.`, 4500)
    },
  })
}

// ---------- results ----------
function renderResult() {
  const r = state, g = GAMES[r.type], t = testOf(CH), next = nextTestRound(t)
  // What to do next: the next round of the test, then the battle
  const actions = r.completed
    ? `<p class="task"><b>Test complete: ${pct(t.score)}%.</b> Your army: ${armyLine(pct(t.score))}.</p>
       <div class="actions"><button class="primary" id="to-battle">To ${esc(battleOf(chapterIndex))}</button><button class="ghost" id="to-chapter">Back to the chapter</button></div>`
    : !testComplete(t)
      ? `<div class="actions">${next ? `<button class="primary" id="next-round">Next round: ${esc(roundTitle(next))}</button>` : ''}${r.type === 'march' ? '<button class="ghost" id="again">Play again</button>' : ''}<button class="ghost" id="to-chapter">Back to the chapter</button></div>`
      : `<div class="actions"><button class="ghost" id="again">Play again</button><button class="ghost" id="to-chapter">Back to the chapter</button></div>`
  app.innerHTML = `
    ${header(`${g.title}${g.sets.length > 1 ? ' ' + NUMERALS[r.set] : ''} complete`, g.sets[r.set].name)}
    ${testPill(r)}
    <section class="result">
      <div>
        ${starRow(r.earned, 'big-stars')}
        <h2 style="margin-top:10px">${r.earned === 3 ? 'Perfect!' : r.earned === 2 ? 'Well done!' : 'You made it to the end'}</h2>
        <p class="task" style="margin-top:4px">${esc(r.note ?? (r.mistakes === 0 ? 'No mistakes.' : `${plural(r.mistakes, 'mistake')}. Three stars need a clean run.`))}</p>
      </div>
      ${actions}
      ${r.reviewSecs?.length ? `<div class="review">
        <h3>${r.earned === 1 ? 'Review these sections, then try again' : 'Learn from your mistakes'}</h3>
        <p class="task">These mistakes count in your chapter test. Re-read the sections before the battle.</p>
        <div class="review-links">${r.reviewSecs.map(id => `<button data-read="${id}">${esc(CHAPTER.find(s => s.id === id)?.title ?? id)}</button>`).join('')}${CH.keyFacts ? '<button class="key-facts-r">Key facts</button>' : ''}</div>
      </div>` : ''}
      ${r.recapHtml}
      <div class="feedback" id="fb">
        <h3>How was this round?</h3>
        ${r.feedbackSent ? '<p class="sent">Thanks! Your feedback was saved.</p>' : `
        <div class="chips" role="group" aria-label="Pick any that apply">
          ${['Fun', 'Too easy', 'Too hard', 'Confusing', 'Boring', 'Learned something'].map(c => `<button type="button" aria-pressed="false" data-chip="${c}">${c}</button>`).join('')}
        </div>
        <textarea id="fb-text" placeholder="Anything else? (optional)" maxlength="1000"></textarea>
        <div><button class="ghost" id="fb-send">${fb.db ? 'Send feedback' : 'Copy feedback'}</button></div>
        <p class="task" id="fb-help" ${fb.db ? 'hidden' : ''}>This copies your answers so you can paste them in a message to whoever sent you this game.</p>`}
      </div>
    </section>`
  bindBack()
  app.querySelector('#again')?.addEventListener('click', () => startGame(r.type, r.set))
  app.querySelector('.key-facts-r')?.addEventListener('click', () => openKeyFacts())
  app.querySelectorAll('[data-chip]').forEach(c => c.addEventListener('click', () => c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') === 'true' ? 'false' : 'true')))
  app.querySelector('#fb-send')?.addEventListener('click', async e => {
    const tags = [...app.querySelectorAll('[data-chip][aria-pressed="true"]')].map(c => c.dataset.chip)
    const comment = app.querySelector('#fb-text').value.trim()
    if (!tags.length && !comment) return toast('Pick a word or write a comment first.')
    const entry = { game: GAMES[r.type].title, set: GAMES[r.type].sets[r.set].name, stars: r.earned, mistakes: r.mistakes, tags, comment, inTest: TEST_TYPES.includes(r.type), at: new Date().toISOString() }
    if (fb.db) {
      e.target.disabled = true
      try {
        await fb.db.collection(`feedback/${fb.uid}/rounds`).add(entry)
        r.feedbackSent = true
        return renderResult()
      } catch {
        // This viewer can't save to the page (e.g. outside the owner's organization): fall back to copying
        fb.db = null
        e.target.disabled = false
        e.target.textContent = 'Copy feedback'
        app.querySelector('#fb-help').hidden = false
      }
    }
    const text = `Ave Caesar feedback: ${entry.game} · ${entry.set}: ${entry.stars}/3 stars, ${plural(entry.mistakes, 'mistake')}.` +
      (tags.length ? ` ${tags.join(', ')}.` : '') + (comment ? ` "${comment}"` : '')
    try {
      await navigator.clipboard.writeText(text)
      toast('<b>Copied!</b> Paste it in a message to whoever sent you this game.')
    } catch {
      const ta = app.querySelector('#fb-text')
      ta.value = text; ta.focus(); ta.select()
      toast('Select-all is done: copy the text in the box and send it.')
    }
  })
  app.querySelector('#next-round')?.addEventListener('click', () => startGame(next.type, next.set))
  app.querySelector('#to-battle')?.addEventListener('click', () => { window.scrollTo(0, 0); go({ screen: 'battle' }) })
  app.querySelector('#to-chapter')?.addEventListener('click', () => { window.scrollTo(0, 0); go({ screen: 'home' }) })
}
function renderRunDone() {
  const t = testOf(CH), score = pct(t.score)
  if (!testComplete(t)) { run = null; return go({ screen: 'home' }) }
  app.innerHTML = `
    ${header('Chapter test complete', CH.short)}
    <section class="result">
      <div>
        <p class="big-stars" style="margin:0">${score}%</p>
        <h2 style="margin-top:10px">${score >= 90 ? 'Excellent!' : score >= 80 ? 'Well done.' : score >= 70 ? 'You passed, just.' : 'A weak result.'}</h2>
        <p class="task" style="margin-top:4px">Your army for ${esc(battleOf(chapterIndex))}: ${armyLine(score)}. ${verdictFor(score)}</p>
      </div>
      ${score < 90 && rereadHtml(t) ? `<div class="review"><h3>Where your mistakes came from</h3>${rereadHtml(t)}</div>` : ''}
      <div class="actions"><button class="primary" id="to-battle">To battle</button><button class="ghost" id="menu">Back to the chapter</button></div>
    </section>`
  bindBack()
  app.querySelector('#to-battle').addEventListener('click', () => { run = null; go({ screen: 'battle' }) })
  app.querySelector('#menu').addEventListener('click', () => { run = null; go({ screen: 'home' }) })
}

// Keep a game in progress across page updates
window.claude?.hot?.snapshot?.(() => ({ state, run, chapterIndex }))
const boot = data => {
  if (Number.isInteger(data?.chapterIndex)) loadChapter(data.chapterIndex)
  const saved = data?.state
  if (saved?.screen && saved.screen !== 'home' && (!saved.type || GAMES[saved.type])) { state = saved; run = data.run ?? null }
  try { render() } catch { state = { screen: 'home' }; run = null; render() }
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {})
</script>
