t was it?","options":["A Greek city on the Bay of Naples","Rome's key to Etruria","The capital of the Pentri, the largest Samnite tribe","The site of the Samnites' sacred oath","A Roman ally in Apulia","The chief city of the Sidicini"],"a":2,"level":3,"why":"Bovianum was the capital of the Pentri, the largest Samnite tribe. The year after its fall, the Samnites sued for peace and the old treaty was restored.","sec":"second-war-turning"},{"q":"At the battle of Telamon in 225 BC, how many Romans and allies did Polybius count?","options":["About 100,000 Romans and 110,000 allies","About 41,000 Romans and 21,000 allies","About 21,000 Romans and 41,000 allies","About 41,000 Romans and 210,000 allies","About 40,000 Romans and 40,000 allies","About 210,000 Romans and 41,000 allies"],"a":3,"level":3,"why":"Polybius counted roughly 41,000 Romans alongside 210,000 allies, showing how far allied troops outnumbered Romans. This manpower carried Rome to victory over Pyrrhus and Carthage.","sec":"roman-alliance-system"},{"q":"Where did Valerius capture the Samnite camp and scatter their foragers in Rome's third victory of 343 BC?","options":["Cales","Mount Gaurus","Lautulae","Suessula","Capua","Cumae"],"a":3,"level":3,"why":"Valerius rushed to Suessula, a town on Campania's eastern edge, for the third victory. Afterwards both consuls celebrated triumphs.","sec":"first-war-campaigns"},{"q":"According to Livy, on what grounds did the Roman Senate refuse to honour the Caudine Forks agreement?","options":["The people had never approved it","Gaius Pontius had no right to make treaties","The fetials had not sworn the oath","The Samnites had broken the truce first","The consuls had been tricked by a false rumour","The agreement had been made outside Roman territory"],"a":0,"level":3,"why":"The Senate argued that the Roman people had never approved the agreement, so the war resumed. Some historians think the truce of the following years actually came from the Caudine agreement.","sec":"caudine-forks"},{"q":"How did the Romans finally get into Naples in 326 BC?","options":["Neapolis rose against Paleopolis and expelled it","They stormed Paleopolis after a long siege","A deserter showed them a hidden gate","Two leading Neapolitans, fed up with the Samnite garrison, let them in","The Campanians from Capua opened the walls","The Samnite garrison surrendered the city for gold"],"a":3,"level":3,"why":"Two leading Neapolitans, tired of the unruly Samnite garrison, let the Romans in. The Second, or Great, Samnite War that began there lasted until 304 BC.","sec":"second-war-outbreak"},{"q":"Decius' hilltop rescue of 343 BC closely resembles a famous episode from which year, and may be borrowed from it?","options":["258 BC","225 BC","211 BC","295 BC","310 BC","321 BC"],"a":0,"level":3,"why":"The rescue looks very like a famous episode of 258 BC, so it may be a later borrowing. The other battles of the First Samnite War are doubted too.","sec":"doubting-livy"},{"q":"In Livy's account, how did Samnite leaders respond when Roman envoys asked them to spare Campania?","options":["They sent envoys of their own to the Senate","They demanded Rome surrender the Sidicini","They appealed to the Etruscans for help","They executed the Roman envoys on the spot","They offered to share Campania with Rome","They ordered their armies into Campania within earshot"],"a":5,"level":3,"why":"The Samnite leaders defiantly ordered their armies into Campania within earshot of the Roman envoys. Modern historians doubt that this defiant Samnite assembly rests on any genuine record.","sec":"first-war-outbreak"}]},"chronicleMaps":[],"keyFacts":null},{"id":"final-conquest-of-italy","era":"early-republic","short":"Conquest of Italy","title":"Final Conquest of Italy","period":"290-264 BC","sources":["Pyrrhic War","Roman expansion in Italy","Lex Hortensia"],"briefing":{"title":"Italy, 290 BC","paragraphs":["In 290 BC Rome has just won its third war against the Samnites, tough mountain tribes of the Apennines, and now dominates central Italy. At home, though, the city is still divided: ordinary citizens, the plebeians, are locked in a two-century struggle for equal rights with the patricians, a small hereditary elite.","To the south lie the rich Greek cities of Magna Graecia, led by proud Tarentum. When Rome pushes into their world, Tarentum calls in Pyrrhus, a famous Greek king. Can Rome beat him and become master of all Italy?"]},"sections":[{"id":"rome-after-the-samnite-wars","title":"Rome After the Samnite Wars","body":"By 290 BC, Rome had fought its way to the top of central Italy. Its toughest rivals had been the Samnites, a warlike coalition of tribes from the Apennine mountains. Over three Samnite Wars (343–341, 326–304 and 298–290 BC), the two sides traded victories and heavy losses.\n\nThe turning point came in 295 BC at Sentinum, a town in Umbria in north-central Italy. There the Romans faced a mixed alliance of Samnites, Gauls, Etruscans and Umbrians. The Gauls were Celtic warriors from the north, and the Etruscans were Rome's old neighbours in Etruria, the region just north of the city. When Rome beat even this combined army, it became clear that nobody could stop it from dominating Italy.\n\nRome tightened its hold with concrete measures. It founded colonies, which were settlements of loyal citizens planted on conquered land. It also built the Appian Way, a great road running south from Rome toward Capua, which carried armies and influence deep into the south.\n\nIn 282 BC, a battle at Populonia, an Etruscan town on the coast, ended the last traces of Etruscan power in the region. Yet the far south of Italy, with its wealthy Greek cities, still lay beyond Rome's control."},{"id":"lex-hortensia","title":"The Hortensian Law of 287 BC","body":"While Rome was winning wars abroad, it was also settling a long quarrel at home. For two centuries, Roman society had been split between the patricians, a small hereditary elite, and the plebeians, the mass of ordinary citizens. Historians call this struggle the Conflict of the Orders.\n\nThe plebeians had a powerful weapon: the secession. They would simply walk out of the city in protest, leaving Rome without workers or soldiers. According to tradition, around 287 BC they did this one more time, gathering on the Janiculum, a hill across the River Tiber.\n\nTo end the crisis, Rome appointed Quintus Hortensius as dictator. In Rome this was a temporary emergency office, not a tyrant, and Hortensius was himself a plebeian. His law, the lex Hortensia, made every decision of the Plebeian Council binding on all citizens, patricians included.\n\nEarlier laws in 449 and 339 BC had moved in this direction. However, they still needed the Senate, Rome's council of elders and ex-officials, to approve plebeian decisions. The new law removed that requirement entirely.\n\nIn theory, patricians and plebeians now had equal political rights. The law made the people and their elected champions, the tribunes, major players in Roman politics, and it brought the Conflict of the Orders to a close."},{"id":"why-the-plebs-seceded","title":"Why Did the Plebeians Walk Out?","body":"Ancient accounts of the last plebeian secession are not fully trusted today. The Roman tradition, preserved in yearly chronicles and by the historian Livy, blamed debt. In this version, angry city crowds in the Forum, Rome's central square, revolted when called up to fight the Lucanians, a people of southern Italy. Rome needed soldiers, so the protesters had leverage.\n\nModern historians doubt this picture. Large masses of urban poor probably did not exist in Rome at this time. Voting in the Plebeian Council was also organised by tribal districts, never more than 35. Rural landowners controlled 29 of them, so they, not city crowds, held most of the power.\n\nA likelier explanation, scholars argue, is land. The Third Samnite War had won Rome large tracts of public land, and rural plebeians wanted a say in how it was handed out.\n\nStill, the harsh measures taken by Rome's top officials, the consuls, suggest there was real unrest in the city too. With both town and countryside demanding change, and the army needing men, reform became unavoidable. Such a well-crafted law probably also needed organisers, most likely the plebeian tribunes. The law did contain one oddity: it banned votes on market days, which made it harder for country farmers to vote when they came to town."},{"id":"tarentum-calls-for-help","title":"Tarentum and the Road to War","body":"Southern Italy was home to Magna Graecia, or Great Greece, a string of rich Greek cities founded by colonists centuries earlier. As Rome pushed south after defeating the Samnites, it began making alliances with some of these cities.\n\nOne ally was Thurii, a Greek city on the Gulf of Taranto. When Thurii came under attack from a Samnite-led alliance, Rome stepped in to help. This alarmed Tarentum, the most powerful Greek city in the south, which stood on the instep of Italy's boot and wanted no Roman meddling in its backyard.\n\nTarentum struck first. It attacked a Roman fleet sailing in its waters, which an earlier treaty had forbidden. It then marched on Thurii and threw out the city's pro-Roman government.\n\nRome sent an ultimatum, which the Tarentines rejected in early 281 BC, and war followed. Tarentum knew its own army could not match Rome's in open battle. So it looked abroad for a champion and found one in Pyrrhus, king of Epirus, a Greek kingdom in what is now north-western Greece and Albania. Pyrrhus landed at Tarentum with his troops in the winter of 281/280 BC. It was the first major clash between Rome and one of the great Greek kingdoms that had arisen after Alexander the Great."},{"id":"heraclea-and-asculum","title":"Heraclea, Asculum and the Pyrrhic Victory","body":"Pyrrhus of Epirus was one of the most famous generals of his age, and at first he lived up to his reputation. In 280 BC he defeated the Romans at Heraclea in Lucania, a region of southern Italy. Some of Rome's allies promptly switched sides.\n\nPyrrhus then marched quickly north into Latium, Rome's home region, hoping to link up with the Etruscans, who were still fighting Rome. But the Romans won their war in Etruria, and Pyrrhus pulled back to spend the winter in the south.\n\nThe Romans refused to talk peace. In 279 BC they met Pyrrhus again at Asculum, in south-eastern Italy, and once more they lost. Yet Pyrrhus's own army had suffered terribly. According to ancient tradition, he exclaimed after the battle: \"Another such victory and we are lost!\"\n\nThat remark gave the English language a lasting phrase. A \"Pyrrhic victory\" is a win that costs the victor so much that it is almost a defeat.\n\nFor the moment, though, Pyrrhus had driven the Romans out of southern Italy. Rather than press on against Rome, he turned his attention to a new prize across the water: the island of Sicily."},{"id":"pyrrhus-in-sicily","title":"Pyrrhus in Sicily","body":"After his costly victories over Rome, Pyrrhus of Epirus crossed to Sicily. He came to help Syracuse, the leading Greek city on the island, in its struggle against Carthage. Carthage was a wealthy trading city in North Africa, in modern Tunisia, which controlled much of western Sicily. By now Pyrrhus's goals had grown far beyond rescuing Tarentum. He aimed to dominate both southern Italy and Sicily.\n\nAt first the campaign went well, and Pyrrhus won over much of the island. But he could not capture Lilybaeum, Carthage's great fortress on Sicily's western tip. The city could be supplied by sea, and Pyrrhus lacked the naval strength to cut it off. The war there ground to a stalemate.\n\nMeanwhile, his Sicilian supporters were growing tired of paying for the war. Back in Italy, Rome had gone on the attack again between 279 and 276 BC, pressing the Greek cities and their allies.\n\nWhen Tarentum sent a fresh plea for help, Pyrrhus agreed to return. He crossed back to southern Italy in early 276 BC, suffering some losses on the way. His Sicilian adventure had brought him nothing lasting."},{"id":"beneventum-and-withdrawal","title":"Beneventum and the End of Pyrrhus's War","body":"In 275 BC, Pyrrhus of Epirus faced the Romans one last time, at Beneventum, a town in the Samnite hill country of southern Italy. The outcome is described differently: some accounts call it a Roman victory, others a draw. Either way, it forced Pyrrhus onto the defensive.\n\nThe king now saw that the war in Italy could not be won. In the winter of 275/274 BC he sailed home to Epirus, leaving only a small garrison of his soldiers in Tarentum.\n\nHis campaign had briefly revived the hopes of Rome's enemies in the south. These included the Samnites, the Lucanians, the Bruttians of Italy's toe, and the Italian Greeks. But their gains did not last.\n\nIn 272 BC, about two years after Pyrrhus left, Tarentum fell to Rome. The Epirote garrison was allowed to go home in peace. That same year Pyrrhus himself was killed while fighting a different war at Argos, a city in southern Greece.\n\nRome's victory over a famous Greek king hugely boosted its standing across the Mediterranean world. Its control of the Italian peninsula would not be seriously challenged again until Hannibal invaded at the end of the century."},{"id":"how-rome-ruled-italy","title":"How Rome Held Italy Together","body":"With Pyrrhus gone, Rome moved quickly to take over southern Italy. Instead of ruling the Greek cities of Magna Graecia directly, it bound most of them through treaties. This gave Rome a kind of indirect control.\n\nThe burden on these Greek cities seems to have been light. Even at the start of Rome's next great war in 264 BC, the only recorded help was a fleet of transport ships borrowed from Naples, Tarentum and Locri, a Greek city on Italy's toe. Apart from Roman garrisons in many cities, Rome's grip in the south remained loose for decades.\n\nAcross Italy, Rome used several tools to absorb conquered peoples. It confiscated land and planted colonies on it. It granted some communities full Roman citizenship, and others a partial version without the right to vote. It also made military alliances with states that stayed independent in name but had to supply soldiers.\n\nThis system turned Italy into a vast reservoir of fighting men, larger than that of any other state of the time."},{"id":"italy-united-264-bc","title":"Italy Conquered: 264 BC","body":"The final pieces of Rome's conquest of Italy fell into place in the 260s BC. The last resistance in Etruria, the old Etruscan heartland north of Rome, was crushed in 265–264 BC.\n\nIn 264 BC, the same year, Rome went to war with Carthage, the North African trading power that had once been its ally. This conflict, the First Punic War, lasted until 241 BC. It took Roman armies outside the Italian peninsula for the first time, beginning with the fight for Sicily. Rome's attention had turned south and across the sea partly because the Alps blocked the way north, and because Rome was not yet ready to take on the Gauls who lived beneath them.\n\nIn barely a quarter of a century, Rome had changed enormously. It had settled its long internal struggle between patricians and plebeians. It had defeated the Samnites and their allies. And it had driven off Pyrrhus, a famous Greek king.\n\nRome entered 264 BC as the undisputed master of peninsular Italy, with a fearsome military reputation and an enormous supply of soldiers. The stage was set for its rise from an Italian power to a Mediterranean one."}],"battle":{"name":"Beneventum","year":"275 BC","enemy":"Pyrrhus of Epirus","sec":"beneventum-and-withdrawal","intro":"Pyrrhus, the Greek king who has beaten Rome twice at a terrible cost, faces the Romans one last time at Beneventum. Ancient accounts disagree on how it ended. Today, the outcome is up to you."},"timelines":[{"name":"The Big Moments","blurb":"Four turning points on Rome's road to ruling Italy.","events":[{"label":"Rome beats a grand alliance at Sentinum","when":"295 BC","y":-295,"fact":"At Sentinum in Umbria, Rome defeated Samnites, Gauls, Etruscans and Umbrians together, showing no one could stop it dominating Italy.","sec":"rome-after-the-samnite-wars"},{"label":"Lex Hortensia binds all citizens","when":"Around 287 BC","y":-287,"fact":"The plebeian dictator Quintus Hortensius made Plebeian Council decisions binding on everyone, ending the Conflict of the Orders.","sec":"lex-hortensia"},{"label":"Pyrrhus defeats Rome at Heraclea","when":"280 BC","y":-280,"fact":"Pyrrhus, king of Epirus, won his first battle against Rome in Lucania, and some Roman allies switched sides.","sec":"heraclea-and-asculum"},{"label":"First Punic War begins","when":"264 BC","y":-264,"fact":"Rome's war with Carthage, the North African trading power, took Roman armies outside Italy for the first time.","sec":"italy-united-264-bc"}]},{"name":"Wars of Conquest","blurb":"From the Samnite Wars to the war with Carthage.","events":[{"label":"First Samnite War begins","when":"343 BC","y":-343,"fact":"The first of three Samnite Wars opened Rome's long struggle with the warlike tribes of the Apennines.","sec":"rome-after-the-samnite-wars"},{"label":"Battle at Populonia","when":"282 BC","y":-282,"fact":"This battle at an Etruscan coastal town ended the last traces of Etruscan power in the region.","sec":"rome-after-the-samnite-wars"},{"label":"Pyrrhus wins again at Asculum","when":"279 BC","y":-279,"fact":"Pyrrhus beat Rome a second time, but his losses were so heavy that a costly win is still called a 'Pyrrhic victory'.","sec":"heraclea-and-asculum"},{"label":"Rome meets Pyrrhus at Beneventum","when":"275 BC","y":-275,"fact":"Some accounts call this battle in Samnite hill country a Roman victory, others a draw, but it forced Pyrrhus onto the defensive.","sec":"beneventum-and-withdrawal"},{"label":"Tarentum falls to Rome","when":"272 BC","y":-272,"fact":"About two years after Pyrrhus left, Tarentum surrendered and his garrison was allowed to go home in peace.","sec":"beneventum-and-withdrawal"},{"label":"First Punic War ends","when":"241 BC","y":-241,"fact":"Rome's first war with Carthage, which began with the fight for Sicily, lasted from 264 to 241 BC.","sec":"italy-united-264-bc"}]},{"name":"The Full Story","blurb":"Laws, wars and a king's adventure, in order.","events":[{"label":"Law still needing the Senate's approval","when":"339 BC","y":-339,"fact":"This earlier law strengthened plebeian decisions but still required approval by the Senate, Rome's council of elders.","sec":"lex-hortensia"},{"label":"Second Samnite War begins","when":"326 BC","y":-326,"fact":"The second of the three Samnite Wars lasted until 304 BC, with both sides trading victories and heavy losses.","sec":"rome-after-the-samnite-wars"},{"label":"Third Samnite War ends","when":"290 BC","y":-290,"fact":"By the end of this war Rome had fought its way to the top of central Italy and won large tracts of public land.","sec":"rome-after-the-samnite-wars"},{"label":"Tarentum rejects Rome's ultimatum","when":"Early 281 BC","y":-281,"fact":"After Tarentum attacked a Roman fleet and expelled Thurii's pro-Roman government, its refusal of Rome's demands meant war.","sec":"tarentum-calls-for-help"},{"label":"Pyrrhus returns from Sicily","when":"Early 276 BC","y":-276,"fact":"Answering a new plea from Tarentum, Pyrrhus crossed back to Italy, suffering losses on the way.","sec":"pyrrhus-in-sicily"},{"label":"Pyrrhus sails home to Epirus","when":"Winter 275/274 BC","y":-274,"fact":"Seeing the war in Italy could not be won, Pyrrhus went home, leaving only a small garrison in Tarentum.","sec":"beneventum-and-withdrawal"},{"label":"Pyrrhus killed at Argos","when":"272 BC","y":-272,"fact":"The king died fighting a different war at Argos, a city in southern Greece, the same year Tarentum fell.","sec":"beneventum-and-withdrawal"},{"label":"Last Etruscan resistance crushed","when":"265 BC","y":-265,"fact":"The final resistance in Etruria, the old Etruscan heartland north of Rome, was crushed in 265–264 BC.","sec":"italy-united-264-bc"}]}],"matches":[{"name":"Who's Who","blurb":"Match the people and peoples to their role in the story.","pairs":[["Quintus Hortensius","Plebeian dictator whose law bound all citizens to plebeian votes"],["Pyrrhus","King of Epirus who beat Rome at Heraclea and Asculum"],["Livy","Roman historian whose account blamed the last secession on debt"],["Hannibal","Invader who next seriously challenged Rome's hold on Italy"],["Samnites","Apennine tribal coalition Rome fought in three wars"]],"secs":["lex-hortensia","heraclea-and-asculum","why-the-plebs-seceded","beneventum-and-withdrawal","rome-after-the-samnite-wars"]},{"name":"Words and Places","blurb":"Match each term or place to its meaning.","pairs":[["Secession","Plebeian protest of walking out, leaving Rome without workers"],["Pyrrhic victory","A win so costly that it is almost a defeat"],["Colony","Settlement of loyal citizens planted on conquered land"],["Magna Graecia","'Great Greece': the rich Greek cities of southern Italy"],["Lilybaeum","Carthage's fortress on Sicily's western tip that Pyrrhus never took"]],"secs":["lex-hortensia","heraclea-and-asculum","rome-after-the-samnite-wars","tarentum-calls-for-help","pyrrhus-in-sicily"]}],"decks":[{"name":"Rome at Home and at War","blurb":"Samnites, secessions and a landmark law.","cards":[{"claim":"At Sentinum, Rome defeated an alliance of Samnites, Gauls, Etruscans and Umbrians.","answer":true,"why":"In 295 BC Rome beat this combined army in Umbria, making clear nobody could stop it dominating Italy.","sec":"rome-after-the-samnite-wars"},{"claim":"The Appian Way ran north from Rome into Etruria.","answer":false,"why":"The Appian Way ran south from Rome toward Capua, carrying armies and influence deep into the south.","sec":"rome-after-the-samnite-wars"},{"claim":"Quintus Hortensius, the dictator appointed to end the last secession, was a patrician.","answer":false,"why":"Hortensius was himself a plebeian, holding the dictatorship as a temporary emergency office.","sec":"lex-hortensia"},{"claim":"The lex Hortensia made Plebeian Council decisions binding without the Senate's approval.","answer":true,"why":"Earlier laws of 449 and 339 BC still needed Senate approval; the Hortensian law removed that requirement entirely.","sec":"lex-hortensia"},{"claim":"Rural landowners controlled 29 of the tribal voting districts in the Plebeian Council.","answer":true,"why":"Voting was organised by tribal districts, never more than 35, and rural landowners controlled 29 of them.","sec":"why-the-plebs-seceded"},{"claim":"The Roman tradition preserved by Livy blamed the last secession on a dispute over land.","answer":false,"why":"The tradition blamed debt. Land is the explanation favoured by modern scholars.","sec":"why-the-plebs-seceded"},{"claim":"The Hortensian law banned votes on market days.","answer":true,"why":"This oddity made it harder for country farmers to vote when they came to town.","sec":"why-the-plebs-seceded"},{"claim":"The battle at Populonia in 282 BC ended the last traces of Samnite power.","answer":false,"why":"Populonia was an Etruscan coastal town, and the battle ended the last traces of Etruscan power in the region.","sec":"rome-after-the-samnite-wars"}]},{"name":"Pyrrhus and the Conquest of the South","blurb":"A Greek king, a costly war and a united Italy.","cards":[{"claim":"Tarentum attacked a Roman fleet in its waters, which an earlier treaty had forbidden.","answer":true,"why":"Tarentum struck first against the fleet, then marched on Thurii and threw out its pro-Roman government.","sec":"tarentum-calls-for-help"},{"claim":"Pyrrhus, the king Tarentum called in, ruled Macedon.","answer":false,"why":"Pyrrhus was king of Epirus, a Greek kingdom in what is now north-western Greece and Albania.","sec":"tarentum-calls-for-help"},{"claim":"Pyrrhus defeated the Romans at Heraclea in Lucania in 280 BC.","answer":true,"why":"It was his first victory over Rome, and some of Rome's allies promptly switched sides.","sec":"heraclea-and-asculum"},{"claim":"In Sicily, Pyrrhus fought on the side of Carthage against Syracuse.","answer":false,"why":"He came to help Syracuse, the leading Greek city on the island, against Carthage.","sec":"pyrrhus-in-sicily"},{"claim":"Pyrrhus could not capture Lilybaeum because it could be supplied by sea.","answer":true,"why":"Pyrrhus lacked the naval strength to cut off Carthage's fortress, and the war ground to a stalemate.","sec":"pyrrhus-in-sicily"},{"claim":"When Tarentum fell in 272 BC, Pyrrhus's garrison there was massacred.","answer":false,"why":"The Epirote garrison was allowed to go home in peace.","sec":"beneventum-and-withdrawal"},{"claim":"In 264 BC the only recorded help from the southern Greek cities was transport ships from Naples, Tarentum and Locri.","answer":true,"why":"Rome bound these cities by treaties, and the burden on them seems to have been light.","sec":"how-rome-ruled-italy"},{"claim":"Rome turned south in 264 BC partly because it had already conquered the Gauls beneath the Alps.","answer":false,"why":"Rome was not yet ready to take on the Gauls, and the Alps blocked the way north.","sec":"italy-united-264-bc"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Samnites","Lucanians","Gauls","Umbrians"],"odd":1,"why":"Samnites, Gauls and Umbrians (with the Etruscans) fought Rome together at Sentinum in 295 BC; the Lucanians were not part of that alliance.","sec":"rome-after-the-samnite-wars"},{"items":["Planting colonies","Partial citizenship","Military alliances","Direct rule of Greek cities"],"odd":3,"why":"Colonies, citizenship with or without the vote, and alliances were Rome's tools for absorbing Italy; it bound the Greek cities by treaties instead of ruling them directly.","sec":"how-rome-ruled-italy"},{"items":["Carthaginians","Samnites","Lucanians","Bruttians"],"odd":0,"why":"Pyrrhus's campaign revived the hopes of the Samnites, Lucanians and Bruttians against Rome; the Carthaginians were his enemies in Sicily.","sec":"beneventum-and-withdrawal"},{"items":["Debt","Forum crowds","Dispute over public land","Lucanian call-up"],"odd":2,"why":"The Roman tradition explained the last secession with debt and Forum crowds revolting against a call-up to fight the Lucanians; land is the modern scholars' explanation.","sec":"why-the-plebs-seceded"},{"items":["Binding on all citizens","Passed by a patrician dictator","No Senate approval needed","No votes on market days"],"odd":1,"why":"Three are features of the Hortensian law; the dictator Quintus Hortensius was a plebeian, not a patrician.","sec":"lex-hortensia"},{"items":["Settled patrician-plebeian strife","Defeated the Samnites","Conquered the Alpine Gauls","Drove off Pyrrhus"],"odd":2,"why":"Three are Rome's achievements in this quarter century; Rome was not yet ready to take on the Gauls living beneath the Alps.","sec":"italy-united-264-bc"}]}],"whos":[{"name":"Faces of the Age","blurb":"A king, a reformer and a historian.","people":[{"name":"Pyrrhus","options":["Pyrrhus","Antigonus II Gonatas","Seleucus I Nicator","Agathocles"],"clues":["After my first victory, some of Rome's allies switched to my side.","I marched north into Latium hoping to join the Etruscans, but pulled back to winter in the south.","Tarentum invited me to fight Rome, and I landed there in the winter of 281/280 BC.","After my costly win at Asculum I said: 'Another such victory and we are lost!'"],"sec":"heraclea-and-asculum"},{"name":"Quintus Hortensius","options":["Quintus Hortensius","Appius Claudius Caecus","Manius Curius Dentatus","Gaius Fabricius Luscinus"],"clues":["My law contained one oddity: it banned votes on market days.","Earlier laws of 449 and 339 BC still needed the Senate's approval; mine removed that requirement.","I was a plebeian appointed dictator, a temporary emergency office, to end a walkout.","My law made every decision of the Plebeian Council binding on all citizens, patricians included."],"sec":"lex-hortensia"},{"name":"Livy","options":["Livy","Polybius","Plutarch","Dionysius of Halicarnassus"],"clues":["Modern historians doubt my picture of the last plebeian walkout.","In my version, the protesters had leverage because Rome needed soldiers.","I described angry city crowds in the Forum revolting when called up to fight the Lucanians.","I am the Roman historian who preserved the tradition that debt caused the last secession."],"sec":"why-the-plebs-seceded"}]},{"name":"Turning Points","blurb":"Men who changed the course of Rome's story.","people":[{"name":"Pyrrhus","options":["Pyrrhus","Antigonus II Gonatas","Ptolemy II Philadelphus","Seleucus I Nicator"],"clues":["My Sicilian supporters grew tired of paying for my war.","I could not capture Lilybaeum, because I lacked the ships to cut it off.","After Beneventum I sailed home to Epirus, leaving a small garrison in Tarentum.","I was killed in 272 BC while fighting a war at Argos in southern Greece."],"sec":"pyrrhus-in-sicily"},{"name":"Quintus Hortensius","options":["Quintus Hortensius","Appius Claudius Caecus","Manius Curius Dentatus","Publius Valerius Laevinus"],"clues":["My reform made the tribunes, the people's elected champions, major players in politics.","I was appointed when the plebeians gathered on the Janiculum, a hill across the Tiber.","After my law, patricians and plebeians in theory had equal political rights.","The law named after me, passed around 287 BC, ended the Conflict of the Orders."],"sec":"lex-hortensia"},{"name":"Hannibal","options":["Hannibal","Hanno the Great","Hamilcar Barca","Xanthippus"],"clues":["After Pyrrhus left, decades passed before anyone seriously threatened Rome's grip on Italy again.","When I came, Rome's control of the peninsula faced its next serious challenge.","My arrival ended Rome's long spell of unchallenged rule over Italy.","I invaded Italy at the end of the 3rd century BC."],"sec":"beneventum-and-withdrawal"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Sentinum","lat":43.41848889,"lon":12.85225,"why":"In 295 BC Rome defeated the combined Samnites, Gauls, Etruscans and Umbrians at this Umbrian town, the turning point of the Samnite Wars.","sec":"rome-after-the-samnite-wars"},{"name":"Populonia","lat":42.98944444,"lon":10.49138889,"why":"A battle at this Etruscan coastal town in 282 BC ended the last traces of Etruscan power in the region.","sec":"rome-after-the-samnite-wars"},{"name":"Tarentum","lat":40.47111111,"lon":17.24305556,"why":"The most powerful Greek city in the south called in Pyrrhus against Rome and finally fell to Rome in 272 BC.","sec":"tarentum-calls-for-help"},{"name":"Heraclea","lat":40.22,"lon":16.66972222,"why":"Pyrrhus won his first victory over the Romans here in Lucania in 280 BC.","sec":"heraclea-and-asculum"},{"name":"Asculum","lat":41.21555556,"lon":15.55777778,"why":"Pyrrhus beat Rome again here in 279 BC at such a cost that it gave us the phrase 'Pyrrhic victory'.","sec":"heraclea-and-asculum"},{"name":"Beneventum","lat":41.13333333,"lon":14.78333333,"why":"Pyrrhus's last battle against Rome, in 275 BC, forced him onto the defensive and led to his departure from Italy.","sec":"beneventum-and-withdrawal"}]}],"quizPool":{"1":[{"q":"What was new about the First Punic War for Rome's armies?","options":["It was their first war against a Greek king","It was the first war fought by plebeians","It took them outside Italy for the first time","It was their first fight against the Gauls"],"a":2,"level":1,"why":"The First Punic War took Roman armies beyond the Italian peninsula for the first time. It began with the fight for Sicily.","sec":"italy-united-264-bc"},{"q":"Which foreign king did Tarentum call on as its champion against Rome?","options":["Pyrrhus of Epirus","Philip of Macedon","Hannibal of Carthage","Agathocles of Syracuse"],"a":0,"level":1,"why":"Knowing its army could not match Rome's, Tarentum turned to Pyrrhus, king of Epirus in north-western Greece and Albania. He landed at Tarentum in the winter of 281/280 BC.","sec":"tarentum-calls-for-help"},{"q":"Who was appointed dictator to end the crisis of the last plebeian secession?","options":["Manius Curius","Appius Claudius","Quintus Hortensius","Publius Decius Mus"],"a":2,"level":1,"why":"Quintus Hortensius was named dictator, a temporary emergency office in Rome. He was himself a plebeian.","sec":"lex-hortensia"},{"q":"Pyrrhus crossed to Sicily to help Syracuse in its struggle against which power?","options":["Egypt","Carthage","Macedon","Rome"],"a":1,"level":1,"why":"Syracuse, the leading Greek city on Sicily, was fighting Carthage, which controlled much of western Sicily. Carthage was a wealthy trading city in North Africa.","sec":"pyrrhus-in-sicily"},{"q":"Which battle of 295 BC was the turning point that showed nobody could stop Rome from dominating Italy?","options":["Asculum","Sentinum","Beneventum","Heraclea"],"a":1,"level":1,"why":"At Sentinum in Umbria, Rome defeated a combined army of Samnites, Gauls, Etruscans and Umbrians. After that, Rome's domination of Italy looked unstoppable.","sec":"rome-after-the-samnite-wars"},{"q":"Against which power did Rome go to war in 264 BC?","options":["Epirus","Macedon","Carthage","Syracuse"],"a":2,"level":1,"why":"In 264 BC Rome went to war with Carthage, beginning the First Punic War. Carthage had once been Rome's ally.","sec":"italy-united-264-bc"},{"q":"What does the name Magna Graecia, given to the Greek cities of southern Italy, mean?","options":["Western Greece","Great Greece","New Greece","Greater Italy"],"a":1,"level":1,"why":"Magna Graecia means Great Greece, a string of rich Greek cities founded by colonists centuries earlier. Tarentum was the most powerful of them.","sec":"tarentum-calls-for-help"},{"q":"What did the lex Hortensia of 287 BC do?","options":["Cancelled all debts owed by plebeians","Abolished the office of dictator for good","Gave Roman citizenship to all Italian allies","Made Plebeian Council decisions binding on all"],"a":3,"level":1,"why":"The law made every decision of the Plebeian Council binding on all citizens, patricians included. In theory, patricians and plebeians now had equal political rights.","sec":"lex-hortensia"},{"q":"Where did Pyrrhus first defeat the Romans in 280 BC?","options":["Asculum","Sentinum","Beneventum","Heraclea"],"a":3,"level":1,"why":"Pyrrhus beat the Romans at Heraclea in Lucania in 280 BC. Some of Rome's allies promptly switched sides afterward.","sec":"heraclea-and-asculum"},{"q":"After deciding the war in Italy could not be won, where did Pyrrhus sail in the winter of 275/274 BC?","options":["Back to Sicily","To Carthage","To Macedon","Home to Epirus"],"a":3,"level":1,"why":"Pyrrhus sailed home to Epirus. He left only a small garrison of his soldiers in Tarentum.","sec":"beneventum-and-withdrawal"},{"q":"How did Rome control most of the Greek cities of Magna Graecia after Pyrrhus left?","options":["By destroying and resettling them","By handing them over to Carthage","By binding them through treaties","By sending Roman governors to rule them"],"a":2,"level":1,"why":"Rather than rule them directly, Rome bound most of the Greek cities through treaties, giving it indirect control. Apart from garrisons, its grip stayed loose for decades.","sec":"how-rome-ruled-italy"},{"q":"By the time he went to Sicily, what had Pyrrhus's ambitions grown into?","options":["Conquering Egypt and the eastern kingdoms","Retaking his lost lands back in Greece","Dominating both southern Italy and Sicily","Capturing Rome and ruling all of Latium"],"a":2,"level":1,"why":"His goals had grown far beyond rescuing Tarentum. In the end, though, his Sicilian adventure brought him nothing lasting.","sec":"pyrrhus-in-sicily"},{"q":"The Appian Way, Rome's great road, ran south from Rome toward which city?","options":["Genua","Ariminum","Capua","Arretium"],"a":2,"level":1,"why":"The Appian Way ran south toward Capua, carrying Roman armies and influence deep into the south. Rome also founded colonies of loyal citizens on conquered land.","sec":"rome-after-the-samnite-wars"},{"q":"According to the Roman tradition preserved by Livy, what caused the last plebeian secession?","options":["A tyrannical consul","Debt","Famine","Plague"],"a":1,"level":1,"why":"The traditional account blamed debt, with angry crowds revolting when called up to fight the Lucanians. Modern historians doubt this version.","sec":"why-the-plebs-seceded"},{"q":"Where was Pyrrhus killed in 272 BC?","options":["Tarentum","Argos","Syracuse","Pella"],"a":1,"level":1,"why":"Pyrrhus died fighting a different war at Argos in southern Greece. That same year, Tarentum fell to Rome.","sec":"beneventum-and-withdrawal"},{"q":"What did Rome's system of colonies, citizenship and alliances turn Italy into?","options":["A grain supplier for the Greek world","A single province under one governor","A vast reservoir of fighting men","A loose league of free kingdoms"],"a":2,"level":1,"why":"Rome's system produced a reservoir of soldiers larger than that of any other state of the time. Allies stayed independent in name but had to supply troops.","sec":"how-rome-ruled-italy"},{"q":"Where did the Samnites, Rome's toughest rivals in central Italy, come from?","options":["The island of Sicily","The Apennine mountains","The coastal plains of Etruria","The Po Valley in the north"],"a":1,"level":1,"why":"The Samnites were a warlike coalition of tribes from the Apennine mountains. Rome fought them in three Samnite Wars between 343 and 290 BC.","sec":"rome-after-the-samnite-wars"},{"q":"What does the phrase \"Pyrrhic victory\" mean?","options":["A win gained by a surprise attack","A win so costly it is almost a defeat","A win won by hired foreign troops","A win achieved with no losses at all"],"a":1,"level":1,"why":"The phrase comes from Pyrrhus, whose victories over Rome cost his army terribly. He reportedly said, \"Another such victory and we are lost!\"","sec":"heraclea-and-asculum"},{"q":"Who was the next enemy to seriously challenge Rome's control of the Italian peninsula after Pyrrhus?","options":["Spartacus","Hannibal","Philip of Macedon","Mithridates"],"a":1,"level":1,"why":"Rome's hold on Italy was not seriously challenged again until Hannibal invaded at the end of the century. Its victory over Pyrrhus had hugely boosted its standing.","sec":"beneventum-and-withdrawal"},{"q":"The Conflict of the Orders was a long struggle between which two groups in Roman society?","options":["Patricians and plebeians","Romans and Samnites","The Senate and the consuls","Latins and Etruscans"],"a":0,"level":1,"why":"For two centuries the hereditary patrician elite and the mass of ordinary plebeian citizens struggled over political rights. The Hortensian Law of 287 BC brought this conflict to a close.","sec":"lex-hortensia"}],"2":[{"q":"Who were most likely the organisers behind the well-crafted Hortensian Law?","options":["The patrician senators","The Latin allies","The plebeian tribunes","The two consuls","The priestly pontiffs"],"a":2,"level":2,"why":"Scholars argue such a carefully built law needed organisers, most likely the plebeian tribunes. The consuls' harsh measures also suggest real unrest in the city.","sec":"why-the-plebs-seceded"},{"q":"What happened to Tarentum in 272 BC, about two years after Pyrrhus sailed home?","options":["It became Pyrrhus's royal capital","It joined a new Samnite alliance","It was razed and its people enslaved","It fell to Rome","It was captured by Carthage"],"a":3,"level":2,"why":"Tarentum fell to Rome in 272 BC. The Epirote garrison left there was allowed to go home in peace.","sec":"beneventum-and-withdrawal"},{"q":"Rome's help to which Greek city, under attack by a Samnite-led alliance, alarmed Tarentum?","options":["Thurii","Rhegium","Syracuse","Naples","Locri"],"a":0,"level":2,"why":"Rome stepped in to defend Thurii on the Gulf of Taranto. Tarentum wanted no Roman meddling in its backyard.","sec":"tarentum-calls-for-help"},{"q":"Which Carthaginian fortress on Sicily's western tip did Pyrrhus fail to capture?","options":["Lilybaeum","Agrigentum","Drepana","Messana","Panormus"],"a":0,"level":2,"why":"Pyrrhus could not take Lilybaeum, Carthage's great fortress on Sicily's western tip. The war there ground to a stalemate.","sec":"pyrrhus-in-sicily"},{"q":"What do modern scholars think was the likelier cause of the last plebeian secession?","options":["A quarrel over who could be consul","Demands for citizenship by Latin allies","Who would get newly won public land","Fear of an invasion by Pyrrhus","Grain shortages in the city"],"a":2,"level":2,"why":"The Third Samnite War had won Rome large tracts of public land, and rural plebeians wanted a say in its distribution. Scholars doubt the traditional story about debt.","sec":"why-the-plebs-seceded"},{"q":"Why did Rome turn its attention south and across the sea rather than north?","options":["Northern Italy had no valuable land","Carthage offered Rome land in Africa","The Senate feared revolts in Etruria","Pyrrhus still held lands in the north","The Alps blocked the way and the Gauls were too strong"],"a":4,"level":2,"why":"The Alps blocked the way north, and Rome was not yet ready to take on the Gauls living beneath them. So it looked south, toward Sicily and Carthage.","sec":"italy-united-264-bc"},{"q":"Why did Pyrrhus march north into Latium after his victory at Heraclea?","options":["To meet a Carthaginian fleet","To seize Capua's grain stores","To link up with the Etruscans","To recruit Gallic warriors","To besiege the city of Rome"],"a":2,"level":2,"why":"Pyrrhus hoped to join forces with the Etruscans, who were still fighting Rome. But Rome won its war in Etruria, and Pyrrhus pulled back south for the winter.","sec":"heraclea-and-asculum"},{"q":"According to tradition, on which hill did the plebeians gather during their final secession around 287 BC?","options":["The Palatine","The Quirinal","The Capitoline","The Aventine","The Janiculum"],"a":4,"level":2,"why":"The plebeians traditionally gathered on the Janiculum, a hill across the River Tiber. Walking out left Rome without workers or soldiers.","sec":"lex-hortensia"}],"3":[{"q":"How did the Hortensian Law go further than the earlier laws of 449 and 339 BC?","options":["It gave the Senate a veto over tribunes","It removed the need for Senate approval","It created the office of tribune","It first let plebeians become consuls","It abolished patrician status entirely","It moved voting into military centuries"],"a":1,"level":3,"why":"The earlier laws still required the Senate to approve plebeian decisions; the lex Hortensia removed that requirement entirely. This made the people and their tribunes major players in Roman politics.","sec":"lex-hortensia"},{"q":"What did the battle at Populonia in 282 BC accomplish?","options":["It gave Rome its first win over Pyrrhus","It crushed the Gauls south of the Alps","It brought Tarentum under Roman rule","It ended the Third Samnite War","It secured Rome's first foothold in Sicily","It ended the last traces of Etruscan power"],"a":5,"level":3,"why":"The battle at the coastal Etruscan town of Populonia finished off the last traces of Etruscan power in the region. The Greek south of Italy, however, still lay beyond Rome's control.","sec":"rome-after-the-samnite-wars"},{"q":"The Plebeian Council voted by tribal districts, never more than 35. How many of them did rural landowners control?","options":["35","29","17","21","31","4"],"a":1,"level":3,"why":"Rural landowners controlled 29 districts, so they, not city crowds, held most of the voting power. This is one reason historians doubt the story of urban debt riots.","sec":"why-the-plebs-seceded"},{"q":"Over which years was the First Punic War fought?","options":["275–241 BC","264–241 BC","241–218 BC","264–218 BC","264–146 BC","281–264 BC"],"a":1,"level":3,"why":"The First Punic War began in 264 BC and lasted until 241 BC. That same year, 264 BC, Rome crushed the last resistance in Etruria.","sec":"italy-united-264-bc"},{"q":"After which battle, according to ancient tradition, did Pyrrhus exclaim, \"Another such victory and we are lost!\"?","options":["Sentinum, 295 BC","Asculum, 279 BC","Lilybaeum, 277 BC","Heraclea, 280 BC","Populonia, 282 BC","Beneventum, 275 BC"],"a":1,"level":3,"why":"Pyrrhus beat the Romans again at Asculum in 279 BC, but his army suffered terribly. Rather than press on against Rome, he then turned to Sicily.","sec":"heraclea-and-asculum"},{"q":"How do accounts describe the outcome of Pyrrhus's final battle with Rome at Beneventum in 275 BC?","options":["All agree on a crushing Roman win","As another costly win for Pyrrhus","As a Roman victory or as a draw","As a battle decided by Carthage","As the battle where Pyrrhus died","As a Roman defeat ending in a truce"],"a":2,"level":3,"why":"Some accounts call Beneventum a Roman victory, others a draw. Either way, it forced Pyrrhus onto the defensive.","sec":"beneventum-and-withdrawal"},{"q":"What oddity did the Hortensian Law contain?","options":["It let only city residents cast votes","It banned all voting in wartime","It limited tribunes to a single term","It banned votes on market days","It banned votes during religious festivals","It required Senate approval for war votes"],"a":3,"level":3,"why":"The ban on market-day votes made it harder for country farmers, who came to town on those days, to vote. This is odd given that rural plebeians likely drove the reform.","sec":"why-the-plebs-seceded"}]},"chronicleMaps":[],"keyFacts":null}]

// Every round of every game in a chapter is part of its test. Each item counts once, on the first try, weighted by how
// hard it is to guess (true/false 0.5, one of four 0.75, putting in order or placing 0.8) and, for quiz questions, by

const newSeed = () => Math.floor(Math.random() * 2 ** 31)
const testOf = c => (tests[c.id] ??= { attempt: 1, seed: newSeed(), answers: {}, done: {}, missSecs: {}, score: 0, battles: [], won: false, stars: 0 })
function seededRandom(seed) {
  let a = seed >>> 0
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
}
const seededShuffle = (arr, rnd) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }
// Two quiz rounds of ten (4 easy, 3 medium, 3 hard) drawn for this attempt from the chapter's whole question pool,
// with the answers in a new order
function quizSetsFor(c) {
  const rnd = seededRandom(testOf(c).seed)
  const pool = Object.fromEntries([1, 2, 3].map(l => [l, seededShuffle(c.quizPool[l] ?? [], rnd)]))
  const mix = q => { const order = seededShuffle(q.options.map((_, i) => i), rnd); return { ...q, options: order.map(i => q.options[i]), a: order.indexOf(q.a) } }
  return [0, 1].map(i => [...pool[1].slice(i * 4, i * 4 + 4), ...pool[2].slice(i * 3, i * 3 + 3), ...pool[3].slice(i * 3, i * 3 + 3)])
    .filter(qs => qs.length >= 8)
    .map((qs, i) => ({ name: ['Raise a Legion', 'Reinforcements'][i], blurb: `${qs.length} questions from the whole chapter`, questions: qs.map(mix) }))
}

// Drag helper: follows the pointer after a small movement; small movements stay taps
function draggable(el, { onMove, onDrop }) {
  el.style.touchAction = 'none'
  el.addEventListener('pointerdown', down => {
    if (busy || down.button > 0) return
    const sx = down.clientX, sy = down.clientY
    let dragging = false
    const move = e => {
      const dx = e.clientX - sx, dy = e.clientY - sy
      if (!dragging && Math.hypot(dx, dy) < 8) return
      dragging = true
      el.classList.add('dragging')
      el.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.max(-6, Math.min(6, dx / 20))}deg)`
      onMove?.(e, dx, dy)
    }
    const up = e => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up)
      if (!dragging) return
      el.dataset.dragged = '1'
      setTimeout(() => delete el.dataset.dragged, 0)
      const keep = onDrop?.(e, e.type === 'pointerup')
      if (!keep) { el.classList.remove('dragging'); el.style.transform = '' }
    }
    el.setPointerCapture(down.pointerId)
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up)
  })
}

function record(key, ok, { forced = false, sec = null } = {}) {
  if (!TEST_TYPES.includes(key.split(':')[0])) return
  const t = testOf(CH)
  if (key in t.answers) return
  t.answers[key] = forced ? 'f' : ok ? 1 : 0
  if (!ok && sec) t.missSecs[sec] = (t.missSecs[sec] ?? 0) + 1
  t.score = testScore(t)
  saveTests(); renderHud()
}

// Drawn from the chapter's maps.json: a region map (coast, Tiber, towns, peoples, far-away places as arrows at the
// edge) or a city map (hills, river, landmarks). Tap to enlarge.
function chronicleMap(m) {
  const b = m.bounds, kx = Math.cos((b.latMin + b.latMax) / 2 * Math.PI / 180)
  const W = 300, H = Math.round(W * (b.latMax - b.latMin) / ((b.lonMax - b.lonMin) * kx))
  const P = (lat, lon) => [(lon - b.lonMin) / (b.lonMax - b.lonMin) * W, (b.latMax - lat) / (b.latMax - b.latMin) * H]
  const path = pts => pts.map(([la, lo], i) => `${i ? 'L' : 'M'}${P(la, lo).map(v => v.toFixed(1)).join(',')}`).join(' ')
  const label = (x, y, p, gap = 7) => {
    const r = p.side !== 'l', tx = (x + (r ? gap : -gap)).toFixed(1), ty = y + 3.2 + (p.dy ?? 0)
    return `<text x="${tx}" y="${ty.toFixed(1)}" text-anchor="${r ? 'start' : 'end'}">${esc(p.name)}${p.note ? ` <tspan class="note">(${esc(p.note)})</tspan>` : ''}${p.latin ? `<tspan class="la" x="${tx}" dy="9.5">${esc(p.latin)}</tspan>` : ''}</text>`
  }
  let art = ''
  if (m.hills) {
    art += `<rect class="ground" x="0" y="0" width="${W}" height="${H}"/>`
    for (const h of m.hills) { const [x, y] = P(h.lat, h.lon), r = h.r / (b.latMax - b.latMin) * H; art += `<ellipse class="hill" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(r * 1.15).toFixed(1)}" ry="${r.toFixed(1)}"/>` }
    for (const r of m.rivers ?? [{ pts: m.river }]) art += `<path class="river big ${r.small ? 'small' : ''}" d="${path(r.pts)}"${m.riverWidth ? ` style="stroke-width:${r.small ? m.riverWidth * 0.6 : m.riverWidth}"` : ''}/>`
    for (const r of m.rivers ?? []) if (r.name) { const [x, y] = P(...r.pts[Math.floor(r.pts.length / 2)]); art += `<text class="river-name" x="${x.toFixed(1)}" y="${(y - 7).toFixed(1)}" text-anchor="middle">${esc(r.name)}</text>` }
    for (const p of m.places) {
      const [x, y] = P(p.lat, p.lon)
      if (p.kind === 'area') art += `<ellipse class="area" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="9" ry="5.5"/>`
      if (p.kind === 'island') art += `<ellipse class="island" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="3" ry="6"/>`
      if (p.kind === 'bridge') art += `<line class="bridge" x1="${(x - 8).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + 8).toFixed(1)}" y2="${y.toFixed(1)}"/>`
    }
    for (const h of m.hills) { const [x, y] = P(h.lat, h.lon), r = h.r / (b.latMax - b.latMin) * H; art += label(x, y, h, r * 1.15 + 3) }
    for (const p of m.places) { const [x, y] = P(p.lat, p.lon); art += label(x, y, p, p.kind === 'area' ? 11 : 9) }
  } else {
    art += `<rect class="sea" x="0" y="0" width="${W}" height="${H}"/>`
    // tiny outlines (San Marino, the Vatican) would show as stray shapes at this scale
    art += `<path class="land" d="${LAND.filter(l => l.pts.length > 6).map(l => path(l.pts.map(([lo, la]) => [la, lo])) + 'Z').join(' ')}"/>`
    art += `<path class="river" d="${path(TIBER)}"/>`
    // routes: a dashed line with an arrowhead at the end
    for (const r of m.routes ?? []) {
      const pts = r.pts.map(([la, lo]) => P(la, lo)), [x1, y1] = pts.at(-2), [x2, y2] = pts.at(-1), a = Math.atan2(y2 - y1, x2 - x1)
      art += `<path class="route" d="${path(r.pts)}"/><path class="route-head" d="M${x2.toFixed(1)},${y2.toFixed(1)} L${(x2 - 7 * Math.cos(a - 0.45)).toFixed(1)},${(y2 - 7 * Math.sin(a - 0.45)).toFixed(1)} L${(x2 - 7 * Math.cos(a + 0.45)).toFixed(1)},${(y2 - 7 * Math.sin(a + 0.45)).toFixed(1)} Z"/>`
    }
    for (const p of m.peoples ?? []) { const [x, y] = P(p.lat, p.lon); art += `<text class="people" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${esc(p.name)}${p.latin ? `<tspan class="la" x="${x.toFixed(1)}" dy="9">${esc(p.latin)}</tspan>` : ''}</text>` }
    for (const p of m.places) {
      const [x, y] = P(p.lat, p.lon)
      art += p.kind === 'lake' ? `<ellipse class="lake" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="4.5" ry="3"/>`
        : p.kind === 'battle' ? `<path class="battle" d="M${(x - 4).toFixed(1)},${(y - 4).toFixed(1)} L${(x + 4).toFixed(1)},${(y + 4).toFixed(1)} M${(x + 4).toFixed(1)},${(y - 4).toFixed(1)} L${(x - 4).toFixed(1)},${(y + 4).toFixed(1)}"/>`
        : `<circle class="${p.kind === 'rome' ? 'rome' : 'town'}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${p.kind === 'rome' ? 5 : 3}"/>`
      art += label(x, y, p)
    }
    for (const e of m.edges ?? []) {
      const x = P(b.latMin, e.lon)[0], top = e.dir === 'n'
      art += `<text class="edge" x="${x.toFixed(1)}" y="${top ? 12 : H - 6}" text-anchor="middle">${top ? '↑' : '↓'} ${esc(e.text)} · ${e.km} km</text>`
    }
  }
  return `<figure class="cmap" tabindex="0" aria-label="Map: ${esc(m.title)}. Tap to enlarge.">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.title)}">${art}</svg>
    <figcaption><b>${esc(m.title)}.</b> ${esc(m.caption)} <span class="tap">Tap the map to enlarge it.</span></figcaption>
  </figure>`
}

const QA_TABS = [['quiz', 'Legion Quiz'], ['tf', 'True or False'], ['chrono', 'Timelines'], ['match', 'Pairs'], ['odd', 'Odd One Out'], ['who', 'Who Am I?'], ['map', 'Places']]

// Stars a player has in a chapter, out of 3 per game set
function chapterStars(c) {
  const earned = Object.entries(stars).filter(([k]) => k.startsWith(c.id + ':')).reduce((n, [, v]) => n + v, 0) + (tests[c.id]?.stars ?? 0)
  // quiz rounds are drawn from the question pool for each attempt, so they are counted from the draw
  const sets = ['timelines', 'matches', 'decks', 'odds', 'whos', 'maps'].reduce((n, k) => n + c[k].length, 0) + quizSetsFor(c).length + (c.battle ? 1 : 0)
  return { earned, max: sets * 3 }
}

  const era = ERAS.find(e => e.id === CH.era)
  run = null
  go(eraChapters(era).length > 1 ? { screen: 'era', era: era.id } : { screen: 'rome' })
}

// ---------- home (one chapter) ----------
function renderHome() {
  const t = testOf(CH), up = testComplete(t) ? null : nextTestRound(t)
  const chronoUnlocked = i => i === 0 || (stars[starKey('chrono', i - 1)] ?? 0) > 0
  const list = type => {
    const g = GAMES[type], inTest = TEST_TYPES.includes(type)
    const unlocked = type === 'chrono' ? chronoUnlocked : () => true
    return `<div class="levels">${g.sets.map((s, i) => `
      <button class="level-card ${up && up.type === type && up.set === i ? 'up-next' : ''}" data-type="${type}" data-set="${i}" ${unlocked(i) ? '' : 'disabled'}>
        <span class="num c${((TYPE_COLOR[type] + i - 1) % 5) + 1}">${NUMERALS[i]}</span>
        <span class="meta"><b>${esc(s.name)}</b><span>${!unlocked(i) ? 'Finish the previous level to unlock' : inTest && t.done[`${type}:${i}`] ? '✓ Done in this test' : up && up.type === type && up.set === i ? '<b class="up-next-label">Up next in your test</b>' : esc(s.blurb)}</span></span>
        ${starRow(stars[starKey(type, i)] ?? 0)}
      </button>`).join('')}</div>`
  }
  app.innerHTML = `
    <header class="top"><div class="brand"><small>${esc(ERAS.find(e => e.id === CH.era).name)} · ${esc(CH.period)}</small><h1>${esc(CH.short)}</h1></div>
      <button class="ghost" id="up">${eraChapters(ERAS.find(e => e.id === CH.era)).length > 1 ? 'Chapters' : 'All eras'}</button></header>
    ${reviewCardHtml()}
    ${testCardHtml()}
    ${openAll && testComplete(t) ? reviewBattleHtml(HoldTheLine.LEVELS[chapterIndex]) : ''}
    ${SECTIONS.map(([type, label]) => GAMES[type].sets.length ? `<p class="section-label">${label}</p>${list(type)}` : '').join('')}
    <p class="footnote">Generated from Wikipedia and fact-checked by AI. Early Roman dates are the traditional ones; historians doubt many of them.</p>`
  app.querySelector('#up').addEventListener('click', leaveChapter)
  app.querySelector('#test-go')?.addEventListener('click', continueTest)
  app.querySelector('#chronicle')?.addEventListener('click', () => openChronicle())
  app.querySelectorAll('.to-battle').forEach(b => b.addEventListener('click', () => { window.scrollTo(0, 0); go({ screen: 'battle' }) }))
  app.querySelector('#retake')?.addEventListener('click', retakeTest)
  app.querySelector('#qa')?.addEventListener('click', () => openAnswers())
  app.querySelector('#chronicle-r')?.addEventListener('click', () => openChronicle())
  app.querySelectorAll('.review-battle').forEach(b => b.addEventListener('click', () => { window.scrollTo(0, 0); go({ screen: 'battle', reviewScore: +b.dataset.score }) }))
  app.querySelectorAll('.key-facts').forEach(b => b.addEventListener('click', () => openKeyFacts()))
  app.querySelector('#next-chapter')?.addEventListener('click', () => { loadChapter(chapterIndex + 1); window.scrollTo(0, 0); go({ screen: 'home' }) })
  app.querySelectorAll('.level-card').forEach(b => b.addEventListener('click', () => { run = null; startGame(b.dataset.type, +b.dataset.set) }))
}
// Review mode: the chapter's questions and answers, and its battle at any score, without playing the test
function reviewCardHtml() {
  if (!openAll) return ''
  return `<section class="run-card review-card">
      <span class="eyebrow">Review mode</span>
      <div class="actions"><button class="primary" id="qa">Questions &amp; answers</button><button class="ghost" id="chronicle-r">Read the chronicle</button>${CH.keyFacts ? '<button class="ghost key-facts">Key facts</button>' : ''}</div>
    </section>`
}
const reviewBattleHtml = L => `<section class="battle-card review-card">
      <span class="eyebrow">${esc(L.year)} · review mode</span>
      <h2>${esc(Cap(battleOf(chapterIndex)))}</h2>
      <p class="task">Play it with the army of a test score of:</p>
      <div class="actions">${[60, 70, 80, 90, 100].map(v => `<button class="ghost review-battle" data-score="${v}">${v}%</button>`).join('')}</div>
      <p class="task" style="font-size:13px">Review battles don’t change your progress.</p>
    </section>`
// The card at the top of a chapter: the test while it's under way, then the battle
function testCardHtml() {
  const t = testOf(CH), rounds = testRounds(), done = rounds.filter(r => roundDone(r, t)).length
  const L = HoldTheLine.LEVELS[chapterIndex], score = pct(t.score), next = CHAPTERS[chapterIndex + 1]
  const lost = t.battles.filter(b => !b.won && b.attempt === t.attempt).length
  if (done < rounds.length) {
    const up = nextTestRound(t)
    return `<section class="run-card">
      <h2>The chapter test</h2>
      <p class="task">${done ? `<b>${done} of ${rounds.length} rounds done</b> · score so far <b>${score}%</b>.` : `Read the chronicle, then play the ${rounds.length} rounds of the test. Your <b>first</b> answer to each question counts.`}</p>
      <ol class="test-steps">${rounds.map(r => `<li class="${roundDone(r, t) ? 'done' : r === up ? 'next' : ''}">${roundDone(r, t) ? '✓ ' : ''}${esc(roundTitle(r))}</li>`).join('')}</ol>
      ${up ? `<p class="task">Up next: <b>${esc(roundTitle(up))} · ${esc(GAMES[up.type].sets[up.set].name)}</b></p>` : ''}
      <div class="actions"><button class="primary" id="test-go">${done ? 'Play the next round' : 'Start the test'}</button><button class="ghost" id="chronicle">Read the chronicle</button>${CH.keyFacts ? '<button class="ghost key-facts">Key facts</button>' : ''}</div>
    </section>
    ${openAll ? reviewBattleHtml(L) : `<section class="battle-card locked">
      <span class="eyebrow">${esc(L.year)} · locked</span>
      <h2>${esc(Cap(battleOf(chapterIndex)))}</h2>
      <p class="task">Unlocks when all ${rounds.length} rounds of the test are done. Your score then sets your army.</p>
    </section>`}`
  }
  if (t.won) return `<section class="battle-card won">
      <span class="eyebrow">${esc(L.year)} · victory ${'★'.repeat(t.stars)}</span>
      <h2>You held the line at ${esc(L.name)}</h2>
      <p class="task">Won with a test score of ${score}%. ${esc(L.after)}</p>
      <div class="actions">${next ? `<button class="primary" id="next-chapter">Next chapter: ${esc(next.short)}</button>` : '<span class="task"><b>You have conquered every chapter so far.</b></span>'}<button class="ghost to-battle">Fight again</button>${CH.keyFacts ? '<button class="ghost key-facts">Key facts</button>' : ''}</div>
    </section>`
  return `<section class="battle-card">
      <span class="eyebrow">Test complete${t.attempt > 1 ? ` · attempt ${t.attempt}` : ''} · ${esc(L.year)}</span>
      <h2>${score}%: ${esc(battleOf(chapterIndex))} awaits</h2>
      <p class="task">Your army: ${armyLine(score)}. ${verdictFor(score)}</p>
      ${lost ? `<p class="task">You lost ${lost === 1 ? 'once' : lost + ' times'} with this army. Re-read where your mistakes came from and retake the test for a stronger army, or fight again.</p>${rereadHtml(t)}` : ''}
      <div class="actions"><button class="primary to-battle">To battle</button><button class="ghost" id="retake">Retake the test</button>${CH.keyFacts ? '<button class="ghost key-facts">Key facts</button>' : ''}</div>

}
// Plays the rounds not yet done, one after another
function continueTest() {
  const next = nextTestRound()
  if (!next) return go({ screen: 'home' })
  run = null
  if (!Object.keys(testOf(CH).answers).length) return go({ screen: 'briefing' })
  startGame(next.type, next.set)
}
function retakeTest(e) {
  const b = e.currentTarget
  if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Tap again: new questions, new score'; return }
  const old = testOf(CH)
  tests[CH.id] = { ...old, attempt: old.attempt + 1, seed: newSeed(), answers: {}, done: {}, missSecs: {}, score: 0 }
  saveTests(); loadChapter(chapterIndex); run = null; window.scrollTo(0, 0); go({ screen: 'home' })
  toast('<b>A new test.</b> The quiz rounds have new questions, and your new score replaces the old one.', 4500)
}

const START = {}
function startGame(type, set) { window.scrollTo(0, 0); go({ screen: 'play', type, set, mistakes: 0, hint: null, roundMisses: [], ...START[type](set) }) }

function finish(recapHtml, earned = starCount(state.mistakes), note) {
  const key = starKey(state.type, state.set)
  state.roundMisses ??= []
  // The round now counts as done in this chapter's test
  let completed = false
  if (TEST_TYPES.includes(state.type)) {
    const t = testOf(CH), before = testComplete(t)
    t.done[`${state.type}:${state.set}`] = 1
    t.score = testScore(t); saveTests()
    completed = !before && testComplete(t)
  }
  const reviewSecs = [...new Set(state.roundMisses.map(m => m.sec).filter(Boolean))]
  stars[key] = Math.max(stars[key] ?? 0, earned)
  saveStars()
  if (run) run.results.push({ type: state.type, set: state.set, stars: earned })
  go({ screen: 'result', type: state.type, set: state.set, mistakes: state.mistakes, earned, recapHtml, note, reviewSecs, feedbackSent: false, completed })
}
const recapList = items => `<ol class="recap">${items.map(i => `<li class="${i.miss ? 'miss' : ''}"><div>${i.when ? `<span class="when">${esc(i.when)}</span>` : ''}<b>${esc(i.title)}</b>${i.text ? `<p>${esc(i.text)}</p>` : ''}</div></li>`).join('')}</ol>`

// ---------- Chronology Jam ----------
START.chrono = set => {
  const events = TIMELINES[set].events
  const sortedIds = events.map((e, i) => ({ y: e.y, i })).sort((a, b) => a.y - b.y).map(e => e.i)
  return { sortedIds, boardIds: shuffle(sortedIds), colors: Object.fromEntries(sortedIds.map(i => [i, 1 + Math.floor(Math.random() * 5)])), placed: [], revealed: [] }
}
RENDER.chrono = () => {
  const g = state, ev = id => TIMELINES[g.set].events[id]
  app.innerHTML = `
    ${playHeader()}
    ${statusLine('Tap or drag the <b>earliest</b> event onto the road.', g.sortedIds.length - g.placed.length)}
    <div class="road" id="road" aria-label="Timeline, oldest first"><div class="lanes">
      ${g.sortedIds.map((_, i) => {
        const id = g.placed[i]
        return id === undefined ? `<div class="slot" data-slot="${i}">${i + 1}</div>`
          : `<div class="slot filled c${g.colors[id]}" data-slot="${i}">${esc(ev(id).label)}<em>${esc(ev(id).when)}</em></div>`
      }).join('')}
    </div></div>
    <div class="board gate">
      ${g.boardIds.map(id => `
        <button class="tile c${g.colors[id]} ${g.placed.includes(id) ? 'gone' : ''} ${g.revealed.includes(id) ? 'revealed' : ''}" data-id="${id}" ${g.placed.includes(id) ? 'tabindex="-1" aria-hidden="true"' : ''}>
          <span>${esc(ev(id).label)}</span><span class="when">${esc(ev(id).when)}</span>
        </button>`).join('')}
    </div>
    <div id="hint-area">${hintHtml(g.hint)}</div>`
  bindBack()
  const road = app.querySelector('#road')
  const overRoad = y => y < road.getBoundingClientRect().bottom + 10
  app.querySelectorAll('.tile:not(.gone)').forEach(t => {
    onTap(t, () => chronoTap(+t.dataset.id, t))
    draggable(t, {
      onMove: e => road.classList.toggle('drop-target', overRoad(e.clientY)),
      onDrop: (e, ok) => { road.classList.remove('drop-target'); t.classList.remove('dragging'); t.style.transform = ''; if (ok && overRoad(e.clientY)) chronoTap(+t.dataset.id, t); return false },
    })
  })
  const last = road.querySelector(`[data-slot="${Math.max(0, g.placed.length - 1)}"]`)
  if (last) road.scrollLeft = Math.max(0, last.offsetLeft - road.clientWidth / 2 + 46)
}
const sinceWhen = s => /^(Under|Soon|After|Possibly)/.test(s) ? s[0].toLowerCase() + s.slice(1) : 'in ' + s
function chronoTap(id, el) {
  const g = state
  if (busy || g.screen !== 'play' || g.placed.includes(id)) return
  const e = TIMELINES[g.set].events[id]
  if (id === g.sortedIds[g.placed.length]) {
    const forced = g.placed.length === g.sortedIds.length - 1
    const note = earn(`chrono:${g.set}:${id}`, ['hastatus', 'princeps', 'triarius'][Math.min(g.set, 2)], el, { forced })
    g.hint = { ok: true, html: `<b>${esc(e.label)}</b> · ${esc(e.when)}. ${esc(e.fact)}${note}` }
    const slot = app.querySelector(`[data-slot="${g.placed.length}"]`)
    g.placed.push(id)
    busy = true
    flyTo(el, slot, () => {
      busy = false
      if (state !== g) return
      if (g.placed.length < g.sortedIds.length) return RENDER.chrono()
      finish(recapList(g.sortedIds.map(i => { const x = TIMELINES[g.set].events[i]; return { when: x.when, title: x.label, text: x.fact } })))
    })
  } else {
    g.mistakes++
    if (!g.revealed.includes(id)) g.revealed.push(id)
    g.hint = { ok: false, sec: e.sec, html: `Not yet. <b>${esc(e.label)}</b> happened ${esc(sinceWhen(e.when))}. Something in the camp is older.` }
    noteMiss(`chrono:${g.set}:${id}`, e.sec)
    el.classList.add('revealed', 'shake')
    el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true })
    app.querySelector('#hint-area').innerHTML = hintHtml(g.hint)
    app.querySelector('.score').textContent = `${g.sortedIds.length - g.placed.length} left · ${plural(g.mistakes, 'mistake')}`
    buzz()
  }
}
function flyTo(tile, slot, done) {
  if (reducedMotion || !slot) { done(); return }
  const from = tile.getBoundingClientRect()
  slot.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'instant' })
  const to = slot.getBoundingClientRect()
  const ghost = tile.cloneNode(true)
  ghost.classList.remove('dragging', 'shake')
  ghost.classList.add('flyer')
  ghost.style.transform = ''
  Object.assign(ghost.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' })
  document.body.appendChild(ghost)
  tile.classList.add('gone')
  const dx = to.left + to.width / 2 - (from.left + from.width / 2)
  const dy = to.top + to.height / 2 - (from.top + from.height / 2)
  const scale = Math.min(to.width / from.width, to.height / from.height)
  ghost.animate([
    { transform: 'translate(0,0) scale(1)' },
    { transform: `translate(${dx * 0.15}px, ${dy * 0.15 - 18}px) scale(1.04)`, offset: 0.25 },
    { transform: `translate(${dx}px, ${dy}px) scale(${scale})` },
  ], { duration: 420, easing: 'cubic-bezier(.3,.7,.3,1)' }).onfinish = () => { ghost.remove(); done() }
}

// ---------- Match Pairs ----------
START.match = set => {
  const ids = [...MATCHES[set].pairs.keys()]
  return { left: shuffle(ids), right: shuffle(ids), matched: [], selected: null, colors: Object.fromEntries(ids.map(i => [i, (i % 5) + 1])) }
}
RENDER.match = () => {
  const g = state, set = MATCHES[g.set]
  const col = (ids, side) => ids.map(i => {
    const m = g.matched.includes(i)
    return `<button class="pick ${side === 'R' ? 'desc' : ''} ${m ? `matched c${g.colors[i]}` : ''} ${g.selected?.side === side && g.selected.id === i ? 'selected' : ''}" data-side="${side}" data-id="${i}" ${m ? 'disabled' : ''}>${esc(set.pairs[i][side === 'L' ? 0 : 1])}</button>`
  }).join('')
  app.innerHTML = `
    ${playHeader()}
    ${statusLine('Tap a name, then what it matches.', set.pairs.length - g.matched.length)}
    <div class="board pairs"><div class="col">${col(g.left, 'L')}</div><div class="col">${col(g.right, 'R')}</div></div>
    <div id="hint-area">${hintHtml(g.hint)}</div>`
  bindBack()
  app.querySelectorAll('.pick:not([disabled])').forEach(b => b.addEventListener('click', () => matchTap(b.dataset.side, +b.dataset.id)))
}
function matchTap(side, id) {
  const g = state, set = MATCHES[g.set]
  if (busy || g.matched.includes(id)) return
  if (!g.selected || g.selected.side === side) { g.selected = { side, id }; g.hint = null; return RENDER.match() }
  const other = g.selected
  g.selected = null
  if (other.id === id) {
    const forced = g.matched.length === set.pairs.length - 1
    const fromEl = app.querySelector(`[data-side="L"][data-id="${id}"]`)
    const note = earn(`match:${g.set}:${id}`, 'centurio', fromEl, { forced })
    g.matched.push(id)
    g.hint = { ok: true, html: `<b>${esc(set.pairs[id][0])}</b>: ${esc(set.pairs[id][1].replace(/^./, c => c.toLowerCase()))}.${note}` }
    RENDER.match()
    if (g.matched.length === set.pairs.length) {
      busy = true
      setTimeout(() => { busy = false; if (state === g) finish(recapList(set.pairs.map(([a, b]) => ({ title: a, text: b })))) }, 700)
    }
  } else {
    g.mistakes++
    const [l, r] = side === 'L' ? [id, other.id] : [other.id, id]
    g.hint = { ok: false, sec: set.secs[l], html: `<b>${esc(set.pairs[l][0])}</b> doesn’t go with “${esc(set.pairs[r][1])}”. Try again.` }
    noteMiss(`match:${g.set}:${l}`, set.secs[l])
    RENDER.match()
    app.querySelectorAll(`[data-side="L"][data-id="${l}"], [data-side="R"][data-id="${r}"]`).forEach(b => b.classList.add('shake'))
    buzz()
  }
}

// ---------- True or False ----------
START.tf = set => ({ order: shuffle([...DECKS[set].cards.keys()]), index: 0, answered: null, misses: [] })
RENDER.tf = () => {
  const g = state, deck = DECKS[g.set]
  const card = deck.cards[g.order[g.index]]
  const hasNext = g.index + 1 < g.order.length
  app.innerHTML = `
    ${playHeader()}
    ${statusLine('Swipe right if it’s true, left if it’s false.', g.order.length - g.index)}
    ${g.answered ? '' : `<div class="deck">
      ${hasNext ? '<div class="card behind" aria-hidden="true"><p class="claim">&nbsp;</p></div>' : ''}
      <div class="card" id="card">
        <span class="stamp t">TRUE</span><span class="stamp f">FALSE</span>
        <span class="count">Statement ${g.index + 1} of ${g.order.length}</span>
        <p class="claim">${esc(card.claim)}</p>
        <p class="swipe-hint">← false · true →</p>
      </div>
    </div>`}
    ${g.answered ? verdictHtml(card, g.answered) : `<div class="answer-buttons"><button class="btn-false" id="no">✗ False</button><button class="btn-true" id="yes">✓ True</button></div>`}`
  bindBack()
  if (g.answered) return app.querySelector('#continue').addEventListener('click', nextTF)
  app.querySelector('#no').addEventListener('click', () => answerTF(false))
  app.querySelector('#yes').addEventListener('click', () => answerTF(true))
  const el = app.querySelector('#card'), tS = el.querySelector('.stamp.t'), fS = el.querySelector('.stamp.f')
  draggable(el, {
    onMove: (e, dx) => { el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; tS.style.opacity = Math.max(0, Math.min(1, dx / 90)); fS.style.opacity = Math.max(0, Math.min(1, -dx / 90)) },
    onDrop: (e, ok) => {
      const dx = e.clientX - el.getBoundingClientRect().left - el.offsetWidth / 2 + (parseFloat(el.style.transform.split('(')[1]) || 0) * 0
      const shift = parseFloat((el.style.transform.match(/translateX\(([-\d.]+)px/) || [])[1] || 0)
      if (ok && Math.abs(shift) > 90) { answerTF(shift > 0, shift); return true }
      tS.style.opacity = 0; fS.style.opacity = 0
      return false
    },
  })
}
function verdictHtml(card, answered) {
  const right = answered.value === card.answer
  return `<div class="verdict">
    ${hintHtml({ ok: right, sec: right ? null : card.sec, html: `<b>${right ? 'Correct!' : 'Not quite.'}</b> “${esc(card.claim)}” is <b>${card.answer ? 'true' : 'false'}</b>. ${esc(card.why)}${right && answered.recruit ? ' ' + recruitLine(answered.recruit) : ''}` })}
    <button class="primary" id="continue">${state.index + 1 < state.order.length ? 'Next statement' : 'See results'}</button>
  </div>`
}
function answerTF(value, fromX) {
  const g = state
  if (busy || g.answered) return
  const card = DECKS[g.set].cards[g.order[g.index]]
  const el = app.querySelector('#card')
  const key = `tf:${g.set}:${g.order[g.index]}`
  if (value !== card.answer) { g.mistakes++; g.misses.push(g.order[g.index]); noteMiss(key, card.sec); buzz(); g.answered = { value } }
  else g.answered = { value, recruit: reward(key, 'hastatus', el) }
  const done = () => { busy = false; if (state === g) RENDER.tf() }
  if (reducedMotion || !el) return done()
  busy = true
  const x = fromX ?? (value ? 1 : -1) * 120
  el.animate([{ transform: el.style.transform || 'none' }, { transform: `translate(${x * 4}px, 30px) rotate(${x > 0 ? 18 : -18}deg)` }],
    { duration: 300, easing: 'ease-in', fill: 'forwards' }).onfinish = done
}
function nextTF() {
  const g = state
  g.answered = null
  g.index++
  if (g.index < g.order.length) return RENDER.tf()
  const deck = DECKS[g.set]
  finish(recapList(g.order.map(i => ({ when: deck.cards[i].answer ? 'True' : 'False', title: deck.cards[i].claim, text: deck.cards[i].why, miss: g.misses.includes(i) }))))
}

// ---------- Odd One Out ----------
START.odd = set => ({ order: shuffle([...ODDS[set].rounds.keys()]), index: 0, layout: null, picked: null, misses: [] })
RENDER.odd = () => {
  const g = state, round = ODDS[g.set].rounds[g.order[g.index]]
  g.layout ??= shuffle([...round.items.keys()])
  const solved = g.picked === round.odd
  app.innerHTML = `
    ${playHeader()}
    ${statusLine('Three of these belong together. Tap the one that doesn’t.', g.order.length - g.index)}
    <div class="board odd">${g.layout.map((i, k) => `
      <button class="tile c${(k % 5) + 1} ${solved && i !== round.odd ? 'dim' : ''} ${solved && i === round.odd ? 'right-pick' : ''}" data-i="${i}" ${solved ? 'disabled' : ''}>${esc(round.items[i])}</button>`).join('')}
    </div>
    <div id="hint-area">${hintHtml(g.hint)}</div>
    ${solved ? `<button class="primary" id="continue" style="align-self:flex-start">${g.index + 1 < g.order.length ? 'Next round' : 'See results'}</button>` : ''}`
  bindBack()
  if (solved) return app.querySelector('#continue').addEventListener('click', () => {
    g.index++; g.layout = null; g.picked = null; g.hint = null
    if (g.index < g.order.length) return RENDER.odd()
    const set = ODDS[g.set]
    finish(recapList(g.order.map(i => ({ title: `${set.rounds[i].items[set.rounds[i].odd]} was the odd one out`, text: set.rounds[i].why, miss: g.misses.includes(i) }))))
  })
  app.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
    const i = +t.dataset.i
    if (i === round.odd) {
      g.picked = i
      const key = `odd:${g.set}:${g.order[g.index]}`
      const wrong = g.roundWrong ?? 0
      const note = earn(key, 'princeps', t)
      g.roundWrong = 0
      g.hint = { ok: true, html: `<b>${esc(round.items[i])}</b> is the odd one out. ${esc(round.why)}${note}` }
      RENDER.odd()
    } else {
      g.mistakes++
      g.roundWrong = (g.roundWrong ?? 0) + 1
      if (!g.misses.includes(g.order[g.index])) g.misses.push(g.order[g.index])
      g.hint = { ok: false, sec: round.sec, html: `<b>${esc(round.items[i])}</b> belongs with the others. Look again.` }
      noteMiss(`odd:${g.set}:${g.order[g.index]}`, round.sec)
      app.querySelector('#hint-area').innerHTML = hintHtml(g.hint)
      app.querySelector('.score').textContent = `${g.order.length - g.index} left · ${plural(g.mistakes, 'mistake')}`
      t.classList.add('shake'); t.addEventListener('animationend', () => t.classList.remove('shake'), { once: true })

    }
  }))
}

// ---------- Who Am I? ----------
START.who = set => ({ order: shuffle([...WHOS[set].people.keys()]), index: 0, shown: 1, wrong: [], solved: false, extraClues: 0, results: [] })

  const g = state, p = WHOS[g.set].people[g.order[g.index]]
  app.innerHTML = `

      <div class="clue ${i < g.shown ? '' : 'hidden-clue'}"><span class="n">${i + 1}</span><span>${i < g.shown ? esc(c) : 'Hidden clue'}</span></div>`).join('')}

const project = (lat, lon) => {
  const b = MAP_BOUNDS, w = (b.lonMax - b.lonMin) * b.kx

}

          <circle class="spot ${done ? 'done' : ''}" data-spot="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${done ? 6 : 7.5}"/>
          ${done ? `<text x="${(x + (x > 200 ? -9 : 9)).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${x > 200 ? 'end' : 'start'}">${esc(p.name)}</text>` : ''}` }).join('')}

      onDrop: (e, ok) => { const s = ok && spotAt(e.clientX, e.clientY); c.classList.remove('dragging'); c.style.transform = ''; if (s) mapPlace(i, +s.dataset.spot); else RENDER.map(); return false },

  const g = state, places = MAPS[g.set].places

    g.placed.push(label)
    g.hint = { ok: true, html: `<b>${esc(places[label].name)}</b>: ${esc(places[label].why)}${note}` }
    if (g.placed.length === places.length) {

}
