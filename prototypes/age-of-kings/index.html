he spoils to Apollo and invited Juno to move to Rome.","As dictator, I captured Veii by sending troops through a tunnel."],"sec":"siege-of-veii"},{"name":"Brennus","options":["Brennus","Aruns","Dionysius I","Marcus Papirius"],"clues":["My warriors struck the Roman reserves on a hill, and panic spread.","I led the Gauls at the battle where many Romans drowned in the Tiber.","When the Romans complained about rigged weights, I threw my sword onto the scales.","I declared, 'Woe to the vanquished!'"],"sec":"sack-of-rome"},{"name":"Marcus Manlius","options":["Marcus Manlius","Marcus Papirius","Lucius Albinus","Marcus Furius Camillus"],"clues":["I had once served as consul of Rome.","I was among the defenders on the Capitoline, Rome's citadel hill, during the siege.","One night I was roused while the guards and dogs slept.","Woken by Juno's honking geese, I hurled the first Gallic climber down the slope."],"sec":"sack-of-rome"}]},{"name":"Who Told the Story?","blurb":"Ancient and modern writers who shaped how we see these events.","people":[{"name":"Livy","options":["Livy","Polybius","Diodorus Siculus","T. J. Cornell"],"clues":["I claimed Rome's tangled streets came from hasty rebuilding after the Gauls burned it.","I called some tribunes 'slaves of the nobility'.","I wrote that the patricians and plebeians were 'at length brought into harmony'.","I am the Roman historian in whose story Camillus arrives just in time to cancel the ransom."],"sec":"sack-of-rome"},{"name":"Diodorus Siculus","options":["Diodorus Siculus","Livy","T. J. Cornell","Aristotle"],"clues":["Like Polybius, I never mention Camillus in the story of the sack.","In my account, the Gauls had gone on to southern Italy before they were beaten.","I was a Greek historian writing about Rome's past.","I say an Etruscan army defeated the Gauls on their way back from southern Italy."],"sec":"sack-reliability"},{"name":"T. J. Cornell","options":["T. J. Cornell","Livy","Polybius","Diodorus Siculus"],"clues":["I think the Gauls left most of Rome standing and went home once paid.","I doubt the tale of Aruns's revenge and suspect the Senones were mercenaries.","I argue the new plebeian leaders joined the patricians in a new aristocracy.","I am a modern historian who trusts very little of Livy's dramatic story."],"sec":"modern-verdict"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Veii","lat":42.02333333,"lon":12.38972222,"why":"Rome's great Etruscan rival, captured by Camillus through a tunnel around 396 BC.","sec":"siege-of-veii"},{"name":"Clusium","lat":43.01666667,"lon":11.95,"why":"The Etruscan town, now Chiusi, whose appeal to Rome against the Senones led to the Gallic war.","sec":"battle-of-the-allia"},{"name":"Caere","lat":42.00166667,"lon":12.10833333,"why":"Rome's coastal Etruscan ally, where the Vestal Virgins took the sacred objects during the sack.","sec":"sack-of-rome"},{"name":"Velitrae","lat":41.68666667,"lon":12.7775,"why":"The Volscian town whose attack in 370 BC made Licinius and Sextius end their block on elections.","sec":"licinius-and-sextius"},{"name":"Cumae","lat":40.84861111,"lon":14.05361111,"why":"The Greek city near Naples where, by tradition, King Tarquinius Superbus bought the Sibylline Books.","sec":"licinian-laws"},{"name":"Rimini","lat":44.05944444,"lon":12.56833333,"why":"The Adriatic coast around modern Rimini was where the Senones, the Gauls who sacked Rome, had settled.","sec":"battle-of-the-allia"}]}],"quizPool":{"1":[{"q":"Under the land law of Licinius and Sextius, how much public land could one individual hold?","options":["About 120 hectares (300 acres)","About half a hectare (one and a quarter acres)","About 12 hectares (30 acres)","About 1,200 hectares (3,000 acres)"],"a":0,"level":1,"why":"The law capped holdings of public land at about 120 hectares (300 acres). Such laws were easy to dodge, and Licinius himself was later fined for breaking his own limit.","sec":"licinian-laws"},{"q":"What power allowed tribunes of the plebs to block official business?","options":["The auspices","The censorship","The veto","The dictatorship"],"a":2,"level":1,"why":"Tribunes were elected by the plebeians to protect them and could block business with a veto. The patricians turned this weapon against Licinius and Sextius by persuading other tribunes to veto their bill.","sec":"licinius-and-sextius"},{"q":"How did Rome bind the people of newly conquered Veii more closely to itself after the sack?","options":["It allowed them their own consuls","It gave them citizenship without the vote","It made them full voting citizens","It exempted them from all taxes"],"a":1,"level":1,"why":"Veii's people received citizenship without the right to vote. Rome also strengthened its alliance with Caere.","sec":"rome-after-the-sack"},{"q":"Where had the Senones, the Gallic tribe that defeated Rome, settled?","options":["In Sicily near Syracuse","In the hills around modern Florence","On the Bay of Naples near Cumae","On the Adriatic coast around modern Rimini"],"a":3,"level":1,"why":"The Senones were one of several Celtic peoples who had recently pushed into northern Italy, settling around modern Rimini.","sec":"battle-of-the-allia"},{"q":"In Cornell's view, what did the plebeian leaders do once they entered top office?","options":["Abolished the Senate entirely","Barred patricians from the consulship","Formed a new aristocracy with the patricians","Redistributed all public land to the poor"],"a":2,"level":1,"why":"Cornell argues the wealthy plebeian leaders joined the patricians in a new aristocracy and turned their backs on the poor. Livy even called some tribunes 'slaves of the nobility'.","sec":"modern-verdict"},{"q":"In the compromise over the first plebeian consul, which new office was reserved for patricians?","options":["The tribune","The praetor","The censor","The dictator"],"a":1,"level":1,"why":"The nobles accepted a plebeian consul, and in return the new praetorship would be held by a patrician. The praetor served as Rome's chief judge.","sec":"first-plebeian-consul"},{"q":"What does historian T. J. Cornell think the Senones who attacked Rome really were?","options":["Pilgrims visiting a shrine","Migrants seeking farmland","Mercenaries","Refugees fleeing Etruscans"],"a":2,"level":1,"why":"Since no account mentions Gallic wives or children, Cornell sees the Senones as a warrior band, probably mercenaries. Shortly afterwards, Dionysius I of Syracuse hired Gauls for a war in southern Italy.","sec":"sack-reliability"},{"q":"Who were the patricians of the early Roman Republic?","options":["A small hereditary aristocracy","Etruscan settlers living in Rome","The great majority of ordinary Romans","Elected protectors of the poor"],"a":0,"level":1,"why":"The patricians were a small hereditary aristocracy who owned large estates, lent money and saw ruling as their birthright. The plebeians made up the great majority of ordinary Romans.","sec":"conflict-of-the-orders"},{"q":"To which assembly did Licinius and Sextius put their three reform bills?","options":["The Senate","The College of Priests","The Plebeian Council","The Council of Elders"],"a":2,"level":1,"why":"They brought their bills to the Plebeian Council, the assembly of the plebeians. The bills dealt with debt, land and the consulship.","sec":"licinius-and-sextius"},{"q":"Why is the reliability of the accounts of the Allia and the sack of Rome doubtful?","options":["They survive only on damaged inscriptions","They were composed by the defeated generals","They were written only by Gallic authors","They were written centuries after the events"],"a":3,"level":1,"why":"All the accounts date from centuries later. The biggest suspect is Camillus's heroic rescue, which many modern historians see as a later addition.","sec":"sack-reliability"},{"q":"Who were usually the creditors of the indebted small farmers of early Rome?","options":["The plebeian tribunes","Etruscan merchants","Wealthy patricians","Greek bankers from Cumae"],"a":2,"level":1,"why":"Debt weighed heavily on small farmers, and their creditors were usually rich patricians. The new debt law subtracted interest already paid from the sum owed.","sec":"licinian-laws"},{"q":"Which two tribunes of the plebs launched a ten-year campaign for reform in 375 BC?","options":["Gaius Licinius Stolo and Lucius Sextius Lateranus","Publius Manlius and Marcus Furius Camillus","Lucius Genucius and Marcus Manlius","Marcus Papirius and Lucius Albinus"],"a":0,"level":1,"why":"Licinius and Sextius began a campaign that lasted a decade. They were re-elected year after year.","sec":"licinius-and-sextius"},{"q":"When the patricians refused to confirm Rome's first plebeian consul, what did the plebeians come close to doing?","options":["Burning the Senate house","Inviting the Gauls back into Rome","Seceding in a mass walkout from the city","Crowning a plebeian king"],"a":2,"level":1,"why":"The plebeians nearly seceded, staging a mass walkout as they had done before. According to Livy, the aged Camillus brokered a compromise.","sec":"first-plebeian-consul"},{"q":"In the Roman Republic, what was a dictator?","options":["A judge who presided over criminal trials","A priest who consulted sacred prophecies","An emergency commander with powers for six months","A tyrant who seized power for life"],"a":2,"level":1,"why":"A Republican dictator was an emergency commander with sweeping powers for six months, not a tyrant. Camillus was given this role during the war with Veii.","sec":"siege-of-veii"},{"q":"What did Brennus declare when he threw his sword onto the scales?","options":["\"Woe to the vanquished!\"","\"I came, I saw, I conquered!\"","\"Rome must be destroyed!\"","\"The die is cast!\""],"a":0,"level":1,"why":"The Romans complained the Gauls were using rigged weights for the gold ransom, and Brennus answered by adding his sword. In Livy's version, Camillus then arrived and cancelled the deal.","sec":"sack-of-rome"},{"q":"How much of Livy's dramatic story of the Licinian reforms does historian T. J. Cornell believe can be trusted?","options":["Very little, though the changes themselves are fairly certain","Only the parts involving Camillus","Nearly all of it, including the speeches","None of it, as the reforms never happened"],"a":0,"level":1,"why":"Cornell doubts most of Livy's drama but considers the actual changes in government reasonably certain.","sec":"modern-verdict"},{"q":"Where did Rome's fighting men withdraw when the Gauls reached the city?","options":["The Capitoline hill","The port of Ostia","The town of Ardea","The Palatine hill"],"a":0,"level":1,"why":"The fighting men and able-bodied senators held out on the Capitoline, Rome's fortified citadel hill. According to Livy, the Gauls found the city's gates open and walls unguarded.","sec":"sack-of-rome"},{"q":"How did the Gauls first react to the old Roman magistrates sitting in their robes on ivory chairs?","options":["They mocked them and dragged them away","They stared at them as if they were statues","They demanded the old men pay a ransom","They bowed to them as if they were gods"],"a":1,"level":1,"why":"The old men who had held high office stayed behind in ceremonial dress, and the Gauls gazed at them like statues. The spell broke when one Gaul stroked Marcus Papirius's beard.","sec":"sack-of-rome"},{"q":"Who was the Gallic chief at the Battle of the Allia?","options":["Brennus","Aruns","Dionysius","Vercingetorix"],"a":0,"level":1,"why":"Brennus attacked the Roman reserves on a hill, and panic spread through the Roman army. Many Romans drowned in the Tiber.","sec":"battle-of-the-allia"},{"q":"How far was the Etruscan city of Veii from Rome?","options":["About 160 km (100 miles)","About 60 km (37 miles)","About 5 km (3 miles)","About 16 km (10 miles)"],"a":3,"level":1,"why":"Veii lay just 16 km from Rome, which made it a dangerous neighbour. Rome and Veii fought a long, seesawing war with victories and defeats on both sides.","sec":"siege-of-veii"},{"q":"How did the Romans finally get inside Veii?","options":["By digging a tunnel through volcanic rock","By bribing a guard to open the gates","By diverting a river under the walls","By starving the city into surrender"],"a":0,"level":1,"why":"The Romans tunnelled through the soft volcanic rock on which Veii stood. Picked troops then climbed out inside the city while the defenders manned the walls.","sec":"siege-of-veii"},{"q":"What rule did the Fabius brothers break when they joined the fighting at Clusium?","options":["Senators must not command troops","Consuls must not leave Rome","Envoys must stay neutral","Priests must not shed blood"],"a":2,"level":1,"why":"As ambassadors, the brothers were supposed to stay neutral, but one killed a Gallic chieftain. When the Gauls demanded them, Rome refused to hand them over.","sec":"battle-of-the-allia"},{"q":"What name is given to the roughly two-hundred-year rivalry between Rome's patricians and plebeians?","options":["The War of the Classes","The Conflict of the Orders","The Struggle of the Tribes","The Secession of the Commons"],"a":1,"level":1,"why":"The rivalry is known as the Conflict of the Orders and shaped politics through the Republic's first two centuries. The patricians held power by monopolising the consulship and the Senate.","sec":"conflict-of-the-orders"},{"q":"What stone was used for Rome's huge new city wall after the Gallic sack?","options":["Dark basalt brought from Sicily","Yellow stone quarried in Veii's territory","White marble shipped from Greece","Crumbly local stone from Rome's hills"],"a":1,"level":1,"why":"The old wall used crumbly local stone, so the new 11 km wall was built of better yellow stone from Veii's territory.","sec":"rome-after-the-sack"},{"q":"Which date, the anniversary of the Allia, became an ill-omened day for Romans?","options":["1 January","18 July","21 April","15 March"],"a":1,"level":1,"why":"The anniversary of the defeat, 18 July, became an ill-omened day. Tradition dates the battle to 390 BC, though modern historians prefer around 387 BC.","sec":"battle-of-the-allia"},{"q":"During the night attack on the Capitoline, what woke the defenders?","options":["The crash of a falling wall","The honking of Juno's sacred geese","The trumpet of a sentry","The barking of the guard dogs"],"a":1,"level":1,"why":"The guards and dogs slept, but the sacred geese of Juno honked. Their noise roused Marcus Manlius, who hurled the first attacker down the slope.","sec":"sack-of-rome"},{"q":"Who was chosen as dictator around 396 BC to deal with the war against Veii?","options":["Marcus Manlius","Publius Manlius Capitolinus","Lucius Sextius Lateranus","Marcus Furius Camillus"],"a":3,"level":1,"why":"After a string of setbacks, the Romans turned to Marcus Furius Camillus. He took over a siege that was already under way.","sec":"siege-of-veii"},{"q":"What were the Sibylline Books?","options":["A list of Roman consuls","A code of Roman laws","A collection of prophecies","A record of land ownership"],"a":2,"level":1,"why":"The Sibylline Books were prophecies consulted in times of plague, famine or war. A fourth Licinian law changed who looked after them.","sec":"licinian-laws"},{"q":"From 444 BC, what arrangement did Rome often use instead of its two consuls?","options":["A single dictator chosen for a year","Military tribunes with consular power","Two praetors elected by the plebs","A council of ten patrician judges"],"a":1,"level":1,"why":"Rome was often run by 'military tribunes with consular power', usually called consular tribunes. There were between three and six of them in a given year.","sec":"conflict-of-the-orders"},{"q":"Who became Rome's first plebeian consul in 366 BC?","options":["Gaius Licinius Stolo","Lucius Sextius Lateranus","Lucius Genucius","Marcus Manlius"],"a":1,"level":1,"why":"Sextius, one of the two tribunes who led the long campaign, became the first plebeian consul. The patricians refused to confirm his election, and riots broke out.","sec":"first-plebeian-consul"},{"q":"What did Brennus mean by “Vae victis!”?","options":["Woe to the vanquished!","Gold for the victors!","Rome has fallen!","Peace with Rome!"],"a":0,"level":1,"why":"He threw his sword onto the scales when the Romans complained about rigged weights.","sec":"sack-of-rome"},{"q":"The Romans took Veii through a cuniculus. What was it?","options":["A tunnel","A siege tower","A battering ram","A bridge"],"a":0,"level":1,"why":"They dug it through the soft volcanic rock under the city.","sec":"siege-of-veii"},{"q":"What were the anseres that woke Marcus Manlius?","options":["The sacred geese of Juno","The guard dogs","The temple bells","The Vestal Virgins"],"a":0,"level":1,"why":"The guards and dogs slept, but the geese honked.","sec":"sack-of-rome"}],"2":[{"q":"What was the ager publicus that the land law limited?","options":["Public land owned by the Roman state","Farmland owned by plebeians","Land given to the gods","The common pasture of the patricians"],"a":0,"level":2,"why":"Rich landowners had grabbed huge areas of it; the law capped each person at about 120 hectares (300 acres).","sec":"licinian-laws"},{"q":"After Veii fell, its people received civitas sine suffragio. What was that?","options":["Citizenship without the right to vote","Freedom from taxes","The right to elect their own consuls","Exile from Italy"],"a":0,"level":2,"why":"It bound the newly conquered city closer to Rome.","sec":"rome-after-the-sack"},{"q":"The dictator Publius Manlius Capitolinus chose a plebeian magister equitum. What was that?","options":["His deputy, the “master of the horse”","His chief priest","His army’s standard-bearer","A judge of criminal trials"],"a":0,"level":2,"why":"Picking a plebeian deputy angered the patricians.","sec":"licinius-and-sextius"},{"q":"Which former consul, roused by the geese, hurled the first Gallic attacker off the Capitoline?","options":["Gaius Licinius","Marcus Papirius","Marcus Manlius","Publius Manlius Capitolinus","Lucius Sextius"],"a":2,"level":2,"why":"The honking geese of Juno woke Marcus Manlius, who threw the first attacker down the slope, saving the citadel.","sec":"sack-of-rome"},{"q":"According to Livy, where was Camillus living in exile before being recalled as dictator to fight the Gauls?","options":["Veii","Clusium","Caere","Cumae","Ardea"],"a":4,"level":2,"why":"Livy places Camillus in exile at Ardea, a town south of Rome. Yet the Greek historians Polybius and Diodorus Siculus never mention him.","sec":"sack-reliability"},{"q":"When the Gauls demanded the Fabius brothers be handed over, what did Rome do?","options":["Elected them consular tribunes for the next year","Put them on trial for murder","Sent them to negotiate again","Exiled them to Ardea","Handed them over in chains"],"a":0,"level":2,"why":"Instead of surrendering the envoys who broke neutrality, Rome honoured them with election as consular tribunes. Enraged, the Gauls marched on Rome.","sec":"battle-of-the-allia"},{"q":"Why did the dictator Publius Manlius Capitolinus anger the patricians?","options":["He refused to fight the Volscians","He handed the Sibylline Books to plebeians","He freed all debtors from prison","He picked a plebeian as his deputy","He resigned after threatening violence"],"a":3,"level":2,"why":"Manlius Capitolinus chose a plebeian deputy, upsetting the patricians. Licinius and Sextius then won a tenth term, and their whole package went through.","sec":"licinius-and-sextius"},{"q":"How did the Licinian laws change the guardianship of the Sibylline Books?","options":["The books were moved to the temple of Juno at Veii","The priesthood was opened only to women","Ten priests replaced two, five of them plebeians","The Senate took over direct control","The books were handed to the tribunes"],"a":2,"level":2,"why":"Two patrician priests were replaced by ten, five of them plebeians. For the first time, the patricians' monopoly on priesthoods was broken.","sec":"licinian-laws"},{"q":"Between 444 and 401 BC, roughly how many of about a hundred consular tribunes were plebeians?","options":["Twenty","None at all","Fifty","Two","Seventy"],"a":3,"level":2,"why":"Although Livy claimed the office was a concession open to plebeians, only two of about a hundred holders in this period were plebeians. Around 400 BC this changed.","sec":"conflict-of-the-orders"},{"q":"Which elderly Roman struck a Gaul with his ivory staff, triggering the massacre in the city?","options":["Marcus Papirius","Marcus Furius Camillus","Lucius Albinus","Lucius Genucius","Marcus Manlius"],"a":0,"level":2,"why":"A Gaul stroked Marcus Papirius's long beard, and Papirius struck him with his staff. The massacre began, and houses were plundered and burned.","sec":"sack-of-rome"},{"q":"How does Cornell's view of the sack differ from Livy's account of Rome being burned and hastily rebuilt?","options":["He thinks the Romans burned the city themselves","He thinks the Gauls left most buildings standing and went home once paid","He thinks the Gauls never actually entered Rome","He thinks the city was rebuilt on an orderly grid","He thinks the Gauls occupied Rome for several decades"],"a":1,"level":2,"why":"Cornell believes the Gauls mainly wanted loot and left once paid. He also notes that haphazard street plans were common in ancient cities anyway.","sec":"rome-after-the-sack"},{"q":"What made Licinius and Sextius finally give way in 370 BC after blocking elections for years?","options":["A revolt by the Fabius family","A new Gallic invasion from the north","An attack on Roman territory by Velitrae","The death of Camillus","An outbreak of plague in Rome"],"a":2,"level":2,"why":"They relented when Velitrae, a town of the Volscians, attacked Roman territory. Even so, the pair were re-elected year after year.","sec":"licinius-and-sextius"},{"q":"What had happened to the Roman siege of Veii by the time Camillus took command?","options":["Veii had offered to surrender on terms","The Roman army had already abandoned the siege","The defenders had destroyed much of the siege equipment","The Gauls had arrived to help Veii","A plague had wiped out the defenders"],"a":2,"level":2,"why":"Rome was already besieging Veii, but the defenders had wrecked much of the Roman siege equipment. So the Romans went underground and dug a tunnel.","sec":"siege-of-veii"},{"q":"How did the debt law of Licinius and Sextius relieve borrowers?","options":["Creditors had to wait ten years before collecting","Debts were transferred to the state treasury","All debts were cancelled outright by decree","Interest already paid was subtracted, the rest due in three yearly instalments","Debtors received public land in place of payment"],"a":3,"level":2,"why":"Interest already paid came off the sum owed, and the remainder could be paid in three equal yearly instalments. Debt weighed heaviest on small farmers.","sec":"licinian-laws"},{"q":"After which law did regular sharing of the consulship between patricians and plebeians begin?","options":["The law of Camillus in 368 BC","The law of Marcus Manlius in 376 BC","The law of Licinius and Sextius in 367 BC","The law of Lucius Genucius in 342 BC","The law of Publius Manlius in 337 BC"],"a":3,"level":2,"why":"Regular sharing started only after the tribune Lucius Genucius's law in 342 BC, which apparently required one consul to be a plebeian.","sec":"modern-verdict"},{"q":"In which year did Rome crush the Senones, though fear of the Gauls still persisted?","options":["350 BC","228 BC","114 BC","387 BC","295 BC"],"a":4,"level":2,"why":"Rome crushed the Senones in 295 BC, but the memory of the Gauls cast a long shadow. Gallic raiders had struck the region in 350 and 349 BC.","sec":"rome-after-the-sack"},{"q":"Which ruler hired Gauls for a war in southern Italy a few months after the sack of Rome?","options":["Dionysius I of Syracuse","Aruns of Clusium","Pyrrhus of Epirus","Tarquinius Superbus of Rome","Brennus of the Senones"],"a":0,"level":2,"why":"Dionysius I of Syracuse hired Gauls shortly afterwards, which supports Cornell's view that the Senones were mercenaries.","sec":"sack-reliability"},{"q":"How many consular tribunes ran Rome in the years when they replaced the consuls?","options":["Just one","Between three and six","Exactly two","Exactly ten","Between eight and twelve"],"a":1,"level":2,"why":"Rome was run by between three and six 'military tribunes with consular power' in those years. Consular tribunes governed in many years up to 376 BC.","sec":"conflict-of-the-orders"},{"q":"According to the geographer Strabo, who defeated the Gauls and recovered the ransom gold?","options":["Camillus, recalled from exile","The city of Clusium","The tyrant of Syracuse","Marcus Manlius's garrison","Caere, Rome's Etruscan ally"],"a":4,"level":2,"why":"Strabo credits Caere with beating the Gauls and recovering the gold. Diodorus instead says an Etruscan army defeated them on their way back from southern Italy.","sec":"sack-reliability"},{"q":"What ransom did famine and disease force the Romans to agree to pay the Gauls?","options":["A hundred talents of silver","The temple treasures of Juno","Ten thousand head of cattle","Half of all public land","About 330 kg (a thousand pounds) of gold"],"a":4,"level":2,"why":"Famine and disease led to a deal of about 330 kg (a thousand pounds) of gold. The Romans complained the Gauls were using rigged weights.","sec":"sack-of-rome"},{"q":"According to Livy, why did a man named Aruns bring the Senones to Clusium?","options":["To win back land stolen from his family","To take revenge on a nobleman whose son seduced his wife","To sell wine to the Gauls","To overthrow the Roman consuls","To avenge his father's murder by Romans"],"a":1,"level":2,"why":"Livy says Aruns sought revenge on a local nobleman whose son had seduced his wife. Historian T. J. Cornell doubts this romantic tale.","sec":"battle-of-the-allia"}],"3":[{"q":"In which year was a plebeian first elected praetor?","options":["367 BC","173 BC","366 BC","342 BC","337 BC","355 BC"],"a":4,"level":3,"why":"Plebeians had to wait thirty years after the compromise, until 337 BC, to win the praetorship. Patricians also kept some of the oldest priesthoods for themselves.","sec":"first-plebeian-consul"},{"q":"According to Livy, what did Camillus vow to the god Apollo during the siege of Veii?","options":["The walls of the conquered city","A golden statue on the Capitoline","A hundred oxen each year","A tenth of the spoils","Half of all captives taken","A new temple inside Veii"],"a":3,"level":3,"why":"Livy says Camillus vowed a tenth of the spoils to Apollo. He also invited Juno, Veii's protecting goddess, to move to Rome.","sec":"siege-of-veii"},{"q":"Up to which year did consular tribunes govern Rome in many years?","options":["376 BC","390 BC","366 BC","401 BC","444 BC","367 BC"],"a":0,"level":3,"why":"Consular tribunes ran Rome in many years up to 376 BC. Around 400 BC plebeians began to form the majority of them in some years.","sec":"conflict-of-the-orders"},{"q":"Which fact suggests that the 367 BC consulship law did not actually guarantee power-sharing?","options":["The praetorship was abolished in 343 BC","Consular tribunes returned from 360 to 350 BC","No consuls were elected from 355 to 343 BC","Both consuls were plebeians from 366 to 355 BC","Both consuls were patricians from 355 to 343 BC","The Senate annulled the law in 355 BC"],"a":4,"level":3,"why":"From 355 to 343 BC, both consuls were patricians, so the law clearly did not guarantee sharing. Cornell suggests it may have been a mere administrative adjustment.","sec":"modern-verdict"},{"q":"A passing citizen, Lucius Albinus, carried the Vestal Virgins and their sacred objects to safety in which city?","options":["Clusium","Caere","Cumae","Velitrae","Veii","Ardea"],"a":1,"level":3,"why":"Albinus gave the Vestals a lift on his wagon to Caere, an allied Etruscan coastal city. Aristotle's 'certain Lucius' who saved Rome might have been this same man.","sec":"sack-of-rome"},{"q":"In which years did Romans bury alive a pair of Gauls and a pair of Greeks?","options":["228, 216 and 114 BC","444, 401 and 375 BC","350, 349 and 295 BC","390, 387 and 367 BC","342, 337 and 173 BC","396, 376 and 366 BC"],"a":0,"level":3,"why":"These burials happened in 228, 216 and 114 BC, even though human sacrifice was not a Roman custom. They show how long the fear of the Gauls lasted.","sec":"rome-after-the-sack"},{"q":"Besides capping holdings of public land, what else did the Licinian land law restrict, and why?","options":["Selling plots there, to stop speculation by Greeks","Grazing more than 100 cattle there, to protect common pasture","Building houses there, to keep it open for armies","Planting vines there, to keep land for grain","Hunting there, to preserve sacred groves","Settling foreigners there, to reserve it for citizens"],"a":1,"level":3,"why":"The law banned grazing more than 100 cattle on public land to protect the pasture poor farmers relied on. Ordinary citizens' own plots were only about half a hectare (one and a quarter acres).","sec":"licinian-laws"},{"q":"What happened in the Plebeian Council in 368 BC, after Camillus resigned as dictator?","options":["It passed the land and debt bills but rejected the consulship bill","It elected consular tribunes for the first time in years","It passed the consulship bill but rejected the land and debt bills","It voted to abolish the tribunate","It passed all three bills, which the Senate vetoed","It rejected all three bills of Licinius and Sextius"],"a":0,"level":3,"why":"The plebeians approved the land and debt measures but turned down the consulship bill. The tribunes insisted on all or nothing, and the full package passed later.","sec":"licinius-and-sextius"},{"q":"What was the dies Alliensis?","options":["The ill-omened anniversary of the Allia, 18 July","The day the Gauls left Rome","The festival of the sacred geese","The day Veii fell"],"a":0,"level":3,"why":"The day of the defeat at the Allia became a day when public business stopped.","sec":"battle-of-the-allia"},{"q":"Livy called some later tribunes mancipia nobilium. What did he mean?","options":["Slaves of the nobility","Friends of the people","Sons of the patricians","Masters of the law"],"a":0,"level":3,"why":"Once in power, the plebeian leaders joined the patricians in a new nobility and forgot the poor.","sec":"modern-verdict"}]},"chronicleMaps":[{"id":"rome-veii","sec":"siege-of-veii","title":"Rome and Veii","caption":"Veii stood on a plateau of soft volcanic rock about 16 km (10 miles) north of Rome, its nearest great rival. Caere, another Etruscan city, was Rome's ally.","bounds":{"latMin":41.72,"latMax":42.14,"lonMin":12,"lonMax":12.72},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"r","dy":-4},{"name":"Veii","lat":42.023,"lon":12.39,"side":"r","dy":-2},{"name":"Caere","lat":41.995,"lon":12.098,"side":"r"}],"peoples":[{"name":"Etruscans","latin":"Etrusci","lat":42.09,"lon":12.2},{"name":"Latins","latin":"Latini","lat":41.78,"lon":12.6}]},{"id":"gauls","sec":"battle-of-the-allia","title":"The Gauls march on Rome","caption":"The Senones came from the Adriatic coast near today's Rimini, by way of Clusium, and met the Romans at the Allia, about 16 km north of Rome. The route is drawn only roughly, and the battlefield's exact site is uncertain.","bounds":{"latMin":41.7,"latMax":44.25,"lonMin":11,"lonMax":13.6},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"l","dy":6},{"name":"Allia","lat":42.03,"lon":12.58,"kind":"battle","side":"r"},{"name":"Clusium","lat":43.017,"lon":11.95,"side":"l"},{"name":"Rimini","lat":44.059,"lon":12.568,"side":"l"}],"peoples":[{"name":"Senones","lat":43.75,"lon":12.95},{"name":"Etruscans","latin":"Etrusci","lat":42.65,"lon":11.75}],"routes":[{"pts":[[43.95,12.55],[43.45,12.15],[43.017,11.95],[42.55,12.2],[42.06,12.56]]}]}],"keyFacts":{"description":"Key facts for this chapter, written by hand from the chapter text. Every entry links to the section that explains it.","people":[{"name":"Marcus Furius Camillus","text":"Dictator who took Veii through a tunnel; in Livy’s story he also drove the Gauls out of Rome.","sec":"siege-of-veii"},{"name":"Brennus","text":"The Gallic chief who won at the Allia and said “Woe to the vanquished!”","sec":"sack-of-rome"},{"name":"Marcus Manlius","text":"Former consul woken by the sacred geese, who threw the first Gaul off the Capitoline.","sec":"sack-of-rome"},{"name":"Lucius Albinus","text":"Citizen who carried the Vestal Virgins and the sacred objects to Caere on his wagon.","sec":"sack-of-rome"},{"name":"Marcus Papirius","text":"Old former magistrate who struck a Gaul with his ivory staff, starting the massacre.","sec":"sack-of-rome"},{"name":"Aruns","text":"The man who, Livy says, brought the Gauls to Clusium to take revenge.","sec":"battle-of-the-allia"},{"name":"Gaius Licinius Stolo","text":"Tribune of the plebs who led the ten-year campaign for the new laws; later fined for breaking his own land limit.","sec":"licinius-and-sextius"},{"name":"Lucius Sextius Lateranus","text":"Licinius’s fellow tribune, Rome’s first plebeian consul in 366 BC.","sec":"first-plebeian-consul"},{"name":"Lucius Genucius","text":"Tribune whose law of 342 BC made sharing the consulship regular.","sec":"modern-verdict"}],"dates":[{"when":"444 BC","text":"Consular tribunes begin to replace the consuls in many years.","sec":"conflict-of-the-orders"},{"when":"c. 396 BC","text":"Camillus takes Veii.","sec":"siege-of-veii"},{"when":"390 BC","text":"The Gauls win at the Allia and sack Rome (traditional date; historians prefer c. 387 BC).","sec":"battle-of-the-allia"},{"when":"375 BC","text":"Licinius and Sextius begin their campaign.","sec":"licinius-and-sextius"},{"when":"367 BC","text":"The Senate accepts the laws of Licinius and Sextius.","sec":"licinius-and-sextius"},{"when":"366 BC","text":"Lucius Sextius becomes the first plebeian consul.","sec":"first-plebeian-consul"},{"when":"342 BC","text":"The law of Genucius: one consul is regularly a plebeian.","sec":"modern-verdict"},{"when":"337 BC","text":"The first plebeian praetor.","sec":"first-plebeian-consul"},{"when":"295 BC","text":"Rome crushes the Senones.","sec":"rome-after-the-sack"}],"terms":[{"latin":"patricii, plebeii","english":"patricians and plebeians","sec":"conflict-of-the-orders"},{"latin":"tribuni militum consulari potestate","english":"“military tribunes with consular power”: consular tribunes","sec":"conflict-of-the-orders"},{"latin":"cuniculus","english":"the tunnel into Veii","sec":"siege-of-veii"},{"latin":"praeda","english":"spoils of war","sec":"siege-of-veii"},{"latin":"Iuno Regina","english":"“Queen Juno”, Veii’s goddess, invited to Rome","sec":"siege-of-veii"},{"latin":"Galli","english":"the Gauls","sec":"battle-of-the-allia"},{"latin":"dies Alliensis","english":"“the day of the Allia”, an ill-omened day","sec":"battle-of-the-allia"},{"latin":"arx","english":"the citadel on the Capitoline","sec":"sack-of-rome"},{"latin":"sellae curules","english":"the ivory chairs of high office","sec":"sack-of-rome"},{"latin":"anseres","english":"the sacred geese of Juno","sec":"sack-of-rome"},{"latin":"Vae victis!","english":"“Woe to the vanquished!”","sec":"sack-of-rome"},{"latin":"civitas sine suffragio","english":"citizenship without the vote","sec":"rome-after-the-sack"},{"latin":"dies religiosus","english":"a day when public business stopped","sec":"rome-after-the-sack"},{"latin":"tribuni plebis","english":"tribunes of the plebs","sec":"licinius-and-sextius"},{"latin":"rogationes","english":"bills put to an assembly","sec":"licinius-and-sextius"},{"latin":"magister equitum","english":"“master of the horse”, a dictator’s deputy","sec":"licinius-and-sextius"},{"latin":"ager publicus","english":"public land of the Roman state","sec":"licinian-laws"},{"latin":"Libri Sibyllini","english":"the Sibylline Books of prophecy","sec":"licinian-laws"},{"latin":"decemviri sacris faciundis","english":"the ten priests who kept the Sibylline Books","sec":"licinian-laws"},{"latin":"nobilitas","english":"the new nobility of patricians and rich plebeians","sec":"modern-verdict"}]}},{"id":"samnite-wars","era":"early-republic","short":"The Samnite Wars","title":"The Samnite Wars","period":"367-290 BC","sources":["Samnite Wars","Latin War"],"briefing":{"title":"Rome, 343 BC","paragraphs":["It is 343 BC. Rome controls the land south to the River Liris. Beyond lies Campania, a fertile plain led by rich Capua. Above it, in the Apennine Mountains, live the Samnites, hill tribes and the strongest people in the region.","A treaty keeps Rome and the Samnites apart, but Samnite armies have penned the Campanians inside Capua, and desperate envoys are begging the Roman Senate for help. Three wars over the next fifty years will decide who dominates Italy."]},"sections":[{"id":"samnites-and-rome","title":"The Samnites and the Road to War","body":"In the mid-fourth century BC, Rome's territory reached south as far as the River Liris. This river divided Latium, the Latin homeland around Rome, from Campania, the fertile plain running down to the Bay of Naples. Beyond that plain rose the Apennine Mountains. There lived the Samnites, a confederation of hill tribes and the strongest people in the region.\n\nThe Samnites spoke Oscan, an Italian language shared with several neighbours. The Campanians who farmed the plain below were descended from Samnite migrants. By now, though, they had their own identity and their own rich cities, chief among them Capua, just north of Naples.\n\nIn 354 BC, according to the ancient historians Livy and Diodorus, Rome and the Samnites signed a treaty, but neither records its terms. Modern historians suspect it made the Liris a dividing line, with Rome's sphere to the north and the Samnites' to the south. That line would collapse into three wars, fought between 343 and 290 BC, that decided who would dominate Italy."},{"id":"first-war-outbreak","title":"How the First Samnite War Began (343 BC)","body":"Our main guide to these wars is Livy, a Roman historian writing about three centuries later. According to him, the first war began almost by accident. The Samnites attacked the Sidicini, a small people north of Campania whose stronghold controlled a valuable crossroads. The Campanians came to the Sidicini's aid and were beaten twice, and the Samnites drove them back behind the walls of Capua.\n\nDesperate, the Campanians sent ambassadors to the Roman Senate, the council of leading men who steered Rome's policy. They offered an alliance and their famous wealth. The senators, Livy says, were tempted but refused, since this would betray their treaty with the Samnites. So the envoys played their last card: they surrendered Capua and all Campania unconditionally to Rome.\n\nNow Roman honour was at stake. When Roman envoys asked the Samnites to spare what had become Roman property, Samnite leaders ordered their armies into Campania within earshot. Rome's fetials, priests who handled formal demands and declarations of war, sought redress, were refused, and war followed."},{"id":"first-war-campaigns","title":"Three Victories, a Mutiny and a Peace (343–341 BC)","body":"In 343 BC both of Rome's consuls, the two chief magistrates elected each year, marched out. Livy credits them with three victories. Marcus Valerius Corvus won the first at Mount Gaurus, near the coastal town of Cumae, with a desperate charge as daylight faded.\n\nIn the second, the Samnites trapped the other consul, Aulus Cornelius Cossus, in a mountain pass. A junior officer, Publius Decius Mus, seized a hilltop with a small band and distracted the enemy while the army escaped. In the third, Valerius rushed to Suessula, a town on Campania's eastern edge, captured the Samnite camp and scattered their foragers. Both consuls celebrated triumphs, Rome's victory parades.\n\nIn 342 BC, the sources say, Roman garrison troops seduced by Campanian luxury plotted a coup and mutinied. Valerius, named dictator, an emergency ruler with sweeping powers, talked them down without bloodshed.\n\nIn 341 BC the Samnites asked for peace and the old treaty was renewed. Rome left the Sidicini to the Samnites but kept its alliance with Capua, a far greater prize."},{"id":"doubting-livy","title":"Can We Trust Livy's First Samnite War?","body":"Modern historians treat Livy's account of the first war cautiously. His Campanian ambassadors give a speech closely modelled on a scene in Thucydides, the Greek historian of the Peloponnesian War, where envoys from Corcyra beg Athens for help. The defiant Samnite assembly is also unlikely to rest on any genuine record.\n\nThe fiercest debate concerns Capua's surrender. Scholars such as Salmon and Forsythe think it was invented, projected back from Capua's real surrender in 211 BC, when Rome punished it for siding with Carthage, the North African trading power. The tale would clear Rome of treaty-breaking and blame scheming Campanians. Others, such as Cornell and Oakley, accept it, noting that voluntary submission was common diplomacy then.\n\nThe battles are doubted too. Decius' hilltop rescue closely resembles a famous episode of 258 BC and may be borrowed from it. Some historians once rejected the whole war, since Diodorus never mentions it. Most now accept it: no Roman would invent a story so embarrassing to Rome."},{"id":"second-war-outbreak","title":"The Great Samnite War Begins (326 BC)","body":"The peace soon frayed. Through the 330s Rome kept pushing into the region, settling 2,500 colonists at Cales, a town on key routes towards Capua and the Samnite mountains. Then in 328 BC Rome founded a colony at Fregellae, on the Liris, in an area the Samnites had recently overrun. They saw it as open aggression.\n\nThe spark came from Naples, then a Greek city made up of an old town, Paleopolis, and a newer one, Neapolis. Livy says Paleopolis attacked Romans living in Campania. Rome demanded redress, was rebuffed, and declared war. Samnite troops helped defend the city.\n\nThe siege produced a lasting innovation. Instead of handing over to the next year's consuls, the commanders, including Quintus Publilius Philo, had their military command extended until the campaign ended, with the title of proconsul. In 326 BC two leading Neapolitans, fed up with the unruly Samnite garrison, let the Romans in. The Second, or Great, Samnite War would last until 304 BC."},{"id":"caudine-forks","title":"Humiliation at the Caudine Forks (321 BC)","body":"Rome's most famous disaster came in 321 BC. The Samnite commander Gaius Pontius sent soldiers disguised as shepherds to spread a false rumour that Luceria, a Roman ally in Apulia in south-eastern Italy, was under attack. The two consuls took the quickest road, through the Caudine Forks, two narrow wooded gorges in the Apennines joined by a tight ravine. The Samnites blocked both ends with felled trees and boulders, trapping the army.\n\nAccording to the story, Pontius asked his elderly father Herennius for advice. Free them all and win Rome's friendship, the old man said, or kill them all and cripple Rome for years. A middle course would neither win friends nor remove enemies. Pontius chose it anyway. The Romans filed out unarmed under the yoke, a frame of spears symbolising subjugation, while the enemy jeered.\n\nRome went into mourning. Then, Livy says, the Senate refused to honour the agreement, arguing the people had never approved it, and the war resumed."},{"id":"second-war-turning","title":"From Defeat to Victory (320–304 BC)","body":"The Great Samnite War dragged on with reverses on both sides. Livy reports Roman revenge in 320 BC, when Luceria was taken and Roman hostages freed, though some historians think the truce that followed actually came from the Caudine agreement. When fighting resumed, the Samnites won at Lautulae in 315 BC.\n\nThen a second front opened. In 311 BC the Etruscans, the wealthy city-states north of Rome, besieged Sutrium, which Rome saw as its key to Etruria. Quintus Fabius Maximus Rullianus, Rome's leading general of the era, sent his Etruscan-speaking brother, disguised as a shepherd, through the dreaded Ciminian Forest, which no Roman had ever crossed. Fabius then marched his army through it. In 310 BC, Livy says, a hard-fought victory at Lake Vadimo first broke Etruscan might.\n\nIn Samnium the Romans took Bovianum, capital of the Pentri, the largest Samnite tribe, in 305 BC. The next year the Samnites sued for peace and the old treaty was restored."},{"id":"third-war-sentinum","title":"The Battle of Sentinum (295 BC)","body":"The Third Samnite War broke out in 298 BC when the Lucanians, a people south of Samnium, asked Rome for protection against a Samnite invasion. The Greek historian Dionysius of Halicarnassus thought Rome acted from fear of Samnite power, not compassion.\n\nThe Samnites knew they could not win alone, so their commander Gellius Egnatius took an army north to rally the Etruscans. By 295 BC Rome faced a coalition of four peoples: Samnites, Etruscans, Umbrians from the hills of central Italy, and Senone Gauls, Celtic warriors on the Adriatic coast. Rome elected its best generals as consuls, Quintus Fabius Maximus Rullianus and Publius Decius Mus, son of the hero of 343 BC.\n\nA Roman raid first drew the Etruscans home. At Sentinum, east of the Apennines, Gallic chariots broke Decius' wing. Decius then devoted himself: he prayed to the gods and charged into the enemy, sacrificing his life. His men rallied, Fabius outflanked the Samnites, and the coalition collapsed."},{"id":"aquilonia-and-the-end","title":"Aquilonia and the Fall of Samnium (293–290 BC)","body":"After Sentinum the Samnites fought on. In 293 BC they raised fresh troops, and some 40,000 men gathered at Aquilonia in north-western Samnium. Elite units swore a sacred oath never to flee, on pain of death.\n\nThe consuls Lucius Papirius Cursor and Spurius Carvilius Maximus attacked Aquilonia and nearby Cominium at once. Tipped off by a deserter, Papirius intercepted twenty elite Samnite companies and took Aquilonia, while Cominium surrendered to Carvilius. One modern historian says Aquilonia sealed the Samnites' fate.\n\nLivy's surviving books stop here; later events come from brief summaries. According to these, a Samnite commander named Gaius Pontius was captured, paraded in a triumph and beheaded. In 291 BC Rome took Venusia, commanding routes into Lucania, Apulia and Samnium, and founded there its largest colony ever. In 290 BC the last resistance was crushed."},{"id":"roman-alliance-system","title":"Why the Samnite Wars Mattered","body":"By 290 BC Rome had become the great power of Italy. Its territory now stretched across the Apennines to the Adriatic, and the Samnites were forced into an alliance with Rome on unequal terms.\n\nThe secret was the alliance system. Allied peoples kept their own governments, but every treaty required them to send soldiers for Rome's wars at their own expense. In return they shared the spoils, which could be considerable, and enjoyed Roman protection. Rome also backed allied ruling families when trouble brewed at home.\n\nThe result was an enormous pool of soldiers. Allied troops already mattered at Sentinum, and later they often outnumbered the Romans. At the battle of Telamon against the Gauls in 225 BC, the Greek historian Polybius counted about 41,000 Romans alongside 210,000 allies. No other Mediterranean state could match such numbers, and this machine carried Rome to victory over Pyrrhus, a Greek king who invaded Italy, and over Carthage."}],"battle":{"name":"Aquilonia","year":"293 BC","enemy":"The Samnites","sec":"aquilonia-and-the-end","intro":"Some 40,000 Samnites gather at Aquilonia. Their elite units have sworn a sacred oath never to flee. The consul Papirius Cursor attacks."},"timelines":[{"name":"Level 1: The Big Moments","blurb":"Four turning points in Rome's long struggle with the Samnites.","events":[{"label":"Rome and the Samnites sign a treaty","when":"354 BC","y":-354,"fact":"Livy and Diodorus record the treaty but not its terms; modern historians suspect it made the River Liris a dividing line.","sec":"samnites-and-rome"},{"label":"Campanians surrender Capua to Rome","when":"343 BC","y":-343,"fact":"After the Senate refused an alliance, Livy says the Campanian envoys handed Capua and all Campania to Rome unconditionally, dragging Rome into war.","sec":"first-war-outbreak"},{"label":"Roman army trapped at the Caudine Forks","when":"321 BC","y":-321,"fact":"The Samnite commander Gaius Pontius blocked both ends of the gorges and sent the Romans out unarmed under the yoke.","sec":"caudine-forks"},{"label":"Decius Mus sacrifices himself","when":"295 BC","y":-295,"fact":"At Sentinum the consul Decius Mus prayed to the gods and charged to his death, and his men rallied to break the coalition.","sec":"third-war-sentinum"}]},{"name":"Level 2: Battles and Colonies","blurb":"Victories, defeats and a new colony across three wars.","events":[{"label":"Valerius wins at Mount Gaurus","when":"343 BC","y":-343,"fact":"The consul Marcus Valerius Corvus won near Cumae with a desperate charge as daylight faded.","sec":"first-war-campaigns"},{"label":"Roman garrison mutinies in Campania","when":"342 BC","y":-342,"fact":"Troops seduced by Campanian luxury plotted a coup, but Valerius, named dictator, talked them down without bloodshed.","sec":"first-war-campaigns"},{"label":"Rome founds a colony at Fregellae","when":"328 BC","y":-328,"fact":"The colony on the Liris lay in an area the Samnites had recently overrun, and they saw it as open aggression.","sec":"second-war-outbreak"},{"label":"Samnites win at Lautulae","when":"315 BC","y":-315,"fact":"When fighting resumed after a truce, the Samnites defeated Rome at Lautulae.","sec":"second-war-turning"},{"label":"Romans capture Bovianum","when":"305 BC","y":-305,"fact":"Bovianum was the capital of the Pentri, the largest Samnite tribe; the Samnites sued for peace the next year.","sec":"second-war-turning"},{"label":"Papirius takes Aquilonia","when":"293 BC","y":-293,"fact":"Tipped off by a deserter, the consul Papirius Cursor intercepted elite Samnite companies and took the town.","sec":"aquilonia-and-the-end"}]},{"name":"Level 3: The Long Road to Mastery","blurb":"From the first peace to Rome's huge allied armies.","events":[{"label":"Old treaty renewed, Capua kept","when":"341 BC","y":-341,"fact":"Rome left the Sidicini to the Samnites but kept its alliance with Capua, a far greater prize.","sec":"first-war-campaigns"},{"label":"Naples opens its gates to Rome","when":"326 BC","y":-326,"fact":"Two leading Neapolitans, fed up with the unruly Samnite garrison, let the Romans into the Greek city.","sec":"second-war-outbreak"},{"label":"Luceria retaken, hostages freed","when":"320 BC","y":-320,"fact":"Livy reports this Roman revenge after the Caudine Forks, though some historians doubt it.","sec":"second-war-turning"},{"label":"Etruscans besiege Sutrium","when":"311 BC","y":-311,"fact":"The Etruscans attacked Sutrium, which Rome saw as its key to Etruria, opening a second front.","sec":"second-war-turning"},{"label":"Etruscan might broken at Lake Vadimo","when":"310 BC","y":-310,"fact":"Livy says this hard-fought victory first broke the power of the Etruscan city-states.","sec":"second-war-turning"},{"label":"Lucanians ask Rome for protection","when":"298 BC","y":-298,"fact":"Their appeal against a Samnite invasion started the Third Samnite War.","sec":"third-war-sentinum"},{"label":"Largest Roman colony founded at Venusia","when":"291 BC","y":-291,"fact":"Venusia commanded routes into Lucania, Apulia and Samnium.","sec":"aquilonia-and-the-end"},{"label":"Rome and allies fight Gauls at Telamon","when":"225 BC","y":-225,"fact":"The Greek historian Polybius counted about 41,000 Romans alongside 210,000 allies.","sec":"roman-alliance-system"}]}],"matches":[{"name":"Who's Who of the Samnite Wars","blurb":"Match each leader to what they did.","pairs":[["Marcus Valerius Corvus","Won at Mount Gaurus and later calmed mutineers as dictator"],["Gaius Pontius","Samnite commander who trapped a Roman army in the Apennine gorges"],["Herennius","Elderly father who said: free all the Romans or kill them all"],["Fabius Maximus Rullianus","Led a Roman army through the dreaded Ciminian Forest"],["Gellius Egnatius","Samnite commander who marched north to rally the Etruscans"]],"secs":["first-war-campaigns","caudine-forks","caudine-forks","second-war-turning","third-war-sentinum"]},{"name":"Words of War","blurb":"Match each term to its meaning.","pairs":[["Fetials","Priests who made formal demands and declared war"],["Dictator","Emergency ruler given sweeping powers"],["Proconsul","Commander whose command was extended until the campaign ended"],["The yoke","Frame of spears that defeated soldiers had to file under"],["Roman allies","Kept their own governments but sent soldiers at their own expense"]],"secs":["first-war-outbreak","first-war-campaigns","second-war-outbreak","caudine-forks","roman-alliance-system"]}],"decks":[{"name":"The First War and Its Doubts","blurb":"How the first war began, and whether Livy got it right.","cards":[{"claim":"The River Liris divided Latium from Campania.","answer":true,"why":"The Liris separated Latium, the Latin homeland around Rome, from the fertile Campanian plain.","sec":"samnites-and-rome"},{"claim":"The Samnites spoke Latin, like the Romans.","answer":false,"why":"The Samnites spoke Oscan, an Italian language shared with several neighbours.","sec":"samnites-and-rome"},{"claim":"The first war began when the Samnites attacked the Sidicini.","answer":true,"why":"The Samnites attacked the Sidicini, a small people north of Campania; the Campanians helped them and were beaten.","sec":"first-war-outbreak"},{"claim":"The Senate eagerly accepted the Campanians' offer of alliance at once.","answer":false,"why":"Livy says the senators were tempted but refused, since an alliance would betray their treaty with the Samnites.","sec":"first-war-outbreak"},{"claim":"Valerius won at Mount Gaurus with a surprise charge at dawn.","answer":false,"why":"He won with a desperate charge as daylight faded.","sec":"first-war-campaigns"},{"claim":"In the peace of 341 BC Rome kept its alliance with Capua.","answer":true,"why":"Rome left the Sidicini to the Samnites but kept Capua, a far greater prize.","sec":"first-war-campaigns"},{"claim":"Livy's Campanian envoys give a speech modelled on a scene in Thucydides.","answer":true,"why":"It closely resembles Thucydides' scene where envoys from Corcyra beg Athens for help.","sec":"doubting-livy"},{"claim":"Salmon and Forsythe accept Capua's surrender in 343 BC as genuine.","answer":false,"why":"Salmon and Forsythe think it was invented, projected back from 211 BC; Cornell and Oakley are the ones who accept it.","sec":"doubting-livy"}]},{"name":"From the Caudine Forks to Mastery","blurb":"The second and third wars and what they built.","cards":[{"claim":"In 328 BC Rome founded a colony at Fregellae, on the Liris.","answer":true,"why":"The Samnites saw this colony, in an area they had recently overrun, as open aggression.","sec":"second-war-outbreak"},{"claim":"Naples was then an Etruscan city.","answer":false,"why":"Naples was a Greek city made up of an old town, Paleopolis, and a newer one, Neapolis.","sec":"second-war-outbreak"},{"claim":"Before the Caudine Forks, Samnite soldiers disguised as merchants spread a false rumour.","answer":false,"why":"They were disguised as shepherds, spreading the rumour that Luceria was under attack.","sec":"caudine-forks"},{"claim":"According to the story, Pontius chose the middle course his father warned against.","answer":true,"why":"Herennius said to free all the Romans or kill them all; Pontius let them go humiliated under the yoke.","sec":"caudine-forks"},{"claim":"Fabius sent his Etruscan-speaking brother through the Ciminian Forest disguised as a shepherd.","answer":true,"why":"After this scouting trip, Fabius marched his army through a forest no Roman had ever crossed.","sec":"second-war-turning"},{"claim":"At Sentinum, Gallic chariots broke the wing commanded by Fabius.","answer":false,"why":"The chariots broke Decius' wing; Decius then sacrificed himself, and Fabius outflanked the Samnites.","sec":"third-war-sentinum"},{"claim":"At Venusia Rome founded its largest colony ever.","answer":true,"why":"Rome took Venusia in 291 BC and settled its largest colony there, commanding routes into three regions.","sec":"aquilonia-and-the-end"},{"claim":"At Telamon in 225 BC, Polybius counted more Romans than allies.","answer":false,"why":"He counted about 41,000 Romans alongside 210,000 allies.","sec":"roman-alliance-system"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Etruscans","Umbrians","Senone Gauls","Lucanians"],"odd":3,"why":"Etruscans, Umbrians and Senone Gauls joined the Samnites' coalition against Rome by 295 BC; the Lucanians instead asked Rome for protection.","sec":"third-war-sentinum"},{"items":["Aulus Cornelius Cossus","Gaius Pontius","Lucius Papirius Cursor","Spurius Carvilius Maximus"],"odd":1,"why":"Cossus, Papirius and Carvilius were Roman consuls; Gaius Pontius was the Samnite commander at the Caudine Forks.","sec":"caudine-forks"},{"items":["Thucydides","Polybius","Livy","Dionysius of Halicarnassus"],"odd":2,"why":"Thucydides, Polybius and Dionysius were Greek historians; Livy was a Roman historian writing about three centuries after the wars.","sec":"doubting-livy"},{"items":["Mount Gaurus","Lake Vadimo","Lautulae","Sentinum"],"odd":2,"why":"Mount Gaurus, Lake Vadimo and Sentinum were Roman victories; at Lautulae in 315 BC the Samnites won.","sec":"second-war-turning"},{"items":["Capua","Cales","Fregellae","Venusia"],"odd":0,"why":"Cales, Fregellae and Venusia received Roman colonists; Capua was the chief Campanian city and Rome's ally, not a Roman colony.","sec":"second-war-outbreak"},{"items":["Consul","Fetial","Dictator","Proconsul"],"odd":1,"why":"Consuls, dictators and proconsuls held power to lead armies; fetials were priests who handled formal demands and declarations of war.","sec":"first-war-outbreak"},{"items":["The war's very existence","Campanian envoys' speech","Decius' hilltop rescue","The defiant Samnite assembly"],"odd":0,"why":"The speech, the rescue and the assembly are suspected of being borrowed or invented; most historians now accept the war itself really happened.","sec":"doubting-livy"}]}],"whos":[{"name":"Roman Commanders","blurb":"Generals and heroes who fought the Samnites.","people":[{"name":"Marcus Valerius Corvus","options":["Marcus Valerius Corvus","Aulus Cornelius Cossus","Lucius Papirius Cursor","Spurius Carvilius Maximus"],"clues":["I rushed to Suessula on Campania's eastern edge and captured the enemy camp.","Named dictator in 342 BC, I talked mutinous soldiers down without bloodshed.","My desperate charge as daylight faded won Rome's first victory of the war.","I won the battle of Mount Gaurus, near Cumae."],"sec":"first-war-campaigns"},{"name":"Publius Decius Mus","options":["Publius Decius Mus","Aulus Cornelius Cossus","Marcus Valerius Corvus","Quintus Fabius Maximus Rullianus"],"clues":["Historians suspect my famous exploit was borrowed from an episode of 258 BC.","I was only a junior officer when a consul was trapped in a mountain pass.","With a small band I seized a hilltop and distracted the enemy while the army escaped.","My son, who shared my name, gave his life at Sentinum."],"sec":"first-war-campaigns"},{"name":"Quintus Fabius Maximus Rullianus","options":["Quintus Fabius Maximus Rullianus","Publius Decius Mus","Quintus Publilius Philo","Marcus Valerius Corvus"],"clues":["In 295 BC I shared the consulship with the son of an earlier war hero.","At Sentinum I outflanked the Samnites after my colleague died.","My Etruscan-speaking brother scouted ahead for me disguised as a shepherd.","I led the first Roman army through the dreaded Ciminian Forest."],"sec":"second-war-turning"},{"name":"Lucius Papirius Cursor","options":["Lucius Papirius Cursor","Spurius Carvilius Maximus","Quintus Fabius Maximus Rullianus","Aulus Cornelius Cossus"],"clues":["Thanks to a deserter's tip, I intercepted twenty elite Samnite companies.","While my colleague took the surrender of Cominium, I attacked the town nearby.","One modern historian says my victory sealed the Samnites' fate.","I captured Aquilonia in 293 BC."],"sec":"aquilonia-and-the-end"}]},{"name":"Rome's Enemies","blurb":"Leaders who stood against Rome.","people":[{"name":"Gaius Pontius","options":["Gaius Pontius","Herennius","Gellius Egnatius","Pyrrhus"],"clues":["Later summaries say a Samnite commander of my name was paraded in a triumph and beheaded.","The story goes that I chose the middle course my father warned against.","I sent soldiers disguised as shepherds to spread a false rumour about Luceria.","I trapped two Roman consuls and their army at the Caudine Forks."],"sec":"caudine-forks"},{"name":"Herennius","options":["Herennius","Gaius Pontius","Gellius Egnatius","Pyrrhus"],"clues":["The story goes that I warned a middle course would neither win friends nor remove enemies.","My advice: free them all for friendship, or kill them all and cripple Rome.","As an elderly man, I was asked what to do with a trapped Roman army.","My son was the Samnite commander at the Caudine Forks."],"sec":"caudine-forks"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Fregellae","lat":41.53666667,"lon":13.53888889,"why":"Rome's colony on the Liris, founded in 328 BC, which the Samnites saw as open aggression.","sec":"second-war-outbreak"},{"name":"Naples","lat":40.8358,"lon":14.2486,"why":"The Greek city whose quarrel with Rome sparked the Great Samnite War and fell to a siege in 326 BC.","sec":"second-war-outbreak"},{"name":"Caudine Forks","lat":41.05,"lon":14.61666667,"why":"The Apennine gorges where the Samnites trapped a Roman army in 321 BC and sent it under the yoke.","sec":"caudine-forks"},{"name":"Lake Vadimo","lat":42.4842,"lon":12.3232,"why":"Site of the hard-fought victory of 310 BC that, Livy says, first broke Etruscan might.","sec":"second-war-turning"},{"name":"Sentinum","lat":43.41848889,"lon":12.85225,"why":"East of the Apennines, where Rome defeated a coalition of four peoples in 295 BC.","sec":"third-war-sentinum"},{"name":"Venusia","lat":40.96176944,"lon":15.81478611,"why":"Taken in 291 BC and settled as Rome's largest colony ever, commanding routes into Lucania, Apulia and Samnium.","sec":"aquilonia-and-the-end"}]}],"quizPool":{"1":[{"q":"What did every treaty with Rome require its allies to provide?","options":["Hostages from every leading family","Soldiers for Rome's wars at their own expense","Annual tribute paid in silver","Warships for the Roman fleet"],"a":1,"level":1,"why":"Allies kept their own governments but had to send soldiers for Rome's wars and pay for them themselves. This gave Rome an enormous pool of manpower.","sec":"roman-alliance-system"},{"q":"What humiliation did the trapped Roman army suffer at the Caudine Forks in 321 BC?","options":["They were forced to burn their own standards","They were sold into slavery in Samnium","They had to hand over their consuls for execution","They filed out unarmed under the yoke"],"a":3,"level":1,"why":"The Romans passed unarmed under the yoke, a frame of spears symbolising subjugation, while the enemy jeered. Rome went into mourning afterwards.","sec":"caudine-forks"},{"q":"How were the Samnites, Rome's great rivals in the Apennines, organised?","options":["As a confederation of hill tribes","As a federation of Celtic war bands","As a single kingdom ruled from Capua","As a league of Greek coastal cities"],"a":0,"level":1,"why":"The Samnites were a confederation of hill tribes living in the Apennine Mountains, and the strongest people in the region. Their homeland rose beyond the fertile Campanian plain.","sec":"samnites-and-rome"},{"q":"Which people asked Rome for protection against a Samnite invasion, triggering the Third Samnite War in 298 BC?","options":["The Lucanians","The Sidicini","The Campanians","The Apulians"],"a":0,"level":1,"why":"The Lucanians, who lived south of Samnium, appealed to Rome when the Samnites invaded. The war that followed lasted until 290 BC.","sec":"third-war-sentinum"},{"q":"According to Livy, which small people did the Samnites attack, sparking the First Samnite War?","options":["The Sidicini","The Umbrians","The Lucanians","The Pentri"],"a":0,"level":1,"why":"The Samnites attacked the Sidicini, whose stronghold north of Campania controlled a valuable crossroads. The Campanians came to their aid and were beaten twice.","sec":"first-war-outbreak"},{"q":"After the Roman Senate turned down their alliance, what did the desperate Campanian envoys do, according to Livy?","options":["Invited a Roman colony to settle at Capua","Surrendered Capua and all Campania unconditionally","Promised Rome an annual tribute of grain","Offered hostages from Capua's leading families"],"a":1,"level":1,"why":"The envoys played their last card by surrendering Capua and all Campania to Rome unconditionally. That made Campania Roman property and put Roman honour at stake.","sec":"first-war-outbreak"},{"q":"Where did Rome found its largest colony ever, in 291 BC?","options":["Luceria","Venusia","Cales","Fregellae"],"a":1,"level":1,"why":"Rome took Venusia, which commanded routes into Lucania, Apulia and Samnium, and founded its largest colony ever there. The last Samnite resistance was crushed the following year.","sec":"aquilonia-and-the-end"},{"q":"Who is our main ancient guide to the Samnite Wars?","options":["Diodorus","Thucydides","Polybius","Livy"],"a":3,"level":1,"why":"Livy, a Roman historian, is the main source, though he wrote about three centuries after the events. Modern historians treat parts of his account cautiously.","sec":"first-war-outbreak"},{"q":"What language did the Samnites speak?","options":["Latin","Greek","Etruscan","Oscan"],"a":3,"level":1,"why":"The Samnites spoke Oscan, an Italian language they shared with several neighbours. The Campanians on the plain below were themselves descended from Samnite migrants.","sec":"samnites-and-rome"},{"q":"When the Samnites trapped a Roman consul's army in a mountain pass in 343 BC, how did Publius Decius Mus save it?","options":["He brought up reinforcements from Capua","He seized a hilltop and distracted the enemy","He bribed the Samnite commander to withdraw","He led the army out through a hidden tunnel"],"a":1,"level":1,"why":"Decius, then a junior officer, seized a hilltop with a small band and drew off the enemy while the army escaped. The trapped consul was Aulus Cornelius Cossus.","sec":"first-war-campaigns"},{"q":"What lasting Roman innovation came out of the siege of Naples?","options":["The appointment of emergency dictators","The creation of a permanent fleet","Extending a command with the title of proconsul","The election of two consuls each year"],"a":2,"level":1,"why":"Instead of handing over to the next year's consuls, the commanders kept their command until the campaign ended, as proconsuls. One of them was Quintus Publilius Philo.","sec":"second-war-outbreak"},{"q":"At Sentinum in 295 BC, what did the consul Publius Decius Mus do after Gallic chariots broke his wing?","options":["He negotiated a truce with the Gauls","He handed his command to his colleague Fabius","He devoted himself and charged to his death","He retreated behind the Roman camp walls"],"a":2,"level":1,"why":"Decius prayed to the gods and charged into the enemy, sacrificing his life. His men rallied, and Fabius outflanked the Samnites to win the battle.","sec":"third-war-sentinum"},{"q":"What were the Caudine Forks, where a Roman army was trapped in 321 BC?","options":["A marshy river crossing on the Liris","A dense forest just north of Rome","A narrow coastal pass near Cumae","Two wooded Apennine gorges joined by a ravine"],"a":3,"level":1,"why":"The Caudine Forks were two narrow wooded gorges in the Apennines joined by a tight ravine. The Samnites blocked both ends with felled trees and boulders.","sec":"caudine-forks"},{"q":"What did elite Samnite units swear before the battle at Aquilonia in 293 BC?","options":["To give no quarter to prisoners","To march on Rome itself","To sacrifice their spoils to the gods","Never to flee, on pain of death"],"a":3,"level":1,"why":"Elite units swore a sacred oath never to flee, on pain of death. Some 40,000 Samnites gathered at Aquilonia in north-western Samnium.","sec":"aquilonia-and-the-end"},{"q":"Which river divided Latium, the Latin homeland around Rome, from Campania?","options":["The Liris","The Arno","The Tiber","The Volturnus"],"a":0,"level":1,"why":"In the mid-fourth century BC, Rome's territory reached south as far as the River Liris, the boundary between Latium and Campania. Modern historians suspect the 354 BC treaty made it a dividing line between Rome and the Samnites.","sec":"samnites-and-rome"},{"q":"Where did Marcus Valerius Corvus win the first Roman victory of the First Samnite War?","options":["Lautulae","Sentinum","Mount Gaurus","Suessula"],"a":2,"level":1,"why":"Valerius won at Mount Gaurus, near Cumae, with a desperate charge as daylight faded. Livy credits Rome with three victories in 343 BC.","sec":"first-war-campaigns"},{"q":"Why do most historians now accept that the First Samnite War really happened?","options":["Diodorus describes it in great detail","No Roman would invent a story so embarrassing","Archaeologists have found its battlefields","Greek inscriptions record its peace treaty"],"a":1,"level":1,"why":"The war's embarrassing details make it unlikely to be a Roman invention. Some historians once rejected it entirely because Diodorus never mentions it.","sec":"doubting-livy"},{"q":"Which city provided the spark for the Second Samnite War?","options":["Naples","Cumae","Luceria","Capua"],"a":0,"level":1,"why":"Naples, then a Greek city, was the spark: Livy says its old town, Paleopolis, attacked Romans living in Campania. Samnite troops helped defend the city against Rome.","sec":"second-war-outbreak"}],"2":[{"q":"Which town, seen by Rome as its key to Etruria, did the Etruscans besiege in 311 BC?","options":["Cales","Fregellae","Cumae","Sutrium","Venusia"],"a":3,"level":2,"why":"The Etruscan siege of Sutrium opened a second front for Rome during the Great Samnite War. Fabius Maximus Rullianus answered with his march through the Ciminian Forest.","sec":"second-war-turning"},{"q":"According to the story of the Caudine Forks, what did Pontius' elderly father Herennius advise?","options":["Free them all or kill them all, but nothing in between","Keep the army hostage until Rome surrendered Campania","Ransom the consuls and kill the soldiers","Sell the captives to Greek slave traders","Send the Romans home under the yoke"],"a":0,"level":2,"why":"Herennius said freeing everyone would win Rome's friendship and killing everyone would cripple Rome, while a middle course would do neither. Pontius chose the middle course anyway.","sec":"caudine-forks"},{"q":"Why did the Samnites see Rome's colony at Fregellae, founded in 328 BC, as open aggression?","options":["It lay on the Liris in an area they had recently overrun","It was built inside the Samnite capital","It was founded during a sworn truce","It blocked the road from Capua to Naples","It was settled by Campanian rebels"],"a":0,"level":2,"why":"Fregellae sat on the Liris in territory the Samnites had recently taken. It followed Rome's earlier settlement of 2,500 colonists at Cales.","sec":"second-war-outbreak"},{"q":"Why must historians rely on brief summaries for the events after Aquilonia?","options":["Polybius began his history only in 225 BC","Diodorus refused to write about Rome","The Samnites destroyed the Roman archives","Roman records burned in a Gallic sack","Livy's surviving books stop at that point"],"a":4,"level":2,"why":"Livy's surviving books end with Aquilonia, so later events come from short summaries. These report that a Samnite commander named Gaius Pontius was captured, paraded in a triumph and beheaded.","sec":"aquilonia-and-the-end"},{"q":"According to Livy, why did the Roman Senate at first refuse the Campanians' offer of alliance?","options":["Rome was already at war with the Etruscans","The consuls refused to lead an army south","Campania was too far from Rome to defend","The Campanians had attacked Roman colonists","It would betray Rome's treaty with the Samnites"],"a":4,"level":2,"why":"The senators were tempted by Campanian wealth but would not break their treaty with the Samnites. Only after Campania surrendered itself to Rome did Roman honour become involved.","sec":"first-war-outbreak"},{"q":"Scholars such as Salmon and Forsythe think the story of Capua's surrender in 343 BC was projected back from which later event?","options":["Capua's real surrender in 211 BC after siding with Carthage","The Caudine Forks disaster of 321 BC","The founding of Venusia in 291 BC","The battle of Telamon in 225 BC","The siege of Naples in 326 BC"],"a":0,"level":2,"why":"They argue the earlier surrender was invented on the model of 211 BC, when Rome punished Capua for siding with Carthage. Such a tale would clear Rome of treaty-breaking and blame scheming Campanians.","sec":"doubting-livy"},{"q":"How did the consul Papirius manage to intercept twenty elite Samnite companies at Aquilonia in 293 BC?","options":["He crossed a forest no Roman had entered","He was tipped off by a deserter","He disguised his men as shepherds","He bribed the Samnite commander","His colleague drew the Samnites into a trap"],"a":1,"level":2,"why":"A deserter tipped off Papirius, who intercepted the elite companies and took Aquilonia. At the same time nearby Cominium surrendered to his colleague Carvilius.","sec":"aquilonia-and-the-end"},{"q":"Where did the Samnites win a victory over Rome in 315 BC, during the Great Samnite War?","options":["Lake Vadimo","Aquilonia","Mount Gaurus","Sentinum","Lautulae"],"a":4,"level":2,"why":"When fighting resumed after the truce, the Samnites won at Lautulae in 315 BC. The war saw reverses on both sides.","sec":"second-war-turning"},{"q":"Under the peace of 341 BC that ended the First Samnite War, what did Rome do?","options":["Left the Sidicini to the Samnites but kept Capua","Gave up all claims north of the Liris","Founded a colony at Fregellae","Received Samnite hostages and tribute","Annexed the Sidicini and abandoned Capua"],"a":0,"level":2,"why":"Rome let the Samnites have the Sidicini but held on to its alliance with Capua. The old treaty with the Samnites was renewed.","sec":"first-war-campaigns"},{"q":"What did the Greek historian Dionysius of Halicarnassus think really motivated Rome to protect the Lucanians in 298 BC?","options":["A desire to found a colony at Venusia","Hope of seizing Lucanian silver mines","Compassion for a weak neighbour","Fear of Samnite power","A sacred obligation under fetial law"],"a":3,"level":2,"why":"Dionysius believed Rome acted from fear of Samnite power, not compassion. The Lucanians' appeal triggered the Third Samnite War.","sec":"third-war-sentinum"},{"q":"According to Livy, which hard-fought Roman victory in 310 BC first broke Etruscan might?","options":["Sentinum","Cominium","Lake Vadimo","Sutrium","Suessula"],"a":2,"level":2,"why":"Livy places the victory at Lake Vadimo in 310 BC. It followed Fabius' daring march through the Ciminian Forest.","sec":"second-war-turning"},{"q":"The speech Livy gives the Campanian ambassadors closely resembles a scene in which earlier historian?","options":["Polybius","Dionysius of Halicarnassus","Diodorus","Thucydides","Herodotus"],"a":3,"level":2,"why":"The speech is modelled on Thucydides' scene in which envoys from Corcyra beg Athens for help. This is one reason modern historians treat Livy's account cautiously.","sec":"doubting-livy"},{"q":"Which rich city, just north of Naples, was the chief city of the Campanians?","options":["Capua","Cumae","Suessula","Cales","Luceria"],"a":0,"level":2,"why":"Capua was the chief Campanian city. When Rome made peace in 341 BC it kept its alliance with Capua, a far greater prize than the Sidicini.","sec":"samnites-and-rome"},{"q":"Which Samnite commander took an army north to rally the Etruscans during the Third Samnite War?","options":["Herennius Pontius","Spurius Carvilius","Lucius Papirius","Gellius Egnatius","Gaius Pontius"],"a":3,"level":2,"why":"Knowing they could not win alone, the Samnites sent Gellius Egnatius north to build a coalition. By 295 BC Rome faced four peoples at once.","sec":"third-war-sentinum"},{"q":"How was the mutiny of Roman garrison troops in Campania in 342 BC ended, according to the sources?","options":["Valerius, named dictator, talked them down peacefully","The Campanians handed the mutineers over to Rome","The ringleaders were executed by the consuls","The troops were disbanded and sent home","The Senate paid them to return to duty"],"a":0,"level":2,"why":"Valerius was appointed dictator, an emergency ruler with sweeping powers, and ended the mutiny without bloodshed. The sources say the troops had been seduced by Campanian luxury.","sec":"first-war-campaigns"},{"q":"Where did Rome settle 2,500 colonists in the 330s BC, on key routes towards Capua and the Samnite mountains?","options":["Sutrium","Cales","Bovianum","Suessula","Luceria"],"a":1,"level":2,"why":"Rome planted 2,500 colonists at Cales as it kept pushing into the region. Tensions grew further with the colony at Fregellae in 328 BC.","sec":"second-war-outbreak"},{"q":"How did the Samnite commander Gaius Pontius lure the Roman army towards the Caudine Forks?","options":["By sending a deserter to betray the Samnite camp","By having fake shepherds claim Luceria was under attack","By forging a letter from the Roman Senate","By offering to surrender Bovianum","By attacking Capua and drawing the consuls south"],"a":1,"level":2,"why":"Pontius sent soldiers disguised as shepherds to spread a false rumour about Luceria, a Roman ally in Apulia. The consuls took the quickest route, straight into the trap.","sec":"caudine-forks"},{"q":"Who were Rome's fetials, who sought redress from the Samnites before war in 343 BC?","options":["Magistrates elected to lead armies","Priests handling formal demands and declarations of war","Senators who negotiated peace treaties","Envoys chosen from allied cities","Officers who commanded garrison troops"],"a":1,"level":2,"why":"The fetials were priests in charge of formal demands and declarations of war. When the Samnites refused redress, war followed.","sec":"first-war-outbreak"},{"q":"From whom were the Campanians who farmed the plain below the Apennines descended?","options":["Latin colonists","Greek colonists","Samnite migrants","Gallic invaders","Etruscan settlers"],"a":2,"level":2,"why":"The Campanians descended from Samnite migrants, but by the mid-fourth century BC they had their own identity. They also had their own rich cities.","sec":"samnites-and-rome"}],"3":[{"q":"What argument do scholars such as Cornell and Oakley make for accepting the story of Capua's surrender to Rome?","options":["The Samnites admitted it in their treaty","Capua's coins show Roman symbols from 343 BC","Livy copied it from Campanian archives","Diodorus confirms it independently","Voluntary submission was common diplomacy then","Thucydides records a similar event"],"a":4,"level":3,"why":"Cornell and Oakley note that voluntary submission was a normal diplomatic move at the time. Salmon and Forsythe, by contrast, think the story was invented.","sec":"doubting-livy"},{"q":"In 305 BC the Romans captured Bovianum. Wha
