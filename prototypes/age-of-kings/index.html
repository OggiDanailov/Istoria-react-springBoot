 who interpreted the unwritten law","sec":"demand-for-written-law"},{"latin":"decemviri","english":"“ten men” who wrote down the laws","sec":"demand-for-written-law"},{"latin":"patria potestas","english":"“power of the father”","sec":"twelve-tables"},{"latin":"conubium","english":"the right to marry","sec":"twelve-tables"},{"latin":"provocatio","english":"the right of appeal","sec":"appius-claudius-and-verginia"}]}},{"id":"conflict-of-orders-resolution","era":"early-republic","short":"Toward Equality","title":"The Conflict of the Orders: Toward Resolution","period":"450-367 BC","sources":["Licinio-Sextian rogations","Battle of Veii","Battle of the Allia"],"briefing":{"title":"Rome, around 390 BC","paragraphs":["Rome is a small but ambitious city on the river Tiber, just 16 km from its great Etruscan rival, Veii. At home, a small hereditary aristocracy, the patricians, controls the top offices and the Senate. The plebeian majority, many of them small farmers, are buried in debt and short of land.","Within a few decades Rome will conquer Veii and be humiliated by Gallic warriors who sack the city. Then comes a bitter ten-year political fight at home. At stake: who may rule Rome, and whether ordinary citizens will finally get relief."]},"sections":[{"id":"conflict-of-the-orders","title":"Patricians, Plebeians and a Puzzling Office","body":"In the early Roman Republic, the city was divided in two. On one side stood the patricians (*patricii*), a small hereditary aristocracy who owned large estates, lent money and believed that ruling was their birthright. On the other stood the plebeians (*plebeii*, together the *plebs*), the great majority of ordinary Romans.\n\nTheir rivalry lasted some two hundred years and is known as the Conflict of the Orders (*ordines*, the ranks of society). It shaped Roman politics throughout the Republic's first two centuries. The patricians held power by monopolising the consulship (*consulatus*), the two top offices of state filled each year. They also held the seats of the Senate (*senatus*), Rome's powerful council of elders. Many plebeians, especially small farmers, were buried in debt and short of land.\n\nFrom 444 BC, Rome often replaced its two consuls with a stranger arrangement. In those years it was run by between three and six “military tribunes with consular power” (*tribuni militum consulari potestate*), usually called consular tribunes. The Roman historian Livy (*Titus Livius*), writing centuries later, said this office was created as a concession because it was open to plebeians.\n\nThe record tells a different story. Between 444 and 401 BC, only two of about a hundred consular tribunes were plebeians. Around 400 BC this changed, and in some years plebeians made up the majority. Consular tribunes governed Rome in many years up to 376 BC."},{"id":"siege-of-veii","title":"The Fall of Veii","body":"Veii was a large Etruscan city just 16 km (10 miles) from Rome. The Etruscans were a wealthy people whose cities lay in what is now Tuscany. For years Rome and Veii fought a long, seesawing war, with victories and defeats on both sides.\n\nAround 396 BC, after a string of Roman setbacks, the Romans chose Marcus Furius Camillus as dictator. In the Republic, a dictator was an emergency commander given sweeping powers for six months, not a tyrant. When Camillus took over, Rome was already besieging Veii, and the defenders had destroyed much of the Roman siege equipment.\n\nSo the Romans went underground. They dug a tunnel (*cuniculus*) through the soft volcanic rock on which Veii stood. According to Livy, Camillus vowed a tenth of the spoils (*praeda*) to the god Apollo. He also invited Juno (*Iuno Regina*, \"Queen Juno\"), Veii's protecting goddess, to move to Rome and receive a worthy temple there.\n\nCamillus then threw his larger army at the walls from every side. The astonished defenders rushed to man them. Meanwhile, picked Roman troops climbed out of the tunnel inside Juno's own temple and overwhelmed the city.\n\nThe survivors were enslaved and Romans resettled the site. The destruction of Veii secured Rome's growing place in central Italy."},{"id":"battle-of-the-allia","title":"Disaster at the Allia","body":"The Senones were a tribe of Gauls (*Galli*), one of several Celtic peoples who had recently pushed into northern Italy. They settled on the Adriatic coast around modern Rimini.\n\nAccording to Livy, a man named Aruns brought the Senones to Clusium, an Etruscan town now called Chiusi. He wanted revenge on a local nobleman whose son had seduced his wife. Alarmed, Clusium appealed to Rome. Rome sent three brothers of the powerful Fabius family as ambassadors. When fighting broke out, the brothers joined in and one killed a Gallic chieftain. This broke the rule that envoys must stay neutral. The Gauls demanded the brothers be handed over. Instead, the Romans elected them consular tribunes for the next year. Enraged, the Gauls marched on Rome.\n\nThe armies met where the Allia brook joins the river Tiber, about 16 km north of the city. Livy says the Romans pitched no camp and failed to consult the gods. They also stretched their line dangerously thin. Brennus, the Gallic chief, attacked the Roman reserves on a hill, and panic spread. Many Romans drowned in the Tiber. Most survivors fled to Veii, while others ran back to Rome.\n\nTradition dates the battle to 390 BC, but modern historians prefer around 387 BC. Its anniversary, 18 July, became an ill-omened day (*dies Alliensis*, \"the day of the Allia\")."},{"id":"sack-of-rome","title":"The Gauls in Rome","body":"According to Livy, the Gauls found Rome's gates open and its walls unguarded. The fighting men and able-bodied senators had withdrawn to the Capitoline (*Capitolium*), Rome's fortified citadel (*arx*) hill. The Vestal Virgins (*Virgines Vestales*), priestesses who guarded the sacred hearth of the city, carried off the sacred objects. A passing citizen, Lucius Albinus, gave them a lift on his wagon to Caere, an allied Etruscan city on the coast.\n\nThe old men who had held high office stayed behind. They sat outside their houses on ivory chairs (*sellae curules*), dressed in their ceremonial robes. The Gauls stared at them as if they were statues. Then one Gaul stroked the long beard of Marcus Papirius, who struck him with his ivory staff (*scipio eburneus*). The massacre began, and houses were plundered and burned.\n\nOne night the Gauls scaled the Capitoline cliff. The guards and dogs slept, but the sacred geese (*anseres*) of Juno honked. Their noise roused Marcus Manlius, a former consul, who hurled the first attacker down the slope.\n\nFamine and disease finally forced a deal: a ransom of about 330 kg (a thousand pounds) of gold. When the Romans complained that the Gauls were using rigged weights, Brennus threw his sword onto the scales and declared, “Woe to the vanquished!” (*Vae victis!*) In Livy's telling, Camillus arrived just in time, cancelled the deal and routed the Gauls."},{"id":"sack-reliability","title":"Did Camillus Really Save Rome?","body":"All accounts of the Allia and the sack of Rome were written centuries after the events, so their reliability is doubtful. The biggest suspect is the heroic rescue by Camillus, the conqueror of Veii. According to Livy, Camillus was in exile at Ardea, a town south of Rome, and was recalled as dictator. But the Greek historians Polybius and Diodorus Siculus never mention him. Many modern historians see his role as a later addition.\n\nOther ancient writers told different stories. Diodorus says an Etruscan army defeated the Gauls as they returned from southern Italy. The geographer Strabo claims that Caere, Rome's Etruscan ally, beat them and recovered the ransom gold. The Greek philosopher Aristotle reportedly said Rome's saviour was “a certain Lucius”. That might be Lucius Albinus, the man who carried the priestesses to Caere.\n\nThe historian T. J. Cornell doubts the romantic tale of Aruns's revenge. No account mentions Gallic wives or children, so the Senones looked like a warrior band, not migrants seeking land. He thinks they were mercenaries. A few months later, Dionysius I, the ruler of Syracuse in Sicily, hired Gauls for a war in southern Italy.\n\nArchaeology finds no layer of destruction from this date. Scorch marks once linked to the sack have been redated to the fall of the monarchy over a century earlier."},{"id":"rome-after-the-sack","title":"Recovery and a Lasting Fear","body":"Livy wrote that Rome was burned and then rebuilt in a hurry, leaving it with tangled streets. Cornell thinks the Gauls mainly wanted loot. In his view they left most buildings standing and went home once they were paid. Haphazard street plans, he notes, were common in ancient cities anyway.\n\nRome bounced back quickly. It bound newly conquered Veii closer by giving its people citizenship without the right to vote (*civitas sine suffragio*). It also strengthened its alliance with Caere. A few years after the sack, Rome began a huge new city wall, 11 km long. The old wall had used crumbly local stone. The new one was built of a better yellow stone quarried in Veii's territory.\n\nThe memory of the Gauls cast a long shadow. Gallic raiders struck the surrounding region in 350 and 349 BC. Even after Rome crushed the Senones in 295 BC, fear persisted. In 228, 216 and 114 BC, Romans buried alive a pair of Gauls and a pair of Greeks, although human sacrifice was not a Roman custom.\n\nLater writers treated the anniversary of the Allia as a day of ritual prohibition (*dies religiosus*), when public business stopped. Some scholars caution, however, that this custom is attested only from the 1st century BC and may be a later invention."},{"id":"licinius-and-sextius","title":"Ten Years of Struggle","body":"In 375 BC, two tribunes of the plebs (*tribuni plebis*), Gaius Licinius Stolo and Lucius Sextius Lateranus, launched a campaign that would last a decade. Tribunes were officials elected by the plebeians to protect them, and they could block official business with a veto (\"I forbid\").\n\nThe pair put three bills (*rogationes*) to the Plebeian Council (*concilium plebis*), the assembly of the plebeians. One eased debt and one limited land holdings. The third abolished the consular tribunes, restored the consuls and required one consul to be a plebeian.\n\nThe patricians were furious about the last bill. They persuaded other tribunes to veto it. Licinius and Sextius struck back by blocking the election of consular tribunes for five years. They gave way only in 370 BC, when Velitrae, a town of the Volscians, a people south-east of Rome, attacked Roman territory.\n\nThe pair were re-elected year after year. In 368 BC the Senate named Camillus dictator, and he threatened violence before resigning for unclear reasons. The plebeians passed the land and debt bills but rejected the consulship bill. The tribunes insisted on all or nothing.\n\nA second dictator, Publius Manlius Capitolinus, angered patricians by picking a plebeian deputy, a \"master of the horse\" (*magister equitum*). Licinius and Sextius won a tenth term, and their whole package went through. In 367 BC, battered by years of strife, the Senate accepted it."},{"id":"licinian-laws","title":"Debt, Land and Sacred Books","body":"The laws of Licinius and Sextius tackled the plebeians' most painful problems. Debt weighed heavily on small farmers, whose creditors were usually wealthy patricians. Under the new debt law, interest (*faenus*) already paid was subtracted from the sum owed. The rest could be paid off in three equal yearly instalments.\n\nThe land law targeted public land (*ager publicus*) owned by the Roman state. Ordinary citizens received small plots of about half a hectare (one and a quarter acres), barely enough to feed a family. Rich landowners, meanwhile, grabbed huge swathes of public land for themselves. The law limited any individual to about 120 hectares (300 acres) of it. It also banned grazing more than 100 cattle there, to protect the common pasture poor farmers relied on. Such laws were easy to dodge. Licinius himself was later fined for breaking his own limit.\n\nA fourth law concerned the Sibylline Books (*Libri Sibyllini*), a collection of prophecies. According to tradition, Tarquinius Superbus, Rome's seventh and last king, bought them from a prophetess, the Sibyl (*Sibylla*), at Cumae, a Greek city near Naples. Two patrician priests guarded the books and consulted them in times of plague, famine or war. The new law replaced them with ten priests (*decemviri sacris faciundis*, \"ten men for performing the sacred rites\"), five of them plebeians. For the first time, the patricians' monopoly on priesthoods was broken."},{"id":"first-plebeian-consul","title":"The First Plebeian Consul","body":"The most famous of the laws of Licinius and Sextius ended government by consular tribunes. It brought back the two consuls each year and required one of them to be a plebeian.\n\nIn 366 BC Lucius Sextius Lateranus, one of the two tribunes who had led the long campaign, became Rome's first plebeian consul. The patricians refused to confirm his election, and riots broke out. The plebeians came close to seceding (*secessio*), that is, staging a mass walkout from the city, as they had done before.\n\nAccording to Livy, the aged Camillus brokered a compromise. The nobles accepted a plebeian consul. In return, the plebeians agreed that a new official, the praetor, would be a patrician. The praetor served as Rome's chief judge, presiding over criminal trials. He could also command an army. Livy concluded that the two orders (*ordines*) were “at length brought into harmony”.\n\nThe new arrangement did not end every barrier. Plebeians had to wait thirty years, until 337 BC, before one of them was elected praetor. Other priesthoods opened to plebeians over time, although patricians kept some of the oldest for themselves."},{"id":"modern-verdict","title":"What Historians Make of It","body":"The historian T. J. Cornell believes very little of Livy's dramatic story can be trusted. However, he considers the actual changes in government reasonably certain.\n\nHe also finds the consulship law puzzling. Plebeians had already served as consular tribunes, so why was a plebeian consul such a landmark? And the law did not guarantee sharing. From 355 to 343 BC, both consuls were patricians. Regular sharing began only after the law of Lucius Genucius, a tribune, in 342 BC. That law apparently required one consul to be a plebeian. Two plebeians did not hold the consulship together until 173 BC. Seen this way, the 367 BC law may have been a mere administrative adjustment.\n\nCornell sees its real importance elsewhere. Earlier plebeian officeholders, he argues, were dependants of patrician patrons with no ties to the plebeian movement. Licinius and Sextius opened top office to the movement's own leaders. These were wealthy, ambitious men who used the cause of the poor to enter the ruling class.\n\nOnce inside, they formed a new aristocracy, the nobility (*nobilitas*), with the patricians and turned their backs on the poor. Ordinary plebeians gained temporary relief but lost control of their organisation. The tribunate became a stepping stone for young nobles, and Livy called some tribunes “slaves of the nobility” (*mancipia nobilium*)."}],"battle":{"name":"The Fall of Veii","year":"c. 396 BC","enemy":"Veii","sec":"siege-of-veii","intro":"Veii, a great Etruscan city just 16 km from Rome, has held out for years. Camillus, named dictator, has a plan: a tunnel through the soft rock beneath the walls."},"timelines":[{"name":"The Big Turning Points","blurb":"Four milestones from Rome's struggles at home and abroad.","events":[{"label":"Consular tribunes replace the consuls","when":"444 BC","y":-444,"fact":"From 444 BC Rome was often run by three to six 'military tribunes with consular power' instead of two consuls.","sec":"conflict-of-the-orders"},{"label":"Camillus captures Veii","when":"Around 396 BC","y":-396,"fact":"Roman troops climbed out of a tunnel inside Juno's temple while Veii's defenders rushed to the walls.","sec":"siege-of-veii"},{"label":"Senate accepts the tribunes' reforms","when":"367 BC","y":-367,"fact":"After ten years of strife, the Senate accepted the whole package of laws pushed by Licinius and Sextius.","sec":"licinius-and-sextius"},{"label":"Rome crushes the Senones","when":"295 BC","y":-295,"fact":"Even after Rome crushed this Gallic tribe, Roman fear of the Gauls persisted for centuries.","sec":"rome-after-the-sack"}]},{"name":"From Gauls to Plebeian Consuls","blurb":"Six steps from a military disaster to shared high office.","events":[{"label":"Plebeians dominate consular tribunes","when":"Around 400 BC","y":-400,"fact":"After only two plebeians among about a hundred consular tribunes, plebeians made up the majority in some years from around 400 BC.","sec":"conflict-of-the-orders"},{"label":"Romans routed at the Allia","when":"390 BC by tradition (c. 387 BC)","y":-390,"fact":"Brennus attacked the Roman reserves on a hill, panic spread, and many Romans drowned in the Tiber.","sec":"battle-of-the-allia"},{"label":"Two tribunes launch a ten-year campaign","when":"375 BC","y":-375,"fact":"Gaius Licinius Stolo and Lucius Sextius Lateranus put bills on debt, land and the consulship to the Plebeian Council.","sec":"licinius-and-sextius"},{"label":"Sextius becomes first plebeian consul","when":"366 BC","y":-366,"fact":"Patricians refused to confirm Sextius's election, riots broke out, and the plebeians came close to a mass walkout.","sec":"first-plebeian-consul"},{"label":"Law of Genucius shares the consulship","when":"342 BC","y":-342,"fact":"The law of the tribune Lucius Genucius apparently required one consul to be a plebeian, and regular sharing began.","sec":"modern-verdict"},{"label":"First plebeian praetor elected","when":"337 BC","y":-337,"fact":"Plebeians had to wait thirty years after the 366 BC compromise before one of them became praetor, Rome's chief judge.","sec":"first-plebeian-consul"}]},{"name":"A Century of Fear and Reform","blurb":"Eight events, from Veii's fall to long-delayed equality.","events":[{"label":"Romans tunnel into Veii","when":"Around 396 BC","y":-396,"fact":"The Romans dug through the soft volcanic rock beneath Veii after the defenders wrecked their siege equipment.","sec":"siege-of-veii"},{"label":"Gauls sack Rome","when":"390 BC by tradition (c. 387 BC)","y":-390,"fact":"According to Livy, the Gauls found the gates open, massacred the old ex-officials and plundered and burned houses.","sec":"sack-of-rome"},{"label":"Tribunes yield after Velitrae attacks","when":"370 BC","y":-370,"fact":"Licinius and Sextius ended their five-year block on elections when Velitrae, a Volscian town, attacked Roman land.","sec":"licinius-and-sextius"},{"label":"Senate names Camillus dictator again","when":"368 BC","y":-368,"fact":"Camillus threatened violence against the reformers, then resigned for unclear reasons.","sec":"licinius-and-sextius"},{"label":"Run of all-patrician consuls begins","when":"355 BC","y":-355,"fact":"From 355 to 343 BC both consuls were patricians, showing the 367 BC law did not guarantee sharing.","sec":"modern-verdict"},{"label":"Gallic raiders strike near Rome","when":"350 BC","y":-350,"fact":"Gallic raiders struck the region around Rome in 350 and again in 349 BC.","sec":"rome-after-the-sack"},{"label":"Gauls and Greeks buried alive","when":"228 BC","y":-228,"fact":"In 228, 216 and 114 BC Romans buried alive a pair of Gauls and a pair of Greeks, though human sacrifice was not a Roman custom.","sec":"rome-after-the-sack"},{"label":"Two plebeians share the consulship","when":"173 BC","y":-173,"fact":"Only in 173 BC did two plebeians hold the consulship together for the first time.","sec":"modern-verdict"}]}],"matches":[{"name":"Heroes and Villains of the Sack","blurb":"Match each figure to their moment in the Gallic crisis.","pairs":[["Marcus Furius Camillus","Dictator who took Veii by tunnel"],["Brennus","Gallic chief who threw his sword on the scales"],["Marcus Manlius","Ex-consul, woken by geese, who threw the first Gaul off the cliff"],["Lucius Albinus","Citizen who carried the Vestal Virgins to Caere by wagon"],["Marcus Papirius","Old ex-official who struck a Gaul for stroking his beard"]],"secs":["siege-of-veii","sack-of-rome","sack-of-rome","sack-of-rome","sack-of-rome"]},{"name":"Offices and Terms","blurb":"Match each Roman term to what it meant.","pairs":[["Consular tribunes","Three to six officials who often replaced the two consuls"],["Dictator","Emergency commander with sweeping powers for six months"],["Tribune of the plebs","Plebeian-elected protector who could veto official business"],["Praetor","Chief judge, first reserved for patricians in 366 BC"],["Sibylline Books","Prophecies consulted in times of plague, famine or war"]],"secs":["conflict-of-the-orders","siege-of-veii","licinius-and-sextius","first-plebeian-consul","licinian-laws"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Vae victis!","“Woe to the vanquished!”, said by Brennus"],["Cuniculus","The tunnel the Romans dug into Veii"],["Dies Alliensis","The ill-omened anniversary of the Allia"],["Ager publicus","Public land owned by the Roman state"],["Civitas sine suffragio","Citizenship without the right to vote"],["Magister equitum","“Master of the horse”: a dictator’s deputy"]],"secs":["sack-of-rome","siege-of-veii","battle-of-the-allia","licinian-laws","rome-after-the-sack","licinius-and-sextius"]}],"decks":[{"name":"Veii and the Gauls","blurb":"Conquest, catastrophe and the stories told about them.","cards":[{"claim":"Veii, the Etruscan city Rome besieged, lay just 16 km from Rome.","answer":true,"why":"Veii was a large Etruscan city only 16 km (10 miles) from Rome.","sec":"siege-of-veii"},{"claim":"Roman troops emerged from their tunnel inside the temple of Apollo at Veii.","answer":false,"why":"They climbed out inside the temple of Juno, Veii's protecting goddess. Apollo was promised a tenth of the spoils.","sec":"siege-of-veii"},{"claim":"The Senones, a Gallic tribe, settled on the Adriatic coast around modern Rimini.","answer":true,"why":"The Senones were one of several Celtic peoples who had pushed into northern Italy, settling around Rimini.","sec":"battle-of-the-allia"},{"claim":"Rome handed the three Fabius brothers over to the Gauls to avoid war.","answer":false,"why":"Instead of handing them over, the Romans elected the brothers consular tribunes for the next year, which enraged the Gauls.","sec":"battle-of-the-allia"},{"claim":"The honking of Juno's sacred geese woke Marcus Manlius during a night attack.","answer":true,"why":"While guards and dogs slept, the geese roused Manlius, who hurled the first attacker down the slope.","sec":"sack-of-rome"},{"claim":"The Romans agreed to pay the Gauls a ransom of about 33 kg (a hundred pounds) of gold.","answer":false,"why":"Famine and disease forced a deal of about 330 kg (a thousand pounds) of gold.","sec":"sack-of-rome"},{"claim":"The Greek historians Polybius and Diodorus both describe Camillus rescuing Rome.","answer":false,"why":"Neither Polybius nor Diodorus mentions Camillus, which is why many historians see his rescue as a later addition.","sec":"sack-reliability"},{"claim":"Rome's huge new wall was built of yellow stone quarried in Veii's territory.","answer":true,"why":"The old wall used crumbly local stone; the new 11 km wall used better yellow stone from Veii's land.","sec":"rome-after-the-sack"}]},{"name":"Plebeians Fight for Power","blurb":"Offices, laws and the long road to sharing power.","cards":[{"claim":"Livy said the consular tribunate was created as a concession because plebeians could hold it.","answer":true,"why":"Livy, writing centuries later, presented the office as a concession open to plebeians.","sec":"conflict-of-the-orders"},{"claim":"Between 444 and 401 BC, about half of all consular tribunes were plebeians.","answer":false,"why":"Only two of about a hundred consular tribunes in those years were plebeians.","sec":"conflict-of-the-orders"},{"claim":"Licinius and Sextius blocked the election of consular tribunes for five years.","answer":true,"why":"They struck back at the patricians' vetoes this way, giving in only in 370 BC when Velitrae attacked.","sec":"licinius-and-sextius"},{"claim":"The land law limited any individual to about 1,200 hectares (3,000 acres) of public land.","answer":false,"why":"The limit was about 120 hectares (300 acres), and no one could graze more than 100 cattle on public land.","sec":"licinian-laws"},{"claim":"Licinius himself was later fined for breaking his own land limit.","answer":true,"why":"Such laws were easy to dodge, and Licinius was later fined for exceeding his own limit.","sec":"licinian-laws"},{"claim":"The new law put ten priests, five of them plebeians, in charge of the Sibylline Books.","answer":true,"why":"They replaced the two patrician guardians, breaking the patrician monopoly on priesthoods for the first time.","sec":"licinian-laws"},{"claim":"Under the compromise of 366 BC, the new praetor had to be a plebeian.","answer":false,"why":"The nobles accepted a plebeian consul, and in return the plebeians agreed the praetor would be a patrician.","sec":"first-plebeian-consul"},{"claim":"From 355 to 343 BC, one consul each year was always a plebeian.","answer":false,"why":"In those years both consuls were patricians; regular sharing began only after Genucius's law of 342 BC.","sec":"modern-verdict"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Creating the praetorship","Easing debt","Limiting public land holdings","Restoring the consulship"],"odd":0,"why":"Three were bills Licinius and Sextius put to the Plebeian Council. The patrician praetorship came later, as Livy's compromise of 366 BC.","sec":"licinius-and-sextius"},{"items":["Veii","Ardea","Clusium","Caere"],"odd":1,"why":"Veii, Clusium and Caere are described as Etruscan cities. Ardea is simply a town south of Rome, where Camillus lived in exile.","sec":"sack-reliability"},{"items":["Vowed a tenth of spoils to Apollo","Invited Juno to move to Rome","Attacked walls from every side","Recalled from exile at Ardea"],"odd":3,"why":"The first three are what Camillus did to take Veii. His recall from exile at Ardea belongs to Livy's story of the Gallic sack.","sec":"siege-of-veii"},{"items":["Fighting men","Able-bodied senators","Old former officeholders","Vestal Virgins"],"odd":2,"why":"Fighting men and senators withdrew to the Capitoline and the Vestals fled to Caere. The old ex-officials stayed outside their houses and were massacred.","sec":"sack-of-rome"},{"items":["Chief judge","Presided over criminal trials","Guarded the Sibylline Books","Could command an army"],"odd":2,"why":"Three were roles of the praetor. The Sibylline Books were guarded by priests, first two patricians, later ten.","sec":"first-plebeian-consul"},{"items":["Pitched no camp","Launched a night attack","Failed to consult the gods","Stretched the line too thin"],"odd":1,"why":"Livy blames the Allia defeat on three Roman errors. The night attack was the Gauls' later climb up the Capitoline.","sec":"battle-of-the-allia"},{"items":["Plague","War","Famine","Elections"],"odd":3,"why":"The Sibylline Books were consulted in times of plague, famine or war. Elections are not mentioned as an occasion.","sec":"licinian-laws"}]}],"whos":[{"name":"Faces of the Gallic Crisis","blurb":"Romans and Gauls caught up in the fall of Rome.","people":[{"name":"Marcus Furius Camillus","options":["Marcus Furius Camillus","Marcus Manlius","Publius Manlius Capitolinus","Lucius Albinus"],"clues":["Many modern historians think my most famous rescue was added to the story later.","Livy says Rome recalled me from exile at Ardea to be dictator.","I vowed a tenth of the spoils to Apollo and invited Juno to move to Rome.","As dictator, I captured Veii by sending troops through a tunnel."],"sec":"siege-of-veii"},{"name":"Brennus","options":["Brennus","Aruns","Dionysius I","Marcus Papirius"],"clues":["My warriors struck the Roman reserves on a hill, and panic spread.","I led the Gauls at the battle where many Romans drowned in the Tiber.","When the Romans complained about rigged weights, I threw my sword onto the scales.","I declared, 'Woe to the vanquished!'"],"sec":"sack-of-rome"},{"name":"Marcus Manlius","options":["Marcus Manlius","Marcus Papirius","Lucius Albinus","Marcus Furius Camillus"],"clues":["I had once served as consul of Rome.","I was among the defenders on the Capitoline, Rome's citadel hill, during the siege.","One night I was roused while the guards and dogs slept.","Woken by Juno's honking geese, I hurled the first Gallic climber down the slope."],"sec":"sack-of-rome"}]},{"name":"Who Told the Story?","blurb":"Ancient and modern writers who shaped how we see these events.","people":[{"name":"Livy","options":["Livy","Polybius","Diodorus Siculus","T. J. Cornell"],"clues":["I claimed Rome's tangled streets came from hasty rebuilding after the Gauls burned it.","I called some tribunes 'slaves of the nobility'.","I wrote that the patricians and plebeians were 'at length brought into harmony'.","I am the Roman historian in whose story Camillus arrives just in time to cancel the ransom."],"sec":"sack-of-rome"},{"name":"Diodorus Siculus","options":["Diodorus Siculus","Livy","T. J. Cornell","Aristotle"],"clues":["Like Polybius, I never mention Camillus in the story of the sack.","In my account, the Gauls had gone on to southern Italy before they were beaten.","I was a Greek historian writing about Rome's past.","I say an Etruscan army defeated the Gauls on their way back from southern Italy."],"sec":"sack-reliability"},{"name":"T. J. Cornell","options":["T. J. Cornell","Livy","Polybius","Diodorus Siculus"],"clues":["I think the Gauls left most of Rome standing and went home once paid.","I doubt the tale of Aruns's revenge and suspect the Senones were mercenaries.","I argue the new plebeian leaders joined the patricians in a new aristocracy.","I am a modern historian who trusts very little of Livy's dramatic story."],"sec":"modern-verdict"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Veii","lat":42.02333333,"lon":12.38972222,"why":"Rome's great Etruscan rival, captured by Camillus through a tunnel around 396 BC.","sec":"siege-of-veii"},{"name":"Clusium","lat":43.01666667,"lon":11.95,"why":"The Etruscan town, now Chiusi, whose appeal to Rome against the Senones led to the Gallic war.","sec":"battle-of-the-allia"},{"name":"Caere","lat":42.00166667,"lon":12.10833333,"why":"Rome's coastal Etruscan ally, where the Vestal Virgins took the sacred objects during the sack.","sec":"sack-of-rome"},{"name":"Velitrae","lat":41.68666667,"lon":12.7775,"why":"The Volscian town whose attack in 370 BC made Licinius and Sextius end their block on elections.","sec":"licinius-and-sextius"},{"name":"Cumae","lat":40.84861111,"lon":14.05361111,"why":"The Greek city near Naples where, by tradition, King Tarquinius Superbus bought the Sibylline Books.","sec":"licinian-laws"},{"name":"Rimini","lat":44.05944444,"lon":12.56833333,"why":"The Adriatic coast around modern Rimini was where the Senones, the Gauls who sacked Rome, had settled.","sec":"battle-of-the-allia"}]}],"quizPool":{"1":[{"q":"Under the land law of Licinius and Sextius, how much public land could one individual hold?","options":["About 120 hectares (300 acres)","About half a hectare (one and a quarter acres)","About 12 hectares (30 acres)","About 1,200 hectares (3,000 acres)"],"a":0,"level":1,"why":"The law capped holdings of public land at about 120 hectares (300 acres). Such laws were easy to dodge, and Licinius himself was later fined for breaking his own limit.","sec":"licinian-laws"},{"q":"What power allowed tribunes of the plebs to block official business?","options":["The auspices","The censorship","The veto","The dictatorship"],"a":2,"level":1,"why":"Tribunes were elected by the plebeians to protect them and could block business with a veto. The patricians turned this weapon against Licinius and Sextius by persuading other tribunes to veto their bill.","sec":"licinius-and-sextius"},{"q":"How did Rome bind the people of newly conquered Veii more closely to itself after the sack?","options":["It allowed them their own consuls","It gave them citizenship without the vote","It made them full voting citizens","It exempted them from all taxes"],"a":1,"level":1,"why":"Veii's people received citizenship without the right to vote. Rome also strengthened its alliance with Caere.","sec":"rome-after-the-sack"},{"q":"Where had the Senones, the Gallic tribe that defeated Rome, settled?","options":["In Sicily near Syracuse","In the hills around modern Florence","On the Bay of Naples near Cumae","On the Adriatic coast around modern Rimini"],"a":3,"level":1,"why":"The Senones were one of several Celtic peoples who had recently pushed into northern Italy, settling around modern Rimini.","sec":"battle-of-the-allia"},{"q":"In Cornell's view, what did the plebeian leaders do once they entered top office?","options":["Abolished the Senate entirely","Barred patricians from the consulship","Formed a new aristocracy with the patricians","Redistributed all public land to the poor"],"a":2,"level":1,"why":"Cornell argues the wealthy plebeian leaders joined the patricians in a new aristocracy and turned their backs on the poor. Livy even called some tribunes 'slaves of the nobility'.","sec":"modern-verdict"},{"q":"In the compromise over the first plebeian consul, which new office was reserved for patricians?","options":["The tribune","The praetor","The censor","The dictator"],"a":1,"level":1,"why":"The nobles accepted a plebeian consul, and in return the new praetorship would be held by a patrician. The praetor served as Rome's chief judge.","sec":"first-plebeian-consul"},{"q":"What does historian T. J. Cornell think the Senones who attacked Rome really were?","options":["Pilgrims visiting a shrine","Migrants seeking farmland","Mercenaries","Refugees fleeing Etruscans"],"a":2,"level":1,"why":"Since no account mentions Gallic wives or children, Cornell sees the Senones as a warrior band, probably mercenaries. Shortly afterwards, Dionysius I of Syracuse hired Gauls for a war in southern Italy.","sec":"sack-reliability"},{"q":"Who were the patricians of the early Roman Republic?","options":["A small hereditary aristocracy","Etruscan settlers living in Rome","The great majority of ordinary Romans","Elected protectors of the poor"],"a":0,"level":1,"why":"The patricians were a small hereditary aristocracy who owned large estates, lent money and saw ruling as their birthright. The plebeians made up the great majority of ordinary Romans.","sec":"conflict-of-the-orders"},{"q":"To which assembly did Licinius and Sextius put their three reform bills?","options":["The Senate","The College of Priests","The Plebeian Council","The Council of Elders"],"a":2,"level":1,"why":"They brought their bills to the Plebeian Council, the assembly of the plebeians. The bills dealt with debt, land and the consulship.","sec":"licinius-and-sextius"},{"q":"Why is the reliability of the accounts of the Allia and the sack of Rome doubtful?","options":["They survive only on damaged inscriptions","They were composed by the defeated generals","They were written only by Gallic authors","They were written centuries after the events"],"a":3,"level":1,"why":"All the accounts date from centuries later. The biggest suspect is Camillus's heroic rescue, which many modern historians see as a later addition.","sec":"sack-reliability"},{"q":"Who were usually the creditors of the indebted small farmers of early Rome?","options":["The plebeian tribunes","Etruscan merchants","Wealthy patricians","Greek bankers from Cumae"],"a":2,"level":1,"why":"Debt weighed heavily on small farmers, and their creditors were usually rich patricians. The new debt law subtracted interest already paid from the sum owed.","sec":"licinian-laws"},{"q":"Which two tribunes of the plebs launched a ten-year campaign for reform in 375 BC?","options":["Gaius Licinius Stolo and Lucius Sextius Lateranus","Publius Manlius and Marcus Furius Camillus","Lucius Genucius and Marcus Manlius","Marcus Papirius and Lucius Albinus"],"a":0,"level":1,"why":"Licinius and Sextius began a campaign that lasted a decade. They were re-elected year after year.","sec":"licinius-and-sextius"},{"q":"When the patricians refused to confirm Rome's first plebeian consul, what did the plebeians come close to doing?","options":["Burning the Senate house","Inviting the Gauls back into Rome","Seceding in a mass walkout from the city","Crowning a plebeian king"],"a":2,"level":1,"why":"The plebeians nearly seceded, staging a mass walkout as they had done before. According to Livy, the aged Camillus brokered a compromise.","sec":"first-plebeian-consul"},{"q":"In the Roman Republic, what was a dictator?","options":["A judge who presided over criminal trials","A priest who consulted sacred prophecies","An emergency commander with powers for six months","A tyrant who seized power for life"],"a":2,"level":1,"why":"A Republican dictator was an emergency commander with sweeping powers for six months, not a tyrant. Camillus was given this role during the war with Veii.","sec":"siege-of-veii"},{"q":"What did Brennus declare when he threw his sword onto the scales?","options":["\"Woe to the vanquished!\"","\"I came, I saw, I conquered!\"","\"Rome must be destroyed!\"","\"The die is cast!\""],"a":0,"level":1,"why":"The Romans complained the Gauls were using rigged weights for the gold ransom, and Brennus answered by adding his sword. In Livy's version, Camillus then arrived and cancelled the deal.","sec":"sack-of-rome"},{"q":"How much of Livy's dramatic story of the Licinian reforms does historian T. J. Cornell believe can be trusted?","options":["Very little, though the changes themselves are fairly certain","Only the parts involving Camillus","Nearly all of it, including the speeches","None of it, as the reforms never happened"],"a":0,"level":1,"why":"Cornell doubts most of Livy's drama but considers the actual changes in government reasonably certain.","sec":"modern-verdict"},{"q":"Where did Rome's fighting men withdraw when the Gauls reached the city?","options":["The Capitoline hill","The port of Ostia","The town of Ardea","The Palatine hill"],"a":0,"level":1,"why":"The fighting men and able-bodied senators held out on the Capitoline, Rome's fortified citadel hill. According to Livy, the Gauls found the city's gates open and walls unguarded.","sec":"sack-of-rome"},{"q":"How did the Gauls first react to the old Roman magistrates sitting in their robes on ivory chairs?","options":["They mocked them and dragged them away","They stared at them as if they were statues","They demanded the old men pay a ransom","They bowed to them as if they were gods"],"a":1,"level":1,"why":"The old men who had held high office stayed behind in ceremonial dress, and the Gauls gazed at them like statues. The spell broke when one Gaul stroked Marcus Papirius's beard.","sec":"sack-of-rome"},{"q":"Who was the Gallic chief at the Battle of the Allia?","options":["Brennus","Aruns","Dionysius","Vercingetorix"],"a":0,"level":1,"why":"Brennus attacked the Roman reserves on a hill, and panic spread through the Roman army. Many Romans drowned in the Tiber.","sec":"battle-of-the-allia"},{"q":"How far was the Etruscan city of Veii from Rome?","options":["About 160 km (100 miles)","About 60 km (37 miles)","About 5 km (3 miles)","About 16 km (10 miles)"],"a":3,"level":1,"why":"Veii lay just 16 km from Rome, which made it a dangerous neighbour. Rome and Veii fought a long, seesawing war with victories and defeats on both sides.","sec":"siege-of-veii"},{"q":"How did the Romans finally get inside Veii?","options":["By digging a tunnel through volcanic rock","By bribing a guard to open the gates","By diverting a river under the walls","By starving the city into surrender"],"a":0,"level":1,"why":"The Romans tunnelled through the soft volcanic rock on which Veii stood. Picked troops then climbed out inside the city while the defenders manned the walls.","sec":"siege-of-veii"},{"q":"What rule did the Fabius brothers break when they joined the fighting at Clusium?","options":["Senators must not command troops","Consuls must not leave Rome","Envoys must stay neutral","Priests must not shed blood"],"a":2,"level":1,"why":"As ambassadors, the brothers were supposed to stay neutral, but one killed a Gallic chieftain. When the Gauls demanded them, Rome refused to hand them over.","sec":"battle-of-the-allia"},{"q":"What name is given to the roughly two-hundred-year rivalry between Rome's patricians and plebeians?","options":["The War of the Classes","The Conflict of the Orders","The Struggle of the Tribes","The Secession of the Commons"],"a":1,"level":1,"why":"The rivalry is known as the Conflict of the Orders and shaped politics through the Republic's first two centuries. The patricians held power by monopolising the consulship and the Senate.","sec":"conflict-of-the-orders"},{"q":"What stone was used for Rome's huge new city wall after the Gallic sack?","options":["Dark basalt brought from Sicily","Yellow stone quarried in Veii's territory","White marble shipped from Greece","Crumbly local stone from Rome's hills"],"a":1,"level":1,"why":"The old wall used crumbly local stone, so the new 11 km wall was built of better yellow stone from Veii's territory.","sec":"rome-after-the-sack"},{"q":"Which date, the anniversary of the Allia, became an ill-omened day for Romans?","options":["1 January","18 July","21 April","15 March"],"a":1,"level":1,"why":"The anniversary of the defeat, 18 July, became an ill-omened day. Tradition dates the battle to 390 BC, though modern historians prefer around 387 BC.","sec":"battle-of-the-allia"},{"q":"During the night attack on the Capitoline, what woke the defenders?","options":["The crash of a falling wall","The honking of Juno's sacred geese","The trumpet of a sentry","The barking of the guard dogs"],"a":1,"level":1,"why":"The guards and dogs slept, but the sacred geese of Juno honked. Their noise roused Marcus Manlius, who hurled the first attacker down the slope.","sec":"sack-of-rome"},{"q":"Who was chosen as dictator around 396 BC to deal with the war against Veii?","options":["Marcus Manlius","Publius Manlius Capitolinus","Lucius Sextius Lateranus","Marcus Furius Camillus"],"a":3,"level":1,"why":"After a string of setbacks, the Romans turned to Marcus Furius Camillus. He took over a siege that was already under way.","sec":"siege-of-veii"},{"q":"What were the Sibylline Books?","options":["A list of Roman consuls","A code of Roman laws","A collection of prophecies","A record of land ownership"],"a":2,"level":1,"why":"The Sibylline Books were prophecies consulted in times of plague, famine or war. A fourth Licinian law changed who looked after them.","sec":"licinian-laws"},{"q":"From 444 BC, what arrangement did Rome often use instead of its two consuls?","options":["A single dictator chosen for a year","Military tribunes with consular power","Two praetors elected by the plebs","A council of ten patrician judges"],"a":1,"level":1,"why":"Rome was often run by 'military tribunes with consular power', usually called consular tribunes. There were between three and six of them in a given year.","sec":"conflict-of-the-orders"},{"q":"Who became Rome's first plebeian consul in 366 BC?","options":["Gaius Licinius Stolo","Lucius Sextius Lateranus","Lucius Genucius","Marcus Manlius"],"a":1,"level":1,"why":"Sextius, one of the two tribunes who led the long campaign, became the first plebeian consul. The patricians refused to confirm his election, and riots broke out.","sec":"first-plebeian-consul"},{"q":"What did Brennus mean by “Vae victis!”?","options":["Woe to the vanquished!","Gold for the victors!","Rome has fallen!","Peace with Rome!"],"a":0,"level":1,"why":"He threw his sword onto the scales when the Romans complained about rigged weights.","sec":"sack-of-rome"},{"q":"The Romans took Veii through a cuniculus. What was it?","options":["A tunnel","A siege tower","A battering ram","A bridge"],"a":0,"level":1,"why":"They dug it through the soft volcanic rock under the city.","sec":"siege-of-veii"},{"q":"What were the anseres that woke Marcus Manlius?","options":["The sacred geese of Juno","The guard dogs","The temple bells","The Vestal Virgins"],"a":0,"level":1,"why":"The guards and dogs slept, but the geese honked.","sec":"sack-of-rome"}],"2":[{"q":"What was the ager publicus that the land law limited?","options":["Public land owned by the Roman state","Farmland owned by plebeians","Land given to the gods","The common pasture of the patricians"],"a":0,"level":2,"why":"Rich landowners had grabbed huge areas of it; the law capped each person at about 120 hectares (300 acres).","sec":"licinian-laws"},{"q":"After Veii fell, its people received civitas sine suffragio. What was that?","options":["Citizenship without the right to vote","Freedom from taxes","The right to elect their own consuls","Exile from Italy"],"a":0,"level":2,"why":"It bound the newly conquered city closer to Rome.","sec":"rome-after-the-sack"},{"q":"The dictator Publius Manlius Capitolinus chose a plebeian magister equitum. What was that?","options":["His deputy, the “master of the horse”","His chief priest","His army’s standard-bearer","A judge of criminal trials"],"a":0,"level":2,"why":"Picking a plebeian deputy angered the patricians.","sec":"licinius-and-sextius"},{"q":"Which former consul, roused by the geese, hurled the first Gallic attacker off the Capitoline?","options":["Gaius Licinius","Marcus Papirius","Marcus Manlius","Publius Manlius Capitolinus","Lucius Sextius"],"a":2,"level":2,"why":"The honking geese of Juno woke Marcus Manlius, who threw the first attacker down the slope, saving the citadel.","sec":"sack-of-rome"},{"q":"According to Livy, where was Camillus living in exile before being recalled as dictator to fight the Gauls?","options":["Veii","Clusium","Caere","Cumae","Ardea"],"a":4,"level":2,"why":"Livy places Camillus in exile at Ardea, a town south of Rome. Yet the Greek historians Polybius and Diodorus Siculus never mention him.","sec":"sack-reliability"},{"q":"When the Gauls demanded the Fabius brothers be handed over, what did Rome do?","options":["Elected them consular tribunes for the next year","Put them on trial for murder","Sent them to negotiate again","Exiled them to Ardea","Handed them over in chains"],"a":0,"level":2,"why":"Instead of surrendering the envoys who broke neutrality, Rome honoured them with election as consular tribunes. Enraged, the Gauls marched on Rome.","sec":"battle-of-the-allia"},{"q":"Why did the dictator Publius Manlius Capitolinus anger the patricians?","options":["He refused to fight the Volscians","He handed the Sibylline Books to plebeians","He freed all debtors from prison","He picked a plebeian as his deputy","He resigned after threatening violence"],"a":3,"level":2,"why":"Manlius Capitolinus chose a plebeian deputy, upsetting the patricians. Licinius and Sextius then won a tenth term, and their whole package went through.","sec":"licinius-and-sextius"},{"q":"How did the Licinian laws change the guardianship of the Sibylline Books?","options":["The books were moved to the temple of Juno at Veii","The priesthood was opened only to women","Ten priests replaced two, five of them plebeians","The Senate took over direct control","The books were handed to the tribunes"],"a":2,"level":2,"why":"Two patrician priests were replaced by ten, five of them plebeians. For the first time, the patricians' monopoly on priesthoods was broken.","sec":"licinian-laws"},{"q":"Between 444 and 401 BC, roughly how many of about a hundred consular tribunes were plebeians?","options":["Twenty","None at all","Fifty","Two","Seventy"],"a":3,"level":2,"why":"Although Livy claimed the office was a concession open to plebeians, only two of about a hundred holders in this period were plebeians. Around 400 BC this changed.","sec":"conflict-of-the-orders"},{"q":"Which elderly Roman struck a Gaul with his ivory staff, triggering the massacre in the city?","options":["Marcus Papirius","Marcus Furius Camillus","Lucius Albinus","Lucius Genucius","Marcus Manlius"],"a":0,"level":2,"why":"A Gaul stroked Marcus Papirius's long beard, and Papirius struck him with his staff. The massacre began, and houses were plundered and burned.","sec":"sack-of-rome"},{"q":"How does Cornell's view of the sack differ from Livy's account of Rome being burned and hastily rebuilt?","options":["He thinks the Romans burned the city themselves","He thinks the Gauls left most buildings standing and went home once paid","He thinks the Gauls never actually entered Rome","He thinks the city was rebuilt on an orderly grid","He thinks the Gauls occupied Rome for several decades"],"a":1,"level":2,"why":"Cornell believes the Gauls mainly wanted loot and left once paid. He also notes that haphazard street plans were common in ancient cities anyway.","sec":"rome-after-the-sack"},{"q":"What made Licinius and Sextius finally give way in 370 BC after blocking elections for years?","options":["A revolt by the Fabius family","A new Gallic invasion from the north","An attack on Roman territory by Velitrae","The death of Camillus","An outbreak of plague in Rome"],"a":2,"level":2,"why":"They relented when Velitrae, a town of the Volscians, attacked Roman territory. Even so, the pair were re-elected year after year.","sec":"licinius-and-sextius"},{"q":"What had happened to the Roman siege of Veii by the time Camillus took command?","options":["Veii had offered to surrender on terms","The Roman army had already abandoned the siege","The defenders had destroyed much of the siege equipment","The Gauls had arrived to help Veii","A plague had wiped out the defenders"],"a":2,"level":2,"why":"Rome was already besieging Veii, but the defenders had wrecked much of the Roman siege equipment. So the Romans went underground and dug a tunnel.","sec":"siege-of-veii"},{"q":"How did the debt law of Licinius and Sextius relieve borrowers?","options":["Creditors had to wait ten years before collecting","Debts were transferred to the state treasury","All debts were cancelled outright by decree","Interest already paid was subtracted, the rest due in three yearly instalments","Debtors received public land in place of payment"],"a":3,"level":2,"why":"Interest already paid came off the sum owed, and the remainder could be paid in three equal yearly instalments. Debt weighed heaviest on small farmers.","sec":"licinian-laws"},{"q":"After which law did regular sharing of the consulship between patricians and plebeians begin?","options":["The law of Camillus in 368 BC","The law of Marcus Manlius in 376 BC","The law of Licinius and Sextius in 367 BC","The law of Lucius Genucius in 342 BC","The law of Publius Manlius in 337 BC"],"a":3,"level":2,"why":"Regular sharing started only after the tribune Lucius Genucius's law in 342 BC, which apparently required one consul to be a plebeian.","sec":"modern-verdict"},{"q":"In which year did Rome crush the Senones, though fear of the Gauls still persisted?","options":["350 BC","228 BC","114 BC","387 BC","295 BC"],"a":4,"level":2,"why":"Rome crushed the Senones in 295 BC, but the memory of the Gauls cast a long shadow. Gallic raiders had struck the region in 350 and 349 BC.","sec":"rome-after-the-sack"},{"q":"Which ruler hired Gauls for a war in southern Italy a few months after the sack of Rome?","options":["Dionysius I of Syracuse","Aruns of Clusium","Pyrrhus of Epirus","Tarquinius Superbus of Rome","Brennus of the Senones"],"a":0,"level":2,"why":"Dionysius I of Syracuse hired Gauls shortly afterwards, which supports Cornell's view that the Senones were mercenaries.","sec":"sack-reliability"},{"q":"How many consular tribunes ran Rome in the years when they replaced the consuls?","options":["Just one","Between three and six","Exactly two","Exactly ten","Between eight and twelve"],"a":1,"level":2,"why":"Rome was run by between three and six 'military tribunes with consular power' in those years. Consular tribunes governed in many years up to 376 BC.","sec":"conflict-of-the-orders"},{"q":"According to the geographer Strabo, who defeated the Gauls and recovered the ransom gold?","options":["Camillus, recalled from exile","The city of Clusium","The tyrant of Syracuse","Marcus Manlius's garrison","Caere, Rome's Etruscan ally"],"a":4,"level":2,"why":"Strabo credits Caere with beating the Gauls and recovering the gold. Diodorus instead says an Etruscan army defeated them on their way back from southern Italy.","sec":"sack-reliability"},{"q":"What ransom did famine and disease force the Romans to agree to pay the Gauls?","options":["A hundred talents of silver","The temple treasures of Juno","Ten thousand head of cattle","Half of all public land","About 330 kg (a thousand pounds) of gold"],"a":4,"level":2,"why":"Famine and disease led to a deal of about 330 kg (a thousand pounds) of gold. The Romans complained the Gauls were using rigged weights.","sec":"sack-of-rome"},{"q":"According to Livy, why did a man named Aruns bring the Senones to Clusium?","options":["To win back land stolen from his family","To take revenge on a nobleman whose son seduced his wife","To sell wine to the Gauls","To overthrow the Roman consuls","To avenge his father's murder by Romans"],"a":1,"level":2,"why":"Livy says Aruns sought revenge on a local nobleman whose son had seduced his wife. Historian T. J. Cornell doubts this romantic tale.","sec":"battle-of-the-allia"}],"3":[{"q":"In which year was a plebeian first elected praetor?","options":["367 BC","173 BC","366 BC","342 BC","337 BC","355 BC"],"a":4,"level":3,"why":"Plebeians had to wait thirty years after the compromise, until 337 BC, to win the praetorship. Patricians also kept some of the oldest priesthoods for themselves.","sec":"first-plebeian-consul"},{"q":"According to Livy, what did Camillus vow to the god Apollo during the siege of Veii?","options":["The walls of the conquered city","A golden statue on the Capitoline","A hundred oxen each year","A tenth of the spoils","Half of all captives taken","A new temple inside Veii"],"a":3,"level":3,"why":"Livy says Camillus vowed a tenth of the spoils to Apollo. He also invited Juno, Veii's protecting goddess, to move to Rome.","sec":"siege-of-veii"},{"q":"Up to which year did consular tribunes govern Rome in many years?","options":["376 BC","390 BC","366 BC","401 BC","444 BC","367 BC"],"a":0,"level":3,"why":"Consular tribunes ran Rome in many years up to 376 BC. Around 400 BC plebeians began to form the majority of them in some years.","sec":"conflict-of-the-orders"},{"q":"Which fact suggests that the 367 BC consulship law did not actually guarantee power-sharing?","options":["The praetorship was abolished in 343 BC","Consular tribunes returned from 360 to 350 BC","No consuls were elected from 355 to 343 BC","Both consuls were plebeians from 366 to 355 BC","Both consuls were patricians from 355 to 343 BC","The Senate annulled the law in 355 BC"],"a":4,"level":3,"why":"From 355 to 343 BC, both consuls were patricians, so the law clearly did not guarantee sharing. Cornell suggests it may have been a mere administrative adjustment.","sec":"modern-verdict"},{"q":"A passing citizen, Lucius Albinus, carried the Vestal Virgins and their sacred objects to safety in which city?","options":["Clusium","Caere","Cumae","Velitrae","Veii","Ardea"],"a":1,"level":3,"why":"Albinus gave the Vestals a lift on his wagon to Caere, an allied Etruscan coastal city. Aristotle's 'certain Lucius' who saved Rome might have been this same man.","sec":"sack-of-rome"},{"q":"In which years did Romans bury alive a pair of Gauls and a pair of Greeks?","options":["228, 216 and 114 BC","444, 401 and 375 BC","350, 349 and 295 BC","390, 387 and 367 BC","342, 337 and 173 BC","396, 376 and 366 BC"],"a":0,"level":3,"why":"These burials happened in 228, 216 and 114 BC, even though human sacrifice was not a Roman custom. They show how long the fear of the Gauls lasted.","sec":"rome-after-the-sack"},{"q":"Besides capping holdings of public land, what else did the Licinian land law restrict, and why?","options":["Selling plots there, to stop speculation by Greeks","Grazing more than 100 cattle there, to protect common pasture","Building houses there, to keep it open for armies","Planting vines there, to keep land for grain","Hunting there, to preserve sacred groves","Settling foreigners there, to reserve it for citizens"],"a":1,"level":3,"why":"The law banned grazing more than 100 cattle on public land to protect the pasture poor farmers relied on. Ordinary citizens' own plots were only about half a hectare (one and a quarter acres).","sec":"licinian-laws"},{"q":"What happened in the Plebeian Council in 368 BC, after Camillus resigned as dictator?","options":["It passed the land and debt bills but rejected the consulship bill","It elected consular tribunes for the first time in years","It passed the consulship bill but rejected the land and debt bills","It voted to abolish the tribunate","It passed all three bills, which the Senate vetoed","It rejected all three bills of Licinius and Sextius"],"a":0,"level":3,"why":"The plebeians approved the land and debt measures but turned down the consulship bill. The tribunes insisted on all or nothing, and the full package passed later.","sec":"licinius-and-sextius"},{"q":"What was the dies Alliensis?","options":["The ill-omened anniversary of the Allia, 18 July","The day the Gauls left Rome","The festival of the sacred geese","The day Veii fell"],"a":0,"level":3,"why":"The day of the defeat at the Allia became a day when public business stopped.","sec":"battle-of-the-allia"},{"q":"Livy called some later tribunes mancipia nobilium. What did he mean?","options":["Slaves of the nobility","Friends of the people","Sons of the patricians","Masters of the law"],"a":0,"level":3,"why":"Once in power, the plebeian leaders joined the patricians in a new nobility and forgot the poor.","sec":"modern-verdict"}]},"chronicleMaps":[{"id":"rome-veii","sec":"siege-of-veii","title":"Rome and Veii","caption":"Veii stood on a plateau of soft volcanic rock about 16 km (10 miles) north of Rome, its nearest great rival. Caere, another Etruscan city, was Rome's ally.","bounds":{"latMin":41.72,"latMax":42.14,"lonMin":12,"lonMax":12.72},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"r","dy":-4},{"name":"Veii","lat":42.023,"lon":12.39,"side":"r","dy":-2},{"name":"Caere","lat":41.995,"lon":12.098,"side":"r"}],"peoples":[{"name":"Etruscans","latin":"Etrusci","lat":42.09,"lon":12.2},{"name":"Latins","latin":"Latini","lat":41.78,"lon":12.6}]},{"id":"gauls","sec":"battle-of-the-allia","title":"The Gauls march on Rome","caption":"The Senones came from the Adriatic coast near today's Rimini, by way of Clusium, and met the Romans at the Allia, about 16 km north of Rome. The route is drawn only roughly, and the battlefield's exact site is uncertain.","bounds":{"latMin":41.7,"latMax":44.25,"lonMin":11,"lonMax":13.6},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"l","dy":6},{"name":"Allia","lat":42.03,"lon":12.58,"kind":"battle","side":"r"},{"name":"Clusium","lat":43.017,"lon":11.95,"side":"l"},{"name":"Rimini","lat":44.059,"lon":12.568,"side":"l"}],"peoples":[{"name":"Senones","lat":43.75,"lon":12.95},{"name":"Etruscans","latin":"Etrusci","lat":42.65,"lon":11.75}],"routes":[{"pts":[[43.95,12.55],[43.45,12.15],[43.017,11.95],[42.55,12.2],[42.06,12.56]]}]}],"keyFacts":{"description":"Key facts for this chapter, written by hand from the chapter text. Every entry links to the section that explains it.","people":[{"name":"Marcus Furius Camillus","text":"Dictator who took Veii through a tunnel; in Livy’s story he also drove the Gauls out of Rome.","sec":"siege-of-veii"},{"name":"Brennus","text":"The Gallic chief who won at the Allia and said “Woe to the vanquished!”","sec":"sack-of-rome"},{"name":"Marcus Manlius","text":"Former consul woken by the sacred geese, who threw the first Gaul off the Capitoline.","sec":"sack-of-rome"},{"name":"Lucius Albinus","text":"Citizen who carried the Vestal Virgins and the sacred objects to Caere on his wagon.","sec":"sack-of-rome"},{"name":"Marcus Papirius","text":"Old former magistrate who struck a Gaul with his ivory staff, starting the massacre.","sec":"sack-of-rome"},{"name":"Aruns","text":"The man who, Livy says, brought the Gauls to Clusium to take revenge.","sec":"battle-of-the-allia"},{"name":"Gaius Licinius Stolo","text":"Tribune of the plebs who led the ten-year campaign for the new laws; later fined for breaking his own land limit.","sec":"licinius-and-sextius"},{"name":"Lucius Sextius Lateranus","text":"Licinius’s fellow tribune, Rome’s first plebeian consul in 366 BC.","sec":"first-plebeian-consul"},{"name":"Lucius Genucius","text":"Tribune whose law of 342 BC made sharing the consulship regular.","sec":"modern-verdict"}],"dates":[{"when":"444 BC","text":"Consular tribunes begin to replace the consuls in many years.","sec":"conflict-of-the-orders"},{"when":"c. 396 BC","text":"Camillus takes Veii.","sec":"siege-of-veii"},{"when":"390 BC","text":"The Gauls win at the Allia and sack Rome (traditional date; historians prefer c. 387 BC).","sec":"battle-of-the-allia"},{"when":"375 BC","text":"Licinius and Sextius begin their campaign.","sec":"licinius-and-sextius"},{"when":"367 BC","text":"The Senate accepts the laws of Licinius and Sextius.","sec":"licinius-and-sextius"},{"when":"366 BC","text":"Lucius Sextius becomes the first plebeian consul.","sec":"first-plebeian-consul"},{"when":"342 BC","text":"The law of Genucius: one consul is regularly a plebeian.","sec":"modern-verdict"},{"when":"337 BC","text":"The first plebeian praetor.","sec":"first-plebeian-consul"},{"when":"295 BC","text":"Rome crushes the Senones.","sec":"rome-after-the-sack"}],"terms":[{"latin":"patricii, plebeii","english":"patricians and plebeians","sec":"conflict-of-the-orders"},{"latin":"tribuni militum consulari potestate","english":"“military tribunes with consular power”: consular tribunes","sec":"conflict-of-the-orders"},{"latin":"cuniculus","english":"the tunnel into Veii","sec":"siege-of-veii"},{"latin":"praeda","english":"spoils of war","sec":"siege-of-veii"},{"latin":"Iuno Regina","english":"“Queen Juno”, Veii’s goddess, invited to Rome","sec":"siege-of-veii"},{"latin":"Galli","english":"the Gauls","sec":"battle-of-the-allia"},{"latin":"dies Alliensis","english":"“the day of the Allia”, an ill-omened day","sec":"battle-of-the-allia"},{"latin":"arx","english":"the citadel on the Capitoline","sec":"sack-of-rome"},{"latin":"sellae curules","english":"the ivory chairs of high office","sec":"sack-of-rome"},{"latin":"anseres","english":"the sacred geese of Juno","sec":"sack-of-rome"},{"latin":"Vae victis!","english":"“Woe to the vanquished!”","sec":"sack-of-rome"},{"latin":"civitas sine suffragio","english":"citizenship without the vote","sec":"rome-after-the-sack"},{"latin":"dies religiosus","english":"a day when public business stopped","sec":"rome-after-the-sack"},{"latin":"tribuni plebis","english":"tribunes of the plebs","sec":"licinius-and-sextius"},{"latin":"rogationes","english":"bills put to an assembly","sec":"licinius-and-sextius"},{"latin":"magister equitum","english":"“master of the horse”, a dictator’s deputy","sec":"licinius-and-sextius"},{"latin":"ager publicus","english":"public land of the Roman state","sec":"licinian-laws"},{"latin":"Libri Sibyllini","english":"the Sibylline Books of prophecy","sec":"licinian-laws"},{"latin":"decemviri sacris faciundis","english":"the ten priests who kept the Sibylline Books","sec":"licinian-laws"},{"latin":"nobilitas","english":"the new nobility of patricians and rich plebeians","sec":"modern-verdict"}]}},{"id":"samnite-wars","era":"early-republic","short":"The Samnite Wars","title":"The Samnite Wars","period":"367-290 BC","sources":["Samnite Wars","Latin War"],"briefing":{"title":"Rome, 343 BC","paragraphs":["It is 343 BC. Rome controls the land south to the River Liris. Beyond lies Campania, a fertile plain led by rich Capua. Above it, in the Apennine Mountains, live the Samnites, hill tribes and the strongest people in the region.","A treaty keeps Rome and the Samnites apart, but Samnite armies have penned the Campanians inside Capua, and desperate envoys are begging the Roman Senate for help. Three wars over the next fifty years will decide who dominates Italy."]},"sections":[{"id":"samnites-and-rome","title":"The Samnites and the Road to War","body":"In the mid-fourth century BC, Rome's territory reached south as far as the River Liris. This river divided Latium, the Latin homeland around Rome, from Campania, the fertile plain running down to the Bay of Naples. Beyond that plain rose the Apennine Mountains. There lived the Samnites, a confederation of hill tribes and the strongest people in the region.\n\nThe Samnites spoke Oscan, an Italian language shared with several neighbours. The Campanians who farmed the plain below were descended from Samnite migrants. By now, though, they had their own identity and their own rich cities, chief among them Capua, just north of Naples.\n\nIn 354 BC, according to the Roman historian Livy (*Titus Livius*) and the Greek historian Diodorus, Rome and the Samnites signed a treaty, but neither records its terms. Modern historians suspect it made the Liris a dividing line, with Rome's sphere to the north and the Samnites' to the south. That line would collapse into three wars, fought between 343 and 290 BC, that decided who would dominate Italy."},{"id":"first-war-outbreak","title":"How the First Samnite War Began (343 BC)","body":"Our main guide to these wars is Livy, a Roman historian writing about three centuries later. According to him, the first war began almost by accident. The Samnites attacked the Sidicini, a small people north of Campania whose stronghold controlled a valuable crossroads. The Campanians came to the Sidicini's aid and were beaten twice, and the Samnites drove them back behind the walls of Capua.\n\nDesperate, the Campanians sent ambassadors to the Roman Senate (*senatus*), the council of leading men who steered Rome's policy. They offered an alliance and their famous wealth. The senators, Livy says, were tempted but refused, since this would betray their treaty with the Samnites. So the envoys played their last card: they surrendered Capua and all Campania unconditionally to Rome, a surrender the Romans called *deditio*.\n\nNow Roman honour was at stake. When Roman envoys asked the Samnites to spare what had become Roman property, Samnite leaders ordered their armies into Campania within earshot. Rome's fetials (*fetiales*), priests who handled formal demands and declarations of war, sought redress, were refused, and war followed."},{"id":"first-war-campaigns","title":"Three Victories, a Mutiny and a Peace (343–341 BC)","body":"In 343 BC both of Rome's consuls (*consules*), the two chief magistrates elected each year, marched out. Livy credits them with three victories. Marcus Valerius Corvus won the first at Mount Gaurus, near the coastal town of Cumae, with a desperate charge as daylight faded.\n\nIn the second, the Samnites trapped the other consul, Aulus Cornelius Cossus, in a mountain pass. A junior officer, Publius Decius Mus, seized a hilltop with a small band and distracted the enemy while the army escaped. In the third, Valerius rushed to Suessula, a town on Campania's eastern edge, captured the Samnite camp and scattered their foragers. Both consuls celebrated triumphs (*triumphi*), Rome's victory parades.\n\nIn 342 BC, the sources say, Roman garrison troops seduced by Campanian luxury plotted a coup and mutinied. Valerius, named dictator, an emergency ruler with sweeping powers, talked them down without bloodshed.\n\nIn 341 BC the Samnites asked for peace and the old treaty was renewed. Rome left the Sidicini to the Samnites but kept its alliance with Capua, a far greater prize."},{"id":"doubting-livy","title":"Can We Trust Livy's First Samnite War?","body":"Modern historians treat Livy's account of the first war cautiously. His Campanian ambassadors give a speech closely modelled on a scene in Thucydides, the Greek historian of the Peloponnesian War, where envoys from Corcyra beg Athens for help. The defiant Samnite assembly is also unlikely to rest on any genuine record.\n\nThe fiercest debate concerns Capua's surrender. Scholars such as Salmon and Forsythe think it was invented, projected back from Capua's real surrender in 211 BC, when Rome punished it for siding with Carthage, the North African trading power. The tale would clear Rome of treaty-breaking and blame scheming Campanians. Others, such as Cornell and Oakley, accept it, noting that voluntary submission was common diplomacy then.\n\nThe battles are doubted too. Decius' hilltop rescue closely resembles a famous episode of 258 BC and may be borrowed from it. Some historians once rejected the whole war, since Diodorus never mentions it. Most now accept it: no Roman would invent a story so embarrassing to Rome."},{"id":"second-war-outbreak","title":"The Great Samnite War Begins (326 BC)","body":"The peace soon frayed. Through the 330s Rome kept pushing into the region, settling 2,500 colonists (*coloni*) in a new colony (*colonia*) at Cales, a town on key routes towards Capua and the Samnite mountains. Then in 328 BC Rome founded a colony at Fregellae, on the Liris, in an area the Samnites had recently overrun. They saw it as open aggression.\n\nThe spark came from Naples, then a Greek city made up of an old town, Paleopolis, and a newer one, Neapolis (Greek for \"old city\" and \"new city\"). Livy says Paleopolis attacked Romans living in Campania. Rome demanded redress, was rebuffed, and declared war. Samnite troops helped defend the city.\n\nThe siege produced a lasting innovation. Instead of handing over to the next year's consuls, the commanders, including Quintus Publilius Philo, had their military command (*imperium*) extended until the campaign ended, with the title of proconsul (*pro consule*, \"in place of a consul\"). In 326 BC two leading Neapolitans, fed up with the unruly Samnite garrison, let the Romans in. The Second, or Great, Samnite War would last until 304 BC."},{"id":"caudine-forks","title":"Humiliation at the Caudine Forks (321 BC)","body":"Rome's most famous disaster came in 321 BC. The Samnite commander Gaius Pontius sent soldiers disguised as shepherds to spread a false rumour that Luceria, a Roman ally in Apulia in south-eastern Italy, was under attack. The two consuls took the quickest road, through the Caudine Forks (*Furculae Caudinae*), two narrow wooded gorges in the Apennines joined by a tight ravine. The Samnites blocked both ends with felled trees and boulders, trapping the army.\n\nAccording to the story, Pontius asked his elderly father Herennius for advice. Free them all and win Rome's friendship, the old man said, or kill them all and cripple Rome for years. A middle course would neither win friends nor remove enemies. Pontius chose it anyway. The Romans filed out unarmed under the yoke (*iugum*), a frame of spears symbolising subjugation, while the enemy jeered.\n\nRome went into mourning. Then, Livy says, the Senate refused to honour the agreement, arguing the people had never approved it, and the war resumed."},{"id":"second-war-turning","title":"From Defeat to Victory (320–304 BC)","body":"The Great Samnite War dragged on with reverses on both sides. Livy reports Roman revenge in 320 BC, when Luceria was taken and Roman hostages freed, though some historians think the truce that followed actually came from the Caudine agreement. When fighting resumed, the Samnites won at Lautulae in 315 BC.\n\nThen a second front opened. In 311 BC the Etruscans, the wealthy city-states north of Rome, besieged Sutrium, which Rome saw as its key to Etruria. Quintus Fabius Maximus Rullianus, Rome's leading general of the era, sent his Etruscan-speaking brother, disguised as a shepherd, through the dreaded Ciminian Forest (*silva Ciminia*), which no Roman had ever crossed. Fabius then marched his army through it. In 310 BC, Livy says, a hard-fought victory at Lake Vadimo first broke Etruscan might.\n\nIn Samnium the Romans took Bovianum, capital of the Pentri, the largest Samnite tribe, in 305 BC. The next year the Samnites sued for peace and the old treaty was restored."},{"id":"third-war-sentinum","title":"The Battle of Sentinum (295 BC)","body":"The Third Samnite War broke out in 298 BC when the Lucanians, a people south of Samnium, asked Rome for protection against a Samnite invasion. The Greek historian Dionysius of Halicarnassus thought Rome acted from fear of Samnite power, not compassion.\n\nThe Samnites knew they could not win alone, so their commander Gellius Egnatius took an army north to rally the Etruscans. By 295 BC Rome faced a coalition of four peoples: Samnites, Etruscans, Umbrians from the hills of central Italy, and Senone Gauls, Celtic warriors on the Adriatic coast. Rome elected its best generals as consuls, Quintus Fabius Maximus Rullianus and Publius Decius Mus, son of the hero of 343 BC.\n\nA Roman raid first drew the Etruscans home. At Sentinum, east of the Apennines, Gallic chariots broke Decius' wing. Decius then devoted himself (*devotio*): he prayed to the gods and charged into the enemy, sacrificing his life. His men rallied, Fabius outflanked the Samnites, and the coalition collapsed."},{"id":"aquilonia-and-the-end","title":"Aquilonia and the Fall of Samnium (293–290 BC)","body":"After Sentinum the Samnites fought on. In 293 BC they raised fresh troops, and some 40,000 men gathered at Aquilonia in north-western Samnium. Elite units, the Linen Legion (*legio linteata*), swore a sacred oath never to flee, on pain of death.\n\nThe consuls Lucius Papirius Cursor and Spurius Carvilius Maximus attacked Aquilonia and nearby Cominium at once. Tipped off by a deserter, Papirius intercepted twenty elite Samnite companies and took Aquilonia, while Cominium surrendered to Carvilius. One modern historian says Aquilonia sealed the Samnites' fate.\n\nLivy's surviving books stop here; later events come from brief summaries. According to these, a Samnite commander named Gaius Pontius was captured, paraded in a triumph and beheaded. In 291 BC Rome took Venusia, commanding routes into Lucania, Apulia and Samnium, and founded there its largest colony ever. In 290 BC the last resistance was crushed."},{"id":"roman-alliance-system","title":"Why the Samnite Wars Mattered","body":"By 290 BC Rome had become the great power of Italy. Its territory now stretched across the Apennines to the Adriatic, and the Samnites were forced into an alliance with Rome on unequal terms (*foedus iniquum*, an \"unequal treaty\").\n\nThe secret was the alliance system. Allied peoples, the *socii* (\"allies\"), kept their own governments, but every treaty required them to send soldiers for Rome's wars at their own expense. In return they shared the spoils (*praeda*), which could be considerable, and enjoyed Roman protection. Rome also backed allied ruling families when trouble brewed at home.\n\nThe result was an enormous pool of soldiers. Allied troops already mattered at Sentinum, and later they often outnumbered the Romans. At the battle of Telamon against the Gauls in 225 BC, the Greek historian Polybius counted about 41,000 Romans alongside 210,000 allies. No other Mediterranean state could match such numbers, and this machine carried Rome to victory over Pyrrhus, a Greek king who invaded Italy, and over Carthage."}],"battle":{"name":"Aquilonia","year":"293 BC","enemy":"The Samnites","sec":"aquilonia-and-the-end","intro":"Some 40,000 Samnites gather at Aquilonia. Their elite units have sworn a sacred oath never to flee. The consul Papirius Cursor attacks."},"timelines":[{"name":"Level 1: The Big Moments","blurb":"Four turning points in Rome's long struggle with the Samnites.","events":[{"label":"Rome and the Samnites sign a treaty","when":"354 BC","y":-354,"fact":"Livy and Diodorus record the treaty but not its terms; modern historians suspect it made the River Liris a dividing line.","sec":"samnites-and-rome"},{"label":"Campanians surrender Capua to Rome","when":"343 BC","y":-343,"fact":"After the Senate refused an alliance, Livy says the Campanian envoys handed Capua and all Campania to Rome unconditionally, dragging Rome into war.","sec":"first-war-outbreak"},{"label":"Roman army trapped at the Caudine Forks","when":"321 BC","y":-321,"fact":"The Samnite commander Gaius Pontius blocked both ends of the gorges and sent the Romans out unarmed under the yoke.","sec":"caudine-forks"},{"label":"Decius Mus sacrifices himself","when":"295 BC","y":-295,"fact":"At Sentinum the consul Decius Mus prayed to the gods and charged to his death, and his men rallied to break the coalition.","sec":"third-war-sentinum"}]},{"name":"Level 2: Battles and Colonies","blurb":"Victories, defeats and a new colony across three wars.","events":[{"label":"Valerius wins at Mount Gaurus","when":"343 BC","y":-343,"fact":"The consul Marcus Valerius Corvus won near Cumae with a desperate charge as daylight faded.","sec":"first-war-campaigns"},{"label":"Roman garrison mutinies in Campania","when":"342 BC","y":-342,"fact":"Troops seduced by Campanian luxury plotted a coup, but Valerius, named dictator, talked them down without bloodshed.","sec":"first-war-campaigns"},{"label":"Rome founds a colony at Fregellae","when":"328 BC","y":-328,"fact":"The colony on the Liris lay in an area the Samnites had recently overrun, and they saw it as open aggression.","sec":"second-war-outbreak"},{"label":"Samnites win at Lautulae","when":"315 BC","y":-315,"fact":"When fighting resumed after a truce, the Samnites defeated Rome at Lautulae.","sec":"second-war-turning"},{"label":"Romans capture Bovianum","when":"305 BC","y":-305,"fact":"Bovianum was the capital of the Pentri, the largest Samnite tribe; the Samnites sued for peace the next year.","sec":"second-war-turning"},{"label":"Papirius takes Aquilonia","when":"293 BC","y":-293,"fact":"Tipped off by a deserter, the consul Papirius Cursor intercepted elite Samnite companies and took the town.","sec":"aquilonia-and-the-end"}]},{"name":"Level 3: The Long Road to Mastery","blurb":"From the first peace to Rome's huge allied armies.","events":[{"label":"Old treaty renewed, Capua kept","when":"341 BC","y":-341,"fact":"Rome left the Sidicini to the Samnites but kept its alliance with Capua, a far greater prize.","sec":"first-war-campaigns"},{"label":"Naples opens its gates to Rome","when":"326 BC","y":-326,"fact":"Two leading Neapolitans, fed up with the unruly Samnite garrison, let the Romans into the Greek city.","sec":"second-war-outbreak"},{"label":"Luceria retaken, hostages freed","when":"320 BC","y":-320,"fact":"Livy reports this Roman revenge after the Caudine Forks, though some historians doubt it.","sec":"second-war-turning"},{"label":"Etruscans besiege Sutrium","when":"311 BC","y":-311,"fact":"The Etruscans attacked Sutrium, which Rome saw as its key to Etruria, opening a second front.","sec":"second-war-turning"},{"label":"Etruscan might broken at Lake Vadimo","when":"310 BC","y":-310,"fact":"Livy says this hard-fought victory first broke the power of the Etruscan city-states.","sec":"second-war-turning"},{"label":"Lucanians ask Rome for protection","
