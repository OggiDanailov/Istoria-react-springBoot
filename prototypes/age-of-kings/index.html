liny","Fabius Pictor","Livy"],"a":2,"level":1,"why":"Fabius Pictor wrote the first history of Rome around 200 BC, about three centuries after the kings fell. Later writers such as Livy relied largely on oral tradition.","sec":"how-reliable"},{"q":"According to the story, how did the war that followed the seizure of the Sabine women end?","options":["Romulus killed the Sabine king in single combat","The Etruscans forced both sides to make peace","A storm scattered the two armies","The women threw themselves between the armies"],"a":3,"level":1,"why":"The captured women stopped the fighting by throwing themselves between the armies. Afterwards the Romans and Sabines united into one people.","sec":"romulus-the-king"},{"q":"What replaced the king as Rome's leadership after the revolt?","options":["Two consuls elected each year","A council of twelve senators","An Etruscan governor","A single dictator chosen for life"],"a":0,"level":1,"why":"Rome began electing two consuls every year instead of a king. The first two were Brutus and Collatinus, Lucretia's husband.","sec":"birth-of-the-republic"},{"q":"According to tradition, who led the revolt against Tarquin the Proud?","options":["Lucius Junius Brutus","Titus Tatius","Sextus Tarquinius","Lars Porsenna"],"a":0,"level":1,"why":"The revolt was led by Lucius Junius Brutus, the king's own nephew. Tradition dates it to 509 BC.","sec":"birth-of-the-republic"},{"q":"According to legend, which god fathered Romulus and Remus?","options":["Apollo","Neptune","Mars","Jupiter"],"a":2,"level":1,"why":"The twins were said to be sons of Mars, the god of war. Their mother, Rhea Silvia, had been forced to become a Vestal Virgin, a priestess sworn to chastity.","sec":"romulus-and-remus"},{"q":"According to tradition, Rome's fifth king, Tarquinius Priscus, was an immigrant born into which people?","options":["The Greeks","The Sabines","The Etruscans","The Volsci"],"a":2,"level":1,"why":"Tarquinius Priscus was traditionally born an Etruscan, one of the wealthy peoples living north of Rome in what is now Tuscany. He became Rome's first Etruscan king.","sec":"tarquinius-priscus"},{"q":"In the legend, which animal suckled the abandoned twins Romulus and Remus?","options":["A goat","A sow","A bear","A she-wolf"],"a":3,"level":1,"why":"A she-wolf suckled the twins in a cave called the Lupercal. A shepherd named Faustulus then raised them.","sec":"romulus-and-remus"},{"q":"Which writer's poem \"Lucrece\" was inspired by the story of Lucretia?","options":["Milton","Chaucer","Byron","Shakespeare"],"a":3,"level":1,"why":"Lucretia's story inspired Shakespeare's poem Lucrece. It also inspired many paintings in the 18th and 19th centuries.","sec":"tarquin-the-proud"},{"q":"What did the Latin word rex mean?","options":["King","Senator","Priest","Soldier"],"a":0,"level":1,"why":"Rex meant king; the Romans had seven of them before the Republic.","sec":"origins"},{"q":"In the legend, a lupa fed the twins Romulus and Remus. What was a lupa?","options":["A she-wolf","A she-bear","A goat","A shepherdess"],"a":0,"level":1,"why":"A she-wolf (lupa) suckled the twins in a cave called the Lupercal.","sec":"romulus-and-remus"},{"q":"Ancus Marcius founded Ostia. What does its Latin root ostium mean?","options":["River mouth","Salt","Harbour wall","Ship"],"a":0,"level":1,"why":"Ostia lay at the mouth of the Tiber, and ostium means river mouth.","sec":"numa-tullus-ancus"}],"2":[{"q":"The Senate (senatus) took its name from which Latin word?","options":["senex, \"old man\"","sanctus, \"holy\"","signum, \"sign\"","sella, \"chair\""],"a":0,"level":2,"why":"The Senate was a council of elders: senatus comes from senex, \"old man\".","sec":"romulus-the-king"},{"q":"The word \"republic\" comes from the Latin res publica. What did it mean?","options":["\"The public thing\"","\"Rule by the people\"","\"The city of the fathers\"","\"The law of the consuls\""],"a":0,"level":2,"why":"Res publica meant \"the public thing\": the state belonged to the people, not to a king.","sec":"birth-of-the-republic"},{"q":"Rome's last king was called Superbus. What does it mean?","options":["The Proud","The Elder","The Great","The Cruel"],"a":0,"level":2,"why":"Lucius Tarquinius Superbus was \"Tarquin the Proud\"; the earlier Tarquin was Priscus, \"the Elder\".","sec":"tarquin-the-proud"},{"q":"Why did the classicist Mary Beard call Romulus \"Mr Rome\"?","options":["He was the only king born inside the city","He personally designed every Roman temple","Roman coins always showed his portrait","He was Rome's first elected consul","His name was probably invented from the city's name"],"a":4,"level":2,"why":"The name Romulus was probably made up from the name of Rome itself, hence \"Mr Rome\". Most modern historians treat the founding legend as myth.","sec":"romulus-and-remus"},{"q":"What was the role of the augur in making a new king?","options":["He sought signs that the gods approved","He granted the king imperium","He crowned the king in the Forum","He presented the king to the Senate","He counted the assembly's votes"],"a":0,"level":2,"why":"The augur, a priest, took the king-elect up to the citadel to look for signs of divine approval. Only after this did the assembly grant the king imperium.","sec":"how-kings-ruled"},{"q":"After Romulus vanished in a storm, a respected nobleman claimed Romulus had appeared to him in a vision as which god?","options":["Janus","Saturn","Mars","Jupiter","Quirinus"],"a":4,"level":2,"why":"The nobleman said Romulus had appeared as the god Quirinus. Others whispered that the nobles had murdered the king and hidden the pieces of his body.","sec":"romulus-the-king"},{"q":"On which hill have archaeologists found traces of Bronze Age settlement, possibly from as early as 1700 BC?","options":["Palatine","Aventine","Capitoline","Quirinal","Esquiline"],"a":2,"level":2,"why":"The earliest traces of settlement come from the Capitoline Hill, possibly as early as 1700 BC. Huts appeared on the Palatine much later, by the 9th or 8th century BC.","sec":"origins"},{"q":"Why do historians find the traditional 243 years for Rome's seven kings hard to believe?","options":["Archaeology shows Rome had only three kings","It leaves no time for Romulus's founding","The dates contradict the Gallic sack","It means an average reign of almost 35 years","No king is mentioned by any Greek writer"],"a":3,"level":2,"why":"Seven kings across 243 years gives an average reign of almost 35 years, which seems far too long. This is one reason modern historians treat the traditional story cautiously.","sec":"how-reliable"},{"q":"According to Livy, how did the warlike King Tullus Hostilius die?","options":["He fell in battle against Alba Longa","He vanished in a storm while reviewing troops","Jupiter burned him and his house with lightning","He drowned while crossing the Tiber","He was murdered by a son of Ancus"],"a":2,"level":2,"why":"Tullus had scorned the gods. When he finally begged Jupiter for help as he lay dying, the god struck him with lightning after a 32-year reign.","sec":"numa-tullus-ancus"},{"q":"Which king adopted the immigrant Tarquinius Priscus as a son?","options":["Tullus Hostilius","Romulus","Ancus Marcius","Numa Pompilius","Servius Tullius"],"a":2,"level":2,"why":"After settling in Rome, Tarquinius won the favour of King Ancus Marcius, who adopted him. He went on to become Rome's fifth king.","sec":"tarquinius-priscus"},{"q":"Which great building project did Tarquin the Proud complete?","options":["The Circus Maximus","The temple of Jupiter on the Capitoline","The Cloaca Maxima","Rome's first bridge over the Tiber","The Temple of Diana on the Aventine"],"a":1,"level":2,"why":"Tarquin the Proud finished the great temple of Jupiter on the Capitoline Hill. He was an energetic ruler who made Rome the leading power among the Latin cities.","sec":"tarquin-the-proud"},{"q":"The authors of the American Federalist Papers took their pen name from which early Roman?","options":["Poplicola","Brutus","Horatius","Collatinus","Servius Tullius"],"a":0,"level":2,"why":"The Federalist authors signed themselves \"Publius\" after Publius Valerius Poplicola, one of the leaders of the revolt. French revolutionaries likewise named boys and towns after Brutus.","sec":"birth-of-the-republic"},{"q":"What did Brutus do when his own sons were caught plotting to bring Tarquin back?","options":["Pardoned them before the assembly","Sent them into exile at Cumae","Resigned as consul in shame","Stripped them of citizenship","Ordered their execution"],"a":4,"level":2,"why":"Brutus ordered the execution of his own sons for plotting the king's return. He had made the people swear never again to accept a king.","sec":"birth-of-the-republic"},{"q":"Which emperor identified Servius Tullius with Mastarna, an Etruscan adventurer who became king of Rome?","options":["Claudius","Hadrian","Tiberius","Augustus","Nero"],"a":0,"level":2,"why":"The emperor Claudius made this identification in the first century AD. The historian Momigliano warned that Mastarna is so unlike the traditional Servius that the two are best kept apart.","sec":"servius-tullius"},{"q":"After the Romans and Sabines united, which Sabine king shared the throne with Romulus?","options":["Numa Pompilius","Titus Tatius","Lars Porsenna","Amulius","Ancus Marcius"],"a":1,"level":2,"why":"Once the two peoples united, the Sabine king Titus Tatius ruled jointly with Romulus. The union followed the war over the seized Sabine women.","sec":"romulus-the-king"},{"q":"Later Romans traced the family of Romulus and Remus back to which hero, who fled the fall of Troy?","options":["Odysseus","Achilles","Aeneas","Hector","Priam"],"a":2,"level":2,"why":"Later Romans linked the twins' family to Aeneas, a refugee from fallen Troy. Most modern historians treat this whole founding story as myth.","sec":"romulus-and-remus"},{"q":"When a king died, what did the interrex, or \"between-king\", do?","options":["Commanded the army until a new war began","Organised the dead king's funeral games","Guarded the royal treasury for the heir","Ruled for a full year until the Senate voted","Served five days to find a candidate for the throne"],"a":4,"level":2,"why":"A senator served as interrex for five days to find a candidate, then handed over to another senator if he failed. The chosen man was then presented to the Curiate Assembly.","sec":"how-kings-ruled"},{"q":"How was the new voting assembly based on Servius Tullius's wealth classes organised?","options":["So that plebeians outvoted the nobles","So that every citizen had an equal vote","So that each district voted equally","So that the rich had the most influence","So that only patricians could vote"],"a":3,"level":2,"why":"Servius's five wealth classes formed a voting assembly weighted towards the rich. Later, though, he was said to favour the poor at the nobles' expense.","sec":"servius-tullius"},{"q":"Lucretia's story closely resembles a Greek tale about which event?","options":["The Persian invasion of Greece","The reforms of Solon","The sack of Troy","The fall of the tyrants of Athens","The founding of Cumae"],"a":3,"level":2,"why":"Lucretia's story mirrors a Greek tale about the fall of Athens' tyrants around 510 BC, which makes Rome's version suspect. Some historians think Rome's kingship faded slowly rather than ending in one dramatic night.","sec":"how-reliable"},{"q":"Tarquin the Proud was the son of which earlier king?","options":["Tullus Hostilius","Tarquinius Priscus","Servius Tullius","Numa Pompilius","Ancus Marcius"],"a":1,"level":2,"why":"Tarquin the Proud was the son of Tarquinius Priscus, while Servius Tullius was his father-in-law. According to tradition he ruled for 25 years.","sec":"tarquin-the-proud"},{"q":"Tarquinius Priscus added 100 new members to the Senate. How large did that make it?","options":["250","100","150","300","200"],"a":4,"level":2,"why":"The extra 100 members raised the Senate to 200. Tarquinius also reportedly doubled Rome's size through wars against the Sabines and Etruscans.","sec":"tarquinius-priscus"}],"3":[{"q":"How did the reign of Tarquinius Priscus end after 38 years?","options":["He was struck by lightning from Jupiter","He was murdered by a son of Ancus Marcius","He died in exile at Cumae","He fell in battle against the Sabines","He vanished during a storm","He was killed by his daughter and her husband"],"a":1,"level":3,"why":"Tarquinius Priscus was murdered by a son of Ancus Marcius, the king who had adopted him. He is remembered for introducing the symbols of office and celebrating the first triumph.","sec":"tarquinius-priscus"},{"q":"Where and when did the exiled Tarquin the Proud die?","options":["At Veii in 490 BC","At Ardea in 495 BC","At Cumae in 495 BC","At Lake Regillus in 496 BC","At Cumae in 509 BC","At Clusium in 495 BC"],"a":2,"level":3,"why":"Tarquin died in exile at Cumae, a Greek city near Naples, in 495 BC. His attempts to return had failed, ending with Rome's victory over a Latin alliance at Lake Regillus.","sec":"birth-of-the-republic"},{"q":"Around 730–720 BC, at about the time a wall was built on the Palatine, what happened to the Forum area?","options":["It was walled off as an Etruscan fortress","Burials stopped and parts were paved as a shared space","A palace for Romulus was built over it","It was flooded and abandoned for a century","It became a royal burial ground for the kings","It was given over to chariot racing"],"a":1,"level":3,"why":"As the Palatine wall went up, burials in the Forum stopped and parts of it were paved over. It became a shared space for meeting and worship.","sec":"origins"},{"q":"Legend credits King Numa with adding which two months to create a twelve-month calendar?","options":["November and December","September and October","January and February","July and August","March and April","May and June"],"a":2,"level":3,"why":"Numa was said to have added January and February to make a twelve-month calendar. Rome waited a year after Romulus vanished before choosing him as king.","sec":"numa-tullus-ancus"},{"q":"Which modern historian suggests that the Etruscan king Lars Porsenna may have ended Rome's monarchy himself?","options":["Tim Cornell","Livy","Varro","Fabius Pictor","Arnaldo Momigliano","Mary Beard"],"a":0,"level":3,"why":"Tim Cornell put forward this idea. It builds on the Roman historians Tacitus and Pliny, who recorded that Porsenna actually captured Rome.","sec":"how-reliable"},{"q":"Which hill people living south-east of Rome did Tarquin the Proud fight?","options":["The Volsci","The Samnites","The Sabines","The Hernici","The Aequi","The Gauls"],"a":0,"level":3,"why":"Tarquin fought the Volsci, a hill people to the south-east. His wars made Rome the leading power among the Latin cities.","sec":"tarquin-the-proud"},{"q":"In the legend, what did Romulus and Remus do once grown, before setting out to found their own city?","options":["Took the throne of Alba Longa for themselves","Served as priests of Mars in Alba Longa","Led the Latins against the Etruscans","Overthrew Amulius and restored their grandfather","Married Sabine princesses","Fled to Troy to find their ancestors"],"a":3,"level":3,"why":"The twins overthrew Amulius, who had seized Alba Longa's throne, and restored their grandfather Numitor. They then quarrelled while founding their city, and Remus was killed.","sec":"romulus-and-remus"},{"q":"Romans counted years ab urbe condita. What did that mean?","options":["From the founding of the city","Under the rule of the kings","In the year of the consuls","Since the war with the Sabines"],"a":0,"level":3,"why":"Years were counted from Rome's traditional founding in 753 BC, abbreviated AUC.","sec":"romulus-and-remus"},{"q":"Tarquin the Proud was said to ignore the mos maiorum. What was it?","options":["The ways of the ancestors","The laws of the Twelve Tables","The advice of the augurs","The rights of the plebs"],"a":0,"level":3,"why":"The mos maiorum, \"the ways of the ancestors\", was the unwritten custom Romans expected their rulers to respect.","sec":"tarquin-the-proud"}]},"chronicleMaps":[{"id":"latium","sec":"origins","title":"Rome and its neighbours","caption":"The kings' Rome was one town among many in Latium, between the Etruscans to the north and the Sabines and Volsci in the hills. Where exactly Lake Regillus lay is uncertain.","bounds":{"latMin":41.45,"latMax":42.36,"lonMin":11.68,"lonMax":13.02},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"r","dy":-4},{"name":"Ostia","lat":41.756,"lon":12.291,"side":"l"},{"name":"Veii","lat":42.024,"lon":12.401,"side":"r"},{"name":"Tarquinii","lat":42.249,"lon":11.756,"side":"r"},{"name":"Alba Longa","lat":41.747,"lon":12.65,"side":"r"},{"name":"Lake Regillus","latin":"Lacus Regillus","lat":41.855,"lon":12.68,"kind":"lake","side":"r"},{"name":"Ardea","lat":41.612,"lon":12.541,"side":"r"}],"peoples":[{"name":"Etruscans","latin":"Etrusci","lat":42.13,"lon":11.98},{"name":"Sabines","latin":"Sabini","lat":42.2,"lon":12.78},{"name":"Latins","latin":"Latini","lat":41.67,"lon":12.4},{"name":"Volsci","lat":41.53,"lon":12.86}],"edges":[{"name":"Clusium","text":"Clusium, Porsenna's city","dir":"n","km":150,"lon":12.3},{"name":"Cumae","text":"Cumae, where Tarquin died","dir":"s","km":190,"lon":12.62}]},{"id":"hills","sec":"romulus-the-king","title":"The hills of Rome","caption":"The city grew from villages on these hills. The Forum lay in the valley below the Palatine and the Capitoline, close to the Tiber crossing. The site of the old wooden bridge, the Pons Sublicius, is approximate.","bounds":{"latMin":41.876,"latMax":41.906,"lonMin":12.459,"lonMax":12.509},"hills":[{"name":"Capitoline","latin":"Capitolium","lat":41.8933,"lon":12.4831,"r":0.0016,"side":"l"},{"name":"Palatine","latin":"Palatium","lat":41.8894,"lon":12.4875,"r":0.002,"side":"r"},{"name":"Aventine","latin":"Mons Aventinus","lat":41.8834,"lon":12.4805,"r":0.0022,"side":"l"},{"name":"Caelian","lat":41.8857,"lon":12.4955,"r":0.0019,"side":"r","dy":26},{"name":"Esquiline","lat":41.8955,"lon":12.4985,"r":0.0022,"side":"r"},{"name":"Viminal","lat":41.8995,"lon":12.4955,"r":0.0013,"side":"r"},{"name":"Quirinal","lat":41.9005,"lon":12.4885,"r":0.0017,"side":"l"}],"places":[{"name":"Forum","latin":"Forum Romanum","lat":41.8925,"lon":12.4857,"kind":"area","side":"r","dy":2},{"name":"Circus Maximus","lat":41.8861,"lon":12.4852,"kind":"area","side":"r","dy":2},{"name":"Tiber Island","lat":41.8906,"lon":12.4777,"kind":"island","side":"l"},{"name":"Pons Sublicius","lat":41.8875,"lon":12.4776,"kind":"bridge","side":"l"}],"river":[[41.906,12.4715],[41.9035,12.4672],[41.9,12.4668],[41.897,12.4695],[41.8945,12.4735],[41.892,12.4765],[41.8906,12.4778],[41.8885,12.4779],[41.886,12.4768],[41.883,12.475],[41.877,12.4726]]}],"keyFacts":{"description":"Key facts for the Kingdom chapter: written by hand from the reviewed chapter text. Every entry links to the section that explains it.","people":[{"name":"Romulus","text":"Legendary founder and first king of Rome; chose the first hundred senators.","sec":"romulus-the-king"},{"name":"Remus","text":"Romulus's twin brother, killed after the two quarrelled over founding their city.","sec":"romulus-and-remus"},{"name":"Rhea Silvia","text":"Vestal Virgin and mother of the twins, a princess of Alba Longa.","sec":"romulus-and-remus"},{"name":"Numa Pompilius","text":"The peaceful second king; founded the Vestal Virgins and, legend says, added January and February.","sec":"numa-tullus-ancus"},{"name":"Tullus Hostilius","text":"The warlike third king; destroyed Alba Longa and built the senate house, the Curia Hostilia.","sec":"numa-tullus-ancus"},{"name":"Ancus Marcius","text":"Fourth king; founded the port of Ostia and built the first bridge over the Tiber, the Pons Sublicius.","sec":"numa-tullus-ancus"},{"name":"Tarquinius Priscus","text":"The first Etruscan king; built the Cloaca Maxima and the Circus Maximus and held the first triumph.","sec":"tarquinius-priscus"},{"name":"Servius Tullius","text":"Sixth king; held the first census and sorted citizens into five classes by wealth.","sec":"servius-tullius"},{"name":"Tarquin the Proud","text":"Tarquinius Superbus, the seventh and last king, remembered as a tyrant.","sec":"tarquin-the-proud"},{"name":"Lucretia","text":"Noblewoman whose rape by the king's son and her death sparked the uprising against the kings.","sec":"tarquin-the-proud"},{"name":"Lucius Junius Brutus","text":"The king's nephew who led the revolt; one of Rome's first two consuls.","sec":"birth-of-the-republic"},{"name":"Lars Porsenna","text":"Etruscan king of Clusium who marched on Rome to bring Tarquin back.","sec":"birth-of-the-republic"},{"name":"Horatius Cocles","text":"Hero who, legend says, held the Pons Sublicius alone until it could be torn down.","sec":"birth-of-the-republic"}],"dates":[{"when":"c. 1700 BC","text":"Possible first traces of settlement on the Capitoline Hill.","sec":"origins"},{"when":"753 BC","text":"The traditional founding of Rome, celebrated on 21 April; Romans counted years from it.","sec":"romulus-and-remus"},{"when":"c. 730–720 BC","text":"A wall is built on the Palatine Hill.","sec":"origins"},{"when":"c. 600 BC","text":"The villages have become a city, with a forum, monumental buildings and temples.","sec":"origins"},{"when":"509 BC","text":"Tarquin the Proud is expelled; two consuls are elected and the Republic begins.","sec":"birth-of-the-republic"},{"when":"c. 496 BC","text":"Rome defeats an alliance of Latin towns at Lake Regillus.","sec":"birth-of-the-republic"},{"when":"495 BC","text":"Tarquin dies in exile at Cumae.","sec":"birth-of-the-republic"},{"when":"390 BC","text":"The Gauls sack Rome, destroying many early records.","sec":"how-reliable"},{"when":"c. 200 BC","text":"Fabius Pictor writes the first history of Rome, in Greek.","sec":"how-reliable"}],"terms":[{"latin":"rex","english":"king","sec":"origins"},{"latin":"senatus","english":"the Senate, from *senex*, “old man”","sec":"romulus-the-king"},{"latin":"patres","english":"“fathers”: Romulus's first hundred advisers","sec":"romulus-the-king"},{"latin":"patricii","english":"patricians, Rome's hereditary aristocracy","sec":"romulus-the-king"},{"latin":"plebs","english":"Rome's common people","sec":"numa-tullus-ancus"},{"latin":"lictores","english":"the twelve attendants who walked ahead of the king","sec":"romulus-the-king"},{"latin":"fasces","english":"a bundle of rods around an axe: the power to punish","sec":"how-kings-ruled"},{"latin":"imperium","english":"the supreme power to command armies, govern and judge","sec":"how-kings-ruled"},{"latin":"interrex","english":"“between-king”: a senator who looked for the next king","sec":"how-kings-ruled"},{"latin":"interregnum","english":"the time without a king","sec":"how-kings-ruled"},{"latin":"comitia curiata","english":"the Curiate Assembly, which accepted or rejected a new king","sec":"how-kings-ruled"},{"latin":"auspicia","english":"signs that the gods approved, read by an augur","sec":"how-kings-ruled"},{"latin":"sella curulis","english":"the curule chair, the king's seat of office","sec":"how-kings-ruled"},{"latin":"Pontifex Maximus","english":"the chief priest, an office created by Numa","sec":"numa-tullus-ancus"},{"latin":"Cloaca Maxima","english":"the Great Sewer that drained the ground between the hills","sec":"tarquinius-priscus"},{"latin":"triumphus","english":"the victory parade for a successful general","sec":"tarquinius-priscus"},{"latin":"census","english":"the count of citizens, first held by Servius Tullius","sec":"servius-tullius"},{"latin":"comitia centuriata","english":"the voting assembly by wealth, in which the rich had the most say","sec":"servius-tullius"},{"latin":"mos maiorum","english":"“the ways of the ancestors”: Roman custom","sec":"tarquin-the-proud"},{"latin":"consules","english":"the two consuls elected each year instead of a king","sec":"birth-of-the-republic"},{"latin":"res publica","english":"“the public thing”: the Republic","sec":"birth-of-the-republic"},{"latin":"ab urbe condita","english":"“from the founding of the city”: how Romans counted years","sec":"romulus-and-remus"}]}},{"id":"conflict-of-orders-origins","era":"early-republic","short":"Patricians vs Plebeians","title":"The Conflict of the Orders: Origins","period":"509-450 BC","sources":["Conflict of the Orders","Secessio plebis","Tribune of the plebs","Twelve Tables"],"briefing":{"title":"Rome, 494 BC","paragraphs":["Rome, 494 BC. Fifteen years after driving out its last king, the young Republic is run by two consuls elected each year and a Senate of leading men. All of them come from a small circle of aristocratic families called patricians, who alone hold office and know the unwritten law.","Everyone else is a plebeian. Plebeians farm, trade and fill the army, but while they fight, their farms fail and their debts pile up. Now, with enemies on three sides, the soldiers are about to refuse to march."]},"sections":[{"id":"patricians-and-plebeians","title":"Patricians and Plebeians","body":"According to tradition, the Romans drove out their last king (*rex*) in 509 BC and founded a republic (*res publica*, \"the public thing\"). Power passed to two consuls (*consules*), chief magistrates (*magistratus*) elected for a single year, and to the Senate (*senatus*), a council of leading men. Both belonged to the patricians (*patricii*), a small circle of aristocratic families who alone could stand for office. They also controlled the law, which was unwritten and interpreted only by upper-class priests.\n\nEveryone else was a plebeian (*plebeius*). The plebs (*plebs*, \"the common people\") were the great mass of citizens who farmed, traded and, crucially, filled the ranks of the army (*exercitus*). That duty was a trap. While a plebeian soldier was away on campaign, his farm lay abandoned. Many had to borrow from patricians, and a debtor who could not pay could be beaten, imprisoned or even enslaved, a form of debt bondage the Romans called *nexum*.\n\nLess than twenty years after the Republic began, this resentment boiled over. The long struggle that followed, lasting until 287 BC, is known as the Conflict of the Orders, from the Latin *ordo* (plural *ordines*), a rank of society."},{"id":"debt-crisis","title":"The Debt Crisis of 495 BC","body":"By 495 BC, debt (*aes alienum*, literally \"someone else's bronze\") was the burning issue in Rome. Plebeians, the common citizens, openly asked why moneylenders should be allowed to beat and imprison those who owed them.\n\nLivy (*Titus Livius*), the Roman historian who wrote the fullest account of these years nearly five centuries later, tells a story that captures the mood. A former soldier, ragged and dishevelled, threw himself into the Forum (*Forum Romanum*), Rome's main public square. While he fought the Sabines, a hill people north-east of Rome, raiders had burned his farm and stolen his property. Back home, he borrowed to pay a tax, and crushing interest (*faenus*) swallowed his grandfather's farm, then his father's. Finally his creditors dragged him to prison, whipped him and threatened him with death.\n\nThe crowd erupted, and the story raced through the city. Everyone waited for the consuls or the Senate to act. Instead, one hard-line consul issued decrees reinforcing creditors' right to imprison debtors."},{"id":"first-secession","title":"The First Secession, 494 BC","body":"In 494 BC Rome was at war with three neighbouring peoples: the Sabines, and the Aequi and Volsci, hill tribes to the east and south-east. The plebeian soldiers were called up as usual. This time they refused to march.\n\nAdvised by Sicinius (*Lucius Sicinius Vellutus*), the plebeian leader who masterminded the walkout, they left the city together and camped on the *Mons Sacer*, the \"Sacred Mount\", a hill about 5 km (just over three miles) away. There they built simple defences and waited.\n\nThis tactic became known as a *secessio* (in full *secessio plebis*, \"the withdrawal of the plebs\"), or secession: a mass withdrawal, much like a modern general strike. Its power lay in numbers. Plebeians were the vast majority of Romans and produced most of the city's food and goods. When they left, shops and workshops closed, trade stopped, and the city faced its enemies with no army.\n\nOne modern count puts the total at five secessions between 494 and 287 BC. This first one set the pattern, and it worked."},{"id":"menenius-agrippa","title":"Menenius Agrippa and the Fable of the Belly","body":"With the plebeians camped on the Sacred Mount in 494 BC, the Senate needed a negotiator the strikers would trust. It chose Menenius Agrippa (*Agrippa Menenius Lanatus*), a former consul who was well liked by ordinary Romans.\n\nAccording to tradition, Menenius won them over not with threats but with a story. Once, he said, the limbs (*membra*) of the body grew angry with the belly (*venter*). They did all the work while the belly simply enjoyed the food. So they refused to feed it. But as the belly starved, so did they, and the whole body wasted away.\n\nThe moral was plain. Rome, like a body, could not survive unless patricians and plebeians worked together.\n\nThe plebeians agreed to negotiate, but they wanted more than a fable. Their price for returning was a new kind of official, chosen from among the plebs, to protect them from the power of the consuls. The Senate agreed, and some plebeians were freed from their debts as well."},{"id":"tribunes-of-the-plebs","title":"The Tribunes of the Plebs","body":"The great prize of the first secession of 494 BC was the tribune of the plebs (*tribunus plebis*), the first office in Rome open to commoners. Tradition says the first tribunes took office in 493 BC and soon added Sicinius, leader of the walkout, to their number.\n\nTribunes commanded no troops. Their power rested on an oath: they were sacrosanct, meaning the plebeians swore that anyone who laid hands on one could be killed without penalty. Shielded by this, a tribune could protect a citizen from a magistrate by placing his own untouchable person in the way. From this grew the veto (Latin for \"I forbid\"), the power to block the acts of consuls, other magistrates and even the Senate. A Roman under threat could cry \"I call upon the tribunes!\" (*appello tribunos*).\n\nThere were limits. A tribune had to be physically present to intervene, and his protection held only within Rome and about 1.5 km (a mile) beyond. Ancient sources say there were first two or five tribunes, rising to ten in 457 BC."},{"id":"plebeian-council","title":"A Parliament of the Plebs","body":"The settlement of 494 BC also let plebeians meet in their own assembly, the Plebeian Council (*concilium plebis*). Here they elected their tribunes, the officials who protected commoners, and passed resolutions called plebiscites (*plebiscita*, \"decisions of the plebs\"). At first these bound only plebeians.\n\nThere was a catch. The assembly was first organised by *curiae*, ancient groupings of families in which many plebeians were clients (*clientes*) of patrician patrons (*patroni*) and voted as those patrons wished. The aristocrats could quietly steer who became tribune.\n\nIn 471 BC a tribune pushed through a law (*lex*), the *Lex Publilia*, that changed the rules. Plebeians would now gather and vote by tribe (*tribus*), districts of citizens, rather than by curia, and tribunes would be elected this way. Historians see this as the moment the plebeians became politically independent.\n\nPatricians kept looking for ways to tame the tribunes, such as persuading one tribune to block his colleagues. But the plebs now had a voice of their own, and they soon used it to demand written law."},{"id":"demand-for-written-law","title":"The Demand for Written Law","body":"In the early Republic, Roman law was not written down. It was interpreted only by the pontiffs (*pontifices*), upper-class priests. A plebeian in a dispute with a patrician was fighting by rules only the other side knew.\n\nIn 462 BC a tribune declared that the consuls had become more oppressive than the kings they replaced, and proposed a commission to define and limit their powers. The Senate stalled for five years, pointing to war and plague, while the plebs kept re-electing the same tribunes. In 457 BC the Senate tried to defuse the campaign by raising the number of tribunes to ten.\n\nThe pressure continued. According to Livy, envoys were sent to study the laws of Athens and other Greek cities. Some modern scholars doubt this, suggesting they visited only Greek cities in southern Italy, or borrowed nothing.\n\nAround 450 BC, all regular offices were suspended. A board of ten men, the decemvirs (*decemviri*, \"ten men\"), was given one year of unchallengeable power to write down Rome's laws."},{"id":"twelve-tables","title":"The Twelve Tables","body":"The decemvirs, a board of ten men appointed around 450 BC to write down Rome's laws, produced ten tables, and a second board added two more. In 449 BC the complete Twelve Tables (*Leges Duodecim Tabularum*) were formally published. According to Livy they were engraved on bronze and displayed publicly so every citizen could know them.\n\nThey were a list of specific rules rather than a grand code. Trials ended at sunset. Fruit falling onto a neighbour's land still belonged to the tree's owner. A father who sold his son three times lost his power over him, the *patria potestas* (\"power of the father\").\n\nDebt rules were harsh but clear. A debtor had thirty days to pay; then his creditor could bind him in chains of at least 5 kg (fifteen pounds) and feed him about 330 g (a pound) of bread a day for sixty days. Not everything helped the plebs: one law banned marriage (*conubium*) between patricians and plebeians.\n\nLater Romans revered the Tables, which formed the basis of Roman law for a thousand years."},{"id":"appius-claudius-and-verginia","title":"Appius Claudius, Verginia and the Second Secession","body":"The second board of ten men, the decemvirs appointed to finish Rome's written law, became a tyranny. When their term ended they refused to step down, ruling with no tribunes to check them and no right of appeal (*provocatio*). They even had a soldier killed, a former tribune who had criticised them.\n\nTheir most notorious member was Appius Claudius (*Appius Claudius Crassus*). According to tradition, he tried to rape Verginia, a beautiful plebeian girl whose father was a respected centurion, an army officer. To save her from Appius Claudius, her father killed her himself, to uphold her freedom and virtue.\n\nThe crowd that witnessed the killing rioted, and the anger spread to the army camped outside the city. The people gathered on the Aventine (*Mons Aventinus*), one of Rome's hills, then withdrew to the Sacred Mount. This second secession of 449 BC forced the decemvirs to resign. Two senators negotiated, restored the tribunes and the right of appeal, and as consuls passed laws making plebeian decisions binding on all Romans."},{"id":"how-reliable","title":"How Much of This Really Happened?","body":"For centuries, the story of plebeian strikes, brave tribunes and wicked decemvirs was accepted as straightforward history. Today almost every part of it is controversial.\n\nThe core problem is that no one wrote about these events at the time. Our fullest accounts come from Livy and other writers living more than four centuries later, who are sometimes thought to mix fact and fable freely and to assume Roman institutions barely changed over time.\n\nThere are puzzles, too. Official lists of consuls (*fasti consulares*) include men with plebeian family names in the fifth century BC, when the post was supposedly closed to them. It is odd that such bitter grievances led to so little bloodshed, when similar quarrels in the late Republic quickly turned violent. And it is unclear who the plebs really were: many were wealthy landowners.\n\nOne modern scholar has even argued there was no conflict at all, and that later Romans projected the class struggles of their own day onto a dimly remembered past."}],"battle":{"name":"War with the Volsci","year":"494 BC","enemy":"Volsci, Aequi and Sabines","sec":"first-secession","intro":"Rome is at war with three neighbours: the Sabines, and the Aequi and Volsci, hill tribes to the east and south-east. The plebeians are back from the Sacred Mount, with tribunes of their own. Now Rome needs every soldier."},"timelines":[{"name":"The Big Moments","blurb":"Four turning points in the early struggle between patricians and plebeians.","events":[{"label":"Last king driven out of Rome","when":"509 BC","y":-509,"fact":"According to tradition, the Romans then founded a republic led by two yearly consuls and the Senate.","sec":"patricians-and-plebeians"},{"label":"Plebeians walk out to the Sacred Mount","when":"494 BC","y":-494,"fact":"Plebeian soldiers refused to fight and camped on the Mons Sacer, a hill about 5 km (just over three miles) from Rome.","sec":"first-secession"},{"label":"Lex Publilia: plebs vote by tribe","when":"471 BC","y":-471,"fact":"Voting by tribe instead of by curia freed plebeians from their patrician patrons' influence.","sec":"plebeian-council"},{"label":"Twelve Tables formally published","when":"449 BC","y":-449,"fact":"According to Livy, the laws were engraved on bronze and displayed so every citizen could know them.","sec":"twelve-tables"}]},{"name":"From Debt to Written Law","blurb":"Follow the plebeians from a debt crisis to the long end of their struggle.","events":[{"label":"Ragged ex-soldier stirs the Forum","when":"495 BC","y":-495,"fact":"Livy tells of a veteran ruined by debt and whipped by creditors, whose story enraged the crowd.","sec":"debt-crisis"},{"label":"First tribunes of the plebs take office","when":"493 BC","y":-493,"fact":"The tribunate was the first office in Rome open to commoners.","sec":"tribunes-of-the-plebs"},{"label":"Tribune attacks consuls' power","when":"462 BC","y":-462,"fact":"A tribune claimed the consuls were worse than the kings and proposed a commission to limit them.","sec":"demand-for-written-law"},{"label":"Tribunes increased to ten","when":"457 BC","y":-457,"fact":"The Senate hoped more tribunes would defuse the campaign for written law.","sec":"demand-for-written-law"},{"label":"Decemvirs take power to write laws","when":"Around 450 BC","y":-450,"fact":"All regular offices were suspended and a board of ten men got one year of unchallengeable power.","sec":"demand-for-written-law"},{"label":"Conflict of the Orders ends","when":"287 BC","y":-287,"fact":"The struggle between patricians and plebeians lasted from soon after 509 BC until 287 BC.","sec":"patricians-and-plebeians"}]},{"name":"The Full Struggle","blurb":"Eight steps from the fall of the kings to the fall of the decemvirs.","events":[{"label":"Two consuls replace the kings","when":"509 BC","y":-509,"fact":"Tradition says the Republic began when the Romans drove out their last king.","sec":"patricians-and-plebeians"},{"label":"Consul backs creditors' right to jail","when":"495 BC","y":-495,"fact":"Instead of easing the debt crisis, a hard-line consul reinforced creditors' power to imprison debtors.","sec":"debt-crisis"},{"label":"Menenius tells the fable of the belly","when":"494 BC","y":-494,"fact":"According to tradition, his story persuaded the plebeians on the Sacred Mount to negotiate.","sec":"menenius-agrippa"},{"label":"Sacrosanct tribunes first take office","when":"493 BC","y":-493,"fact":"Anyone who laid hands on a tribune could be killed without penalty.","sec":"tribunes-of-the-plebs"},{"label":"Plebs start voting by tribe","when":"471 BC","y":-471,"fact":"The Lex Publilia is seen by historians as the moment the plebeians became politically independent.","sec":"plebeian-council"},{"label":"Commission to limit consuls proposed","when":"462 BC","y":-462,"fact":"The Senate stalled for five years, pointing to war and plague.","sec":"demand-for-written-law"},{"label":"Laws handed to ten men","when":"Around 450 BC","y":-450,"fact":"The decemvirs were given one year to write down Rome's laws.","sec":"demand-for-written-law"},{"label":"Second secession forces decemvirs out","when":"449 BC","y":-449,"fact":"Outrage over Verginia's death drove the people to the Aventine and then the Sacred Mount.","sec":"appius-claudius-and-verginia"}]}],"matches":[{"name":"Who's Who","blurb":"Match each person to their part in the story.","pairs":[["Sicinius","Plebeian leader who masterminded the first walkout of 494 BC"],["Menenius Agrippa","Popular ex-consul who told the plebs the fable of the belly"],["Appius Claudius","Most notorious decemvir, whose crime sparked the second secession"],["Verginia","Plebeian girl killed by her own father to save her freedom"],["Livy","Roman historian who wrote the fullest account, centuries later"]],"secs":["first-secession","menenius-agrippa","appius-claudius-and-verginia","appius-claudius-and-verginia","debt-crisis"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Tribunus plebis","Tribune of the plebs, the commoners’ protector"],["Veto","“I forbid”: a tribune’s power to block"],["Nexum","Debt bondage"],["Concilium plebis","The Plebeian Council"],["Provocatio","The right of appeal"],["Patria potestas","“Power of the father” over his son"]],"secs":["tribunes-of-the-plebs","tribunes-of-the-plebs","patricians-and-plebeians","plebeian-council","appius-claudius-and-verginia","twelve-tables"]}],"decks":[{"name":"Strike and Settlement","blurb":"From the debt crisis to the first tribunes.","cards":[{"claim":"Rome's two consuls were elected for a single year.","answer":true,"why":"Power passed to two consuls, chief magistrates elected for one year, and to the Senate.","sec":"patricians-and-plebeians"},{"claim":"In the early Republic, plebeians could stand for consul.","answer":false,"why":"Only patricians, a small circle of aristocratic families, could stand for office.","sec":"patricians-and-plebeians"},{"claim":"In Livy's story, the ragged soldier's farm was burned while he fought the Sabines.","answer":true,"why":"Raiders burned his farm while he was away fighting the Sabines, a hill people north-east of Rome.","sec":"debt-crisis"},{"claim":"After the soldier's story spread, a consul cancelled all debts.","answer":false,"why":"A hard-line consul did the opposite, issuing decrees reinforcing creditors' right to imprison debtors.","sec":"debt-crisis"},{"claim":"In the first secession of 494 BC, the plebeians camped on the Mons Sacer.","answer":true,"why":"They camped on the Mons Sacer, the 'Sacred Mount', about 5 km (just over three miles) from Rome.","sec":"first-secession"},{"claim":"Menenius Agrippa was a former consul well liked by ordinary Romans.","answer":true,"why":"The Senate chose him to negotiate because the strikers would trust him.","sec":"menenius-agrippa"},{"claim":"In Menenius's fable, the limbs grew stronger after they stopped feeding the belly.","answer":false,"why":"As the belly starved, so did the limbs, and the whole body wasted away.","sec":"menenius-agrippa"},{"claim":"Tribunes commanded their own troops to protect plebeians.","answer":false,"why":"Tribunes commanded no troops; their power rested on an oath making them sacrosanct.","sec":"tribunes-of-the-plebs"}]},{"name":"Laws and Lawbreakers","blurb":"From the Plebeian Council to the fall of the decemvirs.","cards":[{"claim":"The Lex Publilia of 471 BC made plebeians vote by tribe rather than by curia.","answer":true,"why":"Historians see this as the moment the plebeians became politically independent.","sec":"plebeian-council"},{"claim":"At first, plebiscites were binding on all Romans.","answer":false,"why":"At first they bound only plebeians; laws of 449 BC made plebeian decisions binding on all.","sec":"plebeian-council"},{"claim":"According to Livy, envoys went to study the laws of Carthage.","answer":false,"why":"Livy says they studied the laws of Athens and other Greek cities, though some scholars doubt it.","sec":"demand-for-written-law"},{"claim":"Under the Twelve Tables, a debtor had thirty days to pay.","answer":true,"why":"After thirty days his creditor could chain him and feed him about 330 g (a pound) of bread a day for sixty days.","sec":"twelve-tables"},{"claim":"The Twelve Tables allowed patricians and plebeians to marry each other.","answer":false,"why":"One law banned marriage between patricians and plebeians.","sec":"twelve-tables"},{"claim":"Verginia was killed by Appius Claudius.","answer":false,"why":"Tradition says her own father killed her to save her from Appius Claudius.","sec":"appius-claudius-and-verginia"},{"claim":"The second secession of 449 BC forced the decemvirs to resign.","answer":true,"why":"Two senators then negotiated and restored the tribunes and the right of appeal.","sec":"appius-claudius-and-verginia"},{"claim":"Official consul lists include men with plebeian family names in the fifth century BC.","answer":true,"why":"This is a puzzle, since the post was supposedly closed to plebeians then.","sec":"how-reliable"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Twelve Tables","Tribunes of the plebs","Plebeian Council","Some debts cancelled"],"odd":0,"why":"Tribunes, the Plebeian Council and freedom from some debts all came from the settlement of 494 BC. The Twelve Tables came much later, in 449 BC.","sec":"plebeian-council"},{"items":["Sabines","Athens","Aequi","Volsci"],"odd":1,"why":"The Sabines, Aequi and Volsci were at war with Rome in 494 BC. Athens was the Greek city whose laws Roman envoys reportedly studied.","sec":"first-secession"},{"items":["Sacrosanct person","Veto over magistrates","Command of troops","Shielding citizens in person"],"odd":2,"why":"These were all features of a tribune's power, except troops: tribunes commanded none and relied on their sacred oath.","sec":"tribunes-of-the-plebs"},{"items":["Trials end at sunset","Fallen fruit stays the owner's","No patrician-plebeian marriage","Voting by tribe, not curia"],"odd":3,"why":"Three are rules in the Twelve Tables. Voting by tribe came from the Lex Publilia of 471 BC.","sec":"twelve-tables"},{"items":["No writers at the time","Plebeian names on consul lists","Basis of law for 1,000 years","Surprisingly little bloodshed"],"odd":2,"why":"Three are reasons scholars doubt the traditional story. Lasting a thousand years as the basis of Roman law is praise of the Twelve Tables, not a doubt.","sec":"how-reliable"}]}],"whos":[{"name":"Leaders and Tyrants","blurb":"Three men who shaped the early struggle.","people":[{"name":"Sicinius","options":["Sicinius","Menenius Agrippa","Appius Claudius","Coriolanus"],"clues":["My followers built simple defences outside the city and waited.","I advised the soldiers to leave Rome together instead of fighting the Sabines, Aequi and Volsci.","The walkout I planned ended on the Mons Sacer, the Sacred Mount.","I was the plebeian leader who masterminded the first secession of 494 BC."],"sec":"first-secession"},{"name":"Menenius Agrippa","options":["Menenius Agrippa","Sicinius","Appius Claudius","Cincinnatus"],"clues":["I had already served as consul before the plebeians walked out in 494 BC.","Ordinary Romans liked me, so the Senate sent me to negotiate.","I won over the strikers with a story rather than threats.","I told the fable of the limbs that refused to feed the belly."],"sec":"menenius-agrippa"},{"name":"Appius Claudius","options":["Appius Claudius","Menenius Agrippa","Sicinius","Cincinnatus"],"clues":["I sat on the board meant to finish writing Rome's laws.","When our term ended, my colleagues and I refused to step down.","The second secession of 449 BC forced us to resign.","I was the most notorious decemvir, and tradition says I tried to rape Verginia."],"sec":"appius-claudius-and-verginia"}]},{"name":"Voices and Victims","blurb":"A heroine, a historian and a tribune.","people":[{"name":"Verginia","options":["Verginia","Lucretia","Cloelia","Veturia"],"clues":["My father was a respected centurion, an army officer.","The crowd that saw my death rioted, and the anger spread to the army.","My death led to the second secession of 449 BC.","I was the plebeian girl a notorious decemvir tried to seize."],"sec":"appius-claudius-and-verginia"},{"name":"Livy","options":["Livy","Polybius","Tacitus","Suetonius"],"clues":["Some think I mixed fact and fable and assumed Roman institutions barely changed.","I reported that envoys went to study the laws of Athens.","I told of a ragged former soldier who threw himself into the Forum.","I wrote the fullest account of these years, nearly five centuries later."],"sec":"how-reliable"},{"name":"Sicinius","options":["Sicinius","Coriolanus","Spurius Cassius","Cincinnatus"],"clues":["My power rested on a sworn oath, not on soldiers.","Anyone who laid hands on me could be killed without penalty.","Soon after the first tribunes took office in 493 BC, I was added to their number.","I led the walkout that won the plebs their own officials."],"sec":"tribunes-of-the-plebs"}]}],"maps":[],"quizPool":{"1":[{"q":"What were the resolutions passed by the Plebeian Council called?","options":["Senatus consulta","Decrees","Plebiscites","Edicts"],"a":2,"level":1,"why":"The council passed resolutions called plebiscites. At first these bound only plebeians.","sec":"plebeian-council"},{"q":"What could a Roman threatened by a magistrate cry out for help?","options":["\"I appeal to the gods!\"","\"I am a Roman citizen!\"","\"I call upon the tribunes!\"","\"I call upon the Senate!\""],"a":2,"level":1,"why":"A threatened Roman could call on the tribunes, who would step in to protect him. A tribune had to be physically present to intervene.","sec":"tribunes-of-the-plebs"},{"q":"What was the board of ten men appointed to write down Rome's laws called?","options":["The decemvirs","The triumvirs","The lictors","The quaestors"],"a":0,"level":1,"why":"The decemvirs, meaning 'ten men', were given one year of unchallengeable power to write down the laws. They were appointed around 450 BC.","sec":"demand-for-written-law"},{"q":"Who was the most notorious member of the second board of decemvirs?","options":["Sicinius","Cincinnatus","Menenius Agrippa","Appius Claudius"],"a":3,"level":1,"why":"Appius Claudius was the most infamous of the decemvirs. Tradition blames him for the attack on Verginia that sparked the second secession.","sec":"appius-claudius-and-verginia"},{"q":"A Roman secessio is often compared to which modern tactic?","options":["A general strike","A military coup","A hunger strike","A trade embargo"],"a":0,"level":1,"why":"A secession was a mass withdrawal, much like a modern general strike. When the plebs left, shops and workshops closed and trade stopped.","sec":"first-secession"},{"q":"What was the veto, the tribunes' most famous power?","options":["The power to block acts of magistrates and the Senate","The power to declare war on Rome's enemies","The power to appoint new members of the Senate","The power to command an army in wartime"],"a":0,"level":1,"why":"The veto let a tribune block the acts of consuls, other magistrates and even the Senate. It grew out of the tribune's untouchable status.","sec":"tribunes-of-the-plebs"},{"q":"What did it mean that the tribunes of the plebs were 'sacrosanct'?","options":["They were exempt from paying any taxes","Anyone who harmed one could be killed without penalty","They could never be voted out of office","They also served as priests of Jupiter"],"a":1,"level":1,"why":"The plebeians swore an oath that anyone who laid hands on a tribune could be killed without penalty. This oath, not troops, was the source of a tribune's power.","sec":"tribunes-of-the-plebs"},{"q":"What happened to Rome's regular offices around 450 BC, when the lawmaking board was created?","options":["They were opened to plebeians","They were doubled in number","They were moved outside the city","They were all suspended"],"a":3,"level":1,"why":"All regular offices were suspended so that the decemvirs could write down the laws. The board held unchallengeable power for a year.","sec":"demand-for-written-law"},{"q":"What name is given to the long struggle between Rome's patricians and plebeians?","options":["The Conflict of the Orders","The Gracchan Crisis","The Social War","The Servile War"],"a":0,"level":1,"why":"The struggle is known as the Conflict of the Orders. It broke out less than twenty years after the Republic began.","sec":"patricians-and-plebeians"},{"q":"How long did a consul, one of the Republic's chief magistrates, hold office?","options":["Six months","Five years","A single year","For life"],"a":2,"level":1,"why":"The two consuls were elected for a single year. Like the Senate, they came from the patrician families.","sec":"patricians-and-plebeians"},{"q":"Which Roman historian wrote the fullest account of the early Republic's debt crisis?","options":["Livy","Tacitus","Sallust","Suetonius"],"a":0,"level":1,"why":"Livy wrote the fullest account of these years. He tells the story of a ruined former soldier that captured the angry mood of 495 BC.","sec":"debt-crisis"},{"q":"What is the core problem for historians studying the early Conflict of the Orders?","options":["The surviving laws cannot be read","No one wrote about the events at the time","All the records were burned by invaders","The only sources are written in Greek"],"a":1,"level":1,"why":"No one recorded these events at the time. The fullest accounts come from Livy and others writing more than four centuries later.","sec":"how-reliable"},{"q":"Whom did the Senate send to negotiate with the plebeians on the Sacred Mount?","options":["Lucius Brutus","Menenius Agrippa","Appius Claudius","Sicinius"],"a":1,"level":1,"why":"The Senate chose Menenius Agrippa, a former consul trusted by ordinary Romans. Tradition says he won the strikers over with a story rather than threats.","sec":"menenius-agrippa"},{"q":"According to tradition, who killed Verginia to save her from Appius Claudius?","options":["Her betrothed","Her brother","She killed herself","Her father"],"a":3,"level":1,"why":"Her father killed her to uphold her freedom and virtue. He was a respected centurion, and the killing set off riots.","sec":"appius-claudius-and-verginia"},{"q":"In Menenius Agrippa's traditional fable, which part of the body did the limbs grow angry with?","options":["The heart","The belly","The eyes","The head"],"a":1,"level":1,"why":"The limbs resented the belly for enjoying food while they did all the work. When they starved it, they wasted away too.","sec":"menenius-agrippa"},{"q":"According to Livy, what were the Twelve Tables engraved on?","options":["Bronze","Clay","Wood","Marble"],"a":0,"level":1,"why":"Livy says the Tables were engraved on bronze and displayed publicly. That way every citizen could know the law.","sec":"twelve-tables"},{"q":"What did one modern scholar argue about the Conflict of the Orders?","options":["That patricians actually led it","That there was no conflict at all","That it began under the kings","That it lasted only a single year"],"a":1,"level":1,"why":"One scholar argued there was no conflict at all. On this view, later Romans projected their own class struggles onto a dimly remembered past.","sec":"how-reliable"},{"q":"What was the first office in Rome open to commoners?","options":["Censor","Tribune of the plebs","Consul","Praetor"],"a":1,"level":1,"why":"The tribune of the plebs was the great prize won by the first secession. Tradition says the first tribunes took office in 493 BC.","sec":"tribunes-of-the-plebs"},{"q":"What was the moral of Menenius Agrippa's fable of the belly?","options":["Rome's people must always obey the consuls","Rome must conquer new land to feed its people","The poor should work harder if they want to eat","Rome needs patricians and plebeians to work together"],"a":3,"level":1,"why":"Like a body, Rome could only survive if its parts cooperated. The plebeians agreed to negotiate, but wanted more than a fable.","sec":"menenius-agrippa"},{"q":"Where did the plebeians camp during the first secession of 494 BC?","options":["The Janiculum","The Sacred Mount","The Capitoline Hill","The port of Ostia"],"a":1,"level":1,"why":"They camped on the Mons Sacer, the 'Sacred Mount', a hill about 5 km (just over three miles) from the city. There they built simple defences and waited.","sec":"first-secession"},{"q":"In Livy's story, where did the ragged former soldier throw himself to tell his tale?","options":["The Forum","The Senate house","The Circus Maximus","The Capitol temple"],"a":0,"level":1,"why":"The ragged soldier burst into the Forum, Rome's main public square. His story raced through the city.","sec":"debt-crisis"},{"q":"Under the Twelve Tables, when did trials have to end?","options":["At the first vote","At noon","At sunset","After three days"],"a":2,"level":1,"why":"Trials ended at sunset. The Tables were a list of specific rules like this rather than a grand legal code.","sec":"twelve-tables"},{"q":"What was the plebeians' own assembly, created by the settlement of 494 BC, called?","options":["The College of Pontiffs","The Centuriate Assembly","The Plebeian Council","The Areopagus"],"a":2,"level":1,"why":"The Plebeian Council let commoners meet in their own assembly. There they elected their tribunes.","sec":"plebeian-council"},{"q":"What did the second secession of 449 BC force the decemvirs to do?","options":["Cancel all debts","Resign from power","Flee to Etruria","Rewrite the laws"],"a":1,"level":1,"why":"The second secession forced the tyrannical decemvirs to resign. Afterwards the tribunes and the right of appeal were restored.","sec":"appius-claudius-and-verginia"},{"q":"Which law of 471 BC changed how the Plebeian Council voted?","options":["Lex Canuleia","Lex Hortensia","Lex Licinia","Lex Publilia"],"a":3,"level":1,"why":"A tribune pushed through the Lex Publilia in 471 BC. Historians see it as the moment the plebeians became politically independent.","sec":"plebeian-council"},{"q":"Who was the plebeian leader who masterminded the walkout of 494 BC?","options":["Sicinius","Cincinnatus","Menenius Agrippa","Appius Claudius"],"a":0,"level":1,"why":"Sicinius advised the plebeians to leave the city together. Tradition says he was soon added to the first tribunes of the plebs.","sec":"first-secession"},{"q":"In the early Republic, who interpreted Rome's unwritten law?","options":["The pontiffs","The Vestal Virgins","The plebeian elders","The tribunes"],"a":0,"level":1,"why":"Only the pontiffs, upper-class priests, interpreted the law. A plebeian in a dispute with a patrician was fighting by rules only the other side knew.","sec":"demand-for-written-law"},{"q":"In Livy's story, which enemy was the soldier fighting when raiders burned his farm?","options":["The Sabines","The Gauls","The Samnites","The Etruscans"],"a":0,"level":1,"why":"He was away fighting the Sabines, a hill people north-east of Rome. While he was gone, raiders burned his farm and stole his property.","sec":"debt-crisis"},{"q":"According to tradition, in what year did the Romans drive out their last king and found a republic?","options":["451 BC","494 BC","753 BC","509 BC"],"a":3,"level":1,"why":"Tradition dates the expulsion of Rome's last king and the founding of the Republic to 509 BC. Power then passed to two consuls and the Senate.","sec":"patricians-and-plebeians"},{"q":"For roughly how long did the Twelve Tables form the basis of Roman law?","options":["A thousand years","About a century","Two centuries","Five hundred years"],"a":0,"level":1,"why":"The Twelve Tables underpinned Roman law for a thousand years. Later Romans revered them.","sec":"twelve-tables"},{"q":"What does the Latin word veto mean?","options":["I forbid","I agree","I appeal","I command"],"a":0,"level":1,"why":"A tribune who said veto blocked an act of a magistrate or even the Senate.","sec":"tribunes-of-the-plebs"},{"q":"What was a secessio plebis?","options":["A mass withdrawal of the plebs from Rome","A meeting of the Senate","A new written law","A tax for the army"],"a":0,"level":1,"why":"The plebs left the city together, like a general strike, until their demands were met.","sec":"first-secession"},{"q":"Plebeians filled the ranks of the exercitus. What was it?","options":["The army","The Senate","The Plebeian Council","The priesthood"],"a":0,"level":1,"why":"Plebeian soldiers were most of the army, which is why their refusal to fight was so powerful.","sec":"patricians-and-plebeians"}],"2":[{"q":"What was nexum?","options":["Debt bondage","A plebeian assembly","A marriage between patricians and plebeians","A tribune’s oath"],"a":0,"level":2,"why":"A debtor who could not pay could be enslaved: the Romans called this nexum.","sec":"patricians-and-plebeians"},{"q":"Plebiscites take their name from the Latin plebiscita. What did it mean?","options":["Decisions of the plebs","Votes of the Senate","Laws of the kings","Rights of the soldiers"],"a":0,"level":2,"why":"Plebiscites were the resolutions of the Plebeian Council; at first they bound only plebeians.","sec":"plebeian-council"},{"q":"The second board of decemvirs ruled with no provocatio. What was it?","options":["The right of appeal","The right to marry","The right to vote by tribe","The right to own land"],"a":0,"level":2,"why":"Without the right of appeal, citizens had no protection against the decemvirs.","sec":"appius-claudius-and-verginia"},{"q":"In Livy's story, why did the ruined former soldier first borrow money?","options":["To pay a tax","To pay his daughter's dowry","To buy new weapons","To buy seed for planting","To pay a ransom to raiders"],"a":0,"level":2,"why":"He borrowed to pay a tax, and crushing interest swallowed his grandfather's farm and then his father's. Finally his creditors imprisoned and whipped him.","sec":"debt-crisis"},{"q":"What was the plebeians' main price for returning to Rome after the first secession?","options":["A complete written code of Roman law","A share of the land conquered from the Sabines","Permanent seats for plebeians in the Senate","A new official chosen from the plebs to protect them","The right to elect one of the two consuls"],"a":3,"level":2,"why":"The plebs demanded an official chosen from among themselves to shield them from the consuls. The Senate agreed, creating the tribune of the plebs.","sec":"menenius-agrippa"},{"q":"Which Twelve Tables rule worked against the plebeians?","options":["A ban on plebeians speaking in court","A ban on plebeians entering temples","A ban on plebeians serving in the army","A ban on plebeians owning farmland","A ban on marriage between patricians and plebeians"],"a":4,"level":2,"why":"One law banned marriage between patricians and plebeians. The Tables' debt rules were also harsh, though at least clear.","sec":"twelve-tables"},{"q":"What puzzle in the official lists of consuls troubles historians?","options":["They show no consuls at all before 400 BC","They name several consuls known to be Greek","They include plebeian family names in the fifth century BC","They leave out every year of the decemvirs","Some years list three consuls instead of two"],"a":2,"level":2,"why":"Men with plebeian family names appear as consuls in the fifth century BC. Yet the post was supposedly closed to plebeians then.","sec":"how-reliable"},{"q":"Under the Twelve Tables, who owned fruit that fell from a tree onto a neighbour's land?","options":["The Roman state","Whoever picked it up first","Both owners shared it equally","The neighbour","The owner of the tree"],"a":4,"level":2,"why":"Fallen fruit still belonged to the tree's owner. Such specific everyday rules are typical of the Twelve Tables.","sec":"twelve-tables"},{"q":"What did the Lex Publilia of 471 BC change?","options":["Debt slavery would be abolished","Plebeians would vote by tribe rather than by curia","One consul each year had to be a plebeian","Plebiscites would now bind all Romans","Tribunes would become members of the Senate"],"a":1,"level":2,"why":"Plebeians would now vote by tribe, districts of citizens, and elect tribunes this way. This freed them from the influence of patrician patrons.","sec":"plebeian-council"},{"q":"How far did a tribune's protection extend?","options":["Within Rome and about 1.5 km (a mile) beyond","Throughout the whole of Italy","Only inside the Forum itself","Wherever the Roman army marched","Within 15 km (ten miles) of the city"],"a":0,"level":2,"why":"A tribune's protection held only within Rome and about 1.5 km (a mile) beyond. He also had to be physically present to intervene.","sec":"tribunes-of-the-plebs"},{"q":"Why did the Senate raise the number of tribunes to ten in 457 BC?","options":["To defuse the campaign for written law","To replace the consuls during a plague","To reward the plebs for a victory in war","To give one tribune to each new tribe","To welcome envoys returning from Greece"],"a":0,"level":2,"why":"The Senate hoped extra tribunes would calm the push for written law. It had already stalled for five years, citing war and plague.","sec":"demand-for-written-law"},{"q":"What did the second board of decemvirs do when their term ended?","options":["Refused to step down and ruled without tribunes","Asked the plebs to extend their term","Published the final laws and retired","Fled Rome to escape prosecution","Handed power to two newly elected consuls"],"a":0,"level":2,"why":"The decemvirs clung to power, with no tribunes to check them and no right of appeal. They even had a former tribune who criticised them killed.","sec":"appius-claudius-and-verginia"},{"q":"Why did organising the early Plebeian Council by curiae help the patricians?","options":["Votes were counted by patrician priests","Only landowners were allowed to join a curia","Curiae could meet only when the consuls allowed","Patricians held half the seats in every curia","Many plebeians voted as their patrician patrons wished"],"a":4,"level":2,"why":"In the curiae, many plebeians depended on patrician patrons and voted as instructed. This let aristocrats quietly steer who became tribune.","sec":"plebeian-council"},{"q":"During the second secession, where did the people gather before withdrawing to the Sacred Mount?","options":["The Janiculum","The Palatine","The Capitoline","The Quirinal","The Aventine"],"a":4,"level":2,"why":"The people first gathered on the Aventine hill, then withdrew to the Sacred Mount. The anger had spread from the crowd to the army camped outside the city.","sec":"appius-claudius-and-verginia"},{"q":"Why was a secession such a powerful weapon for the plebeians?","options":["They could call on foreign allies for help","They were most Romans and produced most food and goods","They controlled the city's temples and treasury","They held most of the seats in the Senate","They owned all of the city's grain warehouses"],"a":1,"level":2,"why":"The plebs were the vast majority and produced most of Rome's food and goods. When they left, trade stopped and the city faced its enemies with no army.","sec":"first-secession"},{"q":"In 462 BC, what did a tribune claim about the consuls?","options":["They had stolen from the city's treasury","They were plotting to bring back the kings","They had betrayed Rome to the Volsci","They were too weak to defend the city","They had become more oppressive than the kings"],"a":4,"level":2,"why":"The tribune said the consuls were worse than the kings they had replaced. He proposed a commission to define and limit their powers.","sec":"demand-for-written-law"},{"q":"Tribunes commanded no troops. How could a tribune protect a citizen from a magistrate?","options":["By placing his own untouchable person in the way","By bribing the magistrate's guards","By calling out a plebeian militia","By appealing to the gods in a temple","By paying the citizen's fine himself"],"a":0,"level":2,"why":"Because tribunes were sacrosanct, a tribune could physically stand between a citizen and a magistrate. From this grew the power of veto.","sec":"tribunes-of-the-plebs"},{"q":"How did one hard-line consul respond to the public outcry over debt in 495 BC?","options":["He reinforced creditors' right to imprison debtors","He created the office of tribune of the plebs","He exiled the city's leading moneylenders","He cancelled all debts owed to patricians","He gave public land to ruined veterans"],"a":0,"level":2,"why":"Instead of relief, the consul strengthened creditors' power to imprison debtors. The next year the plebeian soldiers refused to march.","sec":"debt-crisis"},{"q":"In the early Republic, who alone could stand for office?","options":["Wealthy plebeian traders","Any citizen-soldier","Only the pontiffs","Former army officers","The patricians"],"a":4,"level":2,"why":"Only the patricians, a small circle of aristocratic families, could stand for office. Both the consuls and the Senate came from their ranks.","sec":"patricians-and-plebeians"},{"q":"Why do historians find the lack of bloodshed in the early conflict odd?","options":["Ancient sources describe constant street battles","The patricians had hired foreign mercenaries","The plebeians controlled all of the army's weapons","Roman law demanded death for any rebellion","Similar quarrels in the late Republic quickly turned violent"],"a":4,"level":2,"why":"Such bitter grievances produced surprisingly little violence, unlike the late Republic's quarrels. This is one of several puzzles that make the traditional story controversial.","sec":"how-reliable"},{"q":"Why did the Senate choose Menenius Agrippa as its negotiator in 494 BC?","options":["He commanded the army facing the Volsci","He had written down Rome's first laws","He was a former consul well liked by ordinary Romans","He was the chief priest of Rome","He had led the plebeian walkout himself"],"a":2,"level":2,"why":"The Senate needed someone the strikers would trust, so it chose a popular former consul. Tradition says he persuaded them with the fable of the belly.","sec":"menenius-agrippa"},{"q":"Why was military service a trap for plebeian soldiers in the early Republic?","options":["They had to pay for their own warships","They lost their vote while they were enlisted","Their farms lay abandoned while they were on campaign","They were sent abroad for decades at a time","They were paid only in conquered land"],"a":2,"level":2,"why":"While soldiers were away, their farms went untended. Many had to borrow from patricians, and defaulting debtors could be beaten, imprisoned or even enslaved.","sec":"patricians-and-plebeians"}],"3":[{"q":"What do ancient sources say about the number of tribunes of the plebs before 457 BC?","options":["There were first ten, later cut to two","There were first four, two per consul","There were first three, one per tribe","There were first two or five; sources differ","There was always exactly one","There were first twelve, one per table"],"a":3,"level":3,"why":"Ancient sources disagree, giving either two or five original tribunes. The number rose to ten in 457 BC.","sec":"tribunes-of-the-plebs"},{"q":"Until what year did the Conflict of the Orders last?","options":["449 BC","264 BC","287 BC","312 BC","367 BC","133 BC"],"a":2,"level":3,"why":"The struggle lasted until 287 BC. It began less than twenty years after the Republic's traditional founding in 509 BC.","sec":"patricians-and-plebeians"},{"q":"Besides creating a new protective official, what further concession did the Senate make to end the first secession?","options":["The laws were published on bronze tablets","Some plebeians were freed from their debts","One consulship was reserved for plebeians","Plebeians could marry into patrician families","Conquered Sabine land was shared out","Debt slavery was abolished for good"],"a":1,"level":3,"why":"As well as agreeing to the new official, the Senate freed some plebeians from their debts. The intermarriage ban, by contrast, was later written into the Twelve Tables.","sec":"menenius-agrippa"},{"q":"Roughly how long after the debt crisis of 495 BC did Livy write his account of it?","options":["About three centuries later","Within a single generation","About two centuries later","About a century later","Nearly five centuries later","Almost eight centuries later"],"a":4,"level":3,"why":"Livy wrote nearly five centuries after these events. That gap is a major reason modern historians question the traditional story.","sec":"debt-crisis"},{"q":"Even after the Lex Publilia, how did patricians try to tame the tribunes?","options":["By making tribunes swear loyalty to the consuls","By having tribunes exiled for sacrilege","By bribing plebeian voters at every election","By persuading one tribune to block his colleagues","By forbidding the Plebeian Council to meet","By cutting the number of tribunes to two"],"a":3,"level":3,"why":"Patricians tried to turn tribunes against each other, getting one to block his colleagues. Still, the plebs now had a voice and used it to demand written law.","sec":"plebeian-council"},{"q":"What surprising point do historians raise about who the plebeians really were?","options":["Many were wealthy landowners","Most were freed slaves from Greece","Many were foreigners without citizenship","Most were members of the priesthood","Most were recent Sabine immigrants","Many were patricians who had lost status"],"a":0,"level":3,"why":"Many plebeians were wealthy landowners, which complicates the picture of poor commoners against rich aristocrats. It is one of several puzzles about the traditional story.","sec":"how-reliable"},{"q":"According to one modern count, how many secessions did the plebeians stage between 494 and 287 BC?","options":["Two","Nine","Twelve","Five","Seven","Three"],"a":3,"level":3,"why":"One modern count gives five secessions in this period. The first, in 494 BC, set the pattern, and it worked.","sec":"first-secession"},{"q":"Romans called debt aes alienum. What does it mean, word for word?","options":["Someone else’s bronze","A heavy burden","The lender’s chain","Borrowed grain"],"a":0,"level":3,"why":"Bronze was Rome’s early money, so a debt was literally bronze that belonged to someone else.","sec":"debt-crisis"},{"q":"In the Twelve Tables, what was the patria potestas?","options":["A father’s power over his son","The power of the consuls","A patrician’s right to land","The protection of the tribunes"],"a":0,"level":3,"why":"The Tables limited it: a father who sold his son three times lost his power over him.","sec":"twelve-tables"}]},"chronicleMaps":[{"id":"war-494","sec":"first-secession","title":"Rome at war, 494 BC","caption":"That year Rome faced three enemies at once: the Sabines to the north-east and the Aequi and Volsci in the hills to the east and south-east. Without the plebeian soldiers, it had no army to meet them.","bounds":{"latMin":41.42,"latMax":42.32,"lonMin":12.15,"lonMax":13.45},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"r","dy":-4}],"peoples":[{"name":"Sabines","latin":"Sabini","lat":42.17,"lon":12.86},{"name":"Aequi","lat":41.98,"lon":13.2},{"name":"Volsci","lat":41.6,"lon":13.12},{"name":"Latins","latin":"Latini","lat":41.68,"lon":12.62}]},{"id":"sacred-mount","sec":"menenius-agrippa","title":"From the Forum to the Sacred Mount","caption":"The plebs walked out of the city to the Sacred Mount (Mons Sacer), a low hill by the Anio river about 5 km (three miles) from the Forum. In 449 BC they gathered first on the Aventine. The rivers are simplified.","bounds":{"latMin":41.877,"latMax":41.953,"lonMin":12.458,"lonMax":12.558},"hills":[{"name":"Sacred Mount","latin":"Mons Sacer","lat":41.9425,"lon":12.5336,"r":0.0022,"side":"l"},{"name":"Aventine","latin":"Mons Aventinus","lat":41.8834,"lon":12.4805,"r":0.0024,"side":"r"}],"places":[{"name":"Forum","latin":"Forum Romanum","lat":41.8925,"lon":12.4857,"kind":"area","side":"r","dy":0}],"rivers":[{"name":"Tiber","pts":[[41.953,12.489],[41.945,12.496],[41.937,12.497],[41.93,12.489],[41.924,12.478],[41.918,12.4715],[41.912,12.4745],[41.906,12.4715],[41.9035,12.4672],[41.9,12.4668],[41.897,12.4695],[41.8945,12.4735],[41.892,12.4765],[41.8906,12.4778],[41.8885,12.4779],[41.886,12.4768],[41.883,12.475],[41.877,12.4726]]},{"name":"Anio","small":true,"pts":[[41.946,12.558],[41.944,12.546],[41.9455,12.536],[41.9435,12.524],[41.94,12.512],[41.937,12.497]]}],"riverWidth":5}],"keyFacts":{"description":"Key facts for this chapter, written by hand from the chapter text. Every entry links to the section that explains it.","people":[{"name":"Sicinius","text":"The plebeian leader who masterminded the first walkout; later one of the first tribunes.","sec":"first-secession"},{"name":"Menenius Agrippa","text":"Former consul who won the strikers back with the fable of the belly.","sec":"menenius-agrippa"},{"name":"Appius Claudius","text":"The most notorious of the decemvirs, whose tyranny led to the second secession.","sec":"appius-claudius-and-verginia"},{"name":"Verginia","text":"Plebeian girl killed by her own father to save her from Appius Claudius.","sec":"appius-claudius-and-verginia"},{"name":"Livy","text":"The Roman historian who wrote the fullest account of these years, about five centuries later.","sec":"debt-crisis"}],"dates":[{"when":"509 BC","text":"The last king is driven out; two consuls rule the new Republic.","sec":"patricians-and-plebeians"},{"when":"495 BC","text":"The debt crisis: a ragged ex-soldier stirs up the Forum.","sec":"debt-crisis"},{"when":"494 BC","text":"The first secession to the Sacred Mount.","sec":"first-secession"},{"when":"493 BC","text":"The first tribunes of the plebs take office.","sec":"tribunes-of-the-plebs"},{"when":"471 BC","text":"The *Lex Publilia*: the plebs vote by tribe.","sec":"plebeian-council"},{"when":"457 BC","text":"The number of tribunes rises to ten.","sec":"demand-for-written-law"},{"when":"c. 450 BC","text":"The decemvirs are appointed to write down the laws.","sec":"demand-for-written-law"},{"when":"449 BC","text":"The Twelve Tables are published; the second secession ends the decemvirs’ rule.","sec":"twelve-tables"},{"when":"287 BC","text":"The Conflict of the Orders ends.","sec":"patricians-and-plebeians"}],"terms":[{"latin":"res publica","english":"“the public thing”: the Republic","sec":"patricians-and-plebeians"},{"latin":"consules","english":"the two consuls, elected each year","sec":"patricians-and-plebeians"},{"latin":"patricii","english":"patricians, the aristocratic families who held power","sec":"patricians-and-plebeians"},{"latin":"plebs","english":"the common people, most citizens and most soldiers","sec":"patricians-and-plebeians"},{"latin":"ordo, ordines","english":"a rank of society, hence “Conflict of the Orders”","sec":"patricians-and-plebeians"},{"latin":"nexum","english":"debt bondage","sec":"patricians-and-plebeians"},{"latin":"aes alienum","english":"debt: literally “someone else’s bronze”","sec":"debt-crisis"},{"latin":"secessio plebis","english":"“the withdrawal of the plebs”, a mass walkout","sec":"first-secession"},{"latin":"Mons Sacer","english":"the Sacred Mount, where the plebs camped","sec":"first-secession"},{"latin":"tribunus plebis","english":"tribune of the plebs, the commoners’ protector","sec":"tribunes-of-the-plebs"},{"latin":"veto","english":"“I forbid”: a tribune’s power to block","sec":"tribunes-of-the-plebs"},{"latin":"appello tribunos","english":"“I call upon the tribunes!”","sec":"tribunes-of-the-plebs"},{"latin":"concilium plebis","english":"the Plebeian Council","sec":"plebeian-council"},{"latin":"plebiscita","english":"“decisions of the plebs”: plebiscites","sec":"plebeian-council"},{"latin":"clientes, patroni","english":"clients and their patrons","sec":"plebeian-council"},{"latin":"pontifices","english":"the priests
