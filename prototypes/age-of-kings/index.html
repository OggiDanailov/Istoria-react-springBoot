// Drawn from the chapter's maps.json: a region map (coast, Tiber, towns, peoples, far-away places as arrows at the
// edge) or a city map (hills, river, landmarks). Tap to enlarge.
function chronicleMap(m) {
  const b = m.bounds ?? { latMin: 0, latMax: 1, lonMin: 0, lonMax: 1 }, kx = Math.cos((b.latMin + b.latMax) / 2 * Math.PI / 180)
  const W = 300, H = Math.round(W * (b.latMax - b.latMin) / ((b.lonMax - b.lonMin) * kx))
  const P = (lat, lon) => [(lon - b.lonMin) / (b.lonMax - b.lonMin) * W, (b.latMax - lat) / (b.latMax - b.latMin) * H]
  const path = pts => pts.map(([la, lo], i) => `${i ? 'L' : 'M'}${P(la, lo).map(v => v.toFixed(1)).join(',')}`).join(' ')
  const label = (x, y, p, gap = 7) => {
    const r = p.side !== 'l', tx = (x + (r ? gap : -gap)).toFixed(1), ty = y + 3.2 + (p.dy ?? 0)
    return `<text x="${tx}" y="${ty.toFixed(1)}" text-anchor="${r ? 'start' : 'end'}">${esc(p.name)}${p.note ? ` <tspan class="note">(${esc(p.note)})</tspan>` : ''}${p.latin ? `<tspan class="la" x="${tx}" dy="9.5">${esc(p.latin)}</tspan>` : ''}</text>`
  }
  let art = ''
  // a battle plan: unit blocks and arrows in a 300-wide grid (Rome red, the enemy blue)
  if (m.plan) {
    const H = m.height ?? 200, head = (pts, cls) => { const [x1, y1] = pts.at(-2), [x2, y2] = pts.at(-1), a = Math.atan2(y2 - y1, x2 - x1); return `<path class="move-head ${cls}" d="M${x2},${y2} L${(x2 - 7 * Math.cos(a - 0.5)).toFixed(1)},${(y2 - 7 * Math.sin(a - 0.5)).toFixed(1)} L${(x2 - 7 * Math.cos(a + 0.5)).toFixed(1)},${(y2 - 7 * Math.sin(a + 0.5)).toFixed(1)}Z"/>` }
    art += `<rect class="ground" x="0" y="0" width="300" height="${H}"/>`
    for (const r of m.rivers ?? []) art += `<path class="river big small" d="M${r.pts.map(p => p.join(',')).join(' L')}"/>` + (r.name ? `<text class="river-name" x="${r.label[0]}" y="${r.label[1]}" text-anchor="middle">${esc(r.name)}</text>` : '')
    for (const u of m.units) art += u.d ? `<path class="unit ${u.side}" d="${u.d}"/>` : `<rect class="unit ${u.side}" x="${u.x}" y="${u.y}" width="${u.w}" height="${u.h}" rx="2"/>`
    for (const a of m.moves ?? []) art += `<path class="move ${a.side}${a.dashed ? ' dashed' : ''}" d="M${a.pts.map(p => p.join(',')).join(' L')}"/>` + head(a.pts, a.side)
    for (const u of m.units) if (u.name) art += `<text class="unit-name" x="${u.lx ?? u.x + u.w / 2}" y="${u.ly ?? u.y + u.h + 9}" text-anchor="${u.anchor ?? 'middle'}">${esc(u.name)}</text>`
    art += `<rect class="unit rome" x="8" y="${H - 15}" width="9" height="7" rx="1"/><text class="key" x="21" y="${H - 8.5}">${esc(m.key?.rome ?? 'Romans')}</text>`
    art += `<rect class="unit enemy" x="${300 - 10 - 9}" y="${H - 15}" width="9" height="7" rx="1"/><text class="key" x="${300 - 23}" y="${H - 8.5}" text-anchor="end">${esc(m.key?.enemy ?? 'Enemy')}</text>`
    return `<figure class="cmap" tabindex="0" aria-label="Map: ${esc(m.title)}. Tap to enlarge.">
    <svg viewBox="0 0 300 ${H}" role="img" aria-label="${esc(m.title)}">${art}</svg>
    <figcaption><b>${esc(m.title)}.</b> ${esc(m.caption)} <span class="tap">Tap the map to enlarge it.</span></figcaption>
  </figure>`
  }
  if (m.hills) {
    art += `<rect class="ground" x="0" y="0" width="${W}" height="${H}"/>`
    for (const h of m.hills) { const [x, y] = P(h.lat, h.lon), r = h.r / (b.latMax - b.latMin) * H; art += `<ellipse class="hill" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(r * 1.15).toFixed(1)}" ry="${r.toFixed(1)}"/>` }
    for (const r of m.rivers ?? [{ pts: m.river }]) art += `<path class="river big ${r.small ? 'small' : ''}" d="${path(r.pts)}"${m.riverWidth ? ` style="stroke-width:${r.small ? m.riverWidth * 0.6 : m.riverWidth}"` : ''}/>`
    for (const r of m.rivers ?? []) if (r.name) { const [x, y] = P(...r.pts[Math.floor(r.pts.length / 2)]); art += `<text class="river-name" x="${x.toFixed(1)}" y="${(y - 7).toFixed(1)}" text-anchor="middle">${esc(r.name)}</text>` }
    for (const p of m.places) {
      const [x, y] = P(p.lat, p.lon)
      if (p.kind === 'area') art += `<ellipse class="area" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="9" ry="5.5"/>`
      if (p.kind === 'island') art += `<ellipse class="island" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="3" ry="6"/>`
      if (p.kind === 'bridge') art += `<line class="bridge" x1="${(x - 8).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + 8).toFixed(1)}" y2="${y.toFixed(1)}"/>`
    }
    for (const h of m.hills) { const [x, y] = P(h.lat, h.lon), r = h.r / (b.latMax - b.latMin) * H; art += label(x, y, h, r * 1.15 + 3) }
    for (const p of m.places) { const [x, y] = P(p.lat, p.lon); art += label(x, y, p, p.kind === 'area' ? 11 : 9) }
  } else {
    art += `<rect class="sea" x="0" y="0" width="${W}" height="${H}"/>`
    // tiny outlines (San Marino, the Vatican) would show as stray shapes at this scale
    art += `<path class="land" d="${LAND.filter(l => l.pts.length > 6).map(l => path(l.pts.map(([lo, la]) => [la, lo])) + 'Z').join(' ')}"/>`
    art += `<path class="river" d="${path(TIBER)}"/>`
    for (const r of m.rivers ?? []) { art += `<path class="river" d="${path(r.pts)}"/>`; if (r.name) { const [x, y] = P(...r.pts[Math.floor(r.pts.length / 2)]); art += `<text class="river-name" x="${(x + 5).toFixed(1)}" y="${y.toFixed(1)}">${esc(r.name)}</text>` } }
    // routes: a dashed line with an arrowhead at the end
    for (const r of m.routes ?? []) {
      const pts = r.pts.map(([la, lo]) => P(la, lo)), [x1, y1] = pts.at(-2), [x2, y2] = pts.at(-1), a = Math.atan2(y2 - y1, x2 - x1)
      art += `<path class="route" d="${path(r.pts)}"/><path class="route-head" d="M${x2.toFixed(1)},${y2.toFixed(1)} L${(x2 - 7 * Math.cos(a - 0.45)).toFixed(1)},${(y2 - 7 * Math.sin(a - 0.45)).toFixed(1)} L${(x2 - 7 * Math.cos(a + 0.45)).toFixed(1)},${(y2 - 7 * Math.sin(a + 0.45)).toFixed(1)} Z"/>`
    }
    for (const p of m.peoples ?? []) { const [x, y] = P(p.lat, p.lon); art += `<text class="people" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle">${esc(p.name)}${p.latin ? `<tspan class="la" x="${x.toFixed(1)}" dy="9">${esc(p.latin)}</tspan>` : ''}</text>` }
    for (const p of m.places) {
      const [x, y] = P(p.lat, p.lon)
      art += p.kind === 'lake' ? `<ellipse class="lake" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="4.5" ry="3"/>`
        : p.kind === 'battle' ? `<path class="battle" d="M${(x - 4).toFixed(1)},${(y - 4).toFixed(1)} L${(x + 4).toFixed(1)},${(y + 4).toFixed(1)} M${(x + 4).toFixed(1)},${(y - 4).toFixed(1)} L${(x - 4).toFixed(1)},${(y + 4).toFixed(1)}"/>`
        : `<circle class="${p.kind === 'rome' ? 'rome' : 'town'}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${p.kind === 'rome' ? 5 : 3}"/>`
      art += label(x, y, p)
    }
    for (const e of m.edges ?? []) {
      const x = P(b.latMin, e.lon)[0], top = e.dir === 'n'
      art += `<text class="edge" x="${x.toFixed(1)}" y="${top ? 12 : H - 6}" text-anchor="middle">${top ? '↑' : '↓'} ${esc(e.text)} · ${e.km} km</text>`
    }
  }
  return `<figure class="cmap" tabindex="0" aria-label="Map: ${esc(m.title)}. Tap to enlarge.">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.title)}">${art}</svg>
    <figcaption><b>${esc(m.title)}.</b> ${esc(m.caption)} <span class="tap">Tap the map to enlarge it.</span></figcaption>
  </figure>`
}

function chapterStars(c) {

  return { earned, max: sets * 3 }
}

}

function leaveChapter() {
  const era = ERAS.find(e => e.id === CH.era)

// ---------- home (one chapter) ----------
function renderHome() {
  const t = testOf(CH), up = testComplete(t) ? null : nextTestRound(t)

  app.querySelector('#next-chapter')?.addEventListener('click', () => { loadChapter(chapterIndex + 1); window.scrollTo(0, 0); go({ screen: 'home' }) })
  app.querySelectorAll('.level-card').forEach(b => b.addEventListener('click', () => { run = null; startGame(b.dataset.type, +b.dataset.set) }))

// Review mode: the chapter's questions and answers, and its battle at any score, without playing the test
function reviewCardHtml() {
  if (!openAll) return ''
  return `<section class="run-card review-card">
      <span class="eyebrow">Review mode</span>

}
const reviewBattleHtml = L => `<section class="battle-card review-card">
      <span class="eyebrow">${esc(L.year)} · review mode</span>

// The card at the top of a chapter: the test while it's under way, then the battle
function testCardHtml() {
  const t = testOf(CH), rounds = testRounds(), done = rounds.filter(r => roundDone(r, t)).length
  const L = HoldTheLine.LEVELS[chapterIndex], score = pct(t.score), next = CHAPTERS[chapterIndex + 1]
  const lost = t.battles.filter(b => !b.won && b.attempt === t.attempt).length
  if (done < rounds.length) {
    const up = nextTestRound(t)
    return `<section class="run-card">
      <h2>The chapter test</h2>
      <p class="task">${done ? `<b>${done} of ${rounds.length} rounds done</b> · score so far <b>${score}%</b>.` : `Read the chronicle, then play the ${rounds.length} rounds of the test. Your <b>first</b> answer to each question counts.`}</p>
      <ol class="test-steps">${rounds.map(r => `<li class="${roundDone(r, t) ? 'done' : r === up ? 'next' : ''}">${roundDone(r, t) ? '✓ ' : ''}${esc(roundTitle(r))}</li>`).join('')}</ol>
      ${up ? `<p class="task">Up next: <b>${esc(roundTitle(up))} · ${esc(GAMES[up.type].sets[up.set].name)}</b></p>` : ''}
      <div class="actions"><button class="primary" id="test-go">${done ? 'Play the next round' : 'Start the test'}</button><button class="ghost" id="chronicle">Read the chronicle</button>${CH.keyFacts ? '<button class="ghost key-facts">Key facts</button>' : ''}</div>
    </section>

      <span class="eyebrow">Coming soon</span>

      <p class="task">This battle isn’t built yet. Finish the test to open the next chapter.</p>
    </section>` : openAll ? reviewBattleHtml(L) : `<section class="battle-card locked">
      <span class="eyebrow">${esc(L.year)} · locked</span>
      <h2>${esc(Cap(battleOf(chapterIndex)))}</h2>
      <p class="task">Unlocks when all ${rounds.length} rounds of the test are done. Your score then sets your army.</p>
    </section>`}`
  }
  // a chapter whose battle isn't built yet: finishing the test opens the next chapter
  if (!L) {
    if (!t.won) { t.won = true; saveTests() }
    return `<section class="battle-card won">
      <span class="eyebrow">Test complete · ${score}%</span>
      <h2>${esc(CH.battle?.name ?? 'This chapter’s battle')}: coming soon</h2>

  }

      <div class="actions">${next ? `<button class="primary" id="next-chapter">Next chapter: ${esc(next.short)}</button>` : '<span class="task"><b>You have conquered every chapter so far.</b></span>'}<button class="ghost to-battle">Fight again</button>${CH.keyFacts ? '<button class="ghost key-facts">Key facts</button>' : ''}</div>
    </section>`
  return `<section class="battle-card">
      <span class="eyebrow">Test complete${t.attempt > 1 ? ` · attempt ${t.attempt}` : ''} · ${esc(L.year)}</span>
      <h2>${score}%: ${esc(battleOf(chapterIndex))} awaits</h2>
      <p class="task">Your army: ${armyLine(score)}. ${verdictFor(score)}</p>
      ${lost ? `<p class="task">You lost ${lost === 1 ? 'once' : lost + ' times'} with this army. Re-read where your mistakes came from and retake the test for a stronger army, or fight again.</p>${rereadHtml(t)}` : ''}
      <div class="actions"><button class="primary to-battle">To battle</button><button class="ghost" id="retake">Retake the test</button>${CH.keyFacts ? '<button class="ghost key-facts">Key facts</button>' : ''}</div>

}
// Plays the rounds not yet done, one after another
function continueTest() {
  const next = nextTestRound()
  if (!next) return go({ screen: 'home' })
  run = null
  if (!Object.keys(testOf(CH).answers).length) return go({ screen: 'briefing' })
  startGame(next.type, next.set)
}
function retakeTest(e) {
  const b = e.currentTarget
  if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Tap again: new questions, new score'; return }
  const old = testOf(CH)
  tests[CH.id] = { ...old, attempt: old.attempt + 1, seed: newSeed(), answers: {}, done: {}, missSecs: {}, score: 0 }
  saveTests(); loadChapter(chapterIndex); run = null; window.scrollTo(0, 0); go({ screen: 'home' })
  toast('<b>A new test.</b> The quiz rounds have new questions, and your new score replaces the old one.', 4500)
}

const START = {}
function startGame(type, set) { window.scrollTo(0, 0); go({ screen: 'play', type, set, mistakes: 0, hint: null, roundMisses: [], ...START[type](set) }) }

function finish(recapHtml, earned = starCount(state.mistakes), note) {
  const key = starKey(state.type, state.set)
  state.roundMisses ??= []
  // The round now counts as done in this chapter's test
  let completed = false
  if (TEST_TYPES.includes(state.type)) {
    const t = testOf(CH), before = testComplete(t)
    t.done[`${state.type}:${state.set}`] = 1
    t.score = testScore(t); saveTests()
    completed = !before && testComplete(t)
  }
  const reviewSecs = [...new Set(state.roundMisses.map(m => m.sec).filter(Boolean))]
  stars[key] = Math.max(stars[key] ?? 0, earned)
  saveStars()
  if (run) run.results.push({ type: state.type, set: state.set, stars: earned })
  go({ screen: 'result', type: state.type, set: state.set, mistakes: state.mistakes, earned, recapHtml, note, reviewSecs, feedbackSent: false, completed })
}
const recapList = items => `<ol class="recap">${items.map(i => `<li class="${i.miss ? 'miss' : ''}"><div>${i.when ? `<span class="when">${esc(i.when)}</span>` : ''}<b>${esc(i.title)}</b>${i.text ? `<p>${esc(i.text)}</p>` : ''}</div></li>`).join('')}</ol>`

// ---------- Chronology Jam ----------
START.chrono = set => {
  const events = TIMELINES[set].events
  const sortedIds = events.map((e, i) => ({ y: e.y, i })).sort((a, b) => a.y - b.y).map(e => e.i)
  return { sortedIds, boardIds: shuffle(sortedIds), colors: Object.fromEntries(sortedIds.map(i => [i, 1 + Math.floor(Math.random() * 5)])), placed: [], revealed: [] }
}
RENDER.chrono = () => {
  const g = state, ev = id => TIMELINES[g.set].events[id]
  app.innerHTML = `
    ${playHeader()}
    ${statusLine('Tap or drag the <b>earliest</b> event onto the road.', g.sortedIds.length - g.placed.length)}
    <div class="road" id="road" aria-label="Timeline, oldest first"><div class="lanes">
      ${g.sortedIds.map((_, i) => {
        const id = g.placed[i]
        return id === undefined ? `<div class="slot" data-slot="${i}">${i + 1}</div>`
          : `<div class="slot filled c${g.colors[id]}" data-slot="${i}">${esc(ev(id).label)}<em>${esc(ev(id).when)}</em></div>`
      }).join('')}
    </div></div>
    <div class="board gate">
      ${g.boardIds.map(id => `
        <button class="tile c${g.colors[id]} ${g.placed.includes(id) ? 'gone' : ''} ${g.revealed.includes(id) ? 'revealed' : ''}" data-id="${id}" ${g.placed.includes(id) ? 'tabindex="-1" aria-hidden="true"' : ''}>
          <span>${esc(ev(id).label)}</span><span class="when">${esc(ev(id).when)}</span>
        </button>`).join('')}
    </div>
    <div id="hint-area">${hintHtml(g.hint)}</div>`
  bindBack()
  const road = app.querySelector('#road')
  const overRoad = y => y < road.getBoundingClientRect().bottom + 10
  app.querySelectorAll('.tile:not(.gone)').forEach(t => {
    onTap(t, () => chronoTap(+t.dataset.id, t))
    draggable(t, {
      onMove: e => road.classList.toggle('drop-target', overRoad(e.clientY)),
      onDrop: (e, ok) => { road.classList.remove('drop-target'); t.classList.remove('dragging'); t.style.transform = ''; if (ok && overRoad(e.clientY)) chronoTap(+t.dataset.id, t); return false },
    })
  })
  const last = road.querySelector(`[data-slot="${Math.max(0, g.placed.length - 1)}"]`)
  if (last) road.scrollLeft = Math.max(0, last.offsetLeft - road.clientWidth / 2 + 46)
}
const sinceWhen = s => /^(Under|Soon|After|Possibly)/.test(s) ? s[0].toLowerCase() + s.slice(1) : 'in ' + s
function chronoTap(id, el) {
  const g = state
  if (busy || g.screen !== 'play' || g.placed.includes(id)) return
  const e = TIMELINES[g.set].events[id]
  if (id === g.sortedIds[g.placed.length]) {
    const forced = g.placed.length === g.sortedIds.length - 1
    const note = earn(`chrono:${g.set}:${id}`, ['hastatus', 'princeps', 'triarius'][Math.min(g.set, 2)], el, { forced })
    g.hint = { ok: true, html: `<b>${esc(e.label)}</b> · ${esc(e.when)}. ${esc(e.fact)}${note}` }
    const slot = app.querySelector(`[data-slot="${g.placed.length}"]`)
    g.placed.push(id)
    busy = true
    flyTo(el, slot, () => {
      busy = false
      if (state !== g) return
      if (g.placed.length < g.sortedIds.length) return RENDER.chrono()
      finish(recapList(g.sortedIds.map(i => { const x = TIMELINES[g.set].events[i]; return { when: x.when, title: x.label, text: x.fact } })))
    })
  } else {
    g.mistakes++
    if (!g.revealed.includes(id)) g.revealed.push(id)
    g.hint = { ok: false, sec: e.sec, html: `Not yet. <b>${esc(e.label)}</b> happened ${esc(sinceWhen(e.when))}. Something in the camp is older.` }
    noteMiss(`chrono:${g.set}:${id}`, e.sec)
    el.classList.add('revealed', 'shake')
    el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true })
    app.querySelector('#hint-area').innerHTML = hintHtml(g.hint)
    app.querySelector('.score').textContent = `${g.sortedIds.length - g.placed.length} left · ${plural(g.mistakes, 'mistake')}`
    buzz()
  }
}
function flyTo(tile, slot, done) {
  if (reducedMotion || !slot) { done(); return }
  const from = tile.getBoundingClientRect()
  slot.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'instant' })
  const to = slot.getBoundingClientRect()
  const ghost = tile.cloneNode(true)
  ghost.classList.remove('dragging', 'shake')
  ghost.classList.add('flyer')
  ghost.style.transform = ''
  Object.assign(ghost.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' })
  document.body.appendChild(ghost)
  tile.classList.add('gone')
  const dx = to.left + to.width / 2 - (from.left + from.width / 2)
  const dy = to.top + to.height / 2 - (from.top + from.height / 2)
  const scale = Math.min(to.width / from.width, to.height / from.height)
  ghost.animate([
    { transform: 'translate(0,0) scale(1)' },
    { transform: `translate(${dx * 0.15}px, ${dy * 0.15 - 18}px) scale(1.04)`, offset: 0.25 },
    { transform: `translate(${dx}px, ${dy}px) scale(${scale})` },
  ], { duration: 420, easing: 'cubic-bezier(.3,.7,.3,1)' }).onfinish = () => { ghost.remove(); done() }
}

// ---------- Match Pairs ----------
START.match = set => {
  const ids = [...MATCHES[set].pairs.keys()]
  return { left: shuffle(ids), right: shuffle(ids), matched: [], selected: null, colors: Object.fromEntries(ids.map(i => [i, (i % 5) + 1])) }
}
RENDER.match = () => {
  const g = state, set = MATCHES[g.set]
  const col = (ids, side) => ids.map(i => {
    const m = g.matched.includes(i)
    return `<button class="pick ${side === 'R' ? 'desc' : ''} ${m ? `matched c${g.colors[i]}` : ''} ${g.selected?.side === side && g.selected.id === i ? 'selected' : ''}" data-side="${side}" data-id="${i}" ${m ? 'disabled' : ''}>${esc(set.pairs[i][side === 'L' ? 0 : 1])}</button>`
  }).join('')
  app.innerHTML = `
    ${playHeader()}
    ${statusLine('Tap a name, then what it matches.', set.pairs.length - g.matched.length)}
    <div class="board pairs"><div class="col">${col(g.left, 'L')}</div><div class="col">${col(g.right, 'R')}</div></div>
    <div id="hint-area">${hintHtml(g.hint)}</div>`
  bindBack()
  app.querySelectorAll('.pick:not([disabled])').forEach(b => b.addEventListener('click', () => matchTap(b.dataset.side, +b.dataset.id)))
}
function matchTap(side, id) {
  const g = state, set = MATCHES[g.set]
  if (busy || g.matched.includes(id)) return
  if (!g.selected || g.selected.side === side) { g.selected = { side, id }; g.hint = null; return RENDER.match() }
  const other = g.selected
  g.selected = null
  if (other.id === id) {
    const forced = g.matched.length === set.pairs.length - 1
    const fromEl = app.querySelector(`[data-side="L"][data-id="${id}"]`)
    const note = earn(`match:${g.set}:${id}`, 'centurio', fromEl, { forced })
    g.matched.push(id)
    g.hint = { ok: true, html: `<b>${esc(set.pairs[id][0])}</b>: ${esc(set.pairs[id][1].replace(/^./, c => c.toLowerCase()))}.${note}` }
    RENDER.match()
    if (g.matched.length === set.pairs.length) {
      busy = true
      setTimeout(() => { busy = false; if (state === g) finish(recapList(set.pairs.map(([a, b]) => ({ title: a, text: b })))) }, 700)
    }
  } else {
    g.mistakes++
    const [l, r] = side === 'L' ? [id, other.id] : [other.id, id]
    g.hint = { ok: false, sec: set.secs[l], html: `<b>${esc(set.pairs[l][0])}</b> doesn’t go with “${esc(set.pairs[r][1])}”. Try again.` }
    noteMiss(`match:${g.set}:${l}`, set.secs[l])
    RENDER.match()
    app.querySelectorAll(`[data-side="L"][data-id="${l}"], [data-side="R"][data-id="${r}"]`).forEach(b => b.classList.add('shake'))
    buzz()
  }
}

// ---------- True or False ----------
START.tf = set => ({ order: shuffle([...DECKS[set].cards.keys()]), index: 0, answered: null, misses: [] })
RENDER.tf = () => {
  const g = state, deck = DECKS[g.set]
  const card = deck.cards[g.order[g.index]]
  const hasNext = g.index + 1 < g.order.length
  app.innerHTML = `
    ${playHeader()}
    ${statusLine('Swipe right if it’s true, left if it’s false.', g.order.length - g.index)}
    ${g.answered ? '' : `<div class="deck">
      ${hasNext ? '<div class="card behind" aria-hidden="true"><p class="claim">&nbsp;</p></div>' : ''}
      <div class="card" id="card">
        <span class="stamp t">TRUE</span><span class="stamp f">FALSE</span>
        <span class="count">Statement ${g.index + 1} of ${g.order.length}</span>
        <p class="claim">${esc(card.claim)}</p>
        <p class="swipe-hint">← false · true →</p>
      </div>
    </div>`}
    ${g.answered ? verdictHtml(card, g.answered) : `<div class="answer-buttons"><button class="btn-false" id="no">✗ False</button><button class="btn-true" id="yes">✓ True</button></div>`}`
  bindBack()
  if (g.answered) return app.querySelector('#continue').addEventListener('click', nextTF)
  app.querySelector('#no').addEventListener('click', () => answerTF(false))
  app.querySelector('#yes').addEventListener('click', () => answerTF(true))
  const el = app.querySelector('#card'), tS = el.querySelector('.stamp.t'), fS = el.querySelector('.stamp.f')
  draggable(el, {
    onMove: (e, dx) => { el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; tS.style.opacity = Math.max(0, Math.min(1, dx / 90)); fS.style.opacity = Math.max(0, Math.min(1, -dx / 90)) },
    onDrop: (e, ok) => {
      const dx = e.clientX - el.getBoundingClientRect().left - el.offsetWidth / 2 + (parseFloat(el.style.transform.split('(')[1]) || 0) * 0
      const shift = parseFloat((el.style.transform.match(/translateX\(([-\d.]+)px/) || [])[1] || 0)

      onDrop: (e, ok) => { const s = ok && spotAt(e.clientX, e.clientY); c.classList.remove('dragging'); c.style.transform = ''; if (s) mapPlace(i, +s.dataset.spot); else RENDER.map(); return false },
    })

function mapPlace(label, spot) {
  const g = state, places = MAPS[g.set].places
  g.selected = null

    const note = earn(`map:${g.set}:${label}`, 'princeps', app.querySelector(`.spot[data-spot="${spot}"]`), { forced })
    g.placed.push(label)
    g.hint = { ok: true, html: `<b>${esc(places[label].name)}</b>: ${esc(places[label].why)}${note}` }
    if (g.placed.length === places.length) {
      RENDER.map(); busy = true
      return setTimeout(() => { busy = false; if (state === g) finish(recapList(places.map((p, i) => ({ title: p.name, text: p.why, miss: g.misses.includes(i) })))) }, 800)
    }
  } else {
    g.mistakes++
    if (!g.misses.includes(label)) g.misses.push(label)
    g.hint = { ok: false, sec: places[label].sec, html: `Not there. Clue: <b>${esc(places[label].name)}</b>: ${esc(places[label].why)}` }
    noteMiss(`map:${g.set}:${label}`, places[label].sec)
    buzz()
  }
  RENDER.map()
}

// ---------- Legion Run: a chapter game ----------
// Your legion marches up a road. Drag to steer it through the gate with the right answer and around
// barricades. Gate questions are the chapter's quiz and true/false items under the same keys, so each
// fact still recruits only once, whichever game it is answered in.
const MARCH = { gates: 8, gap: 640, first: 560, speed: 60 }   // slow enough to read each question before its gate
let anim = null   // the running canvas game (Legion Run or the battlefield)
const stopLoop = () => { if (anim) anim.alive = false; anim = null }

function marchGates() {
  const pool = []
  CH.quizzes.forEach((set, si) => set.questions.forEach((q, qi) => {
    const wrong = q.options.map((o, i) => i).filter(i => i !== q.a && q.options[i].length <= 44)
    if (q.options[q.a].length <= 44 && wrong.length) pool.push({ key: `quiz:${si}:${qi}`, unit: ['hastatus', 'princeps', 'triarius'][q.level - 1],
      q: q.q, right: q.options[q.a], wrong: q.options[wrong[Math.floor(Math.random() * wrong.length)]], why: q.why, sec: q.sec })
  }))
  CH.decks.forEach((d, di) => d.cards.forEach((c, ci) => pool.push({ key: `tf:${di}:${ci}`, unit: 'hastatus',
    q: `True or false? ${c.claim}`, right: c.answer ? 'True' : 'False', wrong: c.answer ? 'False' : 'True', why: c.why, sec: c.sec })))
  return shuffle(pool).slice(0, MARCH.gates).map((g, i) => ({ ...g, rightOnLeft: Math.random() < 0.5, y: MARCH.first + i * MARCH.gap, passed: null }))
}
START.march = () => ({ misses: [] })
RENDER.march = () => {
  stopLoop()
  app.innerHTML = `
    ${playHeader()}
    <div class="gate-banner" id="banner"><p>Steer your legion through the gate with the right answer. Each right answer recruits a soldier.</p></div>
    <div class="march-wrap">
      <canvas id="road" aria-label="Your legion marching. Drag left and right to steer."></canvas>
      <div class="march-overlay" id="overlay">
        <p><b>Drag left and right</b> to steer your legion.</p>
        <p>Pass through the gate with the <b>right answer</b>. Avoid the barricades.</p>
        <button class="primary big" id="go">March!</button>
      </div>
    </div>`
  bindBack()
  setupMarch()
  app.querySelector('#go').addEventListener('click', () => { app.querySelector('#overlay').hidden = true; anim.phase = 'march'; anim.last = performance.now() })
}
function sizeCanvas(canvas, ratio, maxH) {
  const W = Math.min(app.clientWidth, 528), H = Math.round(Math.min(W * ratio, maxH))
  const dpr = window.devicePixelRatio || 1
  canvas.width = W * dpr; canvas.height = H * dpr
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px'
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  return { ctx, W, H }
}
function setupMarch() {
  const g0 = state
  const canvas = app.querySelector('#road')
  const { ctx, W, H } = sizeCanvas(canvas, 1.3, window.innerHeight * 0.58)
  const road = { left: W * 0.08, right: W * 0.92 }, mid = (road.left + road.right) / 2
  const soldiers = []
  const addSoldier = (t, x = mid, y = H * 0.8) => soldiers.push({ t, x: x + (Math.random() - 0.5) * 10, y: y + (Math.random() - 0.5) * 10 })
  for (const t of ['hastatus', 'hastatus', 'princeps', 'triarius']) for (let i = 0; i < 4; i++) addSoldier(t)
  for (let i = soldiers.length; i < 12; i++) addSoldier('hastatus')   // a small escort even with no army yet
  shuffleInPlace(soldiers)
  const gates = marchGates()
  const endY = MARCH.first + MARCH.gates * MARCH.gap + 200
  const barricades = gates.slice(0, -1).map((g, i) => i % 2 ? null : { y: g.y + MARCH.gap / 2, lane: Math.floor(Math.random() * 3) }).filter(Boolean)
  const m = anim = { alive: true, phase: 'ready', dist: 0, cx: mid, target: mid, last: performance.now(), soldiers, gates, barricades, pops: [], floats: [], recruited: 0, crashes: 0 }
  const playerY = H * 0.8
  const toScreen = wy => playerY - (wy - m.dist)
  const laneW = (road.right - road.left) / 3, laneX = lane => road.left + laneW * (lane + 0.5)
  const setTarget = e => { const r = canvas.getBoundingClientRect(); m.target = Math.max(road.left + 24, Math.min(road.right - 24, e.clientX - r.left)) }
  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); setTarget(e) })
  canvas.addEventListener('pointermove', e => { if (e.buttons || e.pointerType !== 'mouse') setTarget(e) })
  const keys = e => { if (!m.alive) return document.removeEventListener('keydown', keys); if (e.key === 'ArrowLeft') m.target = Math.max(road.left + 24, m.target - 40); if (e.key === 'ArrowRight') m.target = Math.min(road.right - 24, m.target + 40) }
  document.addEventListener('keydown', keys)
  const banner = app.querySelector('#banner')
  let bannerFor = null
  const showQuestion = g => { bannerFor = g; banner.className = 'gate-banner'; banner.innerHTML = `<span class="eyebrow">Gate ${gates.indexOf(g) + 1} of ${gates.length}</span><p><b>${esc(g.q)}</b></p>` }
  const layout = (n, cx, cy, gap) => { const pts = []; for (let i = 0; i < n; i++) { const r = gap * Math.sqrt(i + 0.5), a = i * 2.39996; pts.push([cx + r * Math.cos(a) * 1.15, cy + r * Math.sin(a) * 0.8]) } return pts }
  const pop = (x, y, color) => m.pops.push({ x, y, r: 3, a: 1, color })
  const float = (text, color) => m.floats.push({ text, color, y: playerY - 60, a: 1 })
  function update(dt, now) {
    if (m.phase === 'march') {
      m.dist += MARCH.speed * dt
      const next = gates.find(g => !g.passed)
      if (next && next !== bannerFor && next.y - m.dist < H * 1.6 && (!bannerFor || bannerFor.passed && now - bannerFor.passedAt > 2200)) showQuestion(next)
      for (const g of gates) if (!g.passed && m.dist >= g.y) {
        const leftSide = m.cx < mid, ok = leftSide === g.rightOnLeft
        g.passed = ok ? 'right' : 'wrong'; g.passedAt = now; g.side = leftSide ? 'left' : 'right'
        banner.className = 'gate-banner ' + (ok ? 'ok' : 'bad')
        if (ok) {
          const note = ''   // practice: Legion Run is not part of the chapter test
          if (!note) { m.recruited++; addSoldier(g.unit, m.cx, playerY - 40); float('+1', '#7fb069') }
          banner.innerHTML = `<p><b>Right!</b> ${note ? note.replace(/<\/?i>/g, '') : `A ${UNITS[g.unit].one} joins your legion.`} ${esc(g.why)}</p>`
        } else {
          g0.mistakes++; g0.misses.push(g); g0.roundMisses.push({ key: g.key, sec: g.sec })
          for (let i = 0; i < 2 && m.soldiers.length > 1; i++) { const s = m.soldiers.pop(); pop(s.x, s.y, '#e2574c') }
          float('✗', '#e2574c'); buzz()
          banner.innerHTML = `<p><b>Wrong.</b> The answer is “${esc(g.right)}”. ${esc(g.why)}</p><button class="read-more" data-read="${g.sec}">Read more in the chronicle</button>`
        }
      }
      for (const b of m.barricades) if (!b.hit && m.dist >= b.y) {
        b.hit = true
        if (Math.abs(m.cx - laneX(b.lane)) < laneW / 2) {
          b.crashed = true; m.crashes++; g0.mistakes++
          for (let i = 0; i < 2 && m.soldiers.length > 1; i++) { const s = m.soldiers.pop(); pop(s.x, s.y, '#e2574c') }
          float('Ouch!', '#e2574c'); buzz()
        }
      }
      if (m.dist >= endY) {
        m.phase = 'done'
        setTimeout(() => {
          if (state !== g0) return
          stopLoop()
          finish(recapList(gates.map(g => ({ when: g.passed === 'right' ? 'Right' : 'Wrong', title: g.q, text: `${g.right}. ${g.why}`, miss: g.passed !== 'right' }))),
            starCount(g0.mistakes), `${gates.filter(g => g.passed === 'right').length} of ${gates.length} gates right, ${plural(m.crashes, 'barricade')} hit, ${plural(m.recruited, 'new soldier')}.`)
        }, 600)
      }
    }
    m.cx += (m.target - m.cx) * Math.min(1, dt * 7)
    const spots = layout(m.soldiers.length, m.cx, playerY, 5.2)
    m.soldiers.forEach((s, i) => { const [tx, ty] = spots[i]; s.x += (tx - s.x) * Math.min(1, dt * 6); s.y += (ty - s.y) * Math.min(1, dt * 6) })
    m.pops = m.pops.filter(p => (p.r += dt * 40, p.a -= dt * 2.5) > 0)
    m.floats = m.floats.filter(f => (f.y -= dt * 40, f.a -= dt * 0.8) > 0)
  }
  function draw() {
    ctx.fillStyle = '#7d8b4a'; ctx.fillRect(0, 0, W, H)
    ctx.fillStyle = '#d8c7a0'; ctx.fillRect(road.left, 0, road.right - road.left, H)
    ctx.strokeStyle = 'rgba(27,23,21,.18)'; ctx.setLineDash([14, 18]); ctx.lineWidth = 2
    ctx.lineDashOffset = -m.dist; ctx.beginPath(); ctx.moveTo(mid, 0); ctx.lineTo(mid, H); ctx.stroke(); ctx.setLineDash([])
    const campY = toScreen(endY)
    if (campY > -40) { ctx.fillStyle = '#8e2b22'; ctx.fillRect(road.left, campY - 14, road.right - road.left, 10); ctx.fillStyle = '#fbf3e4'; ctx.font = '800 13px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('CAMP', mid, campY - 20) }
    for (const b of m.barricades) {
      const y = toScreen(b.y); if (y < -30 || y > H + 30) continue
      const x0 = laneX(b.lane) - laneW / 2 + 4, w = laneW - 8
      ctx.fillStyle = b.crashed ? '#8e2b22' : '#6b4a2b'; ctx.fillRect(x0, y - 7, w, 14)
      ctx.fillStyle = '#3f2a16'; for (let x = x0 + 6; x < x0 + w - 4; x += 14) { ctx.beginPath(); ctx.moveTo(x - 5, y - 7); ctx.lineTo(x, y - 20); ctx.lineTo(x + 5, y - 7); ctx.fill() }
    }
    for (const g of m.gates) {
      const y = toScreen(g.y); if (y < -60 || y > H + 60) continue
      const half = (road.right - road.left) / 2
      ;[['left', road.left], ['right', mid]].forEach(([side, x]) => {
        const isRight = (side === 'left') === g.rightOnLeft
        ctx.fillStyle = g.passed ? (g.side === side ? (g.passed === 'right' ? 'rgba(127,176,105,.9)' : 'rgba(226,87,76,.9)') : 'rgba(251,243,228,.45)') : 'rgba(251,243,228,.92)'
        ctx.fillRect(x + 6, y - 26, half - 12, 44)
        ctx.strokeStyle = '#1b1715'; ctx.lineWidth = 2; ctx.strokeRect(x + 6, y - 26, half - 12, 44)
        ctx.fillStyle = '#1b1715'; ctx.font = '800 12.5px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
        wrapText(ctx, isRight ? g.right : g.wrong, x + half / 2, y - 4, half - 22, 14)
      })
      ctx.fillStyle = '#6b4a2b'; [road.left + 2, mid - 3, road.right - 6].forEach(px => ctx.fillRect(px, y - 34, 5, 58))
    }
    const marching = m.phase === 'march'
    ;[...m.soldiers].sort((a, b) => a.y - b.y).forEach((s, i) => drawFigure(ctx, s.x, s.y + 5, s.t, { walk: marching ? performance.now() / 90 + i * 0.9 : null, scale: 0.85 }))
    for (const p of m.pops) { ctx.globalAlpha = Math.max(0, p.a); ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke() }
    ctx.globalAlpha = 1
    for (const f of m.floats) { ctx.globalAlpha = Math.max(0, f.a); ctx.fillStyle = f.color; ctx.font = '800 26px Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(f.text, m.cx, f.y) }
    ctx.globalAlpha = 1
  }
  const loop = now => {
    if (!m.alive) return
    const dt = Math.min(0.05, (now - m.last) / 1000); m.last = now
    update(dt, now); draw(); requestAnimationFrame(loop)
  }
  requestAnimationFrame(loop)
}
function drawSoldier(ctx, x, y, fill, crest, stroke = '#1b1715', r = 4.6) {
  ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 1.3
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke()
  ctx.fillStyle = stroke; ctx.beginPath(); ctx.arc(x, y - r * 0.2, r * 0.35, 0, Math.PI * 2); ctx.fill()
  if (crest) { ctx.strokeStyle = '#e2574c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y - 1, r + 1, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke() }
}
function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = String(text).split(' '), lines = []
  let line = ''
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w } else line = t }
  lines.push(line)
  const shown = lines.slice(0, 3)
  shown.forEach((l, i) => ctx.fillText(l, x, y + (i - (shown.length - 1) / 2) * lineH))
}
function shuffleInPlace(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }

// ---------- little soldiers, drawn in code ----------
// Upright figures (feet at x, y) in a slight 2.5D view. Romans: red tunic, big red shield, bronze helmet;
// the plume colour shows the unit (as Polybius says, Roman soldiers wore feathers to look taller).
const LOOKS = {
  hastatus: { tunic: '#a8392f', plume: '#e0a63a', shield: 'scutum', shieldColor: '#8e2b22', trim: '#e0a63a', helmet: '#c9a24a', weapon: 'pilum' },
  princeps: { tunic: '#a8392f', plume: '#4f8fb8', shield: 'scutum', shieldColor: '#8e2b22', trim: '#4f8fb8', helmet: '#c9a24a', weapon: 'sword' },
  triarius: { tunic: '#a8392f', plume: '#e9e1cf', shield: 'scutum', shieldColor: '#8e2b22', trim: '#e9e1cf', helmet: '#c9a24a', weapon: 'spear' },
  centurio: { tunic: '#a8392f', crest: true, shield: 'scutum', shieldColor: '#8e2b22', trim: '#e0a63a', helmet: '#d9d2c0', weapon: 'sword' },
  phalanx: { tunic: '#4d5a6a', shield: 'round', shieldColor: '#b08a3e', trim: '#6b5326', helmet: '#b08a3e', plume: '#1b1715', weapon: 'longspear' },
  warrior: { tunic: '#5b6b4a', shield: 'oval', shieldColor: '#6b4a2b', trim: '#3f2a16', hair: '#5a3a22', weapon: 'axe' },
  archer: { tunic: '#6a7a5a', hair: '#3f2a16', weapon: 'bow' },
  slinger: { tunic: '#7a6a5a', hair: '#3f2a16', weapon: 'sling' },
  cavalry: { tunic: '#4d5a6a', helmet: '#b08a3e', horse: '#7a5636', weapon: 'spear' },
  elephant: { elephant: true },
}
function drawFigure(ctx, x, y, kind, { dir = 1, walk = null, attack = null, scale = 1, fallen = false } = {}) {
  const L = LOOKS[kind] ?? LOOKS.warrior
  ctx.save()
  ctx.translate(x, y)
  if (fallen) { ctx.rotate(dir * Math.PI / 2); ctx.globalAlpha *= 0.55 }
  ctx.scale(scale * dir, scale)
  const ink = '#1b1715'
  if (!fallen) { ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0, 0, L.elephant ? 11 : L.horse ? 7 : 4, L.elephant ? 3.5 : 1.7, 0, 0, Math.PI * 2); ctx.fill() }
  if (L.elephant) {
    const bob = walk != null ? Math.sin(walk) * 0.6 : 0
    ctx.fillStyle = '#7b7f86'; ctx.strokeStyle = '#3b3f46'; ctx.lineWidth = 1
    for (const lx of [-6, -2, 3, 7]) ctx.fillRect(lx - 1.3, -5 + bob, 2.6, 5)
    ctx.beginPath(); ctx.ellipse(0, -9 + bob, 10, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke()
    ctx.beginPath(); ctx.arc(9, -11 + bob, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke()
    ctx.strokeStyle = '#7b7f86'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(12, -10 + bob); ctx.quadraticCurveTo(15, -4, 13 + (attack != null ? Math.sin(attack) * 2 : 0), 0); ctx.stroke()
    ctx.strokeStyle = '#f2ead8'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(11, -8 + bob); ctx.lineTo(14, -6 + bob); ctx.stroke()
    ctx.fillStyle = '#8a6a3a'; ctx.fillRect(-5, -19 + bob, 9, 5); ctx.strokeStyle = ink; ctx.lineWidth = 0.8; ctx.strokeRect(-5, -19 + bob, 9, 5)
    ctx.fillStyle = '#e3b98f'; ctx.beginPath(); ctx.arc(-1, -21 + bob, 1.6, 0, Math.PI * 2); ctx.fill()
    ctx.restore(); return
  }
  const bob = walk != null ? Math.abs(Math.sin(walk)) * -0.8 : 0
  let baseY = 0
  if (L.horse) {
    const s = walk != null ? Math.sin(walk) * 1.4 : 0
    ctx.strokeStyle = '#4a3420'; ctx.lineWidth = 1.2
    for (const [lx, k] of [[-4, 1], [-2, -1], [3, 1], [5, -1]]) { ctx.beginPath(); ctx.moveTo(lx, -4); ctx.lineTo(lx + s * k, 0); ctx.stroke() }
    ctx.fillStyle = L.horse; ctx.beginPath(); ctx.ellipse(0, -5.5 + bob, 6, 2.8, 0, 0, Math.PI * 2); ctx.fill()
    ctx.beginPath(); ctx.ellipse(6, -8 + bob, 2, 1.4, -0.6, 0, Math.PI * 2); ctx.fill()
    baseY = -5
  } else {
    const s = walk != null ? Math.sin(walk) * 1.6 : 0
    ctx.strokeStyle = '#3f2a16'; ctx.lineWidth = 1.2
    ctx.beginPath(); ctx.moveTo(-1.1, -4); ctx.lineTo(-1.1 + s, 0); ctx.moveTo(1.1, -4); ctx.lineTo(1.1 - s, 0); ctx.stroke()
  }
  const by = baseY + bob
  ctx.fillStyle = L.tunic; ctx.beginPath(); ctx.roundRect(-2.6, by - 8.5, 5.2, 5, 1.4); ctx.fill()
  // weapon in the front hand; it swings or thrusts when attacking
  const thrust = attack != null ? Math.max(0, Math.sin(attack)) : 0
  ctx.lineCap = 'round'
  if (L.weapon === 'pilum' || L.weapon === 'spear' || L.weapon === 'longspear') {
    const len = L.weapon === 'longspear' ? 18 : L.weapon === 'spear' ? 14 : 12
    const tilt = 0.25 + thrust * 0.9
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.1
    ctx.beginPath(); ctx.moveTo(2.8, by - 4); ctx.lineTo(2.8 + Math.sin(tilt) * len, by - 4 - Math.cos(tilt) * len); ctx.stroke()
    ctx.strokeStyle = '#cfd4d8'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(2.8 + Math.sin(tilt) * (len - 2.5), by - 4 - Math.cos(tilt) * (len - 2.5)); ctx.lineTo(2.8 + Math.sin(tilt) * len, by - 4 - Math.cos(tilt) * len); ctx.stroke()
  } else if (L.weapon === 'sword' || L.weapon === 'axe') {
    const a = -0.6 + thrust * 1.6
    ctx.strokeStyle = L.weapon === 'axe' ? '#6b4a2b' : '#cfd4d8'; ctx.lineWidth = 1.3
    ctx.beginPath(); ctx.moveTo(2.6, by - 5); ctx.lineTo(2.6 + Math.sin(a) * 5, by - 5 - Math.cos(a) * 5); ctx.stroke()
    if (L.weapon === 'axe') { ctx.fillStyle = '#9aa3aa'; ctx.beginPath(); ctx.arc(2.6 + Math.sin(a) * 5, by - 5 - Math.cos(a) * 5, 1.5, 0, Math.PI * 2); ctx.fill() }
  } else if (L.weapon === 'bow') {
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.arc(1.5, by - 6, 4, -Math.PI / 2.2, Math.PI / 2.2); ctx.stroke()
  } else if (L.weapon === 'sling') {
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 0.9; const a = (attack ?? 0) * 2; ctx.beginPath(); ctx.moveTo(2.4, by - 7); ctx.lineTo(2.4 + Math.cos(a) * 3.5, by - 9 + Math.sin(a) * 3.5); ctx.stroke()
  }
  // head, helmet, plume or crest, hair
  ctx.fillStyle = '#e3b98f'; ctx.beginPath(); ctx.arc(0, by - 10.6, 2, 0, Math.PI * 2); ctx.fill()
  if (L.helmet) { ctx.fillStyle = L.helmet; ctx.beginPath(); ctx.arc(0, by - 11, 2.3, Math.PI, 0); ctx.fill() }
  if (L.hair) { ctx.fillStyle = L.hair; ctx.beginPath(); ctx.arc(-0.4, by - 11.1, 2.2, Math.PI * 0.95, Math.PI * 2.05); ctx.fill() }
  if (L.crest) { ctx.strokeStyle = '#d4392d'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(-3.4, by - 12.5); ctx.lineTo(3.4, by - 12.5); ctx.stroke() }
  else if (L.plume) { ctx.strokeStyle = L.plume; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-0.6, by - 13); ctx.lineTo(-1.4, by - 16); ctx.moveTo(0.6, by - 13); ctx.lineTo(1.2, by - 16); ctx.stroke() }
  // shield on the front of the body
  if (L.shield === 'scutum') { ctx.fillStyle = L.shieldColor; ctx.strokeStyle = L.trim; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.roundRect(-3.6, by - 9.2, 3.8, 7, 1.2); ctx.fill(); ctx.stroke(); ctx.fillStyle = L.trim; ctx.beginPath(); ctx.arc(-1.7, by - 5.7, 0.8, 0, Math.PI * 2); ctx.fill() }
  else if (L.shield === 'round') { ctx.fillStyle = L.shieldColor; ctx.strokeStyle = L.trim; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.arc(-1.8, by - 6, 3.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke() }
  else if (L.shield === 'oval') { ctx.fillStyle = L.shieldColor; ctx.strokeStyle = L.trim; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.ellipse(-1.8, by - 6, 2.4, 3.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke() }
  ctx.restore()
}

// ---------- the chapter battle: Hold the Line, with the army the test earned ----------
function renderBattle() {
  const t = testOf(CH), i = chapterIndex, review = state.reviewScore != null && openAll
  const score = review ? state.reviewScore : pct(t.score)
  if (!HoldTheLine.LEVELS[i] || (!review && !testComplete(t))) return go({ screen: 'home' })   // no battle built yet, or the test isn't done
  window.scrollTo(0, 0)
  app.innerHTML = '<div class="battle-host" id="battle-host"></div>'
  HoldTheLine.mount(app.querySelector('#battle-host'), {
    mode: 'chapter', level: i, score,
    onExit: r => {
      if (!r.left && !review) {
        t.battles.push({ won: !!r.won, score, attempt: t.attempt, at: new Date().toISOString() })
        if (r.won) { t.won = true; t.stars = Math.max(t.stars ?? 0, r.stars ?? 1) }
        saveTests()
      }
      window.scrollTo(0, 0)
      go({ screen: 'home' })
      if (r.won && !review && CHAPTERS[i + 1]) toast(`<b>Victory at ${esc(battleName(i))}!</b> The next chapter is open: ${esc(CHAPTERS[i + 1].short)}.`, 4500)
    },
  })
}

// ---------- results ----------
function renderResult() {
  const r = state, g = GAMES[r.type], t = testOf(CH), next = nextTestRound(t)
  // What to do next: the next round of the test, then the battle
  const actions = r.completed
    ? `<p class="task"><b>Test complete: ${pct(t.score)}%.</b> Your army: ${armyLine(pct(t.score))}.</p>
       <div class="actions"><button class="primary" id="to-battle">To ${esc(battleOf(chapterIndex))}</button><button class="ghost" id="to-chapter">Back to the chapter</button></div>`
    : !testComplete(t)
      ? `<div class="actions">${next ? `<button class="primary" id="next-round">Next round: ${esc(roundTitle(next))}</button>` : ''}${r.type === 'march' ? '<button class="ghost" id="again">Play again</button>' : ''}<button class="ghost" id="to-chapter">Back to the chapter</button></div>`
      : `<div class="actions"><button class="ghost" id="again">Play again</button><button class="ghost" id="to-chapter">Back to the chapter</button></div>`
  app.innerHTML = `
    ${header(`${g.title}${g.sets.length > 1 ? ' ' + NUMERALS[r.set] : ''} complete`, g.sets[r.set].name)}
    ${testPill(r)}
    <section class="result">
      <div>
        ${starRow(r.earned, 'big-stars')}
        <h2 style="margin-top:10px">${r.earned === 3 ? 'Perfect!' : r.earned === 2 ? 'Well done!' : 'You made it to the end'}</h2>
        <p class="task" style="margin-top:4px">${esc(r.note ?? (r.mistakes === 0 ? 'No mistakes.' : `${plural(r.mistakes, 'mistake')}. Three stars need a clean run.`))}</p>
      </div>
      ${actions}
      ${r.reviewSecs?.length ? `<div class="review">
        <h3>${r.earned === 1 ? 'Review these sections, then try again' : 'Learn from your mistakes'}</h3>
        <p class="task">These mistakes count in your chapter test. Re-read the sections before the battle.</p>
        <div class="review-links">${r.reviewSecs.map(id => `<button data-read="${id}">${esc(CHAPTER.find(s => s.id === id)?.title ?? id)}</button>`).join('')}${CH.keyFacts ? '<button class="key-facts-r">Key facts</button>' : ''}</div>
      </div>` : ''}
      ${r.recapHtml}
      <div class="feedback" id="fb">
        <h3>How was this round?</h3>
        ${r.feedbackSent ? '<p class="sent">Thanks! Your feedback was saved.</p>' : `
        <div class="chips" role="group" aria-label="Pick any that apply">
          ${['Fun', 'Too easy', 'Too hard', 'Confusing', 'Boring', 'Learned something'].map(c => `<button type="button" aria-pressed="false" data-chip="${c}">${c}</button>`).join('')}
        </div>
        <textarea id="fb-text" placeholder="Anything else? (optional)" maxlength="1000"></textarea>
        <div><button class="ghost" id="fb-send">${fb.db ? 'Send feedback' : 'Copy feedback'}</button></div>
        <p class="task" id="fb-help" ${fb.db ? 'hidden' : ''}>This copies your answers so you can paste them in a message to whoever sent you this game.</p>`}
      </div>
    </section>`
  bindBack()
  app.querySelector('#again')?.addEventListener('click', () => startGame(r.type, r.set))
  app.querySelector('.key-facts-r')?.addEventListener('click', () => openKeyFacts())
  app.querySelectorAll('[data-chip]').forEach(c => c.addEventListener('click', () => c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') === 'true' ? 'false' : 'true')))
  app.querySelector('#fb-send')?.addEventListener('click', async e => {
    const tags = [...app.querySelectorAll('[data-chip][aria-pressed="true"]')].map(c => c.dataset.chip)
    const comment = app.querySelector('#fb-text').value.trim()
    if (!tags.length && !comment) return toast('Pick a word or write a comment first.')
    const entry = { game: GAMES[r.type].title, set: GAMES[r.type].sets[r.set].name, stars: r.earned, mistakes: r.mistakes, tags, comment, inTest: TEST_TYPES.includes(r.type), at: new Date().toISOString() }
    if (fb.db) {
      e.target.disabled = true
      try {
        await fb.db.collection(`feedback/${fb.uid}/rounds`).add(entry)
        r.feedbackSent = true
        return renderResult()
      } catch {
        // This viewer can't save to the page (e.g. outside the owner's organization): fall back to copying
        fb.db = null
        e.target.disabled = false
        e.target.textContent = 'Copy feedback'
        app.querySelector('#fb-help').hidden = false
      }
    }
    const text = `Ave Caesar feedback: ${entry.game} · ${entry.set}: ${entry.stars}/3 stars, ${plural(entry.mistakes, 'mistake')}.` +
      (tags.length ? ` ${tags.join(', ')}.` : '') + (comment ? ` "${comment}"` : '')
    try {
      await navigator.clipboard.writeText(text)
      toast('<b>Copied!</b> Paste it in a message to whoever sent you this game.')
    } catch {
      const ta = app.querySelector('#fb-text')
      ta.value = text; ta.focus(); ta.select()
      toast('Select-all is done: copy the text in the box and send it.')
    }
  })
  app.querySelector('#next-round')?.addEventListener('click', () => startGame(next.type, next.set))
  app.querySelector('#to-battle')?.addEventListener('click', () => { window.scrollTo(0, 0); go({ screen: 'battle' }) })
  app.querySelector('#to-chapter')?.addEventListener('click', () => { window.scrollTo(0, 0); go({ screen: 'home' }) })
}
function renderRunDone() {
  const t = testOf(CH), score = pct(t.score)
  if (!testComplete(t)) { run = null; return go({ screen: 'home' }) }
  app.innerHTML = `
    ${header('Chapter test complete', CH.short)}
    <section class="result">
      <div>
        <p class="big-stars" style="margin:0">${score}%</p>
        <h2 style="margin-top:10px">${score >= 90 ? 'Excellent!' : score >= 80 ? 'Well done.' : score >= 70 ? 'You passed, just.' : 'A weak result.'}</h2>
        <p class="task" style="margin-top:4px">Your army for ${esc(battleOf(chapterIndex))}: ${armyLine(score)}. ${verdictFor(score)}</p>
      </div>
      ${score < 90 && rereadHtml(t) ? `<div class="review"><h3>Where your mistakes came from</h3>${rereadHtml(t)}</div>` : ''}
      <div class="actions"><button class="primary" id="to-battle">To battle</button><button class="ghost" id="menu">Back to the chapter</button></div>
    </section>`
  bindBack()
  app.querySelector('#to-battle').addEventListener('click', () => { run = null; go({ screen: 'battle' }) })
  app.querySelector('#menu').addEventListener('click', () => { run = null; go({ screen: 'home' }) })
}

// Keep a game in progress across page updates
window.claude?.hot?.snapshot?.(() => ({ state, run, chapterIndex }))
const boot = data => {
  if (Number.isInteger(data?.chapterIndex)) loadChapter(data.chapterIndex)
  const saved = data?.state
  if (saved?.screen && saved.screen !== 'home' && (!saved.type || GAMES[saved.type])) { state = saved; run = data.run ?? null }
  try { render() } catch { state = { screen: 'home' }; run = null; render() }
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {})
</script>
