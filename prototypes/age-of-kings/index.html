vors posted to Sicily"],"a":4,"level":2,"why":"Scipio's core force was two legions of men who had survived Cannae and been sent to Sicily. He drilled the army for about a year.","sec":"consul-at-thirty-one"},{"q":"What war indemnity did Carthage have to pay under the peace of 201 BC?","options":["40 tonnes of gold paid at once","1,000 silver talents over 10 years","10,000 silver talents over 50 years","3,200 silver talents over 50 years","5,000 silver talents over 20 years"],"a":2,"level":2,"why":"Carthage had to pay 10,000 silver talents over half a century. It also gave up its war elephants.","sec":"peace-and-africanus"},{"q":"What do modern scholars suspect really lay behind Scipio's appointment to Spain?","options":["The army in Spain proclaimed him its general","His uncle had named him successor before dying","The consuls drew lots and his name came up","The people forced him on a strongly unwilling Senate","Senators chose him, then had the people vote to make it look legitimate"],"a":4,"level":2,"why":"Scholars think the Senate picked Scipio and used a popular vote to legitimise an irregular command. A Roman historian two centuries later instead portrayed the Senate as dithering.","sec":"command-in-spain"},{"q":"How did Scipio arrange his infantry maniples at Zama to deal with Hannibal's elephants?","options":["Behind a line of sharpened stakes and trenches","Packed tightly into a single solid square","In their usual staggered, chessboard-like pattern","One behind another, leaving open lanes filled with skirmishers","Spread thinly along a ridge above the plain"],"a":3,"level":2,"why":"Instead of the normal staggered formation, Scipio lined up his maniples to create lanes. Most of the elephants ran down these lanes, where they were cut off and killed.","sec":"battle-of-zama"},{"q":"Why might Polybius's picture of Scipio be flattering, despite his general reliability?","options":["He was close to Scipio's family, and his main informant was Scipio's friend","He had served as an officer in Scipio's African army","He was paid by the Senate to glorify Roman generals","He relied only on Scipio's own Greek memoirs","He was Scipio's son and wrote a family history"],"a":0,"level":2,"why":"Polybius was a close friend of Scipio's relatives, and his main informant was Scipio's second-in-command. Scipio's own memoirs and his son's history are lost.","sec":"sources-and-legend"},{"q":"What made Scipio's command in Spain unprecedented?","options":["He was the first Roman to command an army overseas","He was appointed directly by a dictator","He got consular power without ever having been consul","He was chosen by the Senate alone, without a vote","He shared command with a Numidian prince"],"a":2,"level":2,"why":"Scipio had held none of Rome's senior offices, yet he received the full military authority of a consul. No Roman had been given such power before without first serving as consul.","sec":"command-in-spain"},{"q":"What weakness in New Carthage's defences did Scipio exploit?","options":["Its walls had been damaged by an earthquake","The harbour was left unguarded during a festival","The lagoon on its north side could be waded at low tide","A traitor opened the main gate at night","The citadel had run out of drinking water"],"a":2,"level":2,"why":"Scipio sent a party across the shallow lagoon while the walls were under attack. He told his troops Neptune had promised him help.","sec":"new-carthage"},{"q":"What happened to Masinissa's Numidian rival after the Battle of the Great Plains?","options":["He fled to Spain and joined the Carthaginians there","He was killed fighting beside Hannibal at Zama","He made peace with Rome and kept his kingdom","He was executed by the Carthaginians for failure","Masinissa and Scipio's second-in-command hunted him down and captured him"],"a":4,"level":2,"why":"The rival king was captured, and Masinissa took over much of his kingdom. At the Great Plains, Carthage's shaken troops broke at the first charge.","sec":"invasion-of-africa"},{"q":"How did Scipio use the winter peace talks of 204-203 BC to his advantage?","options":["He swapped prisoners to win back Roman captives","He stalled until Hannibal had left Italy for good","He recruited Carthaginian deserters as guides","He bribed the rival Numidian king to change sides","His envoys studied the enemy camps' layout, exits and reed huts"],"a":4,"level":2,"why":"Each diplomatic visit was also a spying mission. Scipio then burned the camps in a night attack.","sec":"invasion-of-africa"},{"q":"What bold step did the consul Claudius Nero take after reading the captured Carthaginian letters?","options":["Attacked Hannibal's camp in the south at once","Opened secret peace talks with Hannibal","Asked the Senate to appoint a dictator","Sailed to Spain to cut the enemy's supply lines","Marched north in secret with 7,000 picked men without Senate approval"],"a":4,"level":2,"why":"Claudius Nero marched hundreds of kilometres north, gathering volunteers and supplies on the way, and joined his fellow consul by night.","sec":"battle-of-the-metaurus"},{"q":"What made the Carthaginian commander realise a second Roman army had arrived before the Metaurus?","options":["A Roman deserter revealed the night march","He intercepted a letter from Claudius Nero","His scouts spotted dust from a marching column","He remembered hearing a second trumpet signal","He saw the Roman campfires suddenly double"],"a":3,"level":2,"why":"A second trumpet was the signal that a second commander had arrived. He noticed the Roman army had grown and retreated in the dark.","sec":"battle-of-the-metaurus"},{"q":"What was the outcome of Scipio's battle near Baecula in 208 BC?","options":["He destroyed the enemy army down to the last man","He captured Hannibal's brother alive on the field","The battle ended in a draw and a short truce","He was defeated and forced back to New Carthage","He won, but his opponent escaped with most of his army toward Italy"],"a":4,"level":2,"why":"Scipio won the battle, but Hannibal's brother slipped away, crossed the Pyrenees and headed for Italy to join Hannibal.","sec":"conquest-of-spain"},{"q":"When Scipio was elected aedile in 213 BC, what happened after a tribune objected that he was too young?","options":["The Senate annulled the election result","Scipio withdrew and waited two more years","A dictator was appointed to settle the dispute","The consuls overruled the tribune by decree","The crowd's enthusiasm made the tribune back down"],"a":4,"level":2,"why":"Popular enthusiasm forced the tribune to drop his objection. An aedile looked after the city's streets and festivals.","sec":"survivor-of-cannae"},{"q":"Italica, the town Scipio founded near Seville, later became famous as what?","options":["Rome's main naval base in Spain","The site of Hannibal's winter quarters","Carthage's last stronghold in Spain","The birthplace of three Roman emperors","The capital of Masinissa's kingdom"],"a":3,"level":2,"why":"Scipio founded Italica about 9 km northwest of Seville. It later produced three Roman emperors.","sec":"conquest-of-spain"},{"q":"What did the Romans do as Hannibal's elephants charged at Zama?","options":["Fell back to their fortified camp","Hid in pits dug across the plain","Released pigs to frighten the elephants","Threw burning pitch at the animals","Blared trumpets and banged their shields"],"a":4,"level":2,"why":"The noise panicked some elephants, which fled back through their own cavalry. The Roman horsemen then chased the Carthaginian cavalry off the field.","sec":"battle-of-zama"},{"q":"How did Scipio respond when admirers urged him to become consul for life and dictator?","options":["He went into voluntary exile instead","He accepted a dictatorship for one year","He let the Senate vote, and it said no","He refused","He accepted only the consulship for life"],"a":3,"level":2,"why":"Scipio turned down the offer, and later Roman writers praised his restraint. It contrasts with the generals who seized power in the Republic's final century.","sec":"peace-and-africanus"}],"3":[{"q":"What finally broke the deadlock between the Roman infantry and Hannibal's veteran third line at Zama?","options":["Fleeing elephants trampled the Carthaginian line","Roman cavalry returned and struck the Carthaginian rear","Reinforcements arrived from the siege of Utica","Hannibal's veterans ran out of javelins","Scipio's reserve line outflanked the veterans","Masinissa's infantry broke through the centre"],"a":1,"level":3,"why":"The two sides fought \"with the greatest fire and fury\" until the Roman cavalry came back and hit the enemy from behind. Polybius counted 20,000 Carthaginians killed against 1,500 Roman dead.","sec":"battle-of-zama"},{"q":"How do modern historians view the story that after Cannae Scipio forced young nobles plotting to flee abroad to swear loyalty at sword-point?","options":["They think it happened after Zama instead","They suspect it was invented","They think the nobles meant to join Hannibal","They accept it as confirmed by Polybius","They place the episode at the Ticinus","They credit the deed to Scipio's father"],"a":1,"level":3,"why":"The tale of Scipio bursting in on the would-be deserters is a later story that modern historians doubt. What is clear is that he survived Cannae and rallied the stragglers.","sec":"survivor-of-cannae"},{"q":"What restriction did the Senate's compromise place on Scipio's recruitment for the African expedition?","options":["He could take no more than a single legion","He could use only allied, non-Roman troops","He could recruit only from Sicilian cities","He could not sail until Hannibal left Italy","He had to share command with the princeps senatus","He could not call up soldiers normally, only ask for volunteers"],"a":5,"level":3,"why":"Scipio was limited to volunteers rather than a normal levy. He drilled his army for about a year, from units of 80 men up to the whole force.","sec":"consul-at-thirty-one"},{"q":"According to Polybius, why did Scipio order his men to kill everyone they met when New Carthage fell?","options":["To avenge his father and uncle","To punish a massacre of Roman refugees","To stop the garrison escaping by sea","To terrify the region into surrender","To honour Neptune with a sacrifice","Because his soldiers had mutinied"],"a":3,"level":3,"why":"Polybius saw the slaughter as deliberate terror, claiming soldiers even cut dogs in half. Once the citadel surrendered, Scipio spared the citizens and enslaved only non-citizens.","sec":"new-carthage"},{"q":"Which city, modern Cádiz, was Carthage's last stronghold in Spain, giving up soon after Ilipa?","options":["Baecula","Utica","Gades","Italica","New Carthage","Ilipa"],"a":2,"level":3,"why":"Gades surrendered after Scipio's decisive victory at Ilipa. The mopping-up before it was harsh, and the people of one town killed themselves rather than surrender.","sec":"conquest-of-spain"},{"q":"What did Carthage do after Hannibal returned from Italy with his veterans?","options":["Surrendered Utica to Scipio as a gesture","Asked Masinissa to mediate a peace","Accepted Scipio's terms without a fight","Sent Hannibal on to reconquer Spain","Executed the generals beaten at the Great Plains","Rejected a draft treaty Rome's Senate had approved"],"a":5,"level":3,"why":"Hannibal's return restored Carthage's nerve, so it rejected the draft treaty. He had landed with 15,000 to 20,000 veterans but few horses.","sec":"invasion-of-africa"},{"q":"Roughly how many reinforcements did Scipio bring with him when he arrived in Spain in 210 BC?","options":["About 7,000","About 40,000","About 25,000","About 10,000","About 15,000","About 4,000"],"a":3,"level":3,"why":"Scipio reached Spain in early autumn with about 10,000 reinforcements. He was taking over after his father and uncle had been killed there.","sec":"command-in-spain"},{"q":"Against the legend of divine visions, what did Polybius argue lay behind Scipio's success?","options":["Careful planning and clear thinking","Genuine favour from the god Neptune","Steady backing from the Senate","Masinissa's superior cavalry","Sheer luck on the battlefield","The devotion of his Spanish allies"],"a":0,"level":3,"why":"Polybius rejected the tales of gods and prophetic dreams and credited Scipio's own planning and judgment. Some legends even had Spaniards hailing Scipio as king and god.","sec":"sources-and-legend"},{"q":"In 210 BC Scipio received imperium pro consule. Why was that extraordinary?","options":["He had never held one of Rome’s senior offices","He was not a Roman citizen","He had lost a battle in Spain","He was already consul"],"a":0,"level":3,"why":"He was the first Roman given such power without first serving as consul.","sec":"command-in-spain"},{"q":"What was Scipio’s rank at Cannae in 216 BC?","options":["Military tribune (tribunus militum), a junior officer","Consul","Commander of the cavalry","Aedile"],"a":0,"level":3,"why":"He survived the disaster and rallied the stragglers.","sec":"survivor-of-cannae"}]},"chronicleMaps":[{"id":"scipio-wars","sec":"command-in-spain","title":"Scipio’s war, 210–202 BC","caption":"Scipio won Spain from Carthage (New Carthage, Baecula, Ilipa), while in Italy Claudius Nero beat Hannibal’s brother at the Metaurus. In 204 BC Scipio crossed from Sicily to Africa and won at Zama. Routes are drawn roughly.","bounds":{"latMin":35.3,"latMax":44.6,"lonMin":-7.6,"lonMax":16},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"r","dy":-4},{"name":"New Carthage","lat":37.6,"lon":-0.98,"kind":"battle","side":"r"},{"name":"Baecula","lat":38.09,"lon":-3.78,"kind":"battle","side":"r","dy":-6},{"name":"Ilipa","lat":37.52,"lon":-5.97,"kind":"battle","side":"r","dy":4},{"name":"Gades","lat":36.53,"lon":-6.29,"side":"r","dy":4},{"name":"Metaurus","lat":43.83,"lon":13.05,"kind":"battle","side":"l"},{"name":"Carthage","latin":"Carthago","lat":36.853,"lon":10.323,"side":"r","dy":-4},{"name":"Zama","lat":36.11,"lon":9.29,"kind":"battle","side":"r","dy":8}],"peoples":[{"name":"Spain","latin":"Hispania","lat":40.2,"lon":-4},{"name":"Numidia","lat":35.75,"lon":4.3},{"name":"Sicily","lat":37.55,"lon":14.2}],"routes":[{"pts":[[37.8,12.4],[37.5,11.3],[37.15,10.25]]}]},{"id":"zama","sec":"battle-of-zama","title":"Zama, 202 BC: lanes for the elephants","caption":"Scipio lined up his maniples one behind another, leaving lanes. Hannibal’s elephants charged, panicked at the trumpets and mostly ran down the lanes. Roman and Numidian horsemen chased the Carthaginian cavalry away, then came back to strike the rear of Hannibal’s veterans. A simplified plan.","plan":true,"height":205,"key":{"rome":"Scipio’s army","enemy":"Hannibal’s army"},"units":[{"side":"rome","x":100,"y":40,"w":16,"h":11,"name":"Maniples in columns, open lanes between","lx":158,"ly":33},{"side":"rome","x":130,"y":40,"w":16,"h":11},{"side":"rome","x":160,"y":40,"w":16,"h":11},{"side":"rome","x":190,"y":40,"w":16,"h":11},{"side":"rome","x":100,"y":56,"w":16,"h":11},{"side":"rome","x":130,"y":56,"w":16,"h":11},{"side":"rome","x":160,"y":56,"w":16,"h":11},{"side":"rome","x":190,"y":56,"w":16,"h":11},{"side":"rome","x":100,"y":72,"w":16,"h":11},{"side":"rome","x":130,"y":72,"w":16,"h":11},{"side":"rome","x":160,"y":72,"w":16,"h":11},{"side":"rome","x":190,"y":72,"w":16,"h":11},{"side":"rome","x":34,"y":50,"w":40,"h":16,"name":"Roman cavalry","ly":44},{"side":"rome","x":226,"y":50,"w":40,"h":16,"name":"Masinissa’s horse","ly":44},{"side":"enemy","x":100,"y":102,"w":106,"h":8,"name":"80 elephants","lx":153,"ly":99},{"side":"enemy","x":96,"y":118,"w":114,"h":10,"name":"First line","lx":153,"ly":125.5},{"side":"enemy","x":96,"y":134,"w":114,"h":10,"name":"Second line","lx":153,"ly":141.5},{"side":"enemy","x":96,"y":154,"w":114,"h":12,"name":"Hannibal’s veterans","lx":153,"ly":162.5},{"side":"enemy","x":34,"y":118,"w":40,"h":14,"name":"Cavalry","ly":140},{"side":"enemy","x":226,"y":118,"w":40,"h":14,"name":"Cavalry","ly":140}],"moves":[{"side":"enemy","dashed":true,"pts":[[123,100],[123,48]]},{"side":"enemy","dashed":true,"pts":[[153,100],[153,48]]},{"side":"enemy","dashed":true,"pts":[[183,100],[183,48]]},{"side":"rome","pts":[[54,68],[54,114]]},{"side":"rome","pts":[[246,68],[246,114]]},{"side":"rome","dashed":true,"pts":[[24,140],[24,182],[110,182],[118,170]]},{"side":"rome","dashed":true,"pts":[[276,140],[276,182],[196,182],[188,170]]}]}],"keyFacts":{"description":"Key facts for this chapter, written by hand from the chapter text. Every entry links to the section that explains it.","people":[{"name":"Scipio (Africanus)","text":"Roman general who conquered Spain and beat Hannibal at Zama.","sec":"command-in-spain"},{"name":"Hannibal","text":"Carthaginian general, recalled from Italy and defeated at Zama.","sec":"battle-of-zama"},{"name":"Masinissa","text":"Numidian prince who joined Rome and brought its cavalry at Zama.","sec":"conquest-of-spain"},{"name":"Claudius Nero","text":"Consul whose secret march north won the Metaurus in 207 BC.","sec":"battle-of-the-metaurus"},{"name":"Polybius","text":"Greek historian, our main and generally reliable source.","sec":"sources-and-legend"}],"dates":[{"when":"216 BC","text":"Scipio survives Cannae as a military tribune.","sec":"survivor-of-cannae"},{"when":"211 BC","text":"Scipio’s father and uncle are killed in Spain.","sec":"command-in-spain"},{"when":"210 BC","text":"Scipio, about 25, is given the Spanish command.","sec":"command-in-spain"},{"when":"209 BC","text":"Scipio storms New Carthage.","sec":"new-carthage"},{"when":"207 BC","text":"Hannibal’s brother is killed at the Metaurus.","sec":"battle-of-the-metaurus"},{"when":"206 BC","text":"Victory at Ilipa: Carthage loses Spain.","sec":"conquest-of-spain"},{"when":"204 BC","text":"Scipio lands in Africa near Utica.","sec":"invasion-of-africa"},{"when":"202 BC","text":"The battle of Zama.","sec":"battle-of-zama"},{"when":"201 BC","text":"Peace: Carthage becomes subordinate to Rome.","sec":"peace-and-africanus"}],"terms":[{"latin":"Carthago","english":"Carthage","sec":"survivor-of-cannae"},{"latin":"consules","english":"the two consuls","sec":"survivor-of-cannae"},{"latin":"tribunus militum","english":"a military tribune, a junior officer","sec":"survivor-of-cannae"},{"latin":"aedilis","english":"an official for streets and festivals","sec":"survivor-of-cannae"},{"latin":"imperium pro consule","english":"a consul’s full military authority","sec":"command-in-spain"},{"latin":"senatus","english":"the Senate","sec":"command-in-spain"},{"latin":"princeps senatus","english":"the leader of the Senate","sec":"consul-at-thirty-one"},{"latin":"legiones","english":"legions","sec":"consul-at-thirty-one"},{"latin":"manipuli","english":"maniples, infantry companies","sec":"battle-of-zama"},{"latin":"velites","english":"light skirmishers","sec":"battle-of-zama"},{"latin":"triumphus","english":"a victory parade","sec":"peace-and-africanus"},{"latin":"agnomen","english":"an honorary surname","sec":"peace-and-africanus"}]}},{"id":"rome-turns-east","era":"middle-republic","short":"Rome Turns East","title":"Rome Turns East","period":"200-167 BC","sources":["Second Macedonian War","Roman–Seleucid War","Third Macedonian War"],"briefing":{"title":"Greece, 200 BC","paragraphs":["Rome has just beaten Carthage, and its citizens are exhausted. Across the Adriatic Sea, Philip V, king of Macedon, is grabbing Greek cities, and Rhodes, Pergamon and Athens beg Rome for help. Further east, Antiochus III rules the vast Seleucid Empire from Syria and eyes the same lands.","Over the next thirty years Roman legions will clash with Macedon's famous phalanx and with the Seleucid 'Great King'. Rome will promise the Greeks freedom. The question is whether that freedom is real, or whether Rome is becoming Greece's new master."]},"sections":[{"id":"rome-looks-east","title":"Why Rome Went East","body":"In 204 BC the king of Egypt died and left his throne to a six-year-old boy. Two ambitious neighbours saw their chance. Philip V, king of Macedon, the warrior kingdom on Greece's northern border, and Antiochus III, ruler of the Seleucid Empire, the vast realm governed from Syria, made a secret pact to carve up Egypt's overseas possessions.\n\nPhilip moved fast. He seized Greek cities along the Dardanelles, the narrow strait between Europe and Asia, and in Asia Minor (modern Turkey). This alarmed two smaller powers: Rhodes, a rich island trading state, and Pergamon, a kingdom in western Asia Minor. Although they were holding their own, they feared Philip enough to appeal to Rome, which had just beaten Carthage in the Second Punic War. Athens soon joined them after Macedonian troops helped raid its territory.\n\nPhilip's actions hardly touched Rome directly. In 200 BC one of the consuls asked the Centuriate Assembly (*comitia centuriata*), the citizen body that alone could declare war, to vote for war. It refused almost unanimously, an unprecedented rejection blamed on exhaustion after years of fighting Carthage. At a second meeting the consul changed their minds, and that autumn a Roman army crossed the Adriatic Sea to Greece."},{"id":"flamininus-takes-command","title":"Flamininus Takes Command","body":"Rome's war against Philip V, king of Macedon, began slowly. Roman troops raided Macedon's western borders and won over neighbouring peoples, while a small Roman force helped relieve Athens. Philip took revenge by burning the shrines and tombs outside the city and wrecking the sanctuaries of the Athenian countryside so thoroughly that they were never used again. One Roman commander even faced a mutiny by 2,000 veterans who simply wanted to go home.\n\nIn 198 BC command passed to Flamininus, a consul not yet thirty who proudly called himself a lover of Greek culture. Until then Rome had only told Philip to stop attacking Greek cities. Flamininus raised the price: Philip must compensate every city he had harmed and pull his garrisons out of everywhere beyond Macedon, even Thessaly, the broad plain of north-central Greece that Macedon had held since 353 BC. Philip stormed out of the meeting.\n\nThe two armies faced each other across the Aous river, where it runs through a narrow gorge in the mountains of north-western Greece. The ground favoured the Macedonians, but Flamininus was shown a hidden path through the mountains. He sent troops round to strike from behind, and Philip fled into Thessaly, leaving about 2,000 men dead or wounded."},{"id":"cynoscephalae","title":"The Battle of Cynoscephalae","body":"In the winter of 198 BC Philip V of Macedon offered to talk peace with the Roman commander Flamininus. Suspicious, the king refused to step ashore and addressed the Romans from the prow of his ship. The talks went nowhere, and ancient writers claimed this was deliberate. Elections were under way in Rome, and Flamininus did not yet know whether his command would be extended (*prorogatio*). If he was to be replaced, he wanted a quick peace and the credit for it. Once he learned he would stay, his friends in Rome quietly sank the deal.\n\nPhilip now called up every man his kingdom could spare, from aged veterans to underage boys: about 18,000 Macedonians, plus Thracian light troops and hired soldiers. In June 197 BC the two armies were camped near each other among the Cynoscephalae hills, whose name means \"Dog's Heads\", in Thessaly. Small detachments blundered into each other and the skirmish swelled into a full battle.\n\nIt was a clash of two ways of war. Macedon relied on the phalanx, a dense block of men armed with very long spears. Rome's legions (*legiones*) were more flexible, and they won. Philip escaped on horseback, gathered his survivors and was forced to ask for peace on Rome's terms."},{"id":"freedom-of-the-greeks","title":"The Freedom of the Greeks","body":"After his defeat at Cynoscephalae in 197 BC, Philip V of Macedon accepted a harsh peace. Back in Rome the Tribal Assembly (*comitia tributa*), another of the citizen assemblies, voted unanimously for it. Philip had to withdraw every garrison from the Greek cities of Europe and Asia and pay 1,000 talents, a talent being roughly 26 kg of silver. He gave up his entire navy except his flagship, and his army was capped at 5,000 men, with no war elephants and no marching abroad without permission from the Senate (*senatus*).\n\nThen came a piece of political theatre. At the Isthmian Games of May 196 BC, a great festival near Corinth, the Roman commander Flamininus proclaimed freedom (*libertas*) for the Greek communities Philip had ruled. The crowd erupted in joy.\n\nThe freedom had limits. Rome kept troops in Corinth, Chalcis and Demetrias, three fortresses known as the \"fetters of Greece\" because whoever held them could control the country. The legions did not fully leave until 194 BC. The Aetolian League, a federation of central Greek states that had fought on Rome's side, felt cheated of cities it wanted and began claiming that Rome meant to become Greece's new master. Meanwhile, Rome used the slogan of Greek freedom to justify a war against Sparta in 195 BC."},{"id":"cold-war-with-antiochus","title":"A Cold War with Antiochus","body":"Antiochus III, ruler of the Seleucid Empire, the great kingdom based in Syria, was at the height of his power. He had brought Armenia and Iran back under his control and taken Syria and Judea from Egypt, earning the title \"Great King\". With Philip V of Macedon beaten by Rome, Antiochus pushed into western Asia Minor and then crossed into Europe, campaigning in Thrace, the land north-east of Greece.\n\nHistorians describe the years from 196 BC as a cold war. Rome saw Greece as its own sphere of influence and Asia Minor as a buffer zone; Antiochus saw Asia Minor as the heart of his empire and Greece as the buffer. Rome declared that even the Greek cities of Asia should be free. Antiochus neatly answered by declaring them free himself. In Rome, the victorious general Flamininus publicly promised to liberate the Greeks of Asia, while Roman negotiators told the king's envoys privately to stay on his side of the straits.\n\nThe spark came from the Aetolian League, the central Greek federation that now resented Rome. It invited Antiochus to liberate Greece. In 192 BC he landed at Demetrias, a fortress on the Greek coast, announcing he would free the Greeks from Roman rule. The Senate saw this as an intrusion it could not accept."},{"id":"thermopylae-and-magnesia","title":"Thermopylae and Magnesia","body":"Antiochus III, the Seleucid king who had landed in Greece in 192 BC, got a chilly welcome. Most Greeks found Rome's promises of freedom more convincing than his. In 191 BC a Roman consul arrived with a large army, and towns surrendered without a fight. Heavily outnumbered, Antiochus chose to make a stand at Thermopylae, the narrow coastal pass in central Greece. He was crushed and fled across the Aegean to Ephesus, less than six months after landing.\n\nRome and its allies then won command of the sea in two major naval battles. One of Antiochus's fleets, stopped by the Rhodians, was led by the old Carthaginian general who had once invaded Italy and now served at the king's court. In 190 BC a new consul, accompanied by his famous brother, the general who had defeated Carthage, crossed into Asia Minor. Antiochus offered to pay half of Rome's war costs; the Romans demanded everything, and he broke off talks.\n\nAround December 190 BC the armies met near Magnesia in western Asia Minor. The king of Pergamon led a cavalry charge that smashed one wing, and Antiochus's own elephants threw his infantry into disorder. Ancient writers gave him 72,000 men against 30,000 Romans and allies; one modern study argues both sides had about 50,000."},{"id":"peace-of-apamea","title":"The Peace of Apamea","body":"Beaten at Magnesia in 190 BC, Antiochus III, king of the Seleucid Empire, accepted the terms he had earlier rejected. They were confirmed in 188 BC at Apamea, a town in inland Asia Minor. He gave up all his lands north and west of the Taurus Mountains, the range running along the south coast of Asia Minor. He agreed to pay 15,000 talents over twelve years, to keep only ten large warships, to give up war elephants and never to sail west of a certain cape. Twenty hostages (*obsides*), including his youngest son, went to Rome, and he had to hand over Rome's enemies. The great Carthaginian general at his court fled instead, and years later killed himself rather than be surrendered.\n\nRome took no land for itself. The territory went to its loyal allies, Pergamon and Rhodes. Rome's Greek enemies, the Aetolians, were reduced to a dependent state required to serve \"the power and empire of the Roman people\".\n\nIn practice Rome enforced only the clauses on land and money; the last payment arrived, slightly late, in 173 BC. The military limits were tied to Antiochus personally and lapsed when he died in 187 BC. His successors rebuilt their navy and fielded elephants again, and Rome largely looked the other way."},{"id":"perseus-road-to-war","title":"Perseus and the Road to War","body":"In 179 BC Philip V of Macedon died and was succeeded by his ambitious son Perseus. The new king built alliances by marriage, taking a Seleucid princess as his wife and engaging his daughter to the king of Bithynia, a rival of Pergamon. His agents courted Greeks who did not want to live at Rome's mercy, and he drove out a Thracian king who was Rome's ally.\n\nThe king of Pergamon, Rome's closest friend in the region, travelled to Rome and accused Perseus before the Senate of preparing for war ever since he took the throne, warning that he might even invade Italy. Soon afterwards that king was nearly murdered on a visit to Delphi, the great shrine of Apollo, and the plot was blamed on Perseus. Rome declared him a public enemy (*hostis*), and war began in 171 BC.\n\nThe early years went badly for Rome. Near a hill called Callinicus in Thessaly, Perseus's cavalry and light troops won a clear victory, killing 2,000 Roman infantry and 200 cavalry for small losses of their own. He then offered ever larger sums for peace, but Rome demanded total surrender. Roman commanders made matters worse by plundering friendly Greek cities, and one was fined back home. In 169 BC a consul finally forced his army over the Olympus mountains into Macedon, building bridges so his elephants could pass."},{"id":"pydna","title":"The Battle of Pydna","body":"In 168 BC Rome sent Aemilius Paullus, an experienced consul serving for the second time, to finish the war against Perseus, king of Macedon. Aemilius prepared carefully. He sent an officer with several thousand men on a secret march, pretending they were off to raid the coast, but in fact they climbed into the mountains and drove off the Macedonian guards. Outflanked, Perseus fell back to Pydna on the Macedonian coast.\n\nThat night the moon went into eclipse. An officer had predicted it, so the Roman soldiers were not frightened. Aemilius, a pious man, offered sacrifice after sacrifice, and only on the twenty-first ox did the omens promise victory if Rome did not strike first.\n\nAncient writers disagree on how the battle began. Some said Aemilius provoked it by driving a riderless horse toward the enemy. The version favoured by the Roman historian who told the story at greatest length is humbler: a mule broke loose while both sides were drawing water from a river, a scuffle over it grew, and both armies poured in.\n\nAt first the phalanx's long spears pierced Roman shields. But on uneven ground gaps opened in its ranks. Aemilius sent small units to slip into them like wedges and strike the exposed flanks, where the long spears were useless. Within about an hour it was over. Ancient writers counted some 20,000 Macedonians dead and 11,000 captured, against about 100 Romans, and the pursuit ran for about 4.5 km (three miles)."},{"id":"end-of-macedon","title":"The End of the Macedonian Kingdom","body":"Perseus, the last king of Macedon, left the field at Pydna in 168 BC early. Ancient writers argued over why: one called it cowardice, another said he had been kicked by a horse the day before. He fled to his capital, Pella, then on to Samothrace, a sacred island in the northern Aegean, where he took refuge in a sanctuary. A Roman fleet blockaded the island. Perseus had the captain of his Cretan mercenaries killed, then tried to slip away by night, but the ship he had hired sailed off with his treasure. Abandoned by everyone except his eldest son, he surrendered.\n\nIn Rome, Aemilius Paullus, the victor of Pydna, celebrated a triumph (*triumphus*), the grand victory parade, with Perseus led in chains before it. The former king spent the rest of his life under guard at Alba Fucens, a town in central Italy.\n\nRome declared the Macedonians free, then dismantled their kingdom. It was split into four republics, centred on Amphipolis, Thessalonica, Pella and Pelagonia, each paying Rome a tribute (*tributum*) half what the king had taken. The national council was abolished, the gold and silver mines were closed and marriage between the districts was banned. Royal officials were deported to Italy. In Epirus, the region of north-western Greece that had backed Perseus, Roman troops sacked seventy towns on a single day and enslaved 150,000 people."}],"battle":{"name":"Pydna","year":"168 BC","enemy":"Perseus of Macedon","sec":"pydna","intro":"King Perseus’s phalanx bristles with long spears that pierce Roman shields. Hold the line until gaps open in its ranks."},"timelines":[{"name":"Level 1: The Big Battles","blurb":"Four turning points of Rome's wars in the East.","events":[{"label":"Rome beats Philip at Cynoscephalae","when":"June 197 BC","y":-197,"fact":"Rome's flexible legions defeated Philip V's phalanx among the 'Dog's Heads' hills in Thessaly.","sec":"cynoscephalae"},{"label":"Antiochus lands at Demetrias","when":"192 BC","y":-192,"fact":"Invited by the Aetolian League, the Seleucid king Antiochus III landed in Greece claiming he would free the Greeks from Rome.","sec":"cold-war-with-antiochus"},{"label":"Peace confirmed at Apamea","when":"188 BC","y":-188,"fact":"Antiochus III gave up all lands north and west of the Taurus Mountains and agreed to pay 15,000 talents.","sec":"peace-of-apamea"},{"label":"Aemilius Paullus wins at Pydna","when":"168 BC","y":-168,"fact":"In about an hour Roman units broke the Macedonian phalanx of Perseus on the Macedonian coast.","sec":"pydna"}]},{"name":"Level 2: From Philip to Perseus","blurb":"Follow Rome's road from a reluctant vote to a new Macedonian war.","events":[{"label":"Egypt's throne passes to a boy","when":"204 BC","y":-204,"fact":"The death of Egypt's king left a six-year-old on the throne, tempting Philip V and Antiochus III to carve up his possessions.","sec":"rome-looks-east"},{"label":"Assembly first rejects war on Philip","when":"200 BC","y":-200,"fact":"The Centuriate Assembly, which alone could declare war, refused almost unanimously before a consul changed its mind.","sec":"rome-looks-east"},{"label":"Flamininus proclaims Greek freedom","when":"May 196 BC","y":-196,"fact":"At the Isthmian Games near Corinth, Flamininus announced freedom for the Greek communities Philip had ruled, and the crowd erupted.","sec":"freedom-of-the-greeks"},{"label":"Antiochus crushed at Thermopylae","when":"191 BC","y":-191,"fact":"Heavily outnumbered, Antiochus III was beaten at the narrow pass and fled to Ephesus less than six months after landing.","sec":"thermopylae-and-magnesia"},{"label":"Perseus succeeds Philip V","when":"179 BC","y":-179,"fact":"Philip V's ambitious son Perseus built alliances by marriage, wedding a Seleucid princess.","sec":"perseus-road-to-war"},{"label":"Rome's war with Perseus begins","when":"171 BC","y":-171,"fact":"After Perseus was blamed for a plot against the king of Pergamon, Rome declared him a public enemy (hostis).","sec":"perseus-road-to-war"}]},{"name":"Level 3: The Whole Story","blurb":"Eight moments, from Macedon's old grip on Thessaly to the march over Olympus.","events":[{"label":"Macedon takes control of Thessaly","when":"353 BC","y":-353,"fact":"Macedon had held Thessaly, the broad plain of north-central Greece, since 353 BC, which is why Flamininus' demand to leave it was so harsh.","sec":"flamininus-takes-command"},{"label":"Flamininus takes command","when":"198 BC","y":-198,"fact":"The consul, not yet thirty, demanded that Philip V withdraw from everywhere beyond Macedon.","sec":"flamininus-takes-command"},{"label":"Rome wars on Sparta","when":"195 BC","y":-195,"fact":"Rome used the slogan of Greek freedom to justify a war against Sparta.","sec":"freedom-of-the-greeks"},{"label":"Last Roman legions leave Greece","when":"194 BC","y":-194,"fact":"Despite the proclamation of freedom, the legions did not fully leave Greece until 194 BC.","sec":"freedom-of-the-greeks"},{"label":"Antiochus beaten at Magnesia","when":"Around December 190 BC","y":-190,"fact":"A cavalry charge led by the king of Pergamon and Antiochus's own panicking elephants decided the battle.","sec":"thermopylae-and-magnesia"},{"label":"Antiochus III dies","when":"187 BC","y":-187,"fact":"The military limits of Apamea were tied to Antiochus personally and lapsed at his death.","sec":"peace-of-apamea"},{"label":"Last Apamea payment arrives","when":"173 BC","y":-173,"fact":"Rome enforced the money clauses, and the final instalment came slightly late.","sec":"peace-of-apamea"},{"label":"Consul forces way over Olympus","when":"169 BC","y":-169,"fact":"A Roman consul pushed his army over the Olympus mountains into Macedon, building bridges for his elephants.","sec":"perseus-road-to-war"}]}],"matches":[{"name":"Kings and Consuls","blurb":"Match each leader to what he did.","pairs":[["Philip V","Macedonian king whose phalanx lost at Cynoscephalae"],["Antiochus III","Seleucid 'Great King' beaten at Thermopylae and Magnesia"],["Perseus","Last king of Macedon, led in chains in a Roman triumph"],["Flamininus","Young consul who proclaimed Greek freedom at the Isthmian Games"],["Aemilius Paullus","Pious consul who sacrificed 21 oxen before winning at Pydna"]],"secs":["cynoscephalae","thermopylae-and-magnesia","end-of-macedon","freedom-of-the-greeks","pydna"]},{"name":"Words of War and Politics","blurb":"Match each term to its meaning.","pairs":[["Phalanx","Dense Macedonian block of men armed with very long spears"],["Fetters of Greece","Corinth, Chalcis and Demetrias, fortresses that controlled Greece"],["Aetolian League","Central Greek federation that invited Antiochus to free Greece"],["Centuriate Assembly","The citizen body that alone could declare war"],["Prorogatio","Extension of a Roman commander's term in the field"]],"secs":["cynoscephalae","freedom-of-the-greeks","cold-war-with-antiochus","rome-looks-east","cynoscephalae"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Comitia tributa","The Tribal Assembly, which approved peace with Philip"],["Libertas","Freedom, proclaimed for the Greeks in 196 BC"],["Obsides","Hostages, like the twenty sent by Antiochus"],["Hostis","A public enemy, as Rome declared Perseus"],["Triumphus","The grand victory parade, with Perseus in chains"],["Tributum","The tax the four Macedonian republics paid"]],"secs":["freedom-of-the-greeks","freedom-of-the-greeks","peace-of-apamea","perseus-road-to-war","end-of-macedon","end-of-macedon"]}],"decks":[{"name":"The War with Philip","blurb":"Rome's first big fight in Greece.","cards":[{"claim":"In 200 BC the Centuriate Assembly at first voted almost unanimously against war with Philip V.","answer":true,"why":"The unprecedented rejection was blamed on exhaustion after the war with Carthage; a second meeting approved the war.","sec":"rome-looks-east"},{"claim":"Rhodes and Pergamon appealed to Carthage for help against Philip V.","answer":false,"why":"They appealed to Rome, which had just beaten Carthage in the Second Punic War.","sec":"rome-looks-east"},{"claim":"Flamininus was over sixty when he took command against Philip in 198 BC.","answer":false,"why":"Flamininus was a consul not yet thirty years old.","sec":"flamininus-takes-command"},{"claim":"At the Aous river, Flamininus sent troops along a hidden mountain path to strike Philip from behind.","answer":true,"why":"Outflanked, Philip fled into Thessaly, leaving about 2,000 men dead or wounded.","sec":"flamininus-takes-command"},{"claim":"During peace talks in winter 198 BC, Philip refused to step ashore and spoke from the prow of his ship.","answer":true,"why":"The suspicious king stayed on his ship, and the talks went nowhere.","sec":"cynoscephalae"},{"claim":"The name Cynoscephalae means 'Lion's Gate'.","answer":false,"why":"Cynoscephalae means 'Dog's Heads', the name of the hills in Thessaly where the battle was fought.","sec":"cynoscephalae"},{"claim":"After his defeat, Philip's army was capped at 5,000 men.","answer":true,"why":"He also had to pay 1,000 talents, give up his navy except his flagship and keep no war elephants.","sec":"freedom-of-the-greeks"},{"claim":"Flamininus proclaimed the freedom of the Greeks at the Olympic Games.","answer":false,"why":"He made the proclamation at the Isthmian Games of May 196 BC, a great festival near Corinth.","sec":"freedom-of-the-greeks"}]},{"name":"Antiochus and Perseus","blurb":"The Seleucid king and the last king of Macedon.","cards":[{"claim":"Antiochus III landed at Demetrias in 192 BC after an invitation from the Aetolian League.","answer":true,"why":"The Aetolians, now resentful of Rome, invited him to liberate Greece.","sec":"cold-war-with-antiochus"},{"claim":"Most Greeks welcomed Antiochus III as their liberator.","answer":false,"why":"He got a chilly welcome: most Greeks found Rome's promises of freedom more convincing.","sec":"thermopylae-and-magnesia"},{"claim":"At Magnesia, Antiochus's own elephants threw his infantry into disorder.","answer":true,"why":"That, together with a cavalry charge by the king of Pergamon, cost him the battle.","sec":"thermopylae-and-magnesia"},{"claim":"Under the Peace of Apamea, Rome took large territories in Asia Minor for itself.","answer":false,"why":"Rome took no land; the territory went to its loyal allies Pergamon and Rhodes.","sec":"peace-of-apamea"},{"claim":"Perseus took a Seleucid princess as his wife.","answer":true,"why":"He built alliances by marriage, also engaging his daughter to the king of Bithynia.","sec":"perseus-road-to-war"},{"claim":"Near the hill of Callinicus, the Romans won a clear victory over Perseus.","answer":false,"why":"Perseus's cavalry and light troops won, killing 2,000 Roman infantry and 200 cavalry.","sec":"perseus-road-to-war"},{"claim":"The lunar eclipse before Pydna terrified the Roman soldiers.","answer":false,"why":"An officer had predicted the eclipse, so the Roman soldiers were not frightened.","sec":"pydna"},{"claim":"After Pydna, Rome split Macedon into four republics.","answer":true,"why":"They were centred on Amphipolis, Thessalonica, Pella and Pelagonia, each paying half the king's old tribute.","sec":"end-of-macedon"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Rhodes","Aetolian League","Pergamon","Athens"],"odd":1,"why":"Rhodes, Pergamon and Athens appealed to Rome against Philip V. The Aetolian League did not; it later invited Antiochus III into Greece.","sec":"rome-looks-east"},{"items":["Corinth","Chalcis","Pella","Demetrias"],"odd":2,"why":"Corinth, Chalcis and Demetrias were the 'fetters of Greece' where Rome kept troops. Pella was Macedon's capital and later a centre of one of the four republics.","sec":"freedom-of-the-greeks"},{"items":["Armenia","Iran","Syria and Judea","Thessaly"],"odd":3,"why":"Antiochus III brought Armenia and Iran back under control and took Syria and Judea from Egypt. Thessaly had been held by Macedon since 353 BC.","sec":"cold-war-with-antiochus"},{"items":["Pay 15,000 talents","Army capped at 5,000 men","Only ten large warships","Give up war elephants"],"odd":1,"why":"The other three were terms of the Peace of Apamea imposed on Antiochus III. The 5,000-man army cap was imposed on Philip V.","sec":"peace-of-apamea"},{"items":["Cynoscephalae","Thermopylae","Callinicus","Pydna"],"odd":2,"why":"Rome won at Cynoscephalae, Thermopylae and Pydna. At Callinicus, Perseus’s cavalry and light troops defeated the Romans.","sec":"perseus-road-to-war"},{"items":["Lunar eclipse","Runaway mule","Hidden path at the Aous","Riderless horse"],"odd":2,"why":"The eclipse, the mule and the horse belong to stories about Pydna. The hidden path helped Flamininus beat Philip at the Aous river.","sec":"pydna"},{"items":["Pydna","Pella","Samothrace","Ephesus"],"odd":3,"why":"Perseus fled from Pydna to Pella and then to Samothrace. Ephesus, in Asia Minor, was where Antiochus III fled after Thermopylae.","sec":"end-of-macedon"}]}],"whos":[{"name":"The Kings","blurb":"Three rulers who took on Rome.","people":[{"name":"Philip V","options":["Philip V","Antiochus III","Perseus","Flamininus"],"clues":["In revenge I burned the shrines and tombs outside Athens.","Suspicious of the Romans, I talked peace from the prow of my ship.","After my defeat I paid 1,000 talents and kept only my flagship.","Roman legions beat my phalanx at Cynoscephalae in 197 BC."],"sec":"cynoscephalae"},{"name":"Antiochus III","options":["Philip V","Antiochus III","Perseus","Flamininus"],"clues":["I brought Armenia and Iran back under my control.","When Rome said the Greek cities of Asia should be free, I declared them free myself.","I gave up all my lands north and west of the Taurus Mountains.","I was beaten at Thermopylae and again at Magnesia."],"sec":"thermopylae-and-magnesia"},{"name":"Perseus","options":["Philip V","Antiochus III","Perseus","Flamininus"],"clues":["I engaged my daughter to the king of Bithynia.","My cavalry beat the Romans near the hill of Callinicus.","I hid in a sanctuary on Samothrace before surrendering.","I was the last king of Macedon, defeated at Pydna in 168 BC."],"sec":"end-of-macedon"}]},{"name":"The Commanders","blurb":"Men who led armies in Rome's Greek wars.","people":[{"name":"Flamininus","options":["Flamininus","Aemilius Paullus","Philip V","Perseus"],"clues":["Ancient writers claimed my friends in Rome sank a peace deal once my command was extended.","I became consul before I was thirty and called myself a lover of Greek culture.","At the Aous river I was shown a hidden path through the mountains.","At the Isthmian Games of 196 BC I proclaimed freedom for the Greeks."],"sec":"freedom-of-the-greeks"},{"name":"Aemilius Paullus","options":["Flamininus","Aemilius Paullus","Philip V","Perseus"],"clues":["In 168 BC I was serving as consul for the second time.","I sent troops on a secret march, pretending they were off to raid the coast.","Only on the twenty-first ox did my sacrifices promise victory.","I won at Pydna and led a captured king in chains in my triumph."],"sec":"pydna"},{"name":"Philip V","options":["Flamininus","Aemilius Paullus","Philip V","Perseus"],"clues":["I made a secret pact with Antiochus III to carve up Egypt's overseas possessions.","I seized Greek cities along the Dardanelles.","I called up aged veterans and underage boys, about 18,000 Macedonians.","Outflanked at the Aous river, I fled into Thessaly."],"sec":"rome-looks-east"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Cynoscephalae","lat":39.42,"lon":22.58,"why":"In these 'Dog's Heads' hills of Thessaly, Rome's legions beat Philip V's phalanx in 197 BC.","sec":"cynoscephalae"},{"name":"Pydna","lat":40.36666667,"lon":22.58333333,"why":"On this Macedonian coast Aemilius Paullus destroyed Perseus's army in 168 BC.","sec":"pydna"},{"name":"Corinth","lat":37.9053455,"lon":22.8801924,"why":"Near Corinth Flamininus proclaimed Greek freedom, yet Rome kept troops in it as one of the 'fetters of Greece'.","sec":"freedom-of-the-greeks"},{"name":"Magnesia","lat":38.61666667,"lon":27.43333333,"why":"Around December 190 BC Rome and its allies defeated Antiochus III here in western Asia Minor.","sec":"thermopylae-and-magnesia"},{"name":"Apamea","lat":38.07166667,"lon":30.16555556,"why":"The peace terms imposed on Antiochus III were confirmed at this inland town of Asia Minor in 188 BC.","sec":"peace-of-apamea"},{"name":"Samothrace","lat":40.45,"lon":25.5875,"why":"Perseus took refuge in a sanctuary on this sacred island before surrendering to Rome.","sec":"end-of-macedon"},{"name":"Rhodes","lat":36.17,"lon":27.92,"why":"This rich island trading state appealed to Rome against Philip V and was rewarded with land after Apamea.","sec":"rome-looks-east"}]}],"quizPool":{"1":[{"q":"Into how many republics did Rome split the kingdom of Macedon?","options":["Two","Three","Four","Seven"],"a":2,"level":1,"why":"Macedon was broken into four republics, centred on Amphipolis, Thessalonica, Pella and Pelagonia. Rome first declared the Macedonians free and then dismantled their kingdom.","sec":"end-of-macedon"},{"q":"Where did Antiochus III make his stand against the Romans in 191 BC?","options":["Cynoscephalae","Marathon","Pydna","Thermopylae"],"a":3,"level":1,"why":"Heavily outnumbered, Antiochus chose the narrow pass of Thermopylae and was crushed there. He fled to Ephesus less than six months after landing in Greece.","sec":"thermopylae-and-magnesia"},{"q":"Where was the decisive battle between Rome and Antiochus III fought around December 190 BC?","options":["Pergamon","Apamea","Ephesus","Magnesia"],"a":3,"level":1,"why":"The armies met near Magnesia in western Asia Minor. A cavalry charge led by the king of Pergamon helped break Antiochus's army.","sec":"thermopylae-and-magnesia"},{"q":"Which two kings made a secret pact to carve up Egypt's overseas possessions after 204 BC?","options":["Philip V of Macedon and Antiochus III","Hannibal of Carthage and Philip V","Philip V of Macedon and Eumenes of Pergamon","Perseus of Macedon and Antiochus III"],"a":0,"level":1,"why":"Philip V of Macedon and Antiochus III of the Seleucid Empire saw Egypt's weakness as their chance. Philip moved first, seizing Greek cities along the Dardanelles and in Asia Minor.","sec":"rome-looks-east"},{"q":"Who accused Perseus before the Roman Senate of preparing for war?","options":["The Rhodians","The king of Pergamon","The Aetolian League","The king of Bithynia"],"a":1,"level":1,"why":"The king of Pergamon, Rome's closest friend in the region, went to Rome in person. He even warned that Perseus might invade Italy.","sec":"perseus-road-to-war"},{"q":"Which Greek federation, by now resentful of Rome, invited Antiochus III to liberate Greece?","options":["The Boeotian League","The Delian League","The Achaean League","The Aetolian League"],"a":3,"level":1,"why":"The Aetolian League had fought on Rome's side but felt cheated afterwards. Its invitation brought Antiochus to Greece in 192 BC.","sec":"cold-war-with-antiochus"},{"q":"Where did Perseus take refuge in a sanctuary after his defeat at Pydna?","options":["Delos","Delphi","Samothrace","Rhodes"],"a":2,"level":1,"why":"Perseus fled first to his capital, Pella, and then to the sacred island of Samothrace. A Roman fleet blockaded it until he surrendered.","sec":"end-of-macedon"},{"q":"In the Roman Republic, which body alone could declare war?","options":["The two consuls","The Senate","The Tribal Assembly","The Centuriate Assembly"],"a":3,"level":1,"why":"Only the Centuriate Assembly (comitia centuriata) could declare war. In 200 BC it at first rejected war with Philip V almost unanimously.","sec":"rome-looks-east"},{"q":"Who succeeded Philip V as king of Macedon in 179 BC?","options":["Alexander","Demetrius","Antiochus IV","Perseus"],"a":3,"level":1,"why":"Philip's ambitious son Perseus took the throne. He quickly built alliances through marriage and courted Greeks wary of Rome.","sec":"perseus-road-to-war"},{"q":"How much did Antiochus III agree to pay Rome under the Peace of Apamea?","options":["15,000 talents over twelve years","5,000 talents over five years","1,000 talents in one payment","50,000 talents over twenty years"],"a":0,"level":1,"why":"Antiochus agreed to pay 15,000 talents over twelve years. He also had to keep only ten large warships and give up war elephants.","sec":"peace-of-apamea"},{"q":"A talent, the unit used for Philip V's war payment to Rome, was roughly how much silver?","options":["260 kg","6 kg","26 kg","2.6 kg"],"a":2,"level":1,"why":"A talent was roughly 26 kg of silver. Philip had to pay 1,000 of them after his defeat.","sec":"freedom-of-the-greeks"},{"q":"What title did Antiochus III earn after recovering Armenia and Iran and taking Syria and Judea?","options":["King of Kings","Saviour","Lord of Asia","Great King"],"a":3,"level":1,"why":"His sweeping conquests won Antiochus III the title \"Great King\". With Philip beaten, he pushed into western Asia Minor and then crossed into Thrace.","sec":"cold-war-with-antiochus"},{"q":"Why were Roman soldiers not frightened by the lunar eclipse the night before Pydna?","options":["An officer had predicted it","It happened while they slept","Priests declared it a lucky sign","They had seen one at Cynoscephalae"],"a":0,"level":1,"why":"Because an officer had predicted the eclipse, the Roman troops stayed calm. Aemilius still offered sacrifice after sacrifice until the omens were favourable.","sec":"pydna"},{"q":"What does the name Cynoscephalae, the hills where Rome fought Philip V in 197 BC, mean?","options":["Wolf's Teeth","Eagle's Nest","Horse's Back","Dog's Heads"],"a":3,"level":1,"why":"Cynoscephalae means \"Dog's Heads\". The hills lie in Thessaly, where the two armies were camped near each other in June 197 BC.","sec":"cynoscephalae"},{"q":"How did Flamininus defeat Philip V at the Aous river gorge?","options":["He blocked the gorge and starved the Macedonians out","He lured Philip onto open ground with a pretended retreat","He sent troops along a hidden mountain path to attack from behind","He landed troops by sea behind the Macedonian camp"],"a":2,"level":1,"why":"The ground favoured the Macedonians, but Flamininus was shown a hidden path through the mountains. Philip fled into Thessaly, leaving about 2,000 men dead or wounded.","sec":"flamininus-takes-command"},{"q":"Which Roman consul was sent in 168 BC to finish the war against Perseus?","options":["Flamininus","Aemilius Paullus","Mummius","Scipio Africanus"],"a":1,"level":1,"why":"Aemilius Paullus, an experienced consul serving for the second time, was sent to end the war. He went on to win at Pydna and celebrate a triumph.","sec":"pydna"},{"q":"What did Flamininus proclaim at the Isthmian Games of 196 BC?","options":["Freedom for the Greek communities Philip had ruled","A new war against Antiochus III","Roman annexation of Macedon as a province","Thessaly's return to Macedonian rule"],"a":0,"level":1,"why":"At the great festival near Corinth, Flamininus proclaimed freedom (libertas) for the Greeks, and the crowd erupted in joy. The freedom had limits, though: Roman troops stayed in key fortresses.","sec":"freedom-of-the-greeks"},{"q":"Who took command of Rome's war against Philip V in 198 BC?","options":["Aemilius Paullus","Flamininus","Cato the Elder","Scipio Africanus"],"a":1,"level":1,"why":"Flamininus took over in 198 BC while still under thirty. He hardened Rome's demands and soon beat Philip at the Aous river.","sec":"flamininus-takes-command"},{"q":"What was the Macedonian phalanx?","options":["A flexible formation of small, independent units","A screen of light troops armed with javelins","A dense block of men armed with very long spears","A wedge of heavy cavalry led by the king"],"a":2,"level":1,"why":"The phalanx was a dense mass of spearmen with very long spears. At Cynoscephalae the more flexible Roman legions beat it.","sec":"cynoscephalae"},{"q":"After the Peace of Apamea, who received the land Antiochus III gave up?","options":["Rome's allies Pergamon and Rhodes","The Aetolian League","Rome, as its first eastern province","Egypt, which recovered its lost lands"],"a":0,"level":1,"why":"Rome took no land for itself and handed the territory to its loyal allies. The Aetolians, by contrast, were reduced to a dependent state.","sec":"peace-of-apamea"},{"q":"At the Isthmian Games of 196 BC, Flamininus proclaimed libertas for the Greeks. What does it mean?","options":["Freedom","Peace","Alliance","Citizenship"],"a":0,"level":1,"why":"The crowd erupted in joy, though Rome kept troops in the “fetters of Greece”.","sec":"freedom-of-the-greeks"},{"q":"In 171 BC Rome declared Perseus a hostis. What was that?","options":["A public enemy","A friend of Rome","A client king","A hostage"],"a":0,"level":1,"why":"Rome had heard the king of Pergamon accuse him of preparing for war.","sec":"perseus-road-to-war"},{"q":"How did Aemilius Paullus celebrate his victory over Perseus?","options":["With a triumphus, Perseus led in chains before it","With games at Corinth","By building a temple at Pydna","By freeing all the Macedonian prisoners"],"a":0,"level":1,"why":"Perseus spent the rest of his life under guard at Alba Fucens, in central Italy.","sec":"end-of-macedon"}],"2":[{"q":"Under the Peace of Apamea, Antiochus sent twenty obsides to Rome. Who were they?","options":["Hostages, including his youngest son","Ambassadors to the Senate","War elephants","Ships’ captains"],"a":0,"level":2,"why":"He also had to hand over Rome’s enemies, but Hannibal fled instead.","sec":"peace-of-apamea"},{"q":"How much tributum did each of the four Macedonian republics pay Rome?","options":["Half what the king had taken","Twice what the king had taken","The same as under the king","Nothing at all"],"a":0,"level":2,"why":"Rome declared the Macedonians free but dismantled their kingdom.","sec":"end-of-macedon"},{"q":"Which Roman assembly voted unanimously for peace with Philip V in 197 BC?","options":["The Tribal Assembly (comitia tributa)","The Centuriate Assembly","The Senate","The Assembly of the Curiae"],"a":0,"level":2,"why":"Philip had to withdraw his garrisons, pay 1,000 talents and give up his navy.","sec":"freedom-of-the-greeks"},{"q":"What new demand did Flamininus make of Philip V, beyond simply stopping attacks on Greek cities?","options":["Withdraw garrisons from everywhere beyond Macedon, even Thessaly","Pay Rome's costs for the entire war","Surrender his war elephants and his whole navy","Hand over his eldest son as a hostage to Rome","Break off his secret pact with Antiochus III"],"a":0,"level":2,"why":"Flamininus demanded compensation for every harmed city and withdrawal from everywhere beyond Macedon, including Thessaly. Philip stormed out of the meeting.","sec":"flamininus-takes-command"},{"q":"According to ancient writers, why did the peace talks of winter 198 BC go nowhere?","options":["Philip's envoys were murdered on the way to Rome","Flamininus was waiting to learn whether his command would be extended","Philip refused to give up Thessaly under any terms","Antiochus III threatened to invade if Philip made peace","The Senate had already ordered a final campaign"],"a":1,"level":2,"why":"Ancient writers claimed Flamininus wanted a quick peace only if he was to be replaced. Once he learned his command would be extended, his friends in Rome quietly sank the deal.","sec":"cynoscephalae"},{"q":"Why did the Centuriate Assembly at first reject war with Philip V in 200 BC?","options":["Anger at Athens for refusing to pay troops","Fear of Philip's alliance with Antiochus III","Exhaustion after years of fighting Carthage","Omens declared the war unlucky","A tribune vetoed the consul's proposal"],"a":2,"level":2,"why":"The almost unanimous and unprecedented refusal was blamed on war-weariness after the Second Punic War. At a second meeting the consul changed their minds.","sec":"rome-looks-east"},{"q":"What became of the great Carthaginian general at Antiochus III's court after Apamea?","options":["He returned to Carthage and led it in a new war","He was handed to Rome and executed in the Forum","He retired peacefully on the island of Rhodes","He fled and years later killed himself rather than be surrendered","He was sent to Rome as one of the twenty hostages"],"a":3,"level":2,"why":"Antiochus was required to hand over Rome's enemies, but the general fled. Years later he took his own life rather than be surrendered.","sec":"peace-of-apamea"},{"q":"Ancient accounts of how the Battle of Pydna began disagree. What does the version favoured by the Roman historian who told it at greatest length say?","options":["Aemilius drove a riderless horse toward the enemy","A Roman officer challenged a Macedonian to single combat","A mule broke loose at a river and a scuffle over it grew","Perseus attacked during the lunar eclipse","The Macedonians charged at dawn after a feast"],"a":2,"level":2,"why":"In this humbler version, a runaway mule sparked a scuffle while both sides drew water, and the armies poured in. Other writers said Aemilius provoked the battle with a riderless horse.","sec":"pydna"},{"q":"How much tribute did each of the four Macedonian republics have to pay Rome?","options":["Double what the king had taken","Half what the king had taken","Nothing at all","One-tenth of their harvests","The same as the king had taken"],"a":1,"level":2,"why":"Each republic paid Rome half what the king had collected. The republics were centred on Amphipolis, Thessalonica, Pella and Pelagonia.","sec":"end-of-macedon"},{"q":"At which great shrine was the king of Pergamon nearly murdered, in a plot blamed on Perseus?","options":["Delphi","Olympia","Dodona","Samothrace","Delos"],"a":0,"level":2,"why":"The near-murder at Delphi, the shrine of Apollo, came soon after the king accused Perseus in Rome. Rome then declared Perseus a public enemy, and war began in 171 BC.","sec":"perseus-road-to-war"},{"q":"What happened near the hill of Callinicus in Thessaly early in the war with Perseus?","options":["Perseus surrendered his treasury to a Roman fleet","Roman troops mutinied and demanded to go home","The Romans crushed Perseus's phalanx in under an hour","The Aetolians switched sides to join Perseus","Perseus's cavalry and light troops won a clear victory over Rome"],"a":4,"level":2,"why":"Perseus killed 2,000 Roman infantry and 200 cavalry for small losses. Even so, Rome answered his peace offers by demanding total surrender.","sec":"perseus-road-to-war"},{"q":"Who did Philip V call up for the army that fought at Cynoscephalae?","options":["A small elite guard of 5,000 picked men","Only professional mercenaries from Crete and Gaul","Conscripts from the Greek cities he had seized","Every man he could spare, from aged veterans to underage boys","Soldiers lent to him by Antiochus III"],"a":3,"level":2,"why":"Philip scraped together about 18,000 Macedonians, from old veterans to boys. Thracian light troops and hired soldiers fought alongside them.","sec":"cynoscephalae"},{"q":"Where did Antiochus III land in 192 BC, announcing he would free the Greeks from Roman rule?","options":["Chalcis","Thessalonica","Athens","Corinth","Demetrias"],"a":4,"level":2,"why":"Antiochus landed at the coastal fortress of Demetrias after the Aetolians invited him. The Senate saw this as an intrusion it could not accept.","sec":"cold-war-with-antiochus"},{"q":"How did Aemilius Paullus's army break the Macedonian phalanx at Pydna?","options":["Archers shot down the spearmen from nearby hills","Small units slipped into gaps on uneven ground and struck its flanks","The legions held firm until the phalanx tired and fled","Cavalry encircled the phalanx on open, level ground","Elephants charged straight through the front ranks"],"a":1,"level":2,"why":"Uneven ground opened gaps in the phalanx, and Roman units slipped in like wedges where the long spears were useless. The battle was over within about an hour.","sec":"pydna"},{"q":"At Magnesia, what threw Antiochus III's own infantry into disorder?","options":["A mutiny among his mercenaries","A sudden storm off the coast","The flight of the king himself","A Rhodian landing behind his lines","His own war elephants"],"a":4,"level":2,"why":"Antiochus's elephants turned into a liability and disrupted his infantry. On another wing, the king of Pergamon's cavalry charge smashed his line.","sec":"thermopylae-and-magnesia"},{"q":"How did Flamininus, Rome's commander from 198 BC, proudly describe himself?","options":["As a lover of Greek culture","As the avenger of Carthage","As heir to Alexander the Great","As a son of the god Apollo","As protector of Egypt's young king"],"a":0,"level":2,"why":"Flamininus, not yet thirty, styled himself a lover of Greek culture. He later staged the proclamation of Greek freedom at the Isthmian Games.","sec":"flamininus-takes-command"},{"q":"When Rome declared that the Greek cities of Asia should be free, how did Antiochus III respond?","options":["He garrisoned every one of them","He withdrew his army to Syria","He offered them to Pergamon","He declared them free himself","He executed the Roman envoys"],"a":3,"level":2,"why":"Antiochus neatly took the wind out of Rome's sails by declaring the cities free himself. Roman negotiators, meanwhile, privately told his envoys to stay on his side of the straits.","sec":"cold-war-with-antiochus"},{"q":"Which war did Rome justify in 195 BC using the slogan of Greek freedom?","options":["A war against Sparta","A war against Rhodes","A war against Thrace","A war against Athens","A war against Epirus"],"a":0,"level":2,"why":"Rome turned its own freedom slogan into a reason to fight Sparta in 195 BC. Meanwhile the Aetolian League was claiming Rome meant to become Greece's new master.","sec":"freedom-of-the-greeks"},{"q":"Which naval power stopped a fleet of Antiochus III led by the old Carthaginian general who had once invaded Italy?","options":["The Carthaginians","The Athenians","The Rhodians","The Macedonians","The Egyptians"],"a":2,"level":2,"why":"The Rhodians stopped this fleet, commanded by the former invader of Italy who now served at Antiochus's court. Rome and its allies won command of the sea in two major naval battles.","sec":"thermopylae-and-magnesia"},{"q":"What happened to Epirus, the region that had backed Perseus?","options":["It was freed and exempted from tribute","It became the fifth Macedonian republic","Its royal family was deported to Alba Fucens","Roman troops sacked seventy towns in one day and enslaved 150,000 people","It was handed to Pergamon as a reward"],"a":3,"level":2,"why":"Epirus in north-western Greece suffered brutal punishment for supporting Perseus. Royal Macedonian officials, meanwhile, were deported to Italy.","sec":"end-of-macedon"},{"q":"Why did the military limits of the Peace of Apamea lapse?","options":["They were set to expire after exactly ten years","The Seleucids paid an extra fee to buy them out","They were tied to Antiochus personally and ended when he died","Pergamon asked Rome to lift them after a new alliance","Rome cancelled them as a reward for prompt payment"],"a":2,"level":2,"why":"The military clauses applied to Antiochus himself, who died in 187 BC. His successors rebuilt their navy and fielded elephants again, and Rome largely looked the other way.","sec":"peace-of-apamea"}],"3":[{"q":"Before Pydna, on which sacrifice did Aemilius Paullus finally get favourable omens, and with what condition?","options":["The first ox; victory if Rome attacked before the eclipse","The twelfth ox; victory if Rome crossed the river first","The twenty-first ox; victory if Rome did not strike first","The twenty-first ox; victory if Rome attacked at dawn","The hundredth ox; victory if Rome waited for the full moon","The seventh ox; victory if Rome did not strike first"],"a":2,"level":3,"why":"The pious Aemilius kept sacrificing until the twenty-first ox, and the omens promised victory only if Rome did not strike first.","sec":"pydna"},{"q":"How large were the armies at Magnesia, according to ancient and modern estimates?","options":["Ancient: 30,000 against 72,000; modern: about 60,000 each","Ancient: 18,000 against 30,000; modern: about 20,000 each","Ancient: 72,000 against 50,000; modern: about 30,000 each","Ancient: 50,000 each; modern: 72,000 against 30,000","Ancient: 100,000 against 20,000; modern: about 40,000 each","Ancient: 72,000 against 30,000; modern: about 50,000 each"],"a":5,"level":3,"why":"Ancient writers gave Antiochus a huge advantage of 72,000 against 30,000, but one modern study argues the sides were roughly equal at about 50,000. The battle took place around December 190 BC.","sec":"thermopylae-and-magnesia"},{"q":"When did the final instalment of the Seleucid payments under the Peace of Apamea reach Rome?","options":["In 176 BC, exactly on schedule","In 187 BC, at the king's death","In 179 BC, two years early","It never arrived, and Rome let it go","In 168 BC, after Pydna","In 173 BC, slightly late"],"a":5,"level":3,"why":"The last payment came slightly late, in 173 BC. Rome enforced only the clauses on land and money and let the military limits slide.","sec":"peace-of-apamea"},{"q":"What event in 204 BC gave Philip V and Antiochus III their opening against Egypt?","options":["Rome defeated Carthage, Egypt's main ally","Egypt's king was captured in battle by Philip","Egypt's queen fled to Pergamon with the treasury","The king of Egypt died, leaving a six-year-old heir","A revolt broke out in Alexandria against the king","Egypt lost its navy in a storm off Rhodes"],"a":3,"level":3,"why":"A child on Egypt's throne tempted its ambitious neighbours. Philip and Antiochus made a secret pact to divide Egypt's overseas possessions.","sec":"rome-looks-east"},{"q":"What did Philip V do in revenge after a small Roman force helped relieve Athens?","options":["Melted down the treasures of the Acropolis","Executed the Athenian envoys at his court","Massacred the Athenian garrison at Piraeus","Exiled all Athenians living in Macedonian towns","Burned shrines and tombs outside the city and wrecked its rural sanctuaries","Seized the Athenian fleet and sank it at sea"],"a":4,"level":3,"why":"Philip wrecked the sanctuaries of the Athenian countryside so thoroughly that they were never used again. The early Roman war was slow, and one commander even faced a mutiny of 2,000 veterans.","sec":"flamininus-takes-command"},{"q":"How did the Battle of Cynoscephalae begin?","options":["Thracian troops ambushed a Roman foraging party","The armies drew up formally after days of manoeuvre","Philip charged after a failed parley on the shore","Small detachments blundered into each other and the skirmish grew","A mule broke loose and both sides fought over it","Flamininus launched a surprise dawn attack on Philip's camp"],"a":3,"level":3,"why":"The two armies were camped near each other in the hills, and a chance encounter swelled into a full battle. The more flexible Roman legions then beat the phalanx.","sec":"cynoscephalae"},{"q":"What happened when a consul first asked the comitia centuriata to declare war on Philip V in 200 BC?","options":["It refused almost unanimously","It voted for war at once","It asked the Senate to decide","It voted to make peace with Carthage"],"a":0,"level":3,"why":"The refusal was blamed on exhaustion; at a second meeting the consul changed their minds.","sec":"rome-looks-east"},{"q":"Why did Flamininus care whether his command got a prorogatio?","options":["If replaced, he wanted the credit for a quick peace","He wanted to become consul again at once","He hoped to be sent to Spain","He wanted to retire to Greece"],"a":0,"level":3,"why":"Once he learned his command was extended, his friends in Rome quietly sank the peace talks.","sec":"cynoscephalae"}]},"chronicleMaps":[{"id":"greek-east","sec":"rome-looks-east","title":"Greece and the East, 200–168 BC","caption" d"},{"side":"rome","x":182,"y":74,"w":14,"h":10},{"side":"enemy","x":40,"y":114,"w":66,"h":24},{"side":"enemy","x":122,"y":104,"w":56,"h":24},{"side":"enemy","x":194,"y":118,"w":66,"h":24,"name":"The phalanx: long spears, in a dense block","lx":150,"ly":160}],"moves":[{"side":"rome","pts":[[113,86],[114,112],[102,124]]},{"side":"rome","pts":[[189,86],[187,112],[198,126]]},{"side":"enemy","dashed":true,"pts":[[150,102],[150,62]]}]}],"keyFacts":{"description":"Key facts for this chapter, written by hand from the chapter text. Every entry links to the section that explains it.","people":[{"name":"Philip V","text":"King of Macedon, beaten at Cynoscephalae in 197 BC.","sec":"rome-looks-east"},{"name":"Flamininus","text":"Young consul who beat Philip and proclaimed the freedom of the Greeks.","sec":"flamininus-takes-command"},{"name":"Antiochus III","text":"Seleucid “Great King”, beaten at Thermopylae and Magnesia.","sec":"cold-war-with-antiochus"},{"name":"Perseus","text":"Philip’s son, the last king of Macedon.","sec":"perseus-road-to-war"},{"name":"Aemilius Paullus","text":"Consul who won at Pydna in 168 BC.","sec":"pydna"}],"dates":[{"when":"200 BC","text":"Rome declares war on Philip V at the second vote.","sec":"rome-looks-east"},{"when":"197 BC","text":"Cynoscephalae: the legions beat the phalanx.","sec":"cynoscephalae"},{"when":"196 BC","text":"Flamininus proclaims the freedom of the Greeks.","sec":"freedom-of-the-greeks"},{"when":"192 BC","text":"Antiochus lands in Greece at Demetrias.","sec":"cold-war-with-antiochus"},{"when":"191 BC","text":"Antiochus is crushed at Thermopylae.","sec":"thermopylae-and-magnesia"},{"when":"190 BC","text":"Battle of Magnesia.","sec":"thermopylae-and-magnesia"},{"when":"188 BC","text":"Peace of Apamea.","sec":"peace-of-apamea"},{"when":"171 BC","text":"War with Perseus begins.","sec":"perseus-road-to-war"},{"when":"168 BC","text":"Battle of Pydna; the end of the Macedonian kingdom.","sec":"pydna"}],"terms":[{"latin":"comitia centuriata","english":"the Centuriate Assembly, which declared war","sec":"rome-looks-east"},{"latin":"prorogatio","english":"the extension of a command","sec":"cynoscephalae"},{"latin":"legiones","english":"legions","sec":"cynoscephalae"},{"latin":"comitia tributa","english":"the Tribal Assembly","sec":"freedom-of-the-greeks"},{"latin":"senatus","english":"the Senate","sec":"freedom-of-the-greeks"},{"latin":"libertas","english":"freedom","sec":"freedom-of-the-greeks"},{"latin":"obsides","english":"hostages","sec":"peace-of-apamea"},{"latin":"hostis","english":"a public enemy","sec":"perseus-road-to-war"},{"latin":"triumphus","english":"a victory parade","sec":"end-of-macedon"},{"latin":"tributum","english":"tribute, a tax paid to Rome","sec":"end-of-macedon"}]}}]

// Every round of every game in a chapter is part of its test. Each item counts once, on the first try, weighted by how
// hard it is to guess (true/false 0.5, one of four 0.75, putting in order or placing 0.8) and, for quiz questions, by

const newSeed = () => Math.floor(Math.random() * 2 ** 31)
const testOf = c => (tests[c.id] ??= { attempt: 1, seed: newSeed(), answers: {}, done: {}, missSecs: {}, score: 0, battles: [], won: false, stars: 0 })
function seededRandom(seed) {
  let a = seed >>> 0
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
}
const seededShuffle = (arr, rnd) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }
// Two quiz rounds of ten (4 easy, 3 medium, 3 hard) drawn for this attempt from the chapter's whole question pool,
// with the answers in a new order
function quizSetsFor(c) {
  const rnd = seededRandom(testOf(c).seed)
  const pool = Object.fromEntries([1, 2, 3].map(l => [l, seededShuffle(c.quizPool[l] ?? [], rnd)]))
  const mix = q => { const order = seededShuffle(q.options.map((_, i) => i), rnd); return { ...q, options: order.map(i => q.options[i]), a: order.indexOf(q.a) } }
  return [0, 1].map(i => [...pool[1].slice(i * 4, i * 4 + 4), ...pool[2].slice(i * 3, i * 3 + 3), ...pool[3].slice(i * 3, i * 3 + 3)])
    .filter(qs => qs.length >= 8)
    .map((qs, i) => ({ name: ['Raise a Legion', 'Reinforcements'][i], blurb: `${qs.length} questions from the whole chapter`, questions: qs.map(mix) }))
}

// Drag helper: follows the pointer after a small movement; small movements stay taps
function draggable(el, { onMove, onDrop }) {
  el.style.touchAction = 'none'
  el.addEventListener('pointerdown', down => {
    if (busy || down.button > 0) return
    const sx = down.clientX, sy = down.clientY
    let dragging = false
    const move = e => {
      const dx = e.clientX - sx, dy = e.clientY - sy
      if (!dragging && Math.hypot(dx, dy) < 8) return
      dragging = true
      el.classList.add('dragging')
      el.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.max(-6, Math.min(6, dx / 20))}deg)`
      onMove?.(e, dx, dy)
    }
    const up = e => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up)
      if (!dragging) return
      el.dataset.dragged = '1'
      setTimeout(() => delete el.dataset.dragged, 0)
      const keep = onDrop?.(e, e.type === 'pointerup')
      if (!keep) { el.classList.remove('dragging'); el.style.transform = '' }
    }
    el.setPointerCapture(down.pointerId)
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up)
  })
}
