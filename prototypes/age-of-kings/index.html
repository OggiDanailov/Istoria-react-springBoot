\nThis tactic became known as a *secessio* (in full *secessio plebis*, \"the withdrawal of the plebs\"), or secession: a mass withdrawal, much like a modern general strike. Its power lay in numbers. Plebeians were the vast majority of Romans and produced most of the city's food and goods. When they left, shops and workshops closed, trade stopped, and the city faced its enemies with no army.\n\nOne modern count puts the total at five secessions between 494 and 287 BC. This first one set the pattern, and it worked."},{"id":"menenius-agrippa","title":"Menenius Agrippa and the Fable of the Belly","body":"With the plebeians camped on the Sacred Mount in 494 BC, the Senate needed a negotiator the strikers would trust. It chose Menenius Agrippa (*Agrippa Menenius Lanatus*), a former consul who was well liked by ordinary Romans.\n\nAccording to tradition, Menenius won them over not with threats but with a story. Once, he said, the limbs (*membra*) of the body grew angry with the belly (*venter*). They did all the work while the belly simply enjoyed the food. So they refused to feed it. But as the belly starved, so did they, and the whole body wasted away.\n\nThe moral was plain. Rome, like a body, could not survive unless patricians and plebeians worked together.\n\nThe plebeians agreed to negotiate, but they wanted more than a fable. Their price for returning was a new kind of official, chosen from among the plebs, to protect them from the power of the consuls. The Senate agreed, and some plebeians were freed from their debts as well."},{"id":"tribunes-of-the-plebs","title":"The Tribunes of the Plebs","body":"The great prize of the first secession of 494 BC was the tribune of the plebs (*tribunus plebis*), the first office in Rome open to commoners. Tradition says the first tribunes took office in 493 BC and soon added Sicinius, leader of the walkout, to their number.\n\nTribunes commanded no troops. Their power rested on an oath: they were sacrosanct, meaning the plebeians swore that anyone who laid hands on one could be killed without penalty. Shielded by this, a tribune could protect a citizen from a magistrate by placing his own untouchable person in the way. From this grew the veto (Latin for \"I forbid\"), the power to block the acts of consuls, other magistrates and even the Senate. A Roman under threat could cry \"I call upon the tribunes!\" (*appello tribunos*).\n\nThere were limits. A tribune had to be physically present to intervene, and his protection held only within Rome and about 1.5 km (a mile) beyond. Ancient sources say there were first two or five tribunes, rising to ten in 457 BC."},{"id":"plebeian-council","title":"A Parliament of the Plebs","body":"The settlement of 494 BC also let plebeians meet in their own assembly, the Plebeian Council (*concilium plebis*). Here they elected their tribunes, the officials who protected commoners, and passed resolutions called plebiscites (*plebiscita*, \"decisions of the plebs\"). At first these bound only plebeians.\n\nThere was a catch. The assembly was first organised by *curiae*, ancient groupings of families in which many plebeians were clients (*clientes*) of patrician patrons (*patroni*) and voted as those patrons wished. The aristocrats could quietly steer who became tribune.\n\nIn 471 BC a tribune pushed through a law (*lex*), the *Lex Publilia*, that changed the rules. Plebeians would now gather and vote by tribe (*tribus*), districts of citizens, rather than by curia, and tribunes would be elected this way. Historians see this as the moment the plebeians became politically independent.\n\nPatricians kept looking for ways to tame the tribunes, such as persuading one tribune to block his colleagues. But the plebs now had a voice of their own, and they soon used it to demand written law."},{"id":"demand-for-written-law","title":"The Demand for Written Law","body":"In the early Republic, Roman law was not written down. It was interpreted only by the pontiffs (*pontifices*), upper-class priests. A plebeian in a dispute with a patrician was fighting by rules only the other side knew.\n\nIn 462 BC a tribune declared that the consuls had become more oppressive than the kings they replaced, and proposed a commission to define and limit their powers. The Senate stalled for five years, pointing to war and plague, while the plebs kept re-electing the same tribunes. In 457 BC the Senate tried to defuse the campaign by raising the number of tribunes to ten.\n\nThe pressure continued. According to Livy, envoys were sent to study the laws of Athens and other Greek cities. Some modern scholars doubt this, suggesting they visited only Greek cities in southern Italy, or borrowed nothing.\n\nAround 450 BC, all regular offices were suspended. A board of ten men, the decemvirs (*decemviri*, \"ten men\"), was given one year of unchallengeable power to write down Rome's laws."},{"id":"twelve-tables","title":"The Twelve Tables","body":"The decemvirs, a board of ten men appointed around 450 BC to write down Rome's laws, produced ten tables, and a second board added two more. In 449 BC the complete Twelve Tables (*Leges Duodecim Tabularum*) were formally published. According to Livy they were engraved on bronze and displayed publicly so every citizen could know them.\n\nThey were a list of specific rules rather than a grand code. Trials ended at sunset. Fruit falling onto a neighbour's land still belonged to the tree's owner. A father who sold his son three times lost his power over him, the *patria potestas* (\"power of the father\").\n\nDebt rules were harsh but clear. A debtor had thirty days to pay; then his creditor could bind him in chains of at least 5 kg (fifteen pounds) and feed him about 330 g (a pound) of bread a day for sixty days. Not everything helped the plebs: one law banned marriage (*conubium*) between patricians and plebeians.\n\nLater Romans revered the Tables, which formed the basis of Roman law for a thousand years."},{"id":"appius-claudius-and-verginia","title":"Appius Claudius, Verginia and the Second Secession","body":"The second board of ten men, the decemvirs appointed to finish Rome's written law, became a tyranny. When their term ended they refused to step down, ruling with no tribunes to check them and no right of appeal (*provocatio*). They even had a soldier killed, a former tribune who had criticised them.\n\nTheir most notorious member was Appius Claudius (*Appius Claudius Crassus*). According to tradition, he tried to rape Verginia, a beautiful plebeian girl whose father was a respected centurion, an army officer. To save her from Appius Claudius, her father killed her himself, to uphold her freedom and virtue.\n\nThe crowd that witnessed the killing rioted, and the anger spread to the army camped outside the city. The people gathered on the Aventine (*Mons Aventinus*), one of Rome's hills, then withdrew to the Sacred Mount. This second secession of 449 BC forced the decemvirs to resign. Two senators negotiated, restored the tribunes and the right of appeal, and as consuls passed laws making plebeian decisions binding on all Romans."},{"id":"how-reliable","title":"How Much of This Really Happened?","body":"For centuries, the story of plebeian strikes, brave tribunes and wicked decemvirs was accepted as straightforward history. Today almost every part of it is controversial.\n\nThe core problem is that no one wrote about these events at the time. Our fullest accounts come from Livy and other writers living more than four centuries later, who are sometimes thought to mix fact and fable freely and to assume Roman institutions barely changed over time.\n\nThere are puzzles, too. Official lists of consuls (*fasti consulares*) include men with plebeian family names in the fifth century BC, when the post was supposedly closed to them. It is odd that such bitter grievances led to so little bloodshed, when similar quarrels in the late Republic quickly turned violent. And it is unclear who the plebs really were: many were wealthy landowners.\n\nOne modern scholar has even argued there was no conflict at all, and that later Romans projected the class struggles of their own day onto a dimly remembered past."}],"battle":{"name":"War with the Volsci","year":"494 BC","enemy":"Volsci, Aequi and Sabines","sec":"first-secession","intro":"Rome is at war with three neighbours: the Sabines, and the Aequi and Volsci, hill tribes to the east and south-east. The plebeians are back from the Sacred Mount, with tribunes of their own. Now Rome needs every soldier."},"timelines":[{"name":"The Big Moments","blurb":"Four turning points in the early struggle between patricians and plebeians.","events":[{"label":"Last king driven out of Rome","when":"509 BC","y":-509,"fact":"According to tradition, the Romans then founded a republic led by two yearly consuls and the Senate.","sec":"patricians-and-plebeians"},{"label":"Plebeians walk out to the Sacred Mount","when":"494 BC","y":-494,"fact":"Plebeian soldiers refused to fight and camped on the Mons Sacer, a hill about 5 km (just over three miles) from Rome.","sec":"first-secession"},{"label":"Lex Publilia: plebs vote by tribe","when":"471 BC","y":-471,"fact":"Voting by tribe instead of by curia freed plebeians from their patrician patrons' influence.","sec":"plebeian-council"},{"label":"Twelve Tables formally published","when":"449 BC","y":-449,"fact":"According to Livy, the laws were engraved on bronze and displayed so every citizen could know them.","sec":"twelve-tables"}]},{"name":"From Debt to Written Law","blurb":"Follow the plebeians from a debt crisis to the long end of their struggle.","events":[{"label":"Ragged ex-soldier stirs the Forum","when":"495 BC","y":-495,"fact":"Livy tells of a veteran ruined by debt and whipped by creditors, whose story enraged the crowd.","sec":"debt-crisis"},{"label":"First tribunes of the plebs take office","when":"493 BC","y":-493,"fact":"The tribunate was the first office in Rome open to commoners.","sec":"tribunes-of-the-plebs"},{"label":"Tribune attacks consuls' power","when":"462 BC","y":-462,"fact":"A tribune claimed the consuls were worse than the kings and proposed a commission to limit them.","sec":"demand-for-written-law"},{"label":"Tribunes increased to ten","when":"457 BC","y":-457,"fact":"The Senate hoped more tribunes would defuse the campaign for written law.","sec":"demand-for-written-law"},{"label":"Decemvirs take power to write laws","when":"Around 450 BC","y":-450,"fact":"All regular offices were suspended and a board of ten men got one year of unchallengeable power.","sec":"demand-for-written-law"},{"label":"Conflict of the Orders ends","when":"287 BC","y":-287,"fact":"The struggle between patricians and plebeians lasted from soon after 509 BC until 287 BC.","sec":"patricians-and-plebeians"}]},{"name":"The Full Struggle","blurb":"Eight steps from the fall of the kings to the fall of the decemvirs.","events":[{"label":"Two consuls replace the kings","when":"509 BC","y":-509,"fact":"Tradition says the Republic began when the Romans drove out their last king.","sec":"patricians-and-plebeians"},{"label":"Consul backs creditors' right to jail","when":"495 BC","y":-495,"fact":"Instead of easing the debt crisis, a hard-line consul reinforced creditors' power to imprison debtors.","sec":"debt-crisis"},{"label":"Menenius tells the fable of the belly","when":"494 BC","y":-494,"fact":"According to tradition, his story persuaded the plebeians on the Sacred Mount to negotiate.","sec":"menenius-agrippa"},{"label":"Sacrosanct tribunes first take office","when":"493 BC","y":-493,"fact":"Anyone who laid hands on a tribune could be killed without penalty.","sec":"tribunes-of-the-plebs"},{"label":"Plebs start voting by tribe","when":"471 BC","y":-471,"fact":"The Lex Publilia is seen by historians as the moment the plebeians became politically independent.","sec":"plebeian-council"},{"label":"Commission to limit consuls proposed","when":"462 BC","y":-462,"fact":"The Senate stalled for five years, pointing to war and plague.","sec":"demand-for-written-law"},{"label":"Laws handed to ten men","when":"Around 450 BC","y":-450,"fact":"The decemvirs were given one year to write down Rome's laws.","sec":"demand-for-written-law"},{"label":"Second secession forces decemvirs out","when":"449 BC","y":-449,"fact":"Outrage over Verginia's death drove the people to the Aventine and then the Sacred Mount.","sec":"appius-claudius-and-verginia"}]}],"matches":[{"name":"Who's Who","blurb":"Match each person to their part in the story.","pairs":[["Sicinius","Plebeian leader who masterminded the first walkout of 494 BC"],["Menenius Agrippa","Popular ex-consul who told the plebs the fable of the belly"],["Appius Claudius","Most notorious decemvir, whose crime sparked the second secession"],["Verginia","Plebeian girl killed by her own father to save her freedom"],["Livy","Roman historian who wrote the fullest account, centuries later"]],"secs":["first-secession","menenius-agrippa","appius-claudius-and-verginia","appius-claudius-and-verginia","debt-crisis"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Tribunus plebis","Tribune of the plebs, the commoners’ protector"],["Veto","“I forbid”: a tribune’s power to block"],["Nexum","Debt bondage"],["Concilium plebis","The Plebeian Council"],["Provocatio","The right of appeal"],["Patria potestas","“Power of the father” over his son"]],"secs":["tribunes-of-the-plebs","tribunes-of-the-plebs","patricians-and-plebeians","plebeian-council","appius-claudius-and-verginia","twelve-tables"]}],"decks":[{"name":"Strike and Settlement","blurb":"From the debt crisis to the first tribunes.","cards":[{"claim":"Rome's two consuls were elected for a single year.","answer":true,"why":"Power passed to two consuls, chief magistrates elected for one year, and to the Senate.","sec":"patricians-and-plebeians"},{"claim":"In the early Republic, plebeians could stand for consul.","answer":false,"why":"Only patricians, a small circle of aristocratic families, could stand for office.","sec":"patricians-and-plebeians"},{"claim":"In Livy's story, the ragged soldier's farm was burned while he fought the Sabines.","answer":true,"why":"Raiders burned his farm while he was away fighting the Sabines, a hill people north-east of Rome.","sec":"debt-crisis"},{"claim":"After the soldier's story spread, a consul cancelled all debts.","answer":false,"why":"A hard-line consul did the opposite, issuing decrees reinforcing creditors' right to imprison debtors.","sec":"debt-crisis"},{"claim":"In the first secession of 494 BC, the plebeians camped on the Mons Sacer.","answer":true,"why":"They camped on the Mons Sacer, the 'Sacred Mount', about 5 km (just over three miles) from Rome.","sec":"first-secession"},{"claim":"Menenius Agrippa was a former consul well liked by ordinary Romans.","answer":true,"why":"The Senate chose him to negotiate because the strikers would trust him.","sec":"menenius-agrippa"},{"claim":"In Menenius's fable, the limbs grew stronger after they stopped feeding the belly.","answer":false,"why":"As the belly starved, so did the limbs, and the whole body wasted away.","sec":"menenius-agrippa"},{"claim":"Tribunes commanded their own troops to protect plebeians.","answer":false,"why":"Tribunes commanded no troops; their power rested on an oath making them sacrosanct.","sec":"tribunes-of-the-plebs"}]},{"name":"Laws and Lawbreakers","blurb":"From the Plebeian Council to the fall of the decemvirs.","cards":[{"claim":"The Lex Publilia of 471 BC made plebeians vote by tribe rather than by curia.","answer":true,"why":"Historians see this as the moment the plebeians became politically independent.","sec":"plebeian-council"},{"claim":"At first, plebiscites were binding on all Romans.","answer":false,"why":"At first they bound only plebeians; laws of 449 BC made plebeian decisions binding on all.","sec":"plebeian-council"},{"claim":"According to Livy, envoys went to study the laws of Carthage.","answer":false,"why":"Livy says they studied the laws of Athens and other Greek cities, though some scholars doubt it.","sec":"demand-for-written-law"},{"claim":"Under the Twelve Tables, a debtor had thirty days to pay.","answer":true,"why":"After thirty days his creditor could chain him and feed him about 330 g (a pound) of bread a day for sixty days.","sec":"twelve-tables"},{"claim":"The Twelve Tables allowed patricians and plebeians to marry each other.","answer":false,"why":"One law banned marriage between patricians and plebeians.","sec":"twelve-tables"},{"claim":"Verginia was killed by Appius Claudius.","answer":false,"why":"Tradition says her own father killed her to save her from Appius Claudius.","sec":"appius-claudius-and-verginia"},{"claim":"The second secession of 449 BC forced the decemvirs to resign.","answer":true,"why":"Two senators then negotiated and restored the tribunes and the right of appeal.","sec":"appius-claudius-and-verginia"},{"claim":"Official consul lists include men with plebeian family names in the fifth century BC.","answer":true,"why":"This is a puzzle, since the post was supposedly closed to plebeians then.","sec":"how-reliable"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Twelve Tables","Tribunes of the plebs","Plebeian Council","Some debts cancelled"],"odd":0,"why":"Tribunes, the Plebeian Council and freedom from some debts all came from the settlement of 494 BC. The Twelve Tables came much later, in 449 BC.","sec":"plebeian-council"},{"items":["Sabines","Athens","Aequi","Volsci"],"odd":1,"why":"The Sabines, Aequi and Volsci were at war with Rome in 494 BC. Athens was the Greek city whose laws Roman envoys reportedly studied.","sec":"first-secession"},{"items":["Sacrosanct person","Veto over magistrates","Command of troops","Shielding citizens in person"],"odd":2,"why":"These were all features of a tribune's power, except troops: tribunes commanded none and relied on their sacred oath.","sec":"tribunes-of-the-plebs"},{"items":["Trials end at sunset","Fallen fruit stays the owner's","No patrician-plebeian marriage","Voting by tribe, not curia"],"odd":3,"why":"Three are rules in the Twelve Tables. Voting by tribe came from the Lex Publilia of 471 BC.","sec":"twelve-tables"},{"items":["No writers at the time","Plebeian names on consul lists","Basis of law for 1,000 years","Surprisingly little bloodshed"],"odd":2,"why":"Three are reasons scholars doubt the traditional story. Lasting a thousand years as the basis of Roman law is praise of the Twelve Tables, not a doubt.","sec":"how-reliable"}]}],"whos":[{"name":"Leaders and Tyrants","blurb":"Three men who shaped the early struggle.","people":[{"name":"Sicinius","options":["Sicinius","Menenius Agrippa","Appius Claudius","Coriolanus"],"clues":["My followers built simple defences outside the city and waited.","I advised the soldiers to leave Rome together instead of fighting the Sabines, Aequi and Volsci.","The walkout I planned ended on the Mons Sacer, the Sacred Mount.","I was the plebeian leader who masterminded the first secession of 494 BC."],"sec":"first-secession"},{"name":"Menenius Agrippa","options":["Menenius Agrippa","Sicinius","Appius Claudius","Cincinnatus"],"clues":["I had already served as consul before the plebeians walked out in 494 BC.","Ordinary Romans liked me, so the Senate sent me to negotiate.","I won over the strikers with a story rather than threats.","I told the fable of the limbs that refused to feed the belly."],"sec":"menenius-agrippa"},{"name":"Appius Claudius","options":["Appius Claudius","Menenius Agrippa","Sicinius","Cincinnatus"],"clues":["I sat on the board meant to finish writing Rome's laws.","When our term ended, my colleagues and I refused to step down.","The second secession of 449 BC forced us to resign.","I was the most notorious decemvir, and tradition says I tried to rape Verginia."],"sec":"appius-claudius-and-verginia"}]},{"name":"Voices and Victims","blurb":"A heroine, a historian and a tribune.","people":[{"name":"Verginia","options":["Verginia","Lucretia","Cloelia","Veturia"],"clues":["My father was a respected centurion, an army officer.","The crowd that saw my death rioted, and the anger spread to the army.","My death led to the second secession of 449 BC.","I was the plebeian girl a notorious decemvir tried to seize."],"sec":"appius-claudius-and-verginia"},{"name":"Livy","options":["Livy","Polybius","Tacitus","Suetonius"],"clues":["Some think I mixed fact and fable and assumed Roman institutions barely changed.","I reported that envoys went to study the laws of Athens.","I told of a ragged former soldier who threw himself into the Forum.","I wrote the fullest account of these years, nearly five centuries later."],"sec":"how-reliable"},{"name":"Sicinius","options":["Sicinius","Coriolanus","Spurius Cassius","Cincinnatus"],"clues":["My power rested on a sworn oath, not on soldiers.","Anyone who laid hands on me could be killed without penalty.","Soon after the first tribunes took office in 493 BC, I was added to their number.","I led the walkout that won the plebs their own officials."],"sec":"tribunes-of-the-plebs"}]}],"maps":[],"quizPool":{"1":[{"q":"What were the resolutions passed by the Plebeian Council called?","options":["Senatus consulta","Decrees","Plebiscites","Edicts"],"a":2,"level":1,"why":"The council passed resolutions called plebiscites. At first these bound only plebeians.","sec":"plebeian-council"},{"q":"What could a Roman threatened by a magistrate cry out for help?","options":["\"I appeal to the gods!\"","\"I am a Roman citizen!\"","\"I call upon the tribunes!\"","\"I call upon the Senate!\""],"a":2,"level":1,"why":"A threatened Roman could call on the tribunes, who would step in to protect him. A tribune had to be physically present to intervene.","sec":"tribunes-of-the-plebs"},{"q":"What was the board of ten men appointed to write down Rome's laws called?","options":["The decemvirs","The triumvirs","The lictors","The quaestors"],"a":0,"level":1,"why":"The decemvirs, meaning 'ten men', were given one year of unchallengeable power to write down the laws. They were appointed around 450 BC.","sec":"demand-for-written-law"},{"q":"Who was the most notorious member of the second board of decemvirs?","options":["Sicinius","Cincinnatus","Menenius Agrippa","Appius Claudius"],"a":3,"level":1,"why":"Appius Claudius was the most infamous of the decemvirs. Tradition blames him for the attack on Verginia that sparked the second secession.","sec":"appius-claudius-and-verginia"},{"q":"A Roman secessio is often compared to which modern tactic?","options":["A general strike","A military coup","A hunger strike","A trade embargo"],"a":0,"level":1,"why":"A secession was a mass withdrawal, much like a modern general strike. When the plebs left, shops and workshops closed and trade stopped.","sec":"first-secession"},{"q":"What was the veto, the tribunes' most famous power?","options":["The power to block acts of magistrates and the Senate","The power to declare war on Rome's enemies","The power to appoint new members of the Senate","The power to command an army in wartime"],"a":0,"level":1,"why":"The veto let a tribune block the acts of consuls, other magistrates and even the Senate. It grew out of the tribune's untouchable status.","sec":"tribunes-of-the-plebs"},{"q":"What did it mean that the tribunes of the plebs were 'sacrosanct'?","options":["They were exempt from paying any taxes","Anyone who harmed one could be killed without penalty","They could never be voted out of office","They also served as priests of Jupiter"],"a":1,"level":1,"why":"The plebeians swore an oath that anyone who laid hands on a tribune could be killed without penalty. This oath, not troops, was the source of a tribune's power.","sec":"tribunes-of-the-plebs"},{"q":"What happened to Rome's regular offices around 450 BC, when the lawmaking board was created?","options":["They were opened to plebeians","They were doubled in number","They were moved outside the city","They were all suspended"],"a":3,"level":1,"why":"All regular offices were suspended so that the decemvirs could write down the laws. The board held unchallengeable power for a year.","sec":"demand-for-written-law"},{"q":"What name is given to the long struggle between Rome's patricians and plebeians?","options":["The Conflict of the Orders","The Gracchan Crisis","The Social War","The Servile War"],"a":0,"level":1,"why":"The struggle is known as the Conflict of the Orders. It broke out less than twenty years after the Republic began.","sec":"patricians-and-plebeians"},{"q":"How long did a consul, one of the Republic's chief magistrates, hold office?","options":["Six months","Five years","A single year","For life"],"a":2,"level":1,"why":"The two consuls were elected for a single year. Like the Senate, they came from the patrician families.","sec":"patricians-and-plebeians"},{"q":"Which Roman historian wrote the fullest account of the early Republic's debt crisis?","options":["Livy","Tacitus","Sallust","Suetonius"],"a":0,"level":1,"why":"Livy wrote the fullest account of these years. He tells the story of a ruined former soldier that captured the angry mood of 495 BC.","sec":"debt-crisis"},{"q":"What is the core problem for historians studying the early Conflict of the Orders?","options":["The surviving laws cannot be read","No one wrote about the events at the time","All the records were burned by invaders","The only sources are written in Greek"],"a":1,"level":1,"why":"No one recorded these events at the time. The fullest accounts come from Livy and others writing more than four centuries later.","sec":"how-reliable"},{"q":"Whom did the Senate send to negotiate with the plebeians on the Sacred Mount?","options":["Lucius Brutus","Menenius Agrippa","Appius Claudius","Sicinius"],"a":1,"level":1,"why":"The Senate chose Menenius Agrippa, a former consul trusted by ordinary Romans. Tradition says he won the strikers over with a story rather than threats.","sec":"menenius-agrippa"},{"q":"According to tradition, who killed Verginia to save her from Appius Claudius?","options":["Her betrothed","Her brother","She killed herself","Her father"],"a":3,"level":1,"why":"Her father killed her to uphold her freedom and virtue. He was a respected centurion, and the killing set off riots.","sec":"appius-claudius-and-verginia"},{"q":"In Menenius Agrippa's traditional fable, which part of the body did the limbs grow angry with?","options":["The heart","The belly","The eyes","The head"],"a":1,"level":1,"why":"The limbs resented the belly for enjoying food while they did all the work. When they starved it, they wasted away too.","sec":"menenius-agrippa"},{"q":"According to Livy, what were the Twelve Tables engraved on?","options":["Bronze","Clay","Wood","Marble"],"a":0,"level":1,"why":"Livy says the Tables were engraved on bronze and displayed publicly. That way every citizen could know the law.","sec":"twelve-tables"},{"q":"What did one modern scholar argue about the Conflict of the Orders?","options":["That patricians actually led it","That there was no conflict at all","That it began under the kings","That it lasted only a single year"],"a":1,"level":1,"why":"One scholar argued there was no conflict at all. On this view, later Romans projected their own class struggles onto a dimly remembered past.","sec":"how-reliable"},{"q":"What was the first office in Rome open to commoners?","options":["Censor","Tribune of the plebs","Consul","Praetor"],"a":1,"level":1,"why":"The tribune of the plebs was the great prize won by the first secession. Tradition says the first tribunes took office in 493 BC.","sec":"tribunes-of-the-plebs"},{"q":"What was the moral of Menenius Agrippa's fable of the belly?","options":["Rome's people must always obey the consuls","Rome must conquer new land to feed its people","The poor should work harder if they want to eat","Rome needs patricians and plebeians to work together"],"a":3,"level":1,"why":"Like a body, Rome could only survive if its parts cooperated. The plebeians agreed to negotiate, but wanted more than a fable.","sec":"menenius-agrippa"},{"q":"Where did the plebeians camp during the first secession of 494 BC?","options":["The Janiculum","The Sacred Mount","The Capitoline Hill","The port of Ostia"],"a":1,"level":1,"why":"They camped on the Mons Sacer, the 'Sacred Mount', a hill about 5 km (just over three miles) from the city. There they built simple defences and waited.","sec":"first-secession"},{"q":"In Livy's story, where did the ragged former soldier throw himself to tell his tale?","options":["The Forum","The Senate house","The Circus Maximus","The Capitol temple"],"a":0,"level":1,"why":"The ragged soldier burst into the Forum, Rome's main public square. His story raced through the city.","sec":"debt-crisis"},{"q":"Under the Twelve Tables, when did trials have to end?","options":["At the first vote","At noon","At sunset","After three days"],"a":2,"level":1,"why":"Trials ended at sunset. The Tables were a list of specific rules like this rather than a grand legal code.","sec":"twelve-tables"},{"q":"What was the plebeians' own assembly, created by the settlement of 494 BC, called?","options":["The College of Pontiffs","The Centuriate Assembly","The Plebeian Council","The Areopagus"],"a":2,"level":1,"why":"The Plebeian Council let commoners meet in their own assembly. There they elected their tribunes.","sec":"plebeian-council"},{"q":"What did the second secession of 449 BC force the decemvirs to do?","options":["Cancel all debts","Resign from power","Flee to Etruria","Rewrite the laws"],"a":1,"level":1,"why":"The second secession forced the tyrannical decemvirs to resign. Afterwards the tribunes and the right of appeal were restored.","sec":"appius-claudius-and-verginia"},{"q":"Which law of 471 BC changed how the Plebeian Council voted?","options":["Lex Canuleia","Lex Hortensia","Lex Licinia","Lex Publilia"],"a":3,"level":1,"why":"A tribune pushed through the Lex Publilia in 471 BC. Historians see it as the moment the plebeians became politically independent.","sec":"plebeian-council"},{"q":"Who was the plebeian leader who masterminded the walkout of 494 BC?","options":["Sicinius","Cincinnatus","Menenius Agrippa","Appius Claudius"],"a":0,"level":1,"why":"Sicinius advised the plebeians to leave the city together. Tradition says he was soon added to the first tribunes of the plebs.","sec":"first-secession"},{"q":"In the early Republic, who interpreted Rome's unwritten law?","options":["The pontiffs","The Vestal Virgins","The plebeian elders","The tribunes"],"a":0,"level":1,"why":"Only the pontiffs, upper-class priests, interpreted the law. A plebeian in a dispute with a patrician was fighting by rules only the other side knew.","sec":"demand-for-written-law"},{"q":"In Livy's story, which enemy was the soldier fighting when raiders burned his farm?","options":["The Sabines","The Gauls","The Samnites","The Etruscans"],"a":0,"level":1,"why":"He was away fighting the Sabines, a hill people north-east of Rome. While he was gone, raiders burned his farm and stole his property.","sec":"debt-crisis"},{"q":"According to tradition, in what year did the Romans drive out their last king and found a republic?","options":["451 BC","494 BC","753 BC","509 BC"],"a":3,"level":1,"why":"Tradition dates the expulsion of Rome's last king and the founding of the Republic to 509 BC. Power then passed to two consuls and the Senate.","sec":"patricians-and-plebeians"},{"q":"For roughly how long did the Twelve Tables form the basis of Roman law?","options":["A thousand years","About a century","Two centuries","Five hundred years"],"a":0,"level":1,"why":"The Twelve Tables underpinned Roman law for a thousand years. Later Romans revered them.","sec":"twelve-tables"},{"q":"What does the Latin word veto mean?","options":["I forbid","I agree","I appeal","I command"],"a":0,"level":1,"why":"A tribune who said veto blocked an act of a magistrate or even the Senate.","sec":"tribunes-of-the-plebs"},{"q":"What was a secessio plebis?","options":["A mass withdrawal of the plebs from Rome","A meeting of the Senate","A new written law","A tax for the army"],"a":0,"level":1,"why":"The plebs left the city together, like a general strike, until their demands were met.","sec":"first-secession"},{"q":"Plebeians filled the ranks of the exercitus. What was it?","options":["The army","The Senate","The Plebeian Council","The priesthood"],"a":0,"level":1,"why":"Plebeian soldiers were most of the army, which is why their refusal to fight was so powerful.","sec":"patricians-and-plebeians"}],"2":[{"q":"What was nexum?","options":["Debt bondage","A plebeian assembly","A marriage between patricians and plebeians","A tribune’s oath"],"a":0,"level":2,"why":"A debtor who could not pay could be enslaved: the Romans called this nexum.","sec":"patricians-and-plebeians"},{"q":"Plebiscites take their name from the Latin plebiscita. What did it mean?","options":["Decisions of the plebs","Votes of the Senate","Laws of the kings","Rights of the soldiers"],"a":0,"level":2,"why":"Plebiscites were the resolutions of the Plebeian Council; at first they bound only plebeians.","sec":"plebeian-council"},{"q":"The second board of decemvirs ruled with no provocatio. What was it?","options":["The right of appeal","The right to marry","The right to vote by tribe","The right to own land"],"a":0,"level":2,"why":"Without the right of appeal, citizens had no protection against the decemvirs.","sec":"appius-claudius-and-verginia"},{"q":"In Livy's story, why did the ruined former soldier first borrow money?","options":["To pay a tax","To pay his daughter's dowry","To buy new weapons","To buy seed for planting","To pay a ransom to raiders"],"a":0,"level":2,"why":"He borrowed to pay a tax, and crushing interest swallowed his grandfather's farm and then his father's. Finally his creditors imprisoned and whipped him.","sec":"debt-crisis"},{"q":"What was the plebeians' main price for returning to Rome after the first secession?","options":["A complete written code of Roman law","A share of the land conquered from the Sabines","Permanent seats for plebeians in the Senate","A new official chosen from the plebs to protect them","The right to elect one of the two consuls"],"a":3,"level":2,"why":"The plebs demanded an official chosen from among themselves to shield them from the consuls. The Senate agreed, creating the tribune of the plebs.","sec":"menenius-agrippa"},{"q":"Which Twelve Tables rule worked against the plebeians?","options":["A ban on plebeians speaking in court","A ban on plebeians entering temples","A ban on plebeians serving in the army","A ban on plebeians owning farmland","A ban on marriage between patricians and plebeians"],"a":4,"level":2,"why":"One law banned marriage between patricians and plebeians. The Tables' debt rules were also harsh, though at least clear.","sec":"twelve-tables"},{"q":"What puzzle in the official lists of consuls troubles historians?","options":["They show no consuls at all before 400 BC","They name several consuls known to be Greek","They include plebeian family names in the fifth century BC","They leave out every year of the decemvirs","Some years list three consuls instead of two"],"a":2,"level":2,"why":"Men with plebeian family names appear as consuls in the fifth century BC. Yet the post was supposedly closed to plebeians then.","sec":"how-reliable"},{"q":"Under the Twelve Tables, who owned fruit that fell from a tree onto a neighbour's land?","options":["The Roman state","Whoever picked it up first","Both owners shared it equally","The neighbour","The owner of the tree"],"a":4,"level":2,"why":"Fallen fruit still belonged to the tree's owner. Such specific everyday rules are typical of the Twelve Tables.","sec":"twelve-tables"},{"q":"What did the Lex Publilia of 471 BC change?","options":["Debt slavery would be abolished","Plebeians would vote by tribe rather than by curia","One consul each year had to be a plebeian","Plebiscites would now bind all Romans","Tribunes would become members of the Senate"],"a":1,"level":2,"why":"Plebeians would now vote by tribe, districts of citizens, and elect tribunes this way. This freed them from the influence of patrician patrons.","sec":"plebeian-council"},{"q":"How far did a tribune's protection extend?","options":["Within Rome and about 1.5 km (a mile) beyond","Throughout the whole of Italy","Only inside the Forum itself","Wherever the Roman army marched","Within 15 km (ten miles) of the city"],"a":0,"level":2,"why":"A tribune's protection held only within Rome and about 1.5 km (a mile) beyond. He also had to be physically present to intervene.","sec":"tribunes-of-the-plebs"},{"q":"Why did the Senate raise the number of tribunes to ten in 457 BC?","options":["To defuse the campaign for written law","To replace the consuls during a plague","To reward the plebs for a victory in war","To give one tribune to each new tribe","To welcome envoys returning from Greece"],"a":0,"level":2,"why":"The Senate hoped extra tribunes would calm the push for written law. It had already stalled for five years, citing war and plague.","sec":"demand-for-written-law"},{"q":"What did the second board of decemvirs do when their term ended?","options":["Refused to step down and ruled without tribunes","Asked the plebs to extend their term","Published the final laws and retired","Fled Rome to escape prosecution","Handed power to two newly elected consuls"],"a":0,"level":2,"why":"The decemvirs clung to power, with no tribunes to check them and no right of appeal. They even had a former tribune who criticised them killed.","sec":"appius-claudius-and-verginia"},{"q":"Why did organising the early Plebeian Council by curiae help the patricians?","options":["Votes were counted by patrician priests","Only landowners were allowed to join a curia","Curiae could meet only when the consuls allowed","Patricians held half the seats in every curia","Many plebeians voted as their patrician patrons wished"],"a":4,"level":2,"why":"In the curiae, many plebeians depended on patrician patrons and voted as instructed. This let aristocrats quietly steer who became tribune.","sec":"plebeian-council"},{"q":"During the second secession, where did the people gather before withdrawing to the Sacred Mount?","options":["The Janiculum","The Palatine","The Capitoline","The Quirinal","The Aventine"],"a":4,"level":2,"why":"The people first gathered on the Aventine hill, then withdrew to the Sacred Mount. The anger had spread from the crowd to the army camped outside the city.","sec":"appius-claudius-and-verginia"},{"q":"Why was a secession such a powerful weapon for the plebeians?","options":["They could call on foreign allies for help","They were most Romans and produced most food and goods","They controlled the city's temples and treasury","They held most of the seats in the Senate","They owned all of the city's grain warehouses"],"a":1,"level":2,"why":"The plebs were the vast majority and produced most of Rome's food and goods. When they left, trade stopped and the city faced its enemies with no army.","sec":"first-secession"},{"q":"In 462 BC, what did a tribune claim about the consuls?","options":["They had stolen from the city's treasury","They were plotting to bring back the kings","They had betrayed Rome to the Volsci","They were too weak to defend the city","They had become more oppressive than the kings"],"a":4,"level":2,"why":"The tribune said the consuls were worse than the kings they had replaced. He proposed a commission to define and limit their powers.","sec":"demand-for-written-law"},{"q":"Tribunes commanded no troops. How could a tribune protect a citizen from a magistrate?","options":["By placing his own untouchable person in the way","By bribing the magistrate's guards","By calling out a plebeian militia","By appealing to the gods in a temple","By paying the citizen's fine himself"],"a":0,"level":2,"why":"Because tribunes were sacrosanct, a tribune could physically stand between a citizen and a magistrate. From this grew the power of veto.","sec":"tribunes-of-the-plebs"},{"q":"How did one hard-line consul respond to the public outcry over debt in 495 BC?","options":["He reinforced creditors' right to imprison debtors","He created the office of tribune of the plebs","He exiled the city's leading moneylenders","He cancelled all debts owed to patricians","He gave public land to ruined veterans"],"a":0,"level":2,"why":"Instead of relief, the consul strengthened creditors' power to imprison debtors. The next year the plebeian soldiers refused to march.","sec":"debt-crisis"},{"q":"In the early Republic, who alone could stand for office?","options":["Wealthy plebeian traders","Any citizen-soldier","Only the pontiffs","Former army officers","The patricians"],"a":4,"level":2,"why":"Only the patricians, a small circle of aristocratic families, could stand for office. Both the consuls and the Senate came from their ranks.","sec":"patricians-and-plebeians"},{"q":"Why do historians find the lack of bloodshed in the early conflict odd?","options":["Ancient sources describe constant street battles","The patricians had hired foreign mercenaries","The plebeians controlled all of the army's weapons","Roman law demanded death for any rebellion","Similar quarrels in the late Republic quickly turned violent"],"a":4,"level":2,"why":"Such bitter grievances produced surprisingly little violence, unlike the late Republic's quarrels. This is one of several puzzles that make the traditional story controversial.","sec":"how-reliable"},{"q":"Why did the Senate choose Menenius Agrippa as its negotiator in 494 BC?","options":["He commanded the army facing the Volsci","He had written down Rome's first laws","He was a former consul well liked by ordinary Romans","He was the chief priest of Rome","He had led the plebeian walkout himself"],"a":2,"level":2,"why":"The Senate needed someone the strikers would trust, so it chose a popular former consul. Tradition says he persuaded them with the fable of the belly.","sec":"menenius-agrippa"},{"q":"Why was military service a trap for plebeian soldiers in the early Republic?","options":["They had to pay for their own warships","They lost their vote while they were enlisted","Their farms lay abandoned while they were on campaign","They were sent abroad for decades at a time","They were paid only in conquered land"],"a":2,"level":2,"why":"While soldiers were away, their farms went untended. Many had to borrow from patricians, and defaulting debtors could be beaten, imprisoned or even enslaved.","sec":"patricians-and-plebeians"}],"3":[{"q":"What do ancient sources say about the number of tribunes of the plebs before 457 BC?","options":["There were first ten, later cut to two","There were first four, two per consul","There were first three, one per tribe","There were first two or five; sources differ","There was always exactly one","There were first twelve, one per table"],"a":3,"level":3,"why":"Ancient sources disagree, giving either two or five original tribunes. The number rose to ten in 457 BC.","sec":"tribunes-of-the-plebs"},{"q":"Until what year did the Conflict of the Orders last?","options":["449 BC","264 BC","287 BC","312 BC","367 BC","133 BC"],"a":2,"level":3,"why":"The struggle lasted until 287 BC. It began less than twenty years after the Republic's traditional founding in 509 BC.","sec":"patricians-and-plebeians"},{"q":"Besides creating a new protective official, what further concession did the Senate make to end the first secession?","options":["The laws were published on bronze tablets","Some plebeians were freed from their debts","One consulship was reserved for plebeians","Plebeians could marry into patrician families","Conquered Sabine land was shared out","Debt slavery was abolished for good"],"a":1,"level":3,"why":"As well as agreeing to the new official, the Senate freed some plebeians from their debts. The intermarriage ban, by contrast, was later written into the Twelve Tables.","sec":"menenius-agrippa"},{"q":"Roughly how long after the debt crisis of 495 BC did Livy write his account of it?","options":["About three centuries later","Within a single generation","About two centuries later","About a century later","Nearly five centuries later","Almost eight centuries later"],"a":4,"level":3,"why":"Livy wrote nearly five centuries after these events. That gap is a major reason modern historians question the traditional story.","sec":"debt-crisis"},{"q":"Even after the Lex Publilia, how did patricians try to tame the tribunes?","options":["By making tribunes swear loyalty to the consuls","By having tribunes exiled for sacrilege","By bribing plebeian voters at every election","By persuading one tribune to block his colleagues","By forbidding the Plebeian Council to meet","By cutting the number of tribunes to two"],"a":3,"level":3,"why":"Patricians tried to turn tribunes against each other, getting one to block his colleagues. Still, the plebs now had a voice and used it to demand written law.","sec":"plebeian-council"},{"q":"What surprising point do historians raise about who the plebeians really were?","options":["Many were wealthy landowners","Most were freed slaves from Greece","Many were foreigners without citizenship","Most were members of the priesthood","Most were recent Sabine immigrants","Many were patricians who had lost status"],"a":0,"level":3,"why":"Many plebeians were wealthy landowners, which complicates the picture of poor commoners against rich aristocrats. It is one of several puzzles about the traditional story.","sec":"how-reliable"},{"q":"According to one modern count, how many secessions did the plebeians stage between 494 and 287 BC?","options":["Two","Nine","Twelve","Five","Seven","Three"],"a":3,"level":3,"why":"One modern count gives five secessions in this period. The first, in 494 BC, set the pattern, and it worked.","sec":"first-secession"},{"q":"Romans called debt aes alienum. What does it mean, word for word?","options":["Someone else’s bronze","A heavy burden","The lender’s chain","Borrowed grain"],"a":0,"level":3,"why":"Bronze was Rome’s early money, so a debt was literally bronze that belonged to someone else.","sec":"debt-crisis"},{"q":"In the Twelve Tables, what was the patria potestas?","options":["A father’s power over his son","The power of the consuls","A patrician’s right to land","The protection of the tribunes"],"a":0,"level":3,"why":"The Tables limited it: a father who sold his son three times lost his power over him.","sec":"twelve-tables"}]},"chronicleMaps":[{"id":"war-494","sec":"first-secession","title":"Rome at war, 494 BC","caption":"That year Rome faced three enemies at once: the Sabines to the north-east and the Aequi and Volsci in the hills to the east and south-east. Without the plebeian soldiers, it had no army to meet them.","bounds":{"latMin":41.42,"latMax":42.32,"lonMin":12.15,"lonMax":13.45},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"r","dy":-4}],"peoples":[{"name":"Sabines","latin":"Sabini","lat":42.17,"lon":12.86},{"name":"Aequi","lat":41.98,"lon":13.2},{"name":"Volsci","lat":41.6,"lon":13.12},{"name":"Latins","latin":"Latini","lat":41.68,"lon":12.62}]},{"id":"sacred-mount","sec":"menenius-agrippa","title":"From the Forum to the Sacred Mount","caption":"The plebs walked out of the city to the Sacred Mount (Mons Sacer), a low hill by the Anio river about 5 km (three miles) from the Forum. In 449 BC they gathered first on the Aventine. The rivers are simplified.","bounds":{"latMin":41.877,"latMax":41.953,"lonMin":12.458,"lonMax":12.558},"hills":[{"name":"Sacred Mount","latin":"Mons Sacer","lat":41.9425,"lon":12.5336,"r":0.0022,"side":"l"},{"name":"Aventine","latin":"Mons Aventinus","lat":41.8834,"lon":12.4805,"r":0.0024,"side":"r"}],"places":[{"name":"Forum","latin":"Forum Romanum","lat":41.8925,"lon":12.4857,"kind":"area","side":"r","dy":0}],"rivers":[{"name":"Tiber","pts":[[41.953,12.489],[41.945,12.496],[41.937,12.497],[41.93,12.489],[41.924,12.478],[41.918,12.4715],[41.912,12.4745],[41.906,12.4715],[41.9035,12.4672],[41.9,12.4668],[41.897,12.4695],[41.8945,12.4735],[41.892,12.4765],[41.8906,12.4778],[41.8885,12.4779],[41.886,12.4768],[41.883,12.475],[41.877,12.4726]]},{"name":"Anio","small":true,"pts":[[41.946,12.558],[41.944,12.546],[41.9455,12.536],[41.9435,12.524],[41.94,12.512],[41.937,12.497]]}],"riverWidth":5}],"keyFacts":{"description":"Key facts for this chapter, written by hand from the chapter text. Every entry links to the section that explains it.","people":[{"name":"Sicinius","text":"The plebeian leader who masterminded the first walkout; later one of the first tribunes.","sec":"first-secession"},{"name":"Menenius Agrippa","text":"Former consul who won the strikers back with the fable of the belly.","sec":"menenius-agrippa"},{"name":"Appius Claudius","text":"The most notorious of the decemvirs, whose tyranny led to the second secession.","sec":"appius-claudius-and-verginia"},{"name":"Verginia","text":"Plebeian girl killed by her own father to save her from Appius Claudius.","sec":"appius-claudius-and-verginia"},{"name":"Livy","text":"The Roman historian who wrote the fullest account of these years, about five centuries later.","sec":"debt-crisis"}],"dates":[{"when":"509 BC","text":"The last king is driven out; two consuls rule the new Republic.","sec":"patricians-and-plebeians"},{"when":"495 BC","text":"The debt crisis: a ragged ex-soldier stirs up the Forum.","sec":"debt-crisis"},{"when":"494 BC","text":"The first secession to the Sacred Mount.","sec":"first-secession"},{"when":"493 BC","text":"The first tribunes of the plebs take office.","sec":"tribunes-of-the-plebs"},{"when":"471 BC","text":"The *Lex Publilia*: the plebs vote by tribe.","sec":"plebeian-council"},{"when":"457 BC","text":"The number of tribunes rises to ten.","sec":"demand-for-written-law"},{"when":"c. 450 BC","text":"The decemvirs are appointed to write down the laws.","sec":"demand-for-written-law"},{"when":"449 BC","text":"The Twelve Tables are published; the second secession ends the decemvirs’ rule.","sec":"twelve-tables"},{"when":"287 BC","text":"The Conflict of the Orders ends.","sec":"patricians-and-plebeians"}],"terms":[{"latin":"res publica","english":"“the public thing”: the Republic","sec":"patricians-and-plebeians"},{"latin":"consules","english":"the two consuls, elected each year","sec":"patricians-and-plebeians"},{"latin":"patricii","english":"patricians, the aristocratic families who held power","sec":"patricians-and-plebeians"},{"latin":"plebs","english":"the common people, most citizens and most soldiers","sec":"patricians-and-plebeians"},{"latin":"ordo, ordines","english":"a rank of society, hence “Conflict of the Orders”","sec":"patricians-and-plebeians"},{"latin":"nexum","english":"debt bondage","sec":"patricians-and-plebeians"},{"latin":"aes alienum","english":"debt: literally “someone else’s bronze”","sec":"debt-crisis"},{"latin":"secessio plebis","english":"“the withdrawal of the plebs”, a mass walkout","sec":"first-secession"},{"latin":"Mons Sacer","english":"the Sacred Mount, where the plebs camped","sec":"first-secession"},{"latin":"tribunus plebis","english":"tribune of the plebs, the commoners’ protector","sec":"tribunes-of-the-plebs"},{"latin":"veto","english":"“I forbid”: a tribune’s power to block","sec":"tribunes-of-the-plebs"},{"latin":"appello tribunos","english":"“I call upon the tribunes!”","sec":"tribunes-of-the-plebs"},{"latin":"concilium plebis","english":"the Plebeian Council","sec":"plebeian-council"},{"latin":"plebiscita","english":"“decisions of the plebs”: plebiscites","sec":"plebeian-council"},{"latin":"clientes, patroni","english":"clients and their patrons","sec":"plebeian-council"},{"latin":"pontifices","english":"the priests who interpreted the unwritten law","sec":"demand-for-written-law"},{"latin":"decemviri","english":"“ten men” who wrote down the laws","sec":"demand-for-written-law"},{"latin":"patria potestas","english":"“power of the father”","sec":"twelve-tables"},{"latin":"conubium","english":"the right to marry","sec":"twelve-tables"},{"latin":"provocatio","english":"the right of appeal","sec":"appius-claudius-and-verginia"}]}},{"id":"conflict-of-orders-resolution","era":"early-republic","short":"Toward Equality","title":"The Conflict of the Orders: Toward Resolution","period":"450-367 BC","sources":["Licinio-Sextian rogations","Battle of Veii","Battle of the Allia"],"briefing":{"title":"Rome, around 390 BC","paragraphs":["Rome is a small but ambitious city on the river Tiber, just 16 km from its great Etruscan rival, Veii. At home, a small hereditary aristocracy, the patricians, controls the top offices and the Senate. The plebeian majority, many of them small farmers, are buried in debt and short of land.","Within a few decades Rome will conquer Veii and be humiliated by Gallic warriors who sack the city. Then comes a bitter ten-year political fight at home. At stake: who may rule Rome, and whether ordinary citizens will finally get relief."]},"sections":[{"id":"conflict-of-the-orders","title":"Patricians, Plebeians and a Puzzling Office","body":"In the early Roman Republic, the city was divided in two. On one side stood the patricians (*patricii*), a small hereditary aristocracy who owned large estates, lent money and believed that ruling was their birthright. On the other stood the plebeians (*plebeii*, together the *plebs*), the great majority of ordinary Romans.\n\nTheir rivalry lasted some two hundred years and is known as the Conflict of the Orders (*ordines*, the ranks of society). It shaped Roman politics throughout the Republic's first two centuries. The patricians held power by monopolising the consulship (*consulatus*), the two top offices of state filled each year. They also held the seats of the Senate (*senatus*), Rome's powerful council of elders. Many plebeians, especially small farmers, were buried in debt and short of land.\n\nFrom 444 BC, Rome often replaced its two consuls with a stranger arrangement. In those years it was run by between three and six “military tribunes with consular power” (*tribuni militum consulari potestate*), usually called consular tribunes. The Roman historian Livy (*Titus Livius*), writing centuries later, said this office was created as a concession because it was open to plebeians.\n\nThe record tells a different story. Between 444 and 401 BC, only two of about a hundred consular tribunes were plebeians. Around 400 BC this changed, and in some years plebeians made up the majority. Consular tribunes governed Rome in many years up to 376 BC."},{"id":"siege-of-veii","title":"The Fall of Veii","body":"Veii was a large Etruscan city just 16 km (10 miles) from Rome. The Etruscans were a wealthy people whose cities lay in what is now Tuscany. For years Rome and Veii fought a long, seesawing war, with victories and defeats on both sides.\n\nAround 396 BC, after a string of Roman setbacks, the Romans chose Marcus Furius Camillus as dictator. In the Republic, a dictator was an emergency commander given sweeping powers for six months, not a tyrant. When Camillus took over, Rome was already besieging Veii, and the defenders had destroyed much of the Roman siege equipment.\n\nSo the Romans went underground. They dug a tunnel (*cuniculus*) through the soft volcanic rock on which Veii stood. According to Livy, Camillus vowed a tenth of the spoils (*praeda*) to the god Apollo. He also invited Juno (*Iuno Regina*, \"Queen Juno\"), Veii's protecting goddess, to move to Rome and receive a worthy temple there.\n\nCamillus then threw his larger army at the walls from every side. The astonished defenders rushed to man them. Meanwhile, picked Roman troops climbed out of the tunnel inside Juno's own temple and overwhelmed the city.\n\nThe survivors were enslaved and Romans resettled the site. The destruction of Veii secured Rome's growing place in central Italy."},{"id":"battle-of-the-allia","title":"Disaster at the Allia","body":"The Senones were a tribe of Gauls (*Galli*), one of several Celtic peoples who had recently pushed into northern Italy. They settled on the Adriatic coast around modern Rimini.\n\nAccording to Livy, a man named Aruns brought the Senones to Clusium, an Etruscan town now called Chiusi. He wanted revenge on a local nobleman whose son had seduced his wife. Alarmed, Clusium appealed to Rome. Rome sent three brothers of the powerful Fabius family as ambassadors. When fighting broke out, the brothers joined in and one killed a Gallic chieftain. This broke the rule that envoys must stay neutral. The Gauls demanded the brothers be handed over. Instead, the Romans elected them consular tribunes for the next year. Enraged, the Gauls marched on Rome.\n\nThe armies met where the Allia brook joins the river Tiber, about 16 km north of the city. Livy says the Romans pitched no camp and failed to consult the gods. They also stretched their line dangerously thin. Brennus, the Gallic chief, attacked the Roman reserves on a hill, and panic spread. Many Romans drowned in the Tiber. Most survivors fled to Veii, while others ran back to Rome.\n\nTradition dates the battle to 390 BC, but modern historians prefer around 387 BC. Its anniversary, 18 July, became an ill-omened day (*dies Alliensis*, \"the day of the Allia\")."},{"id":"sack-of-rome","title":"The Gauls in Rome","body":"According to Livy, the Gauls found Rome's gates open and its walls unguarded. The fighting men and able-bodied senators had withdrawn to the Capitoline (*Capitolium*), Rome's fortified citadel (*arx*) hill. The Vestal Virgins (*Virgines Vestales*), priestesses who guarded the sacred hearth of the city, carried off the sacred objects. A passing citizen, Lucius Albinus, gave them a lift on his wagon to Caere, an allied Etruscan city on the coast.\n\nThe old men who had held high office stayed behind. They sat outside their houses on ivory chairs (*sellae curules*), dressed in their ceremonial robes. The Gauls stared at them as if they were statues. Then one Gaul stroked the long beard of Marcus Papirius, who struck him with his ivory staff (*scipio eburneus*). The massacre began, and houses were plundered and burned.\n\nOne night the Gauls scaled the Capitoline cliff. The guards and dogs slept, but the sacred geese (*anseres*) of Juno honked. Their noise roused Marcus Manlius, a former consul, who hurled the first attacker down the slope.\n\nFamine and disease finally forced a deal: a ransom of about 330 kg (a thousand pounds) of gold. When the Romans complained that the Gauls were using rigged weights, Brennus threw his sword onto the scales and declared, “Woe to the vanquished!” (*Vae victis!*) In Livy's telling, Camillus arrived just in time, cancelled the deal and routed the Gauls."},{"id":"sack-reliability","title":"Did Camillus Really Save Rome?","body":"All accounts of the Allia and the sack of Rome were written centuries after the events, so their reliability is doubtful. The biggest suspect is the heroic rescue by Camillus, the conqueror of Veii. According to Livy, Camillus was in exile at Ardea, a town south of Rome, and was recalled as dictator. But the Greek historians Polybius and Diodorus Siculus never mention him. Many modern historians see his role as a later addition.\n\nOther ancient writers told different stories. Diodorus says an Etruscan army defeated the Gauls as they returned from southern Italy. The geographer Strabo claims that Caere, Rome's Etruscan ally, beat them and recovered the ransom gold. The Greek philosopher Aristotle reportedly said Rome's saviour was “a certain Lucius”. That might be Lucius Albinus, the man who carried the priestesses to Caere.\n\nThe historian T. J. Cornell doubts the romantic tale of Aruns's revenge. No account mentions Gallic wives or children, so the Senones looked like a warrior band, not migrants seeking land. He thinks they were mercenaries. A few months later, Dionysius I, the ruler of Syracuse in Sicily, hired Gauls for a war in southern Italy.\n\nArchaeology finds no layer of destruction from this date. Scorch marks once linked to the sack have been redated to the fall of the monarchy over a century earlier."},{"id":"rome-after-the-sack","title":"Recovery and a Lasting Fear","body":"Livy wrote that Rome was burned and then rebuilt in a hurry, leaving it with tangled streets. Cornell thinks the Gauls mainly wanted loot. In his view they left most buildings standing and went home once they were paid. Haphazard street plans, he notes, were common in ancient cities anyway.\n\nRome bounced back quickly. It bound newly conquered Veii closer by giving its people citizenship without the right to vote (*civitas sine suffragio*). It also strengthened its alliance with Caere. A few years after the sack, Rome began a huge new city wall, 11 km long. The old wall had used crumbly local stone. The new one was built of a better yellow stone quarried in Veii's territory.\n\nThe memory of the Gauls cast a long shadow. Gallic raiders struck the surrounding region in 350 and 349 BC. Even after Rome crushed the Senones in 295 BC, fear persisted. In 228, 216 and 114 BC, Romans buried alive a pair of Gauls and a pair of Greeks, although human sacrifice was not a Roman custom.\n\nLater writers treated the anniversary of the Allia as a day of ritual prohibition (*dies religiosus*), when public business stopped. Some scholars caution, however, that this custom is attested only from the 1st century BC and may be a later invention."},{"id":"licinius-and-sextius","title":"Ten Years of Struggle","body":"In 375 BC, two tribunes of the plebs (*tribuni plebis*), Gaius Licinius Stolo and Lucius Sextius Lateranus, launched a campaign that would last a decade. Tribunes were officials elected by the plebeians to protect them, and they could block official business with a veto (\"I forbid\").\n\nThe pair put three bills (*rogationes*) to the Plebeian Council (*concilium plebis*), the assembly of the plebeians. One eased debt and one limited land holdings. The third abolished the consular tribunes, restored the consuls and required one consul to be a plebeian.\n\nThe patricians were furious about the last bill. They persuaded other tribunes to veto it. Licinius and Sextius struck back by blocking the election of consular tribunes for five years. They gave way only in 370 BC, when Velitrae, a town of the Volscians, a people south-east of Rome, attacked Roman territory.\n\nThe pair were re-elected year after year. In 368 BC the Senate named Camillus dictator, and he threatened violence before resigning for unclear reasons. The plebeians passed the land and debt bills but rejected the consulship bill. The tribunes insisted on all or nothing.\n\nA second dictator, Publius Manlius Capitolinus, angered patricians by picking a plebeian deputy, a \"master of the horse\" (*magister equitum*). Licinius and Sextius won a tenth term, and their whole package went through. In 367 BC, battered by years of strife, the Senate accepted it."},{"id":"licinian-laws","title":"Debt, Land and Sacred Books","body":"The laws of Licinius and Sextius tackled the plebeians' most painful problems. Debt weighed heavily on small farmers, whose creditors were usually wealthy patricians. Under the new debt law, interest (*faenus*) already paid was subtracted from the sum owed. The rest could be paid off in three equal yearly instalments.\n\nThe land law targeted public land (*ager publicus*) owned by the Roman state. Ordinary citizens received small plots of about half a hectare (one and a quarter acres), barely enough to feed a family. Rich landowners, meanwhile, grabbed huge swathes of public land for themselves. The law limited any individual to about 120 hectares (300 acres) of it. It also banned grazing more than 100 cattle there, to protect the common pasture poor farmers relied on. Such laws were easy to dodge. Licinius himself was later fined for breaking his own limit.\n\nA fourth law concerned the Sibylline Books (*Libri Sibyllini*), a collection of prophecies. According to tradition, Tarquinius Superbus, Rome's seventh and last king, bought them from a prophetess, the Sibyl (*Sibylla*), at Cumae, a Greek city near Naples. Two patrician priests guarded the books and consulted them in times of plague, famine or war. The new law replaced them with ten priests (*decemviri sacris faciundis*, \"ten men for performing the sacred rites\"), five of them plebeians. For the first time, the patricians' monopoly on priesthoods was broken."},{"id":"first-plebeian-consul","title":"The First Plebeian Consul","body":"The most famous of the laws of Licinius and Sextius ended government by consular tribunes. It brought back the two consuls each year and required one of them to be a plebeian.\n\nIn 366 BC Lucius Sextius Lateranus, one of the two tribunes who had led the long campaign, became Rome's first plebeian consul. The patricians refused to confirm his election, and riots broke out. The plebeians came close to seceding (*secessio*), that is, staging a mass walkout from the city, as they had done before.\n\nAccording to Livy, the aged Camillus brokered a compromise. The nobles accepted a plebeian consul. In return, the plebeians agreed that a new official, the praetor, would be a patrician. The praetor served as Rome's chief judge, presiding over criminal trials. He could also command an army. Livy concluded that the two orders (*ordines*) were “at length brought into harmony”.\n\nThe new arrangement did not end every barrier. Plebeians had to wait thirty years, until 337 BC, before one of them was elected praetor. Other priesthoods opened to plebeians over time, although patricians kept some of the oldest for themselves."},{"id":"modern-verdict","title":"What Historians Make of It","body":"The historian T. J. Cornell believes very little of Livy's dramatic story can be trusted. However, he considers the actual changes in government reasonably certain.\n\nHe also finds the consulship law puzzling. Plebeians had already served as consular tribunes, so why was a plebeian consul such a landmark? And the law did not guarantee sharing. From 355 to 343 BC, both consuls were patricians. Regular sharing began only after the law of Lucius Genucius, a tribune, in 342 BC. That law apparently required one consul to be a plebeian. Two plebeians did not hold the consulship together until 173 BC. Seen this way, the 367 BC law may have been a mere administrative adjustment.\n\nCornell sees its real importance elsewhere. Earlier plebeian officeholders, he argues, were dependants of patrician patrons with no ties to the plebeian movement. Licinius and Sextius opened top office to the movement's own leaders. These were wealthy, ambitious men who used the cause of the poor to enter the ruling class.\n\nOnce inside, they formed a new aristocracy, the nobility (*nobilitas*), with the patricians and turned their backs on the poor. Ordinary plebeians gained temporary relief but lost control of their organisation. The tribunate became a stepping stone for young nobles, and Livy called some tribunes “slaves of the nobility” (*mancipia nobilium*)."}],"battle":{"name":"The Fall of Veii","year":"c. 396 BC","enemy":"Veii","sec":"siege-of-veii","intro":"Veii, a great Etruscan city just 16 km from Rome, has held out for years. Camillus, named dictator, has a plan: a tunnel through the soft rock beneath the walls."},"timelines":[{"name":"The Big Turning Points","blurb":"Four milestones from Rome's struggles at home and abroad.","events":[{"label":"Consular tribunes replace the consuls","when":"444 BC","y":-444,"fact":"From 444 BC Rome was often run by three to six 'military tribunes with consular power' instead of two consuls.","sec":"conflict-of-the-orders"},{"label":"Camillus captures Veii","when":"Around 396 BC","y":-396,"fact":"Roman troops climbed out of a tunnel inside Juno's temple while Veii's defenders rushed to the walls.","sec":"siege-of-veii"},{"label":"Senate accepts the tribunes' reforms","when":"367 BC","y":-367,"fact":"After ten years of strife, the Senate accepted the whole package of laws pushed by Licinius and Sextius.","sec":"licinius-and-sextius"},{"label":"Rome crushes the Senones","when":"295 BC","y":-295,"fact":"Even after Rome crushed this Gallic tribe, Roman fear of the Gauls persisted for centuries.","sec":"rome-after-the-sack"}]},{"name":"From Gauls to Plebeian Consuls","blurb":"Six steps from a military disaster to shared high office.","events":[{"label":"Plebeians dominate consular tribunes","when":"Around 400 BC","y":-400,"fact":"After only two plebeians among about a hundred consular tribunes, plebeians made up the majority in some years from around 400 BC.","sec":"conflict-of-the-orders"},{"label":"Romans routed at the Allia","when":"390 BC by tradition (c. 387 BC)","y":-390,"fact":"Brennus attacked the Roman reserves on a hill, panic spread, and many Romans drowned in the Tiber.","sec":"battle-of-the-allia"},{"label":"Two tribunes launch a ten-year campaign","when":"375 BC","y":-375,"fact":"Gaius Licinius Stolo and Lucius Sextius Lateranus put bills on debt, land and the consulship to the Plebeian Council.","sec":"licinius-and-sextius"},{"label":"Sextius becomes first plebeian consul","when":"366 BC","y":-366,"fact":"Patricians refused to confirm Sextius's election, riots broke out, and the plebeians came close to a mass walkout.","sec":"first-plebeian-consul"},{"label":"Law of Genucius shares the consulship","when":"342 BC","y":-342,"fact":"The law of the tribune Lucius Genucius apparently required one consul to be a plebeian, and regular sharing began.","sec":"modern-verdict"},{"label":"First plebeian praetor elected","when":"337 BC","y":-337,"fact":"Plebeians had to wait thirty years after the 366 BC compromise before one of them became praetor, Rome's chief judge.","sec":"first-plebeian-consul"}]},{"name":"A Century of Fear and Reform","blurb":"Eight events, from Veii's fall to long-delayed equality.","events":[{"label":"Romans tunnel into Veii","when":"Around 396 BC","y":-396,"fact":"The Romans dug through the soft volcanic rock beneath Veii after the defenders wrecked their siege equipment.","sec":"siege-of-veii"},{"label":"Gauls sack Rome","when":"390 BC by tradition (c. 387 BC)","y":-390,"fact":"According to Livy, the Gauls found the gates open, massacred the old ex-officials and plundered and burned houses.","sec":"sack-of-rome"},{"label":"Tribunes yield after Velitrae attacks","when":"370 BC","y":-370,"fact":"Licinius and Sextius ended their five-year block on elections when Velitrae, a Volscian town, attacked Roman land.","sec":"licinius-and-sextius"},{"label":"Senate names Camillus dictator again","when":"368 BC","y":-368,"fact":"Camillus threatened violence against the reformers, then resigned for unclear reasons.","sec":"licinius-and-sextius"},{"label":"Run of all-patrician consuls begins","when":"355 BC","y":-355,"fact":"From 355 to 343 BC both consuls were patricians, showing the 367 BC law did not guarantee sharing.","sec":"modern-verdict"},{"label":"Gallic raiders strike near Rome","when":"350 BC","y":-350,"fact":"Gallic raiders struck the region around Rome in 350 and again in 349 BC.","sec":"rome-after-the-sack"},{"label":"Gauls and Greeks buried alive","when":"228 BC","y":-228,"fact":"In 228, 216 and 114 BC Romans buried alive a pair of Gauls and a pair of Greeks, though human sacrifice was not a Roman custom.","sec":"rome-after-the-sack"},{"label":"Two plebeians share the consulship","when":"173 BC","y":-173,"fact":"Only in 173 BC did two plebeians hold the consulship together for the first time.","sec":"modern-verdict"}]}],"matches":[{"name":"Heroes and Villains of the Sack","blurb":"Match each figure to their moment in the Gallic crisis.","pairs":[["Marcus Furius Camillus","Dictator who took Veii by tunnel"],["Brennus","Gallic chief who threw his sword on the scales"],["Marcus Manlius","Ex-consul, woken by geese, who threw the first Gaul off the cliff"],["Lucius Albinus","Citizen who carried the Vestal Virgins to Caere by wagon"],["Marcus Papirius","Old ex-official who struck a Gaul for stroking his beard"]],"secs":["siege-of-veii","sack-of-rome","sack-of-rome","sack-of-rome","sack-of-rome"]},{"name":"Offices and Terms","blurb":"Match each Roman term to what it meant.","pairs":[["Consular tribunes","Three to six officials who often replaced the two consuls"],["Dictator","Emergency commander with sweeping powers for six months"],["Tribune of the plebs","Plebeian-elected protector who could veto official business"],["Praetor","Chief judge, first reserved for patricians in 366 BC"],["Sibylline Books","Prophecies consulted in times of plague, famine or war"]],"secs":["conflict-of-the-orders","siege-of-veii","licinius-and-sextius","first-plebeian-consul","licinian-laws"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Vae victis!","“Woe to the vanquished!”, said by Brennus"],["Cuniculus","The tunnel the Romans dug into Veii"],["Dies Alliensis","The ill-omened anniversary of the Allia"],["Ager publicus","Public land owned by the Roman state"],["Civitas sine suffragio","Citizenship without the right to vote"],["Magister equitum","“Master of the horse”: a dictator’s deputy"]],"secs":["sack-of-rome","siege-of-veii","battle-of-the-allia","licinian-laws","rome-after-the-sack","licinius-and-sextius"]}],"decks":[{"name":"Veii and the Gauls","blurb":"Conquest, catastrophe and the stories told about them.","cards":[{"claim":"Veii, the Etruscan city Rome besieged, lay just 16 km from Rome.","answer":true,"why":"Veii was a large Etruscan city only 16 km (10 miles) from Rome.","sec":"siege-of-veii"},{"claim":"Roman troops emerged from their tunnel inside the temple of Apollo at Veii.","answer":false,"why":"They climbed out inside the temple of Juno, Veii's protecting goddess. Apollo was promised a tenth of the spoils.","sec":"siege-of-veii"},{"claim":"The Senones, a Gallic tribe, settled on the Adriatic coast around modern Rimini.","answer":true,"why":"The Senones were one of several Celtic peoples who had pushed into northern Italy, settling around Rimini.","sec":"battle-of-the-allia"},{"claim":"Rome handed the three Fabius brothers over to the Gauls to avoid war.","answer":false,"why":"Instead of handing them over, the Romans elected the brothers consular tribunes for the next year, which enraged the Gauls.","sec":"battle-of-the-allia"},{"claim":"The honking of Juno's sacred geese woke Marcus Manlius during a night attack.","answer":true,"why":"While guards and dogs slept, the geese roused Manlius, who hurled the first attacker down the slope.","sec":"sack-of-rome"},{"claim":"The Romans agreed to pay the Gauls a ransom of about 33 kg (a hundred pounds) of gold.","answer":false,"why":"Famine and disease forced a deal of about 330 kg (a thousand pounds) of gold.","sec":"sack-of-rome"},{"claim":"The Greek historians Polybius and Diodorus both describe Camillus rescuing Rome.","answer":false,"why":"Neither Polybius nor Diodorus mentions Camillus, which is why many historians see his rescue as a later addition.","sec":"sack-reliability"},{"claim":"Rome's huge new wall was built of yellow stone quarried in Veii's territory.","answer":true,"why":"The old wall used crumbly local stone; the new 11 km wall used better yellow stone from Veii's land.","sec":"rome-after-the-sack"}]},{"name":"Plebeians Fight for Power","blurb":"Offices, laws and the long road to sharing power.","cards":[{"claim":"Livy said the consular tribunate was created as a concession because plebeians could hold it.","answer":true,"why":"Livy, writing centuries later, presented the office as a concession open to plebeians.","sec":"conflict-of-the-orders"},{"claim":"Between 444 and 401 BC, about half of all consular tribunes were plebeians.","answer":false,"why":"Only two of about a hundred consular tribunes in those years were plebeians.","sec":"conflict-of-the-orders"},{"claim":"Licinius and Sextius blocked the election of consular tribunes for five years.","answer":true,"why":"They struck back at the patricians' vetoes this way, giving in only in 370 BC when Velitrae attacked.","sec":"licinius-and-sextius"},{"claim":"The land law limited any individual to about 1,200 hectares (3,000 acres) of public land.","answer":false,"why":"The limit was about 120 hectares (300 acres), and no one could graze more than 100 cattle on public land.","sec":"licinian-laws"},{"claim":"Licinius himself was later fined for breaking his own land limit.","answer":true,"why":"Such laws were easy to dodge, and Licinius was later fined for exceeding his own limit.","sec":"licinian-laws"},{"claim":"The new law put ten priests, five of them plebeians, in charge of the Sibylline Books.","answer":true,"why":"They replaced the two patrician guardians, breaking the patrician monopoly on priesthoods for the first time.","sec":"licinian-laws"},{"claim":"Under the compromise of 366 BC, the new praetor had to be a plebeian.","answer":false,"why":"The nobles accepted a plebeian consul, and in return the plebeians agreed the praetor would be a patrician.","sec":"first-plebeian-consul"},{"claim":"From 355 to 343 BC, one consul each year was always a plebeian.","answer":false,"why":"In those years both consuls were patricians; regular sharing began only after Genucius's law of 342 BC.","sec":"modern-verdict"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Creating the praetorship","Easing debt","Limiting public land holdings","Restoring the consulship"],"odd":0,"why":"Three were bills Licinius and Sextius put to the Plebeian Council. The patrician praetorship came later, as Livy's compromise of 366 BC.","sec":"licinius-and-sextius"},{"items":["Veii","Ardea","Clusium","Caere"],"odd":1,"why":"Veii, Clusium and Caere are described as Etruscan cities. Ardea is simply a town south of Rome, where Camillus lived in exile.","sec":"sack-reliability"},{"items":["Vowed a tenth of spoils to Apollo","Invited Juno to move to Rome","Attacked walls from every side","Recalled from exile at Ardea"],"odd":3,"why":"The first three are what Camillus did to take Veii. His recall from exile at Ardea belongs to Livy's story of the Gallic sack.","sec":"siege-of-veii"},{"items":["Fighting men","Able-bodied senators","Old former officeholders","Vestal Virgins"],"odd":2,"why":"Fighting men and senators withdrew to the Capitoline and the Vestals fled to Caere. The old ex-officials stayed outside their houses and were massacred.","sec":"sack-of-rome"},{"items":["Chief judge","Presided over criminal trials","Guarded the Sibylline Books","Could command an army"],"odd":2,"why":"Three were roles of the praetor. The Sibylline Books were guarded by priests, first two patricians, later ten.","sec":"first-plebeian-consul"},{"items":["Pitched no camp","Launched a night attack","Failed to consult the gods","Stretched the line too thin"],"odd":1,"why":"Livy blames the Allia defeat on three Roman errors. The night attack was the Gauls' later climb up the Capitoline.","sec":"battle-of-the-allia"},{"items":["Plague","War","Famine","Elections"],"odd":3,"why":"The Sibylline Books were consulted in times of plague, famine or war. Elections are not mentioned as an occasion.","sec":"licinian-laws"}]}],"whos":[{"name":"Faces of the Gallic Crisis","blurb":"Romans and Gauls caught up in the fall of Rome.","people":[{"name":"Marcus Furius Camillus","options":["Marcus Furius Camillus","Marcus Manlius","Publius Manlius Capitolinus","Lucius Albinus"],"clues":["Many modern historians think my most famous rescue was added to the story later.","Livy says Rome recalled me from exile at Ardea to be dictator.","I vowed a tenth of t
