"He reportedly died before the eyes of his young son Hannibal, and command passed to his son-in-law.","sec":"barcas-in-spain"},{"label":"Barca's son-in-law is murdered","when":"221 BC","y":-221,"fact":"His murder put Hannibal, aged 26, in command of the Carthaginian army in Spain.","sec":"barcas-in-spain"},{"label":"Rome declares war on Carthage","when":"Spring 218 BC","y":-218,"fact":"War came after Carthage rejected the curt demands of a Roman embassy led by Fabius Maximus.","sec":"saguntum"},{"label":"Fabius made dictator","when":"217 BC, after Trasimene","y":-217,"fact":"Panicked voters gave him supreme command for a limited term, and he refused to fight the battle Hannibal wanted.","sec":"fabius-the-delayer"},{"label":"Rome raises its biggest army ever","when":"Spring 216 BC","y":-216,"fact":"Eight legions plus as many allies, about 86,000 men, marched against Hannibal near Cannae.","sec":"battle-of-cannae"},{"label":"Fabius consul for a second time","when":"214 BC","y":-214,"fact":"Rome turned again to the man it had once mocked as the Delayer.","sec":"fabius-the-delayer"},{"label":"Polybius taken to Rome as hostage","when":"167 BC","y":-167,"fact":"This Greek, later the most trusted ancient historian of the war, wrote his account after 146 BC.","sec":"sources-and-blame"}]}],"matches":[{"name":"Who's Who","blurb":"Match each person to their role in the war or its story.","pairs":[["Barca","Hannibal's father, who built Carthage a base in Iberia"],["Fabius Maximus","Dictator who avoided pitched battles and wore Hannibal down"],["Varro","Consul of humble origins, blamed by Livy for Cannae"],["Polybius","Greek hostage, the most trusted ancient historian of the war"],["Livy","Openly patriotic Roman historian writing under Augustus"]],"secs":["barcas-in-spain","fabius-the-delayer","sources-and-blame","sources-and-blame","sources-and-blame"]},{"name":"Words and Deals","blurb":"Match each term to its meaning.","pairs":[["Truceless War","Carthage's fight against its own rebel mercenaries and subjects"],["Ebro Treaty","Made a river in north-east Spain Carthage's northern limit"],["Dictator","Emergency office giving one man supreme command for a limited term"],["Sibylline Books","Sacred prophecies consulted by Roman priests in emergencies"],["Hannibalism","French scholars' word for hunting Hannibal's Alpine pass"]],"secs":["after-the-first-war","barcas-in-spain","fabius-the-delayer","after-cannae","which-pass"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Hispania","Iberia: today Spain and Portugal"],["Gallia Cisalpina","Celtic lands of the Po valley in northern Italy"],["Coloniae","Settlements Rome founded on the best land"],["Socii","Rome’s Italian allies, whom Hannibal set free"],["Cunctator","“The Delayer”, Fabius’s mocking nickname"],["Libri Sibyllini","Sacred prophecies kept for emergencies"]],"secs":["barcas-in-spain","saguntum","saguntum","trebia-and-trasimene","fabius-the-delayer","after-cannae"]}],"decks":[{"name":"From Carthage to the Alps","blurb":"The road to war and the great march.","cards":[{"claim":"Rome seized Sardinia and Corsica while Carthage was fighting its rebellious mercenaries.","answer":true,"why":"In 238 BC Rome broke the treaty and took them during the Truceless War, embittering many Carthaginians.","sec":"after-the-first-war"},{"claim":"The nickname Barca, given to Hannibal's father, meant 'thunder'.","answer":false,"why":"Barca meant 'lightning'.","sec":"barcas-in-spain"},{"claim":"The Ebro Treaty made the Ebro the southern limit of Carthage's sphere in Spain.","answer":false,"why":"The Ebro, a river in north-east Spain, became the northern limit of Carthage's sphere.","sec":"barcas-in-spain"},{"claim":"Saguntum held out against Hannibal for eight months, and Rome sent no help.","answer":true,"why":"After the siege of 219 BC Hannibal sold its people as slaves and shared the loot.","sec":"saguntum"},{"claim":"Hannibal's elephants crossed the Rhône on rafts covered with earth.","answer":true,"why":"The earth made the elephants believe they were still on land.","sec":"crossing-the-alps"},{"claim":"Hannibal took 40 days to cross the Alps.","answer":false,"why":"He crossed the Alps in 15 days, reaching them in late autumn and entering Italy in November.","sec":"crossing-the-alps"},{"claim":"Peat bogs near the Col de la Traversette held unusual levels of gut bacteria from horses and mules.","answer":true,"why":"Researchers found churned soil and these bacteria, radiocarbon dated to around 218 BC, though sceptics call the evidence thin.","sec":"which-pass"},{"claim":"Polybius wrote that Hannibal took the lowest pass over the Alps.","answer":false,"why":"Polybius wrote that he took the highest pass, and the Traversette is the highest in the western Alps.","sec":"which-pass"}]},{"name":"Disasters in Italy","blurb":"Trebia, Trasimene, Fabius and Cannae.","cards":[{"claim":"At the Trebia only about 10,000 of 40,000 Romans fought their way out.","answer":true,"why":"The Carthaginians surrounded the Romans on ground of Hannibal's choosing in December 218 BC.","sec":"trebia-and-trasimene"},{"claim":"The Roman consul escaped the ambush at Lake Trasimene.","answer":false,"why":"Some 15,000 Romans died at Trasimene, the consul among them.","sec":"trebia-and-trasimene"},{"claim":"Hannibal freed captured Italian allies and sent them home to praise Carthage.","answer":true,"why":"Roman prisoners were treated harshly, but allies were freed because Hannibal hoped to pull Rome's alliance apart.","sec":"trebia-and-trasimene"},{"claim":"When Fabius's term as dictator ended, the voters renewed his powers.","answer":false,"why":"His powers were not renewed; the voters elected Varro and an aristocratic colleague as consuls for 216 BC.","sec":"fabius-the-delayer"},{"claim":"At Cannae Hannibal placed his veteran African infantry in the centre of his line.","answer":false,"why":"Gauls and Spaniards held the crescent-shaped centre; the Africans waited at either end and turned inward on the flanks.","sec":"battle-of-cannae"},{"claim":"Rome's army at Cannae numbered about 86,000 men.","answer":true,"why":"It was the biggest army Rome had ever raised: eight legions plus as many allies.","sec":"battle-of-cannae"},{"claim":"After Cannae the Senate opened peace talks with Hannibal.","answer":false,"why":"The Senate refused to talk, banned the word 'peace' and enlisted even slaves.","sec":"after-cannae"},{"claim":"The Senate greeted Varro warmly after Cannae, unlike other defeated generals.","answer":true,"why":"This is one reason some historians suspect Varro was made a scapegoat for Cannae.","sec":"sources-and-blame"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Rhône","Ebro","Trebia","Lake Trasimene"],"odd":3,"why":"The Rhône, Ebro and Trebia are rivers; Trasimene is a lake in central Italy, scene of Hannibal's ambush.","sec":"trebia-and-trasimene"},{"items":["Little St Bernard Pass","Massalia","Col de Clapier","Col de la Traversette"],"odd":1,"why":"The other three are candidate Alpine passes for Hannibal's crossing; Massalia was a Greek city, now Marseille.","sec":"which-pass"},{"items":["Silver mines","Shipyards","Sicily","Rich farmland"],"odd":2,"why":"Barca's Spanish domain gave Carthage silver mines, shipyards and farmland; Sicily was lost to Rome in 241 BC.","sec":"barcas-in-spain"},{"items":["Trebia","Lake Trasimene","Saguntum","Cannae"],"odd":2,"why":"Hannibal destroyed Roman armies at the Trebia, Lake Trasimene and Cannae, all in Italy; Saguntum was a city in Spain that he besieged and took in 219 BC.","sec":"saguntum"},{"items":["Consulted the Sibylline Books","Banned the word 'peace'","Enlisted even slaves","Accepted Hannibal's terms"],"odd":3,"why":"Rome did the first three after Cannae; it refused Hannibal's moderate peace terms and fought on for fourteen years.","sec":"after-cannae"},{"items":["Pack infantry very deep","Avoid pitched battles","Harass the invaders","Cut supply lines"],"odd":0,"why":"Avoiding battle, harassing and cutting supplies made up the Fabian strategy; packing infantry deep was the Roman plan at Cannae.","sec":"fabius-the-delayer"},{"items":["Greek hostage in Rome","Wrote under Augustus","Interviewed both sides","Survives in fragments after 216 BC"],"odd":1,"why":"Three describe Polybius; writing under the emperor Augustus describes Livy.","sec":"sources-and-blame"}]}],"whos":[{"name":"Commanders","blurb":"Generals and consuls of the war's first years.","people":[{"name":"Hannibal","options":["Hannibal","Barca","Fabius Maximus","Varro"],"clues":["I sold a captured city's people as slaves and shared the loot with my soldiers and my home city.","In my greatest battle I stood among the Gauls and Spaniards in my centre as it gave ground.","As a boy I reportedly watched my father die fighting tribes in Spain.","I led an army with elephants over the Alps into Italy."],"sec":"crossing-the-alps"},{"name":"Barca","options":["Barca","Hannibal","Varro","Fabius Maximus"],"clues":["I was killed around 228 BC, fighting local tribes.","I carved out a near-royal domain in Iberia, rich in silver mines and shipyards.","In 237 BC I crushed the revolt of Carthage's mercenaries.","My nickname means 'lightning', and my son would invade Italy."],"sec":"barcas-in-spain"},{"name":"Varro","options":["Fabius Maximus","Varro","Hannibal","Barca"],"clues":["After my army was destroyed, the Senate greeted me warmly, unlike other defeated generals.","Some historians suspect I was made a scapegoat by a powerful family.","I escaped the slaughter at Cannae with just 70 horsemen.","A consul of reportedly humble origins, I demanded an aggressive war in 216 BC."],"sec":"sources-and-blame"}]},{"name":"Rome's Shield and Its Storytellers","blurb":"A patient general and the historians who told the tale.","people":[{"name":"Fabius Maximus","options":["Varro","Hannibal","Fabius Maximus","Barca"],"clues":["I led an embassy to Carthage whose curt demands were rejected.","I was elected consul in 215 and again in 214 BC.","After the disaster at Lake Trasimene the voters made me dictator.","Soldiers and citizens mocked me as Cunctator, the Delayer."],"sec":"fabius-the-delayer"},{"name":"Polybius","options":["Livy","Polybius","Fabius Pictor","Cato the Elder"],"clues":["My account survives only in fragments after 216 BC.","My patron was the grandson of the consul killed at Cannae.","I interviewed participants from both sides of the war.","I was a Greek taken to Rome as a hostage in 167 BC."],"sec":"sources-and-blame"},{"name":"Livy","options":["Polybius","Fabius Pictor","Cato the Elder","Livy"],"clues":["Modern scholars find my battle descriptions often inaccurate.","I put the Roman dead at Cannae at about 48,000.","I relied heavily on a Greek hostage's history but was openly patriotic.","I wrote in Rome two centuries after the war, under the emperor Augustus."],"sec":"sources-and-blame"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Carthage","lat":36.853,"lon":10.323,"why":"The wealthy trading city in modern Tunisia that lost the First Punic War to Rome.","sec":"after-the-first-war"},{"name":"Saguntum","lat":39.68,"lon":-0.2783,"why":"This east-coast Spanish city tied to Rome fell to Hannibal after an eight-month siege, leading to war.","sec":"saguntum"},{"name":"New Carthage","lat":37.6019,"lon":-0.9842,"why":"Hannibal's main base in Spain, from which he marched north in May or June 218 BC.","sec":"crossing-the-alps"},{"name":"Massalia","lat":43.2964,"lon":5.37,"why":"A Roman army landed at this Greek city but missed Hannibal as he crossed the Rhône.","sec":"crossing-the-alps"},{"name":"Trebia","lat":44.98847222,"lon":9.56736111,"why":"At this tributary of the Po, Hannibal surrounded a combined Roman army in December 218 BC.","sec":"trebia-and-trasimene"},{"name":"Lake Trasimene","lat":43.14,"lon":12.1,"why":"Hannibal's ambush here in spring 217 BC killed some 15,000 Romans and a consul.","sec":"trebia-and-trasimene"},{"name":"Cannae","lat":41.29638889,"lon":16.15166667,"why":"On this Apulian plain Hannibal's double envelopment destroyed Rome's biggest army on 2 August 216 BC.","sec":"battle-of-cannae"}]}],"quizPool":{"1":[{"q":"In 238 BC Rome broke its treaty with Carthage to seize which islands?","options":["Crete and Cyprus","Sardinia and Corsica","The Balearic Islands","Sicily and Malta"],"a":1,"level":1,"why":"Rome seized Carthaginian Sardinia and Corsica while Carthage was distracted by the Truceless War. Many Carthaginians were deeply embittered by this.","sec":"after-the-first-war"},{"q":"Under which ruler did the historian Livy write?","options":["The dictator Sulla","The emperor Augustus","The emperor Nero","King Philip V of Macedon"],"a":1,"level":1,"why":"Livy wrote in Rome under Augustus and leaned heavily on Polybius. He was openly patriotic, and his battle descriptions are often inaccurate.","sec":"sources-and-blame"},{"q":"What did Hannibal seize at Cannae in spring 216 BC, prompting Rome to raise a huge army?","options":["A sacred temple of Jupiter","A large Roman supply depot","The consuls' war treasury","A Roman fleet at anchor"],"a":1,"level":1,"why":"Hannibal captured a large Roman supply depot at Cannae, a village in Apulia. The Senate answered with the biggest army Rome had ever raised.","sec":"battle-of-cannae"},{"q":"How did the Roman Senate respond to Hannibal's peace offer after Cannae?","options":["It refused to talk and banned the word 'peace'","It asked for a one-year truce","It accepted and surrendered Sicily","It sent Varro to negotiate terms"],"a":0,"level":1,"why":"The Senate refused to negotiate, banned the word 'peace' and even enlisted slaves. Rome went on fighting for fourteen more years.","sec":"after-cannae"},{"q":"How long did Hannibal's crossing of the Alps take?","options":["3 days","6 weeks","15 days","4 months"],"a":2,"level":1,"why":"Hannibal crossed the Alps in 15 days in late autumn. Along the way his men faced ambushes, falling boulders and bitter cold.","sec":"crossing-the-alps"},{"q":"What mocking nickname did Romans give Fabius Maximus?","options":["The Miser","The Delayer","The Coward","The Old Fox"],"a":1,"level":1,"why":"Fabius was mocked as the Delayer (Cunctator) for refusing to fight a pitched battle. Events later vindicated his cautious strategy.","sec":"fabius-the-delayer"},{"q":"What did the nickname 'Barca', given to Hannibal's father, mean?","options":["The Lion","The Hammer","Thunder","Lightning"],"a":3,"level":1,"why":"Barca meant 'lightning'. Hannibal's father crushed the mercenary revolt in 237 BC and then led his army to Spain.","sec":"barcas-in-spain"},{"q":"Where was most of the First Punic War between Rome and Carthage fought?","options":["Along the coast of Gaul","On and around Sicily","In the hills of Tunisia","In southern Spain"],"a":1,"level":1,"why":"The First Punic War was fought mostly on and around Sicily, and losing it cost Carthage its Sicilian possessions. It was also the greatest naval war of the ancient world.","sec":"after-the-first-war"},{"q":"According to Polybius, which kind of Alpine pass did Hannibal take?","options":["The most southerly pass","The shortest pass","The lowest pass","The highest pass"],"a":3,"level":1,"why":"Polybius says Hannibal took the highest pass. That supports the Col de la Traversette, the highest pass in the western Alps.","sec":"which-pass"},{"q":"Why did Hannibal invade Italy by land rather than by sea?","options":["To collect Greek allies at Massalia","The Senate had closed Italy's ports","To avoid Rome's control of the sea","Carthage had no warships left"],"a":2,"level":1,"why":"Rome controlled the sea, so Hannibal marched overland. Rome had planned to fight in Spain and Africa instead.","sec":"crossing-the-alps"},{"q":"What word did French scholars coin for the endless hunt for Hannibal's Alpine route?","options":["Hannibalism","Punicology","Barcamania","Alpinomania"],"a":0,"level":1,"why":"'Hannibalism' describes chasing a question that may have no answer. Polybius gives just three place names, and no weapons or camps have been found.","sec":"which-pass"},{"q":"What is Hannibal's famous manoeuvre at Cannae called?","options":["Testudo formation","Double envelopment","Oblique order","Feigned retreat"],"a":1,"level":1,"why":"Hannibal's African infantry closed in on both flanks while his cavalry struck the Roman rear. This pincer movement has been studied by generals ever since.","sec":"battle-of-cannae"},{"q":"After Hannibal's cavalry won at the Ticinus in 218 BC, who declared for him?","options":["Rome's Sicilian allies","The Greek city of Massalia","Most Gallic tribes","The city of Capua"],"a":2,"level":1,"why":"After the cavalry victory at the Ticinus, most Gallic tribes declared for Hannibal. More Gauls flocked to him after the Trebia, swelling his army to some 60,000.","sec":"trebia-and-trasimene"},{"q":"How old was Hannibal when the army's officers chose him as their commander in 221 BC?","options":["26","19","35","42"],"a":0,"level":1,"why":"Hannibal was just 26 when the officers picked him. He took over after his brother-in-law, the previous commander, was murdered.","sec":"barcas-in-spain"},{"q":"Where did Hannibal ambush a Roman army in 217 BC, killing the consul leading it?","options":["Lake Trasimene","The Ticinus","Cannae","Saguntum"],"a":0,"level":1,"why":"At Lake Trasimene in central Italy, some 15,000 Romans died, the consul among them. Another 10,000 were captured.","sec":"trebia-and-trasimene"},{"q":"How did Hannibal get his elephants across the Rhône?","options":["By marching them upstream to the river's source","By swimming them across a shallow ford","Over a stone bridge built by his engineers","On rafts covered with earth so they seemed on land"],"a":3,"level":1,"why":"The rafts were covered with earth so the elephants believed they were still on land. Meanwhile a detachment crossed upstream to attack the hostile Gauls from behind.","sec":"crossing-the-alps"},{"q":"What emergency office did Roman voters give Fabius after the defeat at Trasimene?","options":["Praetor","Dictator","Tribune of the plebs","Censor"],"a":1,"level":1,"why":"A dictator held supreme command for a limited term. Fabius was the same senator who had carried Rome's ultimatum to Carthage.","sec":"fabius-the-delayer"},{"q":"Who reportedly told Hannibal, 'You know how to win a victory, Hannibal; you do not know how to use it'?","options":["Fabius Maximus","His cavalry commander","A Gallic chieftain","The consul Varro"],"a":1,"level":1,"why":"His cavalry commander is said to have urged a march on Rome after Cannae. Modern historians note that Hannibal's battered army was in no state to assault the city.","sec":"after-cannae"},{"q":"Which Spanish city, which had an agreement with Rome, did Hannibal besiege in 219 BC?","options":["Gades","Saguntum","New Carthage","Massalia"],"a":1,"level":1,"why":"Hannibal besieged Saguntum after he had conquered the other tribes south of the Ebro. The city held out for eight months, and Rome sent no help.","sec":"saguntum"},{"q":"How did the Greek historian Polybius come to live in Rome?","options":["He was taken there as a hostage","He fled there from Carthage","He served there as an ambassador","He was hired as a tutor by the Senate"],"a":0,"level":1,"why":"Polybius was taken to Rome as a hostage in 167 BC. He interviewed participants from both sides, and modern historians generally trust him.","sec":"sources-and-blame"},{"q":"Fabius Maximus was mocked as the Cunctator. What does it mean?","options":["The Delayer","The Coward","The Old Man","The Shield"],"a":0,"level":1,"why":"He refused to fight the pitched battle Hannibal wanted; events after Cannae proved him right.","sec":"fabius-the-delayer"},{"q":"Barca led his army to Hispania in 237 BC. What was Hispania?","options":["Iberia: today Spain and Portugal","North Africa west of Carthage","Southern Gaul","The island of Sardinia"],"a":0,"level":1,"why":"There he carved out a domain rich in silver mines, farmland and recruits.","sec":"barcas-in-spain"},{"q":"How did Hannibal treat Rome’s Italian allies (socii) captured at Trasimene?","options":["He freed them and sent them home","He sold them as slaves","He forced them into his army","He held them for ransom"],"a":0,"level":1,"why":"He hoped to pull Rome’s alliance apart; Roman prisoners were treated harshly.","sec":"trebia-and-trasimene"}],"2":[{"q":"What was Gallia Cisalpina?","options":["The Po valley lands of Celtic tribes in northern Italy","The Greek south of Italy","The Roman province of Sicily","The coast of southern France"],"a":0,"level":2,"why":"Rome was founding colonies there, and the angry Gauls listened to Hannibal’s envoys.","sec":"saguntum"},{"q":"Why were the Gauls of the Po valley angry with Rome before 218 BC?","options":["Rome was founding coloniae of settlers on their best land","Rome had banned their trade with Carthage","Rome had taken their children as hostages","Rome had destroyed their temples"],"a":0,"level":2,"why":"Hannibal’s envoys were already courting them, and after the Trebia most Gallic tribes joined him.","sec":"saguntum"},{"q":"After Cannae, Roman priests consulted the Libri Sibyllini. What were they?","options":["Sacred prophecies kept for emergencies","The records of the Senate","The laws of the Twelve Tables","Letters from the gods of Carthage"],"a":0,"level":2,"why":"In the panic, people were even buried alive in Rome’s cattle market as a sacrifice.","sec":"after-cannae"},{"q":"What did the Ebro Treaty of 226 BC establish?","options":["The Ebro as the northern limit of Carthage's sphere","Carthage's right to settle Cisalpine Gaul","The return of Sardinia to Carthage","The Ebro as Rome's frontier in Italy","Joint Roman-Carthaginian rule of Saguntum"],"a":0,"level":2,"why":"The treaty made the Ebro, a river in north-east Spain, the northern limit of Carthage's sphere. Rome's later deal with Saguntum, south of the river, would cause trouble.","sec":"barcas-in-spain"},{"q":"Who led the Roman embassy that delivered Rome's demands to Carthage after Saguntum fell?","options":["Cato the Elder","Fabius Maximus","Claudius Marcellus","Varro","Scipio Africanus"],"a":1,"level":2,"why":"Fabius Maximus, later famous as Rome's most patient general, led the embassy. Its curt demands were rejected, and Rome declared war in spring 218 BC.","sec":"saguntum"},{"q":"What desperate religious act followed Cannae after priests consulted the Sibylline Books?","options":["A new temple was built to Carthage's gods","People were buried alive in Rome's cattle market","The consul Varro was sacrificed to Mars","The Vestal Virgins were exiled from Rome","All temples were closed for a year"],"a":1,"level":2,"why":"People were buried alive in the cattle market as a sacrifice. The Sibylline Books were sacred prophecies kept for emergencies.","sec":"after-cannae"},{"q":"What did the 'Fabian strategy' involve?","options":["Seeking one decisive battle as quickly as possible","Avoiding pitched battles and cutting supply lines","Bribing the Gauls to abandon Hannibal","Fortifying Rome and abandoning the countryside","Invading Africa to force Hannibal home"],"a":1,"level":2,"why":"Fabius harassed the invaders and cut their supplies while Rome rebuilt its strength. The strategy was deeply unpopular while Hannibal plundered Italy's farmland.","sec":"fabius-the-delayer"},{"q":"Why were the Celtic tribes of Cisalpine Gaul angry with Rome in 218 BC?","options":["Rome had banned their Druid priests","Rome demanded heavy tribute in silver","Rome had enslaved their Iberian allies","Rome was drafting their men into its legions","Rome was founding settler colonies on their best land"],"a":4,"level":2,"why":"Rome was planting colonies of settlers on the best land of the Po valley. Hannibal's envoys were already courting the angry Gauls.","sec":"saguntum"},{"q":"From which base did Hannibal begin his march to Italy in 218 BC?","options":["Massalia, modern Marseille","Gades, modern Cádiz","New Carthage, modern Cartagena","Saguntum, on Spain's east coast","Carthage, in modern Tunisia"],"a":2,"level":2,"why":"New Carthage, now Cartagena, was Hannibal's main base. He marched north from it in May or June 218 BC.","sec":"crossing-the-alps"},{"q":"How did Carthage cope with its war debt to Rome after the First Punic War?","options":["It paid by surrendering its fleet","It paid it with ease","It took fifty years to pay","The Ebro Treaty cancelled it","It defaulted and was invaded"],"a":1,"level":2,"why":"Carthage remained the most prosperous port of its day and paid the debt easily. The Barca family soon began planning how to stand up to Rome again.","sec":"after-the-first-war"},{"q":"Against whom did Carthage fight the Truceless War after 241 BC?","options":["Iberian tribes south of the Ebro","The Celtic tribes of the Po valley","The Roman legions in Sicily","Its own rebellious mercenaries and African subjects","Greek colonists from Massalia"],"a":3,"level":2,"why":"Carthage was fighting for its life against its own mercenaries and African subjects. Rome used the distraction to seize Sardinia and Corsica.","sec":"after-the-first-war"},{"q":"How large was the army Rome raised to confront Hannibal at Cannae?","options":["About 150,000 men","About 86,000 men","About 40,000 men","About 26,000 men","About 60,000 men"],"a":1,"level":2,"why":"Eight Roman legions plus as many allied troops made about 86,000 men, the biggest army Rome had ever raised. The Romans packed their infantry unusually deep.","sec":"battle-of-cannae"},{"q":"Why did Rome's agreement with Saguntum alarm Carthage?","options":["Saguntum had sheltered Carthage's rebel mercenaries","Saguntum lay north of the Ebro, in Rome's sphere","Saguntum was Carthage's main silver port","Saguntum lay well south of the Ebro, in Carthage's sphere","Saguntum controlled the Alpine passes"],"a":3,"level":2,"why":"Saguntum lay well south of the Ebro, so Carthage saw the agreement as Roman meddling in its own sphere. The city later stood alone against Hannibal's conquests.","sec":"saguntum"},{"q":"Roughly how many of the 40,000 Romans at the Trebia fought their way out?","options":["About 35,000","About 2,000","About 20,000","About 10,000","About 30,000"],"a":3,"level":2,"why":"The Romans were surrounded on ground of Hannibal's choosing, and only about a quarter escaped. Afterwards Gauls flocked to Hannibal's army.","sec":"trebia-and-trasimene"},{"q":"How is Varro, one of the two consuls for 216 BC, described?","options":["A Greek-educated senator who sought peace","A veteran general who backed Fabius's strategy","An aristocrat who favoured a middle course","A former dictator recalled from Sicily","A man of reportedly humble origins demanding aggressive war"],"a":4,"level":2,"why":"Varro reportedly came from humble origins and demanded an aggressive war. His aristocratic colleague favoured a middle course.","sec":"fabius-the-delayer"},{"q":"Why might Polybius's account of Cannae be biased?","options":["His patron was the grandson of the consul killed there","He wrote under the emperor Augustus","He relied only on Carthaginian sources","He had served as an officer under Hannibal","He was Varro's personal secretary"],"a":0,"level":2,"why":"Polybius's patron descended from Varro's colleague, the consul who died at Cannae. His account also survives only in fragments after 216 BC.","sec":"sources-and-blame"},{"q":"Whom did Hannibal place in the crescent-shaped centre of his line at Cannae?","options":["Freed Italian allies","Veteran African infantry","Gauls and Spaniards, with himself among them","Spanish and Gallic horsemen","His war elephants"],"a":2,"level":2,"why":"Gauls and Spaniards held the centre, which bulged toward the enemy and was meant to give ground. Veteran African infantry waited at either end.","sec":"battle-of-cannae"},{"q":"Why did Hannibal free captured Roman allies after his early victories and send them home?","options":["To pull Rome's alliance apart","Because he could not feed them","To honour the terms of the Ebro Treaty","To exchange them for Carthaginian prisoners","To recruit them as guides over the Apennines"],"a":0,"level":2,"why":"Hannibal sent Rome's Italian allies home to praise Carthage, hoping to break up Rome's alliance. Roman prisoners, by contrast, were treated harshly.","sec":"trebia-and-trasimene"},{"q":"Where did a Roman army land in 218 BC, only to miss Hannibal as he passed?","options":["At Tarentum","In Sardinia","At New Carthage","At Massalia","At Saguntum"],"a":3,"level":2,"why":"The Roman army landed at Massalia, a Greek city that is now Marseille, but Hannibal had already slipped past. He then crossed the Rhône and pushed on toward the Alps.","sec":"crossing-the-alps"},{"q":"Which Alpine pass has recently gained ground as Hannibal's likely route?","options":["Little St Bernard Pass","Col de Clapier","Col de la Traversette","Brenner Pass","Great St Bernard Pass"],"a":2,"level":2,"why":"The Col de la Traversette, on the modern French-Italian border, is now a leading candidate. Sceptics still argue the evidence is too thin to be certain.","sec":"which-pass"}],"3":[{"q":"How did Hannibal's father reportedly die around 228 BC?","options":["Of fever while crossing the Ebro","Drowned in a shipwreck off Sardinia","Murdered by his own officers","Recalled and executed in Carthage","Captured and executed by a Roman army","Killed fighting local tribes in Spain"],"a":5,"level":3,"why":"He was killed fighting local tribes, reportedly in front of his young son Hannibal. Command then passed to his son-in-law.","sec":"barcas-in-spain"},{"q":"How long had the First Punic War lasted when it ended in 241 BC?","options":["Fourteen years","Thirty years","Seventeen years","Twenty-three years","Ten years","Eight years"],"a":3,"level":3,"why":"The war lasted twenty-three years, the longest continuous conflict of the ancient world. Under Rome's peace terms, Carthage gave up its possessions on Sicily.","sec":"after-the-first-war"},{"q":"How did Polybius and Livy differ on Roman deaths at Cannae?","options":["Polybius gave 70,000 infantry; Livy about 48,000","Polybius gave 150,000; Livy about 80,000","Both gave exactly 50,000 killed","Polybius gave about 48,000; Livy 70,000 infantry","Polybius gave 86,000; Livy about 70,000","Polybius gave 10,000; Livy about 8,000"],"a":0,"level":3,"why":"Polybius counted 70,000 infantry killed and 10,000 captured, while Livy gave about 48,000 dead. Hannibal lost between 5,700 and 8,000 men.","sec":"after-cannae"},{"q":"How was command of the Roman army arranged at Cannae?","options":["Fabius held supreme command as dictator","Varro led the infantry, his colleague the cavalry","The two consuls alternated command day by day","A senior legate commanded in the consuls' absence","The Senate chose a commander by lot each week","Varro's colleague held sole command throughout"],"a":2,"level":3,"why":"The consuls took turns in command day by day. Tradition says Varro held command on 2 August 216 BC, the day of the battle.","sec":"battle-of-cannae"},{"q":"How was Fabius vindicated after his dictatorship was not renewed?","options":["He led the peace embassy after Cannae","He was elected consul in 215 and 214 BC","He was granted a triumph after Trasimene","He commanded the left wing at Cannae","He was made dictator again for 216 BC","He was named censor for life"],"a":1,"level":3,"why":"After the disaster at Cannae, voters elected Fabius consul in 215 and again in 214 BC. In 216 BC they had preferred Varro's call for aggressive war.","sec":"fabius-the-delayer"},{"q":"With roughly what force did Hannibal enter northern Italy in November 218 BC?","options":["86,000 men including Gallic allies","20,000 infantry, 6,000 cavalry, a few elephants","30,000 infantry, 8,000 cavalry, 20 elephants","60,000 infantry and cavalry combined","40,000 infantry, 10,000 cavalry, 37 elephants","12,000 infantry, 2,000 cavalry, no elephants"],"a":1,"level":3,"why":"He arrived with about 20,000 infantry, 6,000 cavalry and the few survivors of 37 elephants. On the descent, his exhausted troops had to rebuild a path broken by a landslide.","sec":"crossing-the-alps"},{"q":"Which sequence of Hannibal's victories in Italy is in the correct chronological order?","options":["Trasimene, Ticinus, Trebia","Ticinus, Trasimene, Trebia","Trebia, Trasimene, Ticinus","Trasimene, Trebia, Ticinus","Trebia, Ticinus, Trasimene","Ticinus, Trebia, Trasimene"],"a":5,"level":3,"why":"The Ticinus came in late November 218 BC, the Trebia in December 218 BC and Lake Trasimene in spring 217 BC. Before Trasimene, Hannibal crossed the Apennines by an unguarded route.","sec":"trebia-and-trasimene"},{"q":"Polybius says Hannibal cheered his men by pointing to the plains of the Po below. Why does this count against the Little St Bernard Pass?","options":["Its peat bogs show no disturbance","The plains cannot be seen from it","It was guarded by Roman forts","It lies too far east of the Rhône","It is the highest pass in the Alps","It was blocked by a landslide"],"a":1,"level":3,"why":"The Po plains are visible from the Traversette but not from the Little St Bernard. Sceptics still argue the evidence is too thin to be certain.","sec":"which-pass"},{"q":"At Cannae, how did the two consules share command of the army?","options":["They took turns, day by day","One led the infantry, the other the cavalry","The older consul always commanded","They drew lots before the battle"],"a":0,"level":3,"why":"Tradition says Varro held command on 2 August 216 BC, the day of battle.","sec":"battle-of-cannae"},{"q":"How big was the army the Senate raised in 216 BC?","options":["Eight legiones plus as many allies: about 86,000 men","Four legiones: about 20,000 men","Two legiones and a fleet: about 40,000 men","Twenty legiones: about 200,000 men"],"a":0,"level":3,"why":"It was the biggest army Rome had ever raised, packed unusually deep to smash Hannibal’s centre.","sec":"battle-of-cannae"}]},"chronicleMaps":[{"id":"march","sec":"crossing-the-alps","title":"Hannibal’s march, 218–216 BC","caption":"From New Carthage, Hannibal marched along the coast of Spain, crossed the Pyrenees, the Rhône and the Alps, then won at the Trebia, Lake Trasimene and Cannae. The route is drawn roughly: no one knows which Alpine pass he used.","bounds":{"latMin":36.9,"latMax":46.4,"lonMin":-5.2,"lonMax":18.6},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"l","dy":8},{"name":"New Carthage","lat":37.6,"lon":-0.98,"side":"r","dy":6},{"name":"Saguntum","lat":39.68,"lon":-0.28,"side":"r"},{"name":"Massalia","lat":43.3,"lon":5.37,"side":"r","dy":8},{"name":"Trebia","lat":44.99,"lon":9.57,"kind":"battle","side":"r","dy":-6},{"name":"Lake Trasimene","lat":43.14,"lon":12.1,"kind":"battle","side":"r","dy":-12},{"name":"Cannae","lat":41.3,"lon":16.15,"kind":"battle","side":"l","dy":14}],"peoples":[{"name":"Iberia","latin":"Hispania","lat":40,"lon":-2.9},{"name":"Gauls","lat":45.6,"lon":2.3},{"name":"Alps","lat":46,"lon":8}],"routes":[{"pts":[[37.6,-0.98],[38.6,-0.1],[39.7,-0.3],[40.8,0.8],[41.6,2.4],[42.4,3],[43.3,3.6],[43.95,4.75],[44.4,5.6],[44.7,6.6],[44.7,7.1],[44.85,7.7],[45,9.3]]},{"pts":[[44.95,9.8],[44.4,10.9],[43.6,11.2],[43.2,11.95]]},{"pts":[[43,12.4],[42.4,13.6],[41.8,15],[41.35,16]]}]},{"id":"cannae","sec":"battle-of-cannae","title":"Cannae, 216 BC: the trap","caption":"Hannibal’s crescent of Gauls and Spaniards gave ground as the Romans pushed in. His African infantry turned inward on both flanks, and his cavalry, after routing the Roman horse, rode behind the Roman army to strike its rear. A simplified plan.","plan":true,"height":205,"key":{"rome":"Romans and allies","enemy":"Hannibal’s army"},"units":[{"side":"rome","x":100,"y":38,"w":100,"h":48,"name":"Roman infantry, packed deep","ly":31},{"side":"rome","x":50,"y":62,"w":40,"h":18,"name":"Roman cavalry","ly":56},{"side":"rome","x":210,"y":62,"w":40,"h":18,"name":"Allied cavalry","ly":92},{"side":"enemy","d":"M112,130 Q150,92 188,130 L188,139 Q150,104 112,139 Z","name":"Gauls and Spaniards","lx":150,"ly":152},{"side":"enemy","x":82,"y":116,"w":24,"h":24,"name":"Africans","lx":94,"ly":163},{"side":"enemy","x":194,"y":116,"w":24,"h":24,"name":"Africans","lx":206,"ly":163},{"side":"enemy","x":44,"y":114,"w":32,"h":16,"name":"Spanish and Gallic horse","lx":60,"ly":178},{"side":"enemy","x":224,"y":114,"w":32,"h":16,"name":"Cavalry","lx":240,"ly":140}],"moves":[{"side":"enemy","pts":[[60,112],[66,84]]},{"side":"enemy","dashed":true,"pts":[[44,108],[30,60],[70,14],[226,14],[246,54]]},{"side":"enemy","pts":[[94,114],[103,95]]},{"side":"enemy","pts":[[206,114],[197,95]]},{"side":"enemy","dashed":true,"pts":[[150,96],[150,118]]}]}],"keyFacts":{"description":"Key facts for this chapter, written by hand from the chapter text. Every entry links to the section that explains it.","people":[{"name":"Barca","text":"Hannibal’s father, “lightning”, who built Carthage a base in Spain.","sec":"barcas-in-spain"},{"name":"Hannibal","text":"Carthaginian general who crossed the Alps and won at the Trebia, Trasimene and Cannae.","sec":"barcas-in-spain"},{"name":"Fabius Maximus","text":"Dictator who avoided battle and wore Hannibal down: the Delayer.","sec":"fabius-the-delayer"},{"name":"Varro","text":"Consul of humble origins, blamed by Livy for Cannae.","sec":"fabius-the-delayer"},{"name":"Polybius","text":"Greek historian, the most trusted ancient source for these years.","sec":"sources-and-blame"},{"name":"Livy","text":"Patriotic Roman historian who wrote under Augustus.","sec":"sources-and-blame"}],"dates":[{"when":"238 BC","text":"Rome seizes Sardinia and Corsica.","sec":"after-the-first-war"},{"when":"237 BC","text":"Barca leads his army to Spain.","sec":"barcas-in-spain"},{"when":"226 BC","text":"The Ebro Treaty.","sec":"barcas-in-spain"},{"when":"221 BC","text":"The army chooses Hannibal, aged 26, as commander.","sec":"barcas-in-spain"},{"when":"219 BC","text":"Hannibal besieges and takes Saguntum.","sec":"saguntum"},{"when":"218 BC","text":"Rome declares war; Hannibal crosses the Alps; the Trebia.","sec":"crossing-the-alps"},{"when":"217 BC","text":"Ambush at Lake Trasimene; Fabius becomes dictator.","sec":"trebia-and-trasimene"},{"when":"2 August 216 BC","text":"The battle of Cannae.","sec":"battle-of-cannae"}],"terms":[{"latin":"Carthago","english":"Carthage","sec":"after-the-first-war"},{"latin":"Hispania","english":"Iberia: Spain and Portugal","sec":"barcas-in-spain"},{"latin":"Gallia Cisalpina","english":"Cisalpine Gaul, the Po valley","sec":"saguntum"},{"latin":"coloniae","english":"colonies of settlers","sec":"saguntum"},{"latin":"consules","english":"the two consuls","sec":"trebia-and-trasimene"},{"latin":"socii","english":"Rome’s Italian allies","sec":"trebia-and-trasimene"},{"latin":"Cunctator","english":"“the Delayer”","sec":"fabius-the-delayer"},{"latin":"senatus","english":"the Senate","sec":"battle-of-cannae"},{"latin":"legiones","english":"legions","sec":"battle-of-cannae"},{"latin":"Libri Sibyllini","english":"the Sibylline Books of prophecy","sec":"after-cannae"}]}},{"id":"scipio-and-zama","era":"middle-republic","short":"Scipio and Zama","title":"Scipio and the Road to Zama","period":"216-201 BC","sources":["Scipio Africanus","Battle of the Metaurus","Battle of Zama"],"briefing":{"title":"Cannae, 216 BC","paragraphs":["It is 216 BC, and Rome is reeling. Hannibal, the general of Carthage, a great trading city on the coast of modern Tunisia, has marched an army from Spain over the Alps. At Cannae in southern Italy he has crushed the Romans: at least 67,500 lie dead or captured.","Among the survivors is a young officer named Scipio. Within a few years Rome will hand him an army, though he has held no senior office. Can he win back Spain, carry the war to Africa and face Hannibal himself?"]},"sections":[{"id":"survivor-of-cannae","title":"A Survivor of Cannae","body":"In 218 BC Rome went to war with Carthage (*Carthago*), the great trading city on the coast of modern Tunisia. The Carthaginian general Hannibal marched an army from Spain, over the Alps and into Italy. This was the start of the Second Punic War. Among the Romans who rode out to stop him was a teenager named Scipio, son of one of that year's consuls (*consules*), the two magistrates elected each year to lead Rome's armies.\n\nAccording to one ancient account, enemy horsemen surrounded Scipio's father in a cavalry clash on the river Ticinus in northern Italy, and young Scipio saved his life. Other writers gave the credit to an unnamed slave.\n\nIn 216 BC Scipio served as a military tribune (*tribunus militum*), a junior officer, at Cannae in southern Italy. There at least 67,500 Romans were killed or captured, among them Scipio's future father-in-law, a consul. Scipio survived and rallied the stragglers. A later story claims he burst in on young nobles who were plotting to flee abroad and forced them at sword-point to swear loyalty to Rome. Modern historians suspect it was invented. In 213 BC voters elected him aedile (*aedilis*), an official who looked after the city's streets and festivals. A tribune objected that he was too young, but the crowd's enthusiasm made the tribune back down."},{"id":"command-in-spain","title":"An Unprecedented Command in Spain","body":"For seven years Scipio's father and uncle led Rome's armies in Spain, pushing deep into Carthaginian territory there. Then in 211 BC the brothers split their forces to attack three enemy armies at once. Each was beaten separately, and both men were killed. Two of the victorious Carthaginian commanders were Hannibal's own brothers.\n\nIn 210 BC the people's assembly gave the Spanish command to the younger Scipio, then about 25. It was an extraordinary choice. Normally only a man who had already held one of Rome's senior offices could lead an army in his own right. Scipio had held none of them, yet he received the full military authority of a consul (*imperium pro consule*). He was the first Roman ever given such power without first serving as consul.\n\nA Roman historian writing two centuries later described the Senate (*senatus*), Rome's council of elder statesmen, as dithering over the appointment. Modern scholars suspect instead that the senators picked Scipio themselves, then had the people vote on it to make an irregular command look legitimate. Scipio arrived in Spain in early autumn with about 10,000 reinforcements."},{"id":"new-carthage","title":"The Storming of New Carthage","body":"Scipio's first great stroke came in 209 BC. Rather than chase the three Carthaginian armies, he struck at New Carthage, modern Cartagena on Spain's south-east coast. It was the enemy's main supply base. A lagoon guarded the city's northern side, but at low tide it could be waded. Scipio sent a party across while the walls were under attack. He told his troops that the sea god Neptune had promised him help in a vision. The story fed a growing legend that Scipio was a favourite of the gods.\n\nThe capture was brutal. Scipio ordered his men to kill everyone they met. Polybius, a Greek historian of the period, thought the aim was to terrify the region into surrender, and claimed the soldiers even cut dogs in half. Once the garrison in the citadel gave up, Scipio changed course. Citizens were spared, and only non-citizens were enslaved.\n\nHe treated the 300 Spanish hostages held in the city generously, promising them freedom if their tribes sided with Rome, and several tribes soon did. A much later writer added a famous tale. In it, Scipio returned a beautiful captive untouched to her Spanish fiancé. Renaissance painters loved the scene and called it the \"Continence of Scipio\"."},{"id":"conquest-of-spain","title":"Baecula, Ilipa and the Conquest of Spain","body":"In 208 BC Scipio fought one of Hannibal's brothers near Baecula in southern Spain. Scipio won the battle but not the campaign. His opponent slipped away with most of his army, crossed the Pyrenees and headed for Italy to join Hannibal.\n\nThe decisive blow fell in 206 BC at Ilipa, north of modern Seville. There Scipio routed the remaining Carthaginian forces and drove them from the peninsula. The mopping-up was harsh. One town that had killed Roman refugees was severely punished, and the people of another killed themselves rather than surrender. Soon Gades, modern Cádiz, Carthage's last stronghold in Spain, gave up too. Around this time Scipio also founded Italica, about 9 km northwest of Seville, which later became the birthplace of three Roman emperors.\n\nScipio was already thinking about Africa. He courted two rulers of Numidia, a kingdom of horsemen west of Carthage. One, an established king, promised friendship but later sided with Carthage. The other was Masinissa, a young prince who had fought for Carthage in Spain. When his rival drove him from his kingdom, Masinissa joined Rome and became its most valuable ally."},{"id":"battle-of-the-metaurus","title":"The Metaurus: Hannibal's Brother Falls","body":"While Scipio was winning Spain, the brother of Hannibal who had escaped him crossed the Alps in spring 207 BC. His army had been swollen by Gaulish recruits, and he brought war elephants. If the two brothers joined forces, Rome faced catastrophe. Then the Romans captured his messengers and learned of his plan to meet Hannibal in central Italy.\n\nThe letters reached Claudius Nero, the consul who was shadowing Hannibal in the far south. Without waiting for the Senate's approval, Claudius Nero took 7,000 picked men and marched north in secret, hundreds of kilometres, gathering volunteers and supplies as he went. He joined his fellow consul by night. Next morning the Carthaginian commander noticed the Roman army had grown. He remembered hearing a second trumpet, the signal that a second commander had arrived, and he retreated in the dark. His guides deserted him, and dawn found his weary army trapped beside the Metaurus, a river in north-east Italy.\n\nIn the battle, Claudius Nero led half his men behind the Roman lines and smashed into the enemy flank. Seeing all was lost, Hannibal's brother charged into the Roman ranks and died. About 15,400 of his men were killed or captured. Claudius Nero had the dead man's head thrown into Hannibal's camp. Hannibal soon withdrew to Bruttium, the \"toe\" of Italy."},{"id":"consul-at-thirty-one","title":"Consul at Thirty-One","body":"Scipio came home from Spain in 206 BC and was elected consul for 205 BC amid wild enthusiasm. He was 31, while the normal minimum age for the office was 42. He wanted to carry the war to Africa, and many senators thought this reckless. Hannibal was still in Italy. His youngest brother would soon land in northern Italy with another army. And Rome's last invasion of Africa, during the First Punic War, had ended in disaster.\n\nThe leader of the Senate (*princeps senatus*), an elderly general famous for his cautious strategy, fought Scipio's plan hard. He may have been partly driven by jealousy of the young man's popularity.\n\nA compromise followed. Scipio received Sicily as his province, with permission to cross to Africa if he judged it best. But he could not call up soldiers in the usual way, only ask for volunteers. The core of his force was two legions (*legiones*) made up of survivors of Cannae who had been posted to Sicily. Scipio drilled his army for about a year, from units of 80 men up to the whole force. Meanwhile he gathered food, transport ships and warships to escort them. Modern historians estimate the army at 25,000 to 30,000 men."},{"id":"invasion-of-africa","title":"Fire in the Night: The Invasion of Africa","body":"In summer 204 BC Scipio's fleet landed about 20 km (12 miles) north of Utica, a major Carthaginian port. Masinissa, the Numidian prince allied to Rome, joined him. Scipio besieged Utica, but it held out, and two enemy armies camped nearby. One was Carthaginian, the other led by Masinissa's Numidian rival.\n\nOver the winter Scipio held peace talks. His envoys used each visit to study the enemy camps, their layout, their exits and their huts of reeds. One evening in 203 BC he marched out, split his army, and set the Numidian camp ablaze. In the chaos his men also fell on the Carthaginian camp, and thousands died in the dark.\n\nCarthage raised a new army, but at a place called the Great Plains its shaken troops broke at the first charge. Masinissa and Scipio's second-in-command then hunted down the rival Numidian king and captured him. Masinissa took over much of his kingdom.\n\nCarthage opened talks and recalled Hannibal from Italy. He landed with 15,000 to 20,000 veterans but few horses. His arrival restored Carthage's nerve, and it rejected a draft treaty that Rome's Senate had already approved."},{"id":"battle-of-zama","title":"The Battle of Zama, 202 BC","body":"In 202 BC, near Zama in what is now Tunisia, Scipio and Hannibal met to parley. Scipio refused Hannibal's terms, and battle followed. Hannibal probably had about 40,000 men, including only 4,000 cavalry, plus 80 war elephants. Scipio had around 29,000 to 30,000 men but more than 6,000 cavalry, many of them brought by Masinissa, the Numidian king allied to Rome.\n\nScipio made an unusual arrangement. Normally his infantry companies, the maniples (*manipuli*), stood staggered like a chessboard. Instead he lined them up one behind another, leaving open lanes filled with light skirmishers (*velites*). When the elephants charged, the Romans blared trumpets and banged their shields. Some elephants panicked and fled back through their own cavalry. Most ran down the lanes, where they were cut off and killed. The Roman horsemen on both wings seized the moment and chased the Carthaginian cavalry off the field.\n\nThe infantry fought it out line by line. The Romans broke Hannibal's first two lines in savage fighting, but his third line, his veterans from Italy, waited fresh. After a pause, the two sides clashed again \"with the greatest fire and fury\", as Polybius put it. Neither gave way until the Roman cavalry returned and struck the Carthaginian rear. Polybius counted 20,000 Carthaginians killed and as many captured, against 1,500 Roman dead. Hannibal escaped."},{"id":"peace-and-africanus","title":"Peace, Triumph and a New Name","body":"After Zama, Hannibal had only about 6,500 men left. He told Carthage's leaders to make peace on whatever terms they could get. Rome's terms, accepted in spring 201 BC, were harsh. Carthage lost its lands outside Africa and some within it. It had to pay 10,000 silver talents over 50 years, gave up its war elephants and kept only ten warships. It could not wage war outside Africa at all, nor inside Africa without Rome's permission. Masinissa's Numidian kingdom was confirmed. Carthage was now plainly subordinate to Rome, and in 146 BC Rome destroyed the city altogether.\n\nScipio returned home to celebrate a triumph (*triumphus*), the grand victory parade through Rome. He took the honorary surname (*agnomen*) Africanus, \"the African\". He deposited about 40 tonnes (123,000 Roman pounds) of silver in the treasury and gave each of his soldiers a cash bonus.\n\nHis popularity with ordinary Romans was enormous, and it made many aristocrats jealous and wary. Yet when admirers urged him to become consul for life and dictator, he refused. Later Roman writers praised this restraint, which stands in sharp contrast with the generals who seized power in the Republic's final century."},{"id":"sources-and-legend","title":"How Do We Know? Sources and the Scipio Legend","body":"Scipio wrote memoirs in Greek, but they are lost, along with a history by his son and a biography by a later Greek author. What survives comes mainly from Polybius, a Greek historian born around 200 BC who was sent to Rome as a hostage in 167 BC. He interviewed participants on both sides and is generally considered reliable. But he was a close friend of Scipio's relatives, and his main informant about Scipio was Scipio's own friend and second-in-command, so his picture may be flattering.\n\nA Roman historian writing two centuries later relied heavily on Polybius but is trusted less. Modern scholars note his weak grasp of warfare and call his account of Zama bizarrely at odds with Polybius. Other later writers are thought less reliable still.\n\nA legend grew around Scipio in his own lifetime. Tales spread of visions from the gods and dreams that foretold the future, and of Spaniards hailing him as king and god. Later versions even made him a son of Jupiter, Rome's chief god. Polybius disagreed, arguing that Scipio succeeded through careful planning and clear thinking. A famous story has Hannibal later ranking the greatest generals in conversation with Scipio, but historians consider the meeting apocryphal."}],"battle":{"name":"Zama","year":"202 BC","enemy":"Hannibal","sec":"battle-of-zama","intro":"Hannibal faces Scipio near Zama with 80 war elephants and his veterans from Italy. Open lanes for the elephants and hold your lines."},"timelines":[{"name":"Level 1: The Big Turning Points","blurb":"Four milestones from disaster to final victory.","events":[{"label":"Disaster at Cannae","when":"216 BC","y":-216,"fact":"At least 67,500 Romans were killed or captured at Cannae, but the young Scipio survived and rallied the stragglers.","sec":"survivor-of-cannae"},{"label":"Scipio storms New Carthage","when":"209 BC","y":-209,"fact":"Scipio sent a party across the lagoon at low tide and captured Carthage's main supply base in Spain.","sec":"new-carthage"},{"label":"Battle of Zama","when":"202 BC","y":-202,"fact":"Scipio defeated Hannibal near Zama, in what is now Tunisia, after the Roman cavalry struck the Carthaginian rear.","sec":"battle-of-zama"},{"label":"Rome destroys Carthage","when":"146 BC","y":-146,"fact":"Long after the harsh peace of 201 BC had made Carthage subordinate, Rome destroyed the city altogether.","sec":"peace-and-africanus"}]},{"name":"Level 2: From the Alps to the Peace","blurb":"Follow the war from Hannibal's invasion to Carthage's surrender.","events":[{"label":"Hannibal crosses the Alps into Italy","when":"218 BC","y":-218,"fact":"Hannibal's march from Spain over the Alps started the Second Punic War.","sec":"survivor-of-cannae"},{"label":"Scipio elected aedile","when":"213 BC","y":-213,"fact":"A tribune objected that Scipio was too young to be aedile, the official for streets and festivals, but the crowd's enthusiasm made him back down.","sec":"survivor-of-cannae"},{"label":"Scipio's father and uncle killed in Spain","when":"211 BC","y":-211,"fact":"The brothers split their forces to attack three enemy armies at once and were each beaten separately.","sec":"command-in-spain"},{"label":"Battle of the Metaurus","when":"207 BC","y":-207,"fact":"Claudius Nero's flank attack destroyed the army of Hannibal's brother beside the Metaurus river in north-east Italy.","sec":"battle-of-the-metaurus"},{"label":"Scipio lands in Africa near Utica","when":"Summer 204 BC","y":-204,"fact":"Scipio's fleet landed about 20 km (12 miles) north of Utica, a major Carthaginian port, and Masinissa joined him.","sec":"invasion-of-africa"},{"label":"Carthage accepts Rome's peace terms","when":"Spring 201 BC","y":-201,"fact":"Carthage had to pay 10,000 silver talents over 50 years and keep only ten warships.","sec":"peace-and-africanus"}]},{"name":"Level 3: Scipio's Rise Step by Step","blurb":"Eight moments in the career of Scipio and the story of how we know it.","events":[{"label":"Cavalry clash on the river Ticinus","when":"218 BC","y":-218,"fact":"One ancient account says young Scipio saved his surrounded father here; other writers credited an unnamed slave.","sec":"survivor-of-cannae"},{"label":"Scipio given the Spanish command","when":"210 BC","y":-210,"fact":"At about 25, Scipio became the first Roman given a consul's military authority without first serving as consul.","sec":"command-in-spain"},{"label":"Battle of Baecula","when":"208 BC","y":-208,"fact":"Scipio won the battle, but Hannibal's brother slipped away with most of his army and headed for Italy.","sec":"conquest-of-spain"},{"label":"Decisive victory at Ilipa","when":"206 BC","y":-206,"fact":"At Ilipa, north of modern Seville, Scipio routed the remaining Carthaginian forces and drove them from Spain.","sec":"conquest-of-spain"},{"label":"Scipio serves as consul at 31","when":"205 BC","y":-205,"fact":"The normal minimum age for consul was 42, yet Scipio was elected amid wild enthusiasm.","sec":"consul-at-thirty-one"},{"label":"Enemy camps burned at night","when":"203 BC","y":-203,"fact":"Scipio set the Numidian camp's reed huts ablaze and then fell on the Carthaginian camp, killing thousands in the dark.","sec":"invasion-of-africa"},{"label":"Scipio's triumph as Africanus","when":"After the peace of 201 BC","y":-201,"fact":"Scipio paraded through Rome, took the surname Africanus and deposited about 40 tonnes (123,000 Roman pounds) of silver in the treasury.","sec":"peace-and-africanus"},{"label":"Polybius sent to Rome as a hostage","when":"167 BC","y":-167,"fact":"Polybius, the Greek historian who is our main surviving source on Scipio, came to Rome as a hostage.","sec":"sources-and-legend"}]}],"matches":[{"name":"People and Names","blurb":"Match each name to the role it played in the war.","pairs":[["Hannibal","Carthaginian general who marched from Spain over the Alps into Italy"],["Claudius Nero","Consul who marched north in secret to win at the Metaurus"],["Masinissa","Numidian prince who left Carthage to become Rome's best ally"],["Polybius","Greek historian, once a hostage in Rome; our most reliable source"],["Africanus","Honorary surname Scipio took after his victory over Carthage"]],"secs":["survivor-of-cannae","battle-of-the-metaurus","conquest-of-spain","sources-and-legend","peace-and-africanus"]},{"name":"Roman Offices and Terms","blurb":"Match each Roman term to its meaning.","pairs":[["Consul","One of two magistrates elected each year to lead Rome's armies"],["Aedile","Official who looked after the city's streets and festivals"],["Military tribune","Junior officer; the rank Scipio held at Cannae"],["Velites","Light skirmishers who filled the open lanes at Zama"],["Princeps senatus","Leader of the Senate, who fought Scipio's plan to invade Africa"]],"secs":["survivor-of-cannae","survivor-of-cannae","survivor-of-cannae","battle-of-zama","consul-at-thirty-one"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Imperium pro consule","A consul’s full military authority, given to Scipio"],["Senatus","Rome’s council of elder statesmen"],["Legiones","The army units of Cannae survivors that Scipio led"],["Manipuli","Infantry companies, usually set like a chessboard"],["Triumphus","The grand victory parade through Rome"],["Agnomen","An honorary surname, like Africanus"]],"secs":["command-in-spain","command-in-spain","consul-at-thirty-one","battle-of-zama","peace-and-africanus","peace-and-africanus"]}],"decks":[{"name":"Italy and Spain","blurb":"From Cannae to the conquest of Spain and the Metaurus.","cards":[{"claim":"At Cannae at least 67,500 Romans were killed or captured.","answer":true,"why":"The chapter gives at least 67,500 Romans killed or captured at Cannae, including Scipio's future father-in-law, a consul.","sec":"survivor-of-cannae"},{"claim":"Scipio had already served as consul before he received the Spanish command.","answer":false,"why":"Scipio had held none of Rome's senior offices. He was the first Roman given a consul's military authority without first serving as consul.","sec":"command-in-spain"},{"claim":"The lagoon guarding New Carthage's northern side could be waded at low tide.","answer":true,"why":"Scipio sent a party across the lagoon at low tide while the walls were under attack.","sec":"new-carthage"},{"claim":"At New Carthage Scipio told his troops that the war god Mars had promised him help in a vision.","answer":false,"why":"Scipio claimed the sea god Neptune had promised him help, feeding the legend that he was a favourite of the gods.","sec":"new-carthage"},{"claim":"At Baecula Scipio destroyed the whole army of Hannibal's brother.","answer":false,"why":"Scipio won the battle, but his opponent slipped away with most of his army, crossed the Pyrenees and headed for Italy.","sec":"conquest-of-spain"},{"claim":"Italica, a town Scipio founded near Seville, later became the birthplace of three Roman emperors.","answer":true,"why":"Scipio founded Italica about 9 km northwest of Seville, and three Roman emperors were later born there.","sec":"conquest-of-spain"},{"claim":"Claudius Nero marched north with 7,000 picked men without waiting for the Senate's approval.","answer":true,"why":"After reading the captured letters, Claudius Nero marched north in secret, gathering volunteers and supplies on the way.","sec":"battle-of-the-metaurus"},{"claim":"After the Metaurus, Hannibal marched straight on Rome.","answer":false,"why":"After his brother's head was thrown into his camp, Hannibal withdrew to Bruttium, the 'toe' of Italy.","sec":"battle-of-the-metaurus"}]},{"name":"Africa, Zama and the Sources","blurb":"From the debate in the Senate to the peace and the legend.","cards":[{"claim":"Scipio was elected consul at 31, although the normal minimum age was 42.","answer":true,"why":"He was elected consul for 205 BC amid wild enthusiasm at 31, well below the usual minimum age of 42.","sec":"consul-at-thirty-one"},{"claim":"The core of Scipio's army in Sicily was two legions of Cannae survivors.","answer":true,"why":"Scipio could only ask for volunteers, and his core force was two legions of Cannae survivors posted to Sicily.","sec":"consul-at-thirty-one"},{"claim":"In 204 BC Scipio's fleet landed about 20 km (12 miles) north of Carthage itself.","answer":false,"why":"The fleet landed about 20 km (12 miles) north of Utica, a major Carthaginian port, which Scipio then besieged.","sec":"invasion-of-africa"},{"claim":"During winter peace talks, Scipio's envoys secretly studied the enemy camps and their reed huts.","answer":true,"why":"The envoys used each visit to study the camps' layout, exits and huts of reeds, which Scipio later set ablaze.","sec":"invasion-of-africa"},{"claim":"At Zama Hannibal had more cavalry than Scipio.","answer":false,"why":"Hannibal had only 4,000 cavalry, while Scipio had more than 6,000, many of them brought by Masinissa.","sec":"battle-of-zama"},{"claim":"Under the peace of 201 BC Carthage had to pay 10,000 silver talents over 50 years.","answer":true,"why":"Carthage also gave up its war elephants, kept only ten warships and could not wage war outside Africa.","sec":"peace-and-africanus"},{"claim":"After Zama Scipio accepted his admirers' offer to make him dictator for life.","answer":false,"why":"Scipio refused to become consul for life and dictator, a restraint later Roman writers praised.","sec":"peace-and-africanus"},{"claim":"Scipio's own memoirs, written in Greek, survive and are our main source about him.","answer":false,"why":"His memoirs are lost. What survives comes mainly from Polybius, the Greek historian.","sec":"sources-and-legend"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Baecula","Ilipa","Utica","Gades"],"odd":2,"why":"Baecula, Ilipa and Gades are in southern Spain, which Scipio won from Carthage; Utica is a Carthaginian port in Africa that he besieged in 204 BC.","sec":"conquest-of-spain"},{"items":["Ilipa","Metaurus","Baecula","New Carthage"],"odd":1,"why":"Scipio won at Baecula, Ilipa and New Carthage, all in Spain; the Metaurus was won in Italy by Claudius Nero and his fellow consul.","sec":"battle-of-the-metaurus"},{"items":["Aedile","Dictator","Military tribune","Consul"],"odd":1,"why":"Scipio served as military tribune, aedile and consul. When admirers urged him to become dictator, he refused.","sec":"peace-and-africanus"},{"items":["Pay 10,000 silver talents","Give up its war elephants","No wars outside Africa","Surrender every warship"],"odd":3,"why":"The first three were terms of the peace of 201 BC. Carthage did not lose every warship: it kept ten.","sec":"peace-and-africanus"},{"items":["Reed-hut camps set ablaze","Elephants ran down open lanes","Trumpets blared, shields banged","Cavalry struck the enemy rear"],"odd":0,"why":"Three happened in the battle of Zama in 202 BC. The burning of the reed-hut camps was Scipio's night attack in 203 BC.","sec":"battle-of-zama"},{"items":["Sword-point oath after Cannae","Claudius Nero's secret march north","Hannibal ranking the great generals","Scipio as a son of Jupiter"],"odd":1,"why":"The oath story, Hannibal's ranking of generals and Scipio's divine birth are legends historians doubt. Claudius Nero's march north is told as solid history.","sec":"sources-and-legend"},{"items":["Modern Cartagena","Carthage's last stronghold in Spain","Carthage's main supply base","Guarded by a northern lagoon"],"odd":1,"why":"Three describe New Carthage, stormed in 209 BC. Carthage's last stronghold in Spain was Gades, modern Cádiz.","sec":"new-carthage"}]}],"whos":[{"name":"Commanders at War","blurb":"Generals who fought in Italy and Spain.","people":[{"name":"Scipio","options":["Hannibal","Scipio","Claudius Nero","Masinissa"],"clues":["Voters made me aedile in 213 BC, though a tribune said I was too young.","I served as a military tribune at Cannae and rallied the stragglers.","At about 25 I received a consul's authority without ever having been consul.","I stormed New Carthage after telling my troops that Neptune had promised me help."],"sec":"command-in-spain"},{"name":"Claudius Nero","options":["Scipio","Masinissa","Claudius Nero","Hannibal"],"clues":["I had a dead enemy commander's head thrown into his brother's camp.","In 207 BC I was the consul shadowing Hannibal in the far south of Italy.","Without waiting for the Senate's approval, I marched 7,000 picked men north in secret.","My flank attack won the battle beside the Metaurus river."],"sec":"battle-of-the-metaurus"},{"name":"Hannibal","options":["Claudius Nero","Scipio","Masinissa","Hannibal"],"clues":["Recalled from Italy, I landed in Africa with 15,000 to 20,000 veterans.","After my defeat I told Carthage's leaders to make peace on whatever terms they could get.","Two of my brothers helped beat and kill Scipio's father and uncle in Spain.","In 218 BC I marched an army from Spain over the Alps into Italy."],"sec":"survivor-of-cannae"}]},{"name":"Africa and After","blurb":"An ally, a victor and the historian who told their story.","people":[{"name":"Masinissa","options":["Hannibal","Masinissa","Claudius Nero","Scipio"],"clues":["As a young Numidian prince I fought for Carthage in Spain.","When a rival drove me from my kingdom, I joined Rome.","I helped hunt down the rival Numidian king and took over much of his kingdom.","Many of the horsemen who gave Rome its cavalry edge at Zama were mine."],"sec":"conquest-of-spain"},{"name":"Scipio","options":["Masinissa","Hannibal","Claudius Nero","Scipio"],"clues":["In Sicily I drilled an army built around Cannae survivors for about a year.","My envoys studied enemy camps of reed huts, which I later set ablaze.","Admirers urged me to become consul for life and dictator, but I refused.","After beating Hannibal at Zama, I took the surname Africanus."],"sec":"peace-and-africanus"},{"name":"Polybius","options":["Scipio","Claudius Nero","Polybius","Masinissa"],"clues":["My main informant about Scipio was his friend and second-in-command.","I counted 20,000 Carthaginians killed at Zama against 1,500 Roman dead.","I argued that Scipio won through careful planning, not the favour of the gods.","Born a Greek around 200 BC, I was sent to Rome as a hostage in 167 BC."],"sec":"sources-and-legend"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Cannae","lat":41.29638889,"lon":16.15166667,"why":"In southern Italy, where at least 67,500 Romans were killed or captured in 216 BC and the young Scipio survived as a military tribune.","sec":"survivor-of-cannae"},{"name":"New Carthage","lat":37.6019,"lon":-0.9842,"why":"Carthage's main supply base in Spain, stormed by Scipio in 209 BC across a lagoon waded at low tide.","sec":"new-carthage"},{"name":"Ilipa","lat":37.51666667,"lon":-5.96666667,"why":"North of modern Seville, where Scipio's decisive victory in 206 BC drove the Carthaginians from Spain.","sec":"conquest-of-spain"},{"name":"Metaurus","lat":43.8292,"lon":13.0546,"why":"River in north-east Italy where Claudius Nero's flank attack destroyed the army of Hannibal's brother in 207 BC.","sec":"battle-of-the-metaurus"},{"name":"Sicily","lat":37.5,"lon":14,"why":"Scipio's province in 205 BC, where he drilled his army of volunteers and Cannae survivors before crossing to Africa.","sec":"consul-at-thirty-one"},{"name":"Utica","lat":37.05694444,"lon":10.06194444,"why":"Major Carthaginian port that Scipio besieged after landing in Africa in 204 BC; it held out.","sec":"invasion-of-africa"},{"name":"Zama","lat":36.112,"lon":9.2856,"why":"In what is now Tunisia, where Scipio defeated Hannibal in 202 BC and ended the war.","sec":"battle-of-zama"}]}],"quizPool":{"1":[{"q":"What rank did Scipio hold at the Battle of Cannae in 216 BC?","options":["Praetor","Aedile","Military tribune","Consul"],"a":2,"level":1,"why":"Scipio was a military tribune, a junior officer, at Cannae. He survived the disaster and rallied the stragglers.","sec":"survivor-of-cannae"},{"q":"Which province did Scipio receive as consul, with permission to cross to Africa?","options":["Gaul","Sicily","Spain","Sardinia"],"a":1,"level":1,"why":"As a compromise, Scipio got Sicily as his province and could cross to Africa if he judged it best.","sec":"consul-at-thirty-one"},{"q":"Which city, the Carthaginians' main supply base in Spain, did Scipio storm in 209 BC?","options":["Saguntum","New Carthage","Utica","Gades"],"a":1,"level":1,"why":"Instead of chasing the three Carthaginian armies, Scipio struck at New Carthage, modern Cartagena. It was the enemy's main supply base.","sec":"new-carthage"},{"q":"What honorary surname did Scipio take after defeating Carthage?","options":["Cunctator","Africanus","Magnus","Augustus"],"a":1,"level":1,"why":"Scipio took the surname Africanus, \"the African\". He also celebrated a triumph, Rome's grand victory parade.","sec":"peace-and-africanus"},{"q":"How did the Romans learn of the plan for Hannibal's brother to join Hannibal in 207 BC?","options":["Spies in Carthage sent word","They captured his messengers","Masinissa warned them","A Carthaginian deserter told them"],"a":1,"level":1,"why":"The Romans captured the messengers carrying his letters and learned of the plan to meet Hannibal in central Italy. The letters reached the consul Claudius Nero.","sec":"battle-of-the-metaurus"},{"q":"Over which mountain range did Hannibal march his army from Spain into Italy in 218 BC?","options":["The Alps","The Apennines","The Balkans","The Atlas Mountains"],"a":0,"level":1,"why":"Hannibal led his army from Spain over the Alps and into Italy, starting the Second Punic War. Among the Romans who rode out to stop him was the teenage Scipio.","sec":"survivor-of-cannae"},{"q":"How old was Scipio when he was elected consul for 205 BC?","options":["31","25","50","42"],"a":0,"level":1,"why":"Scipio was 31, well below the normal minimum age of 42 for the consulship. He was elected amid wild enthusiasm after returning from Spain.","sec":"consul-at-thirty-one"},{"q":"In what year did Scipio and Hannibal meet near Zama?","options":["202 BC","216 BC","146 BC","207 BC"],"a":0,"level":1,"why":"In 202 BC the two generals met near Zama, in modern Tunisia. Scipio refused Hannibal's terms, and battle followed.","sec":"battle-of-zama"},{"q":"Which Greek historian is the main surviving source for Scipio's career?","options":["Herodotus","Thucydides","Polybius","Xenophon"],"a":2,"level":1,"why":"Most of what we know comes from Polybius, who was sent to Rome as a hostage in 167 BC. He interviewed participants on both sides.","sec":"sources-and-legend"},{"q":"Which major Carthaginian port did Scipio besiege after landing in Africa in 204 BC?","options":["Utica","Gades","Syracuse","New Carthage"],"a":0,"level":1,"why":"Scipio landed about 20 km north of Utica and besieged it, but the city held out. Two enemy armies camped nearby.","sec":"invasion-of-africa"},{"q":"In what year did Rome finally destroy the city of Carthage?","options":["146 BC","202 BC","201 BC","218 BC"],"a":0,"level":1,"why":"After the peace of 201 BC Carthage was plainly subordinate to Rome, and Rome destroyed the city altogether in 146 BC.","sec":"peace-and-africanus"},{"q":"About how old was Scipio when he received the Spanish command in 210 BC?","options":["About 31","About 25","About 42","About 18"],"a":1,"level":1,"why":"The people's assembly gave the Spanish command to Scipio when he was about 25. Normally only a man who had held a senior office could lead an army in his own right.","sec":"command-in-spain"},{"q":"Beside which river was the army of Hannibal's brother trapped and destroyed in 207 BC?","options":["The Po","The Ticinus","The Tiber","The Metaurus"],"a":3,"level":1,"why":"After a night retreat, the Carthaginian army was trapped beside the Metaurus in north-east Italy. Hannibal's brother died in the battle that followed.","sec":"battle-of-the-metaurus"},{"q":"At which battle in 206 BC did Scipio deliver the decisive blow against the Carthaginians in Spain?","options":["Cannae","Zama","Ilipa","Baecula"],"a":2,"level":1,"why":"At Ilipa, north of modern Seville, Scipio routed the remaining Carthaginian forces and drove them from the peninsula.","sec":"conquest-of-spain"},{"q":"How did Scipio destroy the two enemy armies camped near Utica in 203 BC?","options":["He starved them out with a long blockade","He flooded their camps by diverting a river","He set their camps ablaze in a night attack","He drove war elephants through their lines"],"a":2,"level":1,"why":"Scipio split his army one evening and set the Numidian camp on fire. In the chaos his men also fell on the Carthaginian camp, and thousands died in the dark.","sec":"invasion-of-africa"},{"q":"What happened to Scipio's father and uncle in Spain in 211 BC?","options":["They were taken prisoner and later ransomed","They captured New Carthage and were celebrated","They split their forces, were beaten separately and killed","They were recalled to Rome in disgrace"],"a":2,"level":1,"why":"The brothers divided their forces to attack three enemy armies at once, and each was defeated and killed. Two of the victorious Carthaginian commanders were Hannibal's own brothers.","sec":"command-in-spain"},{"q":"In which arm did Scipio outnumber Hannibal at Zama, despite having fewer men overall?","options":["Cavalry","War elephants","Heavy infantry","Warships"],"a":0,"level":1,"why":"Scipio had more than 6,000 cavalry, many brought by Masinissa, against only 4,000 on Hannibal's side. Hannibal still had more men overall, about 40,000.","sec":"battle-of-zama"},{"q":"Which Numidian prince, who had once fought for Carthage in Spain, became Rome's most valuable ally?","options":["Masinissa","Hiero","Jugurtha","Juba"],"a":0,"level":1,"why":"Masinissa joined Rome after his rival drove him from his kingdom. He became Rome's most valuable ally.","sec":"conquest-of-spain"},{"q":"Which god did Scipio tell his troops had promised him help in a vision at New Carthage?","options":["Apollo","Neptune","Mars","Jupiter"],"a":1,"level":1,"why":"Scipio claimed the sea god Neptune had promised him help. The story fed a growing legend that Scipio was a favourite of the gods.","sec":"new-carthage"},{"q":"Later versions of the Scipio legend made him the son of which god?","options":["Hercules","Mars","Neptune","Jupiter"],"a":3,"level":1,"why":"Later legend made Scipio a son of Jupiter, Rome's chief god. Even in his lifetime, tales spread of divine visions and prophetic dreams.","sec":"sources-and-legend"},{"q":"After Zama, Scipio took the agnomen Africanus. What is an agnomen?","options":["An honorary surname","A military rank","A Roman province","A crown of laurel"],"a":0,"level":1,"why":"Africanus means “the African”, for his victory over Carthage.","sec":"peace-and-africanus"},{"q":"At Zama, who filled the open lanes between the Roman maniples?","options":["Light skirmishers (velites)","War elephants","Numidian horsemen","Veteran triarii"],"a":0,"level":1,"why":"Most of Hannibal’s elephants ran down the lanes, where they were cut off and killed.","sec":"battle-of-zama"},{"q":"What was the triumphus Scipio celebrated in 201 BC?","options":["The grand victory parade through Rome","A naval review at Ostia","A feast for the Senate","A games festival in Carthage"],"a":0,"level":1,"why":"He also deposited about 40 tonnes of silver in the treasury.","sec":"peace-and-africanus"}],"2":[{"q":"In 213 BC Scipio was elected aedilis. What did an aedile do?","options":["Looked after the city’s streets and festivals","Commanded a legion","Led the Senate","Judged lawsuits"],"a":0,"level":2,"why":"A tribune objected that Scipio was too young, but backed down before the crowd.","sec":"survivor-of-cannae"},{"q":"Who was the princeps senatus who fought Scipio’s plan to invade Africa?","options":["The leader of the Senate, an elderly cautious general","The youngest senator","The chief priest of Jupiter","The consul of 205 BC"],"a":0,"level":2,"why":"He may have been partly driven by jealousy of Scipio’s popularity.","sec":"consul-at-thirty-one"},{"q":"How did Scipio change the usual layout of his manipuli at Zama?","options":["He lined them up one behind another, leaving open lanes","He packed them into one deep block","He hid them behind the cavalry","He spread them out in a single long line"],"a":0,"level":2,"why":"Normally the maniples stood staggered like a chessboard.","sec":"battle-of-zama"},{"q":"What scene, a favourite of Renaissance painters, is known as the \"Continence of Scipio\"?","options":["Scipio freeing Spanish hostages without conditions","Scipio refusing to become consul for life and dictator","Scipio rejecting Hannibal's terms before Zama","Scipio returning a beautiful captive untouched to her fiancé","Scipio sparing the citizens of Gades after its surrender"],"a":3,"level":2,"why":"In this tale from a much later writer, Scipio gave a beautiful captive back unharmed to her Spanish fiancé. Scipio also treated the 300 Spanish hostages in New Carthage generously.","sec":"new-carthage"},{"q":"According to one ancient account, what did young Scipio do in the cavalry clash on the river Ticinus?","options":["Carried news of the defeat to Rome","Led the charge that won the battle","Saved his surrounded father's life","Captured several of Hannibal's elephants","Killed a Carthaginian general in single combat"],"a":2,"level":2,"why":"One account says Scipio rescued his father when enemy horsemen surrounded him. Other writers gave the credit to an unnamed slave.","sec":"survivor-of-cannae"},{"q":"How do historians regard the famous story of Hannibal ranking the greatest generals in conversation with Scipio?","options":["They date it to the parley before Zama","They accept it because Polybius reports it","They consider the meeting apocryphal","They trace it to Scipio's lost memoirs","They think the speaker was Masinissa"],"a":2,"level":2,"why":"Historians think this meeting never happened. It belongs with the many legends that grew around Scipio.","sec":"sources-and-legend"},{"q":"Who made up the core of the army Scipio took to Africa?","options":["Veterans of the victory at the Metaurus","Numidian horsemen sent by Masinissa","Fresh conscripts called up in Rome","Spanish tribesmen recruited after Ilipa","Two legions of Cannae survi
