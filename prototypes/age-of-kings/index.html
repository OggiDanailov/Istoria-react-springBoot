racuse","Naples","Locri"],"a":0,"level":2,"why":"Rome stepped in to defend Thurii on the Gulf of Taranto. Tarentum wanted no Roman meddling in its backyard.","sec":"tarentum-calls-for-help"},{"q":"Which Carthaginian fortress on Sicily's western tip did Pyrrhus fail to capture?","options":["Lilybaeum","Agrigentum","Drepana","Messana","Panormus"],"a":0,"level":2,"why":"Pyrrhus could not take Lilybaeum, Carthage's great fortress on Sicily's western tip. The war there ground to a stalemate.","sec":"pyrrhus-in-sicily"},{"q":"What do modern scholars think was the likelier cause of the last plebeian secession?","options":["A quarrel over who could be consul","Demands for citizenship by Latin allies","Who would get newly won public land","Fear of an invasion by Pyrrhus","Grain shortages in the city"],"a":2,"level":2,"why":"The Third Samnite War had won Rome large tracts of public land, and rural plebeians wanted a say in its distribution. Scholars doubt the traditional story about debt.","sec":"why-the-plebs-seceded"},{"q":"Why did Rome turn its attention south and across the sea rather than north?","options":["Northern Italy had no valuable land","Carthage offered Rome land in Africa","The Senate feared revolts in Etruria","Pyrrhus still held lands in the north","The Alps blocked the way and the Gauls were too strong"],"a":4,"level":2,"why":"The Alps blocked the way north, and Rome was not yet ready to take on the Gauls living beneath them. So it looked south, toward Sicily and Carthage.","sec":"italy-united-264-bc"},{"q":"Why did Pyrrhus march north into Latium after his victory at Heraclea?","options":["To meet a Carthaginian fleet","To seize Capua's grain stores","To link up with the Etruscans","To recruit Gallic warriors","To besiege the city of Rome"],"a":2,"level":2,"why":"Pyrrhus hoped to join forces with the Etruscans, who were still fighting Rome. But Rome won its war in Etruria, and Pyrrhus pulled back south for the winter.","sec":"heraclea-and-asculum"},{"q":"According to tradition, on which hill did the plebeians gather during their final secession around 287 BC?","options":["The Palatine","The Quirinal","The Capitoline","The Aventine","The Janiculum"],"a":4,"level":2,"why":"The plebeians traditionally gathered on the Janiculum, a hill across the River Tiber. Walking out left Rome without workers or soldiers.","sec":"lex-hortensia"}],"3":[{"q":"How did the Hortensian Law go further than the earlier laws of 449 and 339 BC?","options":["It gave the Senate a veto over tribunes","It removed the need for Senate approval","It created the office of tribune","It first let plebeians become consuls","It abolished patrician status entirely","It moved voting into military centuries"],"a":1,"level":3,"why":"The earlier laws still required the Senate to approve plebeian decisions; the lex Hortensia removed that requirement entirely. This made the people and their tribunes major players in Roman politics.","sec":"lex-hortensia"},{"q":"What did the battle at Populonia in 282 BC accomplish?","options":["It gave Rome its first win over Pyrrhus","It crushed the Gauls south of the Alps","It brought Tarentum under Roman rule","It ended the Third Samnite War","It secured Rome's first foothold in Sicily","It ended the last traces of Etruscan power"],"a":5,"level":3,"why":"The battle at the coastal Etruscan town of Populonia finished off the last traces of Etruscan power in the region. The Greek south of Italy, however, still lay beyond Rome's control.","sec":"rome-after-the-samnite-wars"},{"q":"The Plebeian Council voted by tribal districts, never more than 35. How many of them did rural landowners control?","options":["35","29","17","21","31","4"],"a":1,"level":3,"why":"Rural landowners controlled 29 districts, so they, not city crowds, held most of the voting power. This is one reason historians doubt the story of urban debt riots.","sec":"why-the-plebs-seceded"},{"q":"Over which years was the First Punic War fought?","options":["275–241 BC","264–241 BC","241–218 BC","264–218 BC","264–146 BC","281–264 BC"],"a":1,"level":3,"why":"The First Punic War began in 264 BC and lasted until 241 BC. That same year, 264 BC, Rome crushed the last resistance in Etruria.","sec":"italy-united-264-bc"},{"q":"After which battle, according to ancient tradition, did Pyrrhus exclaim, \"Another such victory and we are lost!\"?","options":["Sentinum, 295 BC","Asculum, 279 BC","Lilybaeum, 277 BC","Heraclea, 280 BC","Populonia, 282 BC","Beneventum, 275 BC"],"a":1,"level":3,"why":"Pyrrhus beat the Romans again at Asculum in 279 BC, but his army suffered terribly. Rather than press on against Rome, he then turned to Sicily.","sec":"heraclea-and-asculum"},{"q":"How do accounts describe the outcome of Pyrrhus's final battle with Rome at Beneventum in 275 BC?","options":["All agree on a crushing Roman win","As another costly win for Pyrrhus","As a Roman victory or as a draw","As a battle decided by Carthage","As the battle where Pyrrhus died","As a Roman defeat ending in a truce"],"a":2,"level":3,"why":"Some accounts call Beneventum a Roman victory, others a draw. Either way, it forced Pyrrhus onto the defensive.","sec":"beneventum-and-withdrawal"},{"q":"What oddity did the Hortensian Law contain?","options":["It let only city residents cast votes","It banned all voting in wartime","It limited tribunes to a single term","It banned votes on market days","It banned votes during religious festivals","It required Senate approval for war votes"],"a":3,"level":3,"why":"The ban on market-day votes made it harder for country farmers, who came to town on those days, to vote. This is odd given that rural plebeians likely drove the reform.","sec":"why-the-plebs-seceded"},{"q":"What did the lex Hortensia of 287 BC do?","options":["Made every decision of the Plebeian Council binding on all citizens","Gave the plebeians their own consul","Cancelled all debts","Founded new colonies"],"a":0,"level":3,"why":"It removed the need for the Senate to approve plebeian decisions, ending the Conflict of the Orders.","sec":"lex-hortensia"},{"q":"Some communities received civitas sine suffragio. What was it?","options":["Citizenship without the right to vote","Full Roman citizenship","Freedom from military service","The right to found colonies"],"a":0,"level":3,"why":"It was one of Rome’s tools for absorbing conquered peoples.","sec":"how-rome-ruled-italy"}]},"chronicleMaps":[{"id":"pyrrhus-italy","sec":"heraclea-and-asculum","title":"Pyrrhus in Italy","caption":"Pyrrhus crossed from Epirus to Tarentum, the strongest Greek city of the south. He won at Heraclea (280 BC) and Asculum (279 BC), and was stopped at Beneventum (275 BC). His crossing is drawn only roughly.","bounds":{"latMin":38,"latMax":42.1,"lonMin":12.3,"lonMax":18.7},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"r","dy":-4},{"name":"Beneventum","lat":41.133,"lon":14.783,"kind":"battle","side":"l","dy":-6},{"name":"Asculum","lat":41.216,"lon":15.558,"kind":"battle","side":"r"},{"name":"Heraclea","lat":40.22,"lon":16.67,"kind":"battle","side":"l"},{"name":"Tarentum","lat":40.471,"lon":17.243,"side":"r","dy":-4},{"name":"Thurii","lat":39.716,"lon":16.497,"side":"l"},{"name":"Locri","lat":38.24,"lon":16.26,"side":"l"},{"name":"Naples","latin":"Neapolis","lat":40.836,"lon":14.249,"side":"l","dy":8}],"peoples":[{"name":"Samnites","lat":41.75,"lon":14.6},{"name":"Lucanians","lat":40.45,"lon":15.75},{"name":"Bruttians","lat":38.95,"lon":16.35}],"routes":[{"pts":[[40.15,18.65],[40.3,17.9],[40.43,17.32]]}]},{"id":"pyrrhus-sicily","sec":"pyrrhus-in-sicily","title":"Pyrrhus in Sicily","caption":"Pyrrhus came to help Syracuse against Carthage, which held the west of the island. He won most of Sicily but could not take Lilybaeum, supplied by sea from Africa.","bounds":{"latMin":36.6,"latMax":38.4,"lonMin":12.1,"lonMax":15.8},"places":[{"name":"Syracuse","lat":37.075,"lon":15.286,"side":"l"},{"name":"Lilybaeum","lat":37.8,"lon":12.44,"kind":"battle","side":"r"}],"peoples":[{"name":"Carthaginian west","lat":37.55,"lon":13},{"name":"Greek cities","lat":37.35,"lon":14.7}],"edges":[{"text":"Carthage, in North Africa","dir":"s","km":230,"lon":13.45}]}],"keyFacts":{"description":"Key facts for this chapter, written by hand from the chapter text. Every entry links to the section that explains it.","people":[{"name":"Quintus Hortensius","text":"Plebeian dictator whose law of 287 BC ended the Conflict of the Orders.","sec":"lex-hortensia"},{"name":"Pyrrhus","text":"King of Epirus who won costly victories over Rome, then went home after Beneventum.","sec":"heraclea-and-asculum"},{"name":"Livy","text":"The Roman historian whose tradition blamed debt for the last secession.","sec":"why-the-plebs-seceded"}],"dates":[{"when":"295 BC","text":"Sentinum: Rome beats the Samnites, Gauls, Etruscans and Umbrians.","sec":"rome-after-the-samnite-wars"},{"when":"287 BC","text":"The last secession and the Hortensian law.","sec":"lex-hortensia"},{"when":"282 BC","text":"The battle of Populonia ends Etruscan power.","sec":"rome-after-the-samnite-wars"},{"when":"281 BC","text":"Tarentum rejects Rome’s ultimatum; Pyrrhus is called in.","sec":"tarentum-calls-for-help"},{"when":"280 BC","text":"Pyrrhus wins at Heraclea.","sec":"heraclea-and-asculum"},{"when":"279 BC","text":"Pyrrhus wins again at Asculum: a “Pyrrhic victory”.","sec":"heraclea-and-asculum"},{"when":"275 BC","text":"Beneventum: Pyrrhus is forced onto the defensive and sails home.","sec":"beneventum-and-withdrawal"},{"when":"272 BC","text":"Tarentum falls to Rome; Pyrrhus is killed at Argos.","sec":"beneventum-and-withdrawal"},{"when":"264 BC","text":"The last Etruscan resistance is crushed; the First Punic War begins.","sec":"italy-united-264-bc"}],"terms":[{"latin":"coloniae","english":"colonies of Roman citizens","sec":"rome-after-the-samnite-wars"},{"latin":"Via Appia","english":"the Appian Way","sec":"rome-after-the-samnite-wars"},{"latin":"secessio","english":"a mass walkout of the plebs","sec":"lex-hortensia"},{"latin":"lex Hortensia","english":"the Hortensian law of 287 BC","sec":"lex-hortensia"},{"latin":"plebiscitum","english":"a decision of the Plebeian Council","sec":"lex-hortensia"},{"latin":"concilium plebis","english":"the Plebeian Council","sec":"lex-hortensia"},{"latin":"tribus","english":"tribal voting districts","sec":"why-the-plebs-seceded"},{"latin":"ager publicus","english":"public land","sec":"why-the-plebs-seceded"},{"latin":"nundinae","english":"market days","sec":"why-the-plebs-seceded"},{"latin":"Magna Graecia","english":"“Great Greece”: the Greek south","sec":"tarentum-calls-for-help"},{"latin":"praesidium","english":"a garrison","sec":"beneventum-and-withdrawal"},{"latin":"civitas sine suffragio","english":"citizenship without the vote","sec":"how-rome-ruled-italy"},{"latin":"socii","english":"Rome’s allies","sec":"how-rome-ruled-italy"},{"latin":"Punici","english":"the Carthaginians, hence “Punic”","sec":"italy-united-264-bc"}]}},{"id":"first-punic-war","era":"middle-republic","short":"The First Punic War","title":"The First Punic War","period":"264-241 BC","sources":["First Punic War","Corvus (boarding device)","Battle of the Aegates"],"briefing":{"title":"Sicily, 264 BC","paragraphs":["Two great powers face each other across the western Mediterranean. Rome now rules the Italian peninsula south of the River Arno. Carthage, a rich trading city in what is now Tunisia, controls the North African coast, southern Spain, Sardinia, Corsica and western Sicily.","Old friends, they are about to become enemies. At Messana, on Sicily's tip facing Italy, mercenaries beg both for help. Rome, which has almost no navy, votes for war. Ahead lie 23 years of fighting, the greatest naval war of the ancient world, with Sicily as the prize."]},"sections":[{"id":"rome-and-carthage","title":"Two Powers of the Western Sea","body":"In the early 3rd century BC, two powers dominated the western Mediterranean. Rome had spent a century conquering its neighbours. By 272 BC it controlled the Italian peninsula south of the River Arno, which flows past Pisa.\n\nAcross the sea stood Carthage (*Carthago*), a great trading city in what is now Tunisia. Its empire stretched along the North African coast and into southern Spain. It also held the islands of Sardinia and Corsica and the western half of Sicily.\n\nThe two cities had long been friends. They signed treaties in 509 BC, 348 BC and around 279 BC, and traded busily. When a Greek king from Epirus, in north-western Greece, fought them both in the 270s BC, Carthage supplied Rome and once ferried Roman troops in its ships.\n\nThe war that ended this friendship lasted 23 years, from 264 to 241 BC. It was the longest continuous conflict and the greatest naval war of the ancient world. Romans called the Carthaginians *Punici*, meaning Phoenicians, after their ancestors. That is why it is known as the First Punic War."},{"id":"messana","title":"Messana: The Spark of War","body":"The war began over Messana, today's Messina, a city on Sicily's north-eastern tip facing Italy. In 289 BC Italian mercenaries called the Mamertines had seized it. By 265 BC they were hard-pressed by Syracuse, the strongest Greek city on Sicily, and begged both Rome and Carthage for help. Carthage acted first and put a garrison in the city.\n\nAccording to Polybius, the Greek historian who is our main source, Rome debated long and hard. Helping meant risking war with Carthage, and many Romans disliked aiding soldiers who had stolen a city. Others saw the gains of a foothold on Sicily. The Senate (*senatus*) was deadlocked, so the question went to the popular assembly (*comitia*). One of the two consuls (*consules*), the magistrates elected each year to lead Rome's armies, urged war and promised rich plunder (*praeda*). The people voted yes.\n\nIn 264 BC two legions (*legiones*), Roman army units of about 4,500 men each, crossed the strait. The Mamertines had already expelled the Carthaginians. In 263 BC, facing 40,000 Romans, the king of Syracuse switched sides and agreed to feed Rome's army."},{"id":"siege-of-akragas","title":"The Siege of Akragas","body":"Carthage made Akragas, a port halfway along Sicily's south coast that the Romans called Agrigentum, its main base on the island. In 262 BC a Roman army of about 40,000 besieged it. Feeding so many men was hard while Carthage ruled the sea, and at harvest time the troops scattered to gather crops. The garrison seized the moment, burst out and broke into the Roman camp before being driven back.\n\nCarthage, which relied mostly on hired foreign soldiers, shipped over a relief army of 50,000 infantry, 6,000 cavalry and 60 war elephants. Its general camped on high ground for two months, then attacked in spring 261 BC. He was heavily defeated in one of only two full-scale pitched battles fought on Sicily in the whole war. The garrison slipped away that night, and the Romans sold 25,000 inhabitants into slavery.\n\nYet victory brought no breakthrough. Sicily's rugged hills favoured defenders. Carthage's fortified coastal towns could be supplied by sea, and years of raids and sieges followed."},{"id":"rome-builds-a-fleet","title":"Rome Takes to the Sea","body":"The Romans saw they could not win while Carthage ruled the waves. Yet Rome had almost no navy, having always borrowed small squadrons from its allies (*socii*). In 260 BC it began building a fleet, copying a shipwrecked Carthaginian warship.\n\nThat ship was a quinquereme, meaning \"five-oared\", the standard warship of the age. It was a galley about 45 m (150 ft) long, rowed by 280 oarsmen. It also carried 20 deck crew and usually 40 marines, rising to 120 before battle. At the waterline sat a bronze ram (*rostrum*) weighing up to 270 kg (600 lb), used for smashing enemy hulls. Rowing in unison, let alone manoeuvring in battle, demanded long training.\n\nRome built 120 warships, but its novice shipwrights produced copies that were heavier and slower than the originals. The first test was a fiasco. A consul sailed with 17 ships to seize the Lipari Islands, off Sicily's north-east coast. Carthaginian ships trapped them in harbour at night. The raw crews panicked, and every ship was captured, along with the consul himself."},{"id":"corvus-and-mylae","title":"The Corvus and the Victory at Mylae","body":"To make up for poor seamanship, the Romans fitted their ships with a boarding bridge nicknamed the raven (*corvus*). It was about 1.2 m (4 ft) wide and 11 m (36 ft) long, raised by pulleys on a pole at the prow, and it could swing from side to side. Under its far end hung a heavy iron spike shaped like a bird's beak. Dropped onto an enemy deck, it pinned the two ships together, and Roman soldiers charged across. A sea battle became a land battle, the kind Rome's legions excelled at.\n\nIts great test came in 260 BC off Mylae, on Sicily's north coast. Gaius Duilius, the consul who gave Rome its first naval victory, faced about 130 Carthaginian ships. Sure of their skill, the Carthaginians rushed in without keeping formation. The ravens grappled the first 30 ships, including the flagship, whose commander escaped in a small boat. When the rest swung round to strike from the side, Duilius's men captured 20 more. The faster survivors fled, and Rome grew bolder."},{"id":"regulus-in-africa","title":"Regulus Invades Africa","body":"Encouraged, Rome decided to strike Carthage at home. In 256 BC a fleet of 330 warships sailed under that year's consuls. One was Regulus, the general who would carry the war to Africa and end up a prisoner. Carthage met them with 350 warships off Cape Ecnomus, on Sicily's south coast. With some 680 ships and up to 290,000 crew and marines, it was possibly the largest naval battle in history by number of combatants. After a long, confused day, Carthage had lost 94 ships sunk or captured, Rome 24.\n\nRegulus landed near Cape Bon, in north-eastern Tunisia. Most of the fleet then sailed back to Sicily, leaving him 15,000 infantry and 500 cavalry. He routed a Carthaginian army in a surprise dawn attack and took Tunis, just 16 km (10 miles) from Carthage. Carthage asked for peace, but his terms were so harsh that it fought on.\n\nCarthage hired a Spartan mercenary commander to retrain its army. In 255 BC the retrained army crushed the Romans, and Regulus was captured. A rescue fleet beat Carthage's navy, but a storm on the way home sank 384 of 464 ships, drowning about 100,000 men."},{"id":"drepana-and-stalemate","title":"Storms, Elephants and Defeat at Drepana","body":"Rome rebuilt fast, adding 220 ships, and in 254 BC stormed Panormus, today's Palermo, on Sicily's north coast. Another storm sank 150 Roman ships in 253 BC, and again Rome rebuilt. In 251 BC a Carthaginian army marched on Panormus with war elephants. The Roman commander showered the beasts with javelins from behind old siege earthworks. Panicked, they stampeded back through their own infantry, and the Carthaginians fled.\n\nBy 249 BC Carthage held only Lilybaeum and Drepana, two strongholds on Sicily's western tip. Rome besieged Lilybaeum by land and sea, but swift Carthaginian blockade runners kept slipping through. A Roman consul then tried a night surprise attack on the enemy fleet at Drepana. His ships scattered in the dark, were pinned against the shore and were badly beaten. It was Carthage's greatest naval victory of the war. A second defeat off Phintias, on Sicily's south coast, all but swept Rome from the sea for seven years.\n\nIn 247 BC Hamilcar Barca, the Carthaginian general who kept up the fight in western Sicily, took command. From the mountain of Eryx, near Drepana, he waged a guerrilla war that tied down the Roman legions."},{"id":"battle-of-the-aegates","title":"The Battle of the Aegates Islands","body":"By 243 BC both sides were exhausted. Egypt refused Carthage a loan, Rome was nearly bankrupt, and its number of adult male citizens had fallen by 17 percent. So the Senate asked the richest Romans each to fund a warship, to be repaid from Carthage's future war payments. About 200 quinqueremes were built at no cost to the state, modelled on a fast captured blockade runner. This time there was no corvus; Romans would have to win as sailors.\n\nCatulus, the consul who won the war's final battle, brought the fleet to Sicily in 242 BC. He sealed off the last Carthaginian strongholds and drilled his crews relentlessly. Carthage took nine months to gather 250 warships, short of trained rowers and loaded with grain for its starving garrisons.\n\nOn 10 March 241 BC, near the Aegates Islands just west of Sicily, the Romans left masts and sails ashore and rowed into a strong headwind to intercept. Catulus was wounded, so his deputy led the fight. Nimble and well drilled, the Romans rammed their laden opponents, sinking 50 ships and capturing 70, for a loss of 30."},{"id":"peace-and-aftermath","title":"Peace and Its Bitter Aftermath","body":"Rather than build another fleet, Carthage ordered Hamilcar Barca, its commander in Sicily, to make peace. Under the Treaty of Lutatius in 241 BC, Carthage left Sicily, freed all prisoners and agreed to pay 3,200 talents of silver over ten years. Catulus, the consul whose fleet won the war, celebrated a triumph (*triumphus*), a victory parade through Rome.\n\nSicily became Rome's first province (*provincia*), an overseas territory run by a Roman governor, and a vital source of grain. Rome had built over 1,000 galleys during the war, laying the foundation for 600 years of mastery at sea.\n\nCarthage's troubles continued. It tried to underpay its foreign soldiers, who rebelled and were crushed with great savagery. When Carthage moved to recover Sardinia in 237 BC, Rome cynically called it an act of war. It forced Carthage to surrender Sardinia and Corsica and pay 1,200 more talents. That year Hamilcar led his veterans to Spain to build a new power base. Resentment smouldered, and in 218 BC the Second Punic War began."},{"id":"sources-and-debates","title":"How Do We Know? Polybius, the Corvus and the Seabed","body":"Almost everything we know about this war comes from Polybius, a Greek taken to Rome as a hostage in 167 BC. He wrote about a century after the fighting, interviewing participants where he could. Carthage's own records perished when the city was destroyed in 146 BC. His accuracy has been debated for 150 years, but most modern historians accept his account largely at face value.\n\nThe corvus, Rome's spiked boarding bridge, sparks the liveliest debate. It is clearly mentioned only at Mylae and Ecnomus, then vanishes. Some think its weight made ships top-heavy and worsened the great storm disasters. A naval architect, however, calculated that a bridge of about one tonne would not seriously upset a quinquereme. In 1907 one historian argued it never existed as described. Others see it as one tool in a bolder naval strategy than Polybius admits.\n\nSince 2010, divers off western Sicily have found more than two dozen bronze rams from the Aegates battle, plus helmets and hundreds of storage jars. Their location supports Polybius, and the jars confirm Carthage's ships carried supplies. But the rams' size suggests smaller ships than the quinqueremes he describes."}],"battle":{"name":"Agrigentum","year":"261 BC","enemy":"Carthage’s relief army","sec":"siege-of-akragas","intro":"Rome besieges Akragas, which the Romans call Agrigentum. Carthage sends a relief army of 50,000 infantry, 6,000 cavalry and 60 war elephants. Hold the siege lines."},"timelines":[{"name":"The War in Four Steps","blurb":"Put the big turning points of the First Punic War in order.","events":[{"label":"Roman legions cross to Messana","when":"264 BC","y":-264,"fact":"Two legions of about 4,500 men each crossed the strait to Sicily, starting the war with Carthage.","sec":"messana"},{"label":"Regulus invades Africa","when":"256 BC","y":-256,"fact":"After winning off Cape Ecnomus, the consul Regulus landed near Cape Bon to strike Carthage at home.","sec":"regulus-in-africa"},{"label":"Roman victory at the Aegates Islands","when":"10 March 241 BC","y":-241,"fact":"Catulus's well-drilled crews rammed the laden Carthaginian ships, sinking 50 and capturing 70.","sec":"battle-of-the-aegates"},{"label":"Second Punic War begins","when":"218 BC","y":-218,"fact":"Carthaginian resentment over the peace and the seizure of Sardinia smouldered until a new war broke out.","sec":"peace-and-aftermath"}]},{"name":"From Friends to Foes","blurb":"Follow Rome and Carthage from old allies to bitter rivals.","events":[{"label":"First Rome–Carthage treaty","when":"509 BC","y":-509,"fact":"Rome and Carthage were long friends, signing treaties in 509 BC, 348 BC and around 279 BC.","sec":"rome-and-carthage"},{"label":"Mamertines seize Messana","when":"289 BC","y":-289,"fact":"Italian mercenaries called the Mamertines took the city whose cry for help later sparked the war.","sec":"messana"},{"label":"Romans besiege Akragas","when":"262 BC","y":-262,"fact":"About 40,000 Romans besieged Carthage's main base on Sicily, a port the Romans called Agrigentum.","sec":"siege-of-akragas"},{"label":"Duilius wins at Mylae","when":"260 BC","y":-260,"fact":"Using the corvus boarding bridge, Gaius Duilius gave Rome its first naval victory.","sec":"corvus-and-mylae"},{"label":"Hamilcar Barca takes command in Sicily","when":"247 BC","y":-247,"fact":"From the mountain of Eryx, near Drepana, Hamilcar Barca waged a guerrilla war that tied down the legions.","sec":"drepana-and-stalemate"},{"label":"Rome seizes Sardinia and Corsica","when":"237 BC","y":-237,"fact":"Rome called Carthage's move to recover Sardinia an act of war and forced it to give up both islands.","sec":"peace-and-aftermath"}]},{"name":"The Long War in Detail","blurb":"A harder sequence, from Rome's rise in Italy to the historian who told the story.","events":[{"label":"Rome rules Italy south of the Arno","when":"272 BC","y":-272,"fact":"After a century of conquest, Rome controlled the Italian peninsula south of the river that flows past Pisa.","sec":"rome-and-carthage"},{"label":"King of Syracuse switches to Rome","when":"263 BC","y":-263,"fact":"Facing 40,000 Romans, the king of the strongest Greek city on Sicily changed sides and agreed to feed Rome's army.","sec":"messana"},{"label":"Carthage's relief army beaten at Akragas","when":"Spring 261 BC","y":-261,"fact":"It was one of only two full-scale pitched battles fought on Sicily in the whole war.","sec":"siege-of-akragas"},{"label":"Storm wrecks Rome's returning fleet","when":"255 BC","y":-255,"fact":"On the way home, 384 of 464 ships sank, drowning about 100,000 men.","sec":"regulus-in-africa"},{"label":"Elephants stampede at Panormus","when":"251 BC","y":-251,"fact":"Showered with javelins, Carthage's war elephants panicked and trampled back through their own infantry.","sec":"drepana-and-stalemate"},{"label":"Roman fleet routed at Drepana","when":"249 BC","y":-249,"fact":"A failed Roman night attack gave Carthage its greatest naval victory of the war.","sec":"drepana-and-stalemate"},{"label":"Rich Romans pay for a new fleet","when":"c. 243 BC","y":-243,"fact":"With Rome nearly bankrupt, the richest citizens each funded a warship, to be repaid from Carthage's future war payments.","sec":"battle-of-the-aegates"},{"label":"Polybius taken to Rome as a hostage","when":"167 BC","y":-167,"fact":"This Greek historian, our main source, wrote about a century after the fighting.","sec":"sources-and-debates"}]}],"matches":[{"name":"Who Did What?","blurb":"Match each figure of the war to their role.","pairs":[["Gaius Duilius","Consul who won Rome's first naval victory, at Mylae in 260 BC"],["Regulus","Consul who invaded Africa, took Tunis and was captured in 255 BC"],["Hamilcar Barca","Carthaginian general who fought a guerrilla war from Eryx"],["Catulus","Consul whose fleet won the final battle at the Aegates Islands"],["Polybius","Greek hostage in Rome whose history is our main source for the war"]],"secs":["corvus-and-mylae","regulus-in-africa","drepana-and-stalemate","battle-of-the-aegates","sources-and-debates"]},{"name":"Words of War","blurb":"Match each term to its meaning.","pairs":[["Corvus","'Raven': spiked boarding bridge that pinned enemy ships together"],["Quinquereme","'Five-oared' galley, the standard warship, rowed by 280 oarsmen"],["Rostrum","Bronze ram at the waterline used to smash enemy hulls"],["Provincia","Overseas territory run by a Roman governor; Sicily was the first"],["Mamertines","Italian mercenaries who seized Messana in 289 BC"]],"secs":["corvus-and-mylae","rome-builds-a-fleet","rome-builds-a-fleet","peace-and-aftermath","messana"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Comitia","The popular assembly that voted for war in 264 BC"],["Praeda","Plunder, promised to the voters by a consul"],["Legiones","Roman army units of about 4,500 men each"],["Socii","Rome’s allies, who lent it small squadrons"],["Triumphus","A victory parade through Rome"],["Punici","The Romans’ name for the Carthaginians"]],"secs":["messana","messana","messana","rome-builds-a-fleet","peace-and-aftermath","rome-and-carthage"]}],"decks":[{"name":"Land, Politics and Peace","blurb":"How the war began on land, and how it ended at the table.","cards":[{"claim":"Before the war, Carthage held the western half of Sicily.","answer":true,"why":"Carthage's empire included Sardinia, Corsica and the western half of Sicily.","sec":"rome-and-carthage"},{"claim":"During the war with a Greek king from Epirus in the 270s BC, Carthage once ferried Roman troops in its ships.","answer":true,"why":"The two cities were still friends then; Carthage supplied Rome and once carried Roman troops by sea.","sec":"rome-and-carthage"},{"claim":"The Roman Senate voted clearly in favour of going to war over Messana.","answer":false,"why":"The Senate was deadlocked, so the question went to the popular assembly (comitia), which voted yes.","sec":"messana"},{"claim":"Carthage relied mostly on its own citizens as soldiers.","answer":false,"why":"Carthage relied mostly on hired foreign soldiers.","sec":"siege-of-akragas"},{"claim":"After taking Akragas, the Romans sold 25,000 inhabitants into slavery.","answer":true,"why":"The garrison slipped away after the battle, and the Romans enslaved 25,000 of the townspeople.","sec":"siege-of-akragas"},{"claim":"Regulus took Tunis, just 16 km (10 miles) from Carthage.","answer":true,"why":"After a surprise dawn attack routed a Carthaginian army, Regulus captured Tunis close to Carthage.","sec":"regulus-in-africa"},{"claim":"Under the Treaty of Lutatius, Carthage agreed to pay 3,200 talents of silver over twenty years.","answer":false,"why":"The 3,200 talents were to be paid over ten years.","sec":"peace-and-aftermath"},{"claim":"Sardinia became Rome's first province.","answer":false,"why":"Sicily became Rome's first province and a vital source of grain; Sardinia was seized later, in 237 BC.","sec":"peace-and-aftermath"}]},{"name":"Ships, Storms and Sources","blurb":"Rome's leap to sea power, and how we know about it.","cards":[{"claim":"Rome built its first fleet by copying a shipwrecked Carthaginian warship.","answer":true,"why":"In 260 BC Rome copied a stranded Carthaginian quinquereme, though its copies were heavier and slower.","sec":"rome-builds-a-fleet"},{"claim":"A quinquereme was rowed by 120 oarsmen.","answer":false,"why":"It was rowed by 280 oarsmen; 120 was the number of marines it might carry before battle.","sec":"rome-builds-a-fleet"},{"claim":"At Mylae, the ravens grappled the first 30 Carthaginian ships, including the flagship.","answer":true,"why":"The flagship's commander escaped in a small boat, and Duilius's men captured 20 more ships afterwards.","sec":"corvus-and-mylae"},{"claim":"In 255 BC a storm sank 384 of 464 Roman ships on the way home from Africa.","answer":true,"why":"The disaster drowned about 100,000 men.","sec":"regulus-in-africa"},{"claim":"The battle of Drepana was Rome's greatest naval victory of the war.","answer":false,"why":"Drepana was Carthage's greatest naval victory: a failed Roman night attack ended with Roman ships pinned against the shore.","sec":"drepana-and-stalemate"},{"claim":"Catulus's fleet won at the Aegates Islands by using the corvus.","answer":false,"why":"The new fleet had no corvus; the Romans won as sailors, ramming their laden opponents.","sec":"battle-of-the-aegates"},{"claim":"The fleet that won the war was paid for by Rome's richest citizens.","answer":true,"why":"About 200 quinqueremes were built at no cost to the state, to be repaid from Carthage's future war payments.","sec":"battle-of-the-aegates"},{"claim":"The bronze rams found off western Sicily suggest ships larger than Polybius describes.","answer":false,"why":"The rams' size suggests smaller ships than the quinqueremes Polybius describes, though their location supports him.","sec":"sources-and-debates"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Sardinia","Syracuse","Corsica","Western Sicily"],"odd":1,"why":"Sardinia, Corsica and western Sicily belonged to Carthage before the war. Syracuse was the strongest Greek city on Sicily, and it sided with Rome in 263 BC.","sec":"rome-and-carthage"},{"items":["Hamilcar Barca","Gaius Duilius","Regulus","Catulus"],"odd":0,"why":"Duilius, Regulus and Catulus were Roman consuls. Hamilcar Barca was Carthage's general in Sicily.","sec":"drepana-and-stalemate"},{"items":["Lipari Islands","Drepana","Mylae","Phintias"],"odd":2,"why":"Rome lost at sea at the Lipari Islands, Drepana and Phintias. Mylae was Rome's first naval victory, won by Gaius Duilius.","sec":"corvus-and-mylae"},{"items":["50,000 infantry","120 warships","6,000 cavalry","60 war elephants"],"odd":1,"why":"Infantry, cavalry and elephants made up Carthage's relief army at Akragas. The 120 warships were the fleet Rome began building in 260 BC.","sec":"siege-of-akragas"},{"items":["Leave Sicily","Free all prisoners","Pay 3,200 talents","Give up Sardinia"],"odd":3,"why":"The first three were terms of the Treaty of Lutatius in 241 BC. Carthage was forced to give up Sardinia only later, in 237 BC.","sec":"peace-and-aftermath"},{"items":["Bronze rams","An iron corvus spike","Helmets","Storage jars"],"odd":1,"why":"Divers since 2010 have found rams, helmets and storage jars from the Aegates battle. The Roman fleet there carried no corvus.","sec":"sources-and-debates"},{"items":["Tunis","Messana","Akragas","Panormus"],"odd":0,"why":"Messana, Akragas and Panormus are cities on Sicily. Tunis is in Africa, near Carthage, and was taken by Regulus.","sec":"regulus-in-africa"}]}],"whos":[{"name":"Commanders at Sea","blurb":"Three Roman consuls who fought the war on the water.","people":[{"name":"Gaius Duilius","options":["Gaius Duilius","Catulus","Regulus","Hamilcar Barca"],"clues":["I faced about 130 Carthaginian ships off Sicily's north coast.","When the enemy swung round to strike from the side, my men captured 20 more ships.","My boarding bridges, the ravens, pinned the first 30 enemy ships, including the flagship.","As consul in 260 BC, I gave Rome its first naval victory, at Mylae."],"sec":"corvus-and-mylae"},{"name":"Catulus","options":["Gaius Duilius","Catulus","Regulus","Hamilcar Barca"],"clues":["I was wounded, so my deputy led the decisive fight.","In 242 BC I sealed off the last Carthaginian strongholds and drilled my crews relentlessly.","After the war I celebrated a triumph, a victory parade through Rome.","As consul, I won the war's final battle, at the Aegates Islands in 241 BC."],"sec":"battle-of-the-aegates"},{"name":"Regulus","options":["Gaius Duilius","Catulus","Regulus","Hamilcar Barca"],"clues":["In 256 BC I sailed as consul with a fleet of 330 warships.","We met 350 Carthaginian ships off Cape Ecnomus, perhaps history's largest naval battle by number of combatants.","Carthage lost 94 ships that day; Rome lost 24.","I then landed near Cape Bon, in Africa, to strike Carthage at home."],"sec":"regulus-in-africa"}]},{"name":"Generals and a Historian","blurb":"Two generals on land, and the man who told their story.","people":[{"name":"Hamilcar Barca","options":["Hamilcar Barca","Regulus","Catulus","Gaius Duilius"],"clues":["In 237 BC I led my veterans to Spain to build a new power base.","From the mountain of Eryx, near Drepana, I waged a guerrilla war that tied down the Roman legions.","In 241 BC my city ordered me to make peace.","I am the Carthaginian general who took command in Sicily in 247 BC."],"sec":"drepana-and-stalemate"},{"name":"Regulus","options":["Hamilcar Barca","Regulus","Catulus","Gaius Duilius"],"clues":["I routed a Carthaginian army in a surprise dawn attack.","I took Tunis, just 16 km (10 miles) from Carthage.","Carthage asked me for peace, but my terms were so harsh that it fought on.","In 255 BC an army retrained by a Spartan mercenary crushed my men, and I was taken prisoner."],"sec":"regulus-in-africa"},{"name":"Polybius","options":["Polybius","Fabius Pictor","Livy","Diodorus Siculus"],"clues":["My accuracy has been debated for 150 years, but most modern historians accept my account.","Bronze rams found off western Sicily since 2010 support where I placed the final battle.","I was a Greek taken to Rome as a hostage in 167 BC.","Almost everything known about the First Punic War comes from my history, written about a century later."],"sec":"sources-and-debates"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Carthage","lat":36.853,"lon":10.323,"why":"The great trading city in what is now Tunisia that fought Rome for 23 years and was the target of Regulus's invasion.","sec":"rome-and-carthage"},{"name":"Messana","lat":38.19361111,"lon":15.55416667,"why":"The city on Sicily's north-eastern tip, held by the Mamertines, whose plea for help sparked the war in 264 BC.","sec":"messana"},{"name":"Syracuse","lat":37.06916667,"lon":15.2875,"why":"The strongest Greek city on Sicily, whose king switched to Rome's side in 263 BC and fed its army.","sec":"messana"},{"name":"Akragas","lat":37.3125,"lon":13.575,"why":"Carthage's main base on Sicily, besieged by Rome in 262 BC and taken after a pitched battle in 261 BC.","sec":"siege-of-akragas"},{"name":"Aegates Islands","lat":37.96666667,"lon":12.2,"why":"Islands just west of Sicily where Catulus's fleet won the war's final battle on 10 March 241 BC.","sec":"battle-of-the-aegates"},{"name":"Sardinia","lat":40,"lon":9,"why":"A Carthaginian island that Rome forced Carthage to surrender, along with Corsica, in 237 BC.","sec":"peace-and-aftermath"}]}],"quizPool":{"1":[{"q":"How long did the First Punic War last?","options":["17 years","10 years","23 years","30 years"],"a":2,"level":1,"why":"The war ran for 23 years, from 264 to 241 BC. It was the longest continuous conflict and the greatest naval war of the ancient world.","sec":"rome-and-carthage"},{"q":"What did Sicily become after the First Punic War?","options":["An independent Greek kingdom","Rome's first province","Part of the kingdom of Syracuse","A shared Roman-Carthaginian zone"],"a":1,"level":1,"why":"Sicily became Rome's first province, an overseas territory run by a Roman governor. It was also a vital source of grain.","sec":"peace-and-aftermath"},{"q":"What happened to Regulus, the Roman consul who invaded Africa?","options":["He captured the city of Carthage","He drowned in a storm at sea","He was captured by the Carthaginians","He celebrated a triumph in Rome"],"a":2,"level":1,"why":"In 255 BC Carthage's retrained army crushed his army and Regulus was captured. He had earlier come within 16 km of Carthage by taking Tunis.","sec":"regulus-in-africa"},{"q":"Under the Treaty of Lutatius, how much did Carthage agree to pay Rome?","options":["10,000 talents over fifty years","3,200 talents over ten years","1,200 talents at once","500 talents over five years"],"a":1,"level":1,"why":"Carthage agreed to pay 3,200 talents of silver over ten years. It also had to leave Sicily and free all prisoners.","sec":"peace-and-aftermath"},{"q":"What did the Romans call Akragas, Carthage's main base on Sicily?","options":["Lilybaeum","Agrigentum","Panormus","Messana"],"a":1,"level":1,"why":"The Romans called the southern Sicilian port of Akragas 'Agrigentum'. A Roman army of about 40,000 besieged it in 262 BC.","sec":"siege-of-akragas"},{"q":"In what year did the Second Punic War begin?","options":["202 BC","218 BC","241 BC","237 BC"],"a":1,"level":1,"why":"Resentment over Rome's harsh treatment smouldered until the Second Punic War began in 218 BC. Meanwhile Hamilcar had built a new power base in Spain.","sec":"peace-and-aftermath"},{"q":"Which consul gave Rome its first naval victory, at Mylae in 260 BC?","options":["Gaius Duilius","Regulus","Catulus","Scipio"],"a":0,"level":1,"why":"Gaius Duilius won at Mylae against about 130 Carthaginian ships. His ravens grappled the first 30 ships, including the enemy flagship.","sec":"corvus-and-mylae"},{"q":"Which Carthaginian general took command in Sicily in 247 BC and waged a guerrilla war from the mountain of Eryx?","options":["Hanno","Hasdrubal","Hannibal","Hamilcar Barca"],"a":3,"level":1,"why":"Hamilcar Barca took command in 247 BC and tied down the Roman legions from the mountain of Eryx, near Drepana.","sec":"drepana-and-stalemate"},{"q":"Who were the Mamertines, whose call for help drew Rome into Sicily?","options":["A Carthaginian garrison force","Italian mercenaries who had seized Messana","Greek colonists from Syracuse","Roman allied sailors from the south"],"a":1,"level":1,"why":"The Mamertines were Italian mercenaries who seized Messana in 289 BC. Many Romans disliked the idea of aiding soldiers who had stolen a city.","sec":"messana"},{"q":"Who is the main ancient source for the First Punic War?","options":["Polybius","Herodotus","Thucydides","Livy"],"a":0,"level":1,"why":"Almost everything known about the war comes from Polybius, a Greek taken to Rome as a hostage in 167 BC. He wrote about a century after the fighting.","sec":"sources-and-debates"},{"q":"Which Roman consul commanded the fleet that won the war's final battle?","options":["Scipio","Catulus","Gaius Duilius","Regulus"],"a":1,"level":1,"why":"Catulus brought the fleet to Sicily in 242 BC and drilled his crews relentlessly. He later celebrated a triumph in Rome.","sec":"battle-of-the-aegates"},{"q":"Near which islands was the final battle of the First Punic War fought in 241 BC?","options":["The Balearic Islands","The Aegates Islands","The Maltese Islands","The Lipari Islands"],"a":1,"level":1,"why":"The decisive battle was fought on 10 March 241 BC near the Aegates Islands, just west of Sicily. The Romans left their masts and sails ashore before rowing out.","sec":"battle-of-the-aegates"},{"q":"Which Sicilian city, facing Italy across a narrow strait, sparked the First Punic War?","options":["Panormus","Messana","Syracuse","Akragas"],"a":1,"level":1,"why":"The war began over Messana, today's Messina, on Sicily's north-eastern tip. Both Rome and Carthage were asked to help the city's occupiers.","sec":"messana"},{"q":"Carthage, Rome's great rival in the First Punic War, stood in which modern country?","options":["Morocco","Egypt","Tunisia","Libya"],"a":2,"level":1,"why":"Carthage was a great trading city in what is now Tunisia. Its empire stretched along the North African coast and into southern Spain.","sec":"rome-and-carthage"},{"q":"Since 2010, what have divers found off western Sicily from the Battle of the Aegates?","options":["More than two dozen bronze rams","Carthaginian treaty tablets","An intact corvus boarding bridge","The wreck of Duilius's flagship"],"a":0,"level":1,"why":"Divers have recovered more than two dozen bronze rams, along with helmets and hundreds of storage jars. Their location supports Polybius's account.","sec":"sources-and-debates"},{"q":"Why are Rome's wars with Carthage called the \"Punic\" Wars?","options":["They were named after the Punic River in Sicily","The word means 'sea war' in Latin","Punic was the name of Carthage's royal family","Romans called Carthaginians Punici, meaning Phoenicians"],"a":3,"level":1,"why":"The Romans called the Carthaginians Punici, meaning Phoenicians, after their ancestors. That is why this conflict is known as the First Punic War.","sec":"rome-and-carthage"},{"q":"What kind of soldiers did Carthage mostly rely on for its armies?","options":["Levies from allied Greek cities","Slaves freed for service","Citizen conscripts from Carthage","Hired foreign soldiers"],"a":3,"level":1,"why":"Carthage relied mostly on hired foreign soldiers. It sent a relief army including 60 war elephants to save Akragas.","sec":"siege-of-akragas"},{"q":"What does the name of the standard warship of the age, the quinquereme, mean?","options":["\"Bronze-beaked\"","\"Five-oared\"","\"Fast runner\"","\"Three-decked\""],"a":1,"level":1,"why":"Quinquereme means 'five-oared'. It was a galley about 45 m long with a heavy bronze ram at the waterline.","sec":"rome-builds-a-fleet"},{"q":"Rome's spiked boarding bridge, the corvus, was nicknamed after which creature?","options":["The wolf","The scorpion","The eagle","The raven"],"a":3,"level":1,"why":"Corvus means raven; the bridge had a heavy iron spike shaped like a bird's beak. It was fitted to make up for Rome's poor seamanship.","sec":"corvus-and-mylae"},{"q":"Rome had almost no navy in 260 BC. How did it design its first big fleet?","options":["By copying a shipwrecked Carthaginian warship","By hiring Greek shipwrights from Syracuse","By buying ships from Egypt","By enlarging its river barges"],"a":0,"level":1,"why":"The Romans copied a shipwrecked Carthaginian warship. Before this they had always borrowed small squadrons from their allies.","sec":"rome-builds-a-fleet"},{"q":"What was the rostrum on a Roman warship?","options":["A bronze ram at the waterline","A boarding bridge","The captain’s deck","A sail made of linen"],"a":0,"level":1,"why":"It was used to smash enemy hulls, and could weigh up to 270 kg (600 lb).","sec":"rome-builds-a-fleet"},{"q":"After the war Sicily became Rome’s first provincia. What was that?","options":["An overseas territory run by a Roman governor","An allied city with its own king","A Roman colony of veterans","A free Greek city"],"a":0,"level":1,"why":"Sicily also became a vital source of grain for Rome.","sec":"peace-and-aftermath"},{"q":"Why is the war called “Punic”?","options":["From Punici, the Romans’ name for the Carthaginians","From a Sicilian city called Punicum","From the Latin for “sea war”","From the name of a Carthaginian king"],"a":0,"level":1,"why":"Punici means Phoenicians, the ancestors of the Carthaginians.","sec":"rome-and-carthage"}],"2":[{"q":"In 264 BC the deadlocked Senate passed the question of war to the comitia. What was it?","options":["The popular assembly","The council of priests","The two consuls","The allied cities"],"a":0,"level":2,"why":"One of the consuls urged war and promised rich plunder; the people voted yes.","sec":"messana"},{"q":"What did a consul promise the voters to win support for war in 264 BC?","options":["Praeda: rich plunder","Land in Sicily for every voter","An end to debts","A triumph for every soldier"],"a":0,"level":2,"why":"Many Romans disliked aiding the Mamertines, but the promise of plunder helped carry the vote.","sec":"messana"},{"q":"Before 260 BC, how did Rome get warships?","options":["It borrowed small squadrons from its allies (socii)","It hired the Carthaginian fleet","It bought ships from Egypt","It had a large navy of its own"],"a":0,"level":2,"why":"In 260 BC it began building its own fleet, copying a shipwrecked Carthaginian warship.","sec":"rome-builds-a-fleet"},{"q":"What were the ships of Rome's final fleet, which carried no corvus, modelled on?","options":["Greek triremes from Syracuse","Duilius's flagship from Mylae","The heavy ships of Ecnomus","Egyptian royal galleys","A fast captured blockade runner"],"a":4,"level":2,"why":"About 200 quinqueremes were built on the model of a fast captured blockade runner. With no corvus, Romans had to win as sailors.","sec":"battle-of-the-aegates"},{"q":"How did the Romans defeat Carthage's war elephants at Panormus in 251 BC?","options":["By blocking the road with chained wagons","By digging hidden pits in the road","By showering them with javelins from old siege earthworks","By frightening them with burning pigs","By charging them with heavy cavalry"],"a":2,"level":2,"why":"Javelins from behind old earthworks panicked the elephants, which stampeded back through their own infantry. The Carthaginians then fled.","sec":"drepana-and-stalemate"},{"q":"What did a Roman consul attempt at Drepana in 249 BC, leading to Carthage's greatest naval victory of the war?","options":["A landing behind Hamilcar's lines","A naval assault in a storm","A blockade using sunken ships","A siege with floating towers","A night surprise attack on the enemy fleet"],"a":4,"level":2,"why":"The consul tried a night surprise attack, but his ships scattered in the dark and were pinned against the shore. It was Carthage's greatest naval victory of the war.","sec":"drepana-and-stalemate"},{"q":"When Carthage tried to recover Sardinia in 237 BC, what did Rome do?","options":["It agreed to share the island","It ignored the move entirely","It demanded Carthage hand over Hamilcar","It called it an act of war and forced Carthage to give up Sardinia and Corsica","It invaded Africa a second time"],"a":3,"level":2,"why":"Rome cynically treated the move as an act of war, seized Sardinia and Corsica, and demanded 1,200 more talents. This fuelled Carthaginian resentment.","sec":"peace-and-aftermath"},{"q":"Where did Hamilcar Barca lead his veterans in 237 BC to build a new power base?","options":["Numidia","Corsica","Sardinia","Spain","Gaul"],"a":3,"level":2,"why":"Hamilcar took his veterans to Spain in 237 BC. Carthage had earlier crushed its own rebellious foreign soldiers with great savagery.","sec":"peace-and-aftermath"},{"q":"After Regulus took Tunis, why did Carthage keep fighting instead of making peace?","options":["Egypt promised a large army","Its people rose up against the council","Regulus's peace terms were too harsh","Regulus refused to negotiate at all","Hamilcar Barca forbade it"],"a":2,"level":2,"why":"Carthage asked for peace, but Regulus demanded such harsh terms that it chose to fight on. Tunis lay just 16 km from Carthage.","sec":"regulus-in-africa"},{"q":"When a Greek king from Epirus fought both Rome and Carthage in the 270s BC, how did Carthage help Rome?","options":["It sent war elephants to Italy","It once ferried Roman troops in its ships","It handed Rome the island of Corsica","It paid Rome's mercenaries for a year","It lent Rome its best admiral"],"a":1,"level":2,"why":"Carthage supplied Rome and once carried Roman troops in its ships. The two cities had signed treaties in 509, 348 and around 279 BC.","sec":"rome-and-carthage"},{"q":"What was the main tactical idea behind the corvus?","options":["Shooting arrows from a high platform","Turning a sea battle into a land battle","Setting enemy ships on fire","Towing captured ships back to port","Ramming ships below the waterline"],"a":1,"level":2,"why":"The corvus pinned two ships together so Roman soldiers could charge across. That suited Rome's legions, which excelled at land fighting.","sec":"corvus-and-mylae"},{"q":"With the Senate deadlocked over helping Messana, who finally decided to send Roman forces?","options":["The chief priest after consulting omens","The Senate in a second vote","The two consuls acting alone","Rome's Italian allies","The popular assembly"],"a":4,"level":2,"why":"The question went to the popular assembly, which voted yes. One consul had urged war and promised rich plunder.","sec":"messana"},{"q":"What makes the Battle of Cape Ecnomus in 256 BC stand out?","options":["It was fought entirely at night","It was possibly the largest naval battle in history by combatants","It was the first battle with the corvus","It was Carthage's greatest naval victory","It ended the war"],"a":1,"level":2,"why":"With some 680 ships and up to 290,000 crew and marines, Ecnomus may be history's largest naval battle by number of combatants. Carthage lost 94 ships, Rome 24.","sec":"regulus-in-africa"},{"q":"Whom did Carthage hire to retrain its army against Regulus?","options":["A deserter from the Roman legions","An Egyptian general","A Spartan mercenary commander","An Athenian admiral","A Macedonian engineer"],"a":2,"level":2,"why":"A Spartan mercenary commander retrained Carthage's army. In 255 BC the retrained army crushed the Romans and captured Regulus.","sec":"regulus-in-africa"},{"q":"Nearly bankrupt by 243 BC, how did Rome pay for its final war fleet?","options":["By having its richest citizens each fund a warship","By melting down temple treasures","By borrowing money from Egypt","By selling captured Sicilians into slavery","By taxing its Italian allies heavily"],"a":0,"level":2,"why":"The Senate asked the richest Romans to fund a warship each, to be repaid from Carthage's future war payments. Egypt had refused Carthage a loan.","sec":"battle-of-the-aegates"},{"q":"During the siege of Akragas, what gave the garrison its chance to break into the Roman camp?","options":["The Romans withdrew to meet a fleet","The Romans were celebrating a festival","A Roman consul fell ill","A storm destroyed the Roman siege works","Roman troops scattered to gather crops at harvest"],"a":4,"level":2,"why":"Feeding 40,000 men was hard while Carthage ruled the sea, so at harvest time the troops scattered for food. The garrison burst out but was driven back.","sec":"siege-of-akragas"},{"q":"How did Rome's first homemade warships compare with the Carthaginian original they copied?","options":["Larger and better armed","Smaller with fewer oarsmen","Lighter and faster","Heavier and slower","Identical in every respect"],"a":3,"level":2,"why":"Rome's novice shipwrights built 120 warships that were heavier and slower than the originals. Rowing a quinquereme in unison demanded long training.","sec":"rome-builds-a-fleet"},{"q":"Why do we have no Carthaginian account of the First Punic War?","options":["Polybius burned them in Rome","They were lost in a shipwreck","Hamilcar destroyed them on leaving Sicily","They perished when Carthage was destroyed in 146 BC","Carthaginians never kept written records"],"a":3,"level":2,"why":"Carthage's records were lost when Rome destroyed the city in 146 BC. That leaves Polybius, writing about a century after the war, as the main source.","sec":"sources-and-debates"},{"q":"What happened on Rome's first naval venture, a raid on the Lipari Islands?","options":["Every ship was captured, along with the consul","The ships ran aground on the Sicilian coast","The crews mutinied and sailed home","The fleet was wrecked by a storm","The consul won a small but famous victory"],"a":0,"level":2,"why":"Carthaginian ships trapped the 17 Roman ships in harbour at night, and the raw crews panicked. Every ship and the consul himself were captured.","sec":"rome-builds-a-fleet"},{"q":"What did the king of Syracuse do in 263 BC when facing 40,000 Romans?","options":["Fled to Carthage with his treasury","Paid Rome to leave Sicily","Switched sides and agreed to feed Rome's army","Fought a pitched battle and was killed","Invited a Carthaginian garrison into Syracuse"],"a":2,"level":2,"why":"Syracuse, the strongest Greek city on Sicily, switched sides and agreed to supply Rome's army. Earlier it had been pressing the Mamertines at Messana.","sec":"messana"},{"q":"What mistake did the overconfident Carthaginians make at the Battle of Mylae?","options":["They attacked at night in a storm","They left their rams in harbour","They rushed in without keeping formation","They waited too long to engage","They split their fleet in two"],"a":2,"level":2,"why":"Sure of their skill, the Carthaginians charged in without formation and were grappled by the ravens. Their flagship's commander escaped in a small boat.","sec":"corvus-and-mylae"}],"3":[{"q":"Roughly how many galleys did Rome build over the course of the First Punic War?","options":["About 200","About 464","About 330","Over 1,000","Over 3,000","About 120"],"a":3,"level":3,"why":"Rome built over 1,000 galleys during the war. This laid the foundation for 600 years of Roman mastery at sea.","sec":"peace-and-aftermath"},{"q":"At Mylae, after the ravens grappled the first 30 Carthaginian ships, what happened when the rest swung round to strike from the side?","options":["They rescued all 30 grappled ships","The Romans retreated to harbour","They broke through and sank Duilius's flagship","A storm scattered both fleets","Duilius's men captured 20 more","Duilius was captured"],"a":4,"level":3,"why":"The corvus could swing from side to side, and Duilius's men captured 20 more ships. The faster survivors fled.","sec":"corvus-and-mylae"},{"q":"Following the disaster at Drepana, which second defeat all but swept Rome from the sea for seven years?","options":["Lilybaeum","Phintias","Mylae","Ecnomus","Lipari","Panormus"],"a":1,"level":3,"why":"The defeat off Phintias, on Sicily's south coast, left Rome almost without a navy for seven years. By then Carthage held only Lilybaeum and Drepana in Sicily.","sec":"drepana-and-stalemate"},{"q":"After rescuing survivors from Africa in 255 BC, the Roman fleet hit a storm on the way home. How bad was the loss?","options":["24 of 330 ships lost","All 464 ships sunk with no survivors","150 ships sunk, about 30,000 drowned","94 of 350 ships lost","384 of 464 ships sunk, about 100,000 drowned","220 of 330 ships sunk, about 50,000 drowned"],"a":4,"level":3,"why":"The storm sank 384 of 464 ships and drowned about 100,000 men. Another storm sank 150 Roman ships in 253 BC.","sec":"regulus-in-africa"},{"q":"By 272 BC, Rome controlled the Italian peninsula south of which river?","options":["Adige","Rubicon","Tiber","Arno","Volturnus","Po"],"a":3,"level":3,"why":"Rome controlled Italy south of the River Arno, which flows past Pisa. It had spent a century conquering its neighbours.","sec":"rome-and-carthage"},{"q":"How many oarsmen rowed a standard quinquereme?","options":["200","500","280","120","300","170"],"a":2,"level":3,"why":"A quinquereme was about 45 m long and rowed by 280 oarsmen. It also carried 20 deck crew and usually 40 marines.","sec":"rome-builds-a-fleet"},{"q":"When two Roman legions crossed to Messana in 264 BC, what did they find?","options":["Carthage's fleet blockading the harbour","A Carthaginian garrison holding the citadel","The city had been abandoned","The Mamertines had already expelled the Carthaginians","Syracuse had captured the city","The Mamertines had surrendered to Syracuse"],"a":3,"level":3,"why":"Carthage had acted first and garrisoned Messana, but the Mamertines had already thrown the Carthaginians out by the time Rome arrived. Each legion numbered about 4,500 men.","sec":"messana"},{"q":"What was notable about the battle fought outside Akragas in spring 261 BC?","options":["It was Hamilcar Barca's only defeat","It was fought at night","It was one of only two full-scale pitched battles on Sicily in the war","It was won by Carthage's elephants","It ended with Regulus's capture","It was the first use of the corvus"],"a":2,"level":3,"why":"The Carthaginian relief army was heavily defeated in one of only two full-scale pitched battles on Sicily. The garrison slipped away and 25,000 inhabitants were sold into slavery.","sec":"siege-of-akragas"},{"q":"About how many men were in each of the two legiones that crossed to Sicily in 264 BC?","options":["About 4,500","About 1,000","About 10,000","About 40,000"],"a":0,"level":3,"why":"By 263 BC there were 40,000 Romans on the island.","sec":"messana"},{"q":"What was the triumphus that Catulus celebrated?","options":["A victory parade through Rome","A naval review at the coast","A feast for the whole army","A sacrifice at Carthage"],"a":0,"level":3,"why":"Catulus’s fleet had won the final battle of the war at the Aegates Islands.","sec":"peace-and-aftermath"}]},"chronicleMaps":[{"id":"west-med","sec":"rome-and-carthage","title":"Rome and Carthage, 264 BC","caption":"Carthage held the coast of North Africa, Sardinia, Corsica, western Sicily and southern Spain (off the map to the west). Rome ruled Italy. Sicily lay between them. The dashed line is Regulus's invasion of Africa in 256 BC, drawn roughly.","bounds":{"latMin":35.6,"latMax":44,"lonMin":6.8,"lonMax":16.6},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"r","dy":-4},{"name":"Carthage","latin":"Carthago","lat":36.853,"lon":10.323,"side":"l","dy":6},{"name":"Cape Ecnomus","lat":37.1,"lon":13.94,"kind":"battle","side":"r","dy":8}],"peoples":[{"name":"Sardinia","lat":40.1,"lon":9},{"name":"Corsica","lat":42.15,"lon":9.1},{"name":"Sicily","lat":37.55,"lon":14.2},{"name":"Italy","lat":40.9,"lon":15.4}],"routes":[{"pts":[[37.05,13.85],[37.15,12.6],[37.1,11.6],[37.05,11.15]]}]},{"id":"sicily","sec":"siege-of-akragas","title":"The war in Sicily","caption":"Rome crossed the strait at Messana in 264 BC and pushed Carthage back to its strongholds in the west, Lilybaeum and Drepana. The final sea battle was fought off the Aegates Islands.","bounds":{"latMin":36.55,"latMax":38.75,"lonMin":10.95,"lonMax":15.8},"places":[{"name":"Messana","lat":38.19,"lon":15.55,"side":"l","dy":14},{"name":"Mylae","lat":38.22,"lon":15.24,"kind":"battle","side":"l","dy":-14},{"name":"Syracuse","lat":37.075,"lon":15.286,"side":"l"},{"name":"Akragas","lat":37.31,"lon":13.58,"kind":"battle","side":"r"},{"name":"Panormus","lat":38.12,"lon":13.36,"side":"r"},{"name":"Drepana","lat":38.02,"lon":12.51,"kind":"battle","side":"r","dy":-6},{"name":"Lilybaeum","lat":37.8,"lon":12.44,"side":"r","dy":6},{"name":"Aegates Islands","lat":37.97,"lon":12.2,"kind":"battle","side":"l","dy":-14}],"peoples":[{"name":"Carthaginian west","lat":37.5,"lon":13.2}]}],"keyFacts":{"description":"Key facts for this chapter, written by hand from the chapter text. Every entry links to the section that explains it.","people":[{"name":"Gaius Duilius","text":"Consul who won Rome’s first naval victory, at Mylae in 260 BC.","sec":"corvus-and-mylae"},{"name":"Regulus","text":"Consul who invaded Africa in 256 BC and was captured in 255 BC.","sec":"regulus-in-africa"},{"name":"Hamilcar Barca","text":"Carthaginian general in Sicily from 247 BC; he later led his veterans to Spain.","sec":"drepana-and-stalemate"},{"name":"Catulus","text":"Consul whose fleet won the final battle, at the Aegates Islands in 241 BC.","sec":"battle-of-the-aegates"},{"name":"Polybius","text":"Greek historian, our main source for the war.","sec":"sources-and-debates"}],"dates":[{"when":"264 BC","text":"Roman legions cross to Sicily: the war begins.","sec":"messana"},{"when":"261 BC","text":"Carthage’s relief army is beaten at Akragas.","sec":"siege-of-akragas"},{"when":"260 BC","text":"Rome builds a fleet; Duilius wins at Mylae.","sec":"corvus-and-mylae"},{"when":"256 BC","text":"Cape Ecnomus, perhaps the largest sea battle ever; Regulus lands in Africa.","sec":"regulus-in-africa"},{"when":"255 BC","text":"Regulus is captured; a storm sinks most of Rome’s fleet.","sec":"regulus-in-africa"},{"when":"249 BC","text":"Carthage’s greatest naval victory, at Drepana.","sec":"drepana-and-stalemate"},{"when":"247 BC","text":"Hamilcar Barca takes command in Sicily.","sec":"drepana-and-stalemate"},{"when":"241 BC","text":"Battle of the Aegates Islands; peace; Sicily becomes Rome’s first province.","sec":"battle-of-the-aegates"},{"when":"237 BC","text":"Rome forces Carthage to give up Sardinia and Corsica.","sec":"peace-and-aftermath"}],"terms":[{"latin":"Carthago","english":"Carthage","sec":"rome-and-carthage"},{"latin":"Punici","english":"the Carthaginians (“Phoenicians”), hence “Punic”","sec":"rome-and-carthage"},{"latin":"senatus","english":"the Senate","sec":"messana"},{"latin":"comitia","english":"the popular assembly","sec":"messana"},{"latin":"consules","english":"the two consuls","sec":"messana"},{"latin":"praeda","english":"plunder","sec":"messana"},{"latin":"legiones","english":"legions of about 4,500 men","sec":"messana"},{"latin":"socii","english":"Rome’s allies","sec":"rome-builds-a-fleet"},{"latin":"rostrum","english":"a warship’s bronze ram","sec":"rome-builds-a-fleet"},{"latin":"corvus","english":"“the raven”: the boarding bridge","sec":"corvus-and-mylae"},{"latin":"triumphus","english":"a victory parade","sec":"peace-and-aftermath"},{"latin":"provincia","english":"an overseas territory under a Roman governor","sec":"peace-and-aftermath"}]}},{"id":"hannibal-in-italy","era":"middle-republic","short":"Hannibal in Italy","title":"Hannibal in Italy","period":"241-216 BC","sources":["Second Punic War","Hannibal's crossing of the Alps","Battle of Cannae"],"briefing":{"title":"Italy, 218 BC","paragraphs":["In 218 BC Carthage, a rich trading city in what is now Tunisia, is still smarting from defeat in the First Punic War. Rome has stripped it of Sicily, then Sardinia and Corsica. But from a new power base in Spain, the young general Hannibal is ready to strike back.","Rather than wait for Rome to attack Spain or Africa, he marches his army, elephants and all, over the Alps into Italy. Rome's legions and its Italian allies face their sternest test: can the Republic survive an enemy genius on its own soil?"]},"sections":[{"id":"after-the-first-war","title":"A Bitter Peace","body":"In 241 BC Rome and Carthage (*Carthago*), a wealthy trading city in what is now Tunisia, ended twenty-three years of war. The First Punic War, fought mostly on and around Sicily, had been the longest continuous conflict and the greatest naval war of the ancient world. Carthage lost, and under peace terms dictated by Rome it gave up its possessions on Sicily.\n\nWorse followed. Carthage was soon fighting for its life against its own rebellious mercenaries and African subjects, a struggle known as the Truceless War. Rome exploited the distraction. In 238 BC it broke the treaty and seized Carthaginian Sardinia and Corsica. Many Carthaginians were deeply embittered by this.\n\nYet Carthage was far from broken. It remained the most prosperous port of its day and paid its war debt to Rome with ease. One leading family, the Barcas, began planning how Carthage could one day stand up to Rome again."},{"id":"barcas-in-spain","title":"The Barca Family Builds a Base in Spain","body":"Hannibal's father, a Carthaginian general nicknamed Barca, meaning 'lightning', crushed the mercenary revolt in 237 BC. He drew a clear lesson: if Carthage was to face Rome again, it needed a stronger base. That same year he led his army to Iberia (*Hispania*), the peninsula that is now Spain and Portugal.\n\nCarthage had held only a few coastal towns there. Through years of hard mountain fighting, he carved out a near-royal domain in the south and east. It gave Carthage silver mines, rich farmland, shipyards and a deep pool of recruits.\n\nHe was killed fighting local tribes around 228 BC, reportedly before the eyes of his young son Hannibal. Command passed to his son-in-law. In 226 BC Rome and Carthage agreed the Ebro Treaty, which made the Ebro, a river in north-east Spain, the northern limit of Carthage's sphere. When the son-in-law was murdered in 221 BC, the army's officers chose Hannibal, then just 26, as their commander."},{"id":"saguntum","title":"Saguntum and the Road to War","body":"Some time after the Ebro Treaty, Rome made a separate agreement with Saguntum, a city on Spain's east coast lying well south of the river. To Carthage, this looked like Roman meddling in its own sphere.\n\nHannibal spent his first two years in command conquering the tribes south of the Ebro, until only Saguntum stood apart. According to one ancient account, he tried to goad the Saguntines into striking first. When that failed, he besieged the city in 219 BC. It held out for eight months, yet Rome sent no help. When it fell, Hannibal sold its people as slaves and shared the loot with his soldiers and the citizens of Carthage.\n\nRome sent an embassy to Carthage led by Fabius Maximus, the senator later famous as Rome's most patient general. Its demands were curt and were rejected. In spring 218 BC Rome declared war.\n\nMeanwhile, in Cisalpine Gaul (*Gallia Cisalpina*), the Po valley lands of Celtic tribes in northern Italy, Rome was founding new colonies (*coloniae*) of settlers on the best land. The Gauls seethed, and Hannibal's envoys were already courting them."},{"id":"crossing-the-alps","title":"Hannibal Crosses the Alps","body":"Rome planned to fight in Spain and Africa. Hannibal instead carried the war to Italy by land, avoiding Rome's control of the sea. In May or June 218 BC he marched north from New Carthage, his main base, now Cartagena.\n\nAt the Rhône, a hostile Gallic tribe waited on the far bank. Hannibal sent a detachment about 40 km (25 miles) upstream to cross and fall on them from behind as his main army rowed over. His elephants were coaxed onto rafts covered with earth, so they believed they were still on land. A Roman army that landed at Massalia, a Greek city now Marseille, missed him.\n\nHannibal reached the Alps in late autumn and crossed them in 15 days. Mountain tribes ambushed his columns and rolled boulders down on them, and pack animals plunged off cliffs. Most of his men, from Africa and Spain, had never known such cold. On the descent a landslide had broken the path for about 275 m (300 yards), and the exhausted troops had to rebuild it.\n\nIn November he entered northern Italy with about 20,000 infantry, 6,000 cavalry and the few survivors of 37 elephants."},{"id":"which-pass","title":"The Mystery of Hannibal's Pass","body":"Exactly where Hannibal crossed the Alps has been argued over since the decades after the war. Polybius, the most trusted ancient historian of the period, gives just three place names, and no weapons or camps have been found. French scholars coined a word, 'Hannibalism', for chasing a question that may have no answer.\n\nCandidates include the Little St Bernard Pass, the Col de Clapier and the Col de la Traversette. Recently the Traversette, on the modern French-Italian border, has gained ground. Researchers studying peat bogs on both sides of its summit found soil heavily churned, they argue, by thousands of animals and people. It also held unusual levels of bacteria from the guts of horses and mules. Radiocarbon dating put this around 218 BC.\n\nThe texts fit too. Polybius wrote that Hannibal took the highest pass, and the Traversette is the highest in the western Alps. Polybius also says Hannibal cheered his men by pointing to the plains of the Po below. That view is visible from the Traversette, but not from the Little St Bernard. Sceptics still argue the evidence is too thin to be certain."},{"id":"trebia-and-trasimene","title":"Disasters at the Trebia and Lake Trasimene","body":"Hannibal struck almost at once. In late November 218 BC his cavalry routed Roman horsemen at the Ticinus, a river in the Po valley, and most Gallic tribes declared for him.\n\nRome rushed a second army north from Sicily, abandoning its planned invasion of Africa. In December the combined force was lured into battle at the Trebia, a tributary of the Po, on ground of Hannibal's choosing. The Carthaginians surrounded the Romans, and only about 10,000 of 40,000 fought their way out. Gauls flocked to the winner, swelling his army to some 60,000.\n\nIn spring 217 BC Hannibal crossed the Apennines, the mountain spine of Italy, by an unguarded route. He ravaged the countryside to goad the Roman commander, one of the two consuls (*consules*) elected yearly to lead Rome's armies, into a hasty pursuit. At Lake Trasimene in central Italy he sprang an ambush. Some 15,000 Romans died, the consul among them, and 10,000 were captured.\n\nRoman prisoners were treated harshly, but Rome's Italian allies (*socii*) were freed and sent home to praise Carthage. Hannibal hoped to pull Rome's alliance apart."},{"id":"fabius-the-delayer","title":"Fabius the Delayer","body":"News of Trasimene caused panic in Rome. The voters turned to Fabius Maximus, the senator who had carried Rome's ultimatum to Carthage, and made him dictator, an emergency office giving one man supreme command for a limited term.\n\nFabius refused to fight the battle Hannibal wanted. He avoided pitched battles, harassed the invaders and cut their supply lines, wearing them down while Rome rebuilt its strength. This became known as the 'Fabian strategy'.\n\nIt was deeply unpopular. Hannibal marched through Italy's richest farmland, plundering as he went, to shame Fabius into battle. Fabius would not budge. Soldiers, senators and ordinary citizens mocked him as the Delayer (*Cunctator*). Many feared that Rome's unprotected allies would defect to save themselves.\n\nWhen his term ended, his powers were not renewed. For 216 BC the voters elected two consuls: Varro, a man of reportedly humble origins who demanded an aggressive war, and an aristocratic colleague who favoured a middle course. Events would soon vindicate Fabius, who was elected consul in 215 and again in 214 BC."},{"id":"battle-of-cannae","title":"The Battle of Cannae","body":"In spring 216 BC Hannibal seized a large Roman supply depot at Cannae, a village on the plain of Apulia in south-east Italy. The Senate (*senatus*) answered with the biggest army Rome had ever raised: eight Roman legions (*legiones*) plus as many allies, about 86,000 men. The two consuls took turns in command day by day, and tradition says Varro held it on 2 August 216 BC, the day of battle.\n\nThe Romans packed their infantry unusually deep, hoping to smash Hannibal's centre by sheer weight. Hannibal laid a trap. He placed Gauls and Spaniards in the centre, bulging toward the enemy in a crescent, and stood among them himself. Veteran African infantry waited at either end.\n\nOn one wing his Spanish and Gallic horsemen crushed the Roman cavalry, then rode behind the Roman army to rout the allied horse on the other wing. Meanwhile Hannibal's centre gave ground step by step, as planned. The Romans crowded in so tightly they could barely swing their swords. Then the Africans turned inward on both flanks, and the cavalry struck the rear.\n\nThis 'double envelopment', or pincer movement, has been studied by generals ever since."},{"id":"after-cannae","title":"Cannae's Toll and Rome's Defiance","body":"What followed was slaughter. Polybius, the most trusted ancient historian, put losses at 70,000 infantry killed and 10,000 captured. Livy, a Roman historian writing two centuries later, gave about 48,000 dead. Varro's fellow consul died, along with about 80 senators or men eligible to be senators. Varro escaped with 70 horsemen. Hannibal lost between 5,700 and 8,000 men.\n\nIn just 20 months Rome had lost perhaps 150,000 men, a fifth of its male citizens over 17. Priests consulted the Sibylline Books (*Libri Sibyllini*), sacred prophecies kept for emergencies, and people were buried alive in Rome's cattle market as a sacrifice. Capua, Italy's second city, and the port of Tarentum went over to Hannibal.\n\nHis cavalry commander urged a march on Rome and, it is said, cried: 'You know how to win a victory, Hannibal; you do not know how to use it.' Modern historians note that his battered army was in no state to assault Rome.\n\nHannibal offered moderate peace terms instead. The Senate refused to talk, banned the word 'peace' and enlisted even slaves. Rome fought on for fourteen more years."},{"id":"sources-and-blame","title":"Who Tells the Story, and Who Was to Blame?","body":"Most of what we know about these years comes from two writers. Polybius was a Greek taken to Rome as a hostage in 167 BC, who wrote after 146 BC. He interviewed participants from both sides, and modern historians generally trust him. But his account survives only in fragments after 216 BC, and his patron was the grandson of the consul killed at Cannae.\n\nLivy, writing in Rome under the emperor Augustus, relied heavily on Polybius but was openly patriotic. Modern scholars find his battle descriptions often inaccurate.\n\nThese biases shape the story of Cannae. Livy blames the low-born Varro, painted as reckless, while his aristocratic colleague appears wise and cautious. Some historians suspect Varro was a scapegoat, since his colleague's powerful family guarded its reputation. Tellingly, the Senate greeted Varro warmly after the battle, unlike other defeated generals. And the Roman commander normally stood on the right wing, where Varro's colleague fought, so no one can be sure who was in charge.\n\nEven the casualty figures are doubted. One modern writer asks whether 50,000 Carthaginians could really kill up to 70,000 Romans in one afternoon."}],"battle":{"name":"Cannae","year":"216 BC","enemy":"Hannibal","sec":"battle-of-cannae","intro":"Rome has raised its biggest army ever to crush Hannibal on the plain of Cannae. Hannibal has laid a trap. Can you hold where Rome broke?"},"timelines":[{"name":"The Big Picture","blurb":"Four turning points from defeat to Carthage's greatest victory.","events":[{"label":"First Punic War ends","when":"241 BC","y":-241,"fact":"After twenty-three years of war, fought mostly around Sicily, a defeated Carthage gave up its Sicilian possessions.","sec":"after-the-first-war"},{"label":"Army officers choose Hannibal","when":"221 BC","y":-221,"fact":"When Barca's son-in-law was murdered, the officers in Spain chose Hannibal, then just 26, as their commander.","sec":"barcas-in-spain"},{"label":"Hannibal crosses the Alps","when":"Late autumn 218 BC","y":-218,"fact":"He crossed in 15 days and entered northern Italy in November with about 20,000 infantry and 6,000 cavalry.","sec":"crossing-the-alps"},{"label":"Battle of Cannae","when":"2 August 216 BC","y":-216,"fact":"Hannibal's double envelopment destroyed the biggest army Rome had ever raised.","sec":"battle-of-cannae"}]},{"name":"Road to Disaster","blurb":"From a broken treaty to Roman armies destroyed in Italy.","events":[{"label":"Rome seizes Sardinia and Corsica","when":"238 BC","y":-238,"fact":"Rome broke the treaty while Carthage fought the Truceless War against its own mercenaries, deeply embittering many Carthaginians.","sec":"after-the-first-war"},{"label":"Ebro Treaty agreed","when":"226 BC","y":-226,"fact":"The treaty made the Ebro, a river in north-east Spain, the northern limit of Carthage's sphere.","sec":"barcas-in-spain"},{"label":"Hannibal besieges Saguntum","when":"219 BC","y":-219,"fact":"The city on Spain's east coast held out for eight months, but Rome sent no help.","sec":"saguntum"},{"label":"Roman army trapped at the Trebia","when":"December 218 BC","y":-218,"fact":"Only about 10,000 of 40,000 Romans fought their way out, and Gauls flocked to Hannibal.","sec":"trebia-and-trasimene"},{"label":"Ambush at Lake Trasimene","when":"Spring 217 BC","y":-217,"fact":"Some 15,000 Romans died, the consul among them, and 10,000 were captured.","sec":"trebia-and-trasimene"},{"label":"Fabius elected consul","when":"215 BC","y":-215,"fact":"Events vindicated the cautious 'Delayer', who was elected consul in 215 and again in 214 BC.","sec":"fabius-the-delayer"}]},{"name":"Fathers, Dictators and Historians","blurb":"Eight steps from the Barcas in Spain to the historian who told the story.","events":[{"label":"Barca leads his army to Iberia","when":"237 BC","y":-237,"fact":"After crushing the mercenary revolt, Hannibal's father went to Spain to build Carthage a stronger base against Rome.","sec":"barcas-in-spain"},{"label":"Barca killed fighting local tribes","when":"Around 228 BC","y":-228,"fact":
