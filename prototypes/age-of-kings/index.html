<title>Chronology Jam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen phone game. Pompeian fresco wall (red) framing black panels (the boards),
   bright tesserae-coloured tiles. Seven mini-games share the look; every game screen is
   header -> task line -> board -> hint card. Deliberately single-theme: the fresco look is the
   identity, so every colour is set explicitly. */
:root {
  --wall: #8e2b22;          /* Pompeian red */
  --wall-deep: #6d1f19;
  --panel: #1b1715;         /* black fresco panel */
  --panel-line: #3a312c;
  --ink: #fbf3e4;
  --ink-soft: #e2cdb0;
  --ochre: #e0a63a;
  --good: #7fb069;
  --bad: #e2574c;
  --tile-1: #e0a63a;        /* ochre */
  --tile-2: #4f8fb8;        /* Egyptian blue */
  --tile-3: #6aa37a;        /* malachite green */
  --tile-4: #e9e1cf;        /* marble */
  --tile-5: #c86a3c;        /* cinnabar */
  --tile-ink: #1b1715;
  --sea: #2f5f7d;
  --land: #c9b48a;
  --display: "Marcellus", "Trajan Pro", Georgia, serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--wall);
  background-image: linear-gradient(90deg, rgba(0,0,0,.08) 1px, transparent 1px), radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.06), transparent 60%);
  background-size: 33.3% 100%, 100% 100%;
  color: var(--ink); font: 500 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent;
}
.battle-host { margin-inline: -16px; }
.test-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.test-steps li { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--panel-line); color: var(--ink-soft); }
.test-steps li.done { background: #2f3a26; border-color: #3f5233; color: var(--good); }
.test-steps li.next { background: var(--ochre); border-color: var(--ochre); color: var(--tile-ink); }
.battle-card.locked { border-color: var(--panel-line); }
.battle-card.locked h2, .battle-card.locked .task { color: var(--ink-soft); }
.level-card.up-next { border: 2px solid var(--ochre); }
.up-next-label { color: var(--ochre); font-weight: 800; }
.test-progress { display: grid; gap: 6px; font-size: 13.5px; color: var(--ink-soft); }
.test-progress .mini-progress { margin-top: 0; }
.app { max-width: 560px; min-height: 100%; margin: 0 auto; padding-inline: 16px; padding-block: 14px 24px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .02em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand small { text-transform: uppercase; letter-spacing: .14em; font-size: 11px; color: var(--ink-soft); font-weight: 700; }
.brand h1 { font-size: 26px; line-height: 1.1; }
.ghost { background: transparent; border: 1.5px solid rgba(251,243,228,.45); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.primary { background: var(--ochre); color: var(--tile-ink); border: none; border-radius: 999px; padding: 11px 20px; font-weight: 800; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }

/* home */
.eras { display: grid; gap: 12px; }
.era-card { display: grid; gap: 4px; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 16px; }
.era-card b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; }
.era-period { font: 800 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ochre); }
.era-blurb { color: var(--ink-soft); font-size: 14.5px; }
.era-meta { font-size: 13px; font-weight: 800; color: var(--ink-soft); margin-top: 4px; font-variant-numeric: tabular-nums; }
.era-card[disabled] { opacity: .5; cursor: default; }
.mini-progress { height: 6px; border-radius: 999px; background: #3a312c; overflow: hidden; margin-top: 6px; }
.mini-progress span { display: block; height: 100%; background: var(--ochre); }
.chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.chapter-card { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--radius); padding: 12px 14px; }
.chapter-num { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--ochre); color: var(--tile-ink); font-family: var(--display); font-size: 19px; }
.chapter-meta { min-width: 0; display: grid; gap: 2px; }
.chapter-meta b { font-family: var(--display); font-weight: 400; font-size: 19px; }
.chapter-meta > span { font-size: 13px; color: var(--ink-soft); }
.run-card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.run-card h2 { font-size: 23px; }
.run-steps { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.run-steps li { font-size: 12.5px; font-weight: 800; color: var(--tile-ink); padding: 4px 10px; border-radius: 999px; }
.run-card .actions { justify-self: start; }
.section-label { margin: 6px 0 -4px; font: 800 11px/1.3 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.levels { display: grid; gap: 8px; }
.level-card { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--radius); padding: 10px 14px; text-align: left; width: 100%; }
.level-card .num { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-family: var(--display); font-size: 18px; color: var(--tile-ink); }
.level-card .meta { min-width: 0; }
.level-card .meta b { display: block; font-family: var(--display); font-weight: 400; font-size: 18px; }
.level-card .meta span { font-size: 13px; color: var(--ink-soft); }
.stars { font-size: 15px; letter-spacing: 2px; color: var(--ochre); white-space: nowrap; }
.stars .off { color: #574a42; }
.level-card[disabled] { opacity: .45; cursor: not-allowed; }
.footnote { font-size: 12px; color: var(--ink-soft); margin: 4px 0 0; }

/* shared play UI */
.status { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.task { margin: 0; color: var(--ink-soft); font-size: 14px; }
.score { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.round-pill { align-self: flex-start; font: 800 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; background: var(--wall-deep); color: var(--ink-soft); padding: 6px 10px; border-radius: 999px; }
.hint { background: var(--ink); color: var(--tile-ink); border-radius: var(--radius); padding: 12px 14px; font-size: 14.5px; border-left: 6px solid var(--bad); }
.hint.ok { border-left-color: var(--good); }
.hint.neutral { border-left-color: var(--ochre); }
.hint b { font-weight: 800; }
.hint p { margin: 0; }
.shake { animation: shake .42s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px) rotate(-1.5deg); } 40% { transform: translateX(6px) rotate(1.5deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.board { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; position: relative; }
.tile {
  position: relative; border: none; border-radius: 12px; min-height: 74px; padding: 10px 12px 12px; color: var(--tile-ink); text-align: left;
  font-weight: 800; font-size: 15px; line-height: 1.25; opacity: 1;
  box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), 0 2px 0 rgba(0,0,0,.35);
  transition: transform .12s ease; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
}
.tile:active { transform: translateY(2px); }

/* Chronology Jam */
.road { position: relative; background: #2a2420; border-radius: var(--radius); padding: 12px 10px; overflow-x: auto; scrollbar-width: none; }
.road::-webkit-scrollbar { display: none; }
.road::before { content: ""; position: absolute; left: 10px; right: 10px; top: 50%; border-top: 2px dashed rgba(224,166,58,.35); }
.road.drop-target { box-shadow: 0 0 0 3px var(--ochre); }
.lanes { position: relative; display: flex; gap: 8px; min-height: 64px; align-items: center; }
.slot { flex: 0 0 auto; width: 92px; min-height: 58px; border-radius: 10px; border: 1.5px dashed rgba(251,243,228,.22); background: #221d1a; display: grid; place-items: center; font-family: var(--display); color: rgba(251,243,228,.35); }
.slot.filled { border: none; color: var(--tile-ink); padding: 6px 7px; text-align: center; font-family: var(--body); font-weight: 800; font-size: 11.5px; line-height: 1.2; }
.slot.filled em { display: block; font-style: normal; font-weight: 700; font-size: 10.5px; opacity: .75; margin-top: 2px; }
.board.gate::after { content: "PORTA"; position: absolute; left: 50%; top: -11px; transform: translateX(-50%); background: var(--wall-deep); color: var(--ink-soft); font: 700 10px/1 var(--body); letter-spacing: .25em; padding: 5px 10px 5px 12px; border-radius: 999px; }
.tile .when { font-size: 11.5px; font-weight: 700; opacity: 0; transform: translateY(3px); transition: opacity .25s, transform .25s; }
.tile.revealed .when { opacity: .78; transform: none; }
.tile.gone { visibility: hidden; }
.dragging { z-index: 20 !important; transition: none !important; opacity: 1 !important; box-shadow: 0 14px 24px rgba(0,0,0,.5) !important; cursor: grabbing; }
.flyer { position: fixed; z-index: 30; pointer-events: none; margin: 0; opacity: 1; }

/* Match Pairs */
.pairs { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 10px; }
.pairs .col { display: grid; gap: 10px; align-content: start; }
.pick { border: 2px solid transparent; border-radius: 12px; padding: 10px 11px; min-height: 64px; background: var(--tile-4); color: var(--tile-ink); text-align: left; font-weight: 800; font-size: 14.5px; line-height: 1.25; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15), 0 2px 0 rgba(0,0,0,.35); transition: transform .15s ease, background .2s ease; }
.pick.desc { font-weight: 700; font-size: 13.5px; }
.pick.selected { border-color: var(--ochre); transform: translateY(-2px) scale(1.02); box-shadow: 0 0 0 3px rgba(224,166,58,.45); }
.pick.matched { cursor: default; box-shadow: none; }
.pick.matched::after { content: " ✓"; }

/* True or False */
.deck { position: relative; display: grid; min-height: 280px; }
.deck > .card { grid-area: 1 / 1; }
.card { width: 100%; min-height: 250px; border-radius: 20px; padding: 22px 20px; background: var(--tile-4); color: var(--tile-ink); box-shadow: 0 14px 28px rgba(0,0,0,.35); display: flex; flex-direction: column; justify-content: space-between; gap: 18px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; position: relative; z-index: 2; opacity: 1; }
.card.behind { z-index: 1; transform: translateY(12px) scale(.95); background: #d8ccb2; box-shadow: none; pointer-events: none; }
.card.behind > * { visibility: hidden; }
.card .claim { font-family: var(--display); font-size: 25px; line-height: 1.25; text-wrap: balance; margin: 0; }
.card .count { font: 800 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: #6b5d50; }
.card .stamp { position: absolute; top: 18px; padding: 6px 12px; border: 3px solid currentColor; border-radius: 8px; font: 800 18px/1 var(--body); letter-spacing: .1em; opacity: 0; background: var(--tile-4); }
.card .stamp.t { right: 16px; color: #3f7c38; transform: rotate(10deg); }
.card .stamp.f { left: 16px; color: #b8382e; transform: rotate(-10deg); }
.swipe-hint { font-size: 13px; color: #6b5d50; margin: 0; }
.answer-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answer-buttons button { border: none; border-radius: 14px; padding: 14px; font-weight: 800; font-size: 17px; color: var(--tile-ink); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
.btn-false { background: #e88b80; } .btn-true { background: #9ccc8a; }
.verdict { display: grid; gap: 10px; }

/* Odd One Out */
.odd { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.odd .tile { min-height: 96px; justify-content: center; font-size: 16px; }
.tile.dim { opacity: .35; }
.tile.right-pick { outline: 4px solid var(--good); }

/* Who Am I */
.clues { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.clue { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 15.5px; }
.clue .n { width: 26px; height: 26px; border-radius: 50%; background: var(--ochre); color: var(--tile-ink); display: grid; place-items: center; font: 800 13px/1 var(--body); }
.clue.hidden-clue { color: #6f6159; }
.clue.hidden-clue .n { background: #3a312c; color: #8a7b70; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { border: none; border-radius: 12px; padding: 12px; min-height: 54px; font-weight: 800; font-size: 15px; color: var(--tile-ink); background: var(--tile-4); box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); text-align: left; }
.choice.wrong { background: #e88b80; opacity: .6; }
.choice.right { background: #9ccc8a; }
.more { justify-self: start; }

/* Map Drop */
.map-wrap { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 10px; }
.map { display: block; width: 100%; height: auto; border-radius: 12px; touch-action: none; }
.map .sea { fill: var(--sea); }
.map .land { fill: var(--land); }
.map .river { fill: none; stroke: #4c86ab; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.map .spot { fill: var(--panel); stroke: var(--ink); stroke-width: 2.5; cursor: pointer; }
.map .spot.target { fill: var(--ochre); }
.map .spot.done { fill: var(--good); stroke: var(--panel); }
.map .rome { fill: var(--wall); stroke: var(--panel); stroke-width: 2; }
.map text { font: 800 11px var(--body); fill: var(--tile-ink); paint-order: stroke; stroke: var(--land); stroke-width: 3px; }
.map text.sea-label { fill: #c7dceb; stroke: none; font: 700 10px var(--body); letter-spacing: .2em; }
.labels { display: flex; flex-wrap: wrap; gap: 8px; }
.label-chip { border: 2px solid transparent; border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 14px; color: var(--tile-ink); touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); opacity: 1; }
.label-chip.selected { border-color: var(--ink); transform: translateY(-2px); }

/* Legion Quiz */
.legion { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 12px 14px; display: grid; gap: 6px; }
.legion-row { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; }
.legion-row span { font: 800 10.5px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.soldiers { display: flex; flex-wrap: wrap; gap: 4px; min-height: 26px; align-items: center; }
.soldiers svg { width: 20px; height: 26px; }
.soldiers .empty { font-size: 12px; color: #6f6159; }
.question { background: var(--tile-4); color: var(--tile-ink); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.question h3 { font-size: 21px; line-height: 1.25; }
.question .lvl { font: 800 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: #6b5d50; }
.options { display: grid; gap: 8px; }
.option { border: 2px solid #cfc4ad; border-radius: 12px; padding: 11px 12px; text-align: left; background: #f6f0e2; color: var(--tile-ink); font-weight: 700; font-size: 15px; }
.option.right { background: #9ccc8a; border-color: #5d9a4c; }
.option.wrong { background: #e88b80; border-color: #b8382e; }

/* results */
.result { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.result h2 { font-size: 28px; }
.big-stars { font-size: 34px; letter-spacing: 6px; color: var(--ochre); line-height: 1; }
.big-stars .off { color: #574a42; }
.recap { list-style: none; margin: 0; padding: 0; display: grid; }
.recap li { display: grid; grid-template-columns: 14px 1fr; gap: 12px; padding: 0 0 14px; position: relative; }
.recap li::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--ochre); margin-top: 4px; box-shadow: 0 0 0 3px var(--panel); position: relative; z-index: 1; }
.recap li.miss::before { background: var(--bad); }
.recap li:not(:last-child)::after { content: ""; position: absolute; left: 6px; top: 12px; bottom: 0; width: 2px; background: #4a3e37; }
.recap .when { display: block; font-size: 12px; color: var(--ochre); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.recap b { font-weight: 800; }
.recap p { margin: 2px 0 0; color: var(--ink-soft); font-size: 14px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.run-summary { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.run-summary li { display: flex; justify-content: space-between; gap: 10px; align-items: center; }

/* Test bar (always visible) */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  background: var(--panel); border-bottom: 1px solid var(--panel-line);
  box-shadow: 0 4px 14px rgba(0,0,0,.25);
}
.hud-inner { max-width: 560px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
.hud-units { display: flex; gap: 8px; flex: 1; min-width: 0; overflow: hidden; }
.hud-unit { display: flex; align-items: center; gap: 3px; font: 800 14px/1 var(--body); font-variant-numeric: tabular-nums; color: var(--ink); }
.hud-unit svg { width: 15px; height: 20px; }
.hud-unit.bump { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.35); } }
.hud-men { background: transparent; border: 1.5px solid rgba(251,243,228,.35); border-radius: 999px; padding: 5px 10px; text-align: right; font: 800 12px/1.15 var(--body); white-space: nowrap; }
.hud-men small { display: block; font-weight: 700; font-size: 10.5px; color: var(--ochre); }
.flying-unit { position: fixed; z-index: 60; pointer-events: none; width: 20px; height: 26px; }
/* Bottom sheet with the chapter text */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(20,12,10,.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet-panel { background: var(--ink); color: var(--tile-ink); width: 100%; max-width: 640px; max-height: 82%; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px 10px; border-bottom: 1px solid #e2d6bf; }
.sheet-head h2 { font-size: 22px; }
.ghost.dark { border-color: rgba(27,23,21,.35); color: var(--tile-ink); }
.sheet-body { position: relative; overflow-y: auto; padding: 6px 18px 24px; -webkit-overflow-scrolling: touch; }
.sheet-body section { padding: 12px 10px; margin: 0 -10px; border-radius: 12px; transition: background .6s ease; }
.sheet-body section.focus { background: #f3dfa9; }
.sheet-body h3 { font-size: 19px; margin-bottom: 6px; }
.sheet-body p { margin: 0 0 10px; max-width: 65ch; line-height: 1.55; }
.sheet-body em { color: #8e2b22; font-style: italic; }
.kf-tabs { display: flex; gap: 6px; margin: 4px 0 10px; position: sticky; top: -6px; background: var(--ink); padding: 6px 0; z-index: 1; }
.kf-tabs button { border: 1.5px solid #c9b48a; background: transparent; color: var(--tile-ink); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; }
.kf-tabs button[aria-selected="true"] { background: var(--tile-ink); color: var(--ink); border-color: var(--tile-ink); }
.kf-tabs.wrap { flex-wrap: wrap; }
.qa-item { padding: 9px 0; border-bottom: 1px solid #e2d6bf; font-size: 14.5px; line-height: 1.4; }
.qa-item p { margin: 3px 0 0 !important; font-size: 13.5px; color: #4a3f35; }
.qa-dim { font-weight: 600; font-size: 12.5px; color: #8a7a68; }
.sheet-body h3 + .qa-item { border-top: none; }
.review-pill { background: var(--ochre); color: var(--tile-ink); border-radius: 999px; padding: 3px 8px; font: 800 11px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; margin-right: 6px; }
.review-card { border: 2px dashed var(--ochre); }
.kf { margin: 0; display: grid; }
.kf-row { display: grid; grid-template-columns: minmax(0, 8em) 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid #e2d6bf; }
.kf dt { font-weight: 800; font-size: 14.5px; }
.kf dd { margin: 0; font-size: 14.5px; line-height: 1.4; }
.kf-read { border: none; background: none; color: #8e2b22; font-weight: 800; font-size: 13px; padding: 0 2px; text-decoration: underline; text-underline-offset: 2px; }
.cmap { margin: 4px 0 12px; }

function armyFor(score, L = LEVEL) {
  const steps = (score - 80) / 10
  const grain = Math.max(SCORE.minGrain, Math.round((L.start + SCORE.at80 + steps * SCORE.grainPer10) / 25) * 25)
  const vets = {}
  VET_ORDER.slice(0, Math.max(0, Math.round(SCORE.vetsAt80 + steps * SCORE.vetsPer10))).forEach(t => { vets[t] = (vets[t] ?? 0) + 1 })
  // helpers: a medicus (army doctor) from 80%, an augur from 90%
  return { grain, vets, medicus: score >= 80, augur: score >= 90 }
}

  if (d.moved) {
    if (c?.inGrid) place(d.type, c.lane, c.row)

})

// ---------- campaign map, briefings, results ----------
let overlay
function showPanel(html, handlers) {
  overlay.innerHTML = `<div class="panel">${html}</div>`; overlay.hidden = false; overlay.scrollTop = 0
  for (const [id, fn] of Object.entries(handlers)) overlay.querySelector('#' + id)?.addEventListener('click', fn)
  paintIcons(overlay)
  overlay.querySelector('.primary, .road button:not([disabled])')?.focus({ preventScroll: true })
}
// small portraits of units and enemies inside panels
function paintIcons(root) {
  for (const cv of root.querySelectorAll('canvas.ic')) {
    const c = cv.getContext('2d'), unit = cv.dataset.unit, foe = cv.dataset.foe
    c.setTransform(2, 0, 0, 2, 0, 0)
    if (unit) { const sc = { cart: 0.6, caltrops: 1.1, shed: 0.6, pigs: 0.95 }[unit] ?? 0.5; c.translate(22, { cart: 36, caltrops: 28, shed: 38, pigs: 34 }[unit] ?? 41); c.scale(sc, sc); DRAW_UNIT[unit](c, ghostUnit(unit), 0) }
    if (foe) { const sc = { elephant: 0.29, cavalry: 0.42, phalangite: 0.38 }[foe] ?? 0.46; c.translate(22, 42); c.scale(sc, sc); drawFoe(c, { type: foe, phase: 0, eating: null, shield: FOES[foe].shield ?? 0, shieldMax: FOES[foe].shield ?? 0 }, 0) }
  }
}
const starText = n => '★'.repeat(n) + '☆'.repeat(3 - n)
function showMap() {
  if (G) G.phase = 'map'
  const stops = LEVELS.map((L, i) => {
    const s = progress.stars[i] ?? 0, open = unlocked(i)
    return `<li class="stop ${s ? 'done' : open ? 'open' : 'locked'}"><button id="lvl${i}" ${open ? '' : 'disabled'}>
      <span class="num">${i + 1}</span>
      <span class="what"><b>${L.name}</b><small>${open ? `${L.year} · ${L.enemy}` : `Locked: win ${LEVELS[i - 1].name} first`}</small></span>
      ${open ? `<span class="stars" aria-label="${s} of 3 stars">${starText(s)}</span>` : ''}</button></li>`
  }).join('')
  showPanel(`<span class="eyebrow">Campaign · the rise of Rome</span><h1>Hold the Line</h1>
    <p>Five battles, from the Latin League to King Pyrrhus. Each one brings a new enemy and a new Roman unit.</p>
    <ol class="road">${stops}</ol>`,
    Object.fromEntries(LEVELS.map((L, i) => [`lvl${i}`, () => showBriefing(i)])))
}
function showGuide(focus, onBack) {
  const wasPlaying = G?.phase === 'play'
  if (wasPlaying) G.phase = 'paused'
  const back = onBack ?? (() => { overlay.hidden = true; if (wasPlaying) { G.phase = 'play'; last = performance.now() } })
  const foes = foeTypes(LEVEL)
  showPanel(`<div class="panel-top"><span class="eyebrow">Unit guide · ${LEVEL.name}</span><button class="tool close" id="back-top" aria-label="Close the guide">${wasPlaying ? 'Back to battle' : 'Close'} ✕</button></div><h2>Your soldiers</h2>
    <ul class="guide">${LEVEL.units.map(t => `<li class="${t === focus ? 'focus' : ''}"><canvas class="ic" data-unit="${t}" width="88" height="88"></canvas>
      <div><b>${UNITS[t].name}</b><span class="price">${UNITS[t].cost} rations</span><p>${UNIT_GUIDE[t]}</p></div></li>`).join('')}</ul>
    <h3>The enemy in this battle</h3>
    <ul class="guide">${foes.map(t => `<li><canvas class="ic" data-foe="${t}" width="88" height="88"></canvas><div><b>${FOES[t].name}</b><p>${FOE_GUIDE[t]}</p></div></li>`).join('')}</ul>
    <button class="primary" id="back">${wasPlaying ? 'Back to the battle' : 'Back'}</button>`, { back, 'back-top': back })
  overlay.querySelector('.focus')?.scrollIntoView({ block: 'center' })
  // tapping outside the guide, or Esc, closes it too
  closeGuide = back
  overlay.querySelector('.panel').classList.add('guide-panel')
}
let closeGuide = null
const guideOpen = () => mounted && !overlay.hidden && overlay.querySelector('.guide-panel')
document.addEventListener('pointerdown', e => { if (guideOpen() && !e.composedPath().some(n => n.classList?.contains('panel'))) { e.preventDefault(); closeGuide() } })
document.addEventListener('keydown', e => { if (e.key === 'Escape' && guideOpen()) closeGuide() })
const foeTypes = L => [...new Set(L.waves.flatMap(x => x.foes.flatMap(t => t.split('+'))))]
function newFoesOf(i) {
  const seen = new Set(LEVELS.slice(0, i).flatMap(foeTypes))
  return foeTypes(LEVELS[i]).filter(t => !seen.has(t) && FOES[t].intro)
}
function showBriefing(i) {
  const L = LEVELS[i]
  const news = [
    ...(L.newUnit ? [`<li><canvas class="ic" data-unit="${L.newUnit}" width="88" height="88"></canvas><span><b>New unit: ${UNITS[L.newUnit].name}.</b> ${UNITS[L.newUnit].about}</span></li>`] : []),
    ...(i > 0 ? newFoesOf(i).map(t => `<li><canvas class="ic" data-foe="${t}" width="88" height="88"></canvas><span><b>New enemy.</b> ${FOES[t].intro}</span></li>`) : []),
  ]
  const howto = i === 0 ? `<ul>
      <li><b>Drag</b> a unit onto a square, or tap it and then tap a square. <b>Press and hold</b> a unit to see what it does.</li>
      <li><b>Supply carts</b> bring rations. <b>Tap the grain</b> to collect it, and grain also falls from the sky.</li>
      <li><b>Slingers</b> shoot down their whole lane. <b>Triarii</b> kneel behind their shields and hold the line.</li>
      <li><b>Drag a soldier on the field</b> to move him to another empty square, to save him or to help another lane.</li>
      <li>If an enemy reaches the camp, the <b>equites</b> charge down that lane, but only once.</li>
    </ul>` : ''
  showPanel(`<span class="eyebrow">Battle ${i + 1} of ${LEVELS.length} · ${L.year}</span><h2>${L.name}</h2><p>${L.blurb}</p>${howto}${L.twist ? `<p class="twist"><b>This battle:</b> ${L.twist}</p>` : ''}
    ${news.length ? `<ul class="news">${news.join('')}</ul>` : ''}
    ${opts.mode === 'chapter' ? `<p class="twist"><b>Your chapter test: ${quizScore}%.</b> ${armyLine(quizScore, L)}</p>` : `<div class="score-pick"><span class="label">Your quiz result (test switch)</span>
      <div class="chips">${[60, 70, 80, 90, 100].map(v => `<button id="score${v}" aria-pressed="${v === quizScore}">${v}%</button>`).join('')}</div>
      <p class="army" id="army-line">${armyLine(quizScore, L)}</p></div>`}
    <div class="row"><button class="primary" id="go">To battle</button><button class="tool" id="guide-b">Unit guide</button><button class="tool" id="map">${opts.mode === 'chapter' ? 'Back to the chapter' : 'Map'}</button></div>`,
    { go: () => startLevel(i), map: opts.mode === 'chapter' ? () => exit({ left: true }) : showMap, 'guide-b': () => { newGame(i); showGuide(null, () => showBriefing(i)) },
      ...Object.fromEntries([60, 70, 80, 90, 100].map(v => [`score${v}`, () => {
        quizScore = v
        overlay.querySelectorAll('.chips button').forEach(b => b.setAttribute('aria-pressed', b.id === `score${v}`))
        overlay.querySelector('#army-line').textContent = armyLine(v, L)
      }])) })
}
function armyLine(score, L) {
  const a = armyFor(score, L), vets = Object.entries(a.vets).map(([t, n]) => `${n} ${n === 1 ? UNITS[t].name.toLowerCase() : UNITS[t].name.toLowerCase() + (t === 'triarius' ? '' : 's')}`.replace('triarius', n === 1 ? 'triarius' : 'triarii').replace('hastatuss', 'hastati'))
  return `You start with ${a.grain} grain${vets.length ? ` and veterans: ${vets.join(', ')}` : ' and no veterans'}.${a.medicus ? ` A medicus (army doctor) comes with you${a.augur ? ', and an augur' : ''}.` : ''}`
}
function startLevel(i, score = quizScore) {
  overlay.hidden = true
  newGame(i, score); sfx.init()

  else beginBattle()
}
function syncDeploy() {
  const left = Object.values(G.vets).reduce((a, b) => a + b, 0), box = $('deploy')
  box.hidden = G.phase !== 'deploy'
  $('deploy-text').textContent = left
    ? `Your test score earned you veterans. Drag them onto the field for free (${left} still to place).`
    : 'Your veterans are in place. Drag to adjust, then begin.'
  if (G.hasMedicus) $('deploy-text').textContent += ` Your medicus can heal ${MEDICUS.heals === 1 ? 'one wounded soldier, once per battle' : `${MEDICUS.heals} wounded soldiers`}: tap ✚ Medicus, then the soldier.`

function beginBattle() {

  G.phase = 'play'; G.selected = null; last = performance.now()
  syncDeploy(); renderTray(); layout()
  sfx.horn()
  if (levelIndex === 0) tutorial('start'); else announce(`${LEVEL.name} · ${LEVEL.year}`, true)
}
function starsFor() { const used = G.equites.filter(e => e.state !== 'ready').length; return used === 0 ? 3 : used <= 2 ? 2 : 1 }
function win() {
  if (G.phase !== 'play') return
  G.phase = 'won'; sfx.win()
  const stars = starsFor(), i = levelIndex, next = LEVELS[i + 1]
  if (opts.mode !== 'chapter') { progress.stars[i] = Math.max(progress.stars[i] ?? 0, stars); saveProgress() }
  setTimeout(() => showPanel(`<span class="eyebrow">Victory · ${LEVEL.year}</span><h2>You held the line at ${LEVEL.name}</h2>
    <p class="big-stars" aria-label="${stars} of 3 stars">${starText(stars)}</p>
    <p>${G.killed} enemies fell and you lost ${G.lost === 1 ? 'one soldier' : G.lost + ' soldiers'}. ${stars === 3 ? 'The equites never had to ride.' : 'Win without the equites charging for three stars.'}</p>
    <p class="history">${LEVEL.after}</p>
    ${next || opts.mode === 'chapter' ? '' : '<p><b>You have won the whole campaign: Rome rules Italy.</b></p>'}
    ${opts.mode === 'chapter' ? `<div class="row"><button class="primary" id="continue">Continue</button><button class="tool" id="again">Play again</button></div>`
      : `<div class="row">${next ? `<button class="primary" id="next">Next: ${next.name}</button>` : ''}<button class="tool" id="again">Play again</button><button class="tool" id="map">Map</button></div>`}`,
    { next: () => showBriefing(i + 1), again: () => startLevel(i), map: showMap, continue: () => exit({ won: true, stars }) }), 1200)
}
function lose() {
  if (G.phase !== 'play') return
  G.phase = 'lost'; sfx.lose(); G.shake = 8
  const hint = { regillus: 'Build supply carts early, cover every lane, and keep triarii for the strongest attacks.',
    volsci: 'Raiders are fast: have a slinger in every lane before the bursts, and principes to cut down those who arrive.',
    veii: 'Archers stop out of reach and shoot your front soldier. Put siege sheds in front and slingers behind them.',
    aquilonia: 'The Linen Legion is hard to kill. Rorarii in the middle lanes hit three lanes at once.',
    beneventum: 'Keep war pigs ready in front of your line: an elephant they reach runs back and tramples its own army.' }[LEVEL.id]
  setTimeout(() => showPanel(`<span class="eyebrow">Defeat · ${LEVEL.year}</span><h2>${LEVEL.enemy[0].toUpperCase() + LEVEL.enemy.slice(1)} broke into the camp</h2>
    <p>${G.killed} enemies fell before the line broke. ${hint}</p>
    ${opts.mode === 'chapter' ? `<p>Go back to the chapter: re-read the sections you missed and retake the test for a stronger army. Or fight again with the same army.</p>
    <div class="row"><button class="primary" id="chapter">Back to the chapter</button><button class="tool" id="again">Fight again</button></div>`
      : `<div class="row"><button class="primary" id="again">Try again</button><button class="tool" id="map">Map</button></div>`}`,
    { again: () => startLevel(levelIndex), map: showMap, chapter: () => exit({ won: false }) }), 1400)
}

// ---------- the loop ----------
let last = performance.now()
function frame(now) {
  if (!mounted) return
  const dt = Math.min(0.05, (now - last) / 1000); last = now
  if (G.phase === 'play') { for (let i = 0; i < G.speed; i++) update(dt) }
  else if (G.phase === 'won' || G.phase === 'lost') { for (const c of G.corpses) c.t = Math.min(c.t + dt, 1); G.shake = Math.max(0, G.shake - dt * 12) }

}

// ---------- mounting: one game inside a host element (its styles kept apart in a shadow root) ----------
const MARKUP = `<main class="game">
  <div class="tray" id="tray" aria-label="Your units. Drag one onto the field, or tap it and then tap a square."></div>

      <div class="hud-right">

        <button class="tool helper" id="medicus" hidden title="Tap, then tap a wounded soldier to heal him">✚ Medicus <b id="med-n"></b></button>
        <button class="tool helper" id="augur" hidden title="Once per battle: good omens make your soldiers fight harder">Augur</button>
      </div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="deploy" id="deploy" hidden><p id="deploy-text"></p><button class="primary" id="begin">Begin the battle</button></div>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="controls">
    <div class="progress"><span class="label" id="level">Lake Regillus</span><div class="bar" id="bar"><div class="fill" id="fill"></div></div></div>
    <button class="tool" id="pause">Pause</button>
    <button class="tool" id="speed">1×</button>
    <button class="tool" id="guide">Guide</button>
    <button class="tool" id="sound">Sound</button>
  </div>
</main>`
let host = null, sroot = null, mounted = false, opts = { mode: 'campaign' }
const $ = id => sroot.getElementById(id)
function bindControls() {
  canvas.addEventListener('pointerdown', e => {
    if (!G || (G.phase !== 'play' && G.phase !== 'deploy') || drag) return
    sfx.init()
    const c = cellAt(e.clientX, e.clientY); if (!c) return
    // grain first: it's the most urgent tap
    const d = G.drops.find(d => Math.hypot(d.x - c.x, d.y - c.y) < 26 * k + 8)
    if (d) return collect(d)
    if (!c.inGrid) return
    if (G.heal) {
      const u = unitAt(c.lane, c.row)
      if (u && u.hp < u.max && u.type !== 'caltrops' && u.type !== 'pigs') {
        u.hp = u.max; G.medicus--; G.medicusWait = MEDICUS.wait; G.heal = false; sfx.collect()
        G.fx.push({ kind: 'heal', x: lx(u.lane), y: ry(u.row + 0.5), t: 0.9 })
      } else sfx.deny()
      syncTray(); return
    }
    if (G.dismiss) { const u = unitAt(c.lane, c.row); if (u) { removeUnit(u, false); sfx.place() } G.dismiss = false; syncTray(); return }
    if (G.selected) { if (place(G.selected, c.lane, c.row)) select(null); return }
    const u = unitAt(c.lane, c.row)
    if (u && MOVABLE(u.type) && !u.travel) { moveDrag = { u, x0: e.clientX, y0: e.clientY, moved: false }; canvas.setPointerCapture(e.pointerId) }
  })
  $('dismiss').addEventListener('click', () => { if (G.phase !== 'play') return; G.dismiss = !G.dismiss; G.heal = false; G.selected = null; syncTray() })
  $('medicus').addEventListener('click', () => {
    if (G.phase !== 'play' || !G.medicus || G.medicusWait > 0) { sfx.deny(); return }
    G.heal = !G.heal; G.dismiss = false; G.selected = null; syncTray()
    if (G.heal) announce('Tap a wounded soldier to heal him.', false, 2000)
  })
  $('augur').addEventListener('click', () => {
    if (G.phase !== 'play' || !G.augur) { sfx.deny(); return }
    G.augur = 0; G.blessUntil = G.t + AUGUR.seconds; sfx.charge(); syncTray()
    announce(`The augur reads the birds: the gods favour Rome! Your soldiers fight harder for ${AUGUR.seconds} seconds.`, true, 3200)
  })
  $('speed').addEventListener('click', e => { G.speed = G.speed === 1 ? 2 : 1; e.currentTarget.textContent = G.speed + '×' })
  $('sound').addEventListener('click', e => { sfx.init(); sfx.on = !sfx.on; e.currentTarget.textContent = sfx.on ? 'Sound' : 'Muted'; e.currentTarget.classList.toggle('on', !sfx.on) })
  $('guide').addEventListener('click', () => { if (G.phase === 'play') showGuide() })
  $('begin').addEventListener('click', beginBattle)
  $('pause').addEventListener('click', () => {
    if (G.phase !== 'play') return
    G.phase = 'paused'
    showPanel(`<span class="eyebrow">Paused · ${LEVEL.name}</span><h2>Hold the Line</h2><p>${G.killed} enemies down, ${G.total - G.spawned} still to come.</p>
      <div class="row"><button class="primary" id="resume">Resume</button><button class="tool" id="map">Leave the battle</button></div>`,
      { resume: () => { overlay.hidden = true; G.phase = 'play'; last = performance.now() }, map: opts.mode === 'chapter' ? () => exit({ left: true }) : showMap })
  })

}
function exit(result) { const cb = opts.onExit; unmount(); cb?.(result) }
// opts: { mode: 'campaign' } (the standalone page: map, five battles, saved stars)
//    or { mode: 'chapter', level, score, onExit({ won, stars, left }) } (one battle with the army a chapter test earned)
function mount(el, o = {}) {
  unmount()

function unmount() {

}
return { mount, unmount, armyFor, LEVELS, debug: { get G() { return G }, place, collect, update, startLevel, beginBattle, armyFor, showMap, LEVELS, UNITS, FOES, progress } }
})()

<script>
// Every chapter's content is generated by tools/content-gen (content/generated/<chapter>/games.json,
// chapter.md and the quiz batches); build.mjs writes it in here. Flagged items are already left out.
const ERAS = [{"id":"kingdom","name":"The Kingdom","period":"753–509 BC","blurb":"Seven kings, from Romulus to Tarquin the Proud"},{"id":"early-republic","name":"The Early Republic","period":"509–264 BC","blurb":"Patricians against plebeians, and Rome’s conquest of Italy"},{"id":"middle-republic","name":"The Middle Republic","period":"264–121 BC","blurb":"Carthage, Hannibal and an empire across the sea"},{"id":"late-republic","name":"The Late Republic","period":"121–27 BC","blurb":"Ambitious generals, civil wars and the fall of the Republic"}]
const CHAPTERS = [{"id":"kingdom","era":"kingdom","short":"The Kingdom","title":"Early Rome & the Kingdom: The Foundation of an Empire","period":"753-509 BC","sources":["Roman Kingdom","Founding of Rome","Overthrow of the Roman monarchy"],"briefing":{"title":"Rome, 753–509 BC","paragraphs":["On a cluster of steep hills beside a ford over the Tiber River in central Italy, scattered villages are slowly merging into a city. Romans will later claim it was founded in 753 BC by Romulus, a twin raised by a she-wolf, though historians treat that as myth.","For about two centuries Rome is ruled by kings chosen for life: peacemakers, warriors, builders and Etruscan newcomers from the north. Who holds power, and how Romans finally drive out a tyrant, will shape the republic to come."]},"sections":[{"id":"origins","title":"A City Built From Villages","body":"Long before any king (*rex*), the site of Rome (*Roma*) had real advantages. A ford let travellers cross the Tiber River (*Tiberis*) in central Italy (*Italia*), and a cluster of steep, easily defended hills (*colles*, *montes*) rose from a wide, fertile plain.\n\nArchaeologists have found traces of Bronze Age settlement on the Capitoline Hill (*Mons Capitolinus*, or simply *Capitolium*), possibly from as early as 1700 BC. By 1000 BC the valley that later became the Roman Forum (*Forum Romanum*), the city's great public square, was a cemetery. Huts stood on the Palatine Hill (*Mons Palatinus*, or *Palatium*) by the 9th or 8th century BC, and around 730–720 BC someone built a wall (*murus*) there.\n\nAt about the same time, burials in the Forum stopped and parts of it were paved over, turning it into a shared meeting and worship space. Rome, in other words, did not spring up in a day. It grew from the gradual merging of several hilltop villages, probably inspired by the idea of the city-state (*civitas*; Greek *polis*) then spreading from Greece (*Graecia*). The later festival of the *Septimontium* (\"Seven Hills\") may preserve a memory of these early hill communities. By 600 BC the process was complete. Rome had a central forum, monumental buildings and public temples (*templa*)."},{"id":"romulus-and-remus","title":"The Legend of Romulus and Remus","body":"The Romans (*Romani*) told a far more dramatic story of their beginnings. According to legend, Rhea Silvia (also called *Ilia*) was a princess of Alba Longa, a Latin town in the hills south-east of Rome. Her uncle Amulius had seized the throne from her father, Numitor, and forced her to become a Vestal Virgin (*Virgo Vestalis*), a priestess of the goddess Vesta sworn to chastity. She nevertheless bore twins (*gemini*), Romulus and Remus, supposedly fathered by Mars (also *Mavors*), the god of war.\n\nAmulius ordered the babies left to die by the Tiber. Instead a she-wolf (*lupa*) suckled them in a cave called the Lupercal, and a shepherd (*pastor*) named Faustulus raised them. Grown up, the twins overthrew Amulius and restored their grandfather. They then set out to found a city (*urbs*) of their own, but quarrelled, and Remus was killed. Romulus built his city on the Palatine Hill.\n\nThe official founding date, worked out by the scholar Varro (*Marcus Terentius Varro*), was 753 BC, the year from which Romans counted *ab urbe condita* (\"from the founding of the city\", abbreviated AUC). It was celebrated on 21 April, the festival of the *Parilia*. Later Romans also traced the twins' family back to Aeneas, a hero who fled the fall of Troy (*Troia*). Most modern historians treat all this as myth. Even the name Romulus was probably invented from the city's name, making him, as the classicist Mary Beard put it, \"Mr Rome\"."},{"id":"romulus-the-king","title":"Romulus, the First King","body":"In Roman tradition Romulus, the legendary founder (*conditor*) of Rome, was also its first king, and he was credited with creating its basic institutions. He welcomed newcomers of every kind, including exiles, criminals and runaway slaves (*servi fugitivi*), offering them refuge in a sanctuary called the *Asylum*. He chose 100 leading men as his advisers. They were called the \"fathers\" (*patres*), and together they formed the Senate (*senatus*, from *senex*, \"old man\"). Their descendants became the patricians (*patricii*), Rome's hereditary aristocracy. To show his authority, he was escorted by twelve attendants called lictors (*lictores*).\n\nHis new city had too few women. So, the story goes, Romulus invited the Sabines (*Sabini*), a hill people living north-east of Rome, to a religious festival (the *Consualia*, in honour of the god Consus), and his men carried off their young women — the episode known as the \"Rape of the Sabine Women\" (*raptio Sabinarum*). War followed. It ended only when the captured women threw themselves between the armies. The two peoples then united, and the Sabine king Titus Tatius shared the throne with Romulus.\n\nAfter 37 years, Romulus vanished during a storm while reviewing his troops at the Goat's Marsh (*Caprae Palus*). Some whispered that the nobles had murdered him and hidden the pieces of his body. But one respected nobleman, Proculus Julius (*Proculus Iulius*), claimed Romulus had appeared to him in a vision as the god Quirinus. Romans maintained a hut said to be his, the *Casa Romuli*, in the heart of the city until the end of the empire (*Imperium Romanum*)."},{"id":"how-kings-ruled","title":"How the Kings Ruled","body":"After Romulus, Rome's kings were not born to the throne. According to tradition, they were chosen for life. When a king died, the Senate (*senatus*), the council of leading men, took charge. One senator became the *interrex*, or \"between-king\", serving for five days to find a candidate, then handing over to another if he failed. The period without a king was called the *interregnum*. The chosen man was presented to the Curiate Assembly (*comitia curiata*), the gathering of citizens (*cives*) organised in thirty *curiae*, which accepted or rejected him.\n\nTwo more steps followed. A priest called an augur took the king-elect up to the citadel (*arx*) and looked for signs (*auspicia*, the \"auspices\") that the gods approved, a ceremony called the *inauguratio*. Then the assembly granted him *imperium*, the supreme power to command armies, govern and judge, through a law known as the *lex curiata de imperio*. The king was also Rome's chief priest and controlled the calendar (*calendarium*). The Senate could advise him but rarely stop him, though he could not declare war without approval.\n\nTwelve attendants (*lictores*) walked ahead of him carrying the *fasces*, a bundle of rods (*virgae*) around an axe (*securis*) that symbolised his power to punish. He sat on a special chair, the *sella curulis* (curule chair), and wore a purple robe embroidered with gold (*toga picta* or *trabea*), with red shoes (*calcei mullei*) and a white band around his head (*diadema*).\n\nThe reality may have been rougher. The historian Arnaldo Momigliano suggested that many kings were really leaders of armed bands who won over the aristocracy by persuasion or force."},{"id":"numa-tullus-ancus","title":"Numa, Tullus and Ancus","body":"Tradition names seven kings (*septem reges*) of Rome. After Romulus came three very different rulers.\n\nWhen Romulus vanished, Rome waited a year before choosing a Sabine named Numa Pompilius, famed for his justice (*iustitia*) and piety (*pietas*). His 43-year reign was remembered for peace (*pax*) and religion (*religio*). He closed the doors of the temple of Janus (*Ianus*, the shrine known as *Ianus Geminus*), a god of beginnings, as a sign that Rome was at peace. He also founded the Vestal Virgins (*Virgines Vestales*) and created the office of chief priest (*Pontifex Maximus*). Legend credits him with adding January (*Ianuarius*) and February (*Februarius*) to make a twelve-month calendar.\n\nTullus Hostilius was the opposite: warlike and scornful of the gods. He fought Rome's neighbours and destroyed Alba Longa, the Latin town said to be Romulus's birthplace, moving its people to Rome. He built a senate house (*Curia Hostilia*, named after him) that lasted centuries. According to Livy (*Titus Livius*), when the dying king finally begged Jupiter (*Iuppiter*) for help, the god burned him and his house with lightning (*fulmen*). He had reigned 32 years.\n\nNuma's grandson Ancus Marcius ruled peacefully for 25 years. He built Rome's first prison (*carcer*) and, tradition says, its first bridge over the Tiber, the wooden *Pons Sublicius*. He founded Ostia (from *ostium*, \"river mouth\"), a port at the river's mouth, and settled conquered Latins (*Latini*) on the Aventine Hill (*Mons Aventinus*), forming the origins of the plebeians (*plebs*, *plebeii*), Rome's common people."},{"id":"tarquinius-priscus","title":"Tarquinius Priscus, the First Etruscan King","body":"Rome's fifth king, Lucius Tarquinius Priscus (*Priscus*, \"the Elder\"), was an immigrant. According to tradition he was born an Etruscan (*Etruscus*; the Romans also called these people *Tusci*), one of the wealthy, powerful peoples living north of Rome in what is now Tuscany. Livy says his original name was Lucumo, and that he came from the Etruscan city of Tarquinii. After settling in Rome he won the favour of King Ancus Marcius, who adopted him as a son.\n\nAs king, Tarquinius fought the Sabines and Etruscans, reportedly doubling Rome's size and bringing home great treasure (*praeda*, \"booty\"). He added 100 new members to the Senate, raising it to 200.\n\nHe spent his loot on ambitious building. The *Cloaca Maxima*, or \"Great Sewer\", drained the marshy ground between Rome's hills, and on the reclaimed land he began the Roman Forum (*Forum Romanum*). He also laid out the *Circus Maximus*, a giant stadium for chariot races, and founded the Roman games (*Ludi Romani*, also called *Ludi Magni*). Work began on a great temple to Jupiter on the Capitoline Hill, the Temple of Jupiter Best and Greatest (*aedes Iovis Optimi Maximi Capitolini*), though he did not live to finish it.\n\nTarquinius is also remembered for introducing the symbols of Roman office (*insignia*) and for celebrating the first triumph (*triumphus*), the victory parade granted to successful generals. After 38 years on the throne, he was murdered by a son of Ancus Marcius."},{"id":"servius-tullius","title":"Servius Tullius and the Mystery of Mastarna","body":"According to tradition, Rome's sixth king, Servius Tullius, was the son of a slave (*serva*; Roman writers name his mother as Ocrisia) who married the daughter of the previous king, Tarquinius Priscus. Like his father-in-law, he was said to be of Etruscan birth, and he fought successful wars against the Etruscans.\n\nHis lasting fame rests on reorganising Roman society. He held Rome's first census, a count of citizens, and sorted people into five classes by wealth. These classes, subdivided into \"centuries\" (*centuriae*), became the basis of a new voting assembly (*comitia centuriata*), organised so that the rich had the most influence. He also divided the city into four districts (*tribus*, \"tribes\") by where people lived, and he built the Temple of Diana (*aedes Dianae*) on the Aventine Hill. Later, though, he was said to favour the poor at the nobles' expense.\n\nAfter 44 years he was killed in a plot by his own daughter, Tullia, and her husband, the future king Tarquin the Proud.\n\nA puzzle surrounds him. The emperor Claudius (*Tiberius Claudius Caesar Augustus Germanicus*), in the first century AD, identified Servius with Mastarna (Etruscan *Macstrna*), an Etruscan adventurer who became king of Rome. Claudius's speech survives on a bronze tablet found in Lyon (*Lugdunum*), the *Tabula Claudiana*. Mastarna also appears on a painted Etruscan tomb, the François Tomb at Vulci. The historian Momigliano warned, however, that Mastarna is so unlike the traditional Servius that the two are best kept apart."},{"id":"tarquin-the-proud","title":"Tarquin the Proud and Lucretia","body":"Rome's seventh and last king, Lucius Tarquinius Superbus (*Superbus*, \"the Proud\"), seized power by murdering his father-in-law, King Servius Tullius. He was the son of the earlier king Tarquinius Priscus, and according to tradition he ruled for 25 years.\n\nHe was an energetic ruler. He fought Rome's neighbours, including the Volsci, a hill people to the south-east, and made Rome the leading power among the Latin cities (*nomen Latinum*, the \"Latin name\"). He finished the great temple of Jupiter on the Capitoline Hill. But Romans remembered him as a tyrant (*tyrannus*) who ruled through violence and fear, ignored custom (*mos maiorum*, \"the ways of the ancestors\") and the Senate, and even judged death-penalty cases (*res capitales*) without advisers.\n\nAccording to the traditional story, the crisis came when the king's son Sextus Tarquinius raped Lucretia, a virtuous noblewoman. She told her husband, Lucius Tarquinius Collatinus, and her father, Spurius Lucretius Tricipitinus, what had happened and then killed herself rather than live with the dishonour. Her death sparked an uprising. The tale later inspired Shakespeare's poem Lucrece and many paintings in the 18th and 19th centuries."},{"id":"birth-of-the-republic","title":"The Fall of the Kings","body":"According to tradition, the revolt against Tarquin the Proud, Rome's last king, came in 509 BC. It was led by Lucius Junius Brutus (*Lucius Iunius Brutus*), the king's nephew. He was joined by Lucretia's husband Collatinus, her father, and a friend named Publius Valerius Poplicola (also spelled *Publicola*, \"friend of the people\"). While the king was away besieging Ardea, a town of the Rutuli south of Rome, they shut the city gates (*portae*) against him and won over the army (*exercitus*).\n\nIn place of a king, Rome now elected two consuls (*consules*) each year, starting with Brutus and Collatinus. This marked the birth of the Republic (*res publica*, \"the public thing\"). Brutus made the people swear an oath (*iusiurandum*) never again to accept a king. When his own sons were caught plotting to bring Tarquin back, he ordered their execution.\n\nTarquin fought to return. An Etruscan king, Lars Porsenna (*Lars Porsena*) of Clusium, marched on Rome, but legend says the hero Horatius (*Horatius Cocles*, \"the one-eyed\") held a bridge, the *Pons Sublicius*, alone until it could be torn down. Rome then defeated an alliance of Latin towns at Lake Regillus (*Lacus Regillus*). Tarquin died in exile (*exsilium*) at Cumae, a Greek city near Naples (*Neapolis*), in 495 BC.\n\nThe story echoed through later history. French revolutionaries named boys and towns after Brutus, and the authors of the American Federalist Papers signed themselves \"Publius\" after Poplicola."},{"id":"how-reliable","title":"What Historians Really Know","body":"Almost nothing written survives from the age of Rome's kings. Ancient writers blamed the Gauls (*Galli*), invaders from the north who sacked Rome in 390 BC, for destroying many records. The first history of Rome was written by Fabius Pictor (*Quintus Fabius Pictor*) around 200 BC, about three centuries after the kings fell; he wrote in Greek. Writers such as Livy, whose great history is called *Ab Urbe Condita* (\"From the Founding of the City\"), relied largely on oral tradition, family stories and even plays.\n\nModern historians are therefore cautious. Seven kings ruling for 243 years means an average reign of almost 35 years, which seems far too long. Archaeology shows that Rome did have kings, but most scholars doubt the traditional stories about them.\n\nThe overthrow is especially suspect. Lucretia's story closely resembles a Greek tale about the fall of the tyrants of Athens, around 510 BC. And the Roman historians Tacitus (*Publius Cornelius Tacitus*) and Pliny (*Gaius Plinius Secundus*, \"Pliny the Elder\") recorded that Lars Porsenna, the Etruscan king, actually captured Rome. The historian Tim Cornell suggests that Porsenna may have ended the monarchy himself.\n\nOthers think the kingship faded slowly rather than falling in one dramatic night. Republican Rome kept a priest called the \"king of sacred rites\" (*rex sacrorum*), perhaps a last ceremonial echo of the old kings."}],"battle":{"name":"Lake Regillus","year":"c. 496 BC (traditional)","enemy":"The Latin League","sec":"birth-of-the-republic","intro":"The exiled Tarquin has not given up. An alliance of Latin towns marches on Rome, and the armies meet at Lake Regillus. Win, and the young Republic survives."},"timelines":[{"name":"Kings to Republic","blurb":"Four big moments, from legendary founding to disaster.","events":[{"label":"Romulus founds Rome on the Palatine","when":"753 BC (legend)","y":-753,"fact":"The scholar Varro worked out this official date, celebrated on 21 April, but most historians treat the founding story as myth.","sec":"romulus-and-remus"},{"label":"Numa adds January and February","when":"Under Numa, 2nd king","y":-700,"fact":"Legend credits the peaceful Sabine king Numa Pompilius with creating a twelve-month calendar.","sec":"numa-tullus-ancus"},{"label":"Revolt drives out the last king","when":"509 BC","y":-509,"fact":"Rebels shut the gates on Tarquin the Proud while he was besieging the town of Ardea.","sec":"birth-of-the-republic"},{"label":"Gauls sack Rome","when":"390 BC","y":-390,"fact":"Ancient writers blamed these northern invaders for destroying many records of the age of kings.","sec":"how-reliable"}]},{"name":"The Seven Kings","blurb":"Put the reigns of Rome's traditional kings in order.","events":[{"label":"Romans seize the Sabine women","when":"Under Romulus, 1st king","y":-740,"fact":"The war that followed ended when the captured women threw themselves between the armies.","sec":"romulus-the-king"},{"label":"Numa closes the doors of Janus","when":"Under Numa, 2nd king","y":-700,"fact":"Closing the temple of Janus, a god of beginnings, showed that Rome was at peace.","sec":"numa-tullus-ancus"},{"label":"Tullus destroys Alba Longa","when":"Under Tullus Hostilius, 3rd king","y":-660,"fact":"The warlike king moved the people of this Latin town, Romulus's legendary birthplace, to Rome.","sec":"numa-tullus-ancus"},{"label":"Ancus founds the port of Ostia","when":"Under Ancus Marcius, 4th king","y":-630,"fact":"Numa's grandson founded Ostia at the mouth of the Tiber.","sec":"numa-tullus-ancus"},{"label":"Work begins on the Great Sewer","when":"Under Tarquinius Priscus, 5th king","y":-600,"fact":"The Cloaca Maxima drained marshy ground between the hills, making room for the Roman Forum.","sec":"tarquinius-priscus"},{"label":"Rome holds its first census","when":"Under Servius Tullius, 6th king","y":-560,"fact":"Servius sorted citizens into five classes by wealth, giving the rich the most voting influence.","sec":"servius-tullius"}]},{"name":"Huts, Kings and Historians","blurb":"From the first traces on the hills to the people who wrote about them.","events":[{"label":"Bronze Age settlers on the Capitoline","when":"Possibly 1700 BC","y":-1700,"fact":"Archaeologists have found traces of Bronze Age settlement on the Capitoline Hill.","sec":"origins"},{"label":"The Forum valley is a cemetery","when":"By 1000 BC","y":-1000,"fact":"The valley that became Rome's great public square was first used for burials.","sec":"origins"},{"label":"A wall rises on the Palatine","when":"Around 730–720 BC","y":-725,"fact":"About the same time, burials in the Forum stopped and parts of it were paved over.","sec":"origins"},{"label":"Tarquin the Proud kills Servius","when":"End of the 6th king's 44-year reign","y":-534,"fact":"Servius was murdered in a plot by his own daughter Tullia and her husband, the future last king.","sec":"servius-tullius"},{"label":"Brutus and Collatinus become consuls","when":"509 BC","y":-509,"fact":"Instead of a king, Rome now elected two consuls every year.","sec":"birth-of-the-republic"},{"label":"Tarquin dies in exile at Cumae","when":"495 BC","y":-495,"fact":"The last king died in Cumae, a Greek city near Naples, after failing to win back his throne.","sec":"birth-of-the-republic"},{"label":"Fabius Pictor writes a history","when":"Around 200 BC","y":-200,"fact":"This first history of Rome came about three centuries after the kings fell.","sec":"how-reliable"},{"label":"Claudius links Servius with Mastarna","when":"1st century AD","y":50,"fact":"The emperor Claudius identified the sixth king with Mastarna, an Etruscan adventurer who became king of Rome.","sec":"servius-tullius"}]}],"matches":[{"name":"Kings and Their Deeds","blurb":"Match each traditional king of Rome to what he is remembered for.","pairs":[["Romulus","Chose 100 leading men, the fathers, as his advisers"],["Numa Pompilius","Founded the Vestal Virgins and the office of chief priest"],["Tullus Hostilius","Warlike king who destroyed Alba Longa"],["Ancus Marcius","Built Rome's first prison and founded a port at the Tiber's mouth"],["Servius Tullius","Held the first census and sorted citizens into five wealth classes"]],"secs":["romulus-the-king","numa-tullus-ancus","numa-tullus-ancus","numa-tullus-ancus","servius-tullius"]},{"name":"Words of Royal Rome","blurb":"Match each term to its meaning.","pairs":[["Interrex","Senator who served five days at a time to find a new king"],["Imperium","Supreme power to command armies, govern and judge"],["Fasces","Bundle of rods around an axe symbolising power to punish"],["Augur","Priest who looked for signs that the gods approved"],["Cloaca Maxima","The Great Sewer that drained marshy ground between the hills"]],"secs":["how-kings-ruled","how-kings-ruled","how-kings-ruled","how-kings-ruled","tarquinius-priscus"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Rex","King"],["Res publica","“The public thing”: the Republic"],["Patres","“Fathers”: Romulus’s first hundred advisers"],["Plebs","Rome’s common people"],["Mos maiorum","“The ways of the ancestors”"],["Pontifex Maximus","The chief priest, an office created by Numa"]],"secs":["origins","birth-of-the-republic","romulus-the-king","numa-tullus-ancus","tarquin-the-proud","numa-tullus-ancus"]}],"decks":[{"name":"Legends and Early Kings","blurb":"Myth, founders and the first four kings.","cards":[{"claim":"Romulus and Remus were said to be fathered by Mars, the god of war.","answer":true,"why":"Their mother Rhea Silvia was a Vestal Virgin, and legend made Mars the twins' father.","sec":"romulus-and-remus"},{"claim":"In legend, the abandoned twins were suckled by a she-bear.","answer":false,"why":"It was a she-wolf, in a cave called the Lupercal; a shepherd named Faustulus then raised them.","sec":"romulus-and-remus"},{"claim":"The scholar Varro set Rome's founding date at 753 BC, celebrated on 21 April.","answer":true,"why":"Varro worked out this official date, though most modern historians treat the founding story as myth.","sec":"romulus-and-remus"},{"claim":"After the war over the Sabine women, Romulus shared the throne with the Sabine king Titus Tatius.","answer":true,"why":"The two peoples united once the captured women threw themselves between the armies.","sec":"romulus-the-king"},{"claim":"Romulus chose 300 leading men as his advisers.","answer":false,"why":"He chose 100 men, the fathers; their descendants became the patricians, Rome's hereditary aristocracy.","sec":"romulus-the-king"},{"claim":"Numa Pompilius was remembered as Rome's most warlike king.","answer":false,"why":"Numa's 43-year reign was remembered for peace and religion; the warlike king was Tullus Hostilius.","sec":"numa-tullus-ancus"},{"claim":"According to Livy, Jupiter burned Tullus Hostilius and his house with lightning.","answer":true,"why":"The god struck when the dying king, long scornful of the gods, finally begged him for help.","sec":"numa-tullus-ancus"},{"claim":"Ancus Marcius founded the port of Naples.","answer":false,"why":"Ancus founded Ostia, a port at the mouth of the Tiber.","sec":"numa-tullus-ancus"}]},{"name":"Power, Builders and the Fall","blurb":"How kings ruled, what they built and how they fell.","cards":[{"claim":"After Romulus, Rome's kings inherited the throne from their fathers.","answer":false,"why":"Tradition says they were chosen for life: an interrex found a candidate and the Curiate Assembly accepted or rejected him.","sec":"how-kings-ruled"},{"claim":"A Roman king could not declare war without approval.","answer":true,"why":"The Senate could rarely stop the king, but declaring war needed approval.","sec":"how-kings-ruled"},{"claim":"Tarquinius Priscus raised the Senate to 200 members.","answer":true,"why":"He added 100 new members to the Senate.","sec":"tarquinius-priscus"},{"claim":"Servius Tullius sorted citizens into ten classes by wealth.","answer":false,"why":"He sorted them into five classes, which became the basis of a new voting assembly.","sec":"servius-tullius"},{"claim":"Tarquin the Proud finished the great temple of Jupiter on the Capitoline Hill.","answer":true,"why":"Work began under his father Tarquinius Priscus, who did not live to finish it.","sec":"tarquin-the-proud"},{"claim":"The revolt of 509 BC broke out while the king was besieging Ardea.","answer":true,"why":"With Tarquin away at Ardea, a town south of Rome, the rebels shut the gates and won over the army.","sec":"birth-of-the-republic"},{"claim":"Tarquin the Proud died in exile in Carthage.","answer":false,"why":"He died in 495 BC at Cumae, a Greek city near Naples.","sec":"birth-of-the-republic"},{"claim":"Livy wrote the first history of Rome around 200 BC.","answer":false,"why":"The first history of Rome was written by Fabius Pictor around 200 BC.","sec":"how-reliable"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Bronze Age traces on the Capitoline","Cemetery in the Forum valley","Huts on the Palatine","The she-wolf's cave, the Lupercal"],"odd":3,"why":"Three are found by archaeologists on Rome's site; the Lupercal, where a she-wolf suckled the twins, belongs to legend.","sec":"origins"},{"items":["Rhea Silvia","Titus Tatius","Numitor","Amulius"],"odd":1,"why":"Rhea Silvia, Numitor and Amulius belong to the royal family of Alba Longa in the twins' legend; Titus Tatius was the Sabine king who shared Romulus's throne.","sec":"romulus-and-remus"},{"items":["Interrex seeks a candidate","Census counts the citizens","Augur reads the gods' signs","Assembly grants imperium"],"odd":1,"why":"Three are steps in choosing a king; the census was a count of citizens introduced by Servius Tullius.","sec":"how-kings-ruled"},{"items":["Tarquinius Priscus","Servius Tullius","Numa Pompilius","Tarquin the Proud"],"odd":2,"why":"All four were kings of Rome. Tarquinius Priscus, Servius Tullius and Tarquin the Proud are remembered as Etruscan by birth or family; Numa was a Sabine.","sec":"numa-tullus-ancus"},{"items":["Cloaca Maxima","Temple of Diana","Circus Maximus","Roman Forum"],"odd":1,"why":"Tarquinius Priscus built the Great Sewer, laid out the Circus Maximus and began the Forum; Servius Tullius built the Temple of Diana.","sec":"tarquinius-priscus"},{"items":["Sextus Tarquinius","Lucius Junius Brutus","Collatinus","Publius Valerius Poplicola"],"odd":0,"why":"Brutus, Collatinus and Poplicola led the revolt against the king; Sextus Tarquinius was the king's son whose crime against Lucretia sparked it.","sec":"birth-of-the-republic"},{"items":["Lictors","Fasces","Sella curulis","Pons Sublicius"],"odd":3,"why":"Lictors, the fasces and the curule chair were signs of the king's power; the Pons Sublicius was the wooden bridge over the Tiber.","sec":"how-kings-ruled"}]}],"whos":[{"name":"Kings of Rome","blurb":"Which traditional king of Rome is speaking?","people":[{"name":"Numa Pompilius","options":["Numa Pompilius","Tullus Hostilius","Ancus Marcius","Romulus"],"clues":["Rome waited a year after the previous king vanished before choosing me.","I was a Sabine, famed for my justice and piety.","I founded the Vestal Virgins and created the office of chief priest.","I closed the doors of the temple of Janus to show Rome was at peace."],"sec":"numa-tullus-ancus"},{"name":"Tullus Hostilius","options":["Tullus Hostilius","Ancus Marcius","Numa Pompilius","Tarquinius Priscus"],"clues":["I reigned for 32 years.","I built a senate house that lasted for centuries.","Livy says Jupiter burned me and my house with lightning.","I destroyed Alba Longa and moved its people to Rome."],"sec":"numa-tullus-ancus"},{"name":"Tarquinius Priscus","options":["Tarquinius Priscus","Servius Tullius","Ancus Marcius","Tarquin the Proud"],"clues":["I celebrated the first triumph, a victory parade for generals.","I added 100 members to the Senate, raising it to 200.","An earlier king adopted me as his son after I moved to Rome.","I built the Great Sewer and laid out the Circus Maximus."],"sec":"tarquinius-priscus"},{"name":"Servius Tullius","options":["Servius Tullius","Tarquinius Priscus","Tarquin the Proud","Ancus Marcius"],"clues":["An emperor later claimed I was really an Etruscan adventurer called Mastarna.","I built the Temple of Diana on the Aventine Hill.","My own daughter Tullia helped plot my death.","I held Rome's first census and sorted citizens into five classes."],"sec":"servius-tullius"}]},{"name":"Downfall of the Kings","blurb":"Who is speaking about the end of Rome's monarchy?","people":[{"name":"Tarquin the Proud","options":["Tarquin the Proud","Tarquinius Priscus","Servius Tullius","Lars Porsenna"],"clues":["I fought the Volsci and made Rome the leading power among the Latin cities.","I finished the great temple of Jupiter on the Capitoline Hill.","I died in exile at Cumae in 495 BC.","I seized the throne by murdering my father-in-law."],"sec":"tarquin-the-proud"},{"name":"Lucius Junius Brutus","options":["Lucius Junius Brutus","Collatinus","Publius Valerius Poplicola","Horatius"],"clues":["I was the king's own nephew.","French revolutionaries named boys and towns after me.","I ordered the execution of my own sons for plotting to bring the king back.","I led the revolt of 509 BC and made the people swear never to accept a king."],"sec":"birth-of-the-republic"},{"name":"Lars Porsenna","options":["Lars Porsenna","Tarquin the Proud","Horatius","Lucius Junius Brutus"],"clues":["The historian Tim Cornell suggests I may have ended the monarchy myself.","Tacitus and Pliny recorded that I actually captured Rome.","I was an Etruscan king from Clusium.","Legend says one hero held a bridge alone against my march on Rome."],"sec":"how-reliable"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Alba Longa","lat":41.74691,"lon":12.65026,"why":"The Latin town where Romulus and Remus were born in legend, later destroyed by King Tullus Hostilius.","sec":"romulus-and-remus"},{"name":"Ostia","lat":41.75583333,"lon":12.29166667,"why":"The port at the mouth of the Tiber founded, by tradition, by King Ancus Marcius.","sec":"numa-tullus-ancus"},{"name":"Clusium","lat":43.01666667,"lon":11.95,"why":"Home city of the Etruscan king Lars Porsenna, who marched on Rome to restore Tarquin.","sec":"birth-of-the-republic"},{"name":"Cumae","lat":40.84861111,"lon":14.05361111,"why":"The Greek city near Naples where Tarquin the Proud died in exile in 495 BC.","sec":"birth-of-the-republic"}]}],"quizPool":{"1":[{"q":"According to tradition, what was unusual about the background of King Servius Tullius?","options":["He was a Carthaginian merchant","He was raised by a she-wolf","He was a Greek refugee from Troy","He was the son of a slave"],"a":3,"level":1,"why":"Tradition held that Servius was the son of a slave. He rose to marry the daughter of the previous king, Tarquinius Priscus.","sec":"servius-tullius"},{"q":"What does archaeology suggest about Rome's kings?","options":["The kings were really Greek governors from Cumae","All seven kings are confirmed by royal inscriptions","Rome never had kings; they were invented by Livy","Rome did have kings, though the stories about them are doubtful"],"a":3,"level":1,"why":"Archaeology confirms that Rome had kings, but most scholars doubt the traditional stories about them. Modern historians are cautious because so few written sources survive.","sec":"how-reliable"},{"q":"Which Latin town, said to be Romulus's birthplace, was destroyed by King Tullus Hostilius?","options":["Ardea","Veii","Alba Longa","Ostia"],"a":2,"level":1,"why":"The warlike Tullus Hostilius destroyed Alba Longa and moved its people to Rome. He also built a senate house that lasted for centuries.","sec":"numa-tullus-ancus"},{"q":"According to legend, which hero held a bridge alone against the army of Lars Porsenna?","options":["Brutus","Collatinus","Poplicola","Horatius"],"a":3,"level":1,"why":"Horatius held the bridge alone until it could be torn down. Porsenna, an Etruscan king from Clusium, had marched on Rome to help Tarquin return.","sec":"birth-of-the-republic"},{"q":"What were the fasces, carried ahead of Rome's kings by their attendants?","options":["A bundle of rods around an axe","A bronze shield and spear","A gilded eagle on a tall pole","A set of sacred temple keys"],"a":0,"level":1,"why":"The fasces were a bundle of rods around an axe that symbolised the king's power to punish. Twelve attendants carried them ahead of him.","sec":"how-kings-ruled"},{"q":"By about which date was Rome a true city, with a central forum, monumental buildings and public temples?","options":["600 BC","1000 BC","400 BC","800 BC"],"a":0,"level":1,"why":"By 600 BC the villages had fully merged into one city. Rome now had a central forum, monumental buildings and public temples.","sec":"origins"},{"q":"Servius Tullius is credited with holding Rome's first what?","options":["Triumph, a victory parade","Consular election","Chariot race","Census, a count of citizens"],"a":3,"level":1,"why":"Servius held Rome's first census and sorted citizens into five classes by wealth. His lasting fame rests on this reorganisation of Roman society.","sec":"servius-tullius"},{"q":"Which year did the Romans officially give for the founding of their city?","options":["776 BC","509 BC","753 BC","814 BC"],"a":2,"level":1,"why":"The scholar Varro worked out the official founding date of 753 BC. Romans celebrated it every year on 21 April.","sec":"romulus-and-remus"},{"q":"Romulus chose 100 leading men as advisers, called the \"fathers\". What did their descendants become?","options":["The plebeians","The patricians","The equestrians","The lictors"],"a":1,"level":1,"why":"The descendants of Romulus's 100 \"fathers\" became the patricians, Rome's hereditary aristocracy. Romulus was also escorted by twelve attendants called lictors.","sec":"romulus-the-king"},{"q":"By around 1000 BC, what was the valley that later became the Roman Forum used for?","options":["A royal palace complex","A cattle market","A cemetery","A chariot-racing track"],"a":2,"level":1,"why":"Long before it became Rome's great public square, the Forum valley was a cemetery. Huts already stood on the nearby Palatine Hill by the 9th or 8th century BC.","sec":"origins"},{"q":"According to the story, Romulus's men carried off the young women of which people during a festival?","options":["The Latins of Alba Longa","The Etruscans","The Volsci","The Sabines"],"a":3,"level":1,"why":"Rome had too few women, so Romulus invited the Sabines to a religious festival and his men seized their young women. The Sabines were a hill people living north-east of Rome.","sec":"romulus-the-king"},{"q":"Who plotted the killing of King Servius Tullius after his 44-year reign?","options":["A son of Ancus Marcius","The Sabine nobles","His daughter Tullia and her husband","Lucius Junius Brutus"],"a":2,"level":1,"why":"Servius was killed in a plot by his own daughter, Tullia, and her husband. That husband went on to become Tarquin the Proud, Rome's last king.","sec":"servius-tullius"},{"q":"What was the Cloaca Maxima, built under Tarquinius Priscus?","options":["A covered market beside the Tiber","A stone wall around the seven hills","A great sewer that drained marshy ground","A temple to Jupiter on the Capitoline"],"a":2,"level":1,"why":"The Cloaca Maxima, or \"Great Sewer\", drained the marshy ground between Rome's hills. On the reclaimed land, Tarquinius began the Roman Forum.","sec":"tarquinius-priscus"},{"q":"How do archaeologists think Rome actually came into being?","options":["Through the gradual merging of hilltop villages","Founded in a single day by one leader","As an Etruscan military fortress","Built by Greek colonists from Cumae"],"a":0,"level":1,"why":"Rome grew slowly as several hilltop villages merged. The process was probably inspired by the idea of the city-state, which was then spreading from Greece.","sec":"origins"},{"q":"Which invaders, who sacked Rome in 390 BC, were blamed for destroying many records of the early city?","options":["The Carthaginians","The Etruscans","The Gauls","The Samnites"],"a":2,"level":1,"why":"Ancient writers blamed the Gauls, invaders from the north, for destroying many records. As a result, almost nothing written survives from the age of the kings.","sec":"how-reliable"},{"q":"How did Romans remember Tarquin the Proud?","options":["As a weak king controlled by the Senate","As a reformer who favoured the poor","As a pious king who loved peace","As a tyrant ruling through violence and fear"],"a":3,"level":1,"why":"Romans remembered Tarquin as a tyrant who ignored custom and the Senate. He even judged death-penalty cases without advisers.","sec":"tarquin-the-proud"},{"q":"What was the Circus Maximus, laid out by Tarquinius Priscus, built to host?","options":["Chariot races","Gladiator fights","Military training","Public assemblies"],"a":0,"level":1,"why":"The Circus Maximus was a giant stadium for chariot races. Tarquinius also founded the Roman games.","sec":"tarquinius-priscus"},{"q":"According to tradition, how long did a Roman king hold the throne once chosen, after the reign of Romulus?","options":["For life","For five years","Until his eldest son came of age","For a single year"],"a":0,"level":1,"why":"Rome's later kings were not born to the throne but chosen for life. When a king died, the Senate took charge until a new one was found.","sec":"how-kings-ruled"},{"q":"What was imperium, the power the assembly granted to a new king?","options":["The right to name his own successor","Sole control over the Vestal Virgins","The supreme power to command armies, govern and judge","The right to tax conquered towns"],"a":2,"level":1,"why":"Imperium was the supreme power to command armies, govern and judge. The king was also Rome's chief priest and controlled the calendar.","sec":"how-kings-ruled"},{"q":"King Numa Pompilius closed the doors of which god's temple as a sign that Rome was at peace?","options":["Jupiter","Janus","Mars","Vesta"],"a":1,"level":1,"why":"Numa closed the doors of the temple of Janus, a god of beginnings, to show Rome was at peace. His 43-year reign was remembered for peace and religion.","sec":"numa-tullus-ancus"},{"q":"Which port at the mouth of the Tiber was founded by King Ancus Marcius?","options":["Antium","Cumae","Ardea","Ostia"],"a":3,"level":1,"why":"Ancus Marcius founded Ostia at the river's mouth. He also settled conquered Latins on the Aventine Hill, forming the origins of the plebeians.","sec":"numa-tullus-ancus"},{"q":"According to the traditional story, whose crime against the noblewoman Lucretia set off the uprising against Rome's last king?","options":["The augur of the Capitoline","The Etruscan king Lars Porsenna","The king's son Sextus Tarquinius","The king's nephew Brutus"],"a":2,"level":1,"why":"The king's son Sextus Tarquinius raped Lucretia. She told her husband and father, then killed herself, and her death sparked the uprising.","sec":"tarquin-the-proud"},{"q":"Who wrote the first history of Rome, around 200 BC?","options":["Tacitus","P
