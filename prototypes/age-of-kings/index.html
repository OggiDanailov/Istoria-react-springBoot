function newFoesOf(i) {
  const seen = new Set(LEVELS.slice(0, i).flatMap(foeTypes))
  return foeTypes(LEVELS[i]).filter(t => !seen.has(t) && FOES[t].intro)
}
function showBriefing(i) {
  const L = LEVELS[i]
  const news = [
    ...(L.newUnit ? [`<li><canvas class="ic" data-unit="${L.newUnit}" width="88" height="88"></canvas><span><b>New unit: ${UNITS[L.newUnit].name}.</b> ${UNITS[L.newUnit].about}</span></li>`] : []),
    ...(i > 0 ? newFoesOf(i).map(t => `<li><canvas class="ic" data-foe="${t}" width="88" height="88"></canvas><span><b>New enemy.</b> ${FOES[t].intro}</span></li>`) : []),
  ]
  const howto = i === 0 ? `<ul>
      <li><b>Drag</b> a unit onto a square, or tap it and then tap a square. <b>Press and hold</b> a unit to see what it does.</li>
      <li><b>Supply carts</b> bring rations. <b>Tap the grain</b> to collect it, and grain also falls from the sky.</li>
      <li><b>Slingers</b> shoot down their whole lane. <b>Triarii</b> kneel behind their shields and hold the line.</li>
      <li><b>Drag a soldier on the field</b> to move him to another empty square, to save him or to help another lane.</li>
      <li>If an enemy reaches the camp, the <b>equites</b> charge down that lane, but only once.</li>
    </ul>` : ''
  showPanel(`<span class="eyebrow">Battle ${i + 1} of ${LEVELS.length} · ${L.year}</span><h2>${L.name}</h2><p>${L.blurb}</p>${howto}${L.twist ? `<p class="twist"><b>This battle:</b> ${L.twist}</p>` : ''}
    ${news.length ? `<ul class="news">${news.join('')}</ul>` : ''}
    ${opts.mode === 'chapter' ? `<p class="twist"><b>Your chapter test: ${quizScore}%.</b> ${armyLine(quizScore, L)}</p>` : `<div class="score-pick"><span class="label">Your quiz result (test switch)</span>
      <div class="chips">${[60, 70, 80, 90, 100].map(v => `<button id="score${v}" aria-pressed="${v === quizScore}">${v}%</button>`).join('')}</div>
      <p class="army" id="army-line">${armyLine(quizScore, L)}</p></div>`}
    <div class="row"><button class="primary" id="go">To battle</button><button class="tool" id="guide-b">Unit guide</button><button class="tool" id="map">${opts.mode === 'chapter' ? 'Back to the chapter' : 'Map'}</button></div>`,
    { go: () => startLevel(i), map: opts.mode === 'chapter' ? () => exit({ left: true }) : showMap, 'guide-b': () => { newGame(i); showGuide(null, () => showBriefing(i)) },
      ...Object.fromEntries([60, 70, 80, 90, 100].map(v => [`score${v}`, () => {
        quizScore = v
        overlay.querySelectorAll('.chips button').forEach(b => b.setAttribute('aria-pressed', b.id === `score${v}`))
        overlay.querySelector('#army-line').textContent = armyLine(v, L)
      }])) })
}
function armyLine(score, L) {
  const a = armyFor(score, L), vets = Object.entries(a.vets).map(([t, n]) => `${n} ${n === 1 ? UNITS[t].name.toLowerCase() : UNITS[t].name.toLowerCase() + (t === 'triarius' ? '' : 's')}`.replace('triarius', n === 1 ? 'triarius' : 'triarii').replace('hastatuss', 'hastati'))
  return `You start with ${a.grain} grain${vets.length ? ` and veterans: ${vets.join(', ')}` : ' and no veterans'}.`
}
function startLevel(i, score = quizScore) {
  overlay.hidden = true
  newGame(i, score); sfx.init()
  if (Object.values(G.vets).some(n => n > 0)) { G.phase = 'deploy'; renderTray(); layout(); syncDeploy() }
  else beginBattle()
}
function syncDeploy() {
  const left = Object.values(G.vets).reduce((a, b) => a + b, 0), box = $('deploy')
  box.hidden = G.phase !== 'deploy'
  $('deploy-text').textContent = left
    ? `Your test score earned you veterans. Drag them onto the field for free (${left} still to place).`
    : 'Your veterans are in place. Drag to adjust, then begin.'
}
function beginBattle() {
  if (G.phase !== 'deploy' && G.phase !== 'ready') return
  G.phase = 'play'; G.selected = null; last = performance.now()
  syncDeploy(); renderTray(); layout()
  sfx.horn()
  if (levelIndex === 0) tutorial('start'); else announce(`${LEVEL.name} · ${LEVEL.year}`, true)
}
function starsFor() { const used = G.equites.filter(e => e.state !== 'ready').length; return used === 0 ? 3 : used <= 2 ? 2 : 1 }
function win() {
  if (G.phase !== 'play') return
  G.phase = 'won'; sfx.win()
  const stars = starsFor(), i = levelIndex, next = LEVELS[i + 1]
  if (opts.mode !== 'chapter') { progress.stars[i] = Math.max(progress.stars[i] ?? 0, stars); saveProgress() }
  setTimeout(() => showPanel(`<span class="eyebrow">Victory · ${LEVEL.year}</span><h2>You held the line at ${LEVEL.name}</h2>
    <p class="big-stars" aria-label="${stars} of 3 stars">${starText(stars)}</p>
    <p>${G.killed} enemies fell and you lost ${G.lost === 1 ? 'one soldier' : G.lost + ' soldiers'}. ${stars === 3 ? 'The equites never had to ride.' : 'Win without the equites charging for three stars.'}</p>
    <p class="history">${LEVEL.after}</p>
    ${next || opts.mode === 'chapter' ? '' : '<p><b>You have won the whole campaign: Rome rules Italy.</b></p>'}
    ${opts.mode === 'chapter' ? `<div class="row"><button class="primary" id="continue">Continue</button><button class="tool" id="again">Play again</button></div>`
      : `<div class="row">${next ? `<button class="primary" id="next">Next: ${next.name}</button>` : ''}<button class="tool" id="again">Play again</button><button class="tool" id="map">Map</button></div>`}`,
    { next: () => showBriefing(i + 1), again: () => startLevel(i), map: showMap, continue: () => exit({ won: true, stars }) }), 1200)
}
function lose() {
  if (G.phase !== 'play') return
  G.phase = 'lost'; sfx.lose(); G.shake = 8
  const hint = { regillus: 'Build supply carts early, cover every lane, and keep triarii for the strongest attacks.',
    volsci: 'Raiders are fast: have a slinger in every lane before the bursts, and principes to cut down those who arrive.',
    veii: 'Archers stop out of reach and shoot your front soldier. Put siege sheds in front and slingers behind them.',
    aquilonia: 'The Linen Legion is hard to kill. Rorarii in the middle lanes hit three lanes at once.',
    beneventum: 'Keep war pigs ready in front of your line: an elephant they reach runs back and tramples its own army.' }[LEVEL.id]
  setTimeout(() => showPanel(`<span class="eyebrow">Defeat · ${LEVEL.year}</span><h2>${LEVEL.enemy[0].toUpperCase() + LEVEL.enemy.slice(1)} broke into the camp</h2>
    <p>${G.killed} enemies fell before the line broke. ${hint}</p>
    ${opts.mode === 'chapter' ? `<p>Go back to the chapter: re-read the sections you missed and retake the test for a stronger army. Or fight again with the same army.</p>
    <div class="row"><button class="primary" id="chapter">Back to the chapter</button><button class="tool" id="again">Fight again</button></div>`
      : `<div class="row"><button class="primary" id="again">Try again</button><button class="tool" id="map">Map</button></div>`}`,
    { again: () => startLevel(levelIndex), map: showMap, chapter: () => exit({ won: false }) }), 1400)
}

// ---------- the loop ----------
let last = performance.now()
function frame(now) {
  if (!mounted) return
  const dt = Math.min(0.05, (now - last) / 1000); last = now
  if (G.phase === 'play') { for (let i = 0; i < G.speed; i++) update(dt) }
  else if (G.phase === 'won' || G.phase === 'lost') { for (const c of G.corpses) c.t = Math.min(c.t + dt, 1); G.shake = Math.max(0, G.shake - dt * 12) }
  draw(); syncTray()
  requestAnimationFrame(frame)
}

// ---------- mounting: one game inside a host element (its styles kept apart in a shadow root) ----------
const MARKUP = `<main class="game">
  <div class="tray" id="tray" aria-label="Your units. Drag one onto the field, or tap it and then tap a square."></div>
  <div class="field-wrap" id="wrap">
    <canvas id="field" aria-label="The battlefield: five lanes in front of the Roman camp. Latin soldiers march down from the top."></canvas>
    <div class="hud">
      <div class="rations" id="rations" aria-live="polite"><svg class="wheat" viewBox="0 0 20 20" aria-hidden="true"><g fill="#e0a63a"><ellipse cx="10" cy="4" rx="2.4" ry="3.6"/><ellipse cx="6.5" cy="8" rx="2.2" ry="3.3" transform="rotate(-30 6.5 8)"/><ellipse cx="13.5" cy="8" rx="2.2" ry="3.3" transform="rotate(30 13.5 8)"/><ellipse cx="7" cy="12.5" rx="2" ry="3" transform="rotate(-30 7 12.5)"/><ellipse cx="13" cy="12.5" rx="2" ry="3" transform="rotate(30 13 12.5)"/></g><path d="M10 6v13" stroke="#b8862a" stroke-width="1.6"/></svg><span id="count">100</span></div>
      <button class="tool" id="dismiss" title="Send a soldier home (frees the square)">Dismiss</button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="deploy" id="deploy" hidden><p id="deploy-text"></p><button class="primary" id="begin">Begin the battle</button></div>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="controls">
    <div class="progress"><span class="label" id="level">Lake Regillus</span><div class="bar" id="bar"><div class="fill" id="fill"></div></div></div>
    <button class="tool" id="pause">Pause</button>
    <button class="tool" id="speed">1×</button>
    <button class="tool" id="guide">Guide</button>
    <button class="tool" id="sound">Sound</button>
  </div>
</main>`
let host = null, sroot = null, mounted = false, opts = { mode: 'campaign' }
const $ = id => sroot.getElementById(id)
function bindControls() {
  canvas.addEventListener('pointerdown', e => {
    if (!G || (G.phase !== 'play' && G.phase !== 'deploy') || drag) return
    sfx.init()
    const c = cellAt(e.clientX, e.clientY); if (!c) return
    // grain first: it's the most urgent tap
    const d = G.drops.find(d => Math.hypot(d.x - c.x, d.y - c.y) < 26 * k + 8)
    if (d) return collect(d)
    if (!c.inGrid) return
    if (G.dismiss) { const u = unitAt(c.lane, c.row); if (u) { removeUnit(u, false); sfx.place() } G.dismiss = false; syncTray(); return }
    if (G.selected) { if (place(G.selected, c.lane, c.row)) select(null); return }
    const u = unitAt(c.lane, c.row)
    if (u && MOVABLE(u.type) && !u.travel) { moveDrag = { u, x0: e.clientX, y0: e.clientY, moved: false }; canvas.setPointerCapture(e.pointerId) }
  })
  $('dismiss').addEventListener('click', () => { if (G.phase !== 'play') return; G.dismiss = !G.dismiss; G.selected = null; syncTray() })
  $('speed').addEventListener('click', e => { G.speed = G.speed === 1 ? 2 : 1; e.currentTarget.textContent = G.speed + '×' })
  $('sound').addEventListener('click', e => { sfx.init(); sfx.on = !sfx.on; e.currentTarget.textContent = sfx.on ? 'Sound' : 'Muted'; e.currentTarget.classList.toggle('on', !sfx.on) })
  $('guide').addEventListener('click', () => { if (G.phase === 'play') showGuide() })
  $('begin').addEventListener('click', beginBattle)
  $('pause').addEventListener('click', () => {
    if (G.phase !== 'play') return
    G.phase = 'paused'
    showPanel(`<span class="eyebrow">Paused · ${LEVEL.name}</span><h2>Hold the Line</h2><p>${G.killed} enemies down, ${G.total - G.spawned} still to come.</p>
      <div class="row"><button class="primary" id="resume">Resume</button><button class="tool" id="map">Leave the battle</button></div>`,
      { resume: () => { overlay.hidden = true; G.phase = 'play'; last = performance.now() }, map: opts.mode === 'chapter' ? () => exit({ left: true }) : showMap })
  })

}
function exit(result) { const cb = opts.onExit; unmount(); cb?.(result) }
// opts: { mode: 'campaign' } (the standalone page: map, five battles, saved stars)
//    or { mode: 'chapter', level, score, onExit({ won, stars, left }) } (one battle with the army a chapter test earned)
function mount(el, o = {}) {
  unmount()
  host = el; opts = { mode: 'campaign', ...o }
  sroot = host.shadowRoot ?? host.attachShadow({ mode: 'open' })
  sroot.innerHTML = `<style>${HTL_CSS}</style>` + MARKUP
  canvas = $('field'); ctx = canvas.getContext('2d'); tray = $('tray'); overlay = $('overlay')
  shownCount = -1; mounted = true
  bindControls()
  window.addEventListener('resize', layout)
  if (opts.mode === 'chapter') { quizScore = opts.score; newGame(opts.level, opts.score); showBriefing(opts.level) }
  else { newGame(0); showMap() }
  last = performance.now(); requestAnimationFrame(frame)
}
function unmount() {
  if (!mounted) return
  mounted = false; drag = null; moveDrag = null
  clearTimeout(bannerTimer); window.removeEventListener('resize', layout)
  sroot.innerHTML = ''
}
return { mount, unmount, armyFor, LEVELS, debug: { get G() { return G }, place, collect, update, startLevel, beginBattle, armyFor, showMap, LEVELS, UNITS, FOES, progress } }
})()

</script>
<script>
// Every chapter's content is generated by tools/content-gen (content/generated/<chapter>/games.json,
// chapter.md and the quiz batches); build.mjs writes it in here. Flagged items are already left out.
const ERAS = [{"id":"kingdom","name":"The Kingdom","period":"753–509 BC","blurb":"Seven kings, from Romulus to Tarquin the Proud"},{"id":"early-republic","name":"The Early Republic","period":"509–264 BC","blurb":"Patricians against plebeians, and Rome’s conquest of Italy"},{"id":"middle-republic","name":"The Middle Republic","period":"264–121 BC","blurb":"Carthage, Hannibal and an empire across the sea"},{"id":"late-republic","name":"The Late Republic","period":"121–27 BC","blurb":"Ambitious generals, civil wars and the fall of the Republic"}]
const CHAPTERS = [{"id":"kingdom","era":"kingdom","short":"The Kingdom","title":"Early Rome & the Kingdom: The Foundation of an Empire","period":"753-509 BC","sources":["Roman Kingdom","Founding of Rome","Overthrow of the Roman monarchy"],"briefing":{"title":"Rome, 753–509 BC","paragraphs":["On a cluster of steep hills beside a ford over the Tiber River in central Italy, scattered villages are slowly merging into a city. Romans will later claim it was founded in 753 BC by Romulus, a twin raised by a she-wolf, though historians treat that as myth.","For about two centuries Rome is ruled by kings chosen for life: peacemakers, warriors, builders and Etruscan newcomers from the north. Who holds power, and how Romans finally drive out a tyrant, will shape the republic to come."]},"sections":[{"id":"origins","title":"A City Built From Villages","body":"Long before any king (*rex*), the site of Rome (*Roma*) had real advantages. A ford let travellers cross the Tiber River (*Tiberis*) in central Italy (*Italia*), and a cluster of steep, easily defended hills (*colles*, *montes*) rose from a wide, fertile plain.\n\nArchaeologists have found traces of Bronze Age settlement on the Capitoline Hill (*Mons Capitolinus*, or simply *Capitolium*), possibly from as early as 1700 BC. By 1000 BC the valley that later became the Roman Forum (*Forum Romanum*), the city's great public square, was a cemetery. Huts stood on the Palatine Hill (*Mons Palatinus*, or *Palatium*) by the 9th or 8th century BC, and around 730–720 BC someone built a wall (*murus*) there.\n\nAt about the same time, burials in the Forum stopped and parts of it were paved over, turning it into a shared meeting and worship space. Rome, in other words, did not spring up in a day. It grew from the gradual merging of several hilltop villages, probably inspired by the idea of the city-state (*civitas*; Greek *polis*) then spreading from Greece (*Graecia*). The later festival of the *Septimontium* (\"Seven Hills\") may preserve a memory of these early hill communities. By 600 BC the process was complete. Rome had a central forum, monumental buildings and public temples (*templa*)."},{"id":"romulus-and-remus","title":"The Legend of Romulus and Remus","body":"The Romans (*Romani*) told a far more dramatic story of their beginnings. According to legend, Rhea Silvia (also called *Ilia*) was a princess of Alba Longa, a Latin town in the hills south-east of Rome. Her uncle Amulius had seized the throne from her father, Numitor, and forced her to become a Vestal Virgin (*Virgo Vestalis*), a priestess of the goddess Vesta sworn to chastity. She nevertheless bore twins (*gemini*), Romulus and Remus, supposedly fathered by Mars (also *Mavors*), the god of war.\n\nAmulius ordered the babies left to die by the Tiber. Instead a she-wolf (*lupa*) suckled them in a cave called the Lupercal, and a shepherd (*pastor*) named Faustulus raised them. Grown up, the twins overthrew Amulius and restored their grandfather. They then set out to found a city (*urbs*) of their own, but quarrelled, and Remus was killed. Romulus built his city on the Palatine Hill.\n\nThe official founding date, worked out by the scholar Varro (*Marcus Terentius Varro*), was 753 BC, the year from which Romans counted *ab urbe condita* (\"from the founding of the city\", abbreviated AUC). It was celebrated on 21 April, the festival of the *Parilia*. Later Romans also traced the twins' family back to Aeneas, a hero who fled the fall of Troy (*Troia*). Most modern historians treat all this as myth. Even the name Romulus was probably invented from the city's name, making him, as the classicist Mary Beard put it, \"Mr Rome\"."},{"id":"romulus-the-king","title":"Romulus, the First King","body":"In Roman tradition Romulus, the legendary founder (*conditor*) of Rome, was also its first king, and he was credited with creating its basic institutions. He welcomed newcomers of every kind, including exiles, criminals and runaway slaves (*servi fugitivi*), offering them refuge in a sanctuary called the *Asylum*. He chose 100 leading men as his advisers. They were called the \"fathers\" (*patres*), and together they formed the Senate (*senatus*, from *senex*, \"old man\"). Their descendants became the patricians (*patricii*), Rome's hereditary aristocracy. To show his authority, he was escorted by twelve attendants called lictors (*lictores*).\n\nHis new city had too few women. So, the story goes, Romulus invited the Sabines (*Sabini*), a hill people living north-east of Rome, to a religious festival (the *Consualia*, in honour of the god Consus), and his men carried off their young women — the episode known as the \"Rape of the Sabine Women\" (*raptio Sabinarum*). War followed. It ended only when the captured women threw themselves between the armies. The two peoples then united, and the Sabine king Titus Tatius shared the throne with Romulus.\n\nAfter 37 years, Romulus vanished during a storm while reviewing his troops at the Goat's Marsh (*Caprae Palus*). Some whispered that the nobles had murdered him and hidden the pieces of his body. But one respected nobleman, Proculus Julius (*Proculus Iulius*), claimed Romulus had appeared to him in a vision as the god Quirinus. Romans maintained a hut said to be his, the *Casa Romuli*, in the heart of the city until the end of the empire (*Imperium Romanum*)."},{"id":"how-kings-ruled","title":"How the Kings Ruled","body":"After Romulus, Rome's kings were not born to the throne. According to tradition, they were chosen for life. When a king died, the Senate (*senatus*), the council of leading men, took charge. One senator became the *interrex*, or \"between-king\", serving for five days to find a candidate, then handing over to another if he failed. The period without a king was called the *interregnum*. The chosen man was presented to the Curiate Assembly (*comitia curiata*), the gathering of citizens (*cives*) organised in thirty *curiae*, which accepted or rejected him.\n\nTwo more steps followed. A priest called an augur took the king-elect up to the citadel (*arx*) and looked for signs (*auspicia*, the \"auspices\") that the gods approved, a ceremony called the *inauguratio*. Then the assembly granted him *imperium*, the supreme power to command armies, govern and judge, through a law known as the *lex curiata de imperio*. The king was also Rome's chief priest and controlled the calendar (*calendarium*). The Senate could advise him but rarely stop him, though he could not declare war without approval.\n\nTwelve attendants (*lictores*) walked ahead of him carrying the *fasces*, a bundle of rods (*virgae*) around an axe (*securis*) that symbolised his power to punish. He sat on a special chair, the *sella curulis* (curule chair), and wore a purple robe embroidered with gold (*toga picta* or *trabea*), with red shoes (*calcei mullei*) and a white band around his head (*diadema*).\n\nThe reality may have been rougher. The historian Arnaldo Momigliano suggested that many kings were really leaders of armed bands who won over the aristocracy by persuasion or force."},{"id":"numa-tullus-ancus","title":"Numa, Tullus and Ancus","body":"Tradition names seven kings (*septem reges*) of Rome. After Romulus came three very different rulers.\n\nWhen Romulus vanished, Rome waited a year before choosing a Sabine named Numa Pompilius, famed for his justice (*iustitia*) and piety (*pietas*). His 43-year reign was remembered for peace (*pax*) and religion (*religio*). He closed the doors of the temple of Janus (*Ianus*, the shrine known as *Ianus Geminus*), a god of beginnings, as a sign that Rome was at peace. He also founded the Vestal Virgins (*Virgines Vestales*) and created the office of chief priest (*Pontifex Maximus*). Legend credits him with adding January (*Ianuarius*) and February (*Februarius*) to make a twelve-month calendar.\n\nTullus Hostilius was the opposite: warlike and scornful of the gods. He fought Rome's neighbours and destroyed Alba Longa, the Latin town said to be Romulus's birthplace, moving its people to Rome. He built a senate house (*Curia Hostilia*, named after him) that lasted centuries. According to Livy (*Titus Livius*), when the dying king finally begged Jupiter (*Iuppiter*) for help, the god burned him and his house with lightning (*fulmen*). He had reigned 32 years.\n\nNuma's grandson Ancus Marcius ruled peacefully for 25 years. He built Rome's first prison (*carcer*) and, tradition says, its first bridge over the Tiber, the wooden *Pons Sublicius*. He founded Ostia (from *ostium*, \"river mouth\"), a port at the river's mouth, and settled conquered Latins (*Latini*) on the Aventine Hill (*Mons Aventinus*), forming the origins of the plebeians (*plebs*, *plebeii*), Rome's common people."},{"id":"tarquinius-priscus","title":"Tarquinius Priscus, the First Etruscan King","body":"Rome's fifth king, Lucius Tarquinius Priscus (*Priscus*, \"the Elder\"), was an immigrant. According to tradition he was born an Etruscan (*Etruscus*; the Romans also called these people *Tusci*), one of the wealthy, powerful peoples living north of Rome in what is now Tuscany. Livy says his original name was Lucumo, and that he came from the Etruscan city of Tarquinii. After settling in Rome he won the favour of King Ancus Marcius, who adopted him as a son.\n\nAs king, Tarquinius fought the Sabines and Etruscans, reportedly doubling Rome's size and bringing home great treasure (*praeda*, \"booty\"). He added 100 new members to the Senate, raising it to 200.\n\nHe spent his loot on ambitious building. The *Cloaca Maxima*, or \"Great Sewer\", drained the marshy ground between Rome's hills, and on the reclaimed land he began the Roman Forum (*Forum Romanum*). He also laid out the *Circus Maximus*, a giant stadium for chariot races, and founded the Roman games (*Ludi Romani*, also called *Ludi Magni*). Work began on a great temple to Jupiter on the Capitoline Hill, the Temple of Jupiter Best and Greatest (*aedes Iovis Optimi Maximi Capitolini*), though he did not live to finish it.\n\nTarquinius is also remembered for introducing the symbols of Roman office (*insignia*) and for celebrating the first triumph (*triumphus*), the victory parade granted to successful generals. After 38 years on the throne, he was murdered by a son of Ancus Marcius."},{"id":"servius-tullius","title":"Servius Tullius and the Mystery of Mastarna","body":"According to tradition, Rome's sixth king, Servius Tullius, was the son of a slave (*serva*; Roman writers name his mother as Ocrisia) who married the daughter of the previous king, Tarquinius Priscus. Like his father-in-law, he was said to be of Etruscan birth, and he fought successful wars against the Etruscans.\n\nHis lasting fame rests on reorganising Roman society. He held Rome's first census, a count of citizens, and sorted people into five classes by wealth. These classes, subdivided into \"centuries\" (*centuriae*), became the basis of a new voting assembly (*comitia centuriata*), organised so that the rich had the most influence. He also divided the city into four districts (*tribus*, \"tribes\") by where people lived, and he built the Temple of Diana (*aedes Dianae*) on the Aventine Hill. Later, though, he was said to favour the poor at the nobles' expense.\n\nAfter 44 years he was killed in a plot by his own daughter, Tullia, and her husband, the future king Tarquin the Proud.\n\nA puzzle surrounds him. The emperor Claudius (*Tiberius Claudius Caesar Augustus Germanicus*), in the first century AD, identified Servius with Mastarna (Etruscan *Macstrna*), an Etruscan adventurer who became king of Rome. Claudius's speech survives on a bronze tablet found in Lyon (*Lugdunum*), the *Tabula Claudiana*. Mastarna also appears on a painted Etruscan tomb, the François Tomb at Vulci. The historian Momigliano warned, however, that Mastarna is so unlike the traditional Servius that the two are best kept apart."},{"id":"tarquin-the-proud","title":"Tarquin the Proud and Lucretia","body":"Rome's seventh and last king, Lucius Tarquinius Superbus (*Superbus*, \"the Proud\"), seized power by murdering his father-in-law, King Servius Tullius. He was the son of the earlier king Tarquinius Priscus, and according to tradition he ruled for 25 years.\n\nHe was an energetic ruler. He fought Rome's neighbours, including the Volsci, a hill people to the south-east, and made Rome the leading power among the Latin cities (*nomen Latinum*, the \"Latin name\"). He finished the great temple of Jupiter on the Capitoline Hill. But Romans remembered him as a tyrant (*tyrannus*) who ruled through violence and fear, ignored custom (*mos maiorum*, \"the ways of the ancestors\") and the Senate, and even judged death-penalty cases (*res capitales*) without advisers.\n\nAccording to the traditional story, the crisis came when the king's son Sextus Tarquinius raped Lucretia, a virtuous noblewoman. She told her husband, Lucius Tarquinius Collatinus, and her father, Spurius Lucretius Tricipitinus, what had happened and then killed herself rather than live with the dishonour. Her death sparked an uprising. The tale later inspired Shakespeare's poem Lucrece and many paintings in the 18th and 19th centuries."},{"id":"birth-of-the-republic","title":"The Fall of the Kings","body":"According to tradition, the revolt against Tarquin the Proud, Rome's last king, came in 509 BC. It was led by Lucius Junius Brutus (*Lucius Iunius Brutus*), the king's nephew. He was joined by Lucretia's husband Collatinus, her father, and a friend named Publius Valerius Poplicola (also spelled *Publicola*, \"friend of the people\"). While the king was away besieging Ardea, a town of the Rutuli south of Rome, they shut the city gates (*portae*) against him and won over the army (*exercitus*).\n\nIn place of a king, Rome now elected two consuls (*consules*) each year, starting with Brutus and Collatinus. This marked the birth of the Republic (*res publica*, \"the public thing\"). Brutus made the people swear an oath (*iusiurandum*) never again to accept a king. When his own sons were caught plotting to bring Tarquin back, he ordered their execution.\n\nTarquin fought to return. An Etruscan king, Lars Porsenna (*Lars Porsena*) of Clusium, marched on Rome, but legend says the hero Horatius (*Horatius Cocles*, \"the one-eyed\") held a bridge, the *Pons Sublicius*, alone until it could be torn down. Rome then defeated an alliance of Latin towns at Lake Regillus (*Lacus Regillus*). Tarquin died in exile (*exsilium*) at Cumae, a Greek city near Naples (*Neapolis*), in 495 BC.\n\nThe story echoed through later history. French revolutionaries named boys and towns after Brutus, and the authors of the American Federalist Papers signed themselves \"Publius\" after Poplicola."},{"id":"how-reliable","title":"What Historians Really Know","body":"Almost nothing written survives from the age of Rome's kings. Ancient writers blamed the Gauls (*Galli*), invaders from the north who sacked Rome in 390 BC, for destroying many records. The first history of Rome was written by Fabius Pictor (*Quintus Fabius Pictor*) around 200 BC, about three centuries after the kings fell; he wrote in Greek. Writers such as Livy, whose great history is called *Ab Urbe Condita* (\"From the Founding of the City\"), relied largely on oral tradition, family stories and even plays.\n\nModern historians are therefore cautious. Seven kings ruling for 243 years means an average reign of almost 35 years, which seems far too long. Archaeology shows that Rome did have kings, but most scholars doubt the traditional stories about them.\n\nThe overthrow is especially suspect. Lucretia's story closely resembles a Greek tale about the fall of the tyrants of Athens, around 510 BC. And the Roman historians Tacitus (*Publius Cornelius Tacitus*) and Pliny (*Gaius Plinius Secundus*, \"Pliny the Elder\") recorded that Lars Porsenna, the Etruscan king, actually captured Rome. The historian Tim Cornell suggests that Porsenna may have ended the monarchy himself.\n\nOthers think the kingship faded slowly rather than falling in one dramatic night. Republican Rome kept a priest called the \"king of sacred rites\" (*rex sacrorum*), perhaps a last ceremonial echo of the old kings."}],"battle":{"name":"Lake Regillus","year":"c. 496 BC (traditional)","enemy":"The Latin League","sec":"birth-of-the-republic","intro":"The exiled Tarquin has not given up. An alliance of Latin towns marches on Rome, and the armies meet at Lake Regillus. Win, and the young Republic survives."},"timelines":[{"name":"Kings to Republic","blurb":"Four big moments, from legendary founding to disaster.","events":[{"label":"Romulus founds Rome on the Palatine","when":"753 BC (legend)","y":-753,"fact":"The scholar Varro worked out this official date, celebrated on 21 April, but most historians treat the founding story as myth.","sec":"romulus-and-remus"},{"label":"Numa adds January and February","when":"Under Numa, 2nd king","y":-700,"fact":"Legend credits the peaceful Sabine king Numa Pompilius with creating a twelve-month calendar.","sec":"numa-tullus-ancus"},{"label":"Revolt drives out the last king","when":"509 BC","y":-509,"fact":"Rebels shut the gates on Tarquin the Proud while he was besieging the town of Ardea.","sec":"birth-of-the-republic"},{"label":"Gauls sack Rome","when":"390 BC","y":-390,"fact":"Ancient writers blamed these northern invaders for destroying many records of the age of kings.","sec":"how-reliable"}]},{"name":"The Seven Kings","blurb":"Put the reigns of Rome's traditional kings in order.","events":[{"label":"Romans seize the Sabine women","when":"Under Romulus, 1st king","y":-740,"fact":"The war that followed ended when the captured women threw themselves between the armies.","sec":"romulus-the-king"},{"label":"Numa closes the doors of Janus","when":"Under Numa, 2nd king","y":-700,"fact":"Closing the temple of Janus, a god of beginnings, showed that Rome was at peace.","sec":"numa-tullus-ancus"},{"label":"Tullus destroys Alba Longa","when":"Under Tullus Hostilius, 3rd king","y":-660,"fact":"The warlike king moved the people of this Latin town, Romulus's legendary birthplace, to Rome.","sec":"numa-tullus-ancus"},{"label":"Ancus founds the port of Ostia","when":"Under Ancus Marcius, 4th king","y":-630,"fact":"Numa's grandson founded Ostia at the mouth of the Tiber.","sec":"numa-tullus-ancus"},{"label":"Work begins on the Great Sewer","when":"Under Tarquinius Priscus, 5th king","y":-600,"fact":"The Cloaca Maxima drained marshy ground between the hills, making room for the Roman Forum.","sec":"tarquinius-priscus"},{"label":"Rome holds its first census","when":"Under Servius Tullius, 6th king","y":-560,"fact":"Servius sorted citizens into five classes by wealth, giving the rich the most voting influence.","sec":"servius-tullius"}]},{"name":"Huts, Kings and Historians","blurb":"From the first traces on the hills to the people who wrote about them.","events":[{"label":"Bronze Age settlers on the Capitoline","when":"Possibly 1700 BC","y":-1700,"fact":"Archaeologists have found traces of Bronze Age settlement on the Capitoline Hill.","sec":"origins"},{"label":"The Forum valley is a cemetery","when":"By 1000 BC","y":-1000,"fact":"The valley that became Rome's great public square was first used for burials.","sec":"origins"},{"label":"A wall rises on the Palatine","when":"Around 730–720 BC","y":-725,"fact":"About the same time, burials in the Forum stopped and parts of it were paved over.","sec":"origins"},{"label":"Tarquin the Proud kills Servius","when":"End of the 6th king's 44-year reign","y":-534,"fact":"Servius was murdered in a plot by his own daughter Tullia and her husband, the future last king.","sec":"servius-tullius"},{"label":"Brutus and Collatinus become consuls","when":"509 BC","y":-509,"fact":"Instead of a king, Rome now elected two consuls every year.","sec":"birth-of-the-republic"},{"label":"Tarquin dies in exile at Cumae","when":"495 BC","y":-495,"fact":"The last king died in Cumae, a Greek city near Naples, after failing to win back his throne.","sec":"birth-of-the-republic"},{"label":"Fabius Pictor writes a history","when":"Around 200 BC","y":-200,"fact":"This first history of Rome came about three centuries after the kings fell.","sec":"how-reliable"},{"label":"Claudius links Servius with Mastarna","when":"1st century AD","y":50,"fact":"The emperor Claudius identified the sixth king with Mastarna, an Etruscan adventurer who became king of Rome.","sec":"servius-tullius"}]}],"matches":[{"name":"Kings and Their Deeds","blurb":"Match each traditional king of Rome to what he is remembered for.","pairs":[["Romulus","Chose 100 leading men, the fathers, as his advisers"],["Numa Pompilius","Founded the Vestal Virgins and the office of chief priest"],["Tullus Hostilius","Warlike king who destroyed Alba Longa"],["Ancus Marcius","Built Rome's first prison and founded a port at the Tiber's mouth"],["Servius Tullius","Held the first census and sorted citizens into five wealth classes"]],"secs":["romulus-the-king","numa-tullus-ancus","numa-tullus-ancus","numa-tullus-ancus","servius-tullius"]},{"name":"Words of Royal Rome","blurb":"Match each term to its meaning.","pairs":[["Interrex","Senator who served five days at a time to find a new king"],["Imperium","Supreme power to command armies, govern and judge"],["Fasces","Bundle of rods around an axe symbolising power to punish"],["Augur","Priest who looked for signs that the gods approved"],["Cloaca Maxima","The Great Sewer that drained marshy ground between the hills"]],"secs":["how-kings-ruled","how-kings-ruled","how-kings-ruled","how-kings-ruled","tarquinius-priscus"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Rex","King"],["Res publica","“The public thing”: the Republic"],["Patres","“Fathers”: Romulus’s first hundred advisers"],["Plebs","Rome’s common people"],["Mos maiorum","“The ways of the ancestors”"],["Pontifex Maximus","The chief priest, an office created by Numa"]],"secs":["origins","birth-of-the-republic","romulus-the-king","numa-tullus-ancus","tarquin-the-proud","numa-tullus-ancus"]}],"decks":[{"name":"Legends and Early Kings","blurb":"Myth, founders and the first four kings.","cards":[{"claim":"Romulus and Remus were said to be fathered by Mars, the god of war.","answer":true,"why":"Their mother Rhea Silvia was a Vestal Virgin, and legend made Mars the twins' father.","sec":"romulus-and-remus"},{"claim":"In legend, the abandoned twins were suckled by a she-bear.","answer":false,"why":"It was a she-wolf, in a cave called the Lupercal; a shepherd named Faustulus then raised them.","sec":"romulus-and-remus"},{"claim":"The scholar Varro set Rome's founding date at 753 BC, celebrated on 21 April.","answer":true,"why":"Varro worked out this official date, though most modern historians treat the founding story as myth.","sec":"romulus-and-remus"},{"claim":"After the war over the Sabine women, Romulus shared the throne with the Sabine king Titus Tatius.","answer":true,"why":"The two peoples united once the captured women threw themselves between the armies.","sec":"romulus-the-king"},{"claim":"Romulus chose 300 leading men as his advisers.","answer":false,"why":"He chose 100 men, the fathers; their descendants became the patricians, Rome's hereditary aristocracy.","sec":"romulus-the-king"},{"claim":"Numa Pompilius was remembered as Rome's most warlike king.","answer":false,"why":"Numa's 43-year reign was remembered for peace and religion; the warlike king was Tullus Hostilius.","sec":"numa-tullus-ancus"},{"claim":"According to Livy, Jupiter burned Tullus Hostilius and his house with lightning.","answer":true,"why":"The god struck when the dying king, long scornful of the gods, finally begged him for help.","sec":"numa-tullus-ancus"},{"claim":"Ancus Marcius founded the port of Naples.","answer":false,"why":"Ancus founded Ostia, a port at the mouth of the Tiber.","sec":"numa-tullus-ancus"}]},{"name":"Power, Builders and the Fall","blurb":"How kings ruled, what they built and how they fell.","cards":[{"claim":"After Romulus, Rome's kings inherited the throne from their fathers.","answer":false,"why":"Tradition says they were chosen for life: an interrex found a candidate and the Curiate Assembly accepted or rejected him.","sec":"how-kings-ruled"},{"claim":"A Roman king could not declare war without approval.","answer":true,"why":"The Senate could rarely stop the king, but declaring war needed approval.","sec":"how-kings-ruled"},{"claim":"Tarquinius Priscus raised the Senate to 200 members.","answer":true,"why":"He added 100 new members to the Senate.","sec":"tarquinius-priscus"},{"claim":"Servius Tullius sorted citizens into ten classes by wealth.","answer":false,"why":"He sorted them into five classes, which became the basis of a new voting assembly.","sec":"servius-tullius"},{"claim":"Tarquin the Proud finished the great temple of Jupiter on the Capitoline Hill.","answer":true,"why":"Work began under his father Tarquinius Priscus, who did not live to finish it.","sec":"tarquin-the-proud"},{"claim":"The revolt of 509 BC broke out while the king was besieging Ardea.","answer":true,"why":"With Tarquin away at Ardea, a town south of Rome, the rebels shut the gates and won over the army.","sec":"birth-of-the-republic"},{"claim":"Tarquin the Proud died in exile in Carthage.","answer":false,"why":"He died in 495 BC at Cumae, a Greek city near Naples.","sec":"birth-of-the-republic"},{"claim":"Livy wrote the first history of Rome around 200 BC.","answer":false,"why":"The first history of Rome was written by Fabius Pictor around 200 BC.","sec":"how-reliable"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Bronze Age traces on the Capitoline","Cemetery in the Forum valley","Huts on the Palatine","The she-wolf's cave, the Lupercal"],"odd":3,"why":"Three are found by archaeologists on Rome's site; the Lupercal, where a she-wolf suckled the twins, belongs to legend.","sec":"origins"},{"items":["Rhea Silvia","Titus Tatius","Numitor","Amulius"],"odd":1,"why":"Rhea Silvia, Numitor and Amulius belong to the royal family of Alba Longa in the twins' legend; Titus Tatius was the Sabine king who shared Romulus's throne.","sec":"romulus-and-remus"},{"items":["Interrex seeks a candidate","Census counts the citizens","Augur reads the gods' signs","Assembly grants imperium"],"odd":1,"why":"Three are steps in choosing a king; the census was a count of citizens introduced by Servius Tullius.","sec":"how-kings-ruled"},{"items":["Tarquinius Priscus","Servius Tullius","Numa Pompilius","Tarquin the Proud"],"odd":2,"why":"All four were kings of Rome. Tarquinius Priscus, Servius Tullius and Tarquin the Proud are remembered as Etruscan by birth or family; Numa was a Sabine.","sec":"numa-tullus-ancus"},{"items":["Cloaca Maxima","Temple of Diana","Circus Maximus","Roman Forum"],"odd":1,"why":"Tarquinius Priscus built the Great Sewer, laid out the Circus Maximus and began the Forum; Servius Tullius built the Temple of Diana.","sec":"tarquinius-priscus"},{"items":["Sextus Tarquinius","Lucius Junius Brutus","Collatinus","Publius Valerius Poplicola"],"odd":0,"why":"Brutus, Collatinus and Poplicola led the revolt against the king; Sextus Tarquinius was the king's son whose crime against Lucretia sparked it.","sec":"birth-of-the-republic"},{"items":["Lictors","Fasces","Sella curulis","Pons Sublicius"],"odd":3,"why":"Lictors, the fasces and the curule chair were signs of the king's power; the Pons Sublicius was the wooden bridge over the Tiber.","sec":"how-kings-ruled"}]}],"whos":[{"name":"Kings of Rome","blurb":"Which traditional king of Rome is speaking?","people":[{"name":"Numa Pompilius","options":["Numa Pompilius","Tullus Hostilius","Ancus Marcius","Romulus"],"clues":["Rome waited a year after the previous king vanished before choosing me.","I was a Sabine, famed for my justice and piety.","I founded the Vestal Virgins and created the office of chief priest.","I closed the doors of the temple of Janus to show Rome was at peace."],"sec":"numa-tullus-ancus"},{"name":"Tullus Hostilius","options":["Tullus Hostilius","Ancus Marcius","Numa Pompilius","Tarquinius Priscus"],"clues":["I reigned for 32 years.","I built a senate house that lasted for centuries.","Livy says Jupiter burned me and my house with lightning.","I destroyed Alba Longa and moved its people to Rome."],"sec":"numa-tullus-ancus"},{"name":"Tarquinius Priscus","options":["Tarquinius Priscus","Servius Tullius","Ancus Marcius","Tarquin the Proud"],"clues":["I celebrated the first triumph, a victory parade for generals.","I added 100 members to the Senate, raising it to 200.","An earlier king adopted me as his son after I moved to Rome.","I built the Great Sewer and laid out the Circus Maximus."],"sec":"tarquinius-priscus"},{"name":"Servius Tullius","options":["Servius Tullius","Tarquinius Priscus","Tarquin the Proud","Ancus Marcius"],"clues":["An emperor later claimed I was really an Etruscan adventurer called Mastarna.","I built the Temple of Diana on the Aventine Hill.","My own daughter Tullia helped plot my death.","I held Rome's first census and sorted citizens into five classes."],"sec":"servius-tullius"}]},{"name":"Downfall of the Kings","blurb":"Who is speaking about the end of Rome's monarchy?","people":[{"name":"Tarquin the Proud","options":["Tarquin the Proud","Tarquinius Priscus","Servius Tullius","Lars Porsenna"],"clues":["I fought the Volsci and made Rome the leading power among the Latin cities.","I finished the great temple of Jupiter on the Capitoline Hill.","I died in exile at Cumae in 495 BC.","I seized the throne by murdering my father-in-law."],"sec":"tarquin-the-proud"},{"name":"Lucius Junius Brutus","options":["Lucius Junius Brutus","Collatinus","Publius Valerius Poplicola","Horatius"],"clues":["I was the king's own nephew.","French revolutionaries named boys and towns after me.","I ordered the execution of my own sons for plotting to bring the king back.","I led the revolt of 509 BC and made the people swear never to accept a king."],"sec":"birth-of-the-republic"},{"name":"Lars Porsenna","options":["Lars Porsenna","Tarquin the Proud","Horatius","Lucius Junius Brutus"],"clues":["The historian Tim Cornell suggests I may have ended the monarchy myself.","Tacitus and Pliny recorded that I actually captured Rome.","I was an Etruscan king from Clusium.","Legend says one hero held a bridge alone against my march on Rome."],"sec":"how-reliable"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Alba Longa","lat":41.74691,"lon":12.65026,"why":"The Latin town where Romulus and Remus were born in legend, later destroyed by King Tullus Hostilius.","sec":"romulus-and-remus"},{"name":"Ostia","lat":41.75583333,"lon":12.29166667,"why":"The port at the mouth of the Tiber founded, by tradition, by King Ancus Marcius.","sec":"numa-tullus-ancus"},{"name":"Clusium","lat":43.01666667,"lon":11.95,"why":"Home city of the Etruscan king Lars Porsenna, who marched on Rome to restore Tarquin.","sec":"birth-of-the-republic"},{"name":"Cumae","lat":40.84861111,"lon":14.05361111,"why":"The Greek city near Naples where Tarquin the Proud died in exile in 495 BC.","sec":"birth-of-the-republic"}]}],"quizPool":{"1":[{"q":"According to tradition, what was unusual about the background of King Servius Tullius?","options":["He was a Carthaginian merchant","He was raised by a she-wolf","He was a Greek refugee from Troy","He was the son of a slave"],"a":3,"level":1,"why":"Tradition held that Servius was the son of a slave. He rose to marry the daughter of the previous king, Tarquinius Priscus.","sec":"servius-tullius"},{"q":"What does archaeology suggest about Rome's kings?","options":["The kings were really Greek governors from Cumae","All seven kings are confirmed by royal inscriptions","Rome never had kings; they were invented by Livy","Rome did have kings, though the stories about them are doubtful"],"a":3,"level":1,"why":"Archaeology confirms that Rome had kings, but most scholars doubt the traditional stories about them. Modern historians are cautious because so few written sources survive.","sec":"how-reliable"},{"q":"Which Latin town, said to be Romulus's birthplace, was destroyed by King Tullus Hostilius?","options":["Ardea","Veii","Alba Longa","Ostia"],"a":2,"level":1,"why":"The warlike Tullus Hostilius destroyed Alba Longa and moved its people to Rome. He also built a senate house that lasted for centuries.","sec":"numa-tullus-ancus"},{"q":"According to legend, which hero held a bridge alone against the army of Lars Porsenna?","options":["Brutus","Collatinus","Poplicola","Horatius"],"a":3,"level":1,"why":"Horatius held the bridge alone until it could be torn down. Porsenna, an Etruscan king from Clusium, had marched on Rome to help Tarquin return.","sec":"birth-of-the-republic"},{"q":"What were the fasces, carried ahead of Rome's kings by their attendants?","options":["A bundle of rods around an axe","A bronze shield and spear","A gilded eagle on a tall pole","A set of sacred temple keys"],"a":0,"level":1,"why":"The fasces were a bundle of rods around an axe that symbolised the king's power to punish. Twelve attendants carried them ahead of him.","sec":"how-kings-ruled"},{"q":"By about which date was Rome a true city, with a central forum, monumental buildings and public temples?","options":["600 BC","1000 BC","400 BC","800 BC"],"a":0,"level":1,"why":"By 600 BC the villages had fully merged into one city. Rome now had a central forum, monumental buildings and public temples.","sec":"origins"},{"q":"Servius Tullius is credited with holding Rome's first what?","options":["Triumph, a victory parade","Consular election","Chariot race","Census, a count of citizens"],"a":3,"level":1,"why":"Servius held Rome's first census and sorted citizens into five classes by wealth. His lasting fame rests on this reorganisation of Roman society.","sec":"servius-tullius"},{"q":"Which year did the Romans officially give for the founding of their city?","options":["776 BC","509 BC","753 BC","814 BC"],"a":2,"level":1,"why":"The scholar Varro worked out the official founding date of 753 BC. Romans celebrated it every year on 21 April.","sec":"romulus-and-remus"},{"q":"Romulus chose 100 leading men as advisers, called the \"fathers\". What did their descendants become?","options":["The plebeians","The patricians","The equestrians","The lictors"],"a":1,"level":1,"why":"The descendants of Romulus's 100 \"fathers\" became the patricians, Rome's hereditary aristocracy. Romulus was also escorted by twelve attendants called lictors.","sec":"romulus-the-king"},{"q":"By around 1000 BC, what was the valley that later became the Roman Forum used for?","options":["A royal palace complex","A cattle market","A cemetery","A chariot-racing track"],"a":2,"level":1,"why":"Long before it became Rome's great public square, the Forum valley was a cemetery. Huts already stood on the nearby Palatine Hill by the 9th or 8th century BC.","sec":"origins"},{"q":"According to the story, Romulus's men carried off the young women of which people during a festival?","options":["The Latins of Alba Longa","The Etruscans","The Volsci","The Sabines"],"a":3,"level":1,"why":"Rome had too few women, so Romulus invited the Sabines to a religious festival and his men seized their young women. The Sabines were a hill people living north-east of Rome.","sec":"romulus-the-king"},{"q":"Who plotted the killing of King Servius Tullius after his 44-year reign?","options":["A son of Ancus Marcius","The Sabine nobles","His daughter Tullia and her husband","Lucius Junius Brutus"],"a":2,"level":1,"why":"Servius was killed in a plot by his own daughter, Tullia, and her husband. That husband went on to become Tarquin the Proud, Rome's last king.","sec":"servius-tullius"},{"q":"What was the Cloaca Maxima, built under Tarquinius Priscus?","options":["A covered market beside the Tiber","A stone wall around the seven hills","A great sewer that drained marshy ground","A temple to Jupiter on the Capitoline"],"a":2,"level":1,"why":"The Cloaca Maxima, or \"Great Sewer\", drained the marshy ground between Rome's hills. On the reclaimed land, Tarquinius began the Roman Forum.","sec":"tarquinius-priscus"},{"q":"How do archaeologists think Rome actually came into being?","options":["Through the gradual merging of hilltop villages","Founded in a single day by one leader","As an Etruscan military fortress","Built by Greek colonists from Cumae"],"a":0,"level":1,"why":"Rome grew slowly as several hilltop villages merged. The process was probably inspired by the idea of the city-state, which was then spreading from Greece.","sec":"origins"},{"q":"Which invaders, who sacked Rome in 390 BC, were blamed for destroying many records of the early city?","options":["The Carthaginians","The Etruscans","The Gauls","The Samnites"],"a":2,"level":1,"why":"Ancient writers blamed the Gauls, invaders from the north, for destroying many records. As a result, almost nothing written survives from the age of the kings.","sec":"how-reliable"},{"q":"How did Romans remember Tarquin the Proud?","options":["As a weak king controlled by the Senate","As a reformer who favoured the poor","As a pious king who loved peace","As a tyrant ruling through violence and fear"],"a":3,"level":1,"why":"Romans remembered Tarquin as a tyrant who ignored custom and the Senate. He even judged death-penalty cases without advisers.","sec":"tarquin-the-proud"},{"q":"What was the Circus Maximus, laid out by Tarquinius Priscus, built to host?","options":["Chariot races","Gladiator fights","Military training","Public assemblies"],"a":0,"level":1,"why":"The Circus Maximus was a giant stadium for chariot races. Tarquinius also founded the Roman games.","sec":"tarquinius-priscus"},{"q":"According to tradition, how long did a Roman king hold the throne once chosen, after the reign of Romulus?","options":["For life","For five years","Until his eldest son came of age","For a single year"],"a":0,"level":1,"why":"Rome's later kings were not born to the throne but chosen for life. When a king died, the Senate took charge until a new one was found.","sec":"how-kings-ruled"},{"q":"What was imperium, the power the assembly granted to a new king?","options":["The right to name his own successor","Sole control over the Vestal Virgins","The supreme power to command armies, govern and judge","The right to tax conquered towns"],"a":2,"level":1,"why":"Imperium was the supreme power to command armies, govern and judge. The king was also Rome's chief priest and controlled the calendar.","sec":"how-kings-ruled"},{"q":"King Numa Pompilius closed the doors of which god's temple as a sign that Rome was at peace?","options":["Jupiter","Janus","Mars","Vesta"],"a":1,"level":1,"why":"Numa closed the doors of the temple of Janus, a god of beginnings, to show Rome was at peace. His 43-year reign was remembered for peace and religion.","sec":"numa-tullus-ancus"},{"q":"Which port at the mouth of the Tiber was founded by King Ancus Marcius?","options":["Antium","Cumae","Ardea","Ostia"],"a":3,"level":1,"why":"Ancus Marcius founded Ostia at the river's mouth. He also settled conquered Latins on the Aventine Hill, forming the origins of the plebeians.","sec":"numa-tullus-ancus"},{"q":"According to the traditional story, whose crime against the noblewoman Lucretia set off the uprising against Rome's last king?","options":["The augur of the Capitoline","The Etruscan king Lars Porsenna","The king's son Sextus Tarquinius","The king's nephew Brutus"],"a":2,"level":1,"why":"The king's son Sextus Tarquinius raped Lucretia. She told her husband and father, then killed herself, and her death sparked the uprising.","sec":"tarquin-the-proud"},{"q":"Who wrote the first history of Rome, around 200 BC?","options":["Tacitus","Pliny","Fabius Pictor","Livy"],"a":2,"level":1,"why":"Fabius Pictor wrote the first history of Rome around 200 BC, about three centuries after the kings fell. Later writers such as Livy relied largely on oral tradition.","sec":"how-reliable"},{"q":"According to the story, how did the war that followed the seizure of the Sabine women end?","options":["Romulus killed the Sabine king in single combat","The Etruscans forced both sides to make peace","A storm scattered the two armies","The women threw themselves between the armies"],"a":3,"level":1,"why":"The captured women stopped the fighting by throwing themselves between the armies. Afterwards the Romans and Sabines united into one people.","sec":"romulus-the-king"},{"q":"What replaced the king as Rome's leadership after the revolt?","options":["Two consuls elected each year","A council of twelve senators","An Etruscan governor","A single dictator chosen for life"],"a":0,"level":1,"why":"Rome began electing two consuls every year instead of a king. The first two were Brutus and Collatinus, Lucretia's husband.","sec":"birth-of-the-republic"},{"q":"According to tradition, who led the revolt against Tarquin the Proud?","options":["Lucius Junius Brutus","Titus Tatius","Sextus Tarquinius","Lars Porsenna"],"a":0,"level":1,"why":"The revolt was led by Lucius Junius Brutus, the king's own nephew. Tradition dates it to 509 BC.","sec":"birth-of-the-republic"},{"q":"According to legend, which god fathered Romulus and Remus?","options":["Apollo","Neptune","Mars","Jupiter"],"a":2,"level":1,"why":"The twins were said to be sons of Mars, the god of war. Their mother, Rhea Silvia, had been forced to become a Vestal Virgin, a priestess sworn to chastity.","sec":"romulus-and-remus"},{"q":"According to tradition, Rome's fifth king, Tarquinius Priscus, was an immigrant born into which people?","options":["The Greeks","The Sabines","The Etruscans","The Volsci"],"a":2,"level":1,"why":"Tarquinius Priscus was traditionally born an Etruscan, one of the wealthy peoples living north of Rome in what is now Tuscany. He became Rome's first Etruscan king.","sec":"tarquinius-priscus"},{"q":"In the legend, which animal suckled the abandoned twins Romulus and Remus?","options":["A goat","A sow","A bear","A she-wolf"],"a":3,"level":1,"why":"A she-wolf suckled the twins in a cave called the Lupercal. A shepherd named Faustulus then raised them.","sec":"romulus-and-remus"},{"q":"Which writer's poem \"Lucrece\" was inspired by the story of Lucretia?","options":["Milton","Chaucer","Byron","Shakespeare"],"a":3,"level":1,"why":"Lucretia's story inspired Shakespeare's poem Lucrece. It also inspired many paintings in the 18th and 19th centuries.","sec":"tarquin-the-proud"},{"q":"What did the Latin word rex mean?","options":["King","Senator","Priest","Soldier"],"a":0,"level":1,"why":"Rex meant king; the Romans had seven of them before the Republic.","sec":"origins"},{"q":"In the legend, a lupa fed the twins Romulus and Remus. What was a lupa?","options":["A she-wolf","A she-bear","A goat","A shepherdess"],"a":0,"level":1,"why":"A she-wolf (lupa) suckled the twins in a cave called the Lupercal.","sec":"romulus-and-remus"},{"q":"Ancus Marcius founded Ostia. What does its Latin root ostium mean?","options":["River mouth","Salt","Harbour wall","Ship"],"a":0,"level":1,"why":"Ostia lay at the mouth of the Tiber, and ostium means river mouth.","sec":"numa-tullus-ancus"}],"2":[{"q":"The Senate (senatus) took its name from which Latin word?","options":["senex, \"old man\"","sanctus, \"holy\"","signum, \"sign\"","sella, \"chair\""],"a":0,"level":2,"why":"The Senate was a council of elders: senatus comes from senex, \"old man\".","sec":"romulus-the-king"},{"q":"The word \"republic\" comes from the Latin res publica. What did it mean?","options":["\"The public thing\"","\"Rule by the people\"","\"The city of the fathers\"","\"The law of the consuls\""],"a":0,"level":2,"why":"Res publica meant \"the public thing\": the state belonged to the people, not to a king.","sec":"birth-of-the-republic"},{"q":"Rome's last king was called Superbus. What does it mean?","options":["The Proud","The Elder","The Great","The Cruel"],"a":0,"level":2,"why":"Lucius Tarquinius Superbus was \"Tarquin the Proud\"; the earlier Tarquin was Priscus, \"the Elder\".","sec":"tarquin-the-proud"},{"q":"Why did the classicist Mary Beard call Romulus \"Mr Rome\"?","options":["He was the only king born inside the city","He personally designed every Roman temple","Roman coins always showed his portrait","He was Rome's first elected consul","His name was probably invented from the city's name"],"a":4,"level":2,"why":"The name Romulus was probably made up from the name of Rome itself, hence \"Mr Rome\". Most modern historians treat the founding legend as myth.","sec":"romulus-and-remus"},{"q":"What was the role of the augur in making a new king?","options":["He sought signs that the gods approved","He granted the king imperium","He crowned the king in the Forum","He presented the king to the Senate","He counted the assembly's votes"],"a":0,"level":2,"why":"The augur, a priest, took the king-elect up to the citadel to look for signs of divine approval. Only after this did the assembly grant the king imperium.","sec":"how-kings-ruled"},{"q":"After Romulus vanished in a storm, a respected nobleman claimed Romulus had appeared to him in a vision as which god?","options":["Janus","Saturn","Mars","Jupiter","Quirinus"],"a":4,"level":2,"why":"The nobleman said Romulus had appeared as the god Quirinus. Others whispered that the nobles had murdered the king and hidden the pieces of his body.","sec":"romulus-the-king"},{"q":"On which hill have archaeologists found traces of Bronze Age settlement, possibly from as early as 1700 BC?","options":["Palatine","Aventine","Capitoline","Quirinal","Esquiline"],"a":2,"level":2,"why":"The earliest traces of settlement come from the Capitoline Hill, possibly as early as 1700 BC. Huts appeared on the Palatine much later, by the 9th or 8th century BC.","sec":"origins"},{"q":"Why do historians find the traditional 243 years for Rome's seven kings hard to believe?","options":["Archaeology shows Rome had only three kings","It leaves no time for Romulus's founding","The dates contradict the Gallic sack","It means an average reign of almost 35 years","No king is mentioned by any Greek writer"],"a":3,"level":2,"why":"Seven kings across 243 years gives an average reign of almost 35 years, which seems far too long. This is one reason modern historians treat the traditional story cautiously.","sec":"how-reliable"},{"q":"According to Livy, how did the warlike King Tullus Hostilius die?","options":["He fell in battle against Alba Longa","He vanished in a storm while reviewing troops","Jupiter burned him and his house with lightning","He drowned while crossing the Tiber","He was murdered by a son of Ancus"],"a":2,"level":2,"why":"Tullus had scorned the gods. When he finally begged Jupiter for help as he lay dying, the god struck him with lightning after a 32-year reign.","sec":"numa-tullus-ancus"},{"q":"Which king adopted the immigrant Tarquinius Priscus as a son?","options":["Tullus Hostilius","Romulus","Ancus Marcius","Numa Pompilius","Servius Tullius"],"a":2,"level":2,"why":"After settling in Rome, Tarquinius won the favour of King Ancus Marcius, who adopted him. He went on to become Rome's fifth king.","sec":"tarquinius-priscus"},{"q":"Which great building project did Tarquin the Proud complete?","options":["The Circus Maximus","The temple of Jupiter on the Capitoline","The Cloaca Maxima","Rome's first bridge over the Tiber","The Temple of Diana on the Aventine"],"a":1,"level":2,"why":"Tarquin the Proud finished the great temple of Jupiter on the Capitoline Hill. He was an energetic ruler who made Rome the leading power among the Latin cities.","sec":"tarquin-the-proud"},{"q":"The authors of the American Federalist Papers took their pen name from which early Roman?","options":["Poplicola","Brutus","Horatius","Collatinus","Servius Tullius"],"a":0,"level":2,"why":"The Federalist authors signed themselves \"Publius\" after Publius Valerius Poplicola, one of the leaders of the revolt. French revolutionaries likewise named boys and towns after Brutus.","sec":"birth-of-the-republic"},{"q":"What did Brutus do when his own sons were caught plotting to bring Tarquin back?","options":["Pardoned them before the assembly","Sent them into exile at Cumae","Resigned as consul in shame","Stripped them of citizenship","Ordered their execution"],"a":4,"level":2,"why":"Brutus ordered the execution of his own sons for plotting the king's return. He had made the people swear never again to accept a king.","sec":"birth-of-the-republic"},{"q":"Which emperor identified Servius Tullius with Mastarna, an Etruscan adventurer who became king of Rome?","options":["Claudius","Hadrian","Tiberius","Augustus","Nero"],"a":0,"level":2,"why":"The emperor Claudius made this identification in the first century AD. The historian Momigliano warned that Mastarna is so unlike the traditional Servius that the two are best kept apart.","sec":"servius-tullius"},{"q":"After the Romans and Sabines united, which Sabine king shared the throne with Romulus?","options":["Numa Pompilius","Titus Tatius","Lars Porsenna","Amulius","Ancus Marcius"],"a":1,"level":2,"why":"Once the two peoples united, the Sabine king Titus Tatius ruled jointly with Romulus. The union followed the war over the seized Sabine women.","sec":"romulus-the-king"},{"q":"Later Romans traced the family of Romulus and Remus back to which hero, who fled the fall of Troy?","options":["Odysseus","Achilles","Aeneas","Hector","Priam"],"a":2,"level":2,"why":"Later Romans linked the twins' family to Aeneas, a refugee from fallen Troy. Most modern historians treat this whole founding story as myth.","sec":"romulus-and-remus"},{"q":"When a king died, what did the interrex, or \"between-king\", do?","options":["Commanded the army until a new war began","Organised the dead king's funeral games","Guarded the royal treasury for the heir","Ruled for a full year until the Senate voted","Served five days to find a candidate for the throne"],"a":4,"level":2,"why":"A senator served as interrex for five days to find a candidate, then handed over to another senator if he failed. The chosen man was then presented to the Curiate Assembly.","sec":"how-kings-ruled"},{"q":"How was the new voting assembly based on Servius Tullius's wealth classes organised?","options":["So that plebeians outvoted the nobles","So that every citizen had an equal vote","So that each district voted equally","So that the rich had the most influence","So that only patricians could vote"],"a":3,"level":2,"why":"Servius's five wealth classes formed a voting assembly weighted towards the rich. Later, though, he was said to favour the poor at the nobles' expense.","sec":"servius-tullius"},{"q":"Lucretia's story closely resembles a Greek tale about which event?","options":["The Persian invasion of Greece","The reforms of Solon","The sack of Troy","The fall of the tyrants of Athens","The founding of Cumae"],"a":3,"level":2,"why":"Lucretia's story mirrors a Greek tale about the fall of Athens' tyrants around 510 BC, which makes Rome's version suspect. Some historians think Rome's kingship faded slowly rather than ending in one dramatic night.","sec":"how-reliable"},{"q":"Tarquin the Proud was the son of which earlier king?","options":["Tullus Hostilius","Tarquinius Priscus","Servius Tullius","Numa Pompilius","Ancus Marcius"],"a":1,"level":2,"why":"Tarquin the Proud was the son of Tarquinius Priscus, while Servius Tullius was his father-in-law. According to tradition he ruled for 25 years.","sec":"tarquin-the-proud"},{"q":"Tarquinius Priscus added 100 new members to the Senate. How large did that make it?","options":["250","100","150","300","200"],"a":4,"level":2,"why":"The extra 100 members raised the Senate to 200. Tarquinius also reportedly doubled Rome's size through wars against the Sabines and Etruscans.","sec":"tarquinius-priscus"}],"3":[{"q":"How did the reign of Tarquinius Priscus end after 38 years?","options":["He was struck by lightning from Jupiter","He was murdered by a son of Ancus Marcius","He died in exile at Cumae","He fell in battle against the Sabines","He vanished during a storm","He was killed by his daughter and her husband"],"a":1,"level":3,"why":"Tarquinius Priscus was murdered by a son of Ancus Marcius, the king who had adopted him. He is remembered for introducing the symbols of office and celebrating the first triumph.","sec":"tarquinius-priscus"},{"q":"Where and when did the exiled Tarquin the Proud die?","options":["At Veii in 490 BC","At Ardea in 495 BC","At Cumae in 495 BC","At Lake Regillus in 496 BC","At Cumae in 509 BC","At Clusium in 495 BC"],"a":2,"level":3,"why":"Tarquin died in exile at Cumae, a Greek city near Naples, in 495 BC. His attempts to return had failed, ending with Rome's victory over a Latin alliance at Lake Regillus.","sec":"birth-of-the-republic"},{"q":"Around 730–720 BC, at about the time a wall was built on the Palatine, what happened to the Forum area?","options":["It was walled off as an Etruscan fortress","Burials stopped and parts were paved as a shared space","A palace for Romulus was built over it","It was flooded and abandoned for a century","It became a royal burial ground for the kings","It was given over to chariot racing"],"a":1,"level":3,"why":"As the Palatine wall went up, burials in the Forum stopped and parts of it were paved over. It became a shared space for meeting and worship.","sec":"origins"},{"q":"Legend credits King Numa with adding which two months to create a twelve-month calendar?","options":["November and December","September and October","January and February","July and August","March and April","May and June"],"a":2,"level":3,"why":"Numa was said to have added January and February to make a twelve-month calendar. Rome waited a year after Romulus vanished before choosing him as king.","sec":"numa-tullus-ancus"},{"q":"Which modern historian suggests that the Etruscan king Lars Porsenna may have ended Rome's monarchy himself?","options":["Tim Cornell","Livy","Varro","Fabius Pictor","Arnaldo Momigliano","Mary Beard"],"a":0,"level":3,"why":"Tim Cornell put forward this idea. It builds on the Roman historians Tacitus and Pliny, who recorded that Porsenna actually captured Rome.","sec":"how-reliable"},{"q":"Which hill people living south-east of Rome did Tarquin the Proud fight?","options":["The Volsci","The Samnites","The Sabines","The Hernici","The Aequi","The Gauls"],"a":0,"level":3,"why":"Tarquin fought the Volsci, a hill people to the south-east. His wars made Rome the leading power among the Latin cities.","sec":"tarquin-the-proud"},{"q":"In the legend, what did Romulus and Remus do once grown, before setting out to found their own city?","options":["Took the throne of Alba Longa for themselves","Served as priests of Mars in Alba Longa","Led the Latins against the Etruscans","Overthrew Amulius and restored their grandfather","Married Sabine princesses","Fled to Troy to find their ancestors"],"a":3,"level":3,"why":"The twins overthrew Amulius, who had seized Alba Longa's throne, and restored their grandfather Numitor. They then quarrelled while founding their city, and Remus was killed.","sec":"romulus-and-remus"},{"q":"Romans counted years ab urbe condita. What did that mean?","options":["From the founding of the city","Under the rule of the kings","In the year of the consuls","Since the war with the Sabines"],"a":0,"level":3,"why":"Years were counted from Rome's traditional founding in 753 BC, abbreviated AUC.","sec":"romulus-and-remus"},{"q":"Tarquin the Proud was said to ignore the mos maiorum. What was it?","options":["The ways of the ancestors","The laws of the Twelve Tables","The advice of the augurs","The rights of the plebs"],"a":0,"level":3,"why":"The mos maiorum, \"the ways of the ancestors\", was the unwritten custom Romans expected their rulers to respect.","sec":"tarquin-the-proud"}]},"chronicleMaps":[{"id":"latium","sec":"origins","title":"Rome and its neighbours","caption":"The kings' Rome was one town among many in Latium, between the Etruscans to the north and the Sabines and Volsci in the hills. Where exactly Lake Regillus lay is uncertain.","bounds":{"latMin":41.45,"latMax":42.36,"lonMin":11.68,"lonMax":13.02},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"r","dy":-4},{"name":"Ostia","lat":41.756,"lon":12.291,"side":"l"},{"name":"Veii","lat":42.024,"lon":12.401,"side":"r"},{"name":"Tarquinii","lat":42.249,"lon":11.756,"side":"r"},{"name":"Alba Longa","lat":41.747,"lon":12.65,"side":"r"},{"name":"Lake Regillus","latin":"Lacus Regillus","lat":41.855,"lon":12.68,"kind":"lake","side":"r"},{"name":"Ardea","lat":41.612,"lon":12.541,"side":"r"}],"peoples":[{"name":"Etruscans","latin":"Etrusci","lat":42.13,"lon":11.98},{"name":"Sabines","latin":"Sabini","lat":42.2,"lon":12.78},{"name":"Latins","latin":"Latini","lat":41.67,"lon":12.4},{"name":"Volsci","lat":41.53,"lon":12.86}],"edges":[{"name":"Clusium","text":"Clusium, Porsenna's city","dir":"n","km":150,"lon":12.3},{"name":"Cumae","text":"Cumae, where Tarquin died","dir":"s","km":190,"lon":12.62}]},{"id":"hills","sec":"romulus-the-king","title":"The hills of Rome","caption":"The city grew from villages on these hills. The Forum lay in the valley below the Palatine and the Capitoline, close to the Tiber crossing. The site of the old wooden bridge, the Pons Sublicius, is approximate.","bounds":{"latMin":41.876,"latMax":41.906,"lonMin":12.459,"lonMax":12.509},"hills":[{"name":"Capitoline","latin":"Capitolium","lat":41.8933,"lon":12.4831,"r":0.0016,"side":"l"},{"name":"Palatine","latin":"Palatium","lat":41.8894,"lon":12.4875,"r":0.002,"side":"r"},{"name":"Aventine","latin":"Mons Aventinus","lat":41.8834,"lon":12.4805,"r":0.0022,"side":"l"}, the first triumph.","sec":"tarquinius-priscus"},{"name":"Servius Tullius","text":"Sixth king; held the first census and sorted citizens into five classes by wealth.","sec":"servius-tullius"},{"name":"Tarquin the Proud","text":"Tarquinius Superbus, the seventh and last king, remembered as a tyrant.","sec":"tarquin-the-proud"},{"name":"Lucretia","text":"Noblewoman whose rape by the king's son and her death sparked the uprising against the kings.","sec":"tarquin-the-proud"},{"name":"Lucius Junius Brutus","text":"The king's nephew who led the revolt; one of Rome's first two consuls.","sec":"birth-of-the-republic"},{"name":"Lars Porsenna","text":"Etruscan king of Clusium who marched on Rome to bring Tarquin back.","sec":"birth-of-the-republic"},{"name":"Horatius Cocles","text":"Hero who, legend says, held the Pons Sublicius alone until it could be torn down.","sec":"birth-of-the-republic"}],"dates":[{"when":"c. 1700 BC","text":"Possible first traces of settlement on the Capitoline Hill.","sec":"origins"},{"when":"753 BC","text":"The traditional founding of Rome, celebrated on 21 April; Romans counted years from it.","sec":"romulus-and-remus"},{"when":"c. 730–720 BC","text":"A wall is built on the Palatine Hill.","sec":"origins"},{"when":"c. 600 BC","text":"The villages have become a city, with a forum, monumental buildings and temples.","sec":"origins"},{"when":"509 BC","text":"Tarquin the Proud is expelled; two consuls are elected and the Republic begins.","sec":"birth-of-the-republic"},{"when":"c. 496 BC","text":"Rome defeats an alliance of Latin towns at Lake Regillus.","sec":"birth-of-the-republic"},{"when":"495 BC","text":"Tarquin dies in exile at Cumae.","sec":"birth-of-the-republic"},{"when":"390 BC","text":"The Gauls sack Rome, destroying many early records.","sec":"how-reliable"},{"when":"c. 200 BC","text":"Fabius Pictor writes the first history of Rome, in Greek.","sec":"how-reliable"}],"terms":[{"latin":"rex","english":"king","sec":"origins"},{"latin":"senatus","english":"the Senate, from *senex*, “old man”","sec":"romulus-the-king"},{"latin":"patres","english":"“fathers”: Romulus's first hundred advisers","sec":"romulus-the-king"},{"latin":"patricii","english":"patricians, Rome's hereditary aristocracy","sec":"romulus-the-king"},{"latin":"plebs","english":"Rome's common people","sec":"numa-tullus-ancus"},{"latin":"lictores","english":"the twelve attendants who walked ahead of the king","sec":"romulus-the-king"},{"latin":"fasces","english":"a bundle of rods around an axe: the power to punish","sec":"how-kings-ruled"},{"latin":"imperium","english":"the supreme power to command armies, govern and judge","sec":"how-kings-ruled"},{"latin":"interrex","english":"“between-king”: a senator who looked for the next king","sec":"how-kings-ruled"},{"latin":"interregnum","english":"the time without a king","sec":"how-kings-ruled"},{"latin":"comitia curiata","english":"the Curiate Assembly, which accepted or rejected a new king","sec":"how-kings-ruled"},{"latin":"auspicia","english":"signs that the gods approved, read by an augur","sec":"how-kings-ruled"},{"latin":"sella curulis","english":"the curule chair, the king's seat of office","sec":"how-kings-ruled"},{"latin":"Pontifex Maximus","english":"the chief priest, an office created by Numa","sec":"numa-tullus-ancus"},{"latin":"Cloaca Maxima","english":"the Great Sewer that drained the ground between the hills","sec":"tarquinius-priscus"},{"latin":"triumphus","english":"the victory parade for a successful general","sec":"tarquinius-priscus"},{"latin":"census","english":"the count of citizens, first held by Servius Tullius","sec":"servius-tullius"},{"latin":"comitia centuriata","english":"the voting assembly by wealth, in which the rich had the most say","sec":"servius-tullius"},{"latin":"mos maiorum","english":"“the ways of the ancestors”: Roman custom","sec":"tarquin-the-proud"},{"latin":"consules","english":"the two consuls elected each year instead of a king","sec":"birth-of-the-republic"},{"latin":"res publica","english":"“the public thing”: the Republic","sec":"birth-of-the-republic"},{"latin":"ab urbe condita","english":"“from the founding of the city”: how Romans counted years","sec":"romulus-and-remus"}]}},{"id":"conflict-of-orders-origins","era":"early-republic","short":"Patricians vs Plebeians","title":"The Conflict of the Orders: Origins","period":"509-450 BC","sources":["Conflict of the Orders","Secessio plebis","Tribune of the plebs","Twelve Tables"],"briefing":{"title":"Rome, 494 BC","paragraphs":["Rome, 494 BC. Fifteen years after driving out its last king, the young Republic is run by two consuls elected each year and a Senate of leading men. All of them come from a small circle of aristocratic families called patricians, who alone hold office and know the unwritten law.","Everyone else is a plebeian. Plebeians farm, trade and fill the army, but while they fight, their farms fail and their debts pile up. Now, with enemies on three sides, the soldiers are about to refuse to march."]},"sections":[{"id":"patricians-and-plebeians","title":"Patricians and Plebeians","body":"According to tradition, the Romans drove out their last king (*rex*) in 509 BC and founded a republic (*res publica*, \"the public thing\"). Power passed to two consuls (*consules*), chief magistrates (*magistratus*) elected for a single year, and to the Senate (*senatus*), a council of leading men. Both belonged to the patricians (*patricii*), a small circle of aristocratic families who alone could stand for office. They also controlled the law, which was unwritten and interpreted only by upper-class priests.\n\nEveryone else was a plebeian (*plebeius*). The plebs (*plebs*, \"the common people\") were the great mass of citizens who farmed, traded and, crucially, filled the ranks of the army (*exercitus*). That duty was a trap. While a plebeian soldier was away on campaign, his farm lay abandoned. Many had to borrow from patricians, and a debtor who could not pay could be beaten, imprisoned or even enslaved, a form of debt bondage the Romans called *nexum*.\n\nLess than twenty years after the Republic began, this resentment boiled over. The long struggle that followed, lasting until 287 BC, is known as the Conflict of the Orders, from the Latin *ordo* (plural *ordines*), a rank of society."},{"id":"debt-crisis","title":"The Debt Crisis of 495 BC","body":"By 495 BC, debt (*aes alienum*, literally \"someone else's bronze\") was the burning issue in Rome. Plebeians, the common citizens, openly asked why moneylenders should be allowed to beat and imprison those who owed them.\n\nLivy (*Titus Livius*), the Roman historian who wrote the fullest account of these years nearly five centuries later, tells a story that captures the mood. A former soldier, ragged and dishevelled, threw himself into the Forum (*Forum Romanum*), Rome's main public square. While he fought the Sabines, a hill people north-east of Rome, raiders had burned his farm and stolen his property. Back home, he borrowed to pay a tax, and crushing interest (*faenus*) swallowed his grandfather's farm, then his father's. Finally his creditors dragged him to prison, whipped him and threatened him with death.\n\nThe crowd erupted, and the story raced through the city. Everyone waited for the consuls or the Senate to act. Instead, one hard-line consul issued decrees reinforcing creditors' right to imprison debtors."},{"id":"first-secession","title":"The First Secession, 494 BC","body":"In 494 BC Rome was at war with three neighbouring peoples: the Sabines, and the Aequi and Volsci, hill tribes to the east and south-east. The plebeian soldiers were called up as usual. This time they refused to march.\n\nAdvised by Sicinius (*Lucius Sicinius Vellutus*), the plebeian leader who masterminded the walkout, they left the city together and camped on the *Mons Sacer*, the \"Sacred Mount\", a hill about 5 km (just over three miles) away. There they built simple defences and waited.\n
