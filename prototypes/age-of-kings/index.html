when":"298 BC","y":-298,"fact":"Their appeal against a Samnite invasion started the Third Samnite War.","sec":"third-war-sentinum"},{"label":"Largest Roman colony founded at Venusia","when":"291 BC","y":-291,"fact":"Venusia commanded routes into Lucania, Apulia and Samnium.","sec":"aquilonia-and-the-end"},{"label":"Rome and allies fight Gauls at Telamon","when":"225 BC","y":-225,"fact":"The Greek historian Polybius counted about 41,000 Romans alongside 210,000 allies.","sec":"roman-alliance-system"}]}],"matches":[{"name":"Who's Who of the Samnite Wars","blurb":"Match each leader to what they did.","pairs":[["Marcus Valerius Corvus","Won at Mount Gaurus and later calmed mutineers as dictator"],["Gaius Pontius","Samnite commander who trapped a Roman army in the Apennine gorges"],["Herennius","Elderly father who said: free all the Romans or kill them all"],["Fabius Maximus Rullianus","Led a Roman army through the dreaded Ciminian Forest"],["Gellius Egnatius","Samnite commander who marched north to rally the Etruscans"]],"secs":["first-war-campaigns","caudine-forks","caudine-forks","second-war-turning","third-war-sentinum"]},{"name":"Words of War","blurb":"Match each term to its meaning.","pairs":[["Fetials","Priests who made formal demands and declared war"],["Dictator","Emergency ruler given sweeping powers"],["Proconsul","Commander whose command was extended until the campaign ended"],["The yoke","Frame of spears that defeated soldiers had to file under"],["Roman allies","Kept their own governments but sent soldiers at their own expense"]],"secs":["first-war-outbreak","first-war-campaigns","second-war-outbreak","caudine-forks","roman-alliance-system"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Deditio","Unconditional surrender to Rome"],["Iugum","The yoke of spears the defeated walked under"],["Devotio","A commander giving his life to the gods for victory"],["Legio linteata","The Linen Legion, sworn never to flee"],["Socii","Rome’s allies, who sent soldiers for its wars"],["Pro consule","“In place of a consul”: a proconsul"]],"secs":["first-war-outbreak","caudine-forks","third-war-sentinum","aquilonia-and-the-end","roman-alliance-system","second-war-outbreak"]}],"decks":[{"name":"The First War and Its Doubts","blurb":"How the first war began, and whether Livy got it right.","cards":[{"claim":"The River Liris divided Latium from Campania.","answer":true,"why":"The Liris separated Latium, the Latin homeland around Rome, from the fertile Campanian plain.","sec":"samnites-and-rome"},{"claim":"The Samnites spoke Latin, like the Romans.","answer":false,"why":"The Samnites spoke Oscan, an Italian language shared with several neighbours.","sec":"samnites-and-rome"},{"claim":"The first war began when the Samnites attacked the Sidicini.","answer":true,"why":"The Samnites attacked the Sidicini, a small people north of Campania; the Campanians helped them and were beaten.","sec":"first-war-outbreak"},{"claim":"The Senate eagerly accepted the Campanians' offer of alliance at once.","answer":false,"why":"Livy says the senators were tempted but refused, since an alliance would betray their treaty with the Samnites.","sec":"first-war-outbreak"},{"claim":"Valerius won at Mount Gaurus with a surprise charge at dawn.","answer":false,"why":"He won with a desperate charge as daylight faded.","sec":"first-war-campaigns"},{"claim":"In the peace of 341 BC Rome kept its alliance with Capua.","answer":true,"why":"Rome left the Sidicini to the Samnites but kept Capua, a far greater prize.","sec":"first-war-campaigns"},{"claim":"Livy's Campanian envoys give a speech modelled on a scene in Thucydides.","answer":true,"why":"It closely resembles Thucydides' scene where envoys from Corcyra beg Athens for help.","sec":"doubting-livy"},{"claim":"Salmon and Forsythe accept Capua's surrender in 343 BC as genuine.","answer":false,"why":"Salmon and Forsythe think it was invented, projected back from 211 BC; Cornell and Oakley are the ones who accept it.","sec":"doubting-livy"}]},{"name":"From the Caudine Forks to Mastery","blurb":"The second and third wars and what they built.","cards":[{"claim":"In 328 BC Rome founded a colony at Fregellae, on the Liris.","answer":true,"why":"The Samnites saw this colony, in an area they had recently overrun, as open aggression.","sec":"second-war-outbreak"},{"claim":"Naples was then an Etruscan city.","answer":false,"why":"Naples was a Greek city made up of an old town, Paleopolis, and a newer one, Neapolis.","sec":"second-war-outbreak"},{"claim":"Before the Caudine Forks, Samnite soldiers disguised as merchants spread a false rumour.","answer":false,"why":"They were disguised as shepherds, spreading the rumour that Luceria was under attack.","sec":"caudine-forks"},{"claim":"According to the story, Pontius chose the middle course his father warned against.","answer":true,"why":"Herennius said to free all the Romans or kill them all; Pontius let them go humiliated under the yoke.","sec":"caudine-forks"},{"claim":"Fabius sent his Etruscan-speaking brother through the Ciminian Forest disguised as a shepherd.","answer":true,"why":"After this scouting trip, Fabius marched his army through a forest no Roman had ever crossed.","sec":"second-war-turning"},{"claim":"At Sentinum, Gallic chariots broke the wing commanded by Fabius.","answer":false,"why":"The chariots broke Decius' wing; Decius then sacrificed himself, and Fabius outflanked the Samnites.","sec":"third-war-sentinum"},{"claim":"At Venusia Rome founded its largest colony ever.","answer":true,"why":"Rome took Venusia in 291 BC and settled its largest colony there, commanding routes into three regions.","sec":"aquilonia-and-the-end"},{"claim":"At Telamon in 225 BC, Polybius counted more Romans than allies.","answer":false,"why":"He counted about 41,000 Romans alongside 210,000 allies.","sec":"roman-alliance-system"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Samnites","Etruscans","Umbrians","Lucanians"],"odd":3,"why":"The Samnites, Etruscans and Umbrians (with the Senone Gauls) fought Rome together in 295 BC; the Lucanians had asked Rome for protection against the Samnites.","sec":"third-war-sentinum"},{"items":["Aulus Cornelius Cossus","Gaius Pontius","Lucius Papirius Cursor","Spurius Carvilius Maximus"],"odd":1,"why":"Cossus, Papirius and Carvilius were Roman consuls; Gaius Pontius was the Samnite commander at the Caudine Forks.","sec":"caudine-forks"},{"items":["Diodorus","Polybius","Dionysius of Halicarnassus","Livy"],"odd":3,"why":"Diodorus, Polybius and Dionysius of Halicarnassus were Greek historians; Livy was Roman and wrote in Latin.","sec":"doubting-livy"},{"items":["Mount Gaurus","Suessula","Lautulae","Sentinum"],"odd":2,"why":"Rome won at Mount Gaurus, Suessula and Sentinum; at Lautulae in 315 BC the Samnites won.","sec":"second-war-turning"},{"items":["Capua","Cales","Fregellae","Venusia"],"odd":0,"why":"Cales, Fregellae and Venusia received Roman colonists; Capua was the chief Campanian city and Rome's ally, not a Roman colony.","sec":"second-war-outbreak"},{"items":["Consul","Fetial","Dictator","Proconsul"],"odd":1,"why":"Consuls, dictators and proconsuls held power to lead armies; fetials were priests who handled formal demands and declarations of war.","sec":"first-war-outbreak"},{"items":["The war's very existence","Campanian envoys' speech","Decius' hilltop rescue","The defiant Samnite assembly"],"odd":0,"why":"The speech, the rescue and the assembly are suspected of being borrowed or invented; most historians now accept the war itself really happened.","sec":"doubting-livy"}]}],"whos":[{"name":"Roman Commanders","blurb":"Generals and heroes who fought the Samnites.","people":[{"name":"Marcus Valerius Corvus","options":["Marcus Valerius Corvus","Aulus Cornelius Cossus","Lucius Papirius Cursor","Spurius Carvilius Maximus"],"clues":["I rushed to Suessula on Campania's eastern edge and captured the enemy camp.","Named dictator in 342 BC, I talked mutinous soldiers down without bloodshed.","My desperate charge as daylight faded won Rome's first victory of the war.","I won the battle of Mount Gaurus, near Cumae."],"sec":"first-war-campaigns"},{"name":"Publius Decius Mus","options":["Publius Decius Mus","Aulus Cornelius Cossus","Marcus Valerius Corvus","Quintus Fabius Maximus Rullianus"],"clues":["Historians suspect my famous exploit was borrowed from an episode of 258 BC.","I was only a junior officer when a consul was trapped in a mountain pass.","With a small band I seized a hilltop and distracted the enemy while the army escaped.","My son, who shared my name, gave his life at Sentinum."],"sec":"first-war-campaigns"},{"name":"Quintus Fabius Maximus Rullianus","options":["Quintus Fabius Maximus Rullianus","Publius Decius Mus","Quintus Publilius Philo","Marcus Valerius Corvus"],"clues":["In 295 BC I shared the consulship with the son of an earlier war hero.","At Sentinum I outflanked the Samnites after my colleague died.","My Etruscan-speaking brother scouted ahead for me disguised as a shepherd.","I led the first Roman army through the dreaded Ciminian Forest."],"sec":"second-war-turning"},{"name":"Lucius Papirius Cursor","options":["Lucius Papirius Cursor","Spurius Carvilius Maximus","Quintus Fabius Maximus Rullianus","Aulus Cornelius Cossus"],"clues":["Thanks to a deserter's tip, I intercepted twenty elite Samnite companies.","While my colleague took the surrender of Cominium, I attacked the town nearby.","One modern historian says my victory sealed the Samnites' fate.","I captured Aquilonia in 293 BC."],"sec":"aquilonia-and-the-end"}]},{"name":"Rome's Enemies","blurb":"Leaders who stood against Rome.","people":[{"name":"Gaius Pontius","options":["Gaius Pontius","Herennius","Gellius Egnatius","Pyrrhus"],"clues":["Later summaries say a Samnite commander of my name was paraded in a triumph and beheaded.","The story goes that I chose the middle course my father warned against.","I sent soldiers disguised as shepherds to spread a false rumour about Luceria.","I trapped two Roman consuls and their army at the Caudine Forks."],"sec":"caudine-forks"},{"name":"Herennius","options":["Herennius","Gaius Pontius","Gellius Egnatius","Pyrrhus"],"clues":["The story goes that I warned a middle course would neither win friends nor remove enemies.","My advice: free them all for friendship, or kill them all and cripple Rome.","As an elderly man, I was asked what to do with a trapped Roman army.","My son was the Samnite commander at the Caudine Forks."],"sec":"caudine-forks"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Fregellae","lat":41.53666667,"lon":13.53888889,"why":"Rome's colony on the Liris, founded in 328 BC, which the Samnites saw as open aggression.","sec":"second-war-outbreak"},{"name":"Naples","lat":40.8358,"lon":14.2486,"why":"The Greek city whose quarrel with Rome sparked the Great Samnite War and fell to a siege in 326 BC.","sec":"second-war-outbreak"},{"name":"Caudine Forks","lat":41.05,"lon":14.61666667,"why":"The Apennine gorges where the Samnites trapped a Roman army in 321 BC and sent it under the yoke.","sec":"caudine-forks"},{"name":"Lake Vadimo","lat":42.4842,"lon":12.3232,"why":"Site of the hard-fought victory of 310 BC that, Livy says, first broke Etruscan might.","sec":"second-war-turning"},{"name":"Sentinum","lat":43.41848889,"lon":12.85225,"why":"East of the Apennines, where Rome defeated a coalition of four peoples in 295 BC.","sec":"third-war-sentinum"},{"name":"Venusia","lat":40.96176944,"lon":15.81478611,"why":"Taken in 291 BC and settled as Rome's largest colony ever, commanding routes into Lucania, Apulia and Samnium.","sec":"aquilonia-and-the-end"}]}],"quizPool":{"1":[{"q":"What did every treaty with Rome require its allies to provide?","options":["Hostages from every leading family","Soldiers for Rome's wars at their own expense","Annual tribute paid in silver","Warships for the Roman fleet"],"a":1,"level":1,"why":"Allies kept their own governments but had to send soldiers for Rome's wars and pay for them themselves. This gave Rome an enormous pool of manpower.","sec":"roman-alliance-system"},{"q":"What humiliation did the trapped Roman army suffer at the Caudine Forks in 321 BC?","options":["They were forced to burn their own standards","They were sold into slavery in Samnium","They had to hand over their consuls for execution","They filed out unarmed under the yoke"],"a":3,"level":1,"why":"The Romans passed unarmed under the yoke, a frame of spears symbolising subjugation, while the enemy jeered. Rome went into mourning afterwards.","sec":"caudine-forks"},{"q":"How were the Samnites, Rome's great rivals in the Apennines, organised?","options":["As a confederation of hill tribes","As a federation of Celtic war bands","As a single kingdom ruled from Capua","As a league of Greek coastal cities"],"a":0,"level":1,"why":"The Samnites were a confederation of hill tribes living in the Apennine Mountains, and the strongest people in the region. Their homeland rose beyond the fertile Campanian plain.","sec":"samnites-and-rome"},{"q":"Which people asked Rome for protection against a Samnite invasion, triggering the Third Samnite War in 298 BC?","options":["The Lucanians","The Sidicini","The Campanians","The Apulians"],"a":0,"level":1,"why":"The Lucanians, who lived south of Samnium, appealed to Rome when the Samnites invaded. The war that followed lasted until 290 BC.","sec":"third-war-sentinum"},{"q":"According to Livy, which small people did the Samnites attack, sparking the First Samnite War?","options":["The Sidicini","The Umbrians","The Lucanians","The Pentri"],"a":0,"level":1,"why":"The Samnites attacked the Sidicini, whose stronghold north of Campania controlled a valuable crossroads. The Campanians came to their aid and were beaten twice.","sec":"first-war-outbreak"},{"q":"After the Roman Senate turned down their alliance, what did the desperate Campanian envoys do, according to Livy?","options":["Invited a Roman colony to settle at Capua","Surrendered Capua and all Campania unconditionally","Promised Rome an annual tribute of grain","Offered hostages from Capua's leading families"],"a":1,"level":1,"why":"The envoys played their last card by surrendering Capua and all Campania to Rome unconditionally. That made Campania Roman property and put Roman honour at stake.","sec":"first-war-outbreak"},{"q":"Where did Rome found its largest colony ever, in 291 BC?","options":["Luceria","Venusia","Cales","Fregellae"],"a":1,"level":1,"why":"Rome took Venusia, which commanded routes into Lucania, Apulia and Samnium, and founded its largest colony ever there. The last Samnite resistance was crushed the following year.","sec":"aquilonia-and-the-end"},{"q":"Who is our main ancient guide to the Samnite Wars?","options":["Diodorus","Thucydides","Polybius","Livy"],"a":3,"level":1,"why":"Livy, a Roman historian, is the main source, though he wrote about three centuries after the events. Modern historians treat parts of his account cautiously.","sec":"first-war-outbreak"},{"q":"What language did the Samnites speak?","options":["Latin","Greek","Etruscan","Oscan"],"a":3,"level":1,"why":"The Samnites spoke Oscan, an Italian language they shared with several neighbours. The Campanians on the plain below were themselves descended from Samnite migrants.","sec":"samnites-and-rome"},{"q":"When the Samnites trapped a Roman consul's army in a mountain pass in 343 BC, how did Publius Decius Mus save it?","options":["He brought up reinforcements from Capua","He seized a hilltop and distracted the enemy","He bribed the Samnite commander to withdraw","He led the army out through a hidden tunnel"],"a":1,"level":1,"why":"Decius, then a junior officer, seized a hilltop with a small band and drew off the enemy while the army escaped. The trapped consul was Aulus Cornelius Cossus.","sec":"first-war-campaigns"},{"q":"What lasting Roman innovation came out of the siege of Naples?","options":["The appointment of emergency dictators","The creation of a permanent fleet","Extending a command with the title of proconsul","The election of two consuls each year"],"a":2,"level":1,"why":"Instead of handing over to the next year's consuls, the commanders kept their command until the campaign ended, as proconsuls. One of them was Quintus Publilius Philo.","sec":"second-war-outbreak"},{"q":"At Sentinum in 295 BC, what did the consul Publius Decius Mus do after Gallic chariots broke his wing?","options":["He negotiated a truce with the Gauls","He handed his command to his colleague Fabius","He devoted himself and charged to his death","He retreated behind the Roman camp walls"],"a":2,"level":1,"why":"Decius prayed to the gods and charged into the enemy, sacrificing his life. His men rallied, and Fabius outflanked the Samnites to win the battle.","sec":"third-war-sentinum"},{"q":"What were the Caudine Forks, where a Roman army was trapped in 321 BC?","options":["A marshy river crossing on the Liris","A dense forest just north of Rome","A narrow coastal pass near Cumae","Two wooded Apennine gorges joined by a ravine"],"a":3,"level":1,"why":"The Caudine Forks were two narrow wooded gorges in the Apennines joined by a tight ravine. The Samnites blocked both ends with felled trees and boulders.","sec":"caudine-forks"},{"q":"What did elite Samnite units swear before the battle at Aquilonia in 293 BC?","options":["To give no quarter to prisoners","To march on Rome itself","To sacrifice their spoils to the gods","Never to flee, on pain of death"],"a":3,"level":1,"why":"Elite units swore a sacred oath never to flee, on pain of death. Some 40,000 Samnites gathered at Aquilonia in north-western Samnium.","sec":"aquilonia-and-the-end"},{"q":"Which river divided Latium, the Latin homeland around Rome, from Campania?","options":["The Liris","The Arno","The Tiber","The Volturnus"],"a":0,"level":1,"why":"In the mid-fourth century BC, Rome's territory reached south as far as the River Liris, the boundary between Latium and Campania. Modern historians suspect the 354 BC treaty made it a dividing line between Rome and the Samnites.","sec":"samnites-and-rome"},{"q":"Where did Marcus Valerius Corvus win the first Roman victory of the First Samnite War?","options":["Lautulae","Sentinum","Mount Gaurus","Suessula"],"a":2,"level":1,"why":"Valerius won at Mount Gaurus, near Cumae, with a desperate charge as daylight faded. Livy credits Rome with three victories in 343 BC.","sec":"first-war-campaigns"},{"q":"Why do most historians now accept that the First Samnite War really happened?","options":["Diodorus describes it in great detail","No Roman would invent a story so embarrassing","Archaeologists have found its battlefields","Greek inscriptions record its peace treaty"],"a":1,"level":1,"why":"The war's embarrassing details make it unlikely to be a Roman invention. Some historians once rejected it entirely because Diodorus never mentions it.","sec":"doubting-livy"},{"q":"Which city provided the spark for the Second Samnite War?","options":["Naples","Cumae","Luceria","Capua"],"a":0,"level":1,"why":"Naples, then a Greek city, was the spark: Livy says its old town, Paleopolis, attacked Romans living in Campania. Samnite troops helped defend the city against Rome.","sec":"second-war-outbreak"},{"q":"At the Caudine Forks the Romans walked under the iugum. What was it?","options":["A yoke made of spears","A triumphal arch","A wooden bridge","A row of shields"],"a":0,"level":1,"why":"Passing under the yoke showed that an army had been defeated and subjugated.","sec":"caudine-forks"},{"q":"What was the devotio of Publius Decius Mus at Sentinum?","options":["He offered his own life to the gods and charged the enemy","He deserted to the Samnites","He swore never to retreat","He made peace with the Gauls"],"a":0,"level":1,"why":"His sacrifice rallied his men, and the coalition collapsed.","sec":"third-war-sentinum"},{"q":"Who were Rome’s socii?","options":["Its allies, who sent soldiers for its wars","Its enemies in Samnium","Its colonists","Its priests"],"a":0,"level":1,"why":"Allied peoples kept their own governments but sent troops at their own expense.","sec":"roman-alliance-system"}],"2":[{"q":"What was a deditio, like Capua’s surrender in Livy’s story?","options":["An unconditional surrender to Rome","A peace treaty between equals","A declaration of war","A new colony"],"a":0,"level":2,"why":"By surrendering, Campania became Roman property that Rome had to defend.","sec":"first-war-outbreak"},{"q":"What did the title pro consule mean?","options":["In place of a consul","Before the consuls","Against the consuls","Chosen by the consuls"],"a":0,"level":2,"why":"Commanders whose command was extended to finish a campaign became proconsuls.","sec":"second-war-outbreak"},{"q":"At Aquilonia, what was the legio linteata?","options":["The Linen Legion of Samnites sworn never to flee","A Roman legion of veterans","Rome’s Etruscan allies","The guard of the consuls"],"a":0,"level":2,"why":"Elite Samnite units swore a sacred oath never to flee, on pain of death.","sec":"aquilonia-and-the-end"},{"q":"Which town, seen by Rome as its key to Etruria, did the Etruscans besiege in 311 BC?","options":["Cales","Fregellae","Cumae","Sutrium","Venusia"],"a":3,"level":2,"why":"The Etruscan siege of Sutrium opened a second front for Rome during the Great Samnite War. Fabius Maximus Rullianus answered with his march through the Ciminian Forest.","sec":"second-war-turning"},{"q":"According to the story of the Caudine Forks, what did Pontius' elderly father Herennius advise?","options":["Free them all or kill them all, but nothing in between","Keep the army hostage until Rome surrendered Campania","Ransom the consuls and kill the soldiers","Sell the captives to Greek slave traders","Send the Romans home under the yoke"],"a":0,"level":2,"why":"Herennius said freeing everyone would win Rome's friendship and killing everyone would cripple Rome, while a middle course would do neither. Pontius chose the middle course anyway.","sec":"caudine-forks"},{"q":"Why did the Samnites see Rome's colony at Fregellae, founded in 328 BC, as open aggression?","options":["It lay on the Liris in an area they had recently overrun","It was built inside the Samnite capital","It was founded during a sworn truce","It blocked the road from Capua to Naples","It was settled by Campanian rebels"],"a":0,"level":2,"why":"Fregellae sat on the Liris in territory the Samnites had recently taken. It followed Rome's earlier settlement of 2,500 colonists at Cales.","sec":"second-war-outbreak"},{"q":"Why must historians rely on brief summaries for the events after Aquilonia?","options":["Polybius began his history only in 225 BC","Diodorus refused to write about Rome","The Samnites destroyed the Roman archives","Roman records burned in a Gallic sack","Livy's surviving books stop at that point"],"a":4,"level":2,"why":"Livy's surviving books end with Aquilonia, so later events come from short summaries. These report that a Samnite commander named Gaius Pontius was captured, paraded in a triumph and beheaded.","sec":"aquilonia-and-the-end"},{"q":"According to Livy, why did the Roman Senate at first refuse the Campanians' offer of alliance?","options":["Rome was already at war with the Etruscans","The consuls refused to lead an army south","Campania was too far from Rome to defend","The Campanians had attacked Roman colonists","It would betray Rome's treaty with the Samnites"],"a":4,"level":2,"why":"The senators were tempted by Campanian wealth but would not break their treaty with the Samnites. Only after Campania surrendered itself to Rome did Roman honour become involved.","sec":"first-war-outbreak"},{"q":"Scholars such as Salmon and Forsythe think the story of Capua's surrender in 343 BC was projected back from which later event?","options":["Capua's real surrender in 211 BC after siding with Carthage","The Caudine Forks disaster of 321 BC","The founding of Venusia in 291 BC","The battle of Telamon in 225 BC","The siege of Naples in 326 BC"],"a":0,"level":2,"why":"They argue the earlier surrender was invented on the model of 211 BC, when Rome punished Capua for siding with Carthage. Such a tale would clear Rome of treaty-breaking and blame scheming Campanians.","sec":"doubting-livy"},{"q":"How did the consul Papirius manage to intercept twenty elite Samnite companies at Aquilonia in 293 BC?","options":["He crossed a forest no Roman had entered","He was tipped off by a deserter","He disguised his men as shepherds","He bribed the Samnite commander","His colleague drew the Samnites into a trap"],"a":1,"level":2,"why":"A deserter tipped off Papirius, who intercepted the elite companies and took Aquilonia. At the same time nearby Cominium surrendered to his colleague Carvilius.","sec":"aquilonia-and-the-end"},{"q":"Where did the Samnites win a victory over Rome in 315 BC, during the Great Samnite War?","options":["Lake Vadimo","Aquilonia","Mount Gaurus","Sentinum","Lautulae"],"a":4,"level":2,"why":"When fighting resumed after the truce, the Samnites won at Lautulae in 315 BC. The war saw reverses on both sides.","sec":"second-war-turning"},{"q":"Under the peace of 341 BC that ended the First Samnite War, what did Rome do?","options":["Left the Sidicini to the Samnites but kept Capua","Gave up all claims north of the Liris","Founded a colony at Fregellae","Received Samnite hostages and tribute","Annexed the Sidicini and abandoned Capua"],"a":0,"level":2,"why":"Rome let the Samnites have the Sidicini but held on to its alliance with Capua. The old treaty with the Samnites was renewed.","sec":"first-war-campaigns"},{"q":"What did the Greek historian Dionysius of Halicarnassus think really motivated Rome to protect the Lucanians in 298 BC?","options":["A desire to found a colony at Venusia","Hope of seizing Lucanian silver mines","Compassion for a weak neighbour","Fear of Samnite power","A sacred obligation under fetial law"],"a":3,"level":2,"why":"Dionysius believed Rome acted from fear of Samnite power, not compassion. The Lucanians' appeal triggered the Third Samnite War.","sec":"third-war-sentinum"},{"q":"According to Livy, which hard-fought Roman victory in 310 BC first broke Etruscan might?","options":["Sentinum","Cominium","Lake Vadimo","Sutrium","Suessula"],"a":2,"level":2,"why":"Livy places the victory at Lake Vadimo in 310 BC. It followed Fabius' daring march through the Ciminian Forest.","sec":"second-war-turning"},{"q":"The speech Livy gives the Campanian ambassadors closely resembles a scene in which earlier historian?","options":["Polybius","Dionysius of Halicarnassus","Diodorus","Thucydides","Herodotus"],"a":3,"level":2,"why":"The speech is modelled on Thucydides' scene in which envoys from Corcyra beg Athens for help. This is one reason modern historians treat Livy's account cautiously.","sec":"doubting-livy"},{"q":"Which rich city, just north of Naples, was the chief city of the Campanians?","options":["Capua","Cumae","Suessula","Cales","Luceria"],"a":0,"level":2,"why":"Capua was the chief Campanian city. When Rome made peace in 341 BC it kept its alliance with Capua, a far greater prize than the Sidicini.","sec":"samnites-and-rome"},{"q":"Which Samnite commander took an army north to rally the Etruscans during the Third Samnite War?","options":["Herennius Pontius","Spurius Carvilius","Lucius Papirius","Gellius Egnatius","Gaius Pontius"],"a":3,"level":2,"why":"Knowing they could not win alone, the Samnites sent Gellius Egnatius north to build a coalition. By 295 BC Rome faced four peoples at once.","sec":"third-war-sentinum"},{"q":"How was the mutiny of Roman garrison troops in Campania in 342 BC ended, according to the sources?","options":["Valerius, named dictator, talked them down peacefully","The Campanians handed the mutineers over to Rome","The ringleaders were executed by the consuls","The troops were disbanded and sent home","The Senate paid them to return to duty"],"a":0,"level":2,"why":"Valerius was appointed dictator, an emergency ruler with sweeping powers, and ended the mutiny without bloodshed. The sources say the troops had been seduced by Campanian luxury.","sec":"first-war-campaigns"},{"q":"Where did Rome settle 2,500 colonists in the 330s BC, on key routes towards Capua and the Samnite mountains?","options":["Sutrium","Cales","Bovianum","Suessula","Luceria"],"a":1,"level":2,"why":"Rome planted 2,500 colonists at Cales as it kept pushing into the region. Tensions grew further with the colony at Fregellae in 328 BC.","sec":"second-war-outbreak"},{"q":"How did the Samnite commander Gaius Pontius lure the Roman army towards the Caudine Forks?","options":["By sending a deserter to betray the Samnite camp","By having fake shepherds claim Luceria was under attack","By forging a letter from the Roman Senate","By offering to surrender Bovianum","By attacking Capua and drawing the consuls south"],"a":1,"level":2,"why":"Pontius sent soldiers disguised as shepherds to spread a false rumour about Luceria, a Roman ally in Apulia. The consuls took the quickest route, straight into the trap.","sec":"caudine-forks"},{"q":"Who were Rome's fetials, who sought redress from the Samnites before war in 343 BC?","options":["Magistrates elected to lead armies","Priests handling formal demands and declarations of war","Senators who negotiated peace treaties","Envoys chosen from allied cities","Officers who commanded garrison troops"],"a":1,"level":2,"why":"The fetials were priests in charge of formal demands and declarations of war. When the Samnites refused redress, war followed.","sec":"first-war-outbreak"},{"q":"From whom were the Campanians who farmed the plain below the Apennines descended?","options":["Latin colonists","Greek colonists","Samnite migrants","Gallic invaders","Etruscan settlers"],"a":2,"level":2,"why":"The Campanians descended from Samnite migrants, but by the mid-fourth century BC they had their own identity. They also had their own rich cities.","sec":"samnites-and-rome"}],"3":[{"q":"What argument do scholars such as Cornell and Oakley make for accepting the story of Capua's surrender to Rome?","options":["The Samnites admitted it in their treaty","Capua's coins show Roman symbols from 343 BC","Livy copied it from Campanian archives","Diodorus confirms it independently","Voluntary submission was common diplomacy then","Thucydides records a similar event"],"a":4,"level":3,"why":"Cornell and Oakley note that voluntary submission was a normal diplomatic move at the time. Salmon and Forsythe, by contrast, think the story was invented.","sec":"doubting-livy"},{"q":"In 305 BC the Romans captured Bovianum. What was it?","options":["A Greek city on the Bay of Naples","Rome's key to Etruria","The capital of the Pentri, the largest Samnite tribe","The site of the Samnites' sacred oath","A Roman ally in Apulia","The chief city of the Sidicini"],"a":2,"level":3,"why":"Bovianum was the capital of the Pentri, the largest Samnite tribe. The year after its fall, the Samnites sued for peace and the old treaty was restored.","sec":"second-war-turning"},{"q":"At the battle of Telamon in 225 BC, how many Romans and allies did Polybius count?","options":["About 100,000 Romans and 110,000 allies","About 41,000 Romans and 21,000 allies","About 21,000 Romans and 41,000 allies","About 41,000 Romans and 210,000 allies","About 40,000 Romans and 40,000 allies","About 210,000 Romans and 41,000 allies"],"a":3,"level":3,"why":"Polybius counted roughly 41,000 Romans alongside 210,000 allies, showing how far allied troops outnumbered Romans. This manpower carried Rome to victory over Pyrrhus and Carthage.","sec":"roman-alliance-system"},{"q":"Where did Valerius capture the Samnite camp and scatter their foragers in Rome's third victory of 343 BC?","options":["Cales","Mount Gaurus","Lautulae","Suessula","Capua","Cumae"],"a":3,"level":3,"why":"Valerius rushed to Suessula, a town on Campania's eastern edge, for the third victory. Afterwards both consuls celebrated triumphs.","sec":"first-war-campaigns"},{"q":"According to Livy, on what grounds did the Roman Senate refuse to honour the Caudine Forks agreement?","options":["The people had never approved it","Gaius Pontius had no right to make treaties","The fetials had not sworn the oath","The Samnites had broken the truce first","The consuls had been tricked by a false rumour","The agreement had been made outside Roman territory"],"a":0,"level":3,"why":"The Senate argued that the Roman people had never approved the agreement, so the war resumed. Some historians think the truce of the following years actually came from the Caudine agreement.","sec":"caudine-forks"},{"q":"How did the Romans finally get into Naples in 326 BC?","options":["Neapolis rose against Paleopolis and expelled it","They stormed Paleopolis after a long siege","A deserter showed them a hidden gate","Two leading Neapolitans, fed up with the Samnite garrison, let them in","The Campanians from Capua opened the walls","The Samnite garrison surrendered the city for gold"],"a":3,"level":3,"why":"Two leading Neapolitans, tired of the unruly Samnite garrison, let the Romans in. The Second, or Great, Samnite War that began there lasted until 304 BC.","sec":"second-war-outbreak"},{"q":"Decius' hilltop rescue of 343 BC closely resembles a famous episode from which year, and may be borrowed from it?","options":["258 BC","225 BC","211 BC","295 BC","310 BC","321 BC"],"a":0,"level":3,"why":"The rescue looks very like a famous episode of 258 BC, so it may be a later borrowing. The other battles of the First Samnite War are doubted too.","sec":"doubting-livy"},{"q":"In Livy's account, how did Samnite leaders respond when Roman envoys asked them to spare Campania?","options":["They sent envoys of their own to the Senate","They demanded Rome surrender the Sidicini","They appealed to the Etruscans for help","They executed the Roman envoys on the spot","They offered to share Campania with Rome","They ordered their armies into Campania within earshot"],"a":5,"level":3,"why":"The Samnite leaders defiantly ordered their armies into Campania within earshot of the Roman envoys. Modern historians doubt that this defiant Samnite assembly rests on any genuine record.","sec":"first-war-outbreak"},{"q":"The Samnites were forced into a foedus iniquum. What was it?","options":["An unequal treaty with Rome","A treaty between equals","A truce for one year","A marriage alliance"],"a":0,"level":3,"why":"After 290 BC the Samnites had to ally with Rome on Rome’s terms.","sec":"roman-alliance-system"},{"q":"Fabius’s brother crossed the silva Ciminia. What was it?","options":["The Ciminian Forest, which no Roman had crossed","A mountain pass in Samnium","A river in Etruria","A sacred grove in Rome"],"a":0,"level":3,"why":"He crossed it disguised as a shepherd, and Fabius then led his army through it.","sec":"second-war-turning"}]},"chronicleMaps":[{"id":"samnium","sec":"samnites-and-rome","title":"Rome, Campania and Samnium","caption":"The River Liris divided Latium from Campania, the rich plain around Capua and Naples. The Samnites held the Apennine mountains behind it. Several sites are approximate, and Aquilonia's location is unknown.","bounds":{"latMin":40.7,"latMax":42.1,"lonMin":12.3,"lonMax":15.9},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"r","dy":-4},{"name":"Fregellae","lat":41.537,"lon":13.539,"side":"r"},{"name":"Cales","lat":41.207,"lon":14.12,"side":"l"},{"name":"Capua","lat":41.08,"lon":14.25,"side":"l","dy":6},{"name":"Naples","latin":"Neapolis","lat":40.836,"lon":14.249,"side":"r"},{"name":"Caudine Forks","lat":41.05,"lon":14.617,"kind":"battle","side":"r"},{"name":"Bovianum","lat":41.486,"lon":14.471,"side":"r"},{"name":"Luceria","lat":41.506,"lon":15.335,"side":"r"},{"name":"Venusia","lat":40.962,"lon":15.815,"side":"l"}],"peoples":[{"name":"Samnites","lat":41.72,"lon":14.6},{"name":"Latins","latin":"Latini","lat":41.65,"lon":12.95}],"rivers":[{"name":"Liris","pts":[[41.98,13.38],[41.8,13.5],[41.6,13.58],[41.42,13.72],[41.24,13.77]]}]},{"id":"sentinum","sec":"third-war-sentinum","title":"Sentinum, 295 BC","caption":"Gellius Egnatius led a Samnite army north to join the Etruscans, Umbrians and Senone Gauls. The coalition was beaten at Sentinum, east of the Apennines. The route is drawn only roughly.","bounds":{"latMin":41,"latMax":44.1,"lonMin":10.9,"lonMax":15.2},"places":[{"name":"Rome","latin":"Roma","lat":41.893,"lon":12.483,"kind":"rome","side":"l","dy":6},{"name":"Sentinum","lat":43.418,"lon":12.852,"kind":"battle","side":"r"}],"peoples":[{"name":"Samnites","lat":41.5,"lon":14.45},{"name":"Etruscans","latin":"Etrusci","lat":42.95,"lon":11.55},{"name":"Umbrians","latin":"Umbri","lat":42.95,"lon":12.7},{"name":"Senones","lat":43.85,"lon":13}],"routes":[{"pts":[[41.55,14.2],[42,13.6],[42.45,13],[42.8,12.3],[42.95,11.95]]}]}],"keyFacts":{"description":"Key facts for this chapter, written by hand from the chapter text. Every entry links to the section that explains it.","people":[{"name":"Marcus Valerius Corvus","text":"Consul who won at Mount Gaurus and Suessula in 343 BC.","sec":"first-war-campaigns"},{"name":"Publius Decius Mus (father)","text":"Junior officer who saved a trapped army by seizing a hilltop in 343 BC.","sec":"first-war-campaigns"},{"name":"Quintus Publilius Philo","text":"Commander at Naples whose command was extended: an early proconsul.","sec":"second-war-outbreak"},{"name":"Gaius Pontius","text":"Samnite commander who trapped the Romans at the Caudine Forks.","sec":"caudine-forks"},{"name":"Herennius","text":"Pontius’s father, who advised freeing all the Romans or killing them all.","sec":"caudine-forks"},{"name":"Fabius Maximus Rullianus","text":"Rome’s leading general, who crossed the Ciminian Forest and won at Sentinum.","sec":"second-war-turning"},{"name":"Gellius Egnatius","text":"Samnite commander who rallied the Etruscans and others against Rome.","sec":"third-war-sentinum"},{"name":"Publius Decius Mus (son)","text":"Consul who sacrificed his life (devotio) at Sentinum.","sec":"third-war-sentinum"},{"name":"Lucius Papirius Cursor","text":"Consul who took Aquilonia in 293 BC.","sec":"aquilonia-and-the-end"},{"name":"Livy","text":"The Roman historian who is our main guide to these wars.","sec":"first-war-outbreak"}],"dates":[{"when":"354 BC","text":"Rome and the Samnites sign a treaty.","sec":"samnites-and-rome"},{"when":"343 BC","text":"The First Samnite War begins.","sec":"first-war-outbreak"},{"when":"326 BC","text":"The Great (Second) Samnite War begins.","sec":"second-war-outbreak"},{"when":"321 BC","text":"The Caudine Forks: a Roman army passes under the yoke.","sec":"caudine-forks"},{"when":"310 BC","text":"Victory over the Etruscans at Lake Vadimo.","sec":"second-war-turning"},{"when":"304 BC","text":"Peace ends the Great Samnite War.","sec":"second-war-turning"},{"when":"295 BC","text":"Sentinum: Rome defeats Samnites, Etruscans, Umbrians and Gauls.","sec":"third-war-sentinum"},{"when":"293 BC","text":"Rome takes Aquilonia.","sec":"aquilonia-and-the-end"},{"when":"290 BC","text":"The last Samnite resistance is crushed.","sec":"aquilonia-and-the-end"}],"terms":[{"latin":"deditio","english":"unconditional surrender","sec":"first-war-outbreak"},{"latin":"fetiales","english":"priests who demanded redress and declared war","sec":"first-war-outbreak"},{"latin":"consules","english":"the two consuls","sec":"first-war-campaigns"},{"latin":"triumphi","english":"victory parades","sec":"first-war-campaigns"},{"latin":"coloni, colonia","english":"colonists and a colony","sec":"second-war-outbreak"},{"latin":"imperium","english":"the power of military command","sec":"second-war-outbreak"},{"latin":"pro consule","english":"“in place of a consul”: a proconsul","sec":"second-war-outbreak"},{"latin":"Furculae Caudinae","english":"the Caudine Forks","sec":"caudine-forks"},{"latin":"iugum","english":"the yoke of spears","sec":"caudine-forks"},{"latin":"silva Ciminia","english":"the Ciminian Forest","sec":"second-war-turning"},{"latin":"devotio","english":"giving one’s life to the gods for victory","sec":"third-war-sentinum"},{"latin":"legio linteata","english":"the Linen Legion, sworn never to flee","sec":"aquilonia-and-the-end"},{"latin":"foedus iniquum","english":"an unequal treaty","sec":"roman-alliance-system"},{"latin":"socii","english":"Rome’s allies","sec":"roman-alliance-system"},{"latin":"praeda","english":"spoils of war","sec":"roman-alliance-system"}]}},{"id":"final-conquest-of-italy","era":"early-republic","short":"Conquest of Italy","title":"Final Conquest of Italy","period":"290-264 BC","sources":["Pyrrhic War","Roman expansion in Italy","Lex Hortensia"],"briefing":{"title":"Italy, 290 BC","paragraphs":["In 290 BC Rome has just won its third war against the Samnites, tough mountain tribes of the Apennines, and now dominates central Italy. At home, though, the city is still divided: ordinary citizens, the plebeians, are locked in a two-century struggle for equal rights with the patricians, a small hereditary elite.","To the south lie the rich Greek cities of Magna Graecia, led by proud Tarentum. When Rome pushes into their world, Tarentum calls in Pyrrhus, a famous Greek king. Can Rome beat him and become master of all Italy?"]},"sections":[{"id":"rome-after-the-samnite-wars","title":"Rome After the Samnite Wars","body":"By 290 BC, Rome had fought its way to the top of central Italy. Its toughest rivals had been the Samnites, a warlike coalition of tribes from the Apennine mountains. Over three Samnite Wars (343–341, 326–304 and 298–290 BC), the two sides traded victories and heavy losses.\n\nThe turning point came in 295 BC at Sentinum, a town in Umbria in north-central Italy. There the Romans faced a mixed alliance of Samnites, Gauls, Etruscans and Umbrians. The Gauls were Celtic warriors from the north, and the Etruscans were Rome's old neighbours in Etruria, the region just north of the city. When Rome beat even this combined army, it became clear that nobody could stop it from dominating Italy.\n\nRome tightened its hold with concrete measures. It founded colonies (*coloniae*), which were settlements of loyal citizens planted on conquered land. It also built the Appian Way (*Via Appia*), a great road running south from Rome toward Capua, which carried armies and influence deep into the south.\n\nIn 282 BC, a battle at Populonia, an Etruscan town on the coast, ended the last traces of Etruscan power in the region. Yet the far south of Italy, with its wealthy Greek cities, still lay beyond Rome's control."},{"id":"lex-hortensia","title":"The Hortensian Law of 287 BC","body":"While Rome was winning wars abroad, it was also settling a long quarrel at home. For two centuries, Roman society had been split between the patricians (*patricii*), a small hereditary elite, and the plebeians (*plebs*), the mass of ordinary citizens. Historians call this struggle the Conflict of the Orders.\n\nThe plebeians had a powerful weapon: the secession (*secessio*). They would simply walk out of the city in protest, leaving Rome without workers or soldiers. According to tradition, around 287 BC they did this one more time, gathering on the Janiculum, a hill across the River Tiber.\n\nTo end the crisis, Rome appointed Quintus Hortensius as dictator. In Rome this was a temporary emergency office, not a tyrant, and Hortensius was himself a plebeian. His law, the *lex Hortensia*, made every decision (*plebiscitum*) of the Plebeian Council (*concilium plebis*) binding on all citizens, patricians included.\n\nEarlier laws in 449 and 339 BC had moved in this direction. However, they still needed the Senate (*senatus*), Rome's council of elders and ex-officials, to approve plebeian decisions. The new law removed that requirement entirely.\n\nIn theory, patricians and plebeians now had equal political rights. The law made the people and their elected champions, the tribunes (*tribuni plebis*), major players in Roman politics, and it brought the Conflict of the Orders to a close."},{"id":"why-the-plebs-seceded","title":"Why Did the Plebeians Walk Out?","body":"Ancient accounts of the last plebeian secession are not fully trusted today. The Roman tradition, preserved in yearly chronicles and by the historian Livy, blamed debt. In this version, angry city crowds in the Forum, Rome's central square, revolted when called up to fight the Lucanians, a people of southern Italy. Rome needed soldiers, so the protesters had leverage.\n\nModern historians doubt this picture. Large masses of urban poor probably did not exist in Rome at this time. Voting in the Plebeian Council was also organised by tribal districts (*tribus*), never more than 35. Rural landowners controlled 29 of them, so they, not city crowds, held most of the power.\n\nA likelier explanation, scholars argue, is land. The Third Samnite War had won Rome large tracts of public land (*ager publicus*), and rural plebeians wanted a say in how it was handed out.\n\nStill, the harsh measures taken by Rome's top officials, the consuls (*consules*), suggest there was real unrest in the city too. With both town and countryside demanding change, and the army needing men, reform became unavoidable. Such a well-crafted law probably also needed organisers, most likely the plebeian tribunes. The law did contain one oddity: it banned votes on market days (*nundinae*), which made it harder for country farmers to vote when they came to town."},{"id":"tarentum-calls-for-help","title":"Tarentum and the Road to War","body":"Southern Italy was home to *Magna Graecia*, or Great Greece, a string of rich Greek cities founded by colonists centuries earlier. As Rome pushed south after defeating the Samnites, it began making alliances with some of these cities.\n\nOne ally was Thurii, a Greek city on the Gulf of Taranto. When Thurii came under attack from a Samnite-led alliance, Rome stepped in to help. This alarmed Tarentum, the most powerful Greek city in the south, which stood on the instep of Italy's boot and wanted no Roman meddling in its backyard.\n\nTarentum struck first. It attacked a Roman fleet sailing in its waters, which an earlier treaty had forbidden. It then marched on Thurii and threw out the city's pro-Roman government.\n\nRome sent an ultimatum, which the Tarentines rejected in early 281 BC, and war followed. Tarentum knew its own army could not match Rome's in open battle. So it looked abroad for a champion and found one in Pyrrhus, king of Epirus, a Greek kingdom in what is now north-western Greece and Albania. Pyrrhus landed at Tarentum with his troops in the winter of 281/280 BC. It was the first major clash between Rome and one of the great Greek kingdoms that had arisen after Alexander the Great."},{"id":"heraclea-and-asculum","title":"Heraclea, Asculum and the Pyrrhic Victory","body":"Pyrrhus of Epirus was one of the most famous generals of his age, and at first he lived up to his reputation. In 280 BC he defeated the Romans at Heraclea in Lucania, a region of southern Italy. Some of Rome's allies promptly switched sides.\n\nPyrrhus then marched quickly north into Latium, Rome's home region, hoping to link up with the Etruscans, who were still fighting Rome. But the Romans won their war in Etruria, and Pyrrhus pulled back to spend the winter in the south.\n\nThe Romans refused to talk peace. In 279 BC they met Pyrrhus again at Asculum, in south-eastern Italy, and once more they lost. Yet Pyrrhus's own army had suffered terribly. According to ancient tradition, he exclaimed after the battle: \"Another such victory and we are lost!\"\n\nThat remark gave the English language a lasting phrase. A \"Pyrrhic victory\" is a win that costs the victor so much that it is almost a defeat.\n\nFor the moment, though, Pyrrhus had driven the Romans out of southern Italy. Rather than press on against Rome, he turned his attention to a new prize across the water: the island of Sicily."},{"id":"pyrrhus-in-sicily","title":"Pyrrhus in Sicily","body":"After his costly victories over Rome, Pyrrhus of Epirus crossed to Sicily. He came to help Syracuse, the leading Greek city on the island, in its struggle against Carthage. Carthage was a wealthy trading city in North Africa, in modern Tunisia, which controlled much of western Sicily. By now Pyrrhus's goals had grown far beyond rescuing Tarentum. He aimed to dominate both southern Italy and Sicily.\n\nAt first the campaign went well, and Pyrrhus won over much of the island. But he could not capture Lilybaeum, Carthage's great fortress on Sicily's western tip. The city could be supplied by sea, and Pyrrhus lacked the naval strength to cut it off. The war there ground to a stalemate.\n\nMeanwhile, his Sicilian supporters were growing tired of paying for the war. Back in Italy, Rome had gone on the attack again between 279 and 276 BC, pressing the Greek cities and their allies.\n\nWhen Tarentum sent a fresh plea for help, Pyrrhus agreed to return. He crossed back to southern Italy in early 276 BC, suffering some losses on the way. His Sicilian adventure had brought him nothing lasting."},{"id":"beneventum-and-withdrawal","title":"Beneventum and the End of Pyrrhus's War","body":"In 275 BC, Pyrrhus of Epirus faced the Romans one last time, at Beneventum, a town in the Samnite hill country of southern Italy. The outcome is described differently: some accounts call it a Roman victory, others a draw. Either way, it forced Pyrrhus onto the defensive.\n\nThe king now saw that the war in Italy could not be won. In the winter of 275/274 BC he sailed home to Epirus, leaving only a small garrison (*praesidium*) of his soldiers in Tarentum.\n\nHis campaign had briefly revived the hopes of Rome's enemies in the south. These included the Samnites, the Lucanians, the Bruttians of Italy's toe, and the Italian Greeks. But their gains did not last.\n\nIn 272 BC, about two years after Pyrrhus left, Tarentum fell to Rome. The Epirote garrison was allowed to go home in peace. That same year Pyrrhus himself was killed while fighting a different war at Argos, a city in southern Greece.\n\nRome's victory over a famous Greek king hugely boosted its standing across the Mediterranean world. Its control of the Italian peninsula would not be seriously challenged again until Hannibal invaded at the end of the century."},{"id":"how-rome-ruled-italy","title":"How Rome Held Italy Together","body":"With Pyrrhus gone, Rome moved quickly to take over southern Italy. Instead of ruling the Greek cities of Magna Graecia directly, it bound most of them through treaties. This gave Rome a kind of indirect control.\n\nThe burden on these Greek cities seems to have been light. Even at the start of Rome's next great war in 264 BC, the only recorded help was a fleet of transport ships borrowed from Naples, Tarentum and Locri, a Greek city on Italy's toe. Apart from Roman garrisons in many cities, Rome's grip in the south remained loose for decades.\n\nAcross Italy, Rome used several tools to absorb conquered peoples. It confiscated land and planted colonies on it. It granted some communities full Roman citizenship (*civitas*), and others a partial version without the right to vote (*civitas sine suffragio*). It also made military alliances with states, its allies (*socii*), that stayed independent in name but had to supply soldiers.\n\nThis system turned Italy into a vast reservoir of fighting men, larger than that of any other state of the time."},{"id":"italy-united-264-bc","title":"Italy Conquered: 264 BC","body":"The final pieces of Rome's conquest of Italy fell into place in the 260s BC. The last resistance in Etruria, the old Etruscan heartland north of Rome, was crushed in 265–264 BC.\n\nIn 264 BC, the same year, Rome went to war with Carthage, the North African trading power that had once been its ally. This conflict, the First Punic War, lasted until 241 BC. \"Punic\" comes from *Punici*, the Romans' name for the Carthaginians, who were of Phoenician origin. It took Roman armies outside the Italian peninsula for the first time, beginning with the fight for Sicily. Rome's attention had turned south and across the sea partly because the Alps blocked the way north, and because Rome was not yet ready to take on the Gauls who lived beneath them.\n\nIn barely a quarter of a century, Rome had changed enormously. It had settled its long internal struggle between patricians and plebeians. It had defeated the Samnites and their allies. And it had driven off Pyrrhus, a famous Greek king.\n\nRome entered 264 BC as the undisputed master of peninsular Italy, with a fearsome military reputation and an enormous supply of soldiers. The stage was set for its rise from an Italian power to a Mediterranean one."}],"battle":{"name":"Beneventum","year":"275 BC","enemy":"Pyrrhus of Epirus","sec":"beneventum-and-withdrawal","intro":"Pyrrhus, the Greek king who has beaten Rome twice at a terrible cost, faces the Romans one last time at Beneventum. Ancient accounts disagree on how it ended. Today, the outcome is up to you."},"timelines":[{"name":"The Big Moments","blurb":"Four turning points on Rome's road to ruling Italy.","events":[{"label":"Rome beats a grand alliance at Sentinum","when":"295 BC","y":-295,"fact":"At Sentinum in Umbria, Rome defeated Samnites, Gauls, Etruscans and Umbrians together, showing no one could stop it dominating Italy.","sec":"rome-after-the-samnite-wars"},{"label":"Lex Hortensia binds all citizens","when":"Around 287 BC","y":-287,"fact":"The plebeian dictator Quintus Hortensius made Plebeian Council decisions binding on everyone, ending the Conflict of the Orders.","sec":"lex-hortensia"},{"label":"Pyrrhus defeats Rome at Heraclea","when":"280 BC","y":-280,"fact":"Pyrrhus, king of Epirus, won his first battle against Rome in Lucania, and some Roman allies switched sides.","sec":"heraclea-and-asculum"},{"label":"First Punic War begins","when":"264 BC","y":-264,"fact":"Rome's war with Carthage, the North African trading power, took Roman armies outside Italy for the first time.","sec":"italy-united-264-bc"}]},{"name":"Wars of Conquest","blurb":"From the Samnite Wars to the war with Carthage.","events":[{"label":"First Samnite War begins","when":"343 BC","y":-343,"fact":"The first of three Samnite Wars opened Rome's long struggle with the warlike tribes of the Apennines.","sec":"rome-after-the-samnite-wars"},{"label":"Battle at Populonia","when":"282 BC","y":-282,"fact":"This battle at an Etruscan coastal town ended the last traces of Etruscan power in the region.","sec":"rome-after-the-samnite-wars"},{"label":"Pyrrhus wins again at Asculum","when":"279 BC","y":-279,"fact":"Pyrrhus beat Rome a second time, but his losses were so heavy that a costly win is still called a 'Pyrrhic victory'.","sec":"heraclea-and-asculum"},{"label":"Rome meets Pyrrhus at Beneventum","when":"275 BC","y":-275,"fact":"Some accounts call this battle in Samnite hill country a Roman victory, others a draw, but it forced Pyrrhus onto the defensive.","sec":"beneventum-and-withdrawal"},{"label":"Tarentum falls to Rome","when":"272 BC","y":-272,"fact":"About two years after Pyrrhus left, Tarentum surrendered and his garrison was allowed to go home in peace.","sec":"beneventum-and-withdrawal"},{"label":"First Punic War ends","when":"241 BC","y":-241,"fact":"Rome's first war with Carthage, which began with the fight for Sicily, lasted from 264 to 241 BC.","sec":"italy-united-264-bc"}]},{"name":"The Full Story","blurb":"Laws, wars and a king's adventure, in order.","events":[{"label":"Law still needing the Senate's approval","when":"339 BC","y":-339,"fact":"This earlier law strengthened plebeian decisions but still required approval by the Senate, Rome's council of elders.","sec":"lex-hortensia"},{"label":"Second Samnite War begins","when":"326 BC","y":-326,"fact":"The second of the three Samnite Wars lasted until 304 BC, with both sides trading victories and heavy losses.","sec":"rome-after-the-samnite-wars"},{"label":"Third Samnite War ends","when":"290 BC","y":-290,"fact":"By the end of this war Rome had fought its way to the top of central Italy and won large tracts of public land.","sec":"rome-after-the-samnite-wars"},{"label":"Tarentum rejects Rome's ultimatum","when":"Early 281 BC","y":-281,"fact":"After Tarentum attacked a Roman fleet and expelled Thurii's pro-Roman government, its refusal of Rome's demands meant war.","sec":"tarentum-calls-for-help"},{"label":"Pyrrhus returns from Sicily","when":"Early 276 BC","y":-276,"fact":"Answering a new plea from Tarentum, Pyrrhus crossed back to Italy, suffering losses on the way.","sec":"pyrrhus-in-sicily"},{"label":"Pyrrhus sails home to Epirus","when":"Winter 275/274 BC","y":-274,"fact":"Seeing the war in Italy could not be won, Pyrrhus went home, leaving only a small garrison in Tarentum.","sec":"beneventum-and-withdrawal"},{"label":"Pyrrhus killed at Argos","when":"272 BC","y":-272,"fact":"The king died fighting a different war at Argos, a city in southern Greece, the same year Tarentum fell.","sec":"beneventum-and-withdrawal"},{"label":"Last Etruscan resistance crushed","when":"265 BC","y":-265,"fact":"The final resistance in Etruria, the old Etruscan heartland north of Rome, was crushed in 265–264 BC.","sec":"italy-united-264-bc"}]}],"matches":[{"name":"Who's Who","blurb":"Match the people and peoples to their role in the story.","pairs":[["Quintus Hortensius","Plebeian dictator whose law bound all citizens to plebeian votes"],["Pyrrhus","King of Epirus who beat Rome at Heraclea and Asculum"],["Livy","Roman historian whose account blamed the last secession on debt"],["Hannibal","Invader who next seriously challenged Rome's hold on Italy"],["Samnites","Apennine tribal coalition Rome fought in three wars"]],"secs":["lex-hortensia","heraclea-and-asculum","why-the-plebs-seceded","beneventum-and-withdrawal","rome-after-the-samnite-wars"]},{"name":"Words and Places","blurb":"Match each term or place to its meaning.","pairs":[["Secession","Plebeian protest of walking out, leaving Rome without workers"],["Pyrrhic victory","A win so costly that it is almost a defeat"],["Colony","Settlement of loyal citizens planted on conquered land"],["Magna Graecia","'Great Greece': the rich Greek cities of southern Italy"],["Lilybaeum","Carthage's fortress on Sicily's western tip that Pyrrhus never took"]],"secs":["lex-hortensia","heraclea-and-asculum","rome-after-the-samnite-wars","tarentum-calls-for-help","pyrrhus-in-sicily"]},{"name":"Latin Words","blurb":"Match each Latin word to its meaning.","pairs":[["Via Appia","The Appian Way, the road south from Rome"],["Lex Hortensia","The law making plebeian decisions binding on all"],["Nundinae","Market days, when the law banned votes"],["Magna Graecia","“Great Greece”: the Greek cities of the south"],["Praesidium","A garrison, like the one Pyrrhus left in Tarentum"],["Punici","The Romans’ name for the Carthaginians"]],"secs":["rome-after-the-samnite-wars","lex-hortensia","why-the-plebs-seceded","tarentum-calls-for-help","beneventum-and-withdrawal","italy-united-264-bc"]}],"decks":[{"name":"Rome at Home and at War","blurb":"Samnites, secessions and a landmark law.","cards":[{"claim":"At Sentinum, Rome defeated an alliance of Samnites, Gauls, Etruscans and Umbrians.","answer":true,"why":"In 295 BC Rome beat this combined army in Umbria, making clear nobody could stop it dominating Italy.","sec":"rome-after-the-samnite-wars"},{"claim":"The Appian Way ran north from Rome into Etruria.","answer":false,"why":"The Appian Way ran south from Rome toward Capua, carrying armies and influence deep into the south.","sec":"rome-after-the-samnite-wars"},{"claim":"Quintus Hortensius, the dictator appointed to end the last secession, was a patrician.","answer":false,"why":"Hortensius was himself a plebeian, holding the dictatorship as a temporary emergency office.","sec":"lex-hortensia"},{"claim":"The lex Hortensia made Plebeian Council decisions binding without the Senate's approval.","answer":true,"why":"Earlier laws of 449 and 339 BC still needed Senate approval; the Hortensian law removed that requirement entirely.","sec":"lex-hortensia"},{"claim":"Rural landowners controlled 29 of the tribal voting districts in the Plebeian Council.","answer":true,"why":"Voting was organised by tribal districts, never more than 35, and rural landowners controlled 29 of them.","sec":"why-the-plebs-seceded"},{"claim":"The Roman tradition preserved by Livy blamed the last secession on a dispute over land.","answer":false,"why":"The tradition blamed debt. Land is the explanation favoured by modern scholars.","sec":"why-the-plebs-seceded"},{"claim":"The Hortensian law banned votes on market days.","answer":true,"why":"This oddity made it harder for country farmers to vote when they came to town.","sec":"why-the-plebs-seceded"},{"claim":"The battle at Populonia in 282 BC ended the last traces of Samnite power.","answer":false,"why":"Populonia was an Etruscan coastal town, and the battle ended the last traces of Etruscan power in the region.","sec":"rome-after-the-samnite-wars"}]},{"name":"Pyrrhus and the Conquest of the South","blurb":"A Greek king, a costly war and a united Italy.","cards":[{"claim":"Tarentum attacked a Roman fleet in its waters, which an earlier treaty had forbidden.","answer":true,"why":"Tarentum struck first against the fleet, then marched on Thurii and threw out its pro-Roman government.","sec":"tarentum-calls-for-help"},{"claim":"Pyrrhus, the king Tarentum called in, ruled Macedon.","answer":false,"why":"Pyrrhus was king of Epirus, a Greek kingdom in what is now north-western Greece and Albania.","sec":"tarentum-calls-for-help"},{"claim":"Pyrrhus defeated the Romans at Heraclea in Lucania in 280 BC.","answer":true,"why":"It was his first victory over Rome, and some of Rome's allies promptly switched sides.","sec":"heraclea-and-asculum"},{"claim":"In Sicily, Pyrrhus fought on the side of Carthage against Syracuse.","answer":false,"why":"He came to help Syracuse, the leading Greek city on the island, against Carthage.","sec":"pyrrhus-in-sicily"},{"claim":"Pyrrhus could not capture Lilybaeum because it could be supplied by sea.","answer":true,"why":"Pyrrhus lacked the naval strength to cut off Carthage's fortress, and the war ground to a stalemate.","sec":"pyrrhus-in-sicily"},{"claim":"When Tarentum fell in 272 BC, Pyrrhus's garrison there was massacred.","answer":false,"why":"The Epirote garrison was allowed to go home in peace.","sec":"beneventum-and-withdrawal"},{"claim":"In 264 BC the only recorded help from the southern Greek cities was transport ships from Naples, Tarentum and Locri.","answer":true,"why":"Rome bound these cities by treaties, and the burden on them seems to have been light.","sec":"how-rome-ruled-italy"},{"claim":"Rome turned south in 264 BC partly because it had already conquered the Gauls beneath the Alps.","answer":false,"why":"Rome was not yet ready to take on the Gauls, and the Alps blocked the way north.","sec":"italy-united-264-bc"}]}],"odds":[{"name":"Who Doesn’t Belong?","blurb":"Spot the odd one out","rounds":[{"items":["Samnites","Etruscans","Umbrians","Lucanians"],"odd":3,"why":"The Samnites, Etruscans and Umbrians (with the Gauls) fought Rome together at Sentinum in 295 BC; the Lucanians were not part of that alliance.","sec":"rome-after-the-samnite-wars"},{"items":["Naples","Tarentum","Locri","Carthage"],"odd":3,"why":"Naples, Tarentum and Locri were Greek cities of southern Italy that lent Rome transport ships in 264 BC; Carthage was the North African power Rome went to war with that year.","sec":"how-rome-ruled-italy"},{"items":["Planting colonies","Partial citizenship","Military alliances","Direct rule of Greek cities"],"odd":3,"why":"Colonies, citizenship with or without the vote, and alliances were Rome's tools for absorbing Italy; it bound the Greek cities by treaties instead of ruling them directly.","sec":"how-rome-ruled-italy"},{"items":["Carthaginians","Samnites","Lucanians","Bruttians"],"odd":0,"why":"Pyrrhus's campaign revived the hopes of the Samnites, Lucanians and Bruttians against Rome; the Carthaginians were his enemies in Sicily.","sec":"beneventum-and-withdrawal"},{"items":["Debt","Forum crowds","Dispute over public land","Lucanian call-up"],"odd":2,"why":"The Roman tradition explained the last secession with debt and Forum crowds revolting against a call-up to fight the Lucanians; land is the modern scholars' explanation.","sec":"why-the-plebs-seceded"},{"items":["Binding on all citizens","Passed by a patrician dictator","No Senate approval needed","No votes on market days"],"odd":1,"why":"Three are features of the Hortensian law; the dictator Quintus Hortensius was a plebeian, not a patrician.","sec":"lex-hortensia"},{"items":["Settled patrician-plebeian strife","Defeated the Samnites","Conquered the Alpine Gauls","Drove off Pyrrhus"],"odd":2,"why":"Three are Rome's achievements in this quarter century; Rome was not yet ready to take on the Gauls living beneath the Alps.","sec":"italy-united-264-bc"}]}],"whos":[{"name":"Faces of the Age","blurb":"A king, a reformer and a historian.","people":[{"name":"Pyrrhus","options":["Pyrrhus","Antigonus II Gonatas","Seleucus I Nicator","Agathocles"],"clues":["After my first victory, some of Rome's allies switched to my side.","I marched north into Latium hoping to join the Etruscans, but pulled back to winter in the south.","Tarentum invited me to fight Rome, and I landed there in the winter of 281/280 BC.","After my costly win at Asculum I said: 'Another such victory and we are lost!'"],"sec":"heraclea-and-asculum"},{"name":"Quintus Hortensius","options":["Quintus Hortensius","Appius Claudius Caecus","Manius Curius Dentatus","Gaius Fabricius Luscinus"],"clues":["My law contained one oddity: it banned votes on market days.","Earlier laws of 449 and 339 BC still needed the Senate's approval; mine removed that requirement.","I was a plebeian appointed dictator, a temporary emergency office, to end a walkout.","My law made every decision of the Plebeian Council binding on all citizens, patricians included."],"sec":"lex-hortensia"},{"name":"Livy","options":["Livy","Polybius","Plutarch","Dionysius of Halicarnassus"],"clues":["Modern historians doubt my picture of the last plebeian walkout.","In my version, the protesters had leverage because Rome needed soldiers.","I described angry city crowds in the Forum revolting when called up to fight the Lucanians.","I am the Roman historian who preserved the tradition that debt caused the last secession."],"sec":"why-the-plebs-seceded"}]},{"name":"Turning Points","blurb":"Men who changed the course of Rome's story.","people":[{"name":"Pyrrhus","options":["Pyrrhus","Antigonus II Gonatas","Ptolemy II Philadelphus","Seleucus I Nicator"],"clues":["My Sicilian supporters grew tired of paying for my war.","I could not capture Lilybaeum, because I lacked the ships to cut it off.","After Beneventum I sailed home to Epirus, leaving a small garrison in Tarentum.","I was killed in 272 BC while fighting a war at Argos in southern Greece."],"sec":"pyrrhus-in-sicily"},{"name":"Quintus Hortensius","options":["Quintus Hortensius","Appius Claudius Caecus","Manius Curius Dentatus","Publius Valerius Laevinus"],"clues":["My reform made the tribunes, the people's elected champions, major players in politics.","I was appointed when the plebeians gathered on the Janiculum, a hill across the Tiber.","After my law, patricians and plebeians in theory had equal political rights.","The law named after me, passed around 287 BC, ended the Conflict of the Orders."],"sec":"lex-hortensia"},{"name":"Hannibal","options":["Hannibal","Hanno the Great","Hamilcar Barca","Xanthippus"],"clues":["After Pyrrhus left, decades passed before anyone seriously threatened Rome's grip on Italy again.","When I came, Rome's control of the peninsula faced its next serious challenge.","My arrival ended Rome's long spell of unchallenged rule over Italy.","I invaded Italy at the end of the 3rd century BC."],"sec":"beneventum-and-withdrawal"}]}],"maps":[{"name":"Where It Happened","blurb":"Place the towns on the map","places":[{"name":"Sentinum","lat":43.41848889,"lon":12.85225,"why":"In 295 BC Rome defeated the combined Samnites, Gauls, Etruscans and Umbrians at this Umbrian town, the turning point of the Samnite Wars.","sec":"rome-after-the-samnite-wars"},{"name":"Populonia","lat":42.98944444,"lon":10.49138889,"why":"A battle at this Etruscan coastal town in 282 BC ended the last traces of Etruscan power in the region.","sec":"rome-after-the-samnite-wars"},{"name":"Tarentum","lat":40.47111111,"lon":17.24305556,"why":"The most powerful Greek city in the south called in Pyrrhus against Rome and finally fell to Rome in 272 BC.","sec":"tarentum-calls-for-help"},{"name":"Heraclea","lat":40.22,"lon":16.66972222,"why":"Pyrrhus won his first victory over the Romans here in Lucania in 280 BC.","sec":"heraclea-and-asculum"},{"name":"Asculum","lat":41.21555556,"lon":15.55777778,"why":"Pyrrhus beat Rome again here in 279 BC at such a cost that it gave us the phrase 'Pyrrhic victory'.","sec":"heraclea-and-asculum"},{"name":"Beneventum","lat":41.13333333,"lon":14.78333333,"why":"Pyrrhus's last battle against Rome, in 275 BC, forced him onto the defensive and led to his departure from Italy.","sec":"beneventum-and-withdrawal"}]}],"quizPool":{"1":[{"q":"What was new about the First Punic War for Rome's armies?","options":["It was their first war against a Greek king","It was the first war fought by plebeians","It took them outside Italy for the first time","It was their first fight against the Gauls"],"a":2,"level":1,"why":"The First Punic War took Roman armies beyond the Italian peninsula for the first time. It began with the fight for Sicily.","sec":"italy-united-264-bc"},{"q":"Which foreign king did Tarentum call on as its champion against Rome?","options":["Pyrrhus of Epirus","Philip of Macedon","Hannibal of Carthage","Agathocles of Syracuse"],"a":0,"level":1,"why":"Knowing its army could not match Rome's, Tarentum turned to Pyrrhus, king of Epirus in north-western Greece and Albania. He landed at Tarentum in the winter of 281/280 BC.","sec":"tarentum-calls-for-help"},{"q":"Who was appointed dictator to end the crisis of the last plebeian secession?","options":["Manius Curius","Appius Claudius","Quintus Hortensius","Publius Decius Mus"],"a":2,"level":1,"why":"Quintus Hortensius was named dictator, a temporary emergency office in Rome. He was himself a plebeian.","sec":"lex-hortensia"},{"q":"Pyrrhus crossed to Sicily to help Syracuse in its struggle against which power?","options":["Egypt","Carthage","Macedon","Rome"],"a":1,"level":1,"why":"Syracuse, the leading Greek city on Sicily, was fighting Carthage, which controlled much of western Sicily. Carthage was a wealthy trading city in North Africa.","sec":"pyrrhus-in-sicily"},{"q":"Which battle of 295 BC was the turning point that showed nobody could stop Rome from dominating Italy?","options":["Asculum","Sentinum","Beneventum","Heraclea"],"a":1,"level":1,"why":"At Sentinum in Umbria, Rome defeated a combined army of Samnites, Gauls, Etruscans and Umbrians. After that, Rome's domination of Italy looked unstoppable.","sec":"rome-after-the-samnite-wars"},{"q":"Against which power did Rome go to war in 264 BC?","options":["Epirus","Macedon","Carthage","Syracuse"],"a":2,"level":1,"why":"In 264 BC Rome went to war with Carthage, beginning the First Punic War. Carthage had once been Rome's ally.","sec":"italy-united-264-bc"},{"q":"What does the name Magna Graecia, given to the Greek cities of southern Italy, mean?","options":["Western Greece","Great Greece","New Greece","Greater Italy"],"a":1,"level":1,"why":"Magna Graecia means Great Greece, a string of rich Greek cities founded by colonists centuries earlier. Tarentum was the most powerful of them.","sec":"tarentum-calls-for-help"},{"q":"What did the lex Hortensia of 287 BC do?","options":["Cancelled all debts owed by plebeians","Abolished the office of dictator for good","Gave Roman citizenship to all Italian allies","Made Plebeian Council decisions binding on all"],"a":3,"level":1,"why":"The law made every decision of the Plebeian Council binding on all citizens, patricians included. In theory, patricians and plebeians now had equal political rights.","sec":"lex-hortensia"},{"q":"Where did Pyrrhus first defeat the Romans in 280 BC?","options":["Asculum","Sentinum","Beneventum","Heraclea"],"a":3,"level":1,"why":"Pyrrhus beat the Romans at Heraclea in Lucania in 280 BC. Some of Rome's allies promptly switched sides afterward.","sec":"heraclea-and-asculum"},{"q":"After deciding the war in Italy could not be won, where did Pyrrhus sail in the winter of 275/274 BC?","options":["Back to Sicily","To Carthage","To Macedon","Home to Epirus"],"a":3,"level":1,"why":"Pyrrhus sailed home to Epirus. He left only a small garrison of his soldiers in Tarentum.","sec":"beneventum-and-withdrawal"},{"q":"How did Rome control most of the Greek cities of Magna Graecia after Pyrrhus left?","options":["By destroying and resettling them","By handing them over to Carthage","By binding them through treaties","By sending Roman governors to rule them"],"a":2,"level":1,"why":"Rather than rule them directly, Rome bound most of the Greek cities through treaties, giving it indirect control. Apart from garrisons, its grip stayed loose for decades.","sec":"how-rome-ruled-italy"},{"q":"By the time he went to Sicily, what had Pyrrhus's ambitions grown into?","options":["Conquering Egypt and the eastern kingdoms","Retaking his lost lands back in Greece","Dominating both southern Italy and Sicily","Capturing Rome and ruling all of Latium"],"a":2,"level":1,"why":"His goals had grown far beyond rescuing Tarentum. In the end, though, his Sicilian adventure brought him nothing lasting.","sec":"pyrrhus-in-sicily"},{"q":"The Appian Way, Rome's great road, ran south from Rome toward which city?","options":["Genua","Ariminum","Capua","Arretium"],"a":2,"level":1,"why":"The Appian Way ran south toward Capua, carrying Roman armies and influence deep into the south. Rome also founded colonies of loyal citizens on conquered land.","sec":"rome-after-the-samnite-wars"},{"q":"According to the Roman tradition preserved by Livy, what caused the last plebeian secession?","options":["A tyrannical consul","Debt","Famine","Plague"],"a":1,"level":1,"why":"The traditional account blamed debt, with angry crowds revolting when called up to fight the Lucanians. Modern historians doubt this version.","sec":"why-the-plebs-seceded"},{"q":"Where was Pyrrhus killed in 272 BC?","options":["Tarentum","Argos","Syracuse","Pella"],"a":1,"level":1,"why":"Pyrrhus died fighting a different war at Argos in southern Greece. That same year, Tarentum fell to Rome.","sec":"beneventum-and-withdrawal"},{"q":"What did Rome's system of colonies, citizenship and alliances turn Italy into?","options":["A grain supplier for the Greek world","A single province under one governor","A vast reservoir of fighting men","A loose league of free kingdoms"],"a":2,"level":1,"why":"Rome's system produced a reservoir of soldiers larger than that of any other state of the time. Allies stayed independent in name but had to supply troops.","sec":"how-rome-ruled-italy"},{"q":"Where did the Samnites, Rome's toughest rivals in central Italy, come from?","options":["The island of Sicily","The Apennine mountains","The coastal plains of Etruria","The Po Valley in the north"],"a":1,"level":1,"why":"The Samnites were a warlike coalition of tribes from the Apennine mountains. Rome fought them in three Samnite Wars between 343 and 290 BC.","sec":"rome-after-the-samnite-wars"},{"q":"What does the phrase \"Pyrrhic victory\" mean?","options":["A win gained by a surprise attack","A win so costly it is almost a defeat","A win won by hired foreign troops","A win achieved with no losses at all"],"a":1,"level":1,"why":"The phrase comes from Pyrrhus, whose victories over Rome cost his army terribly. He reportedly said, \"Another such victory and we are lost!\"","sec":"heraclea-and-asculum"},{"q":"Who was the next enemy to seriously challenge Rome's control of the Italian peninsula after Pyrrhus?","options":["Spartacus","Hannibal","Philip of Macedon","Mithridates"],"a":1,"level":1,"why":"Rome's hold on Italy was not seriously challenged again until Hannibal invaded at the end of the century. Its victory over Pyrrhus had hugely boosted its standing.","sec":"beneventum-and-withdrawal"},{"q":"The Conflict of the Orders was a long struggle between which two groups in Roman society?","options":["Patricians and plebeians","Romans and Samnites","The Senate and the consuls","Latins and Etruscans"],"a":0,"level":1,"why":"For two centuries the hereditary patrician elite and the mass of ordinary plebeian citizens struggled over political rights. The Hortensian Law of 287 BC brought this conflict to a close.","sec":"lex-hortensia"},{"q":"What was the Via Appia?","options":["The Appian Way, a road south from Rome","A wall around Rome","An aqueduct","A sea route to Sicily"],"a":0,"level":1,"why":"It carried Roman armies and influence deep into the south, toward Capua.","sec":"rome-after-the-samnite-wars"},{"q":"What does Magna Graecia mean?","options":["Great Greece","Greek Sea","Old Greece","Greek Alliance"],"a":0,"level":1,"why":"It was the name for the rich Greek cities of southern Italy, such as Tarentum.","sec":"tarentum-calls-for-help"},{"q":"Why are the wars with Carthage called “Punic”?","options":["From Punici, the Romans’ name for the Carthaginians","From the Punic river in Africa","From a Carthaginian king named Punicus","From the Latin for “sea war”"],"a":0,"level":1,"why":"The Carthaginians were of Phoenician origin, and the Romans called them Punici.","sec":"italy-united-264-bc"}],"2":[{"q":"The Hortensian law banned votes on nundinae. What were they?","options":["Market days","Holy days of Jupiter","The days of the census","Days of mourning"],"a":0,"level":2,"why":"Banning votes on market days made it harder for country farmers, who came to town to trade, to vote.","sec":"why-the-plebs-seceded"},{"q":"Pyrrhus left a praesidium in Tarentum. What was it?","options":["A small garrison of his soldiers","A governor","A treaty with Rome","A fleet of ships"],"a":0,"level":2,"why":"The garrison was allowed to go home in peace when Tarentum fell in 272 BC.","sec":"beneventum-and-withdrawal"},{"q":"What were Rome’s socii?","options":["States allied to Rome that had to supply soldiers","Roman colonies in the south","The Greek cities Rome ruled directly","Rome’s enemies in Sicily"],"a":0,"level":2,"why":"They stayed independent in name but sent troops for Rome’s wars.","sec":"how-rome-ruled-italy"},{"q":"Who were most likely the organisers behind the well-crafted Hortensian Law?","options":["The patrician senators","The Latin allies","The plebeian tribunes","The two consuls","The priestly pontiffs"],"a":2,"level":2,"why":"Scholars argue such a carefully built law needed organisers, most likely the plebeian tribunes. The consuls' harsh measures also suggest real unrest in the city.","sec":"why-the-plebs-seceded"},{"q":"What happened to Tarentum in 272 BC, about two years after Pyrrhus sailed home?","options":["It became Pyrrhus's royal capital","It joined a new Samnite alliance","It was razed and its people enslaved","It fell to Rome","It was captured by Carthage"],"a":3,"level":2,"why":"Tarentum fell to Rome in 272 BC. The Epirote garrison left there was allowed to go home in peace.","sec":"beneventum-and-withdrawal"},{"q":"Rome's help to which Greek city, under attack by a Samnite-led alliance, alarmed Tarentum?","options":["Thurii","Rhegium","Sy
